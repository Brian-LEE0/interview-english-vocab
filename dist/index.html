을 하는데, 긴 한 주를 보낸 뒤 재충전하는 데 도움이 됩니다."},"collocations":["team sports","play sports","be a good sport"],"related":["support","report","transport","rapport"],"tip":"취미 질문에 바로 쓰는 단어. be a good sport = 져도 기분 좋게 받아들이는 사람"},{"id":"d04-A14","day":4,"level":2,"set":"A","family":"F4","word":"rapport","pos":"noun","ipa":"/ræˈpɔːr/","meaning_ko":"신뢰 관계, 친밀감","category":"interview","etymology":{"parts":[{"text":"rap","type":"prefix","gloss":"다시 + ~로 (re + ad)"},{"text":"port","type":"root","gloss":"나르다"}],"story":"프랑스어 rapporter '다시 가져오다' → 서로 주고받는 관계 → 마음이 통하는 관계"},"example":{"q":"How do you work with non-technical stakeholders?","a":"I build rapport by meeting them early and explaining technical issues in plain language.","a_ko":"초기에 직접 만나고 기술적인 문제를 쉬운 말로 설명하면서 신뢰 관계를 쌓습니다."},"collocations":["build rapport","good rapport with","establish rapport"],"related":["report","support","import"],"tip":"발음 주의: 끝의 t는 소리 내지 않음 /ræˈpɔːr/"},{"id":"d04-A15","day":4,"level":2,"set":"A","family":"F4","word":"omit","pos":"verb","ipa":"/oʊˈmɪt/","meaning_ko":"빼다, 생략하다","category":"interview","etymology":{"parts":[{"text":"o","type":"prefix","gloss":"떨어져 (ob)"},{"text":"mit","type":"root","gloss":"보내다"}],"story":"라틴어 omittere '떨어져 가게 내버려 두다' → 빼먹다 → 생략하다"},"example":{"q":"How do you keep your presentations short?","a":"I omit details the audience does not need and keep a backup slide in case someone asks.","a_ko":"청중에게 필요 없는 세부 내용은 빼고, 누가 물어볼 때를 대비해 예비 슬라이드를 따로 둡니다."},"collocations":["omit details","omit a step","accidentally omit"],"related":["submit","admit","emit","mission"],"tip":"leave out의 격식 있는 말. 명사는 omission"},{"id":"d04-A16","day":4,"level":2,"set":"A","family":"F4","word":"premise","pos":"noun","ipa":"/ˈpremɪs/","meaning_ko":"전제","category":"interview","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"앞에"},{"text":"mise","type":"root","gloss":"보내다 (miss)"}],"story":"중세 라틴어 praemissa '앞에 보내 둔 것' → 논리의 앞에 놓는 말 → 전제"},"example":{"q":"How do you challenge an idea in a meeting?","a":"I first check the premise, because if the starting assumption is wrong, the whole plan fails.","a_ko":"먼저 전제를 확인합니다. 출발점이 되는 가정이 틀리면 계획 전체가 무너지기 때문입니다."},"collocations":["basic premise","based on the premise that","false premise"],"related":["promise","compromise","on-premises","mission"],"tip":"복수형 premises는 '건물·부지'라는 뜻도 있어 on-premises(사내 구축)가 여기서 나옴"},{"id":"d04-A17","day":4,"level":2,"set":"A","family":"F4","word":"compromise","pos":"noun","ipa":"/ˈkɑːmprəmaɪz/","meaning_ko":"타협(안), 절충","category":"interview","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"함께"},{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"mise","type":"root","gloss":"보내다 (miss)"}],"story":"라틴어 compromissum '서로 함께 약속함(중재 결과를 따르기로)' → 서로 양보해 맞추기 → 타협"},"example":{"q":"Tell me about a disagreement with a teammate.","a":"We disagreed on the release date, so we reached a compromise and shipped the core features first.","a_ko":"출시일을 두고 의견이 달라서, 핵심 기능을 먼저 출시하는 것으로 타협했습니다."},"collocations":["reach a compromise","find a compromise","make compromises"],"related":["promise","compromised","premise","commit"],"tip":"동사로도 씀. compromise on quality(품질을 타협하다)는 부정적인 뜻"},{"id":"d04-A18","day":4,"level":2,"set":"A","family":"F4","word":"compromised","pos":"adjective","ipa":"/ˈkɑːmprəmaɪzd/","meaning_ko":"(보안이) 뚫린, 침해된","category":"it","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"함께"},{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"mis","type":"root","gloss":"보내다 (miss)"},{"text":"ed","type":"suffix","gloss":"~된"}],"story":"서로 약속하다 → 약점을 내주다 → 위험에 노출되다 → (계정·시스템이) 뚫린"},"example":{"q":"Have you ever handled a security incident?","a":"When an API key was compromised, I revoked it within minutes and rotated all related secrets.","a_ko":"API 키가 유출됐을 때 몇 분 안에 키를 폐기하고 관련된 비밀 정보를 모두 교체했습니다."},"collocations":["compromised account","be compromised","compromised credentials"],"related":["compromise","promise","permission"],"tip":"보안 사고를 말할 때 hacked보다 전문적인 표현"},{"id":"d04-A19","day":4,"level":1,"set":"A","family":"F4","word":"problem","pos":"noun","ipa":"/ˈprɑːbləm/","meaning_ko":"문제","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"blem","type":"root","gloss":"던지다 (그리스어 ballein)"}],"story":"그리스어 problēma '앞에 던져진 것' → 풀어야 할 과제 → 문제"},"example":{"q":"How do you approach a difficult task?","a":"I break a big problem into smaller parts and solve them one by one.","a_ko":"큰 문제를 작은 부분으로 나눠서 하나씩 해결합니다."},"collocations":["solve a problem","problem-solving","the root of the problem"],"related":["problematic","symbol","hyperbole","reject"],"tip":"그리스어 bol/blem(던지다)은 라틴어 ject(던지다)와 같은 뜻의 짝 어근"},{"id":"d04-A20","day":4,"level":2,"set":"A","family":"F4","word":"problematic","pos":"adjective","ipa":"/ˌprɑːbləˈmætɪk/","meaning_ko":"문제가 되는, 곤란한","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"blem","type":"root","gloss":"던지다 (그리스어 ballein)"},{"text":"atic","type":"suffix","gloss":"~한"}],"story":"앞에 던져진 것 같은 → 걸려서 골치 아픈 → 문제가 되는"},"example":{"q":"Why did you redesign the deployment process?","a":"Manual deployments became problematic as the team grew, so I automated them with a CI pipeline.","a_ko":"팀이 커지면서 수동 배포가 문제가 되어, CI 파이프라인으로 자동화했습니다."},"collocations":["become problematic","highly problematic","problematic for"],"related":["problem","symbol","hyperbole"],"tip":"'문제가 생겼다'를 차분하게 말할 때. 사람에게는 잘 쓰지 않음"},{"id":"d04-A21","day":4,"level":1,"set":"A","family":"F4","word":"symbol","pos":"noun","ipa":"/ˈsɪmbl/","meaning_ko":"기호, 심볼","category":"it","etymology":{"parts":[{"text":"sym","type":"prefix","gloss":"함께"},{"text":"bol","type":"root","gloss":"던지다 (그리스어 ballein)"}],"story":"그리스어 symbolon '함께 던져 맞춰 보는 조각(신표)' → 표시 → 기호"},"example":{"q":"How did you debug the crash in production?","a":"I loaded the debug symbols and found the exact line that caused the crash.","a_ko":"디버그 심볼을 불러와서 크래시를 일으킨 정확한 줄을 찾았습니다."},"collocations":["debug symbols","symbol table","a symbol of"],"related":["problem","hyperbole","problematic"],"tip":"디버깅의 debug symbols, 컴파일러의 symbol table로 자주 나옴"},{"id":"d04-A22","day":4,"level":3,"set":"A","family":"F4","word":"hyperbole","pos":"noun","ipa":"/haɪˈpɜːrbəli/","meaning_ko":"과장(법)","category":"interview","etymology":{"parts":[{"text":"hyper","type":"prefix","gloss":"넘어서"},{"text":"bole","type":"root","gloss":"던지다 (그리스어 ballein)"}],"story":"그리스어 hyperbolē '너머로 던지기' → 정도를 넘어선 말 → 과장"},"example":{"q":"What is the hardest project you have worked on?","a":"Without any hyperbole, the payment migration was the hardest project of my career, because we had zero tolerance for downtime.","a_ko":"과장 없이 말씀드리면, 결제 시스템 이전이 제 경력에서 가장 어려운 프로젝트였습니다. 다운타임이 전혀 허용되지 않았기 때문입니다."},"collocations":["without hyperbole","it is no hyperbole to say","marketing hyperbole"],"related":["problem","symbol","exaggerate"],"tip":"발음 주의: '하이퍼볼'이 아니라 /haɪˈpɜːrbəli/ (하이퍼-벌리)"},{"id":"d04-A23","day":4,"level":3,"set":"A","family":"F4","word":"semaphore","pos":"noun","ipa":"/ˈseməfɔːr/","meaning_ko":"세마포어(동시 접근 수를 제한하는 장치)","category":"it","etymology":{"parts":[{"text":"sema","type":"root","gloss":"신호 (그리스어 sēma)"},{"text":"phore","type":"root","gloss":"나르는 것 (그리스어 pherein)"}],"story":"신호를 나르는 것 → 깃발 신호기 → 동시에 들어갈 수 있는 수를 신호로 제어하는 장치"},"example":{"q":"How did you handle the rate limit of the external API?","a":"I used a semaphore to cap concurrent requests at ten, which kept us under the rate limit without slowing the batch job much.","a_ko":"세마포어로 동시 요청을 10개로 제한해서, 배치 작업을 크게 늦추지 않고도 호출 제한 안에 머물렀습니다."},"collocations":["acquire a semaphore","release a semaphore","binary semaphore"],"related":["peripheral","metaphor","prefer"],"tip":"그리스어 pher/phor(나르다)는 라틴어 fer(나르다)와 뿌리가 같음. mutex는 1개, semaphore는 N개까지 허용"},{"id":"d04-A24","day":4,"level":2,"set":"A","family":"F4","word":"loop in","pos":"phrasal verb","ipa":"/ˌluːp ˈɪn/","meaning_ko":"(논의·메일에) 끼워 넣다, 포함시키다","category":"interview","etymology":{"parts":[{"text":"loop","type":"part","gloss":"고리"},{"text":"in","type":"part","gloss":"안으로"}],"story":"고리 안으로 넣다 → 대화·메일의 흐름에 포함시키다"},"example":{"q":"How do you keep stakeholders informed?","a":"I loop in product managers early on design changes, so there are no surprises at review time.","a_ko":"설계가 바뀌면 기획자를 초기에 논의에 포함시켜서, 리뷰 때 놀랄 일이 없게 합니다."},"collocations":["loop someone in","keep someone in the loop","loop in the team"],"related":["check in","reach out","get back to"],"tip":"keep me in the loop = 진행 상황을 계속 공유해 달라. 메일에 CC로 넣을 때도 씀"},{"id":"d04-A25","day":4,"level":2,"set":"A","family":"F4","word":"walk through","pos":"phrasal verb","ipa":"/ˌwɔːk ˈθruː/","meaning_ko":"차근차근 설명하다","category":"interview","etymology":{"parts":[{"text":"walk","type":"part","gloss":"걷다"},{"text":"through","type":"part","gloss":"처음부터 끝까지"}],"story":"처음부터 끝까지 함께 걸어가다 → 한 단계씩 짚으며 설명하다"},"example":{"q":"Can you walk me through a project you are proud of?","a":"Sure, let me walk you through how I redesigned our search service, from the problem to the final results.","a_ko":"네, 검색 서비스를 다시 설계한 과정을 문제부터 최종 결과까지 차근차근 설명드리겠습니다."},"collocations":["walk someone through","walk through the code","a quick walk-through"],"related":["point out","bring up","check in"],"tip":"면접관이 Walk me through ~ 로 자주 물어봄. 명사는 walk-through"},{"id":"d04-B01","day":4,"level":1,"set":"B","family":"F4","word":"submit","pos":"verb","ipa":"/səbˈmɪt/","meaning_ko":"제출하다","category":"interview","etymology":{"parts":[{"text":"sub","type":"prefix","gloss":"아래로"},{"text":"mit","type":"root","gloss":"보내다"}],"story":"아래로 보내다(맡기다) → 판단을 받도록 내놓다 → 제출하다"},"example":{"q":"When can you complete the take-home assignment?","a":"I can submit the assignment by Friday, including a short README.","a_ko":"금요일까지 간단한 README를 포함해서 과제를 제출할 수 있습니다."},"collocations":["submit an application","submit a pull request","submit feedback"],"related":["submission","commit","permit","admit","mission"],"tip":"send보다 공식적인 '제출'. 개발에서는 submit a PR(풀 리퀘스트 올리기)"},{"id":"d04-B02","day":4,"level":2,"set":"B","family":"F4","word":"submission","pos":"noun","ipa":"/səbˈmɪʃn/","meaning_ko":"제출(물)","category":"it","etymology":{"parts":[{"text":"sub","type":"prefix","gloss":"아래로"},{"text":"miss","type":"root","gloss":"보내다"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"아래로 보낸 것 → 제출한 것"},"example":{"q":"How do code reviews work on your team?","a":"Every code submission must pass automated tests before a reviewer looks at it, which saves everyone time.","a_ko":"모든 코드 제출물은 리뷰어가 보기 전에 자동 테스트를 통과해야 해서, 모두의 시간을 아낄 수 있습니다."},"collocations":["code submission","submission deadline","form submission"],"related":["submit","mission","permission","transmission"],"tip":"'복종'이라는 뜻도 있지만 IT·면접에서는 '제출'로 씀"},{"id":"d04-B03","day":4,"level":1,"set":"B","family":"F4","word":"commit","pos":"verb","ipa":"/kəˈmɪt/","meaning_ko":"커밋하다, (commit to) 전념하다","category":"it","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"함께, 완전히"},{"text":"mit","type":"root","gloss":"보내다"}],"story":"라틴어 committere '함께 보내다, 맡기다' → 맡기고 확정하다 → 변경을 확정해 저장하다"},"example":{"q":"How often do you commit your code?","a":"I commit small changes often, so each commit is easy to review.","a_ko":"작은 변경을 자주 커밋해서, 커밋 하나하나를 리뷰하기 쉽게 합니다."},"collocations":["commit changes","commit to","commit message"],"related":["commitment","submit","mission","permit"],"tip":"깃에서는 '확정 저장'. commit to + 명사/동명사 = ~에 전념하다(면접용)"},{"id":"d04-B04","day":4,"level":2,"set":"B","family":"F4","word":"commitment","pos":"noun","ipa":"/kəˈmɪtmənt/","meaning_ko":"헌신, 약속","category":"interview","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"함께, 완전히"},{"text":"mit","type":"root","gloss":"보내다"},{"text":"ment","type":"suffix","gloss":"~하는 것"}],"story":"자신을 맡겨 보냄 → 맡은 일에 묶임 → 헌신·약속"},"example":{"q":"Why should we hire you?","a":"I bring a strong commitment to quality, and I always follow through on what I promise my team.","a_ko":"품질에 대한 책임감이 강하고, 팀에 약속한 일은 반드시 끝까지 해냅니다."},"collocations":["commitment to","make a commitment","long-term commitment"],"related":["commit","submit","promise","mission"],"tip":"철자 주의: commitment는 t가 하나, committed는 t가 둘"},{"id":"d04-B05","day":4,"level":1,"set":"B","family":"F4","word":"mission","pos":"noun","ipa":"/ˈmɪʃn/","meaning_ko":"사명, 임무","category":"interview","etymology":{"parts":[{"text":"miss","type":"root","gloss":"보내다"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"보내는 일 → 보내져서 맡은 일 → 사명"},"example":{"q":"Why do you want to join our company?","a":"Your mission to make healthcare data accessible really speaks to me.","a_ko":"의료 데이터를 누구나 쓸 수 있게 하겠다는 귀사의 사명에 크게 공감합니다."},"collocations":["company mission","mission statement","on a mission to"],"related":["mission-critical","submit","permission","message"],"tip":"지원 동기에서 회사의 mission에 공감한다고 말하면 자연스러움"},{"id":"d04-B06","day":4,"level":3,"set":"B","family":"F4","word":"mission-critical","pos":"adjective","ipa":"/ˌmɪʃn ˈkrɪtɪkl/","meaning_ko":"업무에 필수적인(멈추면 안 되는)","category":"it","etymology":{"parts":[{"text":"miss","type":"root","gloss":"보내다"},{"text":"ion","type":"suffix","gloss":"~하는 것"},{"text":"critical","type":"part","gloss":"결정적인"}],"story":"임무 수행에 결정적인 → 멈추면 사업이 멈추는"},"example":{"q":"What kind of systems have you supported in production?","a":"I was on call for a mission-critical payment system, so I focused on monitoring and fast rollback before adding new features.","a_ko":"멈추면 안 되는 결제 시스템의 온콜을 맡았기 때문에, 새 기능보다 모니터링과 빠른 롤백을 우선했습니다."},"collocations":["mission-critical system","mission-critical workload","mission-critical data"],"related":["mission","permission","commit"],"tip":"important보다 '이게 멈추면 사업이 멈춘다'는 강한 뉘앙스"},{"id":"d04-B07","day":4,"level":1,"set":"B","family":"F4","word":"permit","pos":"verb","ipa":"/pərˈmɪt/","meaning_ko":"허락하다, 가능하게 하다","category":"interview","etymology":{"parts":[{"text":"per","type":"prefix","gloss":"통과하여"},{"text":"mit","type":"root","gloss":"보내다"}],"story":"통과해 보내 주다 → 지나가게 허락하다"},"example":{"q":"Do you have any questions for us?","a":"If time permits, I would love to hear about your team's roadmap.","a_ko":"시간이 허락한다면 팀의 로드맵에 대해 듣고 싶습니다."},"collocations":["if time permits","permit someone to","work permit"],"related":["permission","submit","admit","emit"],"tip":"if time permits는 면접 끝 질문 시간에 바로 쓸 수 있는 표현. 명사 PER-mit은 '허가증'"},{"id":"d04-B08","day":4,"level":1,"set":"B","family":"F4","word":"permission","pos":"noun","ipa":"/pərˈmɪʃn/","meaning_ko":"권한, 허락","category":"it","etymology":{"parts":[{"text":"per","type":"prefix","gloss":"통과하여"},{"text":"miss","type":"root","gloss":"보내다"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"통과해 보내 줌 → 허락 → 접근 권한"},"example":{"q":"How do you protect sensitive data?","a":"I give each service only the permissions it needs, and nothing more.","a_ko":"각 서비스에 꼭 필요한 권한만 주고, 그 이상은 주지 않습니다."},"collocations":["access permissions","grant permission","read-only permission"],"related":["permit","submission","mission"],"tip":"최소 권한 원칙은 principle of least privilege"},{"id":"d04-B09","day":4,"level":1,"set":"B","family":"F4","word":"admit","pos":"verb","ipa":"/ədˈmɪt/","meaning_ko":"인정하다","category":"interview","etymology":{"parts":[{"text":"ad","type":"prefix","gloss":"~로"},{"text":"mit","type":"root","gloss":"보내다"}],"story":"안으로 들여보내다 → 받아들이다 → (사실을) 인정하다"},"example":{"q":"What is your biggest weakness?","a":"I admit that I used to say yes to too many tasks at once.","a_ko":"예전에는 한꺼번에 너무 많은 일을 맡겠다고 했다는 점을 인정합니다."},"collocations":["admit a mistake","I have to admit","admit that"],"related":["admittedly","submit","permit","commit"],"tip":"약점 질문에서 솔직함을 보여 줄 때. admit + -ing도 가능(admit making a mistake)"},{"id":"d04-B10","day":4,"level":2,"set":"B","family":"F4","word":"admittedly","pos":"adverb","ipa":"/ədˈmɪtɪdli/","meaning_ko":"솔직히 말하면, 인정하건대","category":"interview","etymology":{"parts":[{"text":"ad","type":"prefix","gloss":"~로"},{"text":"mitt","type":"root","gloss":"보내다 (mit)"},{"text":"ed","type":"suffix","gloss":"~된"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"인정된 대로 → 솔직히 인정하자면"},"example":{"q":"How comfortable are you with frontend work?","a":"Admittedly, frontend is not my strongest area, but I have shipped several React features on my own.","a_ko":"솔직히 프런트엔드가 제 가장 강한 분야는 아니지만, React 기능을 혼자서 여러 개 출시해 봤습니다."},"collocations":["admittedly small","although admittedly","admittedly, I"],"related":["admit","commit","permit"],"tip":"약점을 먼저 인정하고 but으로 강점을 붙이는 답변 구조에 딱 맞음"},{"id":"d04-B11","day":4,"level":1,"set":"B","family":"F4","word":"promise","pos":"verb","ipa":"/ˈprɑːmɪs/","meaning_ko":"약속하다","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"mise","type":"root","gloss":"보내다 (miss)"}],"story":"라틴어 promittere '앞으로 내보내다' → 미리 말해 두다 → 약속하다"},"example":{"q":"How do you manage deadlines?","a":"I never promise a date until I understand the full scope of the work.","a_ko":"작업 범위를 전부 파악하기 전에는 날짜를 약속하지 않습니다."},"collocations":["keep a promise","promise to","over-promise"],"related":["promising","compromise","premise","commit"],"tip":"under-promise and over-deliver(약속은 적게, 결과는 크게)도 알아 두면 좋음"},{"id":"d04-B12","day":4,"level":1,"set":"B","family":"F4","word":"promising","pos":"adjective","ipa":"/ˈprɑːmɪsɪŋ/","meaning_ko":"유망한, 가능성 있는","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"mis","type":"root","gloss":"보내다 (miss)"},{"text":"ing","type":"suffix","gloss":"~하는"}],"story":"앞날을 약속하는 → 기대되는 → 유망한"},"example":{"q":"How did the first test go?","a":"The early results were promising, so we expanded the test to all users.","a_ko":"초기 결과가 좋아서 테스트를 전체 사용자로 넓혔습니다."},"collocations":["promising results","a promising start","look promising"],"related":["promise","compromise","premise"],"tip":"결과를 과장 없이 긍정적으로 말할 때 좋음"},{"id":"d04-B13","day":4,"level":1,"set":"B","family":"F4","word":"message","pos":"noun","ipa":"/ˈmesɪdʒ/","meaning_ko":"메시지, 전하려는 요지","category":"interview","etymology":{"parts":[{"text":"mess","type":"root","gloss":"보내다 (miss)"},{"text":"age","type":"suffix","gloss":"~것"}],"story":"중세 라틴어 missaticum '보낸 것' → 전하는 말 → 메시지"},"example":{"q":"How do you explain technical issues to executives?","a":"I keep one clear message per slide and save the details for questions.","a_ko":"슬라이드마다 분명한 메시지를 하나만 두고, 세부 내용은 질문을 받을 때 설명합니다."},"collocations":["key message","get the message across","send a message"],"related":["messaging","mission","submit"],"tip":"발음 /ˈmesɪdʒ/ — '메시지'보다 '메시쥐'에 가까움"},{"id":"d04-B14","day":4,"level":1,"set":"B","family":"F4","word":"messaging","pos":"noun","ipa":"/ˈmesɪdʒɪŋ/","meaning_ko":"메시징(시스템 간 메시지 전달)","category":"it","etymology":{"parts":[{"text":"mess","type":"root","gloss":"보내다 (miss)"},{"text":"ag","type":"suffix","gloss":"~것 (age)"},{"text":"ing","type":"suffix","gloss":"~하기"}],"story":"메시지를 보내기 → 시스템끼리 메시지를 주고받는 구조"},"example":{"q":"How do your services communicate?","a":"Our services talk through a messaging system like Kafka instead of direct calls.","a_ko":"서비스끼리 직접 호출하지 않고 Kafka 같은 메시징 시스템을 통해 통신합니다."},"collocations":["messaging system","messaging platform","asynchronous messaging"],"related":["message","emit","transmit"],"tip":"message queue(MQ)와 함께 비동기 구조를 설명할 때 씀"},{"id":"d04-B15","day":4,"level":2,"set":"B","family":"F4","word":"emit","pos":"verb","ipa":"/iˈmɪt/","meaning_ko":"(이벤트·로그를) 내보내다, 발생시키다","category":"it","etymology":{"parts":[{"text":"e","type":"prefix","gloss":"밖으로 (ex)"},{"text":"mit","type":"root","gloss":"보내다"}],"story":"밖으로 보내다 → 빛·소리를 내다 → 이벤트·지표를 내보내다"},"example":{"q":"How do you monitor your services?","a":"Each service emits metrics and structured logs, so we can trace a problem across the system quickly.","a_ko":"각 서비스가 지표와 구조화된 로그를 내보내서, 시스템 전체에서 문제를 빠르게 추적할 수 있습니다."},"collocations":["emit events","emit metrics","emit a signal"],"related":["transmit","submit","messaging"],"tip":"이벤트 기반 코드(emit an event)와 모니터링에서 자주 나옴"},{"id":"d04-B16","day":4,"level":2,"set":"B","family":"F4","word":"transmit","pos":"verb","ipa":"/trænzˈmɪt/","meaning_ko":"전송하다","category":"it","etymology":{"parts":[{"text":"trans","type":"prefix","gloss":"건너서"},{"text":"mit","type":"root","gloss":"보내다"}],"story":"건너편으로 보내다 → 전송하다"},"example":{"q":"How did you secure the data between the app and the server?","a":"All data is encrypted with TLS before we transmit it, so it cannot be read in transit.","a_ko":"모든 데이터는 전송 전에 TLS로 암호화해서, 전송 중에 다른 사람이 읽을 수 없습니다."},"collocations":["transmit data","transmit securely","transmit over the network"],"related":["transmission","emit","submit","transport"],"tip":"send의 기술적인 표현. in transit(전송 중)과 함께 기억"},{"id":"d04-B17","day":4,"level":2,"set":"B","family":"F4","word":"transmission","pos":"noun","ipa":"/trænzˈmɪʃn/","meaning_ko":"전송","category":"it","etymology":{"parts":[{"text":"trans","type":"prefix","gloss":"건너서"},{"text":"miss","type":"root","gloss":"보내다"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"건너편으로 보내는 일 → 전송"},"example":{"q":"How did you reduce mobile data usage?","a":"I compressed the images before transmission, which cut data usage by about forty percent.","a_ko":"전송 전에 이미지를 압축해서 데이터 사용량을 약 40% 줄였습니다."},"collocations":["data transmission","transmission error","during transmission"],"related":["transmit","submission","permission"],"tip":"자동차의 '변속기'도 transmission — 동력을 건너 보내는 장치"},{"id":"d04-B18","day":4,"level":2,"set":"B","family":"F4","word":"dismiss","pos":"verb","ipa":"/dɪsˈmɪs/","meaning_ko":"묵살하다, 일축하다","category":"interview","etymology":{"parts":[{"text":"dis","type":"prefix","gloss":"떨어져"},{"text":"miss","type":"root","gloss":"보내다"}],"story":"멀리 보내 버리다 → 내쫓다 → 의견을 무시하다"},"example":{"q":"How do you handle feedback you disagree with?","a":"I try not to dismiss feedback right away, because there is often a useful point behind it.","a_ko":"피드백을 바로 일축하지 않으려고 합니다. 그 뒤에 유용한 지적이 숨어 있는 경우가 많기 때문입니다."},"collocations":["dismiss an idea","dismiss concerns","be dismissed"],"related":["dismissive","mission","submit","admit"],"tip":"'해고하다'라는 뜻도 있으니 문맥 주의"},{"id":"d04-B19","day":4,"level":2,"set":"B","family":"F4","word":"dismissive","pos":"adjective","ipa":"/dɪsˈmɪsɪv/","meaning_ko":"무시하는, 대수롭지 않게 여기는","category":"interview","etymology":{"parts":[{"text":"dis","type":"prefix","gloss":"떨어져"},{"text":"miss","type":"root","gloss":"보내다"},{"text":"ive","type":"suffix","gloss":"~하는"}],"story":"멀리 보내 버리는 → 대수롭지 않게 여기는"},"example":{"q":"What did you learn in your first year as an engineer?","a":"Early on, I was a bit dismissive of testing, but a production bug quickly changed my mind.","a_ko":"초반에는 테스트를 좀 대수롭지 않게 여겼는데, 운영 환경에서 버그를 겪고 금방 생각이 바뀌었습니다."},"collocations":["dismissive of","dismissive attitude","sound dismissive"],"related":["dismiss","mission","admittedly"],"tip":"be dismissive of ~ 형태로 씀. 예전 태도를 반성하는 답변에 쓰기 좋음"},{"id":"d04-B20","day":4,"level":2,"set":"B","family":"F4","word":"on-premises","pos":"adjective","ipa":"/ˌɑːn ˈpremɪsɪz/","meaning_ko":"온프레미스(사내 서버에 직접 구축한)","category":"it","etymology":{"parts":[{"text":"on","type":"part","gloss":"~에서"},{"text":"pre","type":"prefix","gloss":"앞에"},{"text":"mis","type":"root","gloss":"보내다 (miss)"},{"text":"es","type":"suffix","gloss":"복수"}],"story":"앞에 보내 둔(앞서 말한) 것 → 법률 문서의 '앞서 말한 부동산' → 건물·부지 → 회사 건물 안의 서버에서"},"example":{"q":"Have you worked on cloud migrations?","a":"Yes, I helped move our on-premises databases to AWS, which cut our hardware costs significantly.","a_ko":"네, 사내에 구축된 데이터베이스를 AWS로 옮기는 일을 도왔고, 하드웨어 비용을 크게 줄였습니다."},"collocations":["on-premises servers","on-premises to cloud","on-premises deployment"],"related":["premise","decommission","mission"],"tip":"흔히 on-prem으로 줄여 말함. on-premise도 많이 쓰지만 엄밀히는 premises가 맞음"},{"id":"d04-B21","day":4,"level":2,"set":"B","family":"F4","word":"decommission","pos":"verb","ipa":"/ˌdiːkəˈmɪʃn/","meaning_ko":"(시스템을) 폐기하다, 운영 종료하다","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"해제, 반대로"},{"text":"com","type":"prefix","gloss":"함께, 완전히"},{"text":"miss","type":"root","gloss":"보내다"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"commission '임무를 맡김'(com + mittere) + de '해제' → 맡긴 임무를 거두다 → 운영을 끝내다"},"example":{"q":"What happened to the old system after the migration?","a":"After two weeks of parallel running, we decommissioned the old servers and saved on licensing costs.","a_ko":"2주 동안 병행 운영한 뒤 기존 서버를 폐기해서 라이선스 비용을 절감했습니다."},"collocations":["decommission a server","decommission legacy systems","be decommissioned"],"related":["mission","commit","permission","on-premises"],"tip":"shut down보다 '계획적으로 운영을 끝내고 정리한다'는 뜻"},{"id":"d04-B22","day":4,"level":3,"set":"B","family":"F4","word":"remit","pos":"noun","ipa":"/ˈriːmɪt/","meaning_ko":"(맡은) 업무 범위, 권한","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤로, 도로"},{"text":"mit","type":"root","gloss":"보내다"}],"story":"라틴어 remittere '돌려보내다' → 안건을 담당자에게 넘기다 → 넘겨받아 맡은 범위"},"example":{"q":"How much ownership did you take in that role?","a":"Infrastructure costs were officially outside my remit, but I noticed waste, raised it with my manager, and we cut the bill by twenty percent.","a_ko":"인프라 비용은 공식적으로 제 업무 범위 밖이었지만, 낭비를 발견해 매니저에게 알렸고 결국 비용을 20% 줄였습니다."},"collocations":["within my remit","outside my remit","broad remit"],"related":["submit","commit","permit","admit"],"tip":"주로 영국식 격식체. 미국에서는 scope나 responsibilities가 더 흔함"},{"id":"d04-B23","day":4,"level":1,"set":"B","family":"F4","word":"get back to","pos":"phrasal verb","ipa":"/ˌɡet ˈbæk tuː/","meaning_ko":"(확인 후) 다시 연락하다, 다시 답하다","category":"interview","etymology":{"parts":[{"text":"get","type":"part","gloss":"가다, 되다"},{"text":"back","type":"part","gloss":"되돌아"},{"text":"to","type":"part","gloss":"~에게"}],"story":"~에게 되돌아가다 → 확인한 뒤 다시 연락하다"},"example":{"q":"When would you be able to start?","a":"Let me check my notice period and get back to you by tomorrow.","a_ko":"퇴사 통보 기간을 확인하고 내일까지 다시 말씀드리겠습니다."},"collocations":["get back to you","get back to someone on","get back to work"],"related":["check in","reach out","loop in"],"tip":"바로 답하기 어려운 질문에는 얼버무리지 말고 Let me get back to you on that."},{"id":"d04-B24","day":4,"level":1,"set":"B","family":"F4","word":"speak up","pos":"phrasal verb","ipa":"/ˌspiːk ˈʌp/","meaning_ko":"(숨기지 않고) 의견을 말하다","category":"interview","etymology":{"parts":[{"text":"speak","type":"part","gloss":"말하다"},{"text":"up","type":"part","gloss":"위로, 드러나게"}],"story":"소리를 높여 말하다 → 숨기지 않고 의견을 내다"},"example":{"q":"What do you do when you see a risk in a plan?","a":"I speak up early, even if I am the most junior person in the room.","a_ko":"그 자리에서 제가 가장 주니어라도 일찍 의견을 말합니다."},"collocations":["speak up about","speak up in meetings","feel safe to speak up"],"related":["point out","bring up","push back"],"tip":"Could you speak up? 는 '조금 크게 말씀해 주시겠어요?'라는 뜻"},{"id":"d04-B25","day":4,"level":1,"set":"B","family":"F4","word":"check in","pos":"phrasal verb","ipa":"/ˌtʃek ˈɪn/","meaning_ko":"(진행 상황을) 확인하다, 잠깐 이야기 나누다","category":"interview","etymology":{"parts":[{"text":"check","type":"part","gloss":"확인하다"},{"text":"in","type":"part","gloss":"안으로, 들러서"}],"story":"들러서 확인하다 → 상대에게 잠깐 연락해 진행 상황을 확인하다"},"example":{"q":"How do you support a teammate who is struggling?","a":"I check in with them every morning and offer to pair on the hardest part.","a_ko":"매일 아침 상황을 물어보고, 가장 어려운 부분은 같이 작업하자고 제안합니다."},"collocations":["check in with","a quick check-in","weekly check-in"],"related":["reach out","get back to","loop in"],"tip":"명사는 하이픈: a weekly check-in(주간 점검 미팅). 호텔 '체크인'과 같은 말"},{"id":"d04-C01","day":4,"level":1,"set":"C","family":"F4","word":"prefer","pos":"verb","ipa":"/prɪˈfɜːr/","meaning_ko":"더 좋아하다, 선호하다","category":"interview","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"앞에"},{"text":"fer","type":"root","gloss":"나르다"}],"story":"앞으로 날라 놓다 → 먼저 두다 → 더 좋아하다"},"example":{"q":"Do you prefer working alone or in a team?","a":"I prefer working in a team, but I am comfortable working alone too.","a_ko":"팀으로 일하는 것을 더 좋아하지만, 혼자 일하는 것도 편합니다."},"collocations":["prefer A to B","prefer to work","would prefer"],"related":["preference","refer","conference","suffer"],"tip":"강세가 뒤에(pre-FER). 'A보다 B'는 than이 아니라 prefer A to B"},{"id":"d04-C02","day":4,"level":2,"set":"C","family":"F4","word":"preference","pos":"noun","ipa":"/ˈprefrəns/","meaning_ko":"선호(하는 것)","category":"interview","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"앞에"},{"text":"fer","type":"root","gloss":"나르다"},{"text":"ence","type":"suffix","gloss":"~함"}],"story":"앞에 두는 것 → 더 좋아하는 것 → 선호"},"example":{"q":"Do you have a preference between remote and office work?","a":"My preference is a hybrid setup, because I focus best at home but value in-person design discussions.","a_ko":"재택과 출근을 섞는 방식을 선호합니다. 집에서 가장 집중이 잘 되지만, 대면 설계 논의도 중요하게 생각하기 때문입니다."},"collocations":["have a preference for","personal preference","user preferences"],"related":["prefer","reference","difference","inference"],"tip":"강세가 앞으로 이동: pre-FER → PREF-er-ence"},{"id":"d04-C03","day":4,"level":1,"set":"C","family":"F4","word":"refer","pos":"verb","ipa":"/rɪˈfɜːr/","meaning_ko":"참고하다, 언급하다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤로, 도로"},{"text":"fer","type":"root","gloss":"나르다"}],"story":"도로 날라 가다 → (자료·사람에게) 가져가 맡기다 → 참고하다·언급하다"},"example":{"q":"How do you keep track of all the details of the system?","a":"I do not memorize everything; I refer to our design docs when I need details.","a_ko":"전부 외우지는 않고, 세부 내용이 필요할 때 설계 문서를 참고합니다."},"collocations":["refer to","refer someone to","as referred to"],"related":["reference","prefer","conference","difference"],"tip":"refer to + 대상. 강세 re-FER"},{"id":"d04-C04","day":4,"level":1,"set":"C","family":"F4","word":"reference","pos":"noun","ipa":"/ˈrefrəns/","meaning_ko":"추천인, 참고(자료)","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤로, 도로"},{"text":"fer","type":"root","gloss":"나르다"},{"text":"ence","type":"suffix","gloss":"~함"}],"story":"도로 날라 가 맡김 → 확인을 맡기는 사람·자료 → 추천인·참고"},"example":{"q":"Can you provide references?","a":"Yes, my former team lead is happy to be a reference for me.","a_ko":"네, 이전 팀장님께서 기꺼이 추천인이 되어 주시기로 했습니다."},"collocations":["reference check","provide references","for reference"],"related":["refer","preference","inference"],"tip":"채용 마지막 단계의 reference check(평판 조회)에 꼭 나옴"},{"id":"d04-C05","day":4,"level":1,"set":"C","family":"F4","word":"difference","pos":"noun","ipa":"/ˈdɪfrəns/","meaning_ko":"차이","category":"interview","etymology":{"parts":[{"text":"dif","type":"prefix","gloss":"떨어져 (dis)"},{"text":"fer","type":"root","gloss":"나르다"},{"text":"ence","type":"suffix","gloss":"~함"}],"story":"따로따로 날라 가다 → 서로 떨어짐 → 차이"},"example":{"q":"Why do you enjoy working on developer tools?","a":"I like seeing how small tools make a big difference in daily work.","a_ko":"작은 도구가 일상 업무에 큰 차이를 만드는 걸 보는 게 좋습니다."},"collocations":["make a difference","the difference between","key difference"],"related":["differentiate","prefer","refer","conference"],"tip":"make a difference는 지원 동기·성과 설명의 단골 표현"},{"id":"d04-C06","day":4,"level":2,"set":"C","family":"F4","word":"differentiate","pos":"verb","ipa":"/ˌdɪfəˈrenʃieɪt/","meaning_ko":"차별화하다, 구별하다","category":"interview","etymology":{"parts":[{"text":"dif","type":"prefix","gloss":"떨어져 (dis)"},{"text":"fer","type":"root","gloss":"나르다"},{"text":"ent","type":"suffix","gloss":"~하는"},{"text":"iate","type":"suffix","gloss":"~하게 하다"}],"story":"떨어져 나르는 → 다른 → 다르게 만들다 → 차별화하다"},"example":{"q":"What makes you different from other candidates?","a":"I think what differentiates me is that I have worked on both the backend and the data pipeline.","a_ko":"백엔드와 데이터 파이프라인을 모두 다뤄 봤다는 점이 저를 차별화한다고 생각합니다."},"collocations":["differentiate between","differentiate yourself","differentiate from"],"related":["difference","prefer","inference"],"tip":"'다른 지원자와의 차이' 질문의 답을 시작할 때 좋음. 명사 differentiator(차별점)"},{"id":"d04-C07","day":4,"level":1,"set":"C","family":"F4","word":"conference","pos":"noun","ipa":"/ˈkɑːnfərəns/","meaning_ko":"콘퍼런스, 회의","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"fer","type":"root","gloss":"나르다"},{"text":"ence","type":"suffix","gloss":"~함"}],"story":"함께 날라 와 모으다 → 의견을 모으는 자리 → 회의·학회"},"example":{"q":"How do you keep your skills up to date?","a":"I attend one tech conference a year and share what I learn with my team.","a_ko":"1년에 한 번 기술 콘퍼런스에 참석하고, 배운 내용을 팀과 공유합니다."},"collocations":["attend a conference","conference call","give a talk at a conference"],"related":["prefer","refer","difference","inference"],"tip":"conference call은 '다자간 전화 회의'"},{"id":"d04-C08","day":4,"level":1,"set":"C","family":"F4","word":"suffer","pos":"verb","ipa":"/ˈsʌfər/","meaning_ko":"(질·성과가) 나빠지다, 겪다","category":"interview","etymology":{"parts":[{"text":"suf","type":"prefix","gloss":"아래에서 (sub)"},{"text":"fer","type":"root","gloss":"나르다"}],"story":"아래에서 짊어지다 → 견디다 → 손해를 겪다"},"example":{"q":"What happens when a team grows too fast?","a":"Code quality can suffer if we skip reviews to move faster.","a_ko":"더 빨리 가려고 리뷰를 건너뛰면 코드 품질이 나빠질 수 있습니다."},"collocations":["quality suffers","suffer from","performance suffered"],"related":["prefer","refer","conference"],"tip":"면접에서는 '고통받다'보다 '(품질·성과가) 나빠지다'로 많이 씀"},{"id":"d04-C09","day":4,"level":2,"set":"C","family":"F4","word":"infer","pos":"verb","ipa":"/ɪnˈfɜːr/","meaning_ko":"추론하다","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안으로"},{"text":"fer","type":"root","gloss":"나르다"}],"story":"안으로 날라 오다 → 결론을 끌어오다 → 추론하다"},"example":{"q":"Why do you like TypeScript?","a":"TypeScript can infer most types on its own, so we get safety without writing types everywhere.","a_ko":"TypeScript는 대부분의 타입을 스스로 추론해서, 모든 곳에 타입을 쓰지 않아도 안정성을 얻을 수 있습니다."},"collocations":["infer from","type inference","infer that"],"related":["inference","refer","prefer","conference"],"tip":"imply(넌지시 말하다)는 말하는 쪽, infer(추론하다)는 듣는 쪽"},{"id":"d04-C10","day":4,"level":2,"set":"C","family":"F4","word":"inference","pos":"noun","ipa":"/ˈɪnfərəns/","meaning_ko":"추론(학습된 모델로 예측하기)","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안으로"},{"text":"fer","type":"root","gloss":"나르다"},{"text":"ence","type":"suffix","gloss":"~함"}],"story":"안으로 날라 온 결론 → 추론 → (ML) 모델로 결과를 내는 단계"},"example":{"q":"Have you worked with machine learning models?","a":"Yes, I optimized model inference on GPUs and reduced response time from two seconds to three hundred milliseconds.","a_ko":"네, GPU에서 모델 추론을 최적화해서 응답 시간을 2초에서 300밀리초로 줄였습니다."},"collocations":["model inference","inference cost","real-time inference"],"related":["infer","reference","preference"],"tip":"ML에서 training(학습)과 짝을 이루는 단계. inference server, inference latency"},{"id":"d04-C11","day":4,"level":3,"set":"C","family":"F4","word":"proliferation","pos":"noun","ipa":"/prəˌlɪfəˈreɪʃn/","meaning_ko":"급증, 난립","category":"it","etymology":{"parts":[{"text":"proli","type":"root","gloss":"자손 (라틴어 proles)"},{"text":"fer","type":"root","gloss":"나르다, 낳다"},{"text":"ation","type":"suffix","gloss":"~하는 것"}],"story":"자손을 낳다 → 마구 불어나다 → 급증·난립"},"example":{"q":"What problems did you see with microservices?","a":"We had a proliferation of small services with no clear owners, so I led an effort to merge them into fewer, well-owned services.","a_ko":"담당자가 분명하지 않은 작은 서비스들이 난립해서, 제가 주도해 담당이 명확한 소수의 서비스로 통합했습니다."},"collocations":["proliferation of tools","rapid proliferation","prevent the proliferation"],"related":["prefer","infer","conference","suffer"],"tip":"'좋지 않게 마구 늘어남'의 뉘앙스. 동사는 proliferate"},{"id":"d04-C12","day":4,"level":3,"set":"C","family":"F4","word":"elated","pos":"adjective","ipa":"/iˈleɪtɪd/","meaning_ko":"몹시 기쁜, 들뜬","category":"interview","etymology":{"parts":[{"text":"e","type":"prefix","gloss":"밖으로, 위로 (ex)"},{"text":"lat","type":"root","gloss":"나르다 (ferre의 과거분사 latus)"},{"text":"ed","type":"suffix","gloss":"~된"}],"story":"라틴어 elatus '들어 올려진' → 기분이 붕 떠오른 → 몹시 기쁜"},"example":{"q":"Tell me about a moment you were proud of at work.","a":"When our app finally passed the load test after three failed attempts, the whole team was elated, and we celebrated with a small demo day.","a_ko":"세 번 실패한 끝에 앱이 부하 테스트를 통과했을 때 팀 전체가 정말 기뻐했고, 작은 데모 데이를 열어 축하했습니다."},"collocations":["be elated","elated about","elated to hear"],"related":["collate","correlation","ablation","relate"],"tip":"happy보다 훨씬 강한 기쁨. 성과 스토리의 마무리에 쓰기 좋음"},{"id":"d04-C13","day":4,"level":2,"set":"C","family":"F4","word":"collate","pos":"verb","ipa":"/kəˈleɪt/","meaning_ko":"취합하다, 대조하다","category":"it","etymology":{"parts":[{"text":"col","type":"prefix","gloss":"함께 (com)"},{"text":"lat","type":"root","gloss":"나르다 (latus)"},{"text":"e","type":"suffix","gloss":"동사 어미"}],"story":"라틴어 collatus '함께 날라 온' → 모아서 맞춰 보다 → 취합하다"},"example":{"q":"How did you prepare the quarterly incident review?","a":"I collated data from our monitoring and ticket systems, so we could see which issues kept coming back.","a_ko":"모니터링 시스템과 티켓 시스템의 데이터를 취합해서, 어떤 문제가 반복되는지 볼 수 있게 했습니다."},"collocations":["collate data","collate results","collate feedback"],"related":["correlation","elated","ablation","relate"],"tip":"DB의 collation(문자열 정렬·비교 규칙)도 같은 말"},{"id":"d04-C14","day":4,"level":2,"set":"C","family":"F4","word":"correlation","pos":"noun","ipa":"/ˌkɔːrəˈleɪʃn/","meaning_ko":"상관관계","category":"it","etymology":{"parts":[{"text":"cor","type":"prefix","gloss":"함께 (com)"},{"text":"re","type":"prefix","gloss":"다시, 서로"},{"text":"lat","type":"root","gloss":"나르다 (latus)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"서로 되날라 이어진 관계 → 함께 움직이는 관계 → 상관관계"},"example":{"q":"How did you find the cause of the slowdown?","a":"I noticed a strong correlation between slow pages and a specific database query, and that query turned out to be the cause.","a_ko":"느린 페이지와 특정 DB 쿼리 사이에 강한 상관관계가 있는 걸 발견했는데, 결국 그 쿼리가 원인이었습니다."},"collocations":["correlation between","strong correlation","correlation ID"],"related":["collate","elated","ablation","relate"],"tip":"correlation is not causation(상관관계는 인과관계가 아니다)은 데이터 면접 단골"},{"id":"d04-C15","day":4,"level":3,"set":"C","family":"F4","word":"ablation","pos":"noun","ipa":"/æˈbleɪʃn/","meaning_ko":"제거 실험(어블레이션), 제거","category":"it","etymology":{"parts":[{"text":"ab","type":"prefix","gloss":"떨어져"},{"text":"lat","type":"root","gloss":"나르다 (latus)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"라틴어 ablatus '날라 가 버린' → 떼어 냄 → (ML) 요소를 하나씩 빼 보는 실험"},"example":{"q":"How did you know which feature helped your model?","a":"I ran an ablation study, removing one input feature at a time, and found that the user history feature drove most of the gain.","a_ko":"입력 특성을 하나씩 빼 보는 어블레이션 실험을 해서, 성능 향상의 대부분이 사용자 이력 특성에서 나왔다는 걸 확인했습니다."},"collocations":["ablation study","ablation experiment","run an ablation"],"related":["collate","correlation","elated"],"tip":"ML 논문·면접에서 '무엇이 효과를 냈는지' 증명하는 방법"},{"id":"d04-C16","day":4,"level":1,"set":"C","family":"F4","word":"suggest","pos":"verb","ipa":"/səɡˈdʒest/","meaning_ko":"제안하다","category":"interview","etymology":{"parts":[{"text":"sug","type":"prefix","gloss":"아래에서 (sub)"},{"text":"gest","type":"root","gloss":"나르다 (gerere)"}],"story":"라틴어 suggerere '아래에서 날라다 주다' → 슬쩍 내놓다 → 제안하다"},"example":{"q":"How do you share ideas with senior engineers?","a":"I suggest small experiments first, so the idea is easy to test.","a_ko":"아이디어를 시험해 보기 쉽도록 먼저 작은 실험을 제안합니다."},"collocations":["suggest that","suggest -ing","strongly suggest"],"related":["suggestion","register","digest","congestion"],"tip":"suggest + to부정사는 틀림: suggest trying / suggest that we try. 어근 gest(gerere)도 '나르다'"},{"id":"d04-C17","day":4,"level":1,"set":"C","family":"F4","word":"suggestion","pos":"noun","ipa":"/səɡˈdʒestʃən/","meaning_ko":"제안","category":"interview","etymology":{"parts":[{"text":"sug","type":"prefix","gloss":"아래에서 (sub)"},{"text":"gest","type":"root","gloss":"나르다 (gerere)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"아래에서 날라다 준 것 → 내놓은 생각 → 제안"},"example":{"q":"How do you respond when someone criticizes your code?","a":"I thank them and treat each comment as a useful suggestion.","a_ko":"고맙다고 말하고, 코멘트 하나하나를 유용한 제안으로 받아들입니다."},"collocations":["make a suggestion","open to suggestions","a helpful suggestion"],"related":["suggest","gesture","digest"],"tip":"I'm open to suggestions(제안 환영합니다)는 회의에서 자주 씀"},{"id":"d04-C18","day":4,"level":1,"set":"C","family":"F4","word":"register","pos":"verb","ipa":"/ˈredʒɪstər/","meaning_ko":"등록하다, 가입하다","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤로, 도로"},{"text":"gist","type":"root","gloss":"나르다 (gest)"},{"text":"er","type":"suffix","gloss":"~하는 것"}],"story":"라틴어 regerere '도로 날라 오다 → 기록하다' → 기록부 → 등록하다"},"example":{"q":"What did your first feature at the company do?","a":"It let users register with their Google account in one click.","a_ko":"사용자가 구글 계정으로 클릭 한 번에 가입할 수 있게 하는 기능이었습니다."},"collocations":["register a user","register a domain","register for"],"related":["registration","suggest","digest","ingest"],"tip":"CPU의 '레지스터'도 같은 단어 — 값을 기록해 두는 곳"},{"id":"d04-C19","day":4,"level":2,"set":"C","family":"F4","word":"digest","pos":"noun","ipa":"/ˈdaɪdʒest/","meaning_ko":"요약본; 해시값(다이제스트)","category":"it","etymology":{"parts":[{"text":"di","type":"prefix","gloss":"따로 (dis)"},{"text":"gest","type":"root","gloss":"나르다 (gerere)"}],"story":"라틴어 digerere '따로따로 날라 나누다 → 정리하다' → 정리된 요약 → 데이터를 짧게 줄인 해시"},"example":{"q":"How do you keep your team updated on alerts?","a":"I set up a daily digest of non-urgent alerts, so the team is not interrupted all day.","a_ko":"급하지 않은 알림은 하루 한 번 요약본으로 보내도록 설정해서, 팀이 하루 종일 방해받지 않게 했습니다."},"collocations":["daily digest","message digest","weekly digest"],"related":["suggest","ingest","congestion","register"],"tip":"동사 di-GEST는 '소화하다·이해하다', 명사 DI-gest는 '요약'. 보안에서는 SHA-256 digest"},{"id":"d04-C20","day":4,"level":2,"set":"C","family":"F4","word":"ingest","pos":"verb","ipa":"/ɪnˈdʒest/","meaning_ko":"(데이터를) 수집·적재하다","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안으로"},{"text":"gest","type":"root","gloss":"나르다 (gerere)"}],"story":"안으로 날라 넣다 → 먹다 → 데이터를 시스템에 받아들이다"},"example":{"q":"What does your data pipeline do?","a":"It ingests about ten million events a day from our apps and loads them into the data warehouse.","a_ko":"앱에서 하루 약 1,000만 건의 이벤트를 수집해서 데이터 웨어하우스에 적재합니다."},"collocations":["ingest data","data ingestion","ingest in real time"],"related":["digest","suggest","congestion","register"],"tip":"명사 ingestion: data ingestion pipeline(데이터 수집 파이프라인)"},{"id":"d04-C21","day":4,"level":2,"set":"C","family":"F4","word":"congestion","pos":"noun","ipa":"/kənˈdʒestʃən/","meaning_ko":"혼잡, 정체","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"gest","type":"root","gloss":"나르다 (gerere)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"한데 날라 쌓다 → 쌓여서 막힘 → 혼잡"},"example":{"q":"Why did your API slow down during peak hours?","a":"Network congestion between regions was the main cause, so we moved the cache closer to our users.","a_ko":"리전 간 네트워크 혼잡이 주된 원인이어서, 캐시를 사용자와 가까운 곳으로 옮겼습니다."},"collocations":["network congestion","traffic congestion","congestion control"],"related":["ingest","digest","suggest"],"tip":"TCP의 congestion control(혼잡 제어)로 자주 나옴"},{"id":"d04-C22","day":4,"level":2,"set":"C","family":"F4","word":"gesture","pos":"noun","ipa":"/ˈdʒestʃər/","meaning_ko":"(마음을 보여 주는) 행동, 몸짓","category":"interview","etymology":{"parts":[{"text":"gest","type":"root","gloss":"나르다, 행하다 (gerere)"},{"text":"ure","type":"suffix","gloss":"~하는 것"}],"story":"라틴어 gerere '나르다 → 몸을 움직여 행하다' → 몸짓 → 마음을 보여 주는 행동"},"example":{"q":"How did you help new members join your team?","a":"I wrote a short onboarding guide for them, which was a small gesture but saved them days of confusion.","a_ko":"짧은 온보딩 가이드를 써 줬는데, 작은 배려였지만 그들이 며칠씩 헤맬 시간을 아껴 줬습니다."},"collocations":["a small gesture","a kind gesture","a gesture of goodwill"],"related":["suggest","digest","register"],"tip":"면접에서는 '몸짓'보다 a small gesture(작은 배려)로 쓰기 좋음"},{"id":"d04-C23","day":4,"level":1,"set":"C","family":"F4","word":"reach out","pos":"phrasal verb","ipa":"/ˌriːtʃ ˈaʊt/","meaning_ko":"연락하다, 도움을 청하다","category":"interview","etymology":{"parts":[{"text":"reach","type":"part","gloss":"손을 뻗다"},{"text":"out","type":"part","gloss":"밖으로"}],"story":"밖으로 손을 뻗다 → 먼저 연락하다"},"example":{"q":"What do you do when you are stuck?","a":"If I am stuck for over an hour, I reach out to a teammate.","a_ko":"한 시간 넘게 막히면 팀원에게 도움을 요청합니다."},"collocations":["reach out to","feel free to reach out","reach out for help"],"related":["point out","check in","get back to"],"tip":"contact보다 부드럽고 친근한 '연락하다'"},{"id":"d04-C24","day":4,"level":1,"set":"C","family":"F4","word":"point out","pos":"phrasal verb","ipa":"/ˌpɔɪnt ˈaʊt/","meaning_ko":"지적하다, 짚어 주다","category":"interview","etymology":{"parts":[{"text":"point","type":"part","gloss":"가리키다"},{"text":"out","type":"part","gloss":"드러나게"}],"story":"손가락으로 가리켜 드러내다 → 지적하다"},"example":{"q":"How do you give feedback in code reviews?","a":"I point out the issue clearly and suggest a fix when I can.","a_ko":"문제를 분명하게 짚어 주고, 가능하면 고칠 방법도 제안합니다."},"collocations":["point out a problem","point out that","as you pointed out"],"related":["bring up","speak up","reach out"],"tip":"As you pointed out, ~ (말씀하신 대로)로 면접관의 말을 받을 수 있음"},{"id":"d04-C25","day":4,"level":1,"set":"C","family":"F4","word":"bring up","pos":"phrasal verb","ipa":"/ˌbrɪŋ ˈʌp/","meaning_ko":"(화제를) 꺼내다","category":"interview","etymology":{"parts":[{"text":"bring","type":"part","gloss":"가져오다"},{"text":"up","type":"part","gloss":"위로, 드러나게"}],"story":"위로 가져오다 → 화제를 테이블 위에 올리다 → 꺼내다"},"example":{"q":"What do you do if you disagree with your manager?","a":"I bring it up in our one-on-one instead of in a big meeting.","a_ko":"큰 회의 자리보다는 1:1 면담에서 그 이야기를 꺼냅니다."},"collocations":["bring up an issue","bring up a topic","bring it up with"],"related":["point out","speak up","push back"],"tip":"raise와 비슷한 뜻. bring up a child(아이를 키우다)라는 뜻도 있음"},{"id":"d04-D01","day":4,"level":1,"set":"D","family":"F4","word":"subject","pos":"noun","ipa":"/ˈsʌbdʒɪkt/","meaning_ko":"과목, 주제","category":"interview","etymology":{"parts":[{"text":"sub","type":"prefix","gloss":"아래로"},{"text":"ject","type":"root","gloss":"던지다"}],"story":"아래에 던져 놓인 것 → (논의의) 밑바탕 → 주제·과목"},"example":{"q":"What was your favorite subject in university?","a":"My favorite subject was algorithms, because I enjoyed solving puzzles.","a_ko":"가장 좋아한 과목은 알고리즘이었습니다. 퍼즐 푸는 걸 좋아했기 때문입니다."},"collocations":["subject matter expert","the subject of","subject to change"],"related":["subjective","object","reject","trajectory"],"tip":"subject to change(변경될 수 있음)는 일정·조건을 말할 때 유용"},{"id":"d04-D02","day":4,"level":2,"set":"D","family":"F4","word":"subjective","pos":"adjective","ipa":"/səbˈdʒektɪv/","meaning_ko":"주관적인","category":"interview","etymology":{"parts":[{"text":"sub","type":"prefix","gloss":"아래로"},{"text":"ject","type":"root","gloss":"던지다"},{"text":"ive","type":"suffix","gloss":"~한"}],"story":"주체(subject) 쪽의 → 개인 생각에 따른 → 주관적인"},"example":{"q":"How do you settle design debates on your team?","a":"Design debates can get subjective, so I suggest we compare the options with real performance data.","a_ko":"설계 논쟁은 주관적으로 흐르기 쉬워서, 실제 성능 데이터로 선택지를 비교해 보자고 제안합니다."},"collocations":["highly subjective","subjective opinion","a bit subjective"],"related":["subject","objective","object"],"tip":"반대말 objective(객관적인)와 짝으로 외우기"},{"id":"d04-D03","day":4,"level":1,"set":"D","family":"F4","word":"object","pos":"noun","ipa":"/ˈɑːbdʒekt/","meaning_ko":"객체, 오브젝트","category":"it","etymology":{"parts":[{"text":"ob","type":"prefix","gloss":"앞에"},{"text":"ject","type":"root","gloss":"던지다"}],"story":"앞에 던져진 것 → 눈앞의 대상 → (프로그래밍) 객체"},"example":{"q":"Where do you store user uploads?","a":"We store uploads in object storage like S3 and keep only the links in the database.","a_ko":"업로드 파일은 S3 같은 오브젝트 스토리지에 저장하고, 데이터베이스에는 링크만 둡니다."},"collocations":["object storage","object-oriented","JSON object"],"related":["objective","subject","reject","trajectory"],"tip":"동사 ob-JECT는 '반대하다'(I object to ~)로 뜻과 강세가 다름"},{"id":"d04-D04","day":4,"level":2,"set":"D","family":"F4","word":"objective","pos":"noun","ipa":"/əbˈdʒektɪv/","meaning_ko":"목표; (형용사) 객관적인","category":"interview","etymology":{"parts":[{"text":"ob","type":"prefix","gloss":"앞에"},{"text":"ject","type":"root","gloss":"던지다"},{"text":"ive","type":"suffix","gloss":"~하는 것"}],"story":"앞에 던져 놓은 것 → 겨냥하는 대상 → 목표"},"example":{"q":"What were the objectives of that project?","a":"Our main objective was to cut checkout time in half, and we reached it within one quarter.","a_ko":"주요 목표는 결제 시간을 절반으로 줄이는 것이었고, 한 분기 안에 달성했습니다."},"collocations":["main objective","set clear objectives","objectives and key results"],"related":["object","subjective","subject","reject"],"tip":"OKR의 O가 objective. 형용사로는 '객관적인'(an objective view)"},{"id":"d04-D05","day":4,"level":1,"set":"D","family":"F4","word":"reject","pos":"verb","ipa":"/rɪˈdʒekt/","meaning_ko":"거절하다, 반려하다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤로, 도로"},{"text":"ject","type":"root","gloss":"던지다"}],"story":"뒤로 던져 버리다 → 받지 않다 → 거절하다"},"example":{"q":"Have you ever disagreed with a design?","a":"Yes, I once rejected a design because it added cost without a clear benefit.","a_ko":"네, 뚜렷한 이점 없이 비용만 늘리는 설계라서 반려한 적이 있습니다."},"collocations":["reject a proposal","reject a request","be rejected"],"related":["rejection","subject","object","objective"],"tip":"코드 리뷰에서는 reject보다 request changes(수정 요청)라는 말을 더 많이 씀"},{"id":"d04-D06","day":4,"level":1,"set":"D","family":"F4","word":"rejection","pos":"noun","ipa":"/rɪˈdʒekʃn/","meaning_ko":"거절, 불합격","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤로, 도로"},{"text":"ject","type":"root","gloss":"던지다"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"뒤로 던져 버림 → 거절"},"example":{"q":"How do you deal with setbacks?","a":"I treat each rejection as feedback and ask what I can improve.","a_ko":"거절당할 때마다 피드백으로 받아들이고, 무엇을 개선할 수 있을지 묻습니다."},"collocations":["handle rejection","fear of rejection","rejection rate"],"related":["reject","subject","objective"],"tip":"실패 경험 질문에서 담담하게 쓸 수 있는 단어"},{"id":"d04-D07","day":4,"level":3,"set":"D","family":"F4","word":"trajectory","pos":"noun","ipa":"/trəˈdʒektəri/","meaning_ko":"(경력의) 궤도, 발전 흐름","category":"interview","etymology":{"parts":[{"text":"tra","type":"prefix","gloss":"건너 (trans)"},{"text":"ject","type":"root","gloss":"던지다"},{"text":"ory","type":"suffix","gloss":"~하는 것"}],"story":"라틴어 traicere '건너편으로 던지다' → 던진 물체가 그리는 길 → 궤도·발전 경로"},"example":{"q":"Where do you see yourself in five years?","a":"I see my career trajectory moving from building features toward designing systems, and this role is the natural next step on that path.","a_ko":"제 경력은 기능 개발에서 시스템 설계 쪽으로 나아가고 있고, 이 자리가 그 길에서 자연스러운 다음 단계라고 생각합니다."},"collocations":["career trajectory","growth trajectory","on an upward trajectory"],"related":["subject","object","reject","objective"],"tip":"5년 후 질문에서 path보다 세련된 표현"},{"id":"d04-D08","day":4,"level":3,"set":"D","family":"F4","word":"jettison","pos":"verb","ipa":"/ˈdʒetɪsn/","meaning_ko":"(필요 없는 것을) 과감히 버리다","category":"it","etymology":{"parts":[{"text":"jett","type":"root","gloss":"던지다 (ject, 라틴어 iactare)"},{"text":"ison","type":"suffix","gloss":"~하기 (-ation)"}],"story":"라틴어 iactatio '던지기' → 배가 위험할 때 짐을 바다에 던지기 → 과감히 버리다"},"example":{"q":"How did you speed up the rewrite?","a":"We decided to jettison the legacy reporting module entirely, since only two customers used it, and that saved us about a month.","a_ko":"레거시 리포팅 모듈은 고객 두 곳만 쓰고 있어서 통째로 버리기로 했고, 덕분에 약 한 달을 아꼈습니다."},"collocations":["jettison a feature","jettison legacy code","jettison the plan"],"related":["reject","object","trajectory","subject"],"tip":"drop보다 강하고 단호한 '버리다'"},{"id":"d04-D09","day":4,"level":1,"set":"D","family":"F4","word":"obvious","pos":"adjective","ipa":"/ˈɑːbviəs/","meaning_ko":"명백한, 뻔한","category":"interview","etymology":{"parts":[{"text":"ob","type":"prefix","gloss":"마주하여"},{"text":"vi","type":"root","gloss":"길 (via)"},{"text":"ous","type":"suffix","gloss":"~한"}],"story":"라틴어 obvius '길 위에서 마주치는' → 누구나 보게 되는 → 명백한"},"example":{"q":"What is a mistake you made early in your career?","a":"I once missed an obvious bug because I skipped writing tests.","a_ko":"테스트 작성을 건너뛰는 바람에 뻔한 버그를 놓친 적이 있습니다."},"collocations":["obvious choice","it is obvious that","not obvious"],"related":["obviously","previous","trivial","deviate"],"tip":"'뻔한'이라는 낮잡는 느낌도 있으니 상대 의견에는 쓰지 않기"},{"id":"d04-D10","day":4,"level":1,"set":"D","family":"F4","word":"obviously","pos":"adverb","ipa":"/ˈɑːbviəsli/","meaning_ko":"당연히, 분명히","category":"interview","etymology":{"parts":[{"text":"ob","type":"prefix","gloss":"마주하여"},{"text":"vi","type":"root","gloss":"길 (via)"},{"text":"ous","type":"suffix","gloss":"~한"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"길 위에서 마주치듯 → 누가 봐도 분명히"},"example":{"q":"How did you feel when the project was canceled?","a":"I was obviously disappointed, but I understood the business reasons behind it.","a_ko":"당연히 실망했지만, 그 뒤에 있는 사업상 이유는 이해했습니다."},"collocations":["obviously important","most obviously","obviously not"],"related":["obvious","previously","deviate"],"tip":"너무 자주 쓰면 '그것도 모르냐'로 들릴 수 있으니 한 답변에 한 번만"},{"id":"d04-D11","day":4,"level":1,"set":"D","family":"F4","word":"previous","pos":"adjective","ipa":"/ˈpriːviəs/","meaning_ko":"이전의","category":"it","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"앞에"},{"text":"vi","type":"root","gloss":"길 (via)"},{"text":"ous","type":"suffix","gloss":"~한"}],"story":"라틴어 praevius '앞서 길을 가는' → 먼저 온 → 이전의"},"example":{"q":"What do you do when a release breaks something?","a":"I roll back to the previous version first, then investigate the cause.","a_ko":"먼저 이전 버전으로 롤백하고 나서 원인을 조사합니다."},"collocations":["previous version","previous role","previous release"],"related":["previously","obvious","deviate","trivial"],"tip":"면접에서 '전 직장'은 my previous company / my previous role"},{"id":"d04-D12","day":4,"level":1,"set":"D","family":"F4","word":"previously","pos":"adverb","ipa":"/ˈpriːviəsli/","meaning_ko":"이전에","category":"interview","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"앞에"},{"text":"vi","type":"root","gloss":"길 (via)"},{"text":"ous","type":"suffix","gloss":"~한"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"앞서 길을 간 때에 → 이전에"},"example":{"q":"Tell me about yourself.","a":"Previously, I worked as a backend developer at a fintech startup in Seoul.","a_ko":"이전에는 서울의 핀테크 스타트업에서 백엔드 개발자로 일했습니다."},"collocations":["previously worked","as previously mentioned","previously unknown"],"related":["previous","obvious","obviously"],"tip":"자기소개에서 경력을 이어 말할 때 Before that 대신 쓸 수 있음"},{"id":"d04-D13","day":4,"level":1,"set":"D","family":"F4","word":"trivial","pos":"adjective","ipa":"/ˈtrɪviəl/","meaning_ko":"사소한, 간단한","category":"it","etymology":{"parts":[{"text":"tri","type":"prefix","gloss":"셋"},{"text":"vi","type":"root","gloss":"길 (via)"},{"text":"al","type":"suffix","gloss":"~의"}],"story":"라틴어 trivialis '세 갈래 길(trivium)의' → 길거리 어디서나 흔한 → 하찮은·간단한"},"example":{"q":"How long did the fix take?","a":"The fix itself was trivial, but finding the bug took two days.","a_ko":"수정 자체는 간단했지만, 버그를 찾는 데 이틀이 걸렸습니다."},"collocations":["a trivial fix","trivial change","not trivial"],"related":["obvious","previous","deviate","deviation"],"tip":"개발자들이 '간단한 일'을 trivial이라고 자주 씀. 사람에게 쓰면 실례"},{"id":"d04-D14","day":4,"level":2,"set":"D","family":"F4","word":"deviate","pos":"verb","ipa":"/ˈdiːvieɪt/","meaning_ko":"(계획·기준에서) 벗어나다","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"떨어져"},{"text":"vi","type":"root","gloss":"길 (via)"},{"text":"ate","type":"suffix","gloss":"~하다"}],"story":"길에서 벗어나다 → 정해진 계획·기준에서 벗어나다"},"example":{"q":"Do you always follow the process?","a":"I follow it by default, but I deviate from it when it clearly hurts the customer, and I explain why.","a_ko":"기본적으로는 따르지만, 고객에게 분명히 손해가 될 때는 벗어나고 그 이유를 설명합니다."},"collocations":["deviate from the plan","deviate slightly","deviate from the norm"],"related":["deviation","obvious","previous","trivial"],"tip":"항상 deviate from ~ 형태로 씀"},{"id":"d04-D15","day":4,"level":2,"set":"D","family":"F4","word":"deviation","pos":"noun","ipa":"/ˌdiːviˈeɪʃn/","meaning_ko":"편차, 이탈","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"떨어져"},{"text":"vi","type":"root","gloss":"길 (via)"},{"text":"ation","type":"suffix","gloss":"~하는 것"}],"story":"길에서 벗어남 → 기준에서 벗어난 정도 → 편차"},"example":{"q":"How do you set alert thresholds?","a":"I trigger an alert when response time is three standard deviations above the weekly average, which cut false alarms a lot.","a_ko":"응답 시간이 주간 평균보다 표준편차의 3배 이상 높아지면 알림이 가도록 했더니, 오탐이 크게 줄었습니다."},"collocations":["standard deviation","deviation from","significant deviation"],"related":["deviate","trivial","obvious"],"tip":"통계의 standard deviation(표준편차)으로 가장 많이 나옴"},{"id":"d04-D16","day":4,"level":1,"set":"D","family":"F4","word":"invoice","pos":"noun","ipa":"/ˈɪnvɔɪs/","meaning_ko":"청구서, 인보이스","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"~위에, ~로 (en)"},{"text":"voice","type":"root","gloss":"길로 보내다 (via → envoyer)"}],"story":"프랑스어 envoyer '길에 올려 보내다'(en voie ← via 길) → 보낸 물품 목록 → 청구서"},"example":{"q":"What kind of systems have you built?","a":"I built a billing service that creates monthly invoices for over ten thousand customers.","a_ko":"1만 곳이 넘는 고객사에 월별 청구서를 만들어 주는 결제 서비스를 개발했습니다."},"collocations":["send an invoice","invoice system","monthly invoice"],"related":["previous","obvious","deviate","convey"],"tip":"결제·회계 시스템 경험을 말할 때 billing과 함께 씀. voice(목소리)와는 관계없음"},{"id":"d04-D17","day":4,"level":1,"set":"D","family":"F4","word":"vehicle","pos":"noun","ipa":"/ˈviːəkl/","meaning_ko":"수단, 매개체; 차량","category":"interview","etymology":{"parts":[{"text":"vehi","type":"root","gloss":"나르다 (vehere)"},{"text":"cle","type":"suffix","gloss":"~하는 도구"}],"story":"나르는 것 → 탈것 → 무언가를 전달하는 수단"},"example":{"q":"Why do you write a tech blog?","a":"My blog is a vehicle for sharing what I learn with other developers.","a_ko":"블로그는 제가 배운 것을 다른 개발자들과 나누는 수단입니다."},"collocations":["a vehicle for","vehicle for growth","electric vehicle"],"related":["transport","support","convey"],"tip":"면접에서는 '차량'보다 a vehicle for ~ (~의 수단)로 씀. 어근 veh도 '나르다'"},{"id":"d04-D18","day":4,"level":2,"set":"D","family":"F4","word":"metaphor","pos":"noun","ipa":"/ˈmetəfɔːr/","meaning_ko":"비유","category":"interview","etymology":{"parts":[{"text":"meta","type":"prefix","gloss":"넘어, 다른 곳으로"},{"text":"phor","type":"root","gloss":"나르다 (그리스어 pherein)"}],"story":"그리스어 metaphora '다른 곳으로 옮겨 나르기' → 뜻을 다른 말에 옮겨 싣기 → 비유"},"example":{"q":"How do you explain technical concepts to non-engineers?","a":"I use simple metaphors, like comparing a cache to keeping snacks on your desk instead of in the kitchen.","a_ko":"캐시를 간식을 부엌이 아니라 책상 위에 두는 것에 비유하는 식으로, 쉬운 비유를 씁니다."},"collocations":["use a metaphor","a good metaphor for","mixed metaphor"],"related":["peripheral","semaphore","prefer","transfer"],"tip":"그리스어 pher/phor는 라틴어 fer와 같은 '나르다' 짝 어근"},{"id":"d04-D19","day":4,"level":2,"set":"D","family":"F4","word":"peripheral","pos":"adjective","ipa":"/pəˈrɪfərəl/","meaning_ko":"주변의, 부차적인; (명사) 주변 장치","category":"it","etymology":{"parts":[{"text":"peri","type":"prefix","gloss":"둘레"},{"text":"pher","type":"root","gloss":"나르다 (그리스어 pherein)"},{"text":"al","type":"suffix","gloss":"~의"}],"story":"그리스어 periphereia '둘레를 돌아 나르는 선' → 둘레 → 중심이 아닌 주변의"},"example":{"q":"What did you work on at the hardware company?","a":"I wrote drivers for peripheral devices such as printers and scanners, which taught me a lot about low-level debugging.","a_ko":"프린터나 스캐너 같은 주변 장치의 드라이버를 작성했고, 덕분에 저수준 디버깅을 많이 배웠습니다."},"collocations":["peripheral device","peripheral issue","peripheral vision"],"related":["metaphor","semaphore","prefer"],"tip":"a peripheral issue(부차적인 문제)처럼 비유적으로도 씀"},{"id":"d04-D20","day":4,"level":2,"set":"D","family":"F4","word":"collation","pos":"noun","ipa":"/kəˈleɪʃn/","meaning_ko":"(DB) 콜레이션(문자 정렬·비교 규칙), 대조","category":"it","etymology":{"parts":[{"text":"col","type":"prefix","gloss":"함께 (com)"},{"text":"lat","type":"root","gloss":"나르다 (latus)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"라틴어 collatio '함께 날라 와 맞대어 봄' → 대조 → 문자를 비교·정렬하는 규칙"},"example":{"q":"Tell me about a tricky bug you fixed.","a":"Search results were sorted differently in two environments, and the cause turned out to be different database collations.","a_ko":"두 환경에서 검색 결과의 정렬 순서가 달랐는데, 원인은 데이터베이스 콜레이션 설정이 서로 다른 것이었습니다."},"collocations":["database collation","case-insensitive collation","collation setting"],"related":["collate","correlation","ablation","elated"],"tip":"대소문자 구분, 한글 정렬 순서 같은 문제가 이 설정에서 생김"},{"id":"d04-D21","day":4,"level":3,"set":"D","family":"F4","word":"latency","pos":"noun","ipa":"/ˈleɪtnsi/","meaning_ko":"지연 시간, 레이턴시","category":"it","etymology":{"parts":[{"text":"lat","type":"root","gloss":"숨어 있다 (latēre)"},{"text":"ency","type":"suffix","gloss":"~한 상태"}],"story":"라틴어 latēre '숨어 있다' → latent '잠복한' → 잠복 기간 → 반응이 드러나기까지 걸리는 시간"},"example":{"q":"What was your biggest performance win?","a":"By adding a regional cache, I reduced p99 latency from 800 to 120 milliseconds, which directly improved our checkout conversion rate.","a_ko":"지역별 캐시를 추가해서 p99 지연 시간을 800밀리초에서 120밀리초로 줄였고, 결제 전환율이 바로 좋아졌습니다."},"collocations":["low latency","p99 latency","reduce latency"],"related":["latent","collate","elated","correlation"],"tip":"relate·collate의 lat(나르다, latus)와 철자만 같은 다른 어근(latēre 숨다). throughput(처리량)과 짝으로 외우기"},{"id":"d04-D22","day":4,"level":1,"set":"D","family":"F4","word":"registration","pos":"noun","ipa":"/ˌredʒɪˈstreɪʃn/","meaning_ko":"등록, 가입","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤로, 도로"},{"text":"gistr","type":"root","gloss":"나르다 (gest)"},{"text":"ation","type":"suffix","gloss":"~하는 것"}],"story":"도로 날라 와 기록함 → 기록부에 올림 → 등록"},"example":{"q":"What did you improve in the sign-up flow?","a":"I simplified registration from five steps to two, and sign-ups went up.","a_ko":"가입 절차를 5단계에서 2단계로 줄였더니 가입자 수가 늘었습니다."},"collocations":["user registration","registration form","service registration"],"related":["register","exaggerate","suggest","digest"],"tip":"마이크로서비스의 service registry(서비스 등록소)도 같은 어근"},{"id":"d04-D23","day":4,"level":2,"set":"D","family":"F4","word":"exaggerate","pos":"verb","ipa":"/ɪɡˈzædʒəreɪt/","meaning_ko":"과장하다","category":"interview","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"완전히, 밖으로"},{"text":"agger","type":"root","gloss":"쌓은 더미 (ad + gerere 나르다)"},{"text":"ate","type":"suffix","gloss":"~하다"}],"story":"라틴어 exaggerare '흙을 높이 쌓아 올리다' → 실제보다 부풀리다 → 과장하다"},"example":{"q":"How do you talk about your achievements?","a":"I try not to exaggerate, so I share real numbers and make clear which parts were team efforts.","a_ko":"과장하지 않으려고 실제 수치를 말하고, 어떤 부분이 팀의 성과였는지 분명히 밝힙니다."},"collocations":["exaggerate the impact","hard to exaggerate","slightly exaggerate"],"related":["suggest","register","digest","gesture"],"tip":"철자 주의: g가 두 개(exa-gg-erate)"},{"id":"d04-D24","day":4,"level":2,"set":"D","family":"F4","word":"push back","pos":"phrasal verb","ipa":"/ˌpʊʃ ˈbæk/","meaning_ko":"이의를 제기하다, 반대 의견을 내다","category":"interview","etymology":{"parts":[{"text":"push","type":"part","gloss":"밀다"},{"text":"back","type":"part","gloss":"뒤로"}],"story":"뒤로 밀어내다 → 요청·결정에 맞서 이의를 제기하다"},"example":{"q":"Have you ever disagreed with a product manager?","a":"Yes, I pushed back on a tight deadline and suggested cutting two features to protect quality.","a_ko":"네, 빠듯한 마감 일정에 이의를 제기하고, 품질을 지키기 위해 기능 두 개를 빼자고 제안했습니다."},"collocations":["push back on","push back against","get pushback"],"related":["speak up","weigh in","bring up"],"tip":"명사는 붙여서 pushback. '일정을 미루다'라는 뜻도 있음(push back the release)"},{"id":"d04-D25","day":4,"level":2,"set":"D","family":"F4","word":"weigh in","pos":"phrasal verb","ipa":"/ˌweɪ ˈɪn/","meaning_ko":"(논의에) 의견을 보태다","category":"interview","etymology":{"parts":[{"text":"weigh","type":"part","gloss":"무게를 달다"},{"text":"in","type":"part","gloss":"안으로"}],"story":"경기 전에 몸무게를 재다(계체) → 시합에 뛰어들다 → 논의에 뛰어들어 의견을 내다"},"example":{"q":"How do you make decisions as a team?","a":"I ask everyone to weigh in before we decide, because quieter teammates often have the best ideas.","a_ko":"결정하기 전에 모두에게 의견을 내 달라고 합니다. 조용한 팀원이 가장 좋은 아이디어를 갖고 있는 경우가 많기 때문입니다."},"collocations":["weigh in on","weigh in with","let me weigh in"],"related":["push back","speak up","bring up"],"tip":"발음 /weɪ/ — gh는 소리 나지 않음"},{"id":"d05-A01","day":5,"level":1,"set":"A","family":"F5","word":"accept","pos":"verb","ipa":"/əkˈsept/","meaning_ko":"받아들이다, 수락하다","category":"interview","etymology":{"parts":[{"text":"ac","type":"prefix","gloss":"~쪽으로 (ad)"},{"text":"cept","type":"root","gloss":"잡다 (capere)"}],"story":"내 쪽으로 잡아 들이다 → 받아들이다 → 수락하다"},"example":{"q":"How do you handle criticism of your code?","a":"I accept feedback openly and use it to improve my next pull request.","a_ko":"피드백을 열린 마음으로 받아들이고 다음 풀 리퀘스트를 개선하는 데 활용합니다."},"collocations":["accept feedback","accept an offer","accept responsibility"],"related":["acceptance","concept","exception","capable","receive"],"tip":"except(~을 제외하고)와 발음이 비슷하니 주의: accept는 /ək-/, except는 /ɪk-/"},{"id":"d05-A02","day":5,"level":1,"set":"A","family":"F5","word":"acceptance","pos":"noun","ipa":"/əkˈseptəns/","meaning_ko":"인수(검수), 수락","category":"it","etymology":{"parts":[{"text":"ac","type":"prefix","gloss":"~쪽으로 (ad)"},{"text":"cept","type":"root","gloss":"잡다 (capere)"},{"text":"ance","type":"suffix","gloss":"~함 (명사)"}],"story":"받아들임 → 만든 결과물을 받아들이는 일 → 인수·검수"},"example":{"q":"How do you know a feature is done?","a":"It's done when it passes the acceptance criteria we agreed on with the product owner.","a_ko":"프로덕트 오너와 합의한 인수 조건을 통과하면 완료입니다."},"collocations":["acceptance criteria","user acceptance testing (UAT)","gain acceptance"],"related":["accept","exception","concept","capable"],"tip":"애자일의 acceptance criteria = 완료 조건, UAT = 사용자 인수 테스트"},{"id":"d05-A03","day":5,"level":1,"set":"A","family":"F5","word":"concept","pos":"noun","ipa":"/ˈkɑːnsept/","meaning_ko":"개념","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께·완전히 (com)"},{"text":"cept","type":"root","gloss":"잡다 (capere)"}],"story":"마음속에 붙잡아 품은 것(conceptum) → 생각 → 개념"},"example":{"q":"How do you learn a new framework?","a":"I start with the core concepts and then build a small project.","a_ko":"핵심 개념부터 익힌 다음 작은 프로젝트를 만들어 봅니다."},"collocations":["core concept","proof of concept (PoC)","grasp the concept"],"related":["misconception","conceive","accept","exception"],"tip":"PoC = proof of concept(개념 검증). IT 면접 단골 표현"},{"id":"d05-A04","day":5,"level":2,"set":"A","family":"F5","word":"misconception","pos":"noun","ipa":"/ˌmɪskənˈsepʃən/","meaning_ko":"오해, 잘못된 생각","category":"it","etymology":{"parts":[{"text":"mis","type":"prefix","gloss":"잘못 (영어 접두사)"},{"text":"con","type":"prefix","gloss":"함께·완전히 (com)"},{"text":"cept","type":"root","gloss":"잡다 (capere)"},{"text":"ion","type":"suffix","gloss":"~것 (명사)"}],"story":"잘못 붙잡은 생각 → 오해"},"example":{"q":"What do people often get wrong about microservices?","a":"A common misconception is that microservices make a system faster; in reality, they mainly let teams release independently.","a_ko":"흔한 오해는 마이크로서비스가 시스템을 빠르게 만든다는 것인데, 실제로는 주로 팀이 독립적으로 배포할 수 있게 해 줍니다."},"collocations":["a common misconception","clear up a misconception","misconception about"],"related":["concept","conceive","perception","exception"],"tip":"'A common misconception is that ~'은 기술 설명을 시작할 때 쓰기 좋은 틀"},{"id":"d05-A05","day":5,"level":2,"set":"A","family":"F5","word":"exception","pos":"noun","ipa":"/ɪkˈsepʃən/","meaning_ko":"예외","category":"it","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"cept","type":"root","gloss":"잡다 (capere)"},{"text":"ion","type":"suffix","gloss":"~것 (명사)"}],"story":"밖으로 집어낸 것 → 규칙에서 빠진 것 → 예외"},"example":{"q":"How do you make your code more robust?","a":"I handle exceptions carefully and log enough context, so failures are easy to diagnose in production.","a_ko":"예외를 꼼꼼히 처리하고 충분한 맥락을 로그로 남겨서, 운영 환경에서 장애 원인을 쉽게 찾을 수 있게 합니다."},"collocations":["handle an exception","throw an exception","with the exception of"],"related":["exceptional","accept","intercept","concept"],"tip":"코드의 '예외'이자, 'with the exception of(~을 제외하고)'로 일반 답변에서도 씀"},{"id":"d05-A06","day":5,"level":1,"set":"A","family":"F5","word":"exceptional","pos":"adjective","ipa":"/ɪkˈsepʃənl/","meaning_ko":"뛰어난, 예외적인","category":"interview","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"cept","type":"root","gloss":"잡다 (capere)"},{"text":"ion","type":"suffix","gloss":"~것 (명사)"},{"text":"al","type":"suffix","gloss":"~의, ~한"}],"story":"예외에 해당하는 → 보통을 벗어난 → 뛰어난"},"example":{"q":"What did your last manager say about you?","a":"She said my documentation was exceptional and asked me to coach new hires.","a_ko":"제 문서화가 뛰어나다며 신입 교육을 맡겨 주셨습니다."},"collocations":["exceptional performance","exceptional quality","in exceptional cases"],"related":["exception","accept","acceptance","capable"],"tip":"자기 자랑은 남의 말을 빌려서: 'My manager said ~ was exceptional'"},{"id":"d05-A07","day":5,"level":2,"set":"A","family":"F5","word":"intercept","pos":"verb","ipa":"/ˌɪntərˈsept/","meaning_ko":"가로채다","category":"it","etymology":{"parts":[{"text":"inter","type":"prefix","gloss":"사이에"},{"text":"cept","type":"root","gloss":"잡다 (capere)"}],"story":"사이에서 잡다 → 가는 길을 중간에서 가로채다"},"example":{"q":"How did you add authentication to the frontend?","a":"I intercepted every outgoing HTTP request to attach the auth token, so no screen had to handle it manually.","a_ko":"나가는 HTTP 요청을 모두 가로채 인증 토큰을 붙였기 때문에, 화면마다 따로 처리할 필요가 없었습니다."},"collocations":["intercept a request","intercept traffic","intercept an error"],"related":["interceptor","accept","exception","capture"],"tip":"보안 문맥에서는 '도청·탈취하다'라는 부정적인 뜻으로도 씀"},{"id":"d05-A08","day":5,"level":2,"set":"A","family":"F5","word":"interceptor","pos":"noun","ipa":"/ˌɪntərˈseptər/","meaning_ko":"인터셉터 (요청을 중간에 가로채 처리하는 코드)","category":"it","etymology":{"parts":[{"text":"inter","type":"prefix","gloss":"사이에"},{"text":"cept","type":"root","gloss":"잡다 (capere)"},{"text":"or","type":"suffix","gloss":"~하는 것"}],"story":"사이에서 잡는 것 → 요격기 → 요청·응답을 중간에서 가로채는 코드"},"example":{"q":"How do you handle expired sessions?","a":"I wrote an interceptor that catches 401 responses and refreshes the token before retrying the request.","a_ko":"401 응답을 잡아서 토큰을 갱신한 뒤 요청을 다시 보내는 인터셉터를 작성했습니다."},"collocations":["HTTP interceptor","request interceptor","add an interceptor"],"related":["intercept","exception","capture","receive"],"tip":"Angular·Axios·Spring에서 자주 나오는 용어. 원래 뜻은 '요격기'"},{"id":"d05-A09","day":5,"level":3,"set":"A","family":"F5","word":"inception","pos":"noun","ipa":"/ɪnˈsepʃən/","meaning_ko":"시작, 출범","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안으로·위에"},{"text":"cept","type":"root","gloss":"잡다 (capere)"},{"text":"ion","type":"suffix","gloss":"~것 (명사)"}],"story":"incipere = 손에 잡다 → 일에 착수하다 → 시작"},"example":{"q":"What was your role in the project?","a":"I was involved from the project's inception, so I helped define the architecture, hire the first engineers, and set our coding standards.","a_ko":"프로젝트 시작 단계부터 참여해서 아키텍처를 정하고, 첫 엔지니어들을 채용하고, 코딩 규칙을 세우는 데 기여했습니다."},"collocations":["since its inception","from inception to launch","at the inception of"],"related":["concept","accept","exception","capable"],"tip":"'from the start'의 격식 있는 표현. since its inception = 처음부터 지금까지"},{"id":"d05-A10","day":5,"level":3,"set":"A","family":"F5","word":"deceptively","pos":"adverb","ipa":"/dɪˈseptɪvli/","meaning_ko":"겉보기와 달리","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"떨어져·아래로"},{"text":"cept","type":"root","gloss":"잡다 (capere)"},{"text":"ive","type":"suffix","gloss":"~하는"},{"text":"ly","type":"suffix","gloss":"~하게 (부사)"}],"story":"decipere = 덫으로 낚아채다 → 속이다 → 사람을 속일 만큼 → 겉보기와 달리"},"example":{"q":"What was the hardest bug you've fixed?","a":"It looked deceptively simple, just a wrong timestamp, but it turned out to be a time zone issue spread across three services.","a_ko":"타임스탬프 하나가 틀린 것처럼 겉보기엔 단순했지만, 알고 보니 서비스 세 개에 걸친 시간대 문제였습니다."},"collocations":["deceptively simple","deceptively easy","deceptively complex"],"related":["receive","perceive","concept","exception"],"tip":"'deceptively simple' = 쉬워 보이지만 실제로는 어렵다는 뜻. 단순하다는 말이 아님"},{"id":"d05-A11","day":5,"level":1,"set":"A","family":"F5","word":"receive","pos":"verb","ipa":"/rɪˈsiːv/","meaning_ko":"받다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시·되"},{"text":"ceive","type":"root","gloss":"잡다 (cip ← capere)"}],"story":"recipere = 되잡다 → 건네진 것을 받다"},"example":{"q":"Have you received any awards at work?","a":"I received a quarterly award for improving our test coverage.","a_ko":"테스트 커버리지를 높인 공로로 분기 표창을 받았습니다."},"collocations":["receive feedback","receive an award","receive an offer"],"related":["receptive","recipient","perceive","conceive"],"tip":"철자 주의: c 뒤에서는 ei → receive (recieve X)"},{"id":"d05-A12","day":5,"level":2,"set":"A","family":"F5","word":"receptive","pos":"adjective","ipa":"/rɪˈseptɪv/","meaning_ko":"(의견을) 잘 받아들이는","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시·되"},{"text":"cept","type":"root","gloss":"잡다 (capere)"},{"text":"ive","type":"suffix","gloss":"~하는 (형용사)"}],"story":"되받아들이는 성질의 → 남의 의견에 열려 있는"},"example":{"q":"How do you respond to code review comments?","a":"I try to stay receptive to comments, even when I disagree, because reviewers often see issues I've missed.","a_ko":"동의하지 않을 때도 리뷰 의견을 열린 마음으로 받아들이려 합니다. 리뷰어가 제가 놓친 문제를 보는 경우가 많기 때문입니다."},"collocations":["receptive to feedback","receptive to new ideas","a receptive audience"],"related":["receive","recipient","accept","perception"],"tip":"open-minded보다 '받아들이는 태도'를 콕 집는 말. receptive to + 명사"},{"id":"d05-A13","day":5,"level":2,"set":"A","family":"F5","word":"perceive","pos":"verb","ipa":"/pərˈsiːv/","meaning_ko":"인식하다, (~로) 여기다","category":"interview","etymology":{"parts":[{"text":"per","type":"prefix","gloss":"완전히"},{"text":"ceive","type":"root","gloss":"잡다 (cip ← capere)"}],"story":"percipere = 완전히 붙잡다 → 감각·마음으로 알아차리다 → 인식하다"},"example":{"q":"How do your teammates see you?","a":"I think I'm perceived as the calm one during incidents, because I focus on facts rather than panic.","a_ko":"장애 상황에서 침착한 사람으로 여겨지는 것 같습니다. 당황하기보다 사실에 집중하기 때문입니다."},"collocations":["be perceived as","perceive a need","perceive a change"],"related":["perception","receive","conceive","deceptively"],"tip":"be perceived as ~ = 남들이 나를 ~로 본다. 강점을 겸손하게 말할 때 좋음"},{"id":"d05-A14","day":5,"level":2,"set":"A","family":"F5","word":"perception","pos":"noun","ipa":"/pərˈsepʃən/","meaning_ko":"인식, (받는) 인상","category":"interview","etymology":{"parts":[{"text":"per","type":"prefix","gloss":"완전히"},{"text":"cept","type":"root","gloss":"잡다 (capere)"},{"text":"ion","type":"suffix","gloss":"~것 (명사)"}],"story":"완전히 붙잡음 → 알아차림 → 인식·인상"},"example":{"q":"How do you measure the impact of performance work?","a":"Beyond metrics, I look at user perception, because a page that feels slow hurts trust even when it's technically fast.","a_ko":"지표만이 아니라 사용자가 어떻게 느끼는지도 봅니다. 기술적으로는 빨라도 느리게 느껴지는 페이지는 신뢰를 떨어뜨리기 때문입니다."},"collocations":["user perception","change the perception","perception versus reality"],"related":["perceive","receptive","concept","misconception"],"tip":"perceive의 명사. 'perception vs. reality'(인식과 실제) 대비로 자주 씀"},{"id":"d05-A15","day":5,"level":2,"set":"A","family":"F5","word":"conceive","pos":"verb","ipa":"/kənˈsiːv/","meaning_ko":"구상하다, 생각해 내다","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께·완전히 (com)"},{"text":"ceive","type":"root","gloss":"잡다 (cip ← capere)"}],"story":"concipere = 안에 붙잡아 품다 → 마음속에 품다 → 구상하다"},"example":{"q":"Tell me about something you built on your own initiative.","a":"I conceived an internal tool that auto-generated test data, and it ended up saving our QA team hours every week.","a_ko":"테스트 데이터를 자동으로 만드는 사내 도구를 구상했는데, 결국 QA 팀의 시간을 매주 몇 시간씩 아껴 주었습니다."},"collocations":["conceive an idea","conceive a plan","hard to conceive"],"related":["concept","misconception","receive","perceive"],"tip":"concept의 동사 짝. '아이를 갖다'라는 뜻도 있으니 목적어로 idea·plan을 붙여 쓰기"},{"id":"d05-A16","day":5,"level":1,"set":"A","family":"F5","word":"capable","pos":"adjective","ipa":"/ˈkeɪpəbl/","meaning_ko":"~할 수 있는, 유능한","category":"interview","etymology":{"parts":[{"text":"cap","type":"root","gloss":"잡다·담다 (capere)"},{"text":"able","type":"suffix","gloss":"~할 수 있는"}],"story":"capabilis = 받아 담을 수 있는 → 감당할 수 있는 → 유능한"},"example":{"q":"Why should we hire you?","a":"I'm capable of owning a feature from design to release.","a_ko":"기능 하나를 설계부터 출시까지 책임지고 해낼 수 있습니다."},"collocations":["capable of + -ing","highly capable","in capable hands"],"related":["capability","capacity","capture","accept"],"tip":"capable of doing (O) / capable to do (X)"},{"id":"d05-A17","day":5,"level":2,"set":"A","family":"F5","word":"capability","pos":"noun","ipa":"/ˌkeɪpəˈbɪləti/","meaning_ko":"역량, 능력","category":"interview","etymology":{"parts":[{"text":"cap","type":"root","gloss":"잡다·담다 (capere)"},{"text":"abil","type":"suffix","gloss":"~할 수 있는 (-able)"},{"text":"ity","type":"suffix","gloss":"~함 (명사)"}],"story":"감당할 수 있음 → 해낼 수 있는 힘 → 역량"},"example":{"q":"What capabilities would you bring to our team?","a":"I'd bring solid backend capabilities, especially in building APIs that other teams find easy to use.","a_ko":"탄탄한 백엔드 역량을 가져올 수 있습니다. 특히 다른 팀이 쓰기 쉬운 API를 만드는 데 강합니다."},"collocations":["technical capabilities","build capability","beyond my capabilities"],"related":["capable","capacity","capture","exception"],"tip":"ability보다 사람·조직·시스템의 '역량'에 많이 씀. 복수형 capabilities가 자연스러움"},{"id":"d05-A18","day":5,"level":1,"set":"A","family":"F5","word":"capacity","pos":"noun","ipa":"/kəˈpæsəti/","meaning_ko":"(맡은) 역할·자격, 용량","category":"interview","etymology":{"parts":[{"text":"capac","type":"root","gloss":"많이 담을 수 있는 (capax ← capere)"},{"text":"ity","type":"suffix","gloss":"~함 (명사)"}],"story":"담을 수 있는 양 → 용량 → 맡을 수 있는 몫 → 역할·자격"},"example":{"q":"What was your role on that team?","a":"In my capacity as tech lead, I reviewed every major design.","a_ko":"테크 리드 역할로서 주요 설계를 모두 검토했습니다."},"collocations":["in my capacity as","at full capacity","capacity planning"],"related":["capable","capability","capture","accept"],"tip":"면접에서는 'in my capacity as ~'(~의 자격으로), 인프라에서는 'capacity planning'(용량 계획)"},{"id":"d05-A19","day":5,"level":1,"set":"A","family":"F5","word":"capture","pos":"verb","ipa":"/ˈkæptʃər/","meaning_ko":"기록하다, 포착하다","category":"it","etymology":{"parts":[{"text":"capt","type":"root","gloss":"잡다 (capere)"},{"text":"ure","type":"suffix","gloss":"~함 (명사 → 동사)"}],"story":"captura = 잡음 → 붙잡다 → 정보를 붙잡아 남기다"},"example":{"q":"How do you track requirements?","a":"I capture each requirement in a ticket so nothing gets lost.","a_ko":"요구사항을 하나하나 티켓으로 기록해서 빠지는 게 없게 합니다."},"collocations":["capture requirements","capture metrics","capture a screenshot"],"related":["caption","capable","capacity","intercept"],"tip":"'잡다'에서 '데이터·요구사항을 붙잡아 기록하다'로 IT에서 아주 자주 씀"},{"id":"d05-A20","day":5,"level":1,"set":"A","family":"F5","word":"caption","pos":"noun","ipa":"/ˈkæpʃən/","meaning_ko":"자막, (사진) 설명 글","category":"it","etymology":{"parts":[{"text":"capt","type":"root","gloss":"잡다 (capere)"},{"text":"ion","type":"suffix","gloss":"~것 (명사)"}],"story":"captio = 붙잡음 → (법률 문서의) 머리말 → 제목 → 사진·영상에 붙는 설명 글"},"example":{"q":"Have you worked on accessibility?","a":"Yes, I added captions to all our product videos for deaf users.","a_ko":"네, 청각 장애가 있는 사용자를 위해 제품 영상에 모두 자막을 넣었습니다."},"collocations":["add captions","auto-generated captions","image captioning"],"related":["capture","capable","capacity","exception"],"tip":"AI 분야에서는 image captioning(이미지 설명 생성)으로도 나옴"},{"id":"d05-A21","day":5,"level":2,"set":"A","family":"F5","word":"recipient","pos":"noun","ipa":
