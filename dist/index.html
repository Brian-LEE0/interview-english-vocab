"/rɪˈsɪpiənt/","meaning_ko":"수신자, 받는 사람","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시·되"},{"text":"cip","type":"root","gloss":"잡다 (capere)"},{"text":"ient","type":"suffix","gloss":"~하는 사람"}],"story":"recipere(받다) + 사람 → 받는 사람 → 수신자"},"example":{"q":"Tell me about the notification system you built.","a":"It sent alerts to the right recipients based on service ownership, which cut noise for on-call engineers.","a_ko":"서비스 담당 기준으로 알맞은 수신자에게만 알림을 보내서, 당직 엔지니어가 받는 불필요한 알림을 줄였습니다."},"collocations":["email recipient","recipient list","award recipient"],"related":["receive","receptive","recipe","participate"],"tip":"receiver와 달리 메일의 '수신자', 상의 '수상자'에 주로 씀"},{"id":"d05-A22","day":5,"level":1,"set":"A","family":"F5","word":"recipe","pos":"noun","ipa":"/ˈresəpi/","meaning_ko":"비결, 요리법","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시·되"},{"text":"cipe","type":"root","gloss":"잡다 (capere)"}],"story":"라틴어 recipe = '받아라·가져라!'(recipere의 명령형, 처방전 첫머리) → 처방 → 요리법 → 비결"},"example":{"q":"What makes a project succeed?","a":"In my experience, the recipe is clear goals and fast feedback.","a_ko":"제 경험상 비결은 명확한 목표와 빠른 피드백입니다."},"collocations":["a recipe for success","a recipe for disaster","no magic recipe"],"related":["recipient","receive","participate","accept"],"tip":"'a recipe for disaster'(재앙을 부르는 지름길)도 면접 답변에서 자주 씀"},{"id":"d05-A23","day":5,"level":1,"set":"A","family":"F5","word":"work ethic","pos":"noun","ipa":"/ˈwɝːk ˌeθɪk/","meaning_ko":"직업 윤리, 일하는 태도","category":"interview","etymology":{"parts":[{"text":"work","type":"part","gloss":"일 (고대 영어 weorc)"},{"text":"ethic","type":"part","gloss":"윤리 (그리스어 ēthos 관습)"}],"story":"일 + 관습·성품 → 일을 대하는 태도"},"example":{"q":"What would your previous manager say about you?","a":"She would say I have a strong work ethic and always meet deadlines.","a_ko":"강한 직업 윤리를 가졌고 항상 마감을 지킨다고 말할 겁니다."},"collocations":["strong work ethic","work ethic and attitude"],"related":["ethics","ethical","workplace"],"tip":"강점을 말할 때 'hard-working' 대신 쓰면 더 전문적으로 들림"},{"id":"d05-A24","day":5,"level":1,"set":"A","family":"F5","word":"comfort zone","pos":"noun","ipa":"/ˈkʌmfɚt ˌzoʊn/","meaning_ko":"익숙하고 편한 영역","category":"interview","etymology":{"parts":[{"text":"comfort","type":"part","gloss":"편안함 (라틴어 com+fortis 강하게)"},{"text":"zone","type":"part","gloss":"구역 (그리스어 zōnē 띠)"}],"story":"편안한 구역 → 익숙해서 도전이 없는 범위"},"example":{"q":"Tell me about a time you challenged yourself.","a":"I stepped out of my comfort zone and led a frontend project.","a_ko":"편한 영역에서 벗어나 프론트엔드 프로젝트를 이끌었습니다."},"collocations":["step out of my comfort zone","outside my comfort zone"],"related":["comfortable","effort","fortify"],"tip":"성장·도전 질문의 단골 표현. 'step out of' 와 함께 외우기"},{"id":"d05-A25","day":5,"level":1,"set":"A","family":"F5","word":"grow","pos":"verb","ipa":"/ɡroʊ/","meaning_ko":"성장하다","category":"interview","etymology":{"parts":[{"text":"grow","type":"part","gloss":"자라다 (고대 영어 grōwan)"}],"story":"식물이 자라다 → 사람·회사가 성장하다"},"example":{"q":"Where do you see yourself in five years?","a":"I want to grow into a senior engineer who mentors others.","a_ko":"다른 사람을 이끌어 주는 시니어 엔지니어로 성장하고 싶습니다."},"collocations":["grow as an engineer","grow into a role","room to grow"],"related":["upskill","learning curve","step up"],"tip":"grow into ~ = 점점 ~이 되다 / grow out of ~ = ~에서 벗어나다"},{"id":"d05-B01","day":5,"level":1,"set":"B","family":"F5","word":"participate","pos":"verb","ipa":"/pɑːrˈtɪsɪpeɪt/","meaning_ko":"참여하다","category":"interview","etymology":{"parts":[{"text":"parti","type":"root","gloss":"부분·몫 (pars)"},{"text":"cip","type":"root","gloss":"잡다 (capere)"},{"text":"ate","type":"suffix","gloss":"~하다 (동사)"}],"story":"particeps = 몫을 잡는 사람 → 몫을 나눠 갖다 → 참여하다"},"example":{"q":"How do you contribute outside of coding?","a":"I actively participate in design reviews and hiring interviews.","a_ko":"설계 리뷰와 채용 면접에 적극적으로 참여합니다."},"collocations":["participate in","actively participate","participate fully"],"related":["participant","anticipate","principle","recipient"],"tip":"participate 뒤에는 반드시 in. join은 in 없이 씀"},{"id":"d05-B02","day":5,"level":1,"set":"B","family":"F5","word":"participant","pos":"noun","ipa":"/pɑːrˈtɪsɪpənt/","meaning_ko":"참가자","category":"interview","etymology":{"parts":[{"text":"parti","type":"root","gloss":"부분·몫 (pars)"},{"text":"cip","type":"root","gloss":"잡다 (capere)"},{"text":"ant","type":"suffix","gloss":"~하는 사람"}],"story":"몫을 잡는 사람 → 함께하는 사람 → 참가자"},"example":{"q":"Have you ever run a workshop?","a":"I ran a Git workshop for twenty participants from other teams.","a_ko":"다른 팀 참가자 스무 명을 대상으로 Git 워크숍을 진행했습니다."},"collocations":["workshop participants","active participant","participant in"],"related":["participate","anticipate","principal","capable"],"tip":"'참가자 수'를 말할 때 attendees와 비슷하게 씀"},{"id":"d05-B03","day":5,"level":2,"set":"B","family":"F5","word":"anticipate","pos":"verb","ipa":"/ænˈtɪsɪpeɪt/","meaning_ko":"예상하다, 미리 대비하다","category":"interview","etymology":{"parts":[{"text":"anti","type":"prefix","gloss":"미리 (ante)"},{"text":"cip","type":"root","gloss":"잡다 (capere)"},{"text":"ate","type":"suffix","gloss":"~하다 (동사)"}],"story":"anticipare = 미리 잡다 → 앞일을 내다보고 대비하다"},"example":{"q":"How do you prioritize your work?","a":"I try to anticipate risks early, so I tackle the riskiest part of a feature first.","a_ko":"위험을 미리 예상하려고 해서, 기능에서 가장 위험한 부분부터 먼저 처리합니다."},"collocations":["anticipate problems","anticipate needs","as anticipated"],"related":["anticipation","participate","principle","capable"],"tip":"여기 anti는 '반대'가 아니라 ante(미리)가 바뀐 꼴. expect보다 '미리 대비한다'는 뉘앙스"},{"id":"d05-B04","day":5,"level":2,"set":"B","family":"F5","word":"anticipation","pos":"noun","ipa":"/ænˌtɪsɪˈpeɪʃən/","meaning_ko":"예상, 대비","category":"it","etymology":{"parts":[{"text":"anti","type":"prefix","gloss":"미리 (ante)"},{"text":"cip","type":"root","gloss":"잡다 (capere)"},{"text":"ation","type":"suffix","gloss":"~함 (명사)"}],"story":"미리 잡음 → 앞일을 내다봄 → 예상·대비"},"example":{"q":"Tell me about a time you prepared for heavy traffic.","a":"In anticipation of Black Friday, I load-tested our checkout service and doubled the database connection pool.","a_ko":"블랙프라이데이에 대비해 결제 서비스에 부하 테스트를 하고 DB 커넥션 풀을 두 배로 늘렸습니다."},"collocations":["in anticipation of","anticipation of demand","eager anticipation"],"related":["anticipate","participate","recipient","capacity"],"tip":"'in anticipation of ~'(~에 대비하여)를 통째로 외우기"},{"id":"d05-B05","day":5,"level":1,"set":"B","family":"F5","word":"principle","pos":"noun","ipa":"/ˈprɪnsəpl/","meaning_ko":"원칙","category":"it","etymology":{"parts":[{"text":"prin","type":"root","gloss":"첫째 (primus)"},{"text":"cip","type":"root","gloss":"잡다 (capere)"},{"text":"le","type":"suffix","gloss":"명사 어미"}],"story":"princeps = 첫 자리를 잡은 자 → principium 시작·근본 → 원칙"},"example":{"q":"What guides the way you structure code?","a":"I follow the SOLID principles, but I keep things simple first.","a_ko":"SOLID 원칙을 따르되, 우선은 단순하게 만듭니다."},"collocations":["SOLID principles","design principle","in principle"],"related":["principal","participate","anticipate","capable"],"tip":"principal(주된, 수석)과 발음이 같으니 철자 주의: 원칙은 -ple"},{"id":"d05-B06","day":5,"level":2,"set":"B","family":"F5","word":"principal","pos":"adjective","ipa":"/ˈprɪnsəpl/","meaning_ko":"수석(직급), 주된","category":"interview","etymology":{"parts":[{"text":"prin","type":"root","gloss":"첫째 (primus)"},{"text":"cip","type":"root","gloss":"잡다 (capere)"},{"text":"al","type":"suffix","gloss":"~의, ~한"}],"story":"첫 자리를 잡은 → 가장 주된 → 수석"},"example":{"q":"What are your long-term career goals?","a":"I'd like to become a principal engineer, someone who shapes technical strategy across several teams.","a_ko":"여러 팀의 기술 전략을 이끄는 수석 엔지니어가 되고 싶습니다."},"collocations":["principal engineer","principal reason","principal concern"],"related":["principle","participate","anticipate","capable"],"tip":"principle(원칙)과 같은 발음. 직급 사다리: senior → staff → principal"},{"id":"d05-B07","day":5,"level":1,"set":"B","family":"F5","word":"occupy","pos":"verb","ipa":"/ˈɑːkjəpaɪ/","meaning_ko":"(시간·자리를) 차지하다","category":"interview","etymology":{"parts":[{"text":"oc","type":"prefix","gloss":"~에 대해 (ob)"},{"text":"cup","type":"root","gloss":"잡다 (cap ← capere)"},{"text":"y","type":"suffix","gloss":"동사 어미"}],"story":"occupare = 붙잡아 차지하다 → 자리·시간을 차지하다"},"example":{"q":"What does a typical day look like in your current job?","a":"Code reviews occupy most of my mornings, and I build features in the afternoon.","a_ko":"오전은 대부분 코드 리뷰로 채워지고, 오후에는 기능을 개발합니다."},"collocations":["occupy time","occupy a position","be occupied with"],"related":["preoccupied","capture","capacity","accept"],"tip":"take up보다 조금 격식 있는 말. be occupied with ~ = ~로 바쁘다"},{"id":"d05-B08","day":5,"level":2,"set":"B","family":"F5","word":"preoccupied","pos":"adjective","ipa":"/priˈɑːkjəpaɪd/","meaning_ko":"(한 가지에) 정신이 팔린","category":"interview","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"미리·먼저"},{"text":"oc","type":"prefix","gloss":"~에 대해 (ob)"},{"text":"cup","type":"root","gloss":"잡다 (cap ← capere)"},{"text":"ied","type":"suffix","gloss":"~된"}],"story":"먼저 차지해 버린 → 마음이 이미 다른 것에 차지된 → 정신이 팔린"},"example":{"q":"What's a weakness you've worked on?","a":"I used to get so preoccupied with clean code that I missed deadlines, so now I timebox refactoring.","a_ko":"예전에는 깔끔한 코드에 너무 매달려 마감을 놓치곤 해서, 지금은 리팩터링 시간을 미리 정해 둡니다."},"collocations":["preoccupied with","deeply preoccupied","seem preoccupied"],"related":["occupy","capture","anticipate","capable"],"tip":"약점 답변에 쓰기 좋은 단어. obsessed보다 부드러움"},{"id":"d05-B09","day":5,"level":1,"set":"B","family":"F5","word":"catch","pos":"verb","ipa":"/kætʃ/","meaning_ko":"(버그를) 잡아내다, 잡다","category":"it","etymology":{"parts":[{"text":"catch","type":"root","gloss":"잡다 (captare ← capere)"}],"story":"라틴어 captare(잡으려 하다) → 북부 고대 프랑스어 cachier → 잡다 → 버그를 잡아내다"},"example":{"q":"Why do you write unit tests?","a":"Tests help me catch bugs before they reach our users.","a_ko":"테스트 덕분에 버그가 사용자에게 가기 전에 잡아낼 수 있습니다."},"collocations":["catch a bug","catch an exception","catch up on"],"related":["chase","purchase","capture","intercept"],"tip":"try-catch 구문의 그 catch. chase와 같은 뿌리"},{"id":"d05-B10","day":5,"level":1,"set":"B","family":"F5","word":"chase","pos":"verb","ipa":"/tʃeɪs/","meaning_ko":"(끝까지) 추적하다, 쫓다","category":"it","etymology":{"parts":[{"text":"chase","type":"root","gloss":"쫓다 (captiare ← capere)"}],"story":"속라틴어 *captiare(잡으려 쫓다) → 고대 프랑스어 chacier → 쫓다 → 문제를 끝까지 추적하다"},"example":{"q":"How do you deal with flaky tests?","a":"I chase down the root cause instead of just rerunning the pipeline.","a_ko":"파이프라인을 다시 돌리기만 하지 않고 근본 원인을 끝까지 찾아냅니다."},"collocations":["chase down a bug","chase a deadline","chase people for updates"],"related":["catch","purchase","capture","capable"],"tip":"catch와 쌍둥이 단어 (북부 방언 cachier → catch, 중부 chacier → chase)"},{"id":"d05-B11","day":5,"level":1,"set":"B","family":"F5","word":"purchase","pos":"noun","ipa":"/ˈpɜːrtʃəs/","meaning_ko":"구매, 결제","category":"it","etymology":{"parts":[{"text":"pur","type":"prefix","gloss":"~을 위해 (pro)"},{"text":"chase","type":"root","gloss":"쫓다 (captiare ← capere)"}],"story":"고대 프랑스어 porchacier = 얻으려고 쫓아다니다 → 손에 넣다 → 사다"},"example":{"q":"What feature are you proudest of?","a":"I rebuilt our in-app purchase flow and cut payment errors by half.","a_ko":"앱 내 결제 흐름을 다시 만들어 결제 오류를 절반으로 줄였습니다."},"collocations":["in-app purchase","purchase history","make a purchase"],"related":["chase","catch","capture","capacity"],"tip":"발음 /ˈpɜːr.tʃəs/ — '퍼체이스'가 아니라 '퍼처스'"},{"id":"d05-B12","day":5,"level":1,"set":"B","family":"F5","word":"surprise","pos":"noun","ipa":"/sərˈpraɪz/","meaning_ko":"놀라움, 뜻밖의 일","category":"interview","etymology":{"parts":[{"text":"sur","type":"prefix","gloss":"위에서 (super)"},{"text":"prise","type":"root","gloss":"잡다 (prehendere)"}],"story":"고대 프랑스어 surprendre = 위에서 덮쳐 잡다 → 불시에 덮침 → 놀라움"},"example":{"q":"What surprised you most in your current job?","a":"The biggest surprise was how much I enjoyed mentoring interns.","a_ko":"가장 뜻밖이었던 건 인턴 멘토링이 생각보다 훨씬 즐거웠다는 점입니다."},"collocations":["no surprises","to my surprise","a pleasant surprise"],"related":["enterprise","comprise","apprise","apprenticeship"],"tip":"'No surprises'는 일정·위험을 미리 공유하는 습관을 말할 때 좋음"},{"id":"d05-B13","day":5,"level":1,"set":"B","family":"F5","word":"enterprise","pos":"noun","ipa":"/ˈentərpraɪz/","meaning_ko":"기업, 기업용 (대기업 대상)","category":"it","etymology":{"parts":[{"text":"enter","type":"prefix","gloss":"사이에 (entre ← inter)"},{"text":"prise","type":"root","gloss":"잡다 (prehendere)"}],"story":"고대 프랑스어 entreprendre = 손에 잡아 떠맡다 → 떠맡은 일 → 사업 → 기업"},"example":{"q":"What kind of software have you built?","a":"I've mostly built enterprise software for banks and insurers.","a_ko":"주로 은행과 보험사를 위한 기업용 소프트웨어를 만들었습니다."},"collocations":["enterprise software","enterprise customer","small and medium-sized enterprises"],"related":["enterprising","entrepreneurial","surprise","comprise"],"tip":"B2B·대기업용 제품을 말할 때 enterprise를 형용사처럼 앞에 붙임"},{"id":"d05-B14","day":5,"level":2,"set":"B","family":"F5","word":"enterprising","pos":"adjective","ipa":"/ˈentərpraɪzɪŋ/","meaning_ko":"진취적인","category":"interview","etymology":{"parts":[{"text":"enter","type":"prefix","gloss":"사이에 (entre ← inter)"},{"text":"pris","type":"root","gloss":"잡다 (prehendere)"},{"text":"ing","type":"suffix","gloss":"~하는"}],"story":"일을 손에 잡아 떠맡는 → 새 일을 적극적으로 벌이는 → 진취적인"},"example":{"q":"How would your colleagues describe you?","a":"They'd probably say I'm enterprising, since I often start small tools that the whole team ends up using.","a_ko":"진취적이라고 할 것 같습니다. 제가 작은 도구를 먼저 만들면 결국 팀 전체가 쓰게 되는 경우가 많거든요."},"collocations":["an enterprising engineer","enterprising spirit"],"related":["enterprise","entrepreneurial","surprise","comprise"],"tip":"proactive와 비슷하지만 '새로운 일을 벌이는' 쪽에 무게"},{"id":"d05-B15","day":5,"level":2,"set":"B","family":"F5","word":"comprise","pos":"verb","ipa":"/kəmˈpraɪz/","meaning_ko":"~로 구성되다","category":"it","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"함께"},{"text":"prise","type":"root","gloss":"잡다 (prehendere)"}],"story":"고대 프랑스어 compris(comprendre의 과거분사) = 함께 붙잡은 → 한데 품다 → ~로 이루어지다"},"example":{"q":"Can you describe the system architecture?","a":"The platform comprises four services, and each one owns its own database to keep the teams independent.","a_ko":"플랫폼은 서비스 네 개로 이루어져 있고, 팀이 독립적으로 움직이도록 서비스마다 자기 DB를 따로 가집니다."},"collocations":["comprise A and B","be comprised of","the team comprises"],"related":["surprise","enterprise","apprise","apprenticeship"],"tip":"정석은 'A comprises B'(of 없이). consist of와 같은 뜻"},{"id":"d05-B16","day":5,"level":2,"set":"B","family":"F5","word":"apprenticeship","pos":"noun","ipa":"/əˈprentɪsʃɪp/","meaning_ko":"견습 과정","category":"interview","etymology":{"parts":[{"text":"ap","type":"prefix","gloss":"~쪽으로 (ad)"},{"text":"prent","type":"root","gloss":"잡다·배우다 (prehendere)"},{"text":"ice","type":"suffix","gloss":"~하는 사람"},{"text":"ship","type":"suffix","gloss":"신분·과정 (영어)"}],"story":"apprehendere(붙잡다) → 고대 프랑스어 aprendre(배우다) → aprentis(배우는 사람) → 견습 과정"},"example":{"q":"How did you get into software engineering?","a":"I joined a one-year apprenticeship program, where I learned by pairing with senior developers every day.","a_ko":"1년짜리 견습 프로그램에 들어가 매일 시니어 개발자와 페어로 일하며 배웠습니다."},"collocations":["apprenticeship program","serve an apprenticeship","software apprenticeship"],"related":["apprise","comprise","surprise","enterprise"],"tip":"apprentice = 견습생. 부트캠프·인턴 경력을 설명할 때 활용"},{"id":"d05-B17","day":5,"level":3,"set":"B","family":"F5","word":"entrepreneurial","pos":"adjective","ipa":"/ˌɑːntrəprəˈnɜːriəl/","meaning_ko":"기업가적인, 주도적인","category":"interview","etymology":{"parts":[{"text":"entre","type":"prefix","gloss":"사이에 (inter)"},{"text":"pren","type":"root","gloss":"잡다 (prehendere)"},{"text":"eur","type":"suffix","gloss":"~하는 사람"},{"text":"ial","type":"suffix","gloss":"~의, ~한"}],"story":"entreprendre(떠맡다) → 일을 떠맡는 사람(entrepreneur) → 기업가 → 기업가다운"},"example":{"q":"Why do you want to join a startup?","a":"I'm drawn to entrepreneurial environments where engineers talk to customers directly and own outcomes, not just tickets.","a_ko":"엔지니어가 고객과 직접 이야기하고, 티켓이 아니라 결과를 책임지는 기업가적인 환경에 끌립니다."},"collocations":["entrepreneurial mindset","entrepreneurial spirit","entrepreneurial culture"],"related":["enterprise","enterprising","surprise","comprise"],"tip":"강세는 -neur-에. 스타트업 지원 동기에 딱 맞는 단어"},{"id":"d05-B18","day":5,"level":3,"set":"B","family":"F5","word":"apprise","pos":"verb","ipa":"/əˈpraɪz/","meaning_ko":"(진행 상황을) 알리다","category":"interview","etymology":{"parts":[{"text":"ap","type":"prefix","gloss":"~쪽으로 (ad)"},{"text":"prise","type":"root","gloss":"잡다·배우다 (prehendere)"}],"story":"apprehendere → 프랑스어 apprendre(배우다·가르치다)의 과거분사 appris → 알게 하다 → 알리다"},"example":{"q":"How do you communicate during a long migration?","a":"I keep stakeholders apprised of progress with a short weekly update, so nobody is surprised when a milestone slips.","a_ko":"매주 짧은 업데이트로 이해관계자들에게 진행 상황을 알려서, 마일스톤이 밀려도 놀라는 사람이 없게 합니다."},"collocations":["keep someone apprised of","be apprised of","fully apprised"],"related":["apprenticeship","comprise","surprise","enterprise"],"tip":"'keep you posted'의 격식체. appraise(평가하다)와 헷갈리지 않기"},{"id":"d05-B19","day":5,"level":1,"set":"B","family":"F5","word":"consume","pos":"verb","ipa":"/kənˈsuːm/","meaning_ko":"소비하다, (데이터를) 받아 쓰다","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"완전히 (com)"},{"text":"sume","type":"root","gloss":"취하다 (sumere)"}],"story":"consumere = 완전히 취하다 → 다 써 버리다 → 소비하다"},"example":{"q":"What does your service do?","a":"It consumes events from Kafka and updates the search index.","a_ko":"Kafka에서 이벤트를 받아서 검색 인덱스를 갱신합니다."},"collocations":["consume an API","consume messages","consume memory"],"related":["consumption","resume","resumption","presume"],"tip":"메시지 큐에서 consumer(소비자)와 producer(생산자)가 짝"},{"id":"d05-B20","day":5,"level":1,"set":"B","family":"F5","word":"consumption","pos":"noun","ipa":"/kənˈsʌmpʃən/","meaning_ko":"소비, 사용량","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"완전히 (com)"},{"text":"sump","type":"root","gloss":"취하다 (sumere)"},{"text":"tion","type":"suffix","gloss":"~함 (명사)"}],"story":"완전히 취해 써 버림 → 소비 → 자원 사용량"},"example":{"q":"What performance improvement are you proud of?","a":"I cut the app's memory consumption by forty percent.","a_ko":"앱의 메모리 사용량을 40% 줄였습니다."},"collocations":["memory consumption","power consumption","reduce consumption"],"related":["consume","resumption","presume","resume"],"tip":"consume → consumption에서 p가 끼어듦 (sumere의 과거분사 sumptum)"},{"id":"d05-B21","day":5,"level":1,"set":"B","family":"F5","word":"resume","pos":"noun","ipa":"/ˈrezəmeɪ/","meaning_ko":"이력서","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"sume","type":"root","gloss":"취하다 (sumere)"}],"story":"resumere = 다시 취하다 → 프랑스어 résumer(요약하다) → résumé(요약본) → 이력서"},"example":{"q":"Can you walk me through your resume?","a":"Sure, my resume starts with five years of backend work in fintech.","a_ko":"네, 제 이력서는 핀테크 분야 백엔드 경력 5년으로 시작합니다."},"collocations":["walk through my resume","update my resume","a gap in my resume"],"related":["resumption","consume","presume","consumption"],"tip":"명사 '이력서'는 /ˈrez.ə.meɪ/(résumé), 동사 '재개하다'는 /rɪˈzuːm/ — 발음이 다름"},{"id":"d05-B22","day":5,"level":2,"set":"B","family":"F5","word":"resumption","pos":"noun","ipa":"/rɪˈzʌmpʃən/","meaning_ko":"재개","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"sump","type":"root","gloss":"취하다 (sumere)"},{"text":"tion","type":"suffix","gloss":"~함 (명사)"}],"story":"다시 취함 → 멈췄던 것을 다시 시작함 → 재개"},"example":{"q":"Walk me through how you handled that outage.","a":"After the fix, I managed a gradual resumption of traffic, ramping from ten percent to full load over an hour.","a_ko":"수정 후에는 트래픽을 10%에서 시작해 한 시간에 걸쳐 전체 부하까지 단계적으로 재개했습니다."},"collocations":["resumption of service","gradual resumption","resumption of work"],"related":["resume","consumption","consume","presume"],"tip":"동사 resume(/rɪˈzuːm/ 재개하다)의 명사형"},{"id":"d05-B23","day":5,"level":1,"set":"B","family":"F5","word":"step up","pos":"phrasal verb","ipa":"/step ˈʌp/","meaning_ko":"(책임을 맡으려) 나서다, 한 단계 올라서다","category":"interview","etymology":{"parts":[{"text":"step","type":"part","gloss":"걸음 (고대 영어)"},{"text":"up","type":"part","gloss":"위로"}],"story":"한 걸음 위로 올라서다 → 책임을 지려고 앞으로 나서다"},"example":{"q":"Tell me about a time you showed leadership.","a":"When our lead left, I stepped up and ran sprint planning.","a_ko":"리드가 퇴사했을 때 제가 나서서 스프린트 계획을 맡았습니다."},"collocations":["step up to the challenge","step up as a leader","step up my game"],"related":["grow","upskill","skill set"],"tip":"리더십 질문에서 '자원해서 맡았다'를 한 마디로"},{"id":"d05-B24","day":5,"level":2,"set":"B","family":"F5","word":"skill set","pos":"noun","ipa":"/ˈskɪl set/","meaning_ko":"보유 기술, 역량 조합","category":"interview","etymology":{"parts":[{"text":"skill","type":"part","gloss":"기술·솜씨 (고대 노르드어 skil)"},{"text":"set","type":"part","gloss":"한 벌·묶음"}],"story":"기술 + 한 벌 → 한 사람이 가진 기술의 조합"},"example":{"q":"Why are you a good fit for this role?","a":"My skill set combines backend development and data engineering, which matches the hybrid work this team does.","a_ko":"제 역량은 백엔드 개발과 데이터 엔지니어링을 아우르고, 이 팀이 하는 복합적인 업무와 잘 맞습니다."},"collocations":["broaden my skill set","a diverse skill set","technical skill set"],"related":["upskill","strength","learning curve"],"tip":"skillset처럼 붙여 쓰기도 함. skills보다 '조합'을 강조"},{"id":"d05-B25","day":5,"level":2,"set":"B","family":"F5","word":"upskill","pos":"verb","ipa":"/ˈʌpskɪl/","meaning_ko":"역량을 끌어올리다, 기술을 더 익히다","category":"interview","etymology":{"parts":[{"text":"up","type":"part","gloss":"위로"},{"text":"skill","type":"part","gloss":"기술 (고대 노르드어 skil)"}],"story":"기술을 위로 올리다 → 지금 분야에서 기술 수준을 한 단계 높이다"},"example":{"q":"How do you keep your skills current?","a":"I set aside a few hours each week to upskill, and recently I finished a Kubernetes certification.","a_ko":"매주 몇 시간씩 따로 떼어 역량을 키우고 있고, 최근에는 쿠버네티스 자격증을 땄습니다."},"collocations":["upskill the team","upskill in AI","upskilling program"],"related":["skill set","grow","learning curve"],"tip":"reskill(다른 분야로 전환)과 구분: upskill은 지금 분야에서 한 단계 위로"},{"id":"d05-C01","day":5,"level":1,"set":"C","family":"F5","word":"obtain","pos":"verb","ipa":"/əbˈteɪn/","meaning_ko":"얻다, 받아 오다","category":"it","etymology":{"parts":[{"text":"ob","type":"prefix","gloss":"~을 향해"},{"text":"tain","type":"root","gloss":"쥐다 (ten ← tenere)"}],"story":"obtinere = ~을 향해 붙잡아 쥐다 → 손에 넣다 → 얻다"},"example":{"q":"How does your app authenticate users?","a":"The client obtains a token from our auth server at login.","a_ko":"로그인할 때 클라이언트가 인증 서버에서 토큰을 받아 옵니다."},"collocations":["obtain a token","obtain approval","obtain a certification"],"related":["retain","pertain","entertain","tenant"],"tip":"get의 격식체. 자격증·승인을 '취득하다'에도 씀"},{"id":"d05-C02","day":5,"level":1,"set":"C","family":"F5","word":"continue","pos":"verb","ipa":"/kənˈtɪnjuː/","meaning_ko":"계속하다","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께 (com)"},{"text":"tin","type":"root","gloss":"쥐다 (ten ← tenere)"},{"text":"ue","type":"suffix","gloss":"동사 어미"}],"story":"continere(함께 붙잡고 있다) → continuus(끊김 없이 이어진) → 계속하다"},"example":{"q":"Why do you want to stay in backend development?","a":"I want to continue building systems that handle real scale.","a_ko":"실제 대규모 트래픽을 처리하는 시스템을 계속 만들고 싶습니다."},"collocations":["continue to grow","continue working on","continue learning"],"related":["continuous","retain","obtain","tenant"],"tip":"continue to do / continue doing 둘 다 가능"},{"id":"d05-C03","day":5,"level":1,"set":"C","family":"F5","word":"continuous","pos":"adjective","ipa":"/kənˈtɪnjuəs/","meaning_ko":"지속적인, 끊김 없는","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께 (com)"},{"text":"tin","type":"root","gloss":"쥐다 (ten ← tenere)"},{"text":"uous","type":"suffix","gloss":"~한 (형용사)"}],"story":"함께 붙잡고 있는 → 끊기지 않고 이어진 → 지속적인"},"example":{"q":"What does your CI/CD setup look like?","a":"We use continuous integration, so every commit runs the full test suite.","a_ko":"지속적 통합(CI)을 써서 커밋마다 전체 테스트가 돌아갑니다."},"collocations":["continuous integration (CI)","continuous delivery","continuous improvement"],"related":["continue","content","retention","obtain"],"tip":"continuous(끊김 없이 계속) vs continual(자주 반복해서) 차이 주의"},{"id":"d05-C04","day":5,"level":1,"set":"C","family":"F5","word":"content","pos":"noun","ipa":"/ˈkɑːntent/","meaning_ko":"콘텐츠, 내용","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께 (com)"},{"text":"tent","type":"root","gloss":"쥐다 (ten ← tenere)"}],"story":"continere(담고 있다)의 과거분사 contentum → 안에 담긴 것 → 내용·콘텐츠"},"example":{"q":"What kind of product did you work on?","a":"I built a content management system for a news website.","a_ko":"뉴스 사이트용 콘텐츠 관리 시스템(CMS)을 만들었습니다."},"collocations":["content management system (CMS)","user-generated content","content delivery network (CDN)"],"related":["continue","continuous","retain","tenant"],"tip":"명사 /ˈkɑːn.tent/(내용), 형용사 /kənˈtent/(만족한) — 강세 위치가 다름"},{"id":"d05-C05","day":5,"level":2,"set":"C","family":"F5","word":"retain","pos":"verb","ipa":"/rɪˈteɪn/","meaning_ko":"유지하다, (인재·지식을) 붙잡아 두다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤에·다시"},{"text":"tain","type":"root","gloss":"쥐다 (ten ← tenere)"}],"story":"retinere = 뒤에서 꽉 쥐고 있다 → 놓치지 않고 간직하다 → 유지하다"},"example":{"q":"How do you make sure knowledge isn't lost when people leave?","a":"I write short design docs for every major choice, so the team retains context even after people move on.","a_ko":"중요한 결정마다 짧은 설계 문서를 남겨서, 사람이 떠나도 팀이 맥락을 잃지 않게 합니다."},"collocations":["retain talent","retain knowledge","retain customers"],"related":["retention","obtain","continue","tenant"],"tip":"keep의 격식체. 인재 유지(retain talent)는 면접관이 좋아하는 화제"},{"id":"d05-C06","day":5,"level":2,"set":"C","family":"F5","word":"retention","pos":"noun","ipa":"/rɪˈtenʃən/","meaning_ko":"보존(기간), 유지율","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤에·다시"},{"text":"ten","type":"root","gloss":"쥐다 (tenere)"},{"text":"tion","type":"suffix","gloss":"~함 (명사)"}],"story":"뒤에서 쥐고 있음 → 붙잡아 둠 → 보존·유지"},"example":{"q":"How did you reduce your storage costs?","a":"I set a thirty-day retention policy for debug logs, which cut our storage bill by about half.","a_ko":"디버그 로그 보존 기간을 30일로 정해서 스토리지 비용을 절반 정도 줄였습니다."},"collocations":["data retention","retention policy","user retention"],"related":["retain","obtain","continuous","tenant"],"tip":"IT에서는 '데이터 보존 기간', 서비스 지표에서는 '사용자 유지율'"},{"id":"d05-C07","day":5,"level":2,"set":"C","family":"F5","word":"tenant","pos":"noun","ipa":"/ˈtenənt/","meaning_ko":"테넌트 (서비스를 함께 쓰는 고객 단위)","category":"it","etymology":{"parts":[{"text":"ten","type":"root","gloss":"쥐다 (tenere)"},{"text":"ant","type":"suffix","gloss":"~하는 사람"}],"story":"고대 프랑스어 tenir(보유하다)의 현재분사 → 땅을 쥐고 있는 사람 → 세입자 → 시스템을 빌려 쓰는 고객 단위"},"example":{"q":"What was challenging about your SaaS platform?","a":"Because hundreds of tenants shared one cluster, I had to make sure one tenant's traffic spike never slowed down the others.","a_ko":"수백 개 테넌트가 클러스터 하나를 함께 써서, 한 테넌트의 트래픽 급증이 다른 테넌트를 느리게 만들지 않도록 해야 했습니다."},"collocations":["multi-tenant","tenant isolation","tenant ID"],"related":["tenet","untenable","retain","content"],"tip":"원래 뜻은 '세입자'. SaaS에서는 고객사 하나 = tenant 하나"},{"id":"d05-C08","day":5,"level":2,"set":"C","family":"F5","word":"pertain","pos":"verb","ipa":"/pərˈteɪn/","meaning_ko":"(~에) 관련되다","category":"interview","etymology":{"parts":[{"text":"per","type":"prefix","gloss":"완전히·끝까지"},{"text":"tain","type":"root","gloss":"쥐다 (ten ← tenere)"}],"story":"pertinere = 끝까지 뻗어 닿아 있다 → ~에 속하다 → 관련되다"},"example":{"q":"Do you have any questions for us?","a":"Yes, one question pertains to the on-call rotation: how often would I be on call in the first year?","a_ko":"네, 당직 순번에 관한 질문이 하나 있습니다. 첫해에는 얼마나 자주 당직을 서게 되나요?"},"collocations":["pertain to","pertaining to","issues pertaining to"],"related":["pertinent","retain","obtain","entertain"],"tip":"relate to의 격식체. 'pertaining to ~'(~에 관한)로 자주 씀"},{"id":"d05-C09","day":5,"level":2,"set":"C","family":"F5","word":"pertinent","pos":"adjective","ipa":"/ˈpɜːrtnənt/","meaning_ko":"관련 있는, 적절한","category":"it","etymology":{"parts":[{"text":"per","type":"prefix","gloss":"완전히·끝까지"},{"text":"tin","type":"root","gloss":"쥐다 (ten ← tenere)"},{"text":"ent","type":"suffix","gloss":"~한 (형용사)"}],"story":"pertinere(~에 닿아 있다) → 딱 관련된 → 적절한"},"example":{"q":"How do you write a good bug report?","a":"I attach only the pertinent logs and steps to reproduce, so the next engineer doesn't have to dig through noise.","a_ko":"관련 있는 로그와 재현 단계만 첨부해서, 다음 엔지니어가 불필요한 정보를 뒤질 필요가 없게 합니다."},"collocations":["pertinent information","pertinent details","highly pertinent"],"related":["pertain","retain","tenant","tenet"],"tip":"relevant의 격식체. 반대말 impertinent는 '무례한'이라는 뜻이니 주의"},{"id":"d05-C10","day":5,"level":2,"set":"C","family":"F5","word":"entertain","pos":"verb","ipa":"/ˌentərˈteɪn/","meaning_ko":"(생각·제안을) 고려하다, 즐겁게 하다","category":"interview","etymology":{"parts":[{"text":"enter","type":"prefix","gloss":"사이에 (entre ← inter)"},{"text":"tain","type":"root","gloss":"쥐다 (ten ← tenere)"}],"story":"고대 프랑스어 entretenir = 사이에서 붙들고 있다 → 유지하다·대접하다 → 생각을 마음에 품다 → 고려하다"},"example":{"q":"What do you do when a teammate proposes a different approach?","a":"I'm always willing to entertain other approaches, as long as we compare them with real data.","a_ko":"실제 데이터로 비교만 한다면 다른 접근 방식도 언제든 기꺼이 고려합니다."},"collocations":["entertain an idea","entertain a proposal","entertain the possibility"],"related":["retain","obtain","pertain","tenet"],"tip":"면접에서는 '즐겁게 하다'보다 '(생각을) 고려하다'라는 뜻으로 씀"},{"id":"d05-C11","day":5,"level":3,"set":"C","family":"F5","word":"tenet","pos":"noun","ipa":"/ˈtenɪt/","meaning_ko":"신조, 원칙","category":"interview","etymology":{"parts":[{"text":"ten","type":"root","gloss":"쥐다 (tenere)"},{"text":"et","type":"suffix","gloss":"그가 ~한다 (라틴어 3인칭 어미)"}],"story":"라틴어 tenet = '그는 (그렇게) 굳게 쥐고 있다' → 굳게 지키는 믿음 → 신조"},"example":{"q":"What engineering values matter most to you?","a":"A core tenet of mine is that every alert should be actionable; if nobody needs to act on it, I'd rather delete it.","a_ko":"제 핵심 신조 중 하나는 모든 알림이 행동으로 이어져야 한다는 것입니다. 아무도 대응할 필요가 없는 알림이라면 차라리 지웁니다."},"collocations":["a core tenet","basic tenets","the tenets of agile"],"related":["tenant","untenable","retain","pertinent"],"tip":"principle보다 '굳게 믿고 지키는 신조' 느낌. tenant(/ˈtenənt/)와 발음 구분"},{"id":"d05-C12","day":5,"level":3,"set":"C","family":"F5","word":"untenable","pos":"adjective","ipa":"/ʌnˈtenəbl/","meaning_ko":"유지할 수 없는, 버틸 수 없는","category":"interview","etymology":{"parts":[{"text":"un","type":"prefix","gloss":"~아닌"},{"text":"ten","type":"root","gloss":"쥐다 (tenere)"},{"text":"able","type":"suffix","gloss":"~할 수 있는"}],"story":"붙들고 있을 수 없는 → (입장·상황을) 지킬 수 없는 → 더는 버틸 수 없는"},"example":{"q":"Why did you push for the rewrite?","a":"With releases taking four hours and failing half the time, the situation had become untenable, so I proposed breaking up the monolith in stages.","a_ko":"배포가 네 시간씩 걸리고 절반은 실패하는 상황이라 더는 버틸 수 없어서, 모놀리스를 단계적으로 나누자고 제안했습니다."},"collocations":["an untenable situation","an untenable position","become untenable"],"related":["tenet","tenant","retain","continue"],"tip":"unsustainable과 비슷. '이대로는 안 된다'를 격식 있게 말할 때"},{"id":"d05-C13","day":5,"level":2,"set":"C","family":"F5","word":"presume","pos":"verb","ipa":"/prɪˈzuːm/","meaning_ko":"(확인 없이) 짐작하다, 추정하다","category":"interview","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"미리"},{"text":"sume","type":"root","gloss":"취하다 (sumere)"}],"story":"praesumere = 미리 취하다 → 확인하기 전에 사실로 받아들이다 → 짐작하다"},"example":{"q":"How do you approach a ticket with vague requirements?","a":"I don't presume I know what the user wants; I ask the product manager a few quick questions first.","a_ko":"사용자가 원하는 걸 안다고 짐작하지 않고, 먼저 PM에게 짧게 몇 가지 질문합니다."},"collocations":["presume that","I presume","presumed to be"],"related":["presumptuous","subsume","consume","resume"],"tip":"assume과 비슷하지만 presume은 '어느 정도 근거가 있는 짐작'"},{"id":"d05-C14","day":5,"level":3,"set":"C","family":"F5","word":"presumptuous","pos":"adjective","ipa":"/prɪˈzʌmptʃuəs/","meaning_ko":"주제넘은","category":"interview","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"미리"},{"text":"sump","type":"root","gloss":"취하다 (sumere)"},{"text":"tuous","type":"suffix","gloss":"~한 (형용사)"}],"story":"미리 취해 버리는 → 허락도 받기 전에 나서는 → 주제넘은"},"example":{"q":"Do you have any questions for us?","a":"I don't want to be presumptuous, but if I join the team, could you tell me what my first project would likely be?","a_ko":"주제넘은 질문일 수도 있지만, 혹시 제가 팀에 합류하게 된다면 첫 프로젝트는 무엇이 될지 여쭤봐도 될까요?"},"collocations":["I don't want to be presumptuous, but","seem presumptuous","a presumptuous question"],"related":["presume","subsume","consumption","resumption"],"tip":"'I don't want to be presumptuous, but ~'는 조심스럽게 질문을 꺼내는 통문장"},{"id":"d05-C15","day":5,"level":2,"set":"C","family":"F5","word":"subsume","pos":"verb","ipa":"/səbˈsuːm/","meaning_ko":"(더 큰 것에) 포함시키다, 흡수하다","category":"it","etymology":{"parts":[{"text":"sub","type":"prefix","gloss":"아래에"},{"text":"sume","type":"root","gloss":"취하다 (sumere)"}],"story":"아래로 취해 넣다 → 더 큰 범주 안에 포함시키다"},"example":{"q":"How did you simplify the codebase?","a":"We had three logging libraries, so I subsumed them into one shared module with a single configuration.","a_ko":"로깅 라이브러리가 세 개나 있어서, 설정 하나로 관리되는 공통 모듈 하나로 흡수해 통합했습니다."},"collocations":["subsume into","be subsumed under","subsume a role"],"related":["presume","consume","resume","presumptuous"],"tip":"merge보다 '큰 쪽이 작은 쪽을 품는다'는 느낌. 문어체"},{"id":"d05-C16","day":5,"level":1,"set":"C","family":"F5","word":"ability","pos":"noun","ipa":"/əˈbɪləti/","meaning_ko":"능력","category":"interview","etymology":{"parts":[{"text":"abil","type":"root","gloss":"다루기 쉬운 (habilis ← habere)"},{"text":"ity","type":"suffix","gloss":"~함 (명사)"}],"story":"habere(쥐다) → habilis(손에 쥐고 다루기 쉬운) → habilitas → 고대 프랑스어 ableté → 능력"},"example":{"q":"What makes you a good team player?","a":"My ability to explain technical ideas simply helps the whole team.","a_ko":"기술적인 내용을 쉽게 설명하는 능력이 팀 전체에 도움이 됩니다."},"collocations":["ability to + 동사","to the best of my ability","leadership ability"],"related":["enable","disable","exhibit","prohibit"],"tip":"ability to do. 'to the best of my ability'(최선을 다해)도 함께 외우기"},{"id":"d05-C17","day":5,"level":1,"set":"C","family":"F5","word":"enable","pos":"verb","ipa":"/ɪˈneɪbl/","meaning_ko":"가능하게 하다, (기능을) 켜다","category":"it","etymology":{"parts":[{"text":"en","type":"prefix","gloss":"~하게 만들다"},{"text":"able","type":"root","gloss":"할 수 있는 (habilis ← habere)"}],"story":"할 수 있게 만들다 → 가능하게 하다 → 기능을 켜다"},"example":{"q":"How do you release risky features?","a":"I hide them behind feature flags and enable them gradually.","a_ko":"위험한 기능은 피처 플래그 뒤에 숨겨 두고 조금씩 켭니다."},"collocations":["enable a feature","enable the team to","enable logging"],"related":["disable","ability","exhibit","prohibit"],"tip":"enable A to do = A가 ~할 수 있게 하다. 설정을 '켜다'로도 씀"},{"id":"d05-C18","day":5,"level":1,"set":"C","family":"F5","word":"disable","pos":"verb","ipa":"/dɪsˈeɪbl/","meaning_ko":"(기능을) 끄다, 비활성화하다","category":"it","etymology":{"parts":[{"text":"dis","type":"prefix","gloss":"반대로·없애다"},{"text":"able","type":"root","gloss":"할 수 있는 (habilis ← habere)"}],"story":"할 수 있는 상태를 없애다 → 못 하게 하다 → 기능을 끄다"},"example":{"q":"What did you do first during the incident?","a":"I disabled the new feature flag right away to stop the errors.","a_ko":"오류를 멈추려고 새 기능 플래그부터 바로 껐습니다."},"collocations":["disable a feature","disable caching","temporarily disable"],"related":["enable","ability","prohibit","exhibit"],"tip":"turn off의 IT 용어. 명사 disability는 '장애'라는 뜻이니 문맥 주의"},{"id":"d05-C19","day":5,"level":1,"set":"C","family":"F5","word":"debt","pos":"noun","ipa":"/det/","meaning_ko":"빚, 부채","category":"it","etymology":{"parts":[{"text":"debt","type":"root","gloss":"빚지다 (debere ← de + habere)"}],"story":"de(떨어져) + habere(가지다) → debere(남의 것을 가지고 있다 = 빚지다) → debitum → 빚 → 기술 부채"},"example":{"q":"How do you balance new features and code quality?","a":"I set aside some time each sprint to pay down technical debt.","a_ko":"스프린트마다 일정 시간을 떼어 기술 부채를 갚습니다."},"collocations":["technical debt","pay down debt","accumulate debt"],"related":["indebted","duty","due","endeavor"],"tip":"b는 묵음 /det/. 라틴어 debitum을 따라 철자에만 b를 다시 넣은 것"},{"id":"d05-C20","day":5,"level":2,"set":"C","family":"F5","word":"indebted","pos":"adjective","ipa":"/ɪnˈdetɪd/","meaning_ko":"신세를 진, (은혜를 입어) 고마운","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안으로"},{"text":"debt","type":"root","gloss":"빚 (debere ← de + habere)"},{"text":"ed","type":"suffix","gloss":"~된"}],"story":"빚 안에 들어간 → 빚진 → 은혜를 입은"},"example":{"q":"Who has shaped your career most?","a":"I'm deeply indebted to my first mentor, who taught me to read code before writing it.","a_ko":"첫 멘토에게 큰 신세를 졌습니다. 코드를 쓰기 전에 먼저 읽는 법을 가르쳐 주셨거든요."},"collocations":["indebted to","deeply indebted","forever indebted"],"related":["debt","duty","due","endeavor"],"tip":"grateful보다 '은혜를 입었다'는 깊은 감사. b는 묵음"},{"id":"d05-C21","day":5,"level":1,"set":"C","family":"F5","word":"duty","pos":"noun","ipa":"/ˈduːti/","meaning_ko":"직무, 의무","category":"interview","etymology":{"parts":[{"text":"du","type":"root","gloss":"빚진·마땅한 (debere)"},{"text":"ty","type":"suffix","gloss":"~함 (명사)"}],"story":"debere(빚지다) → 고대 프랑스어 deu(마땅히 해야 할) → 해야 할 일 → 직무·의무"},"example":{"q":"What are your main duties now?","a":"My main duty is building APIs, and I also review most of the team's pull requests.","a_ko":"주된 업무는 API 개발이고, 팀 풀 리퀘스트도 대부분 제가 리뷰합니다."},"collocations":["main duties","on duty","duties and responsibilities"],"related":["due","debt","indebted","endeavor"],"tip":"'맡은 업무 목록'에 가까운 말. 답변에서는 duties 뒤에 성과를 붙여 말하기"},{"id":"d05-C22","day":5,"level":1,"set":"C","family":"F5","word":"due","pos":"adjective","ipa":"/duː/","meaning_ko":"~때문인, (기한이) 예정된","category":"interview","etymology":{"parts":[{"text":"due","type":"root","gloss":"빚진·마땅한 (debere)"}],"story":"debere(빚지다)의 과거분사 → 고대 프랑스어 deu(갚아야 할) → 기한이 된 → ~에 돌려야 할(~때문인)"},"example":{"q":"Why did you leave your last company?","a":"I left due to a reorganization that removed my team.","a_ko":"제 팀이 없어지는 조직 개편 때문에 퇴사했습니다."},"collocations":["due to","due date","in due course"],"related":["duty","debt","indebted","endeavor"],"tip":"due to + 명사 = ~때문에. 퇴사 이유를 부정적이지 않게 설명할 때 좋음"},{"id":"d05-C23","day":5,"level":2,"set":"C","family":"F5","word":"endeavor","pos":"noun","ipa":"/ɪnˈdevər/","meaning_ko":"노력, 시도","category":"interview","etymology":{"parts":[{"text":"en","type":"prefix","gloss":"~안에"},{"text":"deavor","type":"root","gloss":"의무 (devoir ← debere)"}],"story":"고대 프랑스어 mettre en deveir(의무로 삼다) → 의무로 여기고 힘쓰다 → 노력·시도"},"example":{"q":"What do you do outside of work?","a":"My latest endeavor outside work is an open-source library for parsing invoices, which now has a few hundred users.","a_ko":"요즘 업무 외에 하고 있는 일은 청구서를 파싱하는 오픈소스 라이브러리로, 지금은 사용자가 수백 명 정도 됩니다."},"collocations":["in all my endeavors","a new endeavor","make every endeavor"],"related":["duty","due","debt","indebted"],"tip":"영국식 철자는 endeavour. effort보다 '도전·시도'에 무게"},{"id":"d05-C24","day":5,"level":1,"set":"C","family":"F5","word":"feedback","pos":"noun","ipa":"/ˈfiːdbæk/","meaning_ko":"피드백, 의견","category":"interview","etymology":{"parts":[{"text":"feed","type":"part","gloss":"먹이다·공급하다"},{"text":"back","type":"part","gloss":"되돌려"}],"story":"출력을 다시 입력으로 되먹이다(전자공학 용어) → 결과에 대한 의견"},"example":{"q":"How do you improve as an engineer?","a":"I ask for feedback after every project and act on it quickly.","a_ko":"프로젝트가 끝날 때마다 피드백을 요청하고 바로 반영합니다."},"collocations":["ask for feedback","constructive feedback","give feedback"],"related":["grow","upskill","learning curve"],"tip":"셀 수 없는 명사: a feedback (X) → some feedback / a piece of feedback"},{"id":"d05-C25","day":5,"level":1,"set":"C","family":"F5","word":"lessons learned","pos":"phrase","ipa":"/ˈlesənz ˌlɝːnd/","meaning_ko":"얻은 교훈","category":"interview","etymology":{"parts":[{"text":"lessons","type":"part","gloss":"배움 (라틴어 lectio 읽기)"},{"text":"learned","type":"part","gloss":"배운 (고대 영어 leornian)"}],"story":"읽고 배운 것 → 경험에서 얻은 교훈"},"example":{"q":"What did you learn from that failed project?","a":"The main lessons learned were to test early and share risks sooner.","a_ko":"가장 큰 교훈은 일찍 테스트하고 위험을 더 빨리 공유하는 것이었습니다."},"collocations":["share lessons learned","key lessons learned"],"related":["lecture","collect","select"],"tip":"실패 경험 질문의 답을 마무리할 때 쓰는 정석 표현"},{"id":"d05-D01","day":5,"level":1,"set":"D","family":"F5","word":"attract","pos":"verb","ipa":"/əˈtrækt/","meaning_ko":"끌어들이다, 마음을 끌다","category":"interview","etymology":{"parts":[{"text":"at","type":"prefix","gloss":"~쪽으로 (ad)"},{"text":"tract","type":"root","gloss":"끌다 (trahere)"}],"story":"~쪽으로 끌어당기다 → 마음을 끌다"},"example":{"q":"What attracted you to our company?","a":"Your focus on developer tools attracted me, because I love building for engineers.","a_ko":"개발자 도구에 집중하는 점에 끌렸습니다. 엔지니어를 위한 제품을 만드는 걸 좋아하거든요."},"collocations":["attract talent","attract users","be attracted to"],"related":["attractive","traction","distract","extract"],"tip":"지원 동기 질문 'What attracted you to ~?'에 그대로 받아서 답하기"},{"id":"d05-D02","day":5,"level":1,"set":"D","family":"F5","word":"attractive","pos":"adjective","ipa":"/əˈtræktɪv/","meaning_ko":"매력적인","category":"interview","etymology":{"parts":[{"text":"at","type":"prefix","gloss":"~쪽으로 (ad)"},{"text":"tract","type":"root","gloss":"끌다 (trahere)"},{"text":"ive","type":"suffix","gloss":"~하는 (형용사)"}],"story":"끌어당기는 성질의 → 매력적인"},"example":{"q":"Why does this role interest you?","a":"The chance to work on large-scale data systems is very attractive to me.","a_ko":"대규모 데이터 시스템을 다룰 기회가 저에게 아주 매력적입니다."},"collocations":["an attractive offer","attractive to","highly attractive"],"related":["attract","traction","distraction","extract"],"tip":"외모보다 기회·조건(opportunity, offer)에 많이 씀"},{"id":"d05-D03","day":5,"level":1,"set":"D","family":"F5","word":"distract","pos":"verb","ipa":"/dɪˈstrækt/","meaning_ko":"주의를 흩뜨리다, 방해하다","category":"interview","etymology":{"parts":[{"text":"dis","type":"prefix","gloss":"떨어져·따로"},{"text":"tract","type":"root","gloss":"끌다 (trahere)"}],"story":"다른 쪽으로 떼어 끌다 → 주의를 흩뜨리다"},"example":{"q":"How do you stay focused?","a":"I mute chat for two hours each morning so nothing distracts me.","a_ko":"매일 아침 두 시간은 채팅 알림을 꺼서 방해받지 않게 합니다."},"collocations":["distract from","get distracted","easily distracted"],"related":["distraction","attract","detract","extract"],"tip":"be distracted by ~ = ~때문에 집중을 못 하다"},{"id":"d05-D04","day":5,"level":1,"set":"D","family":"F5","word":"distraction","pos":"noun","ipa":"/dɪˈstrækʃən/","meaning_ko":"방해 요소, 주의 산만","category":"interview","etymology":{"parts":[{"text":"dis","type":"prefix","gloss":"떨어져·따로"},{"text":"tract","type":"root","gloss":"끌다 (trahere)"},{"text":"ion","type":"suffix","gloss":"~것 (명사)"}],"story":"주의를 딴 데로 끄는 것 → 방해 요소"},"example":{"q":"How do you work remotely?","a":"I keep a separate workspace at home to avoid distractions.","a_ko":"방해 요소를 피하려고 집에 따로 작업 공간을 두고 있습니다."},"collocations":["avoid distractions","minimize distractions","without distraction"],"related":["distract","attract","traction","detract"],"tip":"원격 근무 질문에 자주 나오는 단어"},{"id":"d05-D05","day":5,"level":1,"set":"D","family":"F5","word":"extract","pos":"verb","ipa":"/ɪkˈstrækt/","meaning_ko":"추출하다, 뽑아내다","category":"it","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"tract","type":"root","gloss":"끌다 (trahere)"}],"story":"밖으로 끌어내다 → 뽑아내다 → 추출하다"},"example":{"q":"How did you clean up that legacy code?","a":"I extracted the shared logic into small, well-tested functions.","a_ko":"공통 로직을 작고 테스트가 잘된 함수들로 뽑아냈습니다."},"collocations":["extract a method","extract data","extract insights"],"related":["extraction","attract","distract","subtract"],"tip":"리팩터링 기법 'Extract Method'의 그 extract. 동사는 /ɪkˈstrækt/, 명사는 /ˈek.strækt/"},{"id":"d05-D06","day":5,"level":2,"set":"D","family":"F5","word":"extraction","pos":"noun","ipa":"/ɪkˈstrækʃən/","meaning_ko":"추출","category":"it","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"tract","type":"root","gloss":"끌다 (trahere)"},{"text":"ion","type":"suffix","gloss":"~함 (명사)"}],"story":"밖으로 끌어냄 → 추출"},"example":{"q":"Tell me about your data pipeline experience.","a":"I owned the extraction step, pulling data from six source systems every night and validating it before loading.","a_ko":"추출 단계를 맡아 매일 밤 여섯 개 원천 시스템에서 데이터를 가져와 적재 전에 검증했습니다."},"collocations":["data extraction","feature extraction","ETL (extract, transform, load)"],"related":["extract","subtract","trace","traction"],"tip":"ETL의 E. 머신러닝의 feature extraction(특징 추출)으로도 씀"},{"id":"d05-D07","day":5,"level":3,"set":"D","family":"F5","word":"traction","pos":"noun","ipa":"/ˈtrækʃən/","meaning_ko":"호응, 탄력 (성과가 붙기 시작함)","category":"interview","etymology":{"parts":[{"text":"tract","type":"root","gloss":"끌다 (trahere)"},{"text":"ion","type":"suffix","gloss":"~함 (명사)"}],"story":"끄는 힘 → 바퀴가 땅을 붙잡고 나아가는 힘(접지력) → 아이디어·제품이 실제로 앞으로 나아가는 힘 → 호응"},"example":{"q":"Tell me about an idea you championed.","a":"My idea for a shared UI library didn't gain traction at first, so I built a small demo, and within a month three teams had adopted it.","a_ko":"공통 UI 라이브러리 아이디어가 처음에는 호응을 얻지 못해서 작은 데모를 만들었고, 한 달 만에 세 팀이 도입했습니다."},"collocations":["gain traction","get traction","early traction"],"related":["attract","extract","intractable","protracted"],"tip":"'gain traction' = 호응을 얻다·탄력이 붙다. 스타트업·제품 이야기의 단골 표현"},{"id":"d05-D08","day":5,"level":3,"set":"D","family":"F5","word":"intractable","pos":"adjective","ipa":"/ɪnˈtræktəbl/","meaning_ko":"다루기 힘든, 고질적인","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"~아닌"},{"text":"tract","type":"root","gloss":"끌다·다루다 (trahere)"},{"text":"able","type":"suffix","gloss":"~할 수 있는"}],"story":"tractabilis(다룰 수 있는, tractare ← trahere) → 다룰 수 없는 → 고질적인"},"example":{"q":"What's the toughest technical problem you've solved?","a":"A memory leak in our payment service had seemed intractable for months, but I finally reproduced it with a heap dump and traced it to an unclosed stream.","a_ko":"결제 서비스의 메모리 누수가 몇 달 동안 손쓸 수 없어 보였는데, 힙 덤프로 재현해서 닫히지 않은 스트림이 원인이라는 걸 찾아냈습니다."},"collocations":["an intractable problem","seemingly intractable","computationally intractable"],"related":["traction","treat","attract","protracted"],"tip":"computationally intractable(계산상 현실적으로 풀 수 없는)은 알고리즘 용어로도 씀"},{"id":"d05-D09","day":5,"level":3,"set":"D","family":"F5","word":"protracted","pos":"adjective","ipa":"/proʊˈtræktɪd/","meaning_ko":"(질질) 오래 끈","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"tract","type":"root","gloss":"끌다 (trahere)"},{"text":"ed","type":"suffix","gloss":"~된"}],"story":"앞으로 길게 끌어낸 → 질질 늘어진 → 오래 끈"},"example":{"q":"Tell me about a disagreement with your team.","a":"We were stuck in a protracted debate over two databases, so I suggested a one-week spike to test both, and the data settled it.","a_ko":"데이터베이스 두 개를 두고 논쟁이 길어져서, 둘 다 시험해 보는 1주일짜리 스파이크를 제안했고 결국 데이터로 결론이 났습니다."},"collocations":["a protracted debate","protracted negotiations","a protracted outage"],"related":["traction","intractable","retract","detract"],"tip":"long보다 '쓸데없이 길어진'이라는 부정적인 뉘앙스"},{"id":"d05-D10","day":5,"level":2,"set":"D","family":"F5","word":"detract","pos":"verb","ipa":"/dɪˈtrækt/","meaning_ko":"(가치를) 떨어뜨리다","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"떨어져·아래로"},{"text":"tract","type":"root","gloss":"끌다 (trahere)"}],"story":"떼어 끌어내다 → 덜어 내다 → 가치를 깎아내리다"},"example":{"q":"How do you choose what to leave out of a release?","a":"I cut features that would detract from the core experience, even if they're fun to build.","a_ko":"만들기 재미있더라도 핵심 경험을 해치는 기능은 뺍니다."},"collocations":["detract from","detract from the value","not detract"],"related":["distract","retract","attract","protracted"],"tip":"항상 detract from 형태. distract(주의를 흩뜨리다)와 헷갈리지 않기"},{"id":"d05-D11","day":5,"level":2,"set":"D","family":"F5","word":"retract","pos":"verb","ipa":"/rɪˈtrækt/","meaning_ko":"(말·제안을) 철회하다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤로"},{"text":"tract","type":"root","gloss":"끌다 (trahere)"}],"story":"뒤로 끌어당기다 → 내놓은 것을 거둬들이다 → 철회하다"},"example":{"q":"Tell me about a time you were wrong.","a":"I once pushed hard for a caching layer, but I retracted my suggestion after load tests showed it barely helped.","a_ko":"한번은 캐시 계층 도입을 강하게 주장했지만, 부하 테스트에서 거의 효과가 없다고 나와서 제안을 철회했습니다."},"collocations":["retract a statement","retract a suggestion","retract an offer"],"related":["retreat","detract","protracted","attract"],"tip":"틀렸음을 인정하는 답변에서 성숙함을 보여 주는 단어"},{"id":"d05-D12","day":5,"level":1,"set":"D","family":"F5","word":"subtract","pos":"verb","ipa":"/səbˈtrækt/","meaning_ko":"빼다","category":"it","etymology":{"parts":[{"text":"sub","type":"prefix","gloss":"아래에서"},{"text":"tract","type":"root","gloss":"끌다 (trahere)"}],"story":"아래에서 끌어내다 → 빼내다 → 빼다"},"example":{"q":"How did you measure the real processing time?","a":"I subtracted the queue wait time from the total response time.","a_ko":"전체 응답 시간에서 큐 대기 시간을 뺐습니다."},"collocations":["subtract A from B","add and subtract","subtract the overhead"],"related":["extract","attract","distract","trace"],"tip":"subtract A from B = B에서 A를 빼다 (순서 주의)"},{"id":"d05-D13","day":5,"level":1,"set":"D","family":"F5","word":"trait","pos":"noun","ipa":"/treɪt/","meaning_ko":"특성, 성향","category":"interview","etymology":{"parts":[{"text":"trait","type":"root","gloss":"끌다·긋다 (tractus ← trahere)"}],"story":"라틴어 tractus(끈 것, 그은 선) → 프랑스어 trait(획) → 얼굴·성격을 그리는 획 → 특성"},"example":{"q":"What personality trait helps you most at work?","a":"My most useful trait is curiosity, because it keeps me learning.","a_ko":"가장 도움이 되는 제 성향은 호기심입니다. 계속 배우게 해 주거든요."},"collocations":["personality trait","key trait","leadership traits"],"related":["treat","portray","trace","traction"],"tip":"미국식 /treɪt/ (끝 t를 발음). 강점 질문에서 타고난 성향을 말할 때"},{"id":"d05-D14","day":5,"level":1,"set":"D","family":"F5","word":"treat","pos":"verb","ipa":"/triːt/","meaning_ko":"다루다, 취급하다","category":"it","etymology":{"parts":[{"text":"treat","type":"root","gloss":"다루다 (tractare ← trahere)"}],"story":"라틴어 tractare(자꾸 끌다 → 만지다·다루다) → 고대 프랑스어 traitier → 다루다·취급하다"},"example":{"q":"How strict are you about code quality?","a":"I treat compiler warnings as errors, so problems never pile up.","a_ko":"컴파일러 경고를 오류로 취급해서 문제가 쌓이지 않게 합니다."},"collocations":["treat A as B","treat warnings as errors","treat people fairly"],"related":["trait","intractable","portray","retreat"],"tip":"treat A as B = A를 B로 취급하다. '대접하다'라는 뜻도 있음"},{"id":"d05-D15","day":5,"level":2,"set":"D","family":"F5","word":"portray","pos":"verb","ipa":"/pɔːrˈtreɪ/","meaning_ko":"묘사하다, (~로) 그려 보이다","category":"interview","etymology":{"parts":[{"text":"por","type":"prefix","gloss":"앞으로 (pro)"},{"text":"tray","type":"root","gloss":"끌다 (trahere)"}],"story":"protrahere(앞으로 끌어내다) → 고대 프랑스어 portraire(그려 내다) → 묘사하다"},"example":{"q":"How do you present results to non-technical leaders?","a":"I portray the impact in business language, like hours saved or revenue protected, rather than technical metrics.","a_ko":"기술 지표보다는 절약한 시간이나 지켜 낸 매출처럼 비즈니스 언어로 효과를 보여 드립니다."},"collocations":["portray A as B","accurately portray","portray the situation"],"related":["trait","treat","retreat","traction"],"tip":"portrait(초상화)와 같은 뿌리. portray A as B = A를 B로 그리다"},{"id":"d05-D16","day":5,"level":1,"set":"D","family":"F5","word":"train","pos":"verb","ipa":"/treɪn/","meaning_ko":"(모델을) 학습시키다, 훈련하다","category":"it","etymology":{"parts":[{"text":"train","type":"root","gloss":"끌다 (trahere)"}],"story":"trahere → 속라틴어 *traginare → 고대 프랑스어 trainer(끌다) → 끌어 이끌다 → 가르치다·훈련하다"},"example":{"q":"Have you worked with machine learning?","a":"Yes, I trained a model to classify support tickets.","a_ko":"네, 고객 문의 티켓을 분류하는 모델을 학습시켰습니다."},"collocations":["train a model","training data","train new hires"],"related":["training","trace","trait","treat"],"tip":"ML에서 train(학습) / test(평가). 기차 train도 '끌려가는 줄'에서 나온 말"},{"id":"d05-D17","day":5,"level":1,"set":"D","family":"F5","word":"training","pos":"noun","ipa":"/ˈtreɪnɪŋ/","meaning_ko":"교육, 연수","category":"interview","etymology":{"parts":[{"text":"train","type":"root","gloss":"끌다 (trahere)"},{"text":"ing","type":"suffix","gloss":"~하기 (명사)"}],"story":"끌어 이끌기 → 가르치기 → 교육·연수"},"example":{"q":"How did you onboard new team members?","a":"I created a two-week training plan for new backend engineers.","a_ko":"신입 백엔드 엔지니어를 위한 2주짜리 교육 계획을 만들었습니다."},"collocations":["training plan","on-the-job training","receive training"],"related":["train","trait","treat","attract"],"tip":"셀 수 없는 명사: a training (X) → a training program"},{"id":"d05-D18","day":5,"level":1,"set":"D","family":"F5","word":"trace","pos":"verb","ipa":"/treɪs/","meaning_ko":"추적하다","category":"it","etymology":{"parts":[{"text":"trace","type":"root","gloss":"끌다 (tractus ← trahere)"}],"story":"tractus(끈 자국) → 속라틴어 *tractiare → 고대 프랑스어 tracier(자국을 따라가다) → 추적하다"},"example":{"q":"How do you debug slow requests?","a":"I trace each request across services to find the slow step.","a_ko":"요청 하나하나를 서비스 간에 추적해서 느린 단계를 찾습니다."},"collocations":["trace a request","stack trace","distributed tracing"],"related":["traceability","train","trait","extract"],"tip":"stack trace(호출 기록), distributed tracing(분산 추적)으로 IT에서 자주 씀"},{"id":"d05-D19","day":5,"level":2,"set":"D","family":"F5","word":"traceability","pos":"noun","ipa":"/ˌtreɪsəˈbɪləti/","meaning_ko":"추적 가능성","category":"it","etymology":{"parts":[{"text":"trace","type":"root","gloss":"끌다 (tractus ← trahere)"},{"text":"abil","type":"suffix","gloss":"~할 수 있는 (-able)"},{"text":"ity","type":"suffix","gloss":"~함 (명사)"}],"story":"자국을 따라갈 수 있음 → 추적 가능성"},"example":{"q":"How do you handle compliance requirements?","a":"I link every commit to a ticket, so we have full traceability from requirement to release during audits.","a_ko":"모든 커밋을 티켓과 연결해서, 감사 때 요구사항부터 출시까지 전부 추적할 수 있게 합니다."},"collocations":["end-to-end traceability","requirements traceability","ensure traceability"],"related":["trace","extract","train","treat"],"tip":"금융·의료처럼 규제가 있는 업계 면접에서 특히 중요"},{"id":"d05-D20","day":5,"level":2,"set":"D","family":"F5","word":"retreat","pos":"noun","ipa":"/rɪˈtriːt/","meaning_ko":"(팀) 워크숍, 후퇴","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤로"},{"text":"treat","type":"root","gloss":"끌다 (trahere)"}],"story":"retrahere(뒤로 끌다) → 고대 프랑스어 retret(물러남) → 후퇴 → 일상에서 물러나 모이는 자리"},"example":{"q":"How do you build trust on a remote team?","a":"I helped organize our first team retreat, and meeting in person made our async work much smoother afterward.","a_ko":"첫 팀 워크숍을 함께 준비했는데, 직접 만나고 나니 이후 비동기 협업이 훨씬 매끄러워졌습니다."},"collocations":["team retreat","company retreat","retreat from"],"related":["retract","treat","portray","attract"],"tip":"원래 '후퇴'. 회사에서는 일상 업무를 떠나 모이는 워크숍(offsite)"},{"id":"d05-D21","day":5,"level":2,"set":"D","family":"F5","word":"exhibit","pos":"verb","ipa":"/ɪɡˈzɪbɪt/","meaning_ko":"(자질을) 보여 주다, 드러내다","category":"interview","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"hib","type":"root","gloss":"쥐다·가지다 (hab ← habere)"},{"text":"it","type":"suffix","gloss":"동사 어미 (과거분사 -itus)"}],"story":"exhibere = 밖으로 내밀어 쥐고 있다 → 내보이다 → 드러내다"},"example":{"q":"Why do you think you're ready for a senior role?","a":"I've repeatedly exhibited ownership, for example by leading two migrations from start to finish without being asked.","a_ko":"주인의식을 여러 번 보여 왔습니다. 예를 들어 누가 시키지 않아도 마이그레이션 두 건을 처음부터 끝까지 이끌었습니다."},"collocations":["exhibit leadership","exhibit behavior","exhibit symptoms"],"related":["prohibit","prohibitive","ability","enable"],"tip":"show의 격식체. 발음 /ɪɡˈzɪb.ɪt/ — h는 소리 나지 않음"},{"id":"d05-D22","day":5,"level":1,"set":"D","family":"F5","word":"prohibit","pos":"verb","ipa":"/proʊˈhɪbɪt/","meaning_ko":"금지하다","category":"it","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞에"},{"text":"hib","type":"root","gloss":"쥐다·가지다 (hab ← habere)"},{"text":"it","type":"suffix","gloss":"동사 어미 (과거분사 -itus)"}],"story":"prohibere = 앞에서 붙잡아 막다 → 금지하다"},"example":{"q":"How do you keep secrets out of your repository?","a":"Our pipeline prohibits any commit with API keys or passwords.","a_ko":"파이프라인이 API 키나 비밀번호가 들어간 커밋을 아예 막습니다."},"collocations":["prohibit A from -ing","strictly prohibited","prohibit access"],"related":["prohibitive","exhibit","ability","enable"],"tip":"prohibit A from doing = A가 ~하는 것을 금지하다"},{"id":"d05-D23","day":5,"level":2,"set":"D","family":"F5","word":"prohibitive","pos":"adjective","ipa":"/proʊˈhɪbətɪv/","meaning_ko":"(비용이) 엄두를 못 낼 만큼 비싼","category":"it","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞에"},{"text":"hib","type":"root","gloss":"쥐다·가지다 (hab ← habere)"},{"text":"it","type":"suffix","gloss":"동사 어미 (과거분사 -itus)"},{"text":"ive","type":"suffix","gloss":"~하는 (형용사)"}],"story":"앞을 막는 → 비용이 너무 커서 사실상 막아 버리는 → 엄두를 못 낼 만큼 비싼"},"example":{"q":"Why didn't you use a managed service?","a":"At our data volume, the cost of the managed service was prohibitive, so we ran our own cluster instead.","a_ko":"저희 데이터 규모에서는 관리형 서비스 비용이 감당할 수 없을 만큼 비싸서, 대신 클러스터를 직접 운영했습니다."},"collocations":["prohibitive cost","prohibitively expensive","prohibitive for"],"related":["prohibit","exhibit","ability","disable"],"tip":"'prohibitively expensive'(엄두가 안 날 만큼 비싼)로도 자주 씀"},{"id":"d05-D24","day":5,"level":2,"set":"D","family":"F5","word":"learning curve","pos":"noun","ipa":"/ˈlɜːrnɪŋ kɜːrv/","meaning_ko":"학습 곡선, 익히는 데 드는 노력","category":"interview","etymology":{"parts":[{"text":"learning","type":"part","gloss":"배움 (고대 영어 leornian)"},{"text":"curve","type":"part","gloss":"곡선 (curvus 굽은)"}],"story":"배움 + 곡선 → 익숙해지기까지 걸리는 시간과 노력"},"example":{"q":"How quickly can you get up to speed with our stack?","a":"Rust has a steep learning curve, but I've already built two small services with it, so I'm confident I can ramp up quickly.","a_ko":"Rust는 익히기 어려운 편이지만 이미 작은 서비스 두 개를 만들어 봐서 금방 적응할 수 있다고 자신합니다."},"collocations":["a steep learning curve","climb the learning curve","shorten the learning curve"],"related":["upskill","grow","skill set"],"tip":"'steep learning curve'는 보통 '처음에 배우기 어렵다'는 뜻으로 씀"},{"id":"d05-D25","day":5,"level":2,"set":"D","family":"F5","word":"shortcoming","pos":"noun","ipa":"/ˈʃɔːrtkʌmɪŋ/","meaning_ko":"단점, 부족한 점","category":"interview","etymology":{"parts":[{"text":"short","type":"part","gloss":"짧은·모자란"},{"text":"coming","type":"part","gloss":"옴 (come)"}],"story":"come short(모자라게 오다 = 기준에 못 미치다) → 기준에 못 미치는 점 → 단점"},"example":{"q":"What's an area you're still working on?","a":"One shortcoming of mine is estimating tasks, so I now track my estimates against actual time to get better.","a_ko":"제 부족한 점 중 하나는 작업 시간 추정이라서, 지금은 추정치와 실제 걸린 시간을 비교해 기록하며 개선하고 있습니다."},"collocations":["my biggest shortcoming","overcome a shortcoming","address shortcomings"],"related":["weakness","strength","upskill"],"tip":"weakness보다 부드럽고 격식 있는 말. 흔히 복수형 shortcomings로 씀"},{"id":"d06-A01","day":6,"level":1,"set":"A","family":"F6","word":"fact","pos":"noun","ipa":"/fækt/","meaning_ko":"사실","category":"interview","etymology":{"parts":[{"text":"fact","type":"root","gloss":"행해진 일 (fac 하다)"}],"story":"facere(하다)의 과거분사 factum '행해진 일' → 실제로 일어난 일 → 사실"},"example":{"q":"How do you handle disagreements with teammates?","a":"I try to focus on facts rather than opinions.","a_ko":"의견보다는 사실에 집중하려고 합니다."},"collocations":["in fact","the fact that","facts and figures"],"related":["factual","effect","manufacturing","satisfaction"],"tip":"in fact(사실은)는 앞 말을 보강할 때 쓰는 연결어 — 답변 중간에 유용"},{"id":"d06-A02","day":6,"level":2,"set":"A","family":"F6","word":"factual","pos":"adjective","ipa":"/ˈfæktʃuəl/","meaning_ko":"사실에 근거한","category":"interview","etymology":{"parts":[{"text":"fact","type":"root","gloss":"행해진 일 (fac)"},{"text":"ual","type":"suffix","gloss":"~의"}],"story":"fact(사실) + -ual(~의) → 사실에 근거한"},"example":{"q":"How do you write incident reports?","a":"I keep my incident reports factual, so I describe what happened and when, without blaming anyone.","a_ko":"장애 보고서는 사실 위주로 씁니다. 누구도 탓하지 않고 무슨 일이 언제 일어났는지만 적습니다."},"collocations":["factual information","keep it factual","factual error"],"related":["fact","effect","perfect"],"tip":"'의견 말고 사실 그대로'라는 뉘앙스 — 보고·피드백 이야기할 때"},{"id":"d06-A03","day":6,"level":1,"set":"A","family":"F6","word":"manufacturing","pos":"noun","ipa":"/ˌmænjəˈfæktʃərɪŋ/","meaning_ko":"제조업, 제조","category":"interview","etymology":{"parts":[{"text":"manu","type":"root","gloss":"손 (manus)"},{"text":"fact","type":"root","gloss":"만들다 (fac)"},{"text":"uring","type":"suffix","gloss":"~하는 일 (-ure + -ing)"}],"story":"손(manus)으로 만드는(fac) 일 → 물건을 만들어 내는 일 → 제조업"},"example":{"q":"Tell me about your previous company.","a":"My previous company was in manufacturing, so I built systems for factory data.","a_ko":"이전 회사는 제조업 쪽이라서 공장 데이터를 다루는 시스템을 만들었습니다."},"collocations":["manufacturing industry","manufacturing process","smart manufacturing"],"related":["fact","feature","factory","artificial"],"tip":"지금은 기계로 만들지만 어원은 '손으로 만들기' — 이전 직장의 업종을 말할 때"},{"id":"d06-A04","day":6,"level":1,"set":"A","family":"F6","word":"feature","pos":"noun","ipa":"/ˈfiːtʃər/","meaning_ko":"기능, 특징","category":"it","etymology":{"parts":[{"text":"feat","type":"root","gloss":"만들다 (fac)"},{"text":"ure","type":"suffix","gloss":"~한 것"}],"story":"라틴어 factura '만든 것, 생김새' → 얼굴 생김새·특징 → 제품의 기능"},"example":{"q":"What was your main role on the project?","a":"I built the search feature from design to release.","a_ko":"검색 기능을 설계부터 출시까지 맡아 만들었습니다."},"collocations":["new feature","feature request","feature flag"],"related":["fact","manufacturing","effect"],"tip":"제품의 '기능'은 function보다 feature가 자연스러움 — 'ship a feature'(기능을 출시하다)"},{"id":"d06-A05","day":6,"level":1,"set":"A","family":"F6","word":"effect","pos":"noun","ipa":"/ɪˈfekt/","meaning_ko":"효과, 영향","category":"interview","etymology":{"parts":[{"text":"ef","type":"prefix","gloss":"밖으로 (ex)"},{"text":"fect","type":"root","gloss":"만들다 (fac)"}],"story":"밖으로(ex) 만들어 낸(fac) 것 → 행동이 만들어 낸 결과 → 효과"},"example":{"q":"What impact did your work have?","a":"The new caching layer had a big effect on page speed.","a_ko":"새 캐시 계층이 페이지 속도에 큰 효과를 냈습니다."},"collocations":["have an effect on","side effect","take effect"],"related":["effective","affect","perfect","efficient"],"tip":"effect는 주로 명사(효과), affect는 주로 동사(영향을 주다) — 헷갈리기 쉬운 짝"},{"id":"d06-A06","day":6,"level":1,"set":"A","family":"F6","word":"effective","pos":"adjective","ipa":"/ɪˈfektɪv/","meaning_ko":"효과적인","category":"interview","etymology":{"parts":[{"text":"ef","type":"prefix","gloss":"밖으로 (ex)"},{"text":"fect","type":"root","gloss":"만들다 (fac)"},{"text":"ive","type":"suffix","gloss":"~하는"}],"story":"결과를 만들어 내는 → 효과가 있는 → 효과적인"},"example":{"q":"How do you communicate with non-technical people?","a":"I find that simple diagrams are the most effective way to explain things.","a_ko":"간단한 다이어그램이 가장 효과적인 설명 방법이라고 느낍니다."},"collocations":["effective communication","highly effective","cost-effective"],"related":["effect","efficient","efficacy"],"tip":"effective(원하는 결과가 나는) vs efficient(낭비 없이 효율적인) — 결과 vs 과정"},{"id":"d06-A07","day":6,"level":1,"set":"A","family":"F6","word":"affect","pos":"verb","ipa":"/əˈfekt/","meaning_ko":"영향을 주다","category":"interview","etymology":{"parts":[{"text":"af","type":"prefix","gloss":"~에 (ad)"},{"text":"fect","type":"root","gloss":"하다 (fac)"}],"story":"~에(ad) 무언가를 하다(fac) → 작용하다 → 영향을 주다"},"example":{"q":"Tell me about a mistake you made.","a":"I once pushed a bug that affected thousands of users.","a_ko":"한번은 제가 올린 버그가 수천 명의 사용자에게 영향을 준 적이 있습니다."},"collocations":["directly affect","be affected by","affect performance"],"related":["effect","defect","perfect"],"tip":"발음 /əˈfekt/ — effect /ɪˈfekt/와 거의 같으니 품사로 구분"},{"id":"d06-A08","day":6,"level":1,"set":"A","family":"F6","word":"perfect","pos":"adjective","ipa":"/ˈpɜːrfɪkt/","meaning_ko":"완벽한","category":"interview","etymology":{"parts":[{"text":"per","type":"prefix","gloss":"완전히"},{"text":"fect","type":"root","gloss":"만들다 (fac)"}],"story":"완전히(per) 다 만든(fac) → 완성된 → 완벽한"},"example":{"q":"What kind of team do you want to work with?","a":"No team is perfect, but I value open and honest feedback.","a_ko":"완벽한 팀은 없지만, 저는 열려 있고 솔직한 피드백을 중요하게 생각합니다."},"collocations":["perfect fit","nobody's perfect","perfect timing"],"related":["perfectionist","effect","defect"],"tip":"'This role is a perfect fit for me'(이 자리가 저와 딱 맞습니다)도 지원 동기에서 자주 씀"},{"id":"d06-A09","day":6,"level":2,"set":"A","family":"F6","word":"perfectionist","pos":"noun","ipa":"/pərˈfekʃənɪst/","meaning_ko":"완벽주의자","category":"interview","etymology":{"parts":[{"text":"per","type":"prefix","gloss":"완전히"},{"text":"fect","type":"root","gloss":"만들다 (fac)"},{"text":"ion","type":"suffix","gloss":"~함"},{"text":"ist","type":"suffix","gloss":"~하는 사람"}],"story":"완전히 다 만듦(perfection) → 완벽을 추구하는 사람 → 완벽주의자"},"example":{"q":"What is your greatest weakness?","a":"I used to be a perfectionist, so now I set time limits and ship a good first version.","a_ko":"예전엔 완벽주의자였는데, 지금은 시간 제한을 두고 괜찮은 첫 버전을 먼저 내놓습니다."},"collocations":["a bit of a perfectionist","recovering perfectionist"],"related":["perfect","effect","defect"],"tip":"약점 질문의 단골 답 — 너무 흔하니 '어떻게 고쳤는지'를 꼭 붙이기"},{"id":"d06-A10","day":6,"level":2,"set":"A","family":"F6","word":"defect","pos":"noun","ipa":"/ˈdiːfekt/","meaning_ko":"결함","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"떨어져, 아래로"},{"text":"fect","type":"root","gloss":"하다 (fac)"}],"story":"라틴어 deficere '해야 할 것에서 떨어지다, 모자라다' → 모자란 부분 → 결함"},"example":{"q":"How do you ensure quality?","a":"We track every defect in Jira, and we review the root cause of critical ones every week.","a_ko":"모든 결함을 Jira로 관리하고, 심각한 결함은 매주 근본 원인을 함께 검토합니다."},"collocations":["defect rate","critical defect","fix a defect"],"related":["deficiency","effect","perfect"],"tip":"명사는 /ˈdiːfekt/, 동사(망명하다)는 /dɪˈfekt/ — 업무에선 bug보다 격식 있는 말"},{"id":"d06-A11","day":6,"level":2,"set":"A","family":"F6","word":"feasible","pos":"adjective","ipa":"/ˈfiːzəbl/","meaning_ko":"실현 가능한","category":"it","etymology":{"parts":[{"text":"feas","type":"root","gloss":"하다 (fac → 프랑스어 faire)"},{"text":"ible","type":"suffix","gloss":"~할 수 있는"}],"story":"고대 프랑스어 faisable '할 수 있는'(faire ← facere) → 실제로 해낼 수 있는"},"example":{"q":"How do you decide whether to pursue a new idea?","a":"First I build a quick prototype to check whether the idea is technically feasible.","a_ko":"먼저 빠르게 프로토타입을 만들어 기술적으로 실현 가능한지 확인합니다."},"collocations":["technically feasible","feasible solution","economically feasible"],"related":["feasibility","feature","fact"],"tip":"possible(가능한)보다 '현실적으로 해낼 수 있는'의 뉘앙스"},{"id":"d06-A12","day":6,"level":2,"set":"A","family":"F6","word":"feasibility","pos":"noun","ipa":"/ˌfiːzəˈbɪləti/","meaning_ko":"실현 가능성, 타당성","category":"it","etymology":{"parts":[{"text":"feas","type":"root","gloss":"하다 (fac)"},{"text":"ibility","type":"suffix","gloss":"~할 수 있음"}],"story":"할 수 있는(feasible) 정도 → 실현 가능성"},"example":{"q":"Have you ever pushed back on a project?","a":"I ran a two-week feasibility study and showed that the deadline was not realistic.","a_ko":"2주간 타당성 검토를 해서 마감일이 현실적이지 않다는 걸 보여 드렸습니다."},"collocations":["feasibility study","technical feasibility","assess feasibility"],"related":["feasible","fact","feature"],"tip":"feasibility study(타당성 검토)를 통째로 외우기"},{"id":"d06-A13","day":6,"level":1,"set":"A","family":"F6","word":"profit","pos":"noun","ipa":"/ˈprɑːfɪt/","meaning_ko":"이익, 수익","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"fit","type":"root","gloss":"만들다 (fac)"}],"story":"라틴어 proficere '앞으로 나아가게 하다' → 나아짐·이득 → 이익"},"example":{"q":"Why are you interested in our company?","a":"I like that your company cares about social impact, not only profit.","a_ko":"이익만이 아니라 사회적 영향도 중요하게 생각하는 회사라는 점이 좋습니다."},"collocations":["make a profit","profit margin","non-profit"],"related":["proficient","efficient","sufficient"],"tip":"non-profit(비영리 단체) 경력이 있으면 그대로 쓰는 말"},{"id":"d06-A14","day":6,"level":1,"set":"A","family":"F6","word":"difficult","pos":"adjective","ipa":"/ˈdɪfɪkəlt/","meaning_ko":"어려운","category":"interview","etymology":{"parts":[{"text":"dif","type":"prefix","gloss":"아닌 (dis)"},{"text":"fic","type":"root","gloss":"쉬운 (facilis ← fac 하다)"},{"text":"ult","type":"suffix","gloss":"어미"}],"story":"dis(아닌) + facilis(하기 쉬운) → 하기 쉽지 않은 → 어려운"},"example":{"q":"Tell me about a difficult situation at work.","a":"The most difficult part was working with a team in another time zone.","a_ko":"가장 어려웠던 건 다른 시간대에 있는 팀과 함께 일하는 것이었습니다."},"collocations":["difficult decision","find it difficult to","difficult conversation"],"related":["difficulty","facilitate","efficient"],"tip":"hard보다 조금 격식 있는 말 — 'a difficult conversation'(껄끄러운 대화)도 자주 씀"},{"id":"d06-A15","day":6,"level":1,"set":"A","family":"F6","word":"difficulty","pos":"noun","ipa":"/ˈdɪfɪkəlti/","meaning_ko":"어려움","category":"interview","etymology":{"parts":[{"text":"dif","type":"prefix","gloss":"아닌 (dis)"},{"text":"fic","type":"root","gloss":"쉬운 (facilis ← fac 하다)"},{"text":"ulty","type":"suffix","gloss":"~함"}],"story":"하기 쉽지 않음(difficultas) → 어려움"},"example":{"q":"How do you handle problems you can't solve alone?","a":"When I have difficulty with a task, I ask for help early.","a_ko":"일하다 어려움이 생기면 일찍 도움을 요청합니다."},"collocations":["have difficulty -ing","without difficulty","technical difficulties"],"related":["difficult","facilitate","facility"],"tip":"have difficulty -ing 형태로 — 'I had difficulty finding the cause.'"},{"id":"d06-A16","day":6,"level":2,"set":"A","family":"F6","word":"efficient","pos":"adjective","ipa":"/ɪˈfɪʃnt/","meaning_ko":"효율적인","category":"interview","etymology":{"parts":[{"text":"ef","type":"prefix","gloss":"밖으로 (ex)"},{"text":"fic","type":"root","gloss":"만들다 (fac)"},{"text":"ient","type":"suffix","gloss":"~하는"}],"story":"라틴어 efficere '해내다, 이루다' → 결과를 잘 만들어 내는 → 낭비 없이 효율적인"},"example":{"q":"How do you manage your time?","a":"I block focus time every morning, which helps me stay efficient even during busy weeks.","a_ko":"매일 아침 집중 시간을 따로 잡아 두는데, 바쁜 주에도 효율적으로 일하는 데 도움이 됩니다."},"collocations":["energy-efficient","cost-efficient","more efficient"],"related":["efficiency","effect","sufficient","efficacy"],"tip":"efficient = 적은 자원으로 / effective = 원하는 결과를 — 둘을 같이 써도 좋음"},{"id":"d06-A17","day":6,"level":2,"set":"A","family":"F6","word":"efficiency","pos":"noun","ipa":"/ɪˈfɪʃnsi/","meaning_ko":"효율","category":"it","etymology":{"parts":[{"text":"ef","type":"prefix","gloss":"밖으로 (ex)"},{"text":"fic","type":"root","gloss":"만들다 (fac)"},{"text":"iency","type":"suffix","gloss":"~함"}],"story":"효율적인(efficient) 상태 → 효율"},"example":{"q":"What did you improve in your last project?","a":"I rewrote our batch jobs in Go, which improved efficiency and cut cloud costs by thirty percent.","a_ko":"배치 작업을 Go로 다시 작성해서 효율을 높이고 클라우드 비용을 30% 줄였습니다."},"collocations":["improve efficiency","operational efficiency","energy efficiency"],"related":["efficient","effect","deficiency"],"tip":"성과를 말할 때 '무엇을 해서 → 효율이 몇 % 좋아졌다' 순서로"},{"id":"d06-A18","day":6,"level":2,"set":"A","family":"F6","word":"sufficient","pos":"adjective","ipa":"/səˈfɪʃnt/","meaning_ko":"충분한","category":"interview","etymology":{"parts":[{"text":"suf","type":"prefix","gloss":"아래에 (sub)"},{"text":"fic","type":"root","gloss":"만들다 (fac)"},{"text":"ient","type":"suffix","gloss":"~하는"}],"story":"라틴어 sufficere '밑에 받쳐 채우다, 넉넉하다' → 충분한"},"example":{"q":"How do you make decisions under uncertainty?","a":"I don't wait for perfect data; I move forward once I have sufficient information to decide.","a_ko":"완벽한 데이터를 기다리지 않고, 판단할 만큼 정보가 충분하면 바로 진행합니다."},"collocations":["sufficient time","sufficient evidence","self-sufficient"],"related":["insufficient","efficient","deficiency"],"tip":"enough보다 격식 있는 말 — 'sufficient + 명사' 형태로"},{"id":"d06-A19","day":6,"level":2,"set":"A","family":"F6","word":"insufficient","pos":"adjective","ipa":"/ˌɪnsəˈfɪʃnt/","meaning_ko":"불충분한, 부족한","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"아닌"},{"text":"suf","type":"prefix","gloss":"아래에 (sub)"},{"text":"fic","type":"root","gloss":"만들다 (fac)"},{"text":"ient","type":"suffix","gloss":"~하는"}],"story":"충분하지(sufficient) 않은 → 부족한"},"example":{"q":"Tell me about a production issue you debugged.","a":"The job kept failing with an insufficient permissions error, so I traced it to a missing IAM role.","a_ko":"작업이 '권한 부족' 오류로 계속 실패해서 추적해 보니 IAM 역할이 빠져 있었습니다."},"collocations":["insufficient permissions","insufficient memory","insufficient data"],"related":["sufficient","deficiency","efficient"],"tip":"에러 메시지에 자주 나오는 단어 — 'insufficient permissions/funds'"},{"id":"d06-A20","day":6,"level":2,"set":"A","family":"F6","word":"deficiency","pos":"noun","ipa":"/dɪˈfɪʃnsi/","meaning_ko":"부족, 결함","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"떨어져"},{"text":"fic","type":"root","gloss":"하다 (fac)"},{"text":"iency","type":"suffix","gloss":"~함"}],"story":"라틴어 deficere '(해야 할 것에서) 떨어지다, 모자라다' → 모자람 → 부족, 결함"},"example":{"q":"What did you notice when you joined your current team?","a":"I found a deficiency in our test coverage, so I added integration tests for the payment flow.","a_ko":"테스트 커버리지가 부족한 부분을 발견해서 결제 흐름에 통합 테스트를 추가했습니다."},"collocations":["identify deficiencies","major deficiency","address a deficiency"],"related":["defect","sufficient","efficient"],"tip":"defect(하나하나의 결함)보다 '모자란 상태' 전반을 말할 때"},{"id":"d06-A21","day":6,"level":3,"set":"A","family":"F6","word":"efficacy","pos":"noun","ipa":"/ˈefɪkəsi/","meaning_ko":"효능, 실제 효과","category":"it","etymology":{"parts":[{"text":"ef","type":"prefix","gloss":"밖으로 (ex)"},{"text":"fic","type":"root","gloss":"만들다 (fac)"},{"text":"acy","type":"suffix","gloss":"~함"}],"story":"라틴어 efficax '결과를 낼 수 있는' → 효능 → 실제로 효과가 있는 정도"},"example":{"q":"How do you know whether a change actually worked?","a":"Before rolling out the new retry logic everywhere, I ran an A/B test to measure its efficacy against the old approach.","a_ko":"새 재시도 로직을 전체에 적용하기 전에 A/B 테스트로 기존 방식 대비 효과를 측정했습니다."},"collocations":["measure the efficacy of","proven efficacy","efficacy and safety"],"related":["effective","efficient","effect"],"tip":"강세는 앞 /ˈef-/ — effectiveness보다 격식 있게 '검증된 효과'를 말할 때"},{"id":"d06-A22","day":6,"level":3,"set":"A","family":"F6","word":"facilitate","pos":"verb","ipa":"/fəˈsɪlɪteɪt/","meaning_ko":"원활하게 하다, (회의를) 진행하다","category":"interview","etymology":{"parts":[{"text":"facil","type":"root","gloss":"쉬운 (facilis ← fac 하다)"},{"text":"itate","type":"suffix","gloss":"~하게 하다"}],"story":"라틴어 facilis '하기 쉬운' → 쉽게 만들다 → 일이 잘 돌아가게 돕다, 회의를 진행하다"},"example":{"q":"Do you have any leadership experience?","a":"I facilitated our weekly planning meetings for a year, making sure quieter team members also had a chance to speak.","a_ko":"1년 동안 주간 계획 회의 진행을 맡아, 조용한 팀원들도 말할 기회를 갖도록 챙겼습니다."},"collocations":["facilitate a meeting","facilitate communication","facilitate collaboration"],"related":["facility","difficult","efficient"],"tip":"lead보다 '돕는 진행자' 느낌 — 리더십을 겸손하게 말할 때 좋음"},{"id":"d06-A23","day":6,"level":1,"set":"A","family":"F6","word":"bug","pos":"noun","ipa":"/bʌɡ/","meaning_ko":"버그, 결함","category":"it","etymology":{"parts":[{"text":"bug","type":"part","gloss":"벌레"}],"story":"벌레 → 기계 속에 숨어 말썽을 일으키는 것 → 프로그램 결함 (19세기 엔지니어들이 이미 쓰던 말)"},"example":{"q":"How do you deal with bugs reported by users?","a":"I first reproduce the bug, then write a test before fixing it.","a_ko":"먼저 버그를 재현하고, 고치기 전에 테스트부터 작성합니다."},"collocations":["fix a bug","bug report","critical bug"],"related":["debug","defect","edge case"],"tip":"defect보다 일상적인 말 — 'squash a bug'(버그를 잡다)도 자주 씀"},{"id":"d06-A24","day":6,"level":1,"set":"A","family":"F6","word":"build","pos":"verb","ipa":"/bɪld/","meaning_ko":"만들다, 빌드하다","category":"it","etymology":{"parts":[{"text":"build","type":"part","gloss":"집을 짓다 (고대 영어 byldan)"}],"story":"고대 영어 byldan '집을 짓다' → 무언가를 만들어 세우다 → 소스 코드를 실행 가능한 형태로 만들다"},"example":{"q":"What kind of work do you enjoy most?","a":"I enjoy building tools that make other developers more productive.","a_ko":"다른 개발자들의 생산성을 높여 주는 도구를 만드는 일을 가장 좋아합니다."},"collocations":["build a product","build pipeline","break the build"],"related":["structure","construct","rebuild"],"tip":"make보다 '차곡차곡 쌓아 만든다'는 느낌 — 'build a team'도 OK. 명사 'the build'는 빌드 결과물"},{"id":"d06-A25","day":6,"level":1,"set":"A","family":"F6","word":"side project","pos":"noun","ipa":"/ˈsaɪd ˌprɑːdʒekt/","meaning_ko":"개인 프로젝트, 사이드 프로젝트","category":"interview","etymology":{"parts":[{"text":"side","type":"part","gloss":"옆 (고대 영어 sīde)"},{"text":"project","type":"part","gloss":"계획 (라틴어 pro+iacere 앞으로 던지다)"}],"story":"본업 옆에서 하는 계획 → 개인적으로 하는 프로젝트"},"example":{"q":"What do you do to keep your skills up to date?","a":"I build small side projects on weekends to try new frameworks.","a_ko":"주말에 작은 사이드 프로젝트를 만들며 새 프레임워크를 써 봅니다."},"collocations":["work on a side project","personal side project"],"related":["project","inject","object"],"tip":"자기 계발 질문에 GitHub 링크와 함께 말하면 효과적"},{"id":"d06-B01","day":6,"level":2,"set":"B","family":"F6","word":"artificial","pos":"adjective","ipa":"/ˌɑːrtɪˈfɪʃl/","meaning_ko":"인공의","category":"it","etymology":{"parts":[{"text":"arti","type":"root","gloss":"기술 (ars)"},{"text":"fic","type":"root","gloss":"만들다 (fac)"},{"text":"ial","type":"suffix","gloss":"~의"}],"story":"기술(ars)로 만든(fac) → 사람이 만든 → 인공의"},"example":{"q":"What technology trends interest you?","a":"I'm excited about artificial intelligence, especially how it can help developers review code faster.","a_ko":"인공지능, 특히 개발자가 코드를 더 빨리 리뷰하도록 돕는 방식에 관심이 많습니다."},"collocations":["artificial intelligence","artificial limit","artificial deadline"],"related":["artifact","sacrifice","efficient"],"tip":"AI = artificial intelligence. 'artificial deadline'(억지로 정한 마감)처럼 부정적 뜻도"},{"id":"d06-B02","day":6,"level":2,"set":"B","family":"F6","word":"sacrifice","pos":"verb","ipa":"/ˈsækrɪfaɪs/","meaning_ko":"희생하다, 포기하다","category":"interview","etymology":{"parts":[{"text":"sacri","type":"root","gloss":"신성한 (sacer)"},{"text":"fice","type":"root","gloss":"만들다 (fac)"}],"story":"신성하게(sacer) 만들다(fac) → 신에게 바치다 → 더 중요한 것을 위해 포기하다"},"example":{"q":"How do you balance speed and quality?","a":"I never sacrifice code quality for speed, but I'm willing to cut scope to meet a deadline.","a_ko":"속도를 위해 코드 품질을 희생하지는 않지만, 마감을 맞추려고 범위를 줄이는 건 기꺼이 합니다."},"collocations":["sacrifice A for B","sacrifice quality","make sacrifices"],"related":["satisfy","artificial","significant"],"tip":"트레이드오프 질문에 바로 쓰는 단어 — 'sacrifice A for B'(B를 위해 A를 포기하다)"},{"id":"d06-B03","day":6,"level":1,"set":"B","family":"F6","word":"satisfy","pos":"verb","ipa":"/ˈsætɪsfaɪ/","meaning_ko":"만족시키다, (조건을) 충족하다","category":"interview","etymology":{"parts":[{"text":"satis","type":"root","gloss":"충분히 (satis)"},{"text":"fy","type":"root","gloss":"~하게 만들다 (fac → -fy)"}],"story":"충분하게(satis) 만들다(fac) → 바라는 만큼 채워 주다 → 만족시키다"},"example":{"q":"How do you handle demanding clients?","a":"I listen carefully first, because it's hard to satisfy someone you don't understand.","a_ko":"먼저 잘 듣습니다. 이해하지 못하는 사람을 만족시키기는 어렵기 때문입니다."},"collocations":["satisfy requirements","satisfy customers","satisfy a condition"],"related":["satisfaction","sufficient","verify"],"tip":"조건을 '충족하다'의 뜻도 — 'satisfy the requirements'"},{"id":"d06-B04","day":6,"level":2,"set":"B","family":"F6","word":"satisfaction","pos":"noun","ipa":"/ˌsætɪsˈfækʃn/","meaning_ko":"만족, 보람","category":"interview","etymology":{"parts":[{"text":"satis","type":"root","gloss":"충분히 (satis)"},{"text":"fact","type":"root","gloss":"만들다 (fac)"},{"text":"ion","type":"suffix","gloss":"~함"}],"story":"충분하게 만들어 줌 → 만족"},"example":{"q":"What motivates you at work?","a":"I get the most satisfaction when a feature I built solves
