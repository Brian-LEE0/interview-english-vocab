s time gives me a real sense of purpose.","a_ko":"동료들의 시간을 아껴 주는 도구를 만들 때 진짜 보람과 목적의식을 느낍니다."},"collocations":["sense of purpose","on purpose","serve a purpose"],"related":["propose","suppose","position","proponent"],"tip":"발음은 /ˈpɝːpəs/ '퍼-퍼스'. on purpose = 일부러"},{"id":"d03-A04","day":3,"level":1,"set":"A","family":"F3","word":"suppose","pos":"verb","ipa":"/səˈpoʊz/","meaning_ko":"~라고 생각하다, ~하기로 되어 있다","category":"interview","etymology":{"parts":[{"text":"sup","type":"prefix","gloss":"아래에 (sub)"},{"text":"pose","type":"root","gloss":"놓다 (pos)"}],"story":"밑에 깔아 두다 → 전제로 삼다 → 가정하다·생각하다"},"example":{"q":"How do you handle unclear requirements?","a":"If I'm unsure what a feature is supposed to do, I ask early.","a_ko":"기능이 어떻게 동작해야 하는지 확실하지 않으면 일찍 물어봅니다."},"collocations":["be supposed to","I suppose","suppose that"],"related":["purpose","propose","impose","expose"],"tip":"be supposed to(~하기로 되어 있다)가 면접에서 가장 많이 쓰이는 형태"},{"id":"d03-A05","day":3,"level":1,"set":"A","family":"F3","word":"opposite","pos":"adjective","ipa":"/ˈɑːpəzɪt/","meaning_ko":"정반대의, 반대","category":"interview","etymology":{"parts":[{"text":"op","type":"prefix","gloss":"맞서 (ob)"},{"text":"posite","type":"root","gloss":"놓인 (positus ← pon)"}],"story":"맞은편에 놓인 → 정반대의"},"example":{"q":"Did your first approach work?","a":"Actually, the result was the opposite of what I expected, so I changed my approach.","a_ko":"사실 결과가 예상과 정반대여서 접근 방식을 바꿨습니다."},"collocations":["the opposite of","the opposite direction","quite the opposite"],"related":["oppose","position","expose","component"],"tip":"발음 /ˈɑːpəzɪt/ — '오포짓'보다 '아-퍼짓'에 가깝게"},{"id":"d03-A06","day":3,"level":1,"set":"A","family":"F3","word":"propose","pos":"verb","ipa":"/prəˈpoʊz/","meaning_ko":"제안하다","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"pose","type":"root","gloss":"놓다 (pos)"}],"story":"앞에 내놓다 → 제안하다"},"example":{"q":"How do you share new ideas with your team?","a":"I usually write a short document and propose the idea at our weekly meeting.","a_ko":"보통 짧은 문서를 써서 주간 회의에서 아이디어를 제안합니다."},"collocations":["propose a solution","propose that","propose an idea"],"related":["proposal","purpose","suppose","proponent"],"tip":"suggest보다 조금 더 공식적으로 '안을 내놓는' 느낌"},{"id":"d03-A07","day":3,"level":2,"set":"A","family":"F3","word":"proposal","pos":"noun","ipa":"/prəˈpoʊzəl/","meaning_ko":"제안(서), 기획안","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"pos","type":"root","gloss":"놓다"},{"text":"al","type":"suffix","gloss":"~하는 것"}],"story":"앞에 내놓은 것 → 제안·기획안"},"example":{"q":"Tell me about a time you influenced a technical decision.","a":"I wrote a proposal to move our batch jobs to a queue, and I backed it with load-test results.","a_ko":"배치 작업을 큐 방식으로 옮기자는 제안서를 쓰고, 부하 테스트 결과로 근거를 댔습니다."},"collocations":["write a proposal","put forward a proposal","design proposal"],"related":["propose","purpose","proponent","position"],"tip":"propose(동사)의 명사형. 'proposal for/to ~'로 무엇에 대한 제안인지 붙임"},{"id":"d03-A08","day":3,"level":1,"set":"A","family":"F3","word":"postpone","pos":"verb","ipa":"/poʊstˈpoʊn/","meaning_ko":"미루다, 연기하다","category":"interview","etymology":{"parts":[{"text":"post","type":"prefix","gloss":"뒤에"},{"text":"pone","type":"root","gloss":"놓다 (pon)"}],"story":"뒤에 놓다 → 나중으로 미루다"},"example":{"q":"Have you ever had to delay a release?","a":"Yes, we postponed a release by two days to fix a critical bug.","a_ko":"네, 치명적인 버그를 고치려고 릴리스를 이틀 미룬 적이 있습니다."},"collocations":["postpone a meeting","postpone until","postpone the launch"],"related":["position","component","proponent","purpose"],"tip":"delay보다 '일정을 의도적으로 뒤로 옮긴다'는 느낌. put off와 같은 뜻"},{"id":"d03-A09","day":3,"level":1,"set":"A","family":"F3","word":"expose","pos":"verb","ipa":"/ɪkˈspoʊz/","meaning_ko":"(API 등을) 외부에 공개하다, 노출하다","category":"it","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"pose","type":"root","gloss":"놓다 (pos)"}],"story":"밖에 내놓다 → 드러내다 → 외부에 공개하다"},"example":{"q":"How did you design the service interface?","a":"We exposed only three REST endpoints and kept everything else internal.","a_ko":"REST 엔드포인트 세 개만 외부에 공개하고 나머지는 내부에 두었습니다."},"collocations":["expose an API","expose an endpoint","be exposed to"],"related":["exposure","impose","suppose","position"],"tip":"be exposed to ~(~을 접해 보다)라는 뜻으로 경험을 말할 때도 씀"},{"id":"d03-A10","day":3,"level":2,"set":"A","family":"F3","word":"impose","pos":"verb","ipa":"/ɪmˈpoʊz/","meaning_ko":"(제한·규칙을) 걸다, 부과하다","category":"it","etymology":{"parts":[{"text":"im","type":"prefix","gloss":"위에 (in)"},{"text":"pose","type":"root","gloss":"놓다 (pos)"}],"story":"위에 얹어 놓다 → 부담·규칙을 지우다 → 제한을 걸다"},"example":{"q":"How did you protect the API from abuse?","a":"We imposed a rate limit of 100 requests per minute per user, which stopped the traffic spikes from bots.","a_ko":"사용자당 분당 100건의 요청 제한을 걸어서 봇이 만드는 트래픽 급증을 막았습니다."},"collocations":["impose a limit","impose restrictions","impose on someone"],"related":["impostor","expose","suppose","component"],"tip":"impose a limit/constraint처럼 '제약을 건다'는 맥락에서 IT 답변에 자주 씀"},{"id":"d03-A11","day":3,"level":2,"set":"A","family":"F3","word":"component","pos":"noun","ipa":"/kəmˈpoʊnənt/","meaning_ko":"구성 요소, 컴포넌트","category":"it","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"함께"},{"text":"pon","type":"root","gloss":"놓다"},{"text":"ent","type":"suffix","gloss":"~하는 것"}],"story":"함께 놓인 것 → 전체를 이루는 부품 → 구성 요소"},"example":{"q":"What did you work on in your last frontend project?","a":"I built a shared component library in React, so five product teams could reuse the same buttons and forms.","a_ko":"리액트로 공용 컴포넌트 라이브러리를 만들어서 다섯 개 제품팀이 같은 버튼과 폼을 재사용할 수 있게 했습니다."},"collocations":["UI component","key component","component library"],"related":["composition","composite","proponent","exponential"],"tip":"pon(놓다)이 그대로 보이는 단어. 강세는 '포' /kəmˈpoʊ-/"},{"id":"d03-A12","day":3,"level":2,"set":"A","family":"F3","word":"composition","pos":"noun","ipa":"/ˌkɑːmpəˈzɪʃən/","meaning_ko":"합성(조합), 구성","category":"it","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"함께"},{"text":"posit","type":"root","gloss":"놓다 (pon)"},{"text":"ion","type":"suffix","gloss":"~것"}],"story":"함께 놓음 → 조합해서 만듦 → 구성·합성"},"example":{"q":"How do you keep your code easy to change?","a":"I prefer composition over inheritance, because small objects combined together are easier to test and replace.","a_ko":"상속보다 합성(조합)을 선호합니다. 작은 객체를 조합하면 테스트하고 교체하기가 더 쉽기 때문입니다."},"collocations":["composition over inheritance","team composition","function composition"],"related":["component","composite","decompose","position"],"tip":"'composition over inheritance'는 설계 면접 단골 문구"},{"id":"d03-A13","day":3,"level":2,"set":"A","family":"F3","word":"composite","pos":"adjective","ipa":"/kəmˈpɑːzɪt/","meaning_ko":"복합의, 합성된","category":"it","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"함께"},{"text":"posite","type":"root","gloss":"놓인 (positus ← pon)"}],"story":"함께 놓인 → 여러 개가 합쳐진 → 복합의"},"example":{"q":"How did you speed up that slow query?","a":"I added a composite index on user ID and created date, which cut the query time from two seconds to fifty milliseconds.","a_ko":"사용자 ID와 생성일에 복합 인덱스를 추가해서 쿼리 시간을 2초에서 50밀리초로 줄였습니다."},"collocations":["composite index","composite key","composite score"],"related":["composition","component","decompose","exponential"],"tip":"DB의 '복합 인덱스/복합 키'를 말할 때 바로 쓰는 단어. 미국식 강세는 '파' /kəmˈpɑː-/"},{"id":"d03-A14","day":3,"level":2,"set":"A","family":"F3","word":"decompose","pos":"verb","ipa":"/ˌdiːkəmˈpoʊz/","meaning_ko":"(작은 단위로) 나누다, 분해하다","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"떨어져·반대로"},{"text":"com","type":"prefix","gloss":"함께"},{"text":"pose","type":"root","gloss":"놓다 (pos)"}],"story":"함께 놓인 것을 거꾸로 풀다 → 분해하다 → 작은 단위로 나누다"},"example":{"q":"How do you approach a large, vague task?","a":"I decompose it into small tickets that each take a day or two, so progress is easy to track.","a_ko":"하루 이틀이면 끝나는 작은 티켓으로 쪼개서 진행 상황을 쉽게 추적할 수 있게 합니다."},"collocations":["decompose a problem","decompose a monolith","decompose into"],"related":["composition","composite","composure","component"],"tip":"break down보다 기술적인 느낌. 모놀리스를 서비스로 쪼갤 때도 씀"},{"id":"d03-A15","day":3,"level":3,"set":"A","family":"F3","word":"composure","pos":"noun","ipa":"/kəmˈpoʊʒɚ/","meaning_ko":"침착함, 평정","category":"interview","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"함께"},{"text":"pos","type":"root","gloss":"놓다"},{"text":"ure","type":"suffix","gloss":"~한 상태"}],"story":"(마음을) 가지런히 모아 놓은 상태 → 흐트러지지 않음 → 침착함"},"example":{"q":"How do you handle pressure during a production incident?","a":"During a major outage last year, I kept my composure, split the investigation into clear tasks, and gave stakeholders updates every thirty minutes.","a_ko":"작년 대규모 장애 때 침착함을 유지하면서 조사를 명확한 작업으로 나누고, 이해관계자에게 30분마다 상황을 공유했습니다."},"collocations":["keep my composure","lose my composure","regain composure"],"related":["decompose","composition","component","position"],"tip":"calm의 격식 있는 명사. keep/maintain one's composure 형태로 씀"},{"id":"d03-A16","day":3,"level":2,"set":"A","family":"F3","word":"repository","pos":"noun","ipa":"/rɪˈpɑːzətɔːri/","meaning_ko":"저장소, (코드) 리포지토리","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시·뒤로"},{"text":"posit","type":"root","gloss":"놓다 (pon)"},{"text":"ory","type":"suffix","gloss":"~하는 곳"}],"story":"도로 넣어 두는 곳 → 보관 장소 → 저장소"},"example":{"q":"How did you organize code across multiple services?","a":"We moved six services into a single repository, which made shared changes and code reviews much easier.","a_ko":"서비스 여섯 개를 하나의 저장소로 합쳐서 공통 변경과 코드 리뷰가 훨씬 쉬워졌습니다."},"collocations":["Git repository","clone a repository","central repository"],"related":["position","composite","disposable","exponential"],"tip":"줄여서 repo. 강세는 '파' /rɪˈpɑː-/"},{"id":"d03-A17","day":3,"level":2,"set":"A","family":"F3","word":"disposable","pos":"adjective","ipa":"/dɪˈspoʊzəbəl/","meaning_ko":"일회용의, 쓰고 버리는","category":"it","etymology":{"parts":[{"text":"dis","type":"prefix","gloss":"따로·떨어져"},{"text":"pos","type":"root","gloss":"놓다"},{"text":"able","type":"suffix","gloss":"~할 수 있는"}],"story":"따로 치워 놓을 수 있는 → 처리해 버릴 수 있는 → 일회용의"},"example":{"q":"How do you test infrastructure changes safely?","a":"We spin up disposable test environments for each pull request and delete them automatically after merging.","a_ko":"풀 리퀘스트마다 일회용 테스트 환경을 띄우고, 머지 후 자동으로 삭제합니다."},"collocations":["disposable environment","disposable container","disposable income"],"related":["disposal","expose","repository","component"],"tip":"언제든 버리고 새로 만드는 클라우드식 인프라를 설명할 때 좋음"},{"id":"d03-A18","day":3,"level":2,"set":"A","family":"F3","word":"exponential","pos":"adjective","ipa":"/ˌekspəˈnenʃəl/","meaning_ko":"기하급수적인, 지수의","category":"it","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"pon","type":"root","gloss":"놓다"},{"text":"ent","type":"suffix","gloss":"~하는 것"},{"text":"ial","type":"suffix","gloss":"~의"}],"story":"밖으로 내놓다(exponere) → 수 위에 내놓은 지수(exponent) → 지수 함수처럼 급격히 느는"},"example":{"q":"Why did you redesign the retry logic?","a":"Our clients retried instantly and overloaded the server, so I added exponential backoff with a maximum delay.","a_ko":"클라이언트가 즉시 재시도해서 서버에 과부하가 걸렸기 때문에, 최대 대기 시간이 있는 지수 백오프를 넣었습니다."},"collocations":["exponential backoff","exponential growth","at an exponential rate"],"related":["component","proponent","postpone","position"],"tip":"'exponential backoff'(점점 길게 기다렸다가 재시도)는 분산 시스템 면접 필수 표현"},{"id":"d03-A19","day":3,"level":2,"set":"A","family":"F3","word":"posture","pos":"noun","ipa":"/ˈpɑːstʃɚ/","meaning_ko":"(보안) 태세, 자세","category":"it","etymology":{"parts":[{"text":"pos","type":"root","gloss":"놓다"},{"text":"ture","type":"suffix","gloss":"~한 상태"}],"story":"놓인 모양 → 자세 → 대비 태세"},"example":{"q":"What did you do to improve security?","a":"I enabled MFA and removed unused admin accounts, which clearly improved our security posture before the audit.","a_ko":"MFA를 켜고 쓰지 않는 관리자 계정을 정리해서, 감사 전에 보안 태세를 확실히 개선했습니다."},"collocations":["security posture","improve our posture","defensive posture"],"related":["position","composite","exposure","impose"],"tip":"원래 '자세'. 보안 분야에서는 'security posture(보안 수준·대비 상태)'로 씀"},{"id":"d03-A20","day":3,"level":3,"set":"A","family":"F3","word":"proponent","pos":"noun","ipa":"/prəˈpoʊnənt/","meaning_ko":"지지자, 옹호자","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"pon","type":"root","gloss":"놓다"},{"text":"ent","type":"suffix","gloss":"~하는 사람"}],"story":"앞에 내놓는 사람 → 안을 내세우는 사람 → 지지자"},"example":{"q":"What engineering practices do you care about most?","a":"I'm a strong proponent of small pull requests, because on my last team they cut our review time almost in half.","a_ko":"작은 풀 리퀘스트를 적극 지지합니다. 이전 팀에서 리뷰 시간을 거의 절반으로 줄여 줬기 때문입니다."},"collocations":["a strong proponent of","leading proponent","proponent of change"],"related":["component","propose","proposal","exponential"],"tip":"'어떤 방식·생각을 지지하는 사람'. a strong proponent of ~ 형태로 씀"},{"id":"d03-A21","day":3,"level":1,"set":"A","family":"F3","word":"location","pos":"noun","ipa":"/loʊˈkeɪʃən/","meaning_ko":"위치, 근무지","category":"interview","etymology":{"parts":[{"text":"loc","type":"root","gloss":"장소"},{"text":"ation","type":"suffix","gloss":"~하는 것"}],"story":"자리를 정함 → 놓인 자리 → 위치"},"example":{"q":"Is the office location a concern for you?","a":"Not at all, the office location is easy for me to reach by subway.","a_ko":"전혀요, 사무실 위치는 지하철로 다니기 편합니다."},"collocations":["office location","work location","remote location"],"related":["relocate","locale","local","allocate"],"tip":"근무지를 묻는 질문(work location)에서 자주 나옴"},{"id":"d03-A22","day":3,"level":1,"set":"A","family":"F3","word":"relocate","pos":"verb","ipa":"/ˌriːˈloʊkeɪt/","meaning_ko":"이주하다, 근무지를 옮기다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"loc","type":"root","gloss":"장소"},{"text":"ate","type":"suffix","gloss":"~하다"}],"story":"다시 자리를 정하다 → 옮겨 가다 → 이주하다"},"example":{"q":"Are you willing to relocate for this role?","a":"Yes, I'm willing to relocate to Tokyo and can move within two months.","a_ko":"네, 도쿄로 이주할 의향이 있고 두 달 안에 옮길 수 있습니다."},"collocations":["willing to relocate","relocate to","relocation package"],"related":["location","locale","local","allocate"],"tip":"해외 취업 면접 단골 질문. relocation package(이주 지원)도 같이 알아 두기"},{"id":"d03-A23","day":3,"level":1,"set":"A","family":"F3","word":"teammate","pos":"noun","ipa":"/ˈtiːmmeɪt/","meaning_ko":"팀원, 같은 팀 동료","category":"interview","etymology":{"parts":[{"text":"team","type":"part","gloss":"팀"},{"text":"mate","type":"part","gloss":"동료·짝"}],"story":"팀(team) + 짝(mate) → 같은 팀 동료"},"example":{"q":"How do you help new teammates?","a":"I pair with new teammates on their first ticket so they feel supported.","a_ko":"새 팀원과 첫 티켓을 같이 진행해서 든든하게 느끼도록 합니다."},"collocations":["new teammate","former teammate","support my teammates"],"related":["coworker","teamwork","workplace","onboarding"],"tip":"coworker보다 '같은 팀'이라는 소속감이 강한 말"},{"id":"d03-A24","day":3,"level":1,"set":"A","family":"F3","word":"coworker","pos":"noun","ipa":"/ˈkoʊˌwɝːkɚ/","meaning_ko":"직장 동료","category":"interview","etymology":{"parts":[{"text":"co","type":"part","gloss":"함께"},{"text":"work","type":"part","gloss":"일"},{"text":"er","type":"part","gloss":"사람"}],"story":"함께(co) 일하는(work) 사람(er) → 직장 동료"},"example":{"q":"How would your coworkers describe you?","a":"My coworkers would say I'm reliable and always happy to help.","a_ko":"동료들은 제가 믿음직하고 늘 기꺼이 돕는 사람이라고 말할 겁니다."},"collocations":["former coworker","work with coworkers","coworkers and managers"],"related":["teammate","workplace","workload","teamwork"],"tip":"colleague와 같은 뜻. colleague가 조금 더 격식 있음"},{"id":"d03-A25","day":3,"level":1,"set":"A","family":"F3","word":"deadline","pos":"noun","ipa":"/ˈdedlaɪn/","meaning_ko":"마감 기한","category":"interview","etymology":{"parts":[{"text":"dead","type":"part","gloss":"넘으면 안 되는 (죽음)"},{"text":"line","type":"part","gloss":"선"}],"story":"넘으면 안 되는 선(dead line) → 넘기면 안 되는 시한 → 마감"},"example":{"q":"How do you handle tight deadlines?","a":"I prioritize the work and warn my manager early if a deadline is at risk.","a_ko":"일의 우선순위를 정하고, 마감이 위험하면 매니저에게 일찍 알립니다."},"collocations":["meet a deadline","miss a deadline","tight deadline"],"related":["workload","teammate","workflow"],"tip":"meet a deadline = 마감을 지키다. keep a deadline이라고는 하지 않음"},{"id":"d03-B01","day":3,"level":2,"set":"B","family":"F3","word":"positioning","pos":"noun","ipa":"/pəˈzɪʃənɪŋ/","meaning_ko":"포지셔닝, 자리매김","category":"interview","etymology":{"parts":[{"text":"posit","type":"root","gloss":"놓다 (pon)"},{"text":"ion","type":"suffix","gloss":"~것"},{"text":"ing","type":"suffix","gloss":"~하기"}],"story":"자리에 놓기 → 시장·조직 안에서 자리 잡기 → 자리매김"},"example":{"q":"What do you know about our product?","a":"I like your positioning as a developer-first platform, because it matches how I choose tools as an engineer.","a_ko":"개발자 우선 플랫폼으로 자리매김하신 점이 좋습니다. 제가 엔지니어로서 도구를 고르는 방식과 맞기 때문입니다."},"collocations":["market positioning","product positioning","strategic positioning"],"related":["position","posture","exposure","oppose"],"tip":"회사 조사를 했다는 걸 보여 줄 때 좋은 단어. position(자리)에서 나온 말"},{"id":"d03-B02","day":3,"level":2,"set":"B","family":"F3","word":"pose","pos":"verb","ipa":"/poʊz/","meaning_ko":"(위험·문제를) 일으키다, 제기하다","category":"interview","etymology":{"parts":[{"text":"pose","type":"root","gloss":"놓다 (pos)"}],"story":"놓다 → (문제를) 앞에 내놓다 → 제기하다·일으키다"},"example":{"q":"Why did you push back on that design?","a":"The design posed a security risk, because it stored tokens in plain text, so I suggested encryption.","a_ko":"그 설계는 토큰을 평문으로 저장해서 보안 위험이 있었기 때문에 암호화를 제안했습니다."},"collocations":["pose a risk","pose a question","pose a challenge"],"related":["expose","oppose","exposure","positioning"],"tip":"pose a risk/threat/challenge 묶음으로 외우기. 사진 찍을 때 '포즈'와 같은 단어"},{"id":"d03-B03","day":3,"level":2,"set":"B","family":"F3","word":"oppose","pos":"verb","ipa":"/əˈpoʊz/","meaning_ko":"반대하다","category":"interview","etymology":{"parts":[{"text":"op","type":"prefix","gloss":"맞서 (ob)"},{"text":"pose","type":"root","gloss":"놓다 (pos)"}],"story":"맞서 놓다 → 반대편에 서다 → 반대하다"},"example":{"q":"Tell me about a time you disagreed with your manager.","a":"I opposed a plan to skip testing before launch, but I explained the risks with data instead of emotions.","a_ko":"출시 전에 테스트를 건너뛰자는 계획에 반대했지만, 감정이 아니라 데이터로 위험을 설명했습니다."},"collocations":["oppose a plan","as opposed to","strongly oppose"],"related":["opposite","pose","exposure","impostor"],"tip":"as opposed to(~와 달리)는 비교하는 답변에 아주 유용"},{"id":"d03-B04","day":3,"level":2,"set":"B","family":"F3","word":"exposure","pos":"noun","ipa":"/ɪkˈspoʊʒɚ/","meaning_ko":"(접해 본) 경험, 노출","category":"interview","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"pos","type":"root","gloss":"놓다"},{"text":"ure","type":"suffix","gloss":"~하는 것"}],"story":"밖에 내놓아짐 → (어떤 것에) 노출됨 → 접해 본 경험"},"example":{"q":"How familiar are you with machine learning?","a":"I've had some exposure to machine learning through a recommendation project, but my main strength is backend work.","a_ko":"추천 프로젝트를 통해 머신러닝을 어느 정도 접해 봤지만, 제 주력은 백엔드입니다."},"collocations":["exposure to","some exposure","limited exposure"],"related":["expose","pose","positioning","posture"],"tip":"경험이 깊지 않을 때 솔직하게 'some exposure to ~'라고 말하면 좋음"},{"id":"d03-B05","day":3,"level":2,"set":"B","family":"F3","word":"impostor","pos":"noun","ipa":"/ɪmˈpɑːstɚ/","meaning_ko":"가짜, 사기꾼","category":"interview","etymology":{"parts":[{"text":"im","type":"prefix","gloss":"위에 (in)"},{"text":"post","type":"root","gloss":"놓다 (pos)"},{"text":"or","type":"suffix","gloss":"~하는 사람"}],"story":"(거짓을) 덧씌워 놓는 사람(imponere) → 속이는 사람 → 가짜"},"example":{"q":"What is something you struggled with early in your career?","a":"As a junior developer, I had impostor syndrome, but asking questions and tracking my progress helped me build confidence.","a_ko":"주니어 개발자 시절 가면 증후군이 있었지만, 질문하고 성장 기록을 남기면서 자신감을 키웠습니다."},"collocations":["impostor syndrome","feel like an impostor"],"related":["impose","oppose","pose","exposure"],"tip":"'impostor syndrome(가면 증후군)'으로 약점·성장 질문에 씀. imposter 철자도 많이 씀"},{"id":"d03-B06","day":3,"level":2,"set":"B","family":"F3","word":"disposal","pos":"noun","ipa":"/dɪˈspoʊzəl/","meaning_ko":"마음대로 쓸 수 있음, 처분","category":"interview","etymology":{"parts":[{"text":"dis","type":"prefix","gloss":"따로·여기저기"},{"text":"pos","type":"root","gloss":"놓다"},{"text":"al","type":"suffix","gloss":"~하는 것"}],"story":"여기저기 배치함 → 마음대로 처리할 수 있음 → (at one's disposal) 쓸 수 있는"},"example":{"q":"What do you need to succeed in this role?","a":"I work best when I have good documentation at my disposal and a clear person to ask questions.","a_ko":"제가 쓸 수 있는 좋은 문서가 있고, 질문할 사람이 분명할 때 가장 잘 일합니다."},"collocations":["at my disposal","at your disposal","waste disposal"],"related":["disposable","oppose","impostor","positioning"],"tip":"at one's disposal(마음대로 쓸 수 있는) 형태로 가장 많이 씀"},{"id":"d03-B07","day":3,"level":2,"set":"B","family":"F3","word":"transpose","pos":"verb","ipa":"/trænsˈpoʊz/","meaning_ko":"(행과 열을) 바꾸다, 전치하다","category":"it","etymology":{"parts":[{"text":"trans","type":"prefix","gloss":"건너"},{"text":"pose","type":"root","gloss":"놓다 (pos)"}],"story":"건너편으로 옮겨 놓다 → 위치를 바꾸다 → 행과 열을 바꾸다"},"example":{"q":"How did you prepare the data for the dashboard?","a":"I transposed the raw table so that each metric became a column, which made the charts much easier to build.","a_ko":"원본 테이블을 전치해서 지표마다 열이 되게 했더니 차트 만들기가 훨씬 쉬워졌습니다."},"collocations":["transpose a matrix","transpose rows and columns"],"related":["pose","exposure","composition","decompose"],"tip":"엑셀·pandas에서 행과 열을 바꿀 때 쓰는 동사"},{"id":"d03-B08","day":3,"level":3,"set":"B","family":"F3","word":"compound","pos":"verb","ipa":"/kəmˈpaʊnd/","meaning_ko":"(문제를) 키우다, 쌓여 커지다","category":"interview","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"함께"},{"text":"pound","type":"root","gloss":"놓다 (pon)"}],"story":"함께 놓다(componere) → 섞어 합치다 → 쌓여서 더 커지다"},"example":{"q":"Why do you care so much about technical debt?","a":"Small shortcuts compound over time; on my last project, they turned a one-day feature into a two-week effort.","a_ko":"작은 편법은 시간이 지나며 쌓여 커집니다. 지난 프로젝트에서는 하루짜리 기능이 2주짜리 작업이 됐습니다."},"collocations":["compound the problem","compound over time","compound interest"],"related":["component","composition","proponent","posture"],"tip":"명사(혼합물)는 강세가 앞 /ˈkɑːm-/, 동사는 뒤 /kəmˈpaʊnd/"},{"id":"d03-B09","day":3,"level":1,"set":"B","family":"F3","word":"system","pos":"noun","ipa":"/ˈsɪstəm/","meaning_ko":"시스템, 체계","category":"it","etymology":{"parts":[{"text":"sy","type":"prefix","gloss":"함께 (syn)"},{"text":"stem","type":"root","gloss":"세운 것 (그리스어 sta)"}],"story":"함께 세워 놓은 것 → 짜임새 있는 전체 → 체계·시스템"},"example":{"q":"What kind of systems have you built?","a":"I've built payment systems that handle thousands of transactions per minute.","a_ko":"분당 수천 건의 거래를 처리하는 결제 시스템을 만들어 왔습니다."},"collocations":["build a system","legacy system","distributed system"],"related":["systematic","ecosystem","static","stance"],"tip":"그리스어 syn(함께) + histanai(세우다). 라틴어 sta와 같은 뿌리"},{"id":"d03-B10","day":3,"level":2,"set":"B","family":"F3","word":"systematic","pos":"adjective","ipa":"/ˌsɪstəˈmætɪk/","meaning_ko":"체계적인","category":"interview","etymology":{"parts":[{"text":"sy","type":"prefix","gloss":"함께 (syn)"},{"text":"stemat","type":"root","gloss":"세운 것 (그리스어 sta)"},{"text":"ic","type":"suffix","gloss":"~한"}],"story":"체계(system)를 따르는 → 체계적인"},"example":{"q":"How do you debug a problem you have never seen before?","a":"I take a systematic approach: I reproduce the issue, narrow down the cause with logs, and test one change at a time.","a_ko":"체계적으로 접근합니다. 문제를 재현하고, 로그로 원인을 좁히고, 한 번에 하나씩 바꿔 보며 확인합니다."},"collocations":["systematic approach","in a systematic way","systematic review"],"related":["system","ecosystem","static","statistics"],"tip":"문제 해결 방식을 물을 때 'systematic approach'가 가장 깔끔한 답"},{"id":"d03-B11","day":3,"level":1,"set":"B","family":"F3","word":"statistics","pos":"noun","ipa":"/stəˈtɪstɪks/","meaning_ko":"통계","category":"it","etymology":{"parts":[{"text":"stat","type":"root","gloss":"서 있는 상태 → 국가 (status)"},{"text":"ist","type":"suffix","gloss":"~하는 사람"},{"text":"ics","type":"suffix","gloss":"~학"}],"story":"서 있는 상태(status) → 국가(state) → 국가 상태를 나타내는 숫자 → 통계"},"example":{"q":"How do you decide which features to improve?","a":"I check the usage statistics first and focus on the most used features.","a_ko":"먼저 사용 통계를 보고 가장 많이 쓰이는 기능에 집중합니다."},"collocations":["usage statistics","statistics show","basic statistics"],"related":["statement","static","stance","system"],"tip":"줄여서 stats. 원래 '국가 상태에 관한 숫자'라는 뜻"},{"id":"d03-B12","day":3,"level":1,"set":"B","family":"F3","word":"statement","pos":"noun","ipa":"/ˈsteɪtmənt/","meaning_ko":"(코드·SQL의) 문, 진술","category":"it","etymology":{"parts":[{"text":"state","type":"root","gloss":"상태 → 밝혀 말하다 (status)"},{"text":"ment","type":"suffix","gloss":"~것"}],"story":"상태를 밝힘 → 진술 → 코드의 한 문장"},"example":{"q":"How do you prevent SQL injection?","a":"I always use prepared statements instead of building SQL strings by hand.","a_ko":"SQL 문자열을 직접 조립하지 않고 항상 prepared statement를 씁니다."},"collocations":["prepared statement","if statement","problem statement"],"related":["statistics","static","stance","constitute"],"tip":"면접에서는 'problem statement(문제 정의)'로도 자주 씀"},{"id":"d03-B13","day":3,"level":2,"set":"B","family":"F3","word":"static","pos":"adjective","ipa":"/ˈstætɪk/","meaning_ko":"정적인, 고정된","category":"it","etymology":{"parts":[{"text":"stat","type":"root","gloss":"서 있게 하다 (그리스어 sta)"},{"text":"ic","type":"suffix","gloss":"~한"}],"story":"서 있게 하는 → 움직이지 않는 → 정적인"},"example":{"q":"How did you improve the page load time?","a":"I moved static assets like images and scripts to a CDN, which reduced load time by about forty percent.","a_ko":"이미지와 스크립트 같은 정적 리소스를 CDN으로 옮겨 로딩 시간을 약 40% 줄였습니다."},"collocations":["static assets","static analysis","static typing"],"related":["system","statistics","statement","stance"],"tip":"반대말은 dynamic. 'static analysis(정적 분석)'도 자주 나옴"},{"id":"d03-B14","day":3,"level":2,"set":"B","family":"F3","word":"stance","pos":"noun","ipa":"/stæns/","meaning_ko":"입장, 태도","category":"interview","etymology":{"parts":[{"text":"st","type":"root","gloss":"서다 (sta)"},{"text":"ance","type":"suffix","gloss":"~하는 것"}],"story":"서 있는 자리 → 서 있는 자세 → 입장"},"example":{"q":"What is your stance on remote work?","a":"My stance is flexible: I'm productive remotely, but I value in-person time for planning and design discussions.","a_ko":"저는 유연한 입장입니다. 원격으로도 생산적으로 일하지만, 기획이나 설계 논의에는 대면 시간이 소중하다고 생각합니다."},"collocations":["take a stance","my stance on","a firm stance"],"related":["statement","static","constant","circumstance"],"tip":"opinion보다 '분명한 입장'이라는 느낌. take a stance on ~"},{"id":"d03-B15","day":3,"level":1,"set":"B","family":"F3","word":"establish","pos":"verb","ipa":"/ɪˈstæblɪʃ/","meaning_ko":"세우다, (연결을) 맺다","category":"it","etymology":{"parts":[{"text":"establ","type":"root","gloss":"단단히 세우다 (stabilis ← sta)"},{"text":"ish","type":"suffix","gloss":"~하게 하다"}],"story":"단단히 서게 하다(stabilire) → 세우다 → 확립하다"},"example":{"q":"What did you do first when you joined your last team?","a":"I established a code review process because the team had no review rules.","a_ko":"팀에 리뷰 규칙이 없어서 코드 리뷰 프로세스를 먼저 만들었습니다."},"collocations":["establish a connection","establish a process","well-established"],"related":["constant","constitute","statistics","system"],"tip":"IT에서는 'establish a connection(연결을 맺다)'으로 자주 씀. 앞의 e-는 발음을 위해 붙은 소리"},{"id":"d03-B16","day":3,"level":3,"set":"B","family":"F3","word":"constitute","pos":"verb","ipa":"/ˈkɑːnstətuːt/","meaning_ko":"~을 차지하다, 구성하다","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"stitute","type":"root","gloss":"세우다 (statuere ← sta)"}],"story":"함께 세우다 → 이루다 → ~에 해당하다·차지하다"},"example":{"q":"How did you decide what to fix first?","a":"I found that three endpoints constituted over seventy percent of our errors, so I fixed those first and saw the error rate drop quickly.","a_ko":"엔드포인트 세 개가 전체 오류의 70% 이상을 차지한다는 걸 알고, 그것부터 고쳐서 오류율을 빠르게 낮췄습니다."},"collocations":["constitute a risk","constitute the majority","what constitutes"],"related":["substitute","institute","establish","constant"],"tip":"make up보다 격식 있음. 'X constitutes Y%'로 비율을 말할 때 좋음"},{"id":"d03-B17","day":3,"level":1,"set":"B","family":"F3","word":"constant","pos":"adjective","ipa":"/ˈkɑːnstənt/","meaning_ko":"일정한, 끊임없는","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께·완전히"},{"text":"st","type":"root","gloss":"서다 (sta)"},{"text":"ant","type":"suffix","gloss":"~한"}],"story":"굳게 서 있는 → 변하지 않는 → 일정한·상수"},"example":{"q":"Why did you choose that database?","a":"It gives constant read times even when our data grows quickly.","a_ko":"데이터가 빠르게 늘어나도 읽기 시간이 일정하게 유지되기 때문입니다."},"collocations":["constant time","constant feedback","define a constant"],"related":["stance","contrast","establish","constitute"],"tip":"알고리즘의 constant time = O(1). 코드에서는 명사로 '상수'"},{"id":"d03-B18","day":3,"level":1,"set":"B","family":"F3","word":"contrast","pos":"noun","ipa":"/ˈkɑːntræst/","meaning_ko":"대조, 차이","category":"interview","etymology":{"parts":[{"text":"contra","type":"prefix","gloss":"맞서"},{"text":"st","type":"root","gloss":"서다 (sta)"}],"story":"맞서 서 있다 → 나란히 세워 비교 → 대조"},"example":{"q":"How is this role different from your current one?","a":"In contrast to my current job, this role focuses more on product design.","a_ko":"지금 일과 달리 이 직무는 제품 설계에 더 집중합니다."},"collocations":["in contrast to","by contrast","a sharp contrast"],"related":["constant","stance","establish","stage"],"tip":"명사는 강세가 앞 /ˈkɑːn-/, 동사는 뒤 /kənˈtræst/"},{"id":"d03-B19","day":3,"level":1,"set":"B","family":"F3","word":"stage","pos":"noun","ipa":"/steɪdʒ/","meaning_ko":"단계, 무대","category":"it","etymology":{"parts":[{"text":"st","type":"root","gloss":"서다 (sta)"},{"text":"age","type":"suffix","gloss":"~하는 곳"}],"story":"서 있는 곳 → 층·단 → 단계"},"example":{"q":"How does your CI pipeline work?","a":"Our pipeline has three stages: build, test, and deploy.","a_ko":"저희 파이프라인은 빌드, 테스트, 배포의 세 단계로 되어 있습니다."},"collocations":["pipeline stage","early stage","at this stage"],"related":["staging","workstation","statistics","static"],"tip":"at this stage(현재 단계에서)는 진행 상황을 말할 때도 씀"},{"id":"d03-B20","day":3,"level":1,"set":"B","family":"F3","word":"workstation","pos":"noun","ipa":"/ˈwɝːkˌsteɪʃən/","meaning_ko":"작업용 컴퓨터, 워크스테이션","category":"it","etymology":{"parts":[{"text":"work","type":"part","gloss":"일"},{"text":"sta","type":"root","gloss":"서다"},{"text":"tion","type":"suffix","gloss":"~하는 곳"}],"story":"일(work) + 서 있는 곳(station) → 일하는 자리 → 작업용 컴퓨터"},"example":{"q":"How do you set up a new development environment?","a":"I use a setup script, so a new workstation is ready in under an hour.","a_ko":"설정 스크립트를 써서 새 작업용 PC를 한 시간 안에 준비합니다."},"collocations":["developer workstation","set up a workstation"],"related":["stage","statistics","system","establish"],"tip":"station(서 있는 곳, 라틴어 statio)에 work가 붙은 합성어"},{"id":"d03-B21","day":3,"level":1,"set":"B","family":"F3","word":"cost","pos":"noun","ipa":"/kɔːst/","meaning_ko":"비용","category":"it","etymology":{"parts":[{"text":"co","type":"prefix","gloss":"함께 (con)"},{"text":"st","type":"root","gloss":"서다 (sta)"}],"story":"함께 서다(constare) → 값이 ~에 서다 → 값이 들다 → 비용"},"example":{"q":"What was the impact of your optimization?","a":"We cut our monthly cloud cost by thirty percent by removing idle servers.","a_ko":"놀고 있는 서버를 정리해서 월 클라우드 비용을 30% 줄였습니다."},"collocations":["cloud cost","reduce costs","at the cost of"],"related":["costly","constant","contrast","stance"],"tip":"라틴어 constare가 고대 프랑스어 coster를 거쳐 줄어든 말"},{"id":"d03-B22","day":3,"level":1,"set":"B","family":"F3","word":"costly","pos":"adjective","ipa":"/ˈkɔːstli/","meaning_ko":"대가가 큰, 비싼","category":"interview","etymology":{"parts":[{"text":"co","type":"prefix","gloss":"함께 (con)"},{"text":"st","type":"root","gloss":"서다 (sta)"},{"text":"ly","type":"suffix","gloss":"~한"}],"story":"비용(cost)이 큰 → 대가가 큰"},"example":{"q":"What is the biggest mistake you have made?","a":"I once skipped a backup check, and it became a costly mistake.","a_ko":"한 번 백업 확인을 건너뛰었는데, 그게 대가가 큰 실수가 됐습니다."},"collocations":["costly mistake","costly delay","prove costly"],"related":["cost","constant","contrast"],"tip":"-ly로 끝나지만 부사가 아니라 형용사"},{"id":"d03-B23","day":3,"level":1,"set":"B","family":"F3","word":"workplace","pos":"noun","ipa":"/ˈwɝːkpleɪs/","meaning_ko":"직장, 일터","category":"interview","etymology":{"parts":[{"text":"work","type":"part","gloss":"일"},{"text":"place","type":"part","gloss":"장소"}],"story":"일(work) + 장소(place) → 일하는 곳 → 직장"},"example":{"q":"What kind of workplace do you thrive in?","a":"I do best in a workplace where people share feedback openly.","a_ko":"사람들이 피드백을 솔직하게 주고받는 직장에서 가장 잘 일합니다."},"collocations":["inclusive workplace","workplace culture","in the workplace"],"related":["coworker","workload","teamwork","teammate"],"tip":"회사 문화를 묻는 질문에서 company보다 자연스럽게 쓰임"},{"id":"d03-B24","day":3,"level":1,"set":"B","family":"F3","word":"workload","pos":"noun","ipa":"/ˈwɝːkloʊd/","meaning_ko":"업무량","category":"interview","etymology":{"parts":[{"text":"work","type":"part","gloss":"일"},{"text":"load","type":"part","gloss":"짐"}],"story":"일(work) + 짐(load) → 짊어진 일의 양 → 업무량"},"example":{"q":"How do you manage a heavy workload?","a":"When my workload is heavy, I rank tasks and ask my manager what can wait.","a_ko":"업무량이 많을 때는 일의 순위를 정하고, 무엇을 미뤄도 되는지 매니저에게 물어봅니다."},"collocations":["heavy workload","manage my workload","balance the workload"],"related":["workplace","deadline","workflow","coworker"],"tip":"IT에서는 '서버가 처리하는 작업량'이라는 뜻으로도 씀"},{"id":"d03-B25","day":3,"level":1,"set":"B","family":"F3","word":"teamwork","pos":"noun","ipa":"/ˈtiːmwɝːk/","meaning_ko":"팀워크, 협동","category":"interview","etymology":{"parts":[{"text":"team","type":"part","gloss":"팀"},{"text":"work","type":"part","gloss":"일"}],"story":"팀(team) + 일(work) → 함께 하는 일 → 협동"},"example":{"q":"Can you give an example of good teamwork?","a":"Our launch succeeded because of teamwork between design, backend, and QA.","a_ko":"디자인, 백엔드, QA 사이의 팀워크 덕분에 출시가 성공했습니다."},"collocations":["good teamwork","teamwork skills","strong teamwork"],"related":["teammate","coworker","workplace"],"tip":"셀 수 없는 명사 — a teamwork(X)"},{"id":"d03-C01","day":3,"level":1,"set":"C","family":"F3","word":"assist","pos":"verb","ipa":"/əˈsɪst/","meaning_ko":"돕다, 지원하다","category":"interview","etymology":{"parts":[{"text":"as","type":"prefix","gloss":"곁에 (ad)"},{"text":"sist","type":"root","gloss":"서다"}],"story":"곁에 서다 → 거들다 → 돕다"},"example":{"q":"What was your role in that migration?","a":"I assisted the lead engineer and handled most of the data validation.","a_ko":"리드 엔지니어를 도우면서 데이터 검증 대부분을 맡았습니다."},"collocations":["assist with","assist someone in","AI-assisted"],"related":["assistance","insist","consist","resist"],"tip":"help보다 격식 있음. assist with + 일"},{"id":"d03-C02","day":3,"level":1,"set":"C","family":"F3","word":"assistance","pos":"noun","ipa":"/əˈsɪstəns/","meaning_ko":"도움, 지원","category":"interview","etymology":{"parts":[{"text":"as","type":"prefix","gloss":"곁에 (ad)"},{"text":"sist","type":"root","gloss":"서다"},{"text":"ance","type":"suffix","gloss":"~하는 것"}],"story":"곁에 서 줌 → 거들어 줌 → 도움"},"example":{"q":"What do you do when you are stuck?","a":"After being stuck for thirty minutes, I ask a senior engineer for assistance.","a_ko":"30분 넘게 막히면 선배 엔지니어에게 도움을 요청합니다."},"collocations":["ask for assistance","technical assistance","with the assistance of"],"related":["assist","resistance","consistent","insist"],"tip":"셀 수 없는 명사 — an assistance(X)"},{"id":"d03-C03","day":3,"level":1,"set":"C","family":"F3","word":"insist","pos":"verb","ipa":"/ɪnˈsɪst/","meaning_ko":"꼭 ~하자고 하다, 고집하다","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"위에"},{"text":"sist","type":"root","gloss":"서다"}],"story":"~위에 굳게 서다 → 버티다 → 강하게 주장하다"},"example":{"q":"Is there anything you always insist on in code reviews?","a":"I always insist on tests for every bug fix, even small ones.","a_ko":"작은 수정이라도 버그를 고칠 때는 항상 테스트를 꼭 붙이자고 합니다."},"collocations":["insist on","insist that","if you insist"],"related":["assist","consist","resist","exist"],"tip":"insist on + 명사/-ing. 너무 자주 쓰면 고집 센 인상이니 원칙을 말할 때만"},{"id":"d03-C04","day":3,"level":1,"set":"C","family":"F3","word":"consist","pos":"verb","ipa":"/kənˈsɪst/","meaning_ko":"~로 이루어지다","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"sist","type":"root","gloss":"서다"}],"story":"함께 서 있다 → 함께 이루다 → ~로 구성되다"},"example":{"q":"Can you describe your current architecture?","a":"It consists of five microservices behind one API gateway.","a_ko":"API 게이트웨이 하나 뒤에 다섯 개의 마이크로서비스로 이루어져 있습니다."},"collocations":["consist of","mainly consist of"],"related":["consistent","assist","insist","exist"],"tip":"반드시 consist of. 수동태(be consisted of)로 쓰지 않음"},{"id":"d03-C05","day":3,"level":2,"set":"C","family":"F3","word":"consistent","pos":"adjective","ipa":"/kənˈsɪstənt/","meaning_ko":"일관된, 꾸준한","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"sist","type":"root","gloss":"서다"},{"text":"ent","type":"suffix","gloss":"~한"}],"story":"함께 굳게 서 있는 → 흔들리지 않는 → 일관된"},"example":{"q":"What is your greatest strength?","a":"I'm consistent: I deliver on time, communicate clearly, and keep the same quality even under pressure.","a_ko":"꾸준함이 강점입니다. 압박 속에서도 제때 결과를 내고, 명확히 소통하며, 같은 품질을 유지합니다."},"collocations":["consistent with","consistent results","eventually consistent"],"related":["consist","assist","insist","resist"],"tip":"IT에서는 'eventually consistent(최종적 일관성)'로도 나옴"},{"id":"d03-C06","day":3,"level":1,"set":"C","family":"F3","word":"resist","pos":"verb","ipa":"/rɪˈzɪst/","meaning_ko":"참다, 저항하다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"맞서·뒤로"},{"text":"sist","type":"root","gloss":"서다"}],"story":"맞서 버티고 서다 → 저항하다 → (하고 싶은 것을) 참다"},"example":{"q":"How do you avoid over-engineering?","a":"I resist adding features that nobody has asked for yet.","a_ko":"아직 아무도 요청하지 않은 기능은 넣고 싶어도 참습니다."},"collocations":["resist the urge to","resist change","hard to resist"],"related":["resistance","insist","assist","consist"],"tip":"resist the urge to ~(~하고 싶은 마음을 참다)가 자연스러운 표현"},{"id":"d03-C07","day":3,"level":2,"set":"C","family":"F3","word":"resistance","pos":"noun","ipa":"/rɪˈzɪstəns/","meaning_ko":"반발, 저항","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"맞서·뒤로"},{"text":"sist","type":"root","gloss":"서다"},{"text":"ance","type":"suffix","gloss":"~하는 것"}],"story":"맞서 버티고 섬 → 저항 → 반발"},"example":{"q":"How did you introduce a new tool to your team?","a":"There was some resistance at first, so I ran a small pilot and shared the results before asking everyone to switch.","a_ko":"처음엔 반발이 좀 있어서, 작은 시범 운영을 하고 결과를 공유한 뒤에 모두에게 바꾸자고 했습니다."},"collocations":["resistance to change","meet resistance","path of least resistance"],"related":["resist","consistent","assistance","insist"],"tip":"변화 관리 질문에서 'resistance to change'로 자주 씀"},{"id":"d03-C08","day":3,"level":1,"set":"C","family":"F3","word":"exist","pos":"verb","ipa":"/ɪɡˈzɪst/","meaning_ko":"존재하다, 있다","category":"it","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"ist","type":"root","gloss":"서다 (sist)"}],"story":"밖으로 나와 서다 → 나타나다 → 존재하다"},"example":{"q":"How did you find the bug?","a":"The bug existed only in production, so I compared the two configs line by line.","a_ko":"그 버그는 운영 환경에만 있어서 두 설정 파일을 한 줄씩 비교했습니다."},"collocations":["already exist","if it exists","no longer exist"],"related":["existing","assist","consist","resist"],"tip":"ex + sistere에서 s가 빠진 모양. 발음 /ɪɡˈzɪst/"},{"id":"d03-C09","day":3,"level":1,"set":"C","family":"F3","word":"existing","pos":"adjective","ipa":"/ɪɡˈzɪstɪŋ/","meaning_ko":"기존의","category":"it","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"ist","type":"root","gloss":"서다 (sist)"},{"text":"ing","type":"suffix","gloss":"~하고 있는"}],"story":"존재하고 있는 → 이미 있는 → 기존의"},"example":{"q":"How did you add the new feature?","a":"I added it without changing the existing API, so no clients broke.","a_ko":"기존 API를 바꾸지 않고 추가해서 어떤 클라이언트도 깨지지 않았습니다."},"collocations":["existing system","existing customers","existing code"],"related":["exist","consist","assist"],"tip":"'기존 ~'은 거의 existing으로 말함 (existing system, existing users)"},{"id":"d03-C10","day":3,"level":1,"set":"C","family":"F3","word":"instant","pos":"adjective","ipa":"/ˈɪnstənt/","meaning_ko":"즉각적인","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"가까이·위에"},{"text":"st","type":"root","gloss":"서다 (sta)"},{"text":"ant","type":"suffix","gloss":"~한"}],"story":"바로 곁에 서 있는(instans) → 지금 당장의 → 즉각적인"},"example":{"q":"Why do you like small pull requests?","a":"Small pull requests give me almost instant feedback from reviewers.","a_ko":"작은 풀 리퀘스트는 리뷰어에게서 거의 즉각적인 피드백을 받게 해 줍니다."},"collocations":["instant feedback","instant messaging","in an instant"],"related":["instance","instantiate","distance","circumstance"],"tip":"instantly(즉시)도 같이 알아 두기"},{"id":"d03-C11","day":3,"level":2,"set":"C","family":"F3","word":"instance","pos":"noun","ipa":"/ˈɪnstəns/","meaning_ko":"인스턴스, 사례","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"가까이·위에"},{"text":"st","type":"root","gloss":"서다 (sta)"},{"text":"ance","type":"suffix","gloss":"~하는 것"}],"story":"가까이 서 있음(instantia) → 눈앞에 내놓는 예 → 사례 → (IT) 실제로 만들어진 하나"},"example":{"q":"How did you handle the traffic spike?","a":"We set up auto scaling to add EC2 instances when CPU usage stayed above seventy percent for five minutes.","a_ko":"CPU 사용률이 5분 동안 70%를 넘으면 EC2 인스턴스를 추가하도록 오토스케일링을 설정했습니다."},"collocations":["for instance","EC2 instance","a single instance"],"related":["instant","instantiate","circumstance","substantial"],"tip":"'for instance(예를 들어)'로 답변 속 예시를 시작할 때도 씀"},{"id":"d03-C12","day":3,"level":2,"set":"C","family":"F3","word":"instantiate","pos":"verb","ipa":"/ɪnˈstænʃieɪt/","meaning_ko":"(객체를) 생성하다, 인스턴스화하다","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"가까이·위에"},{"text":"stant","type":"root","gloss":"서다 (sta)"},{"text":"iate","type":"suffix","gloss":"~하게 하다"}],"story":"사례(instance)로 만들다 → 실제 객체를 만들다"},"example":{"q":"How did you make that class easier to test?","a":"I stopped instantiating the database client inside the class and injected it through the constructor instead.","a_ko":"클래스 안에서 DB 클라이언트를 직접 생성하지 않고, 생성자로 주입받게 바꿨습니다."},"collocations":["instantiate a class","instantiate an object"],"related":["instance","instant","substantial","constant"],"tip":"instance(인스턴스)를 만든다는 동사. 발음 /ɪnˈstænʃi-/"},{"id":"d03-C13","day":3,"level":1,"set":"C","family":"F3","word":"circumstance","pos":"noun","ipa":"/ˈsɝːkəmstæns/","meaning_ko":"상황, 사정","category":"interview","etymology":{"parts":[{"text":"circum","type":"prefix","gloss":"둘레에"},{"text":"st","type":"root","gloss":"서다 (sta)"},{"text":"ance","type":"suffix","gloss":"~하는 것"}],"story":"둘레에 서 있는 것 → 주위 사정 → 상황"},"example":{"q":"Would you ever work on weekends?","a":"Under special circumstances, like a major outage, I'm happy to help.","a_ko":"큰 장애 같은 특별한 상황이라면 기꺼이 돕겠습니다."},"collocations":["under the circumstances","special circumstances","in any circumstances"],"related":["instance","distance","substantial","stance"],"tip":"보통 복수형 circumstances로 씀"},{"id":"d03-C14","day":3,"level":1,"set":"C","family":"F3","word":"distance","pos":"noun","ipa":"/ˈdɪstəns/","meaning_ko":"거리, 떨어져 있음","category":"interview","etymology":{"parts":[{"text":"di","type":"prefix","gloss":"떨어져 (dis)"},{"text":"st","type":"root","gloss":"서다 (sta)"},{"text":"ance","type":"suffix","gloss":"~하는 것"}],"story":"떨어져 서 있음(distare) → 거리"},"example":{"q":"How do you work with a team in another time zone?","a":"Distance is not a problem for me if we write things down clearly.","a_ko":"내용을 명확하게 글로 남기면 거리는 저에게 문제가 되지 않습니다."},"collocations":["long distance","at a distance","keep my distance"],"related":["instance","circumstance","instant","substantial"],"tip":"dis + stare에서 s가 하나로 합쳐진 모양"},{"id":"d03-C15","day":3,"level":3,"set":"C","family":"F3","word":"substantial","pos":"adjective","ipa":"/səbˈstænʃəl/","meaning_ko":"상당한, 실질적인","category":"interview","etymology":{"parts":[{"text":"sub","type":"prefix","gloss":"아래에"},{"text":"stant","type":"root","gloss":"서다 (sta)"},{"text":"ial","type":"suffix","gloss":"~한"}],"story":"밑에 서서 받치는 것 = 실체(substance) → 실체가 있는 → 상당한·실질적인"},"example":{"q":"What was the biggest impact you had at your last company?","a":"I led the caching project that made a substantial difference: average response time fell by sixty percent, and infrastructure costs dropped by about a quarter.","a_ko":"제가 이끈 캐싱 프로젝트가 큰 차이를 만들었습니다. 평균 응답 시간이 60% 줄고 인프라 비용도 약 4분의 1 감소했습니다."},"collocations":["substantial impact","a substantial amount of","substantial improvement"],"related":["substantive","instance","circumstance","distance"],"tip":"big보다 정확하고 성숙한 느낌. 성과 숫자와 함께 쓰면 효과적"},{"id":"d03-C16","day":3,"level":3,"set":"C","family":"F3","word":"substantive","pos":"adjective","ipa":"/ˈsʌbstəntɪv/","meaning_ko":"알맹이 있는, 실질적인","category":"interview","etymology":{"parts":[{"text":"sub","type":"prefix","gloss":"아래에"},{"text":"stant","type":"root","gloss":"서다 (sta)"},{"text":"ive","type":"suffix","gloss":"~한"}],"story":"밑에 서서 받치는 것 = 실체(substance) → 실체에 관한 → 내용이 있는"},"example":{"q":"How do you give feedback in code reviews?","a":"I try to keep my comments substantive, focusing on design and correctness, and I let automated linters handle the style issues.","a_ko":"코멘트를 실질적인 내용으로 채우려고 합니다. 설계와 정확성에 집중하고 스타일 문제는 자동 린터에 맡깁니다."},"collocations":["substantive feedback","substantive discussion","substantive changes"],"related":["substantial","instance","circumstance","constitute"],"tip":"substantial(양이 상당한)과 달리 substantive는 '알맹이가 있는'에 초점"},{"id":"d03-C17","day":3,"level":2,"set":"C","family":"F3","word":"stateless","pos":"adjective","ipa":"/ˈsteɪtləs/","meaning_ko":"상태를 저장하지 않는","category":"it","etymology":{"parts":[{"text":"state","type":"root","gloss":"상태 (status ← sta)"},{"text":"less","type":"suffix","gloss":"~없는"}],"story":"서 있는 상태(state)가 없는 → 요청 사이에 기억을 남기지 않는"},"example":{"q":"How did you make the service easy to scale?","a":"I made the API servers stateless and moved session data to Redis, so we could add servers at any time.","a_ko":"API 서버를 상태 비저장으로 만들고 세션 데이터를 Redis로 옮겨서 언제든 서버를 늘릴 수 있게 했습니다."},"collocations":["stateless service","stateless API","stateless architecture"],"related":["statement","static","statistics","stage"],"tip":"반대말 stateful. 확장성 질문의 핵심 단어"},{"id":"d03-C18","day":3,"level":2,"set":"C","family":"F3","word":"ecosystem","pos":"noun","ipa":"/ˈiːkoʊˌsɪstəm/","meaning_ko":"(기술·도구) 생태계","category":"it","etymology":{"parts":[{"text":"eco","type":"prefix","gloss":"집·환경 (그리스어 oikos)"},{"text":"sy","type":"prefix","gloss":"함께 (syn)"},{"text":"stem","type":"root","gloss":"세운 것 (그리스어 sta)"}],"story":"환경(eco) + 체계(system) → 생태계 → 서로 얽힌 도구·서비스 전체"},"example":{"q":"Why did you choose Python for that project?","a":"Python has a mature data ecosystem, so we could rely on proven libraries instead of writing everything ourselves.","a_ko":"파이썬은 데이터 생태계가 성숙해서, 전부 직접 만들지 않고 검증된 라이브러리에 기댈 수 있었습니다."},"collocations":["developer ecosystem","mature ecosystem","AWS ecosystem"],"related":["system","systematic","static","stateless"],"tip":"언어·플랫폼을 고른 이유를 설명할 때 자주 쓰는 말"},{"id":"d03-C19","day":3,"level":2,"set":"C","family":"F3","word":"staging","pos":"noun","ipa":"/ˈsteɪdʒɪŋ/","meaning_ko":"스테이징 (운영 직전 검증 환경)","category":"it","etymology":{"parts":[{"text":"stag","type":"root","gloss":"단계·무대 (stage ← sta)"},{"text":"ing","type":"suffix","gloss":"~하기"}],"story":"무대(stage)에 올리기 전 단계 → 운영 전 리허설 환경"},"example":{"q":"How do you make sure a release is safe?","a":"Every release runs in staging for a day with production-like data before we roll it out to users.","a_ko":"모든 릴리스는 사용자에게 배포하기 전에 운영과 비슷한 데이터로 하루 동안 스테이징에서 돌려 봅니다."},"collocations":["staging environment","staging server","deploy to staging"],"related":["stage","stateless","static","establish"],"tip":"dev → staging → production 순서로 말하면 자연스러움"},{"id":"d03-C20","day":3,"level":2,"set":"C","family":"F3","word":"ecstatic","pos":"adjective","ipa":"/ekˈstætɪk/","meaning_ko":"몹시 기쁜","category":"interview","etymology":{"parts":[{"text":"ec","type":"prefix","gloss":"밖으로 (그리스어 ek)"},{"text":"stat","type":"root","gloss":"서다 (그리스어 sta)"},{"text":"ic","type":"suffix","gloss":"~한"}],"story":"제자리 밖에 서다 → 정신이 나갈 만큼 → 몹시 기쁜"},"example":{"q":"How did you feel when the project launched?","a":"Honestly, I was ecstatic, because the team had worked on it for a whole year and users loved it.","a_ko":"솔직히 정말 기뻤습니다. 팀이 1년 내내 공들였고 사용자들도 아주 좋아했기 때문입니다."},"collocations":["ecstatic about","absolutely ecstatic"],"related":["static","system","stateless","ecosystem"],"tip":"very happy보다 훨씬 강함. 큰 성과를 말할 때만 아껴서 쓰기"},{"id":"d03-C21","day":3,"level":1,"set":"C","family":"F3","word":"substitute","pos":"noun","ipa":"/ˈsʌbstətuːt/","meaning_ko":"대신하는 것, 대체물","category":"interview","etymology":{"parts":[{"text":"sub","type":"prefix","gloss":"아래·대신"},{"text":"stitute","type":"root","gloss":"세우다 (statuere ← sta)"}],"story":"대신 자리에 세우다 → 대신하는 것 → 대체물"},"example":{"q":"Do you think AI tools can replace code reviews?","a":"AI tools help, but they are not a substitute for human review.","a_ko":"AI 도구가 도움은 되지만 사람의 리뷰를 대신할 수는 없습니다."},"collocations":["a substitute for","no substitute for","substitute A for B"],"related":["institute","constitute","stateless","circumstance"],"tip":"'There's no substitute for experience.'처럼 no substitute for가 자주 쓰임. 동사로도 씀"},{"id":"d03-C22","day":3,"level":3,"set":"C","family":"F3","word":"institute","pos":"verb","ipa":"/ˈɪnstətuːt/","meaning_ko":"(제도·규칙을) 도입하다, 시행하다","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안에"},{"text":"stitute","type":"root","gloss":"세우다 (statuere ← sta)"}],"story":"안에 세우다 → 제도를 세우다 → 도입·시행하다"},"example":{"q":"How did you reduce repeated incidents on your team?","a":"I instituted blameless postmortems after every major incident, and within six months the same type of failure stopped happening.","a_ko":"큰 장애마다 책임을 묻지 않는 사후 분석을 도입했고, 6개월 만에 같은 유형의 장애가 더 이상 일어나지 않았습니다."},"collocations":["institute a policy","institute changes","institute a process"],"related":["substitute","constitute","establish","stance"],"tip":"명사(연구소)로 더 익숙하지만, 동사로 쓰면 '제도를 도입하다'라는 고급 표현"},{"id":"d03-C23","day":3,"level":2,"set":"C","family":"F3","word":"locale","pos":"noun","ipa":"/loʊˈkæl/","meaning_ko":"로케일 (언어·지역 설정)","category":"it","etymology":{"parts":[{"text":"loc","type":"root","gloss":"장소 (locus)"},{"text":"ale","type":"suffix","gloss":"~의 (-al)"}],"story":"장소(locus)의 → 지역 → 언어·날짜 형식 같은 지역 설정"},"example":{"q":"Have you worked on internationalization?","a":"Yes, I added locale support so that dates and currencies display correctly for users in Japan and Korea.","a_ko":"네, 로케일 지원을 추가해서 일본과 한국 사용자에게 날짜와 통화가 올바르게 표시되게 했습니다."},"collocations":["locale settings","default locale","locale-specific"],"related":["location","relocate","local","allocate"],"tip":"발음 /loʊˈkæl/ '로우캘' — 끝의 e는 발음하지 않음"},{"id":"d03-C24","day":3,"level":1,"set":"C","family":"F3","word":"workflow","pos":"noun","ipa":"/ˈwɝːkfloʊ/","meaning_ko":"업무 흐름, 워크플로","category":"it","etymology":{"parts":[{"text":"work","type":"part","gloss":"일"},{"text":"flow","type":"part","gloss":"흐름"}],"story":"일(work) + 흐름(flow) → 일이 진행되는 순서 → 업무 흐름"},"example":{"q":"How has your team's workflow changed recently?","a":"We automated our release workflow, so deployments now take minutes instead of hours.","a_ko":"릴리스 업무 흐름을 자동화해서 이제 배포가 몇 시간이 아니라 몇 분이면 끝납니다."},"collocations":["streamline the workflow","CI workflow","workflow automation"],"related":["workload","workplace","teamwork"],"tip":"GitHub Actions 설정 파일도 workflow라고 부름"},{"id":"d03-C25","day":3,"level":2,"set":"C","family":"F3","word":"onboarding","pos":"noun","ipa":"/ˈɑːnˌbɔːrdɪŋ/","meaning_ko":"온보딩 (신입 적응 과정)","category":"interview","etymology":{"parts":[{"text":"on","type":"part","gloss":"위에"},{"text":"board","type":"part","gloss":"배·갑판"},{"text":"ing","type":"part","gloss":"~하기"}],"story":"배에 올라타기(on board) → 조직에 합류하기 → 신입 적응 과정"},"example":{"q":"How would you help a new hire get up to speed?","a":"I'd create an onboarding checklist and assign a buddy, so new hires can ship their first change within a week.","a_ko":"온보딩 체크리스트를 만들고 버디를 붙여서, 신입이 일주일 안에 첫 변경을 배포할 수 있게 하겠습니다."},"collocations":["onboarding process","smooth onboarding","onboarding documentation"],"related":["teammate","coworker","workplace"],"tip":"'on board(배에 탄)'에서 나온 말. get someone on board는 '동의를 얻다'"},{"id":"d03-D01","day":3,"level":1,"set":"D","family":"F3","word":"stay","pos":"verb","ipa":"/steɪ/","meaning_ko":"(상태를) 유지하다, 머물다","category":"interview","etymology":{"parts":[{"text":"stay","type":"root","gloss":"서다·머물다 (sta)"}],"story":"서다(stare) → 고대 프랑스어 ester → 그 자리에 서 있다 → 머물다·계속 ~한 상태이다"},"example":{"q":"How do you keep your skills current?","a":"I stay up to date by reading release notes and building small side projects.","a_ko":"릴리스 노트를 읽고 작은 사이드 프로젝트를 만들면서 최신 흐름을 따라갑니다."},"collocations":["stay up to date","stay focused","stay calm"],"related":["rest","remain","permanent","constant"],"tip":"stay + 형용사(focused, calm, positive)로 태도를 말할 때 편리"},{"id":"d03-D02","day":3,"level":1,"set":"D","family":"F3","word":"rest","pos":"noun","ipa":"/rest/","meaning_ko":"나머지","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤에"},{"text":"st","type":"root","gloss":"서다 (sta)"}],"story":"뒤에 서 있다(restare) → 남다 → 남은 것 → 나머지"},"example":{"q":"What did you do after the prototype was approved?","a":"I built the core module and helped the rest of the team finish theirs.","a_ko":"핵심 모듈을 만들고, 나머지 팀원들이 맡은 부분을 끝내도록 도왔습니다."},"collocations":["the rest of the team","the rest of the day","for the rest of"],"related":["stay","remain","remainder","constant"],"tip":"'휴식'의 rest는 게르만어에서 온 다른 단어. '나머지' rest만 라틴어 restare"},{"id":"d03-D03","day":3,"level":1,"set":"D","family":"F3","word":"remain","pos":"verb","ipa":"/rɪˈmeɪn/","meaning_ko":"남아 있다, 여전히 ~이다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤에"},{"text":"main","type":"root","gloss":"머물다 (manere)"}],"story":"뒤에 머물다 → 남다 → 계속 ~인 채로 있다"},"example":{"q":"What is still challenging in that project?","a":"One issue remains: our test suite is still too slow.","a_ko":"한 가지 문제가 남아 있습니다. 테스트가 여전히 너무 느립니다."},"collocations":["remain calm","remain the same","remain open to"],"related":["remainder","permanent","stay","rest"],"tip":"maintain의 main(손)과 철자는 같지만 remain의 main은 manere(머물다)"},{"id":"d03-D04","day":3,"level":1,"set":"D","family":"F3","word":"remainder","pos":"noun","ipa":"/rɪˈmeɪndɚ/","meaning_ko":"나머지, 남은 기간","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤에"},{"text":"main","type":"root","gloss":"머물다 (manere)"},{"text":"der","type":"suffix","gloss":"~하는 것"}],"story":"뒤에 머물러 있는 것 → 남은 것 → 나머지"},"example":{"q":"What would you focus on if you joined mid-year?","a":"For the remainder of the year, I'd focus on reducing our on-call alerts.","a_ko":"남은 기간 동안은 온콜 알림을 줄이는 데 집중하겠습니다."},"collocations":["the remainder of","for the remainder of the year"],"related":["remain","permanent","rest","stay"],"tip":"수학·코드에서는 나눗셈의 '나머지'(% 연산)도 remainder"},{"id":"d03-D05","day":3,"level":1,"set":"D","family":"F3","word":"permanent","pos":"adjective","ipa":"/ˈpɝːmənənt/","meaning_ko":"정규의, 영구적인","category":"interview","etymology":{"parts":[{"text":"per","type":"prefix","gloss":"끝까지"},{"text":"man","type":"root","gloss":"머물다 (manere)"},{"text":"ent","type":"suffix","gloss":"~한"}],"story":"끝까지 머무는 → 오래 가는 → 영구적인·정규의"},"example":{"q":"Are you looking for a contract role or a permanent one?","a":"I'm looking for a permanent role where I can grow for several years.","a_ko":"몇 년 동안 꾸준히 성장할 수 있는 정규직 자리를 찾고 있습니다."},"collocations":["permanent role","permanent fix","permanent position"],"related":["remain","remainder","stay","rest"],"tip":"temporary(임시의)와 짝으로 외우기. permanent fix는 '근본적인 수정'"},{"id":"d03-D06","day":3,"level":1,"set":"D","family":"F3","word":"maintain","pos":"verb","ipa":"/meɪnˈteɪn/","meaning_ko":"유지보수하다, 유지하다","category":"it","etymology":{"parts":[{"text":"main","type":"root","gloss":"손 (manus)"},{"text":"tain","type":"root","gloss":"쥐다 (tenere)"}],"story":"손에 쥐고 있다(manu tenere) → 계속 붙들다 → 유지하다"},"example":{"q":"What do you do in your current role?","a":"I maintain three internal services and add new features every sprint.","a_ko":"사내 서비스 세 개를 유지보수하고, 스프린트마다 새 기능을 추가합니다."},"collocations":["maintain a service","maintain quality","easy to maintain"],"related":["maintenance","manage","manual","manipulate"],"tip":"main은 manus(손)에서 온 것으로, remain의 main(머물다)과 어원이 다름. tain은 tenere(쥐다)"},{"id":"d03-D07","day":3,"level":2,"set":"D","family":"F3","word":"maintenance","pos":"noun","ipa":"/ˈmeɪntənəns/","meaning_ko":"유지보수, 점검","category":"it","etymology":{"parts":[{"text":"main","type":"root","gloss":"손 (manus)"},{"text":"ten","type":"root","gloss":"쥐다 (tenere)"},{"text":"ance","type":"suffix","gloss":"~하는 것"}],"story":"손에 쥐고 있음 → 계속 돌봄 → 유지보수"},"example":{"q":"How did you keep the legacy system running?","a":"I scheduled regular maintenance windows at night, so we could patch servers without affecting users.","a_ko":"야간에 정기 점검 시간을 잡아서, 사용자에게 영향을 주지 않고 서버를 패치할 수 있게 했습니다."},"collocations":["scheduled maintenance","maintenance window","low maintenance"],"related":["maintain","manual","manage","manipulate"],"tip":"철자 주의: maintain → maintenance (ai가 e로 바뀜)"},{"id":"d03-D08","day":3,"level":1,"set":"D","family":"F3","word":"manage","pos":"verb","ipa":"/ˈmænɪdʒ/","meaning_ko":"관리하다, 해내다","category":"interview","etymology":{"parts":[{"text":"man","type":"root","gloss":"손 (manus)"},{"text":"age","type":"suffix","gloss":"~하다 (이탈리아어 -eggiare)"}],"story":"손으로 (말을) 다루다(이탈리아어 maneggiare) → 다루다 → 관리하다·해내다"},"example":{"q":"How do you manage competing priorities?","a":"I manage competing priorities by reviewing them with my lead every Monday.","a_ko":"매주 월요일 리드와 함께 검토하면서 겹치는 우선순위를 관리합니다."},"collocations":["manage a team","manage to do","manage expectations"],"related":["manager","manual","maintain","maneuver"],"tip":"manage to + 동사 = (어렵게) 해내다"},{"id":"d03-D09","day":3,"level":1,"set":"D","family":"F3","word":"manager","pos":"noun","ipa":"/ˈmænɪdʒɚ/","meaning_ko":"매니저, 관리자","category":"interview","etymology":{"parts":[{"text":"man","type":"root","gloss":"손 (manus)"},{"text":"ag","type":"suffix","gloss":"~하다"},{"text":"er","type":"suffix","gloss":"~하는 사람"}],"story":"손으로 다루는 사람 → 관리하는 사람"},"example":{"q":"Why are you leaving your current job?","a":"My manager has been very supportive, but I want bigger technical challenges.","a_ko":"매니저는 많이 지원해 줬지만, 더 큰 기술적 도전을 원합니다."},"collocations":["hiring manager","engineering manager","report to a manager"],"related":["manage","manual","maintain"],"tip":"면접관이 hiring manager(채용 담당 매니저)인 경우가 많음"},{"id":"d03-D10","day":3,"level":1,"set":"D","family":"F3","word":"manual","pos":"adjective","ipa":"/ˈmænjuəl/","meaning_ko":"수동의, 손으로 하는","category":"it","etymology":{"parts":[{"text":"manu","type":"root","gloss":"손 (manus)"},{"text":"al","type":"suffix","gloss":"~의"}],"story":"손의 → 손으로 하는 → 수동의"},"example":{"q":"What task did you automate?","a":"I replaced a manual release checklist with a script that runs in two minutes.","a_ko":"수동 릴리스 체크리스트를 2분 만에 도는 스크립트로 바꿨습니다."},"collocations":["manual testing","manual process","user manual"],"related":["manage","maintain","manipulate","maneuver"],"tip":"반대말은 automated. 명사로는 '설명서'"},{"id":"d03-D11","day":3,"level":2,"set":"D","family":"F3","word":"manipulate","pos":"verb","ipa":"/məˈnɪpjəleɪt/","meaning_ko":"(데이터를) 가공하다, 조작하다","category":"it","etymology":{"parts":[{"text":"mani","type":"root","gloss":"손 (manus)"},{"text":"pul","type":"root","gloss":"가득 채우다 → 한 줌 (manipulus)"},{"text":"ate","type":"suffix","gloss":"~하다"}],"story":"손(manus)에 한 줌(manipulus) 쥐다 → 손으로 다루다 → 가공·조작하다"},"example":{"q":"What tools do you use for data work?","a":"I mainly use pandas to clean and manipulate large datasets before loading them into our warehouse.","a_ko":"주로 pandas로 대용량 데이터를 정리하고 가공한 뒤 데이터 웨어하우스에 적재합니다."},"collocations":["manipulate data","DOM manipulation","string manipulation"],"related":["manual","manage","maintain","maneuver"],"tip":"데이터·DOM에는 중립적인 '다루다'지만, 사람에게 쓰면 '조종하다'라는 나쁜 뜻이니 주의"},{"id":"d03-D12","day":3,"level":2,"set":"D","family":"F3","word":"maneuver","pos":"noun","ipa":"/məˈnuːvɚ/","meaning_ko":"운신의 폭, (능숙한) 움직임","category":"interview","etymology":{"parts":[{"text":"man","type":"root","gloss":"손 (manus)"},{"text":"euver","type":"root","gloss":"일하다 (opera)"}],"story":"손으로 일하다(manu operari) → 능숙한 조작 → 움직임·운신"},"example":{"q":"How did you handle a deadline that could not move?","a":"Since the date was fixed, our only room to maneuver was scope, so I negotiated which features could wait.","a_ko":"날짜가 고정돼 있어서 움직일 수 있는 건 범위뿐이었기에, 어떤 기능을 미룰 수 있을지 협의했습니다."},"collocations":["room to maneuver","a clever maneuver"],"related":["manual","manipulate","manage","maintain"],"tip":"room to maneuver(조정할 여지)로 자주 씀. 영국식 철자는 manoeuvre"},{"id":"d03-D13","day":3,"level":1,"set":"D","family":"F3","word":"session","pos":"noun","ipa":"/ˈseʃən/","meaning_ko":"세션, (모임) 시간","category":"it","etymology":{"parts":[{"text":"sess","type":"root","gloss":"앉다 (sed)"},{"text":"ion","type":"suffix","gloss":"~것"}],"story":"앉아 있음 → 함께 앉아 하는 모임 → 한 번의 접속 기간"},"example":{"q":"How do you handle user logins?","a":"We store session data in Redis and expire it after thirty minutes.","a_ko":"세션 데이터를 Redis에 저장하고 30분 뒤에 만료시킵니다."},"collocations":["user session","session timeout","knowledge-sharing session"],"related":["assess","possess","obsess","supersede"],"tip":"'앉아서 하는 모임'이 원뜻이라 회의·교육 시간도 session"},{"id":"d03-D14","day":3,"level":2,"set":"D","family":"F3","word":"assess","pos":"verb","ipa":"/əˈses/","meaning_ko":"평가하다, 판단하다","category":"interview","etymology":{"parts":[{"text":"as","type":"prefix","gloss":"곁에 (ad)"},{"text":"sess","type":"root","gloss":"앉다 (sed)"}],"story":"곁에 앉다(재판관 곁의 보좌관) → 세금·가치를 매기다 → 평가하다"},"example":{"q":"How do you evaluate a new library before using it?","a":"I assess it by checking how active the maintainers are, how good the docs are, and whether it fits our license policy.","a_ko":"메인테이너가 얼마나 활발한지, 문서가 좋은지, 사내 라이선스 정책에 맞는지 확인해서 평가합니다."},"collocations":["assess the risk","assess the impact","assess whether"],"related":["assessment","session","possess","supersede"],"tip":"'상황·위험을 판단한다'는 느낌. assess the risk/impact로 자주 씀"},{"id":"d03-D15","day":3,"level":2,"set":"D","family":"F3","word":"assessment","pos":"noun","ipa":"/əˈsesmənt/","meaning_ko":"평가, (채용) 과제 테스트","category":"interview","etymology":{"parts":[{"text":"as","type":"prefix","gloss":"곁에 (ad)"},{"text":"sess","type":"root","gloss":"앉다 (sed)"},{"text":"ment","type":"suffix","gloss":"~것"}],"story":"곁에 앉아 값을 매김 → 평가"},"example":{"q":"What did you think of our coding assessment?","a":"I enjoyed the assessment, because it felt close to real work instead of puzzles, and it showed me what the team values.","a_ko":"퍼즐이 아니라 실제 업무에 가까워서 좋았고, 팀이 무엇을 중요하게 여기는지 알 수 있었습니다."},"collocations":["technical assessment","risk assessment","honest assessment"],"related":["assess","session","possess","obsess"],"tip":"채용 과정의 과제 테스트를 보통 coding/technical assessment라고 부름"},{"id":"d03-D16","day":3,"level":2,"set":"D","family":"F3","word":"possess","pos":"verb","ipa":"/pəˈzes/","meaning_ko":"갖추다, 가지다","category":"interview","etymology":{"parts":[{"text":"pos","type":"prefix","gloss":"주인으로 (potis)"},{"text":"sess","type":"root","gloss":"앉다 (sed)"}],"story":"주인으로 앉다(possidere) → 차지하다 → 가지고 있다"},"example":{"q":"Why do you think you are a good fit?","a":"I possess the two skills this role needs most, backend design and clear communication, and I've used both daily for five years.","a_ko":"이 직무에 가장 필요한 두 가지, 백엔드 설계와 명확한 소통 능력을 갖추고 있고, 5년 동안 매일 써 왔습니다."},"collocations":["possess skills","possess knowledge","possess the ability to"],"related":["assess","obsess","session","supersede"],"tip":"have보다 격식 있음. 여기 pos는 '놓다'가 아니라 potis(힘 있는·주인)"},{"id":"d03-D17","day":3,"level":2,"set":"D","family":"F3","word":"obsess","pos":"verb","ipa":"/əbˈses/","meaning_ko":"집착하다","category":"interview","etymology":{"parts":[{"text":"ob","type":"prefix","gloss":"앞에·맞서"},{"text":"sess","type":"root","gloss":"앉다 (sed)"}],"story":"앞을 막고 앉다(포위하다) → 마음을 사로잡다 → 집착하다"},"example":{"q":"What is your biggest weakness?","a":"I sometimes obsess over small details, so now I set a time limit and ask for feedback earlier.","a_ko":"가끔 작은 부분에 집착하는 편이라, 이제는 시간 제한을 정하고 피드백을 더 일찍 받습니다."},"collocations":["obsess over","obsess about","customer-obsessed"],"related":["possess","assess","session","supersede"],"tip":"약점 질문 단골. customer-obsessed(고객에 집착하는)는 좋은 의미로도 씀"},{"id":"d03-D18","day":3,"level":3,"set":"D","family":"F3","word":"subsidiary","pos":"noun","ipa":"/səbˈsɪdieri/","meaning_ko":"자회사","category":"interview","etymology":{"parts":[{"text":"sub","type":"prefix","gloss":"아래·뒤에"},{"text":"sid","type":"root","gloss":"앉다 (sed)"},{"text":"iary","type":"suffix","gloss":"~에 속한"}],"story":"뒤에 앉아 대기하는 예비 병력(subsidium) → 보조하는 것 → 자회사"},"example":{"q":"What do you know about our company structure?","a":"I understand the Tokyo office is a subsidiary of the US company, so I expect to work closely with teams across time zones, which I've done before.","a_ko":"도쿄 오피스가 미국 본사의 자회사라고 알고 있어서, 시차가 있는 팀들과 긴밀히 일하게 될 거라 예상합니다. 전에도 해 본 일입니다."},"collocations":["a subsidiary of","wholly owned subsidiary","local subsidiary"],"related":["session","assess","possess","supersede"],"tip":"parent company(모회사)와 짝. 외국계 지사·자회사 면접에서 유용"},{"id":"d03-D19","day":3,"level":3,"set":"D","family":"F3","word":"supersede","pos":"verb","ipa":"/ˌsuːpɚˈsiːd/","meaning_ko":"대체하다, 밀어내다","category":"it","etymology":{"parts":[{"text":"super","type":"prefix","gloss":"위에"},{"text":"sede","type":"root","gloss":"앉다 (sed)"}],"story":"위에 앉다 → (옛것의) 자리를 차지하다 → 대체하다"},"example":{"q":"How did you handle the old API version?","a":"Once version two superseded the old API, we announced a six-month deprecation period and helped each client team migrate.","a_ko":"버전 2가 기존 API를 대체한 뒤, 6개월의 지원 종료 기간을 공지하고 각 클라이언트 팀의 이전을 도왔습니다."},"collocations":["be superseded by","supersede the old version"],"related":["session","assess","possess","obsess"],"tip":"철자 주의: -cede가 아니라 -sede (sedere 앉다)"},{"id":"d03-D20","day":3,"level":3,"set":"D","family":"F3","word":"assiduous","pos":"adjective","ipa":"/əˈsɪdʒuəs/","meaning_ko":"꼼꼼하고 부지런한","category":"interview","etymology":{"parts":[{"text":"as","type":"prefix","gloss":"곁에 (ad)"},{"text":"sid","type":"root","gloss":"앉다 (sed)"},{"text":"uous","type":"suffix","gloss":"~한"}],"story":"곁에 붙어 앉아 있는 → 꾸준히 매달리는 → 부지런하고 꼼꼼한"},"example":{"q":"How do you make sure nothing is missed in a big migration?","a":"I'm assiduous about documentation: during our last migration, I kept a detailed runbook, and we finished with zero data loss.","a_ko":"문서화에 아주 꼼꼼합니다. 지난 마이그레이션 때 상세한 런북을 관리했고, 데이터 손실 없이 마쳤습니다."},"collocations":["assiduous about","assiduous attention to detail"],"related":["session","assess","subsidiary","supersede"],"tip":"diligent보다 격식 있는 말. 과장으로 들릴 수 있으니 답변 하나에 한 번만"},{"id":"d03-D21","day":3,"level":1,"set":"D","family":"F3","word":"fix","pos":"verb","ipa":"/fɪks/","meaning_ko":"고치다, 수정하다","category":"it","etymology":{"parts":[{"text":"fix","type":"root","gloss":"고정하다 (figere)"}],"story":"단단히 박다(figere, fixus) → 고정하다 → 바로잡다 → 고치다"},"example":{"q":"Tell me about a bug you fixed recently.","a":"I fixed a memory leak that crashed our server every few days.","a_ko":"며칠마다 서버를 죽이던 메모리 누수를 고쳤습니다."},"collocations":["fix a bug","quick fix","fix the root cause"],"related":["hotfix","suffix","fixed","fixture"],"tip":"원래 '고정하다'. fixed price, fixed schedule(고정된 ~)로도 씀"},{"id":"d03-D22","day":3,"level":2,"set":"D","family":"F3","word":"hotfix","pos":"noun","ipa":"/ˈhɑːtfɪks/","meaning_ko":"긴급 수정(패치)","category":"it","etymology":{"parts":[{"text":"hot","type":"part","gloss":"급한"},{"text":"fix","type":"root","gloss":"고정하다 → 고치다 (figere)"}],"story":"급한(hot) + 수정(fix) → 운영 중 긴급 패치"},"example":{"q":"How do you deal with a critical bug in production?","a":"We ship a hotfix from a separate branch, then merge it back so the fix is not lost in the next release.","a_ko":"별도 브랜치에서 긴급 수정을 배포하고, 다음 릴리스에서 빠지지 않도록 다시 병합합니다."},"collocations":["ship a hotfix","hotfix branch","apply a hotfix"],"related":["fix","suffix","fixed","prefix"],"tip":"정식 릴리스 주기를 기다리지 않는 긴급 패치. hot은 게르만어"},{"id":"d03-D23","day":3,"level":2,"set":"D","family":"F3","word":"suffix","pos":"noun","ipa":"/ˈsʌfɪks/","meaning_ko":"접미사, 뒤에 붙는 문자열","category":"it","etymology":{"parts":[{"text":"suf","type":"prefix","gloss":"아래·뒤에 (sub)"},{"text":"fix","type":"root","gloss":"붙이다 (figere)"}],"story":"아래(뒤)에 붙이다 → 끝에 붙는 것 → 접미사"},"example":{"q":"How do you keep cloud resource names organized?","a":"We add an environment suffix such as dev or prod to every resource name, so nobody deletes the wrong one.","a_ko":"모든 리소스 이름 뒤에 dev나 prod 같은 환경 접미사를 붙여서, 누구도 엉뚱한 것을 지우지 않게 합니다."},"collocations":["add a suffix","file suffix","naming suffix"],"related":["fix","hotfix","fixture","prefix"],"tip":"앞에 붙는 것은 prefix, 뒤에 붙는 것은 suffix"},{"id":"d03-D24","day":3,"level":1,"set":"D","family":"F3","word":"standup","pos":"noun","ipa":"/ˈstændʌp/","meaning_ko":"스탠드업 (짧은 일일 회의)","category":"it","etymology":{"parts":[{"text":"stand","type":"part","gloss":"서다"},{"text":"up","type":"part","gloss":"위로"}],"story":"일어서서(stand up) 하는 회의 → 짧게 서서 진행하는 일일 회의"},"example":{"q":"What does a typical day look like for you?","a":"My day starts with a fifteen-minute standup where we share blockers.","a_ko":"제 하루는 막힌 점을 공유하는 15분짜리 스탠드업으로 시작합니다."},"collocations":["daily standup","standup meeting","in the standup"],"related":["teammate","workflow","stakeholder"],"tip":"stand는 게르만어지만 라틴어 stare(서다)와 같은 인도유럽어 뿌리"},{"id":"d03-D25","day":3,"level":2,"set":"D","family":"F3","word":"stakeholder","pos":"noun","ipa":"/ˈsteɪkˌhoʊldɚ/","meaning_ko":"이해관계자","category":"interview","etymology":{"parts":[{"text":"stake","type":"part","gloss":"내기에 건 몫"},{"text":"hold","type":"part","gloss":"쥐다"},{"text":"er","type":"part","gloss":"사람"}],"story":"내기에 건 돈(stake)을 맡아 쥔 사람 → 일에 이해가 걸린 사람 → 이해관계자"},"example":{"q":"How do you communicate with non-technical stakeholders?","a":"I avoid jargon and explain trade-offs in terms of time, cost, and user impact, so stakeholders can decide quickly.","a_ko":"전문 용어를 피하고 시간, 비용, 사용자 영향으로 트레이드오프를 설명해서 이해관계자가 빨리 결정할 수 있게 합니다."},"collocations":["key stakeholders","stakeholder management","align with stakeholders"],"related":["teammate","coworker","standup"],"tip":"원래 '내기 돈을 맡아 두는 사람'. 지금은 프로젝트에 이해가 걸린 모든 사람"},{"id":"d04-A01","day":4,"level":1,"set":"A","family":"F4","word":"support","pos":"verb","ipa":"/səˈpɔːrt/","meaning_ko":"지원하다, 뒷받침하다","category":"interview","etymology":{"parts":[{"text":"sup","type":"prefix","gloss":"아래에서 (sub)"},{"text":"port","type":"root","gloss":"나르다"}],"story":"아래에서 받쳐 나르다 → 떠받치다 → 지원하다"},"example":{"q":"How do you work with junior engineers?","a":"I support junior engineers through regular code reviews and pair programming.","a_ko":"정기적인 코드 리뷰와 페어 프로그래밍으로 주니어 엔지니어들을 지원합니다."},"collocations":["support the team","customer support","support a decision"],"related":["supportive","report","import","transport","rapport"],"tip":"명사로도 씀: technical support(기술 지원). help보다 '꾸준히 뒷받침한다'는 느낌"},{"id":"d04-A02","day":4,"level":1,"set":"A","family":"F4","word":"supportive","pos":"adjective","ipa":"/səˈpɔːrtɪv/","meaning_ko":"힘이 되어 주는, 협조적인","category":"interview","etymology":{"parts":[{"text":"sup","type":"prefix","gloss":"아래에서 (sub)"},{"text":"port","type":"root","gloss":"나르다"},{"text":"ive","type":"suffix","gloss":"~하는"}],"story":"떠받쳐 주는 → 곁에서 힘이 되어 주는"},"example":{"q":"What kind of team culture do you work best in?","a":"I do my best work in a supportive team where people share knowledge openly.","a_ko":"서로 지식을 열린 마음으로 나누는, 힘이 되어 주는 팀에서 가장 좋은 성과를 냅니다."},"collocations":["supportive environment","supportive manager","be supportive of"],"related":["support","report","portable"],"tip":"선호하는 팀 문화를 말할 때. be supportive of + 사람/아이디어"},{"id":"d04-A03","day":4,"level":1,"set":"A","family":"F4","word":"report","pos":"verb","ipa":"/rɪˈpɔːrt/","meaning_ko":"보고하다, (report to) ~의 지휘를 받다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤로, 도로"},{"text":"port","type":"root","gloss":"나르다"}],"story":"도로 날라 오다 → 소식을 가져와 전하다 → 보고하다"},"example":{"q":"Who did you report to in your last role?","a":"I reported directly to the engineering manager and gave weekly status updates.","a_ko":"엔지니어링 매니저에게 직접 보고했고, 매주 진행 상황을 공유했습니다."},"collocations":["report to","report a bug","weekly report"],"related":["reporting","support","export","rapport"],"tip":"report to + 사람 = 그 사람이 내 직속 상사. 조직 구조를 설명할 때 필수"},{"id":"d04-A04","day":4,"level":1,"set":"A","family":"F4","word":"reporting","pos":"noun","ipa":"/rɪˈpɔːrtɪŋ/","meaning_ko":"리포팅(데이터 보고서 기능), 보고","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤로, 도로"},{"text":"port","type":"root","gloss":"나르다"},{"text":"ing","type":"suffix","gloss":"~하기"}],"story":"도로 날라 와 전하기 → 데이터를 모아 보고서로 보여 주기"},"example":{"q":"What kind of internal tools have you built?","a":"I built a reporting dashboard that shows daily sales data to the business team.","a_ko":"사업 부서에 일일 매출 데이터를 보여 주는 리포팅 대시보드를 만들었습니다."},"collocations":["reporting tool","reporting dashboard","reporting line"],"related":["report","import","export"],"tip":"IT에서는 BI·대시보드 기능을 가리키는 일이 많음. reporting line은 '보고 체계'"},{"id":"d04-A05","day":4,"level":1,"set":"A","family":"F4","word":"import","pos":"verb","ipa":"/ɪmˈpɔːrt/","meaning_ko":"가져오다, 불러오다(임포트)","category":"it","etymology":{"parts":[{"text":"im","type":"prefix","gloss":"안으로 (in)"},{"text":"port","type":"root","gloss":"나르다"}],"story":"안으로 날라 들이다 → 수입하다 → 데이터·모듈을 불러오다"},"example":{"q":"How did you migrate the old customer data?","a":"I wrote a script to import the old data into the new database.","a_ko":"기존 데이터를 새 데이터베이스로 가져오는 스크립트를 작성했습니다."},"collocations":["import data","import a module","import from CSV"],"related":["export","important","transport","portable"],"tip":"동사는 im-PORT, 명사는 IM-port로 강세가 바뀜"},{"id":"d04-A06","day":4,"level":1,"set":"A","family":"F4","word":"export","pos":"verb","ipa":"/ɪkˈspɔːrt/","meaning_ko":"내보내다(익스포트)","category":"it","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"port","type":"root","gloss":"나르다"}],"story":"밖으로 날라 내다 → 수출하다 → 데이터를 파일로 내보내다"},"example":{"q":"What feature did users request most?","a":"Users wanted to export their reports as CSV, so I added that feature first.","a_ko":"사용자들이 리포트를 CSV로 내보내고 싶어 해서 그 기능부터 추가했습니다."},"collocations":["export data","export to CSV","export a function"],"related":["import","report","transport"],"tip":"import의 반대말. 강세 규칙도 같음(동사 ex-PORT, 명사 EX-port)"},{"id":"d04-A07","day":4,"level":1,"set":"A","family":"F4","word":"important","pos":"adjective","ipa":"/ɪmˈpɔːrtnt/","meaning_ko":"중요한","category":"interview","etymology":{"parts":[{"text":"im","type":"prefix","gloss":"안으로 (in)"},{"text":"port","type":"root","gloss":"나르다"},{"text":"ant","type":"suffix","gloss":"~한"}],"story":"중세 라틴어 importare '안으로 가져오다 → 영향을 미치다' → 무게가 있는 → 중요한"},"example":{"q":"What is important to you in your next job?","a":"It is important to me to work on products that real users depend on.","a_ko":"실제 사용자들이 의지하는 제품을 만드는 것이 저에게는 중요합니다."},"collocations":["it is important to","important to me","an important role"],"related":["importance","import","support"],"tip":"What's important to me is ~ 로 답을 시작하면 자연스러움"},{"id":"d04-A08","day":4,"level":1,"set":"A","family":"F4","word":"importance","pos":"noun","ipa":"/ɪmˈpɔːrtns/","meaning_ko":"중요성","category":"interview","etymology":{"parts":[{"text":"im","type":"prefix","gloss":"안으로 (in)"},{"text":"port","type":"root","gloss":"나르다"},{"text":"ance","type":"suffix","gloss":"~함"}],"story":"안으로 가져올 만한 무게 → 중요성"},"example":{"q":"What did you learn from your first project?","a":"I learned the importance of writing clear documentation for the next developer.","a_ko":"다음 개발자를 위해 명확한 문서를 쓰는 것이 얼마나 중요한지 배웠습니다."},"collocations":["the importance of","stress the importance","of great importance"],"related":["important","import","report"],"tip":"I learned the importance of ~ 는 '배운 점' 질문의 단골 패턴"},{"id":"d04-A09","day":4,"level":1,"set":"A","family":"F4","word":"transport","pos":"noun","ipa":"/ˈtrænspɔːrt/","meaning_ko":"전송, 수송","category":"it","etymology":{"parts":[{"text":"trans","type":"prefix","gloss":"건너서"},{"text":"port","type":"root","gloss":"나르다"}],"story":"건너편으로 날라 가다 → 운송 → (네트워크) 데이터 전송"},"example":{"q":"Why did you choose that protocol?","a":"We needed a fast transport between services, so we chose gRPC over HTTP/2.","a_ko":"서비스 간에 빠른 전송 방식이 필요해서 HTTP/2 기반의 gRPC를 선택했습니다."},"collocations":["transport layer","transport protocol","public transport"],"related":["import","export","portable","support"],"tip":"네트워크의 transport layer(전송 계층, TCP/UDP)로 자주 나옴. 명사 TRANS-port / 동사 trans-PORT"},{"id":"d04-A10","day":4,"level":1,"set":"A","family":"F4","word":"portable","pos":"adjective","ipa":"/ˈpɔːrtəbl/","meaning_ko":"이식성 있는, 휴대용의","category":"it","etymology":{"parts":[{"text":"port","type":"root","gloss":"나르다"},{"text":"able","type":"suffix","gloss":"~할 수 있는"}],"story":"나를 수 있는 → 들고 다닐 수 있는 → 다른 환경으로 옮겨도 돌아가는"},"example":{"q":"Why did you use Docker?","a":"Docker made our app portable, so it ran the same on every machine.","a_ko":"Docker 덕분에 앱이 이식성을 갖춰서 어느 머신에서나 똑같이 실행됐습니다."},"collocations":["portable code","highly portable","portable device"],"related":["portability","port","transport"],"tip":"IT에서는 '휴대용'보다 '다른 OS·환경에서도 그대로 돌아가는'의 뜻"},{"id":"d04-A11","day":4,"level":2,"set":"A","family":"F4","word":"portability","pos":"noun","ipa":"/ˌpɔːrtəˈbɪləti/","meaning_ko":"이식성","category":"it","etymology":{"parts":[{"text":"port","type":"root","gloss":"나르다"},{"text":"abil","type":"suffix","gloss":"~할 수 있는 (able)"},{"text":"ity","type":"suffix","gloss":"~성"}],"story":"나를 수 있는 성질 → 다른 플랫폼으로 옮길 수 있는 정도"},"example":{"q":"How do you avoid vendor lock-in?","a":"I keep cloud-specific code behind interfaces to improve portability, so we can switch providers without rewriting everything.","a_ko":"클라우드 전용 코드는 인터페이스 뒤에 두어 이식성을 높입니다. 그래서 전부 다시 쓰지 않고도 클라우드 업체를 바꿀 수 있습니다."},"collocations":["code portability","improve portability","data portability"],"related":["portable","port","support"],"tip":"vendor lock-in(특정 업체 종속)과 함께 자주 나오는 단어"},{"id":"d04-A12","day":4,"level":2,"set":"A","family":"F4","word":"port","pos":"verb","ipa":"/pɔːrt/","meaning_ko":"(다른 플랫폼으로) 이식하다, 포팅하다","category":"it","etymology":{"parts":[{"text":"port","type":"root","gloss":"나르다"}],"story":"프랑스어 porter '나르다'(라틴어 portare) → 코드를 다른 환경으로 옮겨 오다 → 포팅하다"},"example":{"q":"Have you worked with legacy code?","a":"Yes, I ported a legacy Python 2 service to Python 3 and added tests along the way.","a_ko":"네, 레거시 Python 2 서비스를 Python 3로 포팅하면서 테스트도 함께 추가했습니다."},"collocations":["port to","port an app","a port of"],"related":["portable","portability","transport"],"tip":"네트워크 '포트'(port 80)는 '문'을 뜻하는 다른 라틴어 porta 쪽 말이라 뜻이 다름"},{"id":"d04-A13","day":4,"level":1,"set":"A","family":"F4","word":"sport","pos":"noun","ipa":"/spɔːrt/","meaning_ko":"운동, 스포츠","category":"interview","etymology":{"parts":[{"text":"s","type":"prefix","gloss":"떨어져 (dis가 줄어든 것)"},{"text":"port","type":"root","gloss":"나르다"}],"story":"disport '(일에서) 떨어져 나가다 → 기분 전환하다' → 앞이 줄어 sport → 운동 경기"},"example":{"q":"What do you do outside of work?","a":"I play team sports like basketball, which helps me recharge after a long week.","a_ko":"농구 같은 단체 운동
