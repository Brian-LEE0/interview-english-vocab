 a real problem for users.","a_ko":"제가 만든 기능이 사용자의 실제 문제를 해결할 때 가장 큰 보람을 느낍니다."},"collocations":["job satisfaction","customer satisfaction","a sense of satisfaction"],"related":["satisfy","fact","effect"],"tip":"'job satisfaction'(직무 만족)은 이직 사유를 이야기할 때도 유용"},{"id":"d06-B05","day":6,"level":1,"set":"B","family":"F6","word":"verify","pos":"verb","ipa":"/ˈverɪfaɪ/","meaning_ko":"확인하다, 검증하다","category":"interview","etymology":{"parts":[{"text":"veri","type":"root","gloss":"참된 (verus)"},{"text":"fy","type":"root","gloss":"~하게 만들다 (fac → -fy)"}],"story":"참되다고(verus) 만들다 → 사실인지 확인하다 → 검증하다"},"example":{"q":"How do you make decisions?","a":"I always verify my assumptions with data before I decide.","a_ko":"결정하기 전에 늘 데이터로 제 가정을 확인합니다."},"collocations":["verify the results","verify that","verify identity"],"related":["clarify","modify","verification"],"tip":"check보다 '근거로 확인한다'는 뜻이 강함 — 검증 습관을 강조할 때"},{"id":"d06-B06","day":6,"level":1,"set":"B","family":"F6","word":"modify","pos":"verb","ipa":"/ˈmɑːdɪfaɪ/","meaning_ko":"수정하다, 변경하다","category":"it","etymology":{"parts":[{"text":"modi","type":"root","gloss":"척도·방식 (modus)"},{"text":"fy","type":"root","gloss":"~하게 만들다 (fac → -fy)"}],"story":"척도(modus)에 맞게 만들다 → 알맞게 바꾸다 → 수정하다"},"example":{"q":"Have you worked with legacy code?","a":"I modified a ten-year-old billing module without breaking any existing tests.","a_ko":"10년 된 결제 모듈을 기존 테스트를 하나도 깨뜨리지 않고 수정했습니다."},"collocations":["modify the code","slightly modified","modify settings"],"related":["model","verify","unify"],"tip":"change보다 '일부를 고친다'는 느낌 — HTTP의 'Last-Modified' 헤더도 같은 단어"},{"id":"d06-B07","day":6,"level":1,"set":"B","family":"F6","word":"defeat","pos":"noun","ipa":"/dɪˈfiːt/","meaning_ko":"패배, 실패","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"반대로 (dis)"},{"text":"feat","type":"root","gloss":"하다 (fac)"}],"story":"중세 라틴어 disfacere '해 놓은 것을 무너뜨리다' → 고대 프랑스어 desfait → 쳐부숨 → 패배"},"example":{"q":"How do you deal with failure?","a":"I don't see a failed project as a defeat; I see it as a lesson.","a_ko":"실패한 프로젝트를 패배로 보지 않고, 배움으로 봅니다."},"collocations":["admit defeat","accept defeat","self-defeating"],"related":["feature","fact","effect"],"tip":"동사(이기다)로도 쓰지만 면접에선 'not a defeat but a lesson'처럼 명사로"},{"id":"d06-B08","day":6,"level":2,"set":"B","family":"F6","word":"clarify","pos":"verb","ipa":"/ˈklærəfaɪ/","meaning_ko":"명확히 하다","category":"interview","etymology":{"parts":[{"text":"clari","type":"root","gloss":"맑은·분명한 (clarus)"},{"text":"fy","type":"root","gloss":"~하게 만들다 (fac → -fy)"}],"story":"맑게(clarus) 만들다 → 흐린 것을 분명하게 → 명확히 하다"},"example":{"q":"What do you do when requirements are unclear?","a":"I ask questions to clarify the goal early, because building the wrong thing is the most expensive mistake.","a_ko":"초기에 질문해서 목표를 명확히 합니다. 엉뚱한 걸 만드는 게 가장 비싼 실수이기 때문입니다."},"collocations":["clarify requirements","let me clarify","clarify expectations"],"related":["verify","notify","clear"],"tip":"면접 중 질문이 모호할 때: 'Could I clarify what you mean by …?'"},{"id":"d06-B09","day":6,"level":1,"set":"B","family":"F6","word":"factory","pos":"noun","ipa":"/ˈfæktəri/","meaning_ko":"공장; (프로그래밍) 팩토리 패턴","category":"it","etymology":{"parts":[{"text":"fact","type":"root","gloss":"만들다 (fac)"},{"text":"ory","type":"suffix","gloss":"~하는 곳"}],"story":"만드는 곳 → 공장 → 객체를 만들어 주는 코드(팩토리 패턴)"},"example":{"q":"Which design patterns have you used?","a":"I used the factory pattern to create different payment objects.","a_ko":"다양한 결제 객체를 만들 때 팩토리 패턴을 썼습니다."},"collocations":["factory pattern","factory method"],"related":["manufacture","fact","effect"],"tip":"디자인 패턴 질문에서 singleton, observer 와 함께 자주 나옴"},{"id":"d06-B10","day":6,"level":2,"set":"B","family":"F6","word":"classify","pos":"verb","ipa":"/ˈklæsɪfaɪ/","meaning_ko":"분류하다","category":"it","etymology":{"parts":[{"text":"class","type":"root","gloss":"부류 (classis)"},{"text":"ify","type":"root","gloss":"~하게 만들다 (fac → -fy)"}],"story":"부류(classis)로 만들다 → 종류별로 나누다 → 분류하다"},"example":{"q":"Tell me about a machine learning project.","a":"I trained a model to classify support tickets by urgency, which cut our response time in half.","a_ko":"고객 문의 티켓을 긴급도별로 분류하는 모델을 학습시켜 응답 시간을 절반으로 줄였습니다."},"collocations":["classify data","be classified as","classification model"],"related":["class","modify","unify"],"tip":"형용사 classified는 '기밀의'라는 뜻도 — classified information"},{"id":"d06-B11","day":6,"level":2,"set":"B","family":"F6","word":"unify","pos":"verb","ipa":"/ˈjuːnɪfaɪ/","meaning_ko":"통합하다, 하나로 묶다","category":"interview","etymology":{"parts":[{"text":"uni","type":"prefix","gloss":"하나 (unus)"},{"text":"fy","type":"root","gloss":"~하게 만들다 (fac → -fy)"}],"story":"하나로(unus) 만들다 → 통합하다"},"example":{"q":"How did you handle conflicting opinions on your team?","a":"I helped unify the team around one shared metric, so we stopped arguing about personal preferences.","a_ko":"팀이 공통 지표 하나를 바라보도록 묶었더니 개인 취향을 두고 다투는 일이 사라졌습니다."},"collocations":["unify the team","unified platform","unify standards"],"related":["uniform","union","modify"],"tip":"형용사 unified(통합된)는 IT 제품 설명에도 자주 — 'unified logging'"},{"id":"d06-B12","day":6,"level":3,"set":"B","family":"F6","word":"codify","pos":"verb","ipa":"/ˈkɑːdɪfaɪ/","meaning_ko":"체계화하다, 규칙으로 정리하다","category":"it","etymology":{"parts":[{"text":"cod","type":"root","gloss":"법전·규칙 (code ← 라틴어 codex)"},{"text":"ify","type":"root","gloss":"~하게 만들다 (fac → -fy)"}],"story":"법전(code)으로 만들다 → 흩어진 관행을 규칙·문서로 정리하다 → 체계화하다"},"example":{"q":"How do you share knowledge on your team?","a":"After the same mistakes kept happening, I codified our code review rules into a short checklist and a linter config.","a_ko":"같은 실수가 반복되길래 코드 리뷰 규칙을 짧은 체크리스트와 린터 설정으로 체계화했습니다."},"collocations":["codify best practices","codify rules","codified in policy"],"related":["code","clarify","modify"],"tip":"암묵지를 문서·자동화로 바꿨다는 시니어다운 표현 — 'codify best practices'"},{"id":"d06-B13","day":6,"level":1,"set":"B","family":"F6","word":"form","pos":"verb","ipa":"/fɔːrm/","meaning_ko":"만들다, 결성하다","category":"interview","etymology":{"parts":[{"text":"form","type":"root","gloss":"모양 (forma)"}],"story":"라틴어 forma '모양' → 모양을 만들다 → (팀·습관을) 만들다"},"example":{"q":"What did you do after joining your last company?","a":"I formed a small study group to learn Kubernetes together.","a_ko":"쿠버네티스를 함께 공부하는 작은 스터디 모임을 만들었습니다."},"collocations":["form a team","form a habit","form an opinion"],"related":["formal","inform","platform","format"],"tip":"명사 form(양식)도 있지만, 면접에선 동사 'form a team/habit'이 유용"},{"id":"d06-B14","day":6,"level":1,"set":"B","family":"F6","word":"formal","pos":"adjective","ipa":"/ˈfɔːrml/","meaning_ko":"공식적인, 격식을 갖춘","category":"interview","etymology":{"parts":[{"text":"form","type":"root","gloss":"모양 (forma)"},{"text":"al","type":"suffix","gloss":"~의"}],"story":"정해진 모양(form)을 갖춘 → 형식을 갖춘 → 공식적인"},"example":{"q":"Do you have any management experience?","a":"I don't have a formal title, but I mentor two junior developers.","a_ko":"공식 직함은 없지만 주니어 개발자 두 명의 멘토를 맡고 있습니다."},"collocations":["formal training","formal education","formal review"],"related":["informal","form","formulate"],"tip":"'formal title은 없지만'은 리더십 경험을 겸손하게 말하는 단골 표현"},{"id":"d06-B15","day":6,"level":1,"set":"B","family":"F6","word":"informal","pos":"adjective","ipa":"/ɪnˈfɔːrml/","meaning_ko":"비공식적인, 격식 없는","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"아닌"},{"text":"form","type":"root","gloss":"모양 (forma)"},{"text":"al","type":"suffix","gloss":"~의"}],"story":"정해진 형식(formal)이 아닌 → 격식 없는, 비공식적인"},"example":{"q":"How do you build relationships with coworkers?","a":"I set up informal coffee chats with people from other teams.","a_ko":"다른 팀 사람들과 가볍게 커피 마시는 자리를 만들어 관계를 쌓습니다."},"collocations":["informal chat","informal leader","informal feedback"],"related":["formal","inform","form"],"tip":"inform(알리다)의 형용사가 아니라 formal의 반대말 — 여기서 in-은 '아닌'"},{"id":"d06-B16","day":6,"level":1,"set":"B","family":"F6","word":"inform","pos":"verb","ipa":"/ɪnˈfɔːrm/","meaning_ko":"알리다","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안에"},{"text":"form","type":"root","gloss":"모양 (forma)"}],"story":"라틴어 informare '모양을 잡아 주다' → 생각에 모양을 잡아 주다 → 알려 주다"},"example":{"q":"What would you do if you were going to miss a deadline?","a":"I would inform my manager right away and suggest a new plan.","a_ko":"바로 매니저에게 알리고 새 계획을 제안하겠습니다."},"collocations":["inform someone of","keep someone informed","informed decision"],"related":["information","form","formal"],"tip":"'keep my team informed'(팀에 계속 공유하다)는 소통 질문의 단골 표현"},{"id":"d06-B17","day":6,"level":1,"set":"B","family":"F6","word":"information","pos":"noun","ipa":"/ˌɪnfərˈmeɪʃn/","meaning_ko":"정보","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안에"},{"text":"form","type":"root","gloss":"모양 (forma)"},{"text":"ation","type":"suffix","gloss":"~함"}],"story":"생각에 모양을 잡아 주는 것 → 알려 주는 내용 → 정보"},"example":{"q":"How do you get up to speed in a new team?","a":"I gather information by reading the docs and asking lots of questions.","a_ko":"문서를 읽고 질문을 많이 하면서 정보를 모읍니다."},"collocations":["gather information","share information","information security"],"related":["inform","form","format"],"tip":"셀 수 없는 명사 — 'an information'(X), 'a piece of information'(O)"},{"id":"d06-B18","day":6,"level":1,"set":"B","family":"F6","word":"platform","pos":"noun","ipa":"/ˈplætfɔːrm/","meaning_ko":"플랫폼, 기반","category":"it","etymology":{"parts":[{"text":"plat","type":"root","gloss":"평평한 (프랑스어 plat)"},{"text":"form","type":"root","gloss":"모양 (forma)"}],"story":"프랑스어 plateforme '평평한 모양' → 평평한 단 → 그 위에 서비스를 올리는 기반"},"example":{"q":"What does your current team do?","a":"My team runs the internal platform that other teams use to ship their services.","a_ko":"저희 팀은 다른 팀들이 서비스를 내보낼 때 쓰는 사내 플랫폼을 운영합니다."},"collocations":["platform team","cloud platform","cross-platform"],"related":["form","uniform","format"],"tip":"'platform engineering'(플랫폼 엔지니어링)은 직무명으로도 쓰임"},{"id":"d06-B19","day":6,"level":2,"set":"B","family":"F6","word":"uniform","pos":"adjective","ipa":"/ˈjuːnɪfɔːrm/","meaning_ko":"균일한, 통일된","category":"it","etymology":{"parts":[{"text":"uni","type":"prefix","gloss":"하나의 (unus)"},{"text":"form","type":"root","gloss":"모양 (forma)"}],"story":"하나의(uni) 모양(form) → 모두 같은 모양 → 균일한"},"example":{"q":"How did you make your APIs easier to use?","a":"I introduced a uniform error response across all our APIs, so clients could handle failures in one place.","a_ko":"모든 API의 에러 응답을 통일된 형태로 맞춰서 클라이언트가 한곳에서 실패를 처리할 수 있게 했습니다."},"collocations":["uniform interface","uniform distribution","uniform naming"],"related":["unify","form","platform"],"tip":"명사 uniform(제복)으로 익숙하지만 IT에선 형용사 '한결같은, 통일된'이 자주 쓰임"},{"id":"d06-B20","day":6,"level":2,"set":"B","family":"F6","word":"conform","pos":"verb","ipa":"/kənˈfɔːrm/","meaning_ko":"(규칙·기준을) 따르다","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께 (com)"},{"text":"form","type":"root","gloss":"모양 (forma)"}],"story":"같은 모양으로(com + forma) 맞추다 → 기준에 맞추다 → 따르다"},"example":{"q":"How do you work with a team's existing practices?","a":"When I join a team, I conform to their style guide first and suggest changes only after I understand the reasons.","a_ko":"새 팀에 가면 먼저 그 팀의 스타일 가이드를 따르고, 이유를 이해한 뒤에야 변경을 제안합니다."},"collocations":["conform to standards","conform to the spec","conform with"],"related":["form","uniform","formal"],"tip":"conform to + 기준 — follow보다 '틀에 맞춘다'는 느낌"},{"id":"d06-B21","day":6,"level":2,"set":"B","family":"F6","word":"malformed","pos":"adjective","ipa":"/ˌmælˈfɔːrmd/","meaning_ko":"형식이 잘못된","category":"it","etymology":{"parts":[{"text":"mal","type":"prefix","gloss":"나쁘게"},{"text":"form","type":"root","gloss":"모양 (forma)"},{"text":"ed","type":"suffix","gloss":"~된"}],"story":"나쁘게(mal) 모양 잡힌(form) → 형식이 깨진 → 잘못된 형식의"},"example":{"q":"Tell me about a tricky bug you fixed.","a":"A single malformed JSON payload from a partner was crashing our parser, so I added strict input validation.","a_ko":"파트너사가 보낸 잘못된 형식의 JSON 하나가 파서를 죽이고 있어서 엄격한 입력 검증을 추가했습니다."},"collocations":["malformed request","malformed input","malformed data"],"related":["form","uniform","malfunction"],"tip":"에러 메시지 '400 Bad Request: malformed …'에 자주 등장"},{"id":"d06-B22","day":6,"level":2,"set":"B","family":"F6","word":"formulate","pos":"verb","ipa":"/ˈfɔːrmjəleɪt/","meaning_ko":"(계획·생각을) 세우다, 정리하다","category":"interview","etymology":{"parts":[{"text":"form","type":"root","gloss":"모양 (forma)"},{"text":"ul","type":"suffix","gloss":"작은 (지소사)"},{"text":"ate","type":"suffix","gloss":"~하게 하다"}],"story":"formula(작은 틀, 공식) → 틀에 맞춰 만들다 → 생각·계획을 체계적으로 세우다"},"example":{"q":"How do you approach a problem you've never seen before?","a":"I break it into smaller questions and formulate a few hypotheses before I start writing code.","a_ko":"작은 질문들로 쪼갠 다음, 코드를 쓰기 전에 몇 가지 가설을 세웁니다."},"collocations":["formulate a plan","formulate a strategy","formulate a hypothesis"],"related":["formula","form","formal"],"tip":"make a plan보다 격식 있게 — 'formulate a strategy'"},{"id":"d06-B23","day":6,"level":3,"set":"B","family":"F6","word":"formative","pos":"adjective","ipa":"/ˈfɔːrmətɪv/","meaning_ko":"(사람·생각을) 형성한, 성장에 큰 영향을 준","category":"interview","etymology":{"parts":[{"text":"form","type":"root","gloss":"모양 (forma)"},{"text":"ative","type":"suffix","gloss":"~하는"}],"story":"모양을 만들어 가는 → 사람의 성격·관점을 빚어낸 → 성장에 큰 영향을 준"},"example":{"q":"Tell me about an experience that shaped you as an engineer.","a":"My first on-call rotation was a formative experience; handling outages taught me to stay calm and communicate clearly under pressure.","a_ko":"첫 당직 근무가 저를 만든 경험이었습니다. 장애를 처리하면서 압박 속에서도 침착하게, 분명하게 소통하는 법을 배웠습니다."},"collocations":["formative experience","formative years","formative period"],"related":["form","formulate","transform"],"tip":"'저를 만든 경험'을 한 단어로 — 성장 스토리를 시작할 때 쓰면 좋음"},{"id":"d06-B24","day":6,"level":1,"set":"B","family":"F6","word":"backend","pos":"noun","ipa":"/ˈbækend/","meaning_ko":"백엔드","category":"it","etymology":{"parts":[{"text":"back","type":"part","gloss":"뒤"},{"text":"end","type":"part","gloss":"끝, 쪽"}],"story":"뒤(back) 쪽(end) → 사용자 눈에 안 보이는 뒤편 → 서버·데이터 처리 부분"},"example":{"q":"Which area do you specialize in?","a":"I mainly work on the backend, building APIs and data pipelines.","a_ko":"주로 백엔드에서 API와 데이터 파이프라인을 만듭니다."},"collocations":["backend developer","backend service","backend system"],"related":["frontend","codebase","infrastructure"],"tip":"back end / back-end / backend 다 쓰임 — 명사 앞에선 back-end도 많음"},{"id":"d06-B25","day":6,"level":1,"set":"B","family":"F6","word":"frontend","pos":"noun","ipa":"/ˈfrʌntend/","meaning_ko":"프런트엔드","category":"it","etymology":{"parts":[{"text":"front","type":"part","gloss":"앞"},{"text":"end","type":"part","gloss":"끝, 쪽"}],"story":"앞(front) 쪽(end) → 사용자가 직접 보는 앞면 → 화면·UI 부분"},"example":{"q":"Have you done any full-stack work?","a":"Yes, I've also built frontend pages with React for our admin tools.","a_ko":"네, 사내 관리 도구용으로 React 프런트엔드 화면도 만들어 봤습니다."},"collocations":["frontend developer","frontend framework","frontend code"],"related":["backend","design","platform"],"tip":"합성어로 통째 외우기 — frontend ↔ backend 짝으로"},{"id":"d06-C01","day":6,"level":1,"set":"C","family":"F6","word":"plenty","pos":"noun","ipa":"/ˈplenti/","meaning_ko":"많음, 충분함","category":"interview","etymology":{"parts":[{"text":"plen","type":"root","gloss":"가득 찬 (plenus)"},{"text":"ty","type":"suffix","gloss":"~함"}],"story":"라틴어 plenus '가득 찬' → 가득함 → 넉넉함, 많음"},"example":{"q":"Do you have experience with cloud services?","a":"Yes, I have plenty of hands-on experience with AWS.","a_ko":"네, AWS를 직접 다뤄 본 경험이 많습니다."},"collocations":["plenty of","plenty of time","plenty of room"],"related":["replenish","supply","complete","implement"],"tip":"plenty of + 명사 — a lot of보다 '넉넉히 있다'는 여유가 느껴짐"},{"id":"d06-C02","day":6,"level":1,"set":"C","family":"F6","word":"supply","pos":"noun","ipa":"/səˈplaɪ/","meaning_ko":"공급, 공급하다","category":"interview","etymology":{"parts":[{"text":"sup","type":"prefix","gloss":"아래에서 (sub)"},{"text":"ply","type":"root","gloss":"채우다 (ple)"}],"story":"라틴어 supplere '아래에서 채워 넣다' → 모자란 것을 채워 주다 → 공급(하다)"},"example":{"q":"What kind of software have you worked on?","a":"I worked on software that tracks the supply of parts to our factories.","a_ko":"공장으로 부품이 공급되는 흐름을 추적하는 소프트웨어를 만들었습니다."},"collocations":["supply chain","supply and demand","in short supply"],"related":["supplement","plenty","comply"],"tip":"여기 ply는 apply의 ply(접다)가 아니라 ple(채우다) — supplement와 형제 단어"},{"id":"d06-C03","day":6,"level":1,"set":"C","family":"F6","word":"accomplish","pos":"verb","ipa":"/əˈkɑːmplɪʃ/","meaning_ko":"이루다, 해내다","category":"interview","etymology":{"parts":[{"text":"ac","type":"prefix","gloss":"~에 (ad)"},{"text":"com","type":"prefix","gloss":"완전히"},{"text":"pl","type":"root","gloss":"채우다 (ple)"},{"text":"ish","type":"suffix","gloss":"동사 어미"}],"story":"라틴어 complere '완전히 채우다' → 고대 프랑스어 acomplir → 끝까지 해내다 → 이루다"},"example":{"q":"What would you like to accomplish in your first year?","a":"In my first year, I want to accomplish a full migration to the new platform.","a_ko":"첫해에는 새 플랫폼으로의 전체 이전을 완수하고 싶습니다."},"collocations":["accomplish a goal","accomplish a task","what I accomplished"],"related":["accomplishment","complete","implement"],"tip":"achieve와 비슷 — 'What did you accomplish?'(무엇을 이뤘나요?)는 성과 질문의 단골"},{"id":"d06-C04","day":6,"level":2,"set":"C","family":"F6","word":"accomplishment","pos":"noun","ipa":"/əˈkɑːmplɪʃmənt/","meaning_ko":"성취, 업적","category":"interview","etymology":{"parts":[{"text":"ac","type":"prefix","gloss":"~에 (ad)"},{"text":"com","type":"prefix","gloss":"완전히"},{"text":"pl","type":"root","gloss":"채우다 (ple)"},{"text":"ish","type":"suffix","gloss":"동사 어미"},{"text":"ment","type":"suffix","gloss":"~한 것"}],"story":"끝까지 해낸(accomplish) 것 → 성취, 업적"},"example":{"q":"What is your proudest professional accomplishment?","a":"My proudest accomplishment is cutting our deployment time from two hours to ten minutes.","a_ko":"가장 자랑스러운 성과는 배포 시간을 2시간에서 10분으로 줄인 것입니다."},"collocations":["proudest accomplishment","major accomplishment","a sense of accomplishment"],"related":["accomplish","complete","implement"],"tip":"achievement와 거의 같음 — 숫자로 된 결과를 꼭 붙여 말하기"},{"id":"d06-C05","day":6,"level":1,"set":"C","family":"F6","word":"compliment","pos":"noun","ipa":"/ˈkɑːmplɪmənt/","meaning_ko":"칭찬","category":"interview","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"완전히"},{"text":"pli","type":"root","gloss":"채우다 (ple)"},{"text":"ment","type":"suffix","gloss":"~한 것"}],"story":"라틴어 complere '채우다' → 스페인어 cumplir '예의를 다하다' → 예의를 갖춘 말 → 칭찬"},"example":{"q":"How would your colleagues describe you?","a":"The best compliment I got was that I make hard problems feel simple.","a_ko":"제가 들은 최고의 칭찬은 어려운 문제를 쉽게 느껴지게 만든다는 말이었습니다."},"collocations":["pay a compliment","take it as a compliment","a nice compliment"],"related":["complement","comply","accomplish"],"tip":"complement(보완)와 철자 한 글자 차이 — i는 칭찬(I like it), e는 보완"},{"id":"d06-C06","day":6,"level":2,"set":"C","family":"F6","word":"comply","pos":"verb","ipa":"/kəmˈplaɪ/","meaning_ko":"(규정을) 따르다, 준수하다","category":"interview","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"완전히"},{"text":"ply","type":"root","gloss":"채우다 (ple)"}],"story":"라틴어 complere '가득 채우다' → 스페인어·이탈리아어를 거쳐 '해야 할 일을 다하다' → 규정을 따르다"},"example":{"q":"Have you worked in finance or another strict industry?","a":"Yes, at my bank job every release had to comply with strict security rules, so I learned to document everything.","a_ko":"네, 은행에서 일할 때 모든 릴리스가 엄격한 보안 규정을 따라야 해서 모든 걸 문서로 남기는 습관이 생겼습니다."},"collocations":["comply with","comply with regulations","fail to comply"],"related":["compliance","complete","supply"],"tip":"apply·imply의 ply(접다)와 달리 complere(채우다)에서 왔음 — 항상 comply with"},{"id":"d06-C07","day":6,"level":2,"set":"C","family":"F6","word":"compliance","pos":"noun","ipa":"/kəmˈplaɪəns/","meaning_ko":"규정 준수, 컴플라이언스","category":"it","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"완전히"},{"text":"pli","type":"root","gloss":"채우다 (ple)"},{"text":"ance","type":"suffix","gloss":"~함"}],"story":"규정을 다 채움(comply) → 규정 준수"},"example":{"q":"What did you work on at your last job?","a":"I automated our compliance checks, so every new server is scanned for security issues before it goes live.","a_ko":"컴플라이언스 점검을 자동화해서 새 서버가 운영에 들어가기 전에 보안 문제를 스캔하도록 했습니다."},"collocations":["compliance check","regulatory compliance","in compliance with"],"related":["comply","complete","implement"],"tip":"보안·금융 쪽 지원 시 필수 — 'SOC 2 compliance', 'GDPR compliance'처럼 씀"},{"id":"d06-C08","day":6,"level":2,"set":"C","family":"F6","word":"complementary","pos":"adjective","ipa":"/ˌkɑːmplɪˈmentri/","meaning_ko":"상호 보완적인","category":"interview","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"완전히"},{"text":"ple","type":"root","gloss":"채우다 (ple)"},{"text":"ment","type":"suffix","gloss":"~한 것"},{"text":"ary","type":"suffix","gloss":"~의"}],"story":"완전히 채워 주는 것(complement) → 서로 모자란 부분을 채워 주는 → 상호 보완적인"},"example":{"q":"How would you fit into our team?","a":"I think my backend experience is complementary to your team's strong frontend skills.","a_ko":"제 백엔드 경험이 프런트엔드에 강한 팀의 역량을 잘 보완할 수 있다고 생각합니다."},"collocations":["complementary skills","complementary to","complementary roles"],"related":["complete","compliment","implement"],"tip":"complimentary(무료의, 칭찬하는)와 철자 주의 — e가 '보완'"},{"id":"d06-C09","day":6,"level":2,"set":"C","family":"F6","word":"implement","pos":"verb","ipa":"/ˈɪmplɪment/","meaning_ko":"구현하다, 실행하다","category":"it","etymology":{"parts":[{"text":"im","type":"prefix","gloss":"안에 (in)"},{"text":"ple","type":"root","gloss":"채우다 (ple)"},{"text":"ment","type":"suffix","gloss":"~한 것"}],"story":"라틴어 implere '안을 가득 채우다' → implementum '채워 넣음' → 계획을 실제로 채워 실행하다 → 구현하다"},"example":{"q":"Tell me about a feature you're proud of.","a":"I designed and implemented our rate limiter, which protected the API during a traffic spike on launch day.","a_ko":"속도 제한 기능을 설계하고 구현했는데, 출시일 트래픽 급증 때 API를 지켜 주었습니다."},"collocations":["implement a feature","implement a policy","implementation details"],"related":["complete","supplement","accomplish"],"tip":"동사는 /ˈɪmplɪment/, 명사(도구)는 /ˈɪmplɪmənt/ — 마지막 모음이 다름"},{"id":"d06-C10","day":6,"level":3,"set":"C","family":"F6","word":"deplete","pos":"verb","ipa":"/dɪˈpliːt/","meaning_ko":"고갈시키다, 바닥내다","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"떨어져, 덜어 내어"},{"text":"plete","type":"root","gloss":"채우다 (ple)"}],"story":"라틴어 deplere '채운 것을 덜어 내다, 비우다' → 고갈시키다"},"example":{"q":"Describe a difficult outage you handled.","a":"A slow query was holding connections open and depleting the database pool, so I added timeouts and the errors stopped within minutes.","a_ko":"느린 쿼리가 커넥션을 붙잡고 있어서 DB 커넥션 풀이 바닥났습니다. 타임아웃을 추가하자 몇 분 안에 오류가 멈췄습니다."},"collocations":["deplete resources","depleted pool","deplete the error budget"],"related":["complete","replenish","implement"],"tip":"run out of(바닥나다)의 격식 있는 말 — SRE에선 'error budget is depleted'처럼도 씀"},{"id":"d06-C11","day":6,"level":3,"set":"C","family":"F6","word":"replenish","pos":"verb","ipa":"/rɪˈplenɪʃ/","meaning_ko":"다시 채우다, 재충전하다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"plen","type":"root","gloss":"가득 찬 (plenus)"},{"text":"ish","type":"suffix","gloss":"동사 어미"}],"story":"고대 프랑스어 replenir '다시 가득 채우다' → 다시 채우다 → (에너지를) 재충전하다"},"example":{"q":"How do you avoid burnout?","a":"After an intense release cycle, I take a few days off to replenish my energy, and I encourage my teammates to do the same.","a_ko":"강도 높은 릴리스 기간이 끝나면 며칠 쉬면서 에너지를 다시 채우고, 팀원들에게도 그렇게 하라고 권합니다."},"collocations":["replenish energy","replenish stock","replenish supplies"],"related":["plenty","deplete","complete"],"tip":"deplete(바닥내다)의 반대말로 짝지어 외우기"},{"id":"d06-C12","day":6,"level":1,"set":"C","family":"F6","word":"sign","pos":"verb","ipa":"/saɪn/","meaning_ko":"서명하다","category":"interview","etymology":{"parts":[{"text":"sign","type":"root","gloss":"표시 (signum)"}],"story":"라틴어 signum '표시' → 표시를 하다 → 이름을 적어 서명하다"},"example":{"q":"Is there anything that might prevent you from joining us?","a":"I've signed a non-compete agreement, but it ends next month.","a_ko":"경업 금지 계약서에 서명했는데, 다음 달에 끝납니다."},"collocations":["sign a contract","sign up","sign off on"],"related":["signal","signature","design","significant"],"tip":"g는 묵음 /saɪn/ — signal·signature에선 g가 소리 남"},{"id":"d06-C13","day":6,"level":1,"set":"C","family":"F6","word":"signal","pos":"noun","ipa":"/ˈsɪɡnəl/","meaning_ko":"신호","category":"it","etymology":{"parts":[{"text":"sign","type":"root","gloss":"표시 (signum)"},{"text":"al","type":"suffix","gloss":"~의 것"}],"story":"표시(signum)가 되는 것 → 신호"},"example":{"q":"How do you know your service is healthy?","a":"Error rate is the first signal I check on our dashboard.","a_ko":"대시보드에서 가장 먼저 보는 신호는 오류율입니다."},"collocations":["warning signal","strong signal","send a signal"],"related":["sign","signature","significant"],"tip":"모니터링의 '골든 시그널'(latency, traffic, errors, saturation)이 바로 이 단어"},{"id":"d06-C14","day":6,"level":1,"set":"C","family":"F6","word":"signature","pos":"noun","ipa":"/ˈsɪɡnətʃər/","meaning_ko":"서명, (함수) 시그니처","category":"it","etymology":{"parts":[{"text":"sign","type":"root","gloss":"표시 (signum)"},{"text":"ature","type":"suffix","gloss":"~한 것"}],"story":"표시를 한 것 → 이름 표시 → 서명 / 함수를 알아보게 하는 표시 → 함수 시그니처"},"example":{"q":"How do you avoid breaking other teams' code?","a":"I never change a public function signature without a deprecation period.","a_ko":"공개 함수의 시그니처는 폐기 예고 기간 없이 바꾸지 않습니다."},"collocations":["function signature","digital signature","signature feature"],"related":["sign","signal","design"],"tip":"'signature dish'(대표 요리)처럼 '대표적인'이라는 뜻도 있음"},{"id":"d06-C15","day":6,"level":1,"set":"C","family":"F6","word":"significant","pos":"adjective","ipa":"/sɪɡˈnɪfɪkənt/","meaning_ko":"상당한, 중요한","category":"interview","etymology":{"parts":[{"text":"sign","type":"root","gloss":"표시 (signum)"},{"text":"ific","type":"root","gloss":"만들다 (fac)"},{"text":"ant","type":"suffix","gloss":"~하는"}],"story":"라틴어 significare '표시를(signum) 만들다(fac), 뜻을 나타내다' → 의미 있는 → 상당한"},"example":{"q":"What results did your project achieve?","a":"We saw a significant drop in customer complaints after the redesign.","a_ko":"리디자인 후 고객 불만이 크게 줄었습니다."},"collocations":["significant impact","significant improvement","statistically significant"],"related":["sign","signal","efficient"],"tip":"big보다 격식 있음 — 성과를 말할 때 'a significant improvement'"},{"id":"d06-C16","day":6,"level":1,"set":"C","family":"F6","word":"design","pos":"noun","ipa":"/dɪˈzaɪn/","meaning_ko":"설계, 설계하다","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"아래로, 따로"},{"text":"sign","type":"root","gloss":"표시 (signum)"}],"story":"라틴어 designare '표시해 두다' → 미리 표시해 정해 두다 → 계획하다 → 설계(하다)"},"example":{"q":"How do you start a new project?","a":"I start with a simple design and share it with the team.","a_ko":"간단한 설계부터 만들어 팀에 공유하는 것으로 시작합니다."},"collocations":["system design","design review","design document"],"related":["redesign","designate","sign","signature"],"tip":"IT에선 '디자인'보다 '설계' — 'system design interview'(시스템 설계 면접)"},{"id":"d06-C17","day":6,"level":2,"set":"C","family":"F6","word":"redesign","pos":"verb","ipa":"/ˌriːdɪˈzaɪn/","meaning_ko":"다시 설계하다, 개편하다","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"de","type":"prefix","gloss":"아래로, 따로"},{"text":"sign","type":"root","gloss":"표시 (signum)"}],"story":"다시(re) 설계하다(design) → 개편하다"},"example":{"q":"Tell me about a time you improved an existing system.","a":"I redesigned our notification service around a message queue, which made it far more reliable during peak hours.","a_ko":"알림 서비스를 메시지 큐 중심으로 다시 설계해서 피크 시간에도 훨씬 안정적으로 만들었습니다."},"collocations":["redesign the system","major redesign","UI redesign"],"related":["design","designate","sign"],"tip":"refactor(코드 정리)보다 큰 범위 — 구조 자체를 바꿀 때"},{"id":"d06-C18","day":6,"level":2,"set":"C","family":"F6","word":"designate","pos":"verb","ipa":"/ˈdezɪɡneɪt/","meaning_ko":"지정하다","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"아래로, 따로"},{"text":"sign","type":"root","gloss":"표시 (signum)"},{"text":"ate","type":"suffix","gloss":"~하게 하다"}],"story":"라틴어 designare '표시해 두다' → 이름을 붙여 정해 두다 → 지정하다"},"example":{"q":"How do you handle communication during an incident?","a":"We designate one person as the incident commander, so everyone knows who is making decisions.","a_ko":"한 사람을 장애 대응 책임자로 지정해서 누가 결정하는지 모두가 알게 합니다."},"collocations":["designate someone as","designated owner","designated time"],"related":["design","sign","signature"],"tip":"design과 어원이 같지만 뜻은 '지정하다' — 발음 /ˈdez-/ 주의"},{"id":"d06-C19","day":6,"level":2,"set":"C","family":"F6","word":"resign","pos":"verb","ipa":"/rɪˈzaɪn/","meaning_ko":"사직하다, 물러나다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"되돌려"},{"text":"sign","type":"root","gloss":"표시·봉인 (signum)"}],"story":"라틴어 resignare '봉인(표시)을 떼다, 되돌려 주다' → 맡은 것을 내려놓다 → 사직하다"},"example":{"q":"Why did you leave your last job?","a":"I resigned after the project ended because I wanted to focus on cloud engineering, which wasn't possible at my old company.","a_ko":"프로젝트가 끝난 뒤 사직했습니다. 클라우드 엔지니어링에 집중하고 싶었는데 이전 회사에서는 그럴 수 없었습니다."},"collocations":["resign from","resign as","resignation letter"],"related":["sign","design","signature"],"tip":"re-sign(다시 서명하다)과 발음이 다름 — resign은 /rɪˈzaɪn/, s가 z 소리"},{"id":"d06-C20","day":6,"level":1,"set":"C","family":"F6","word":"describe","pos":"verb","ipa":"/dɪˈskraɪb/","meaning_ko":"설명하다, 묘사하다","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"아래로, 따라"},{"text":"scribe","type":"root","gloss":"쓰다 (scrib)"}],"story":"라틴어 describere '따라 써 내려가다, 베끼다' → 말이나 글로 그려 내다 → 설명하다"},"example":{"q":"How would you describe yourself in three words?","a":"I would describe myself as curious, reliable, and calm.","a_ko":"저를 호기심 많고, 믿음직하고, 침착한 사람이라고 표현하겠습니다."},"collocations":["describe yourself","describe in detail","best described as"],"related":["description","script","ascribe","prescriptive"],"tip":"describe about(X) — describe 뒤에 바로 목적어"},{"id":"d06-C21","day":6,"level":1,"set":"C","family":"F6","word":"description","pos":"noun","ipa":"/dɪˈskrɪpʃn/","meaning_ko":"설명, 기술","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"아래로, 따라"},{"text":"script","type":"root","gloss":"쓰다 (scrib)"},{"text":"ion","type":"suffix","gloss":"~함"}],"story":"써 내려간 것 → 설명 / job description = 직무를 적어 놓은 것 → 직무 기술서"},"example":{"q":"Why did you apply for this position?","a":"The job description matches the work I've been doing for three years.","a_ko":"직무 설명이 제가 3년간 해 온 일과 딱 맞았습니다."},"collocations":["job description","detailed description","fit the description"],"related":["describe","script","ascribe"],"tip":"JD = job description — 면접 준비의 출발점"},{"id":"d06-C22","day":6,"level":1,"set":"C","family":"F6","word":"script","pos":"noun","ipa":"/skrɪpt/","meaning_ko":"스크립트","category":"it","etymology":{"parts":[{"text":"script","type":"root","gloss":"쓰다 (scrib)"}],"story":"라틴어 scriptum '써 놓은 것' → 대본 → 실행할 명령을 적어 둔 것"},"example":{"q":"How do you deal with repetitive tasks?","a":"I write a small script whenever I repeat a task more than twice.","a_ko":"같은 일을 세 번 이상 하게 되면 작은 스크립트를 짭니다."},"collocations":["shell script","write a script","deployment script"],"related":["describe","description","manuscript"],"tip":"'면접 대본'도 script — 하지만 답변은 외운 티가 나지 않게"},{"id":"d06-C23","day":6,"level":3,"set":"C","family":"F6","word":"ascribe","pos":"verb","ipa":"/əˈskraɪb/","meaning_ko":"(공·원인을) ~의 덕분으로 돌리다","category":"interview","etymology":{"parts":[{"text":"a","type":"prefix","gloss":"~에 (ad)"},{"text":"scribe","type":"root","gloss":"쓰다 (scrib)"}],"story":"라틴어 ascribere '~에 덧붙여 쓰다' → 이름 옆에 적어 넣다 → (공·원인을) ~에게 돌리다"},"example":{"q":"What made that project successful?","a":"I'd ascribe most of our success to the QA team, who caught critical issues weeks before launch.","a_ko":"성공의 대부분은 출시 몇 주 전에 치명적인 문제를 잡아 준 QA 팀 덕분이라고 생각합니다."},"collocations":["ascribe A to B","ascribe success to","be ascribed to"],"related":["describe","script","subscription"],"tip":"공을 팀에 돌릴 때 쓰는 격식 있는 말 — attribute A to B와 같은 구조"},{"id":"d06-C24","day":6,"level":2,"set":"C","family":"F6","word":"codebase","pos":"noun","ipa":"/ˈkoʊdbeɪs/","meaning_ko":"코드베이스","category":"it","etymology":{"parts":[{"text":"code","type":"part","gloss":"코드"},{"text":"base","type":"part","gloss":"기반"}],"story":"코드(code)의 기반(base) → 한 제품을 이루는 소스 코드 전체"},"example":{"q":"How do you get up to speed on an unfamiliar project?","a":"In a new codebase, I start by reading the tests, because they show how the system is supposed to behave.","a_ko":"새 코드베이스에서는 테스트부터 읽습니다. 시스템이 어떻게 동작해야 하는지 보여 주기 때문입니다."},"collocations":["large codebase","legacy codebase","shared codebase"],"related":["backend","walkthrough","build"],"tip":"code base로 띄어 쓰기도 함 — 'legacy codebase'(오래된 코드베이스)는 면접 단골"},{"id":"d06-C25","day":6,"level":2,"set":"C","family":"F6","word":"backlog","pos":"noun","ipa":"/ˈbæklɔːɡ/","meaning_ko":"백로그, 밀린 작업","category":"it","etymology":{"parts":[{"text":"back","type":"part","gloss":"뒤"},{"text":"log","type":"part","gloss":"통나무"}],"story":"벽난로 뒤쪽에 넣어 두던 큰 통나무 → 쌓아 둔 것 → 밀린 일 → 앞으로 할 작업 목록"},"example":{"q":"How does your team prioritize work?","a":"Every Monday we review the backlog together and move the most valuable items to the top.","a_ko":"매주 월요일에 함께 백로그를 검토하고 가장 가치 있는 항목을 맨 위로 올립니다."},"collocations":["product backlog","backlog grooming","clear the backlog"],"related":["codebase","rollout","ship"],"tip":"스크럼 용어 — 'a backlog of tickets'는 '밀린 티켓 더미'"},{"id":"d06-D01","day":6,"level":1,"set":"D","family":"F6","word":"terrific","pos":"adjective","ipa":"/təˈrɪfɪk/","meaning_ko":"아주 훌륭한","category":"interview","etymology":{"parts":[{"text":"terri","type":"root","gloss":"겁주다 (terrere)"},{"text":"fic","type":"root","gloss":"만들다 (fac)"}],"story":"라틴어 terrificus '겁나게(terrere) 만드는(fac)' → 무시무시한 → (구어) 엄청난 → 아주 훌륭한"},"example":{"q":"Tell me about someone who influenced your career.","a":"I had a terrific mentor who taught me how to write clean code.","a_ko":"깔끔한 코드를 쓰는 법을 가르쳐 준 훌륭한 멘토가 있었습니다."},"collocations":["terrific job","terrific opportunity","sounds terrific"],"related":["terrible","sacrifice","significant"],"tip":"terrible(끔찍한)과 뿌리는 같지만 뜻은 정반대로 '아주 좋은'"},{"id":"d06-D02","day":6,"level":1,"set":"D","family":"F6","word":"fashion","pos":"noun","ipa":"/ˈfæʃn/","meaning_ko":"방식, 유행","category":"interview","etymology":{"parts":[{"text":"fash","type":"root","gloss":"만들다 (fac → factio)"},{"text":"ion","type":"suffix","gloss":"~함"}],"story":"라틴어 factio '만드는 일' → 고대 프랑스어 façon '만드는 방식' → 방식 → 유행"},"example":{"q":"How do you handle tight deadlines?","a":"I break the work into small pieces and deliver them in a timely fashion.","a_ko":"일을 작게 나눠서 제때 하나씩 전달합니다."},"collocations":["in a timely fashion","in a similar fashion","old-fashioned"],"related":["fact","feature","manufacturing"],"tip":"패션(유행)만이 아니라 'in a … fashion'(~한 방식으로)로 자주 씀"},{"id":"d06-D03","day":6,"level":1,"set":"D","family":"F6","word":"identify","pos":"verb","ipa":"/aɪˈdentɪfaɪ/","meaning_ko":"찾아내다, 파악하다","category":"it","etymology":{"parts":[{"text":"identi","type":"root","gloss":"같은 (idem)"},{"text":"fy","type":"root","gloss":"~하게 만들다 (fac → -fy)"}],"story":"중세 라틴어 identificare '같은 것(idem)으로 만들다' → 무엇인지 알아보다 → 찾아내다"},"example":{"q":"Walk me through how you debug an issue.","a":"First, I identify the root cause by checking the logs and recent changes.","a_ko":"먼저 로그와 최근 변경 사항을 확인해서 근본 원인을 찾아냅니다."},"collocations":["identify the root cause","identify risks","identify with"],"related":["identity","verify","classify"],"tip":"find보다 '정확히 짚어 낸다'는 느낌 — 문제 해결 답변의 첫 단계"},{"id":"d06-D04","day":6,"level":1,"set":"D","family":"F6","word":"qualification","pos":"noun","ipa":"/ˌkwɑːlɪfɪˈkeɪʃn/","meaning_ko":"자격, 자격 요건","category":"interview","etymology":{"parts":[{"text":"quali","type":"root","gloss":"어떠한 (qualis)"},{"text":"fic","type":"root","gloss":"만들다 (fac)"},{"text":"ation","type":"suffix","gloss":"~함"}],"story":"중세 라틴어 qualificare '어떠한(qualis) 성질을 갖추게 만들다' → 일에 맞는 성질을 갖춤 → 자격"},"example":{"q":"Why do you think you're a good fit for this role?","a":"I meet all the listed qualifications, and I've also led a team of four.","a_ko":"공고에 적힌 자격 요건을 모두 갖췄고, 4명 규모 팀을 이끈 경험도 있습니다."},"collocations":["meet the qualifications","required qualifications","preferred qualifications"],"related":["qualify","quality","certification"],"tip":"채용 공고의 'Qualifications'(자격 요건) 항목 — required/preferred 구분"},{"id":"d06-D05","day":6,"level":1,"set":"D","family":"F6","word":"certification","pos":"noun","ipa":"/ˌsɜːrtɪfɪˈkeɪʃn/","meaning_ko":"자격증, 인증","category":"it","etymology":{"parts":[{"text":"certi","type":"root","gloss":"확실한 (certus)"},{"text":"fic","type":"root","gloss":"만들다 (fac)"},{"text":"ation","type":"suffix","gloss":"~함"}],"story":"확실하게(certus) 만듦 → 공식적으로 확인해 줌 → 인증, 자격증"},"example":{"q":"How do you keep your skills up to date?","a":"I recently earned the AWS Solutions Architect certification.","a_ko":"최근에 AWS 솔루션스 아키텍트 자격증을 취득했습니다."},"collocations":["earn a certification","AWS certification","certification exam"],"related":["certificate","certain","qualification"],"tip":"earn/get a certification — license는 법적 면허일 때"},{"id":"d06-D06","day":6,"level":2,"set":"D","family":"F6","word":"amplify","pos":"verb","ipa":"/ˈæmplɪfaɪ/","meaning_ko":"키우다, 증폭하다","category":"interview","etymology":{"parts":[{"text":"ampli","type":"root","gloss":"넓은·큰 (amplus)"},{"text":"fy","type":"root","gloss":"~하게 만들다 (fac → -fy)"}],"story":"크게(amplus) 만들다 → 증폭하다 → (영향력·목소리를) 키우다"},"example":{"q":"How do you support your teammates?","a":"I try to amplify my teammates' work by sharing their wins in our weekly updates.","a_ko":"주간 공유 때 팀원들의 성과를 알려서 그들의 일이 더 잘 드러나도록 합니다."},"collocations":["amplify impact","amplify voices","amplify a signal"],"related":["clarify","diversify","amplifier"],"tip":"'amplify others' voices'(다른 사람의 목소리를 키우다)는 포용적 리더십 표현"},{"id":"d06-D07","day":6,"level":2,"set":"D","family":"F6","word":"diversify","pos":"verb","ipa":"/daɪˈvɜːrsɪfaɪ/","meaning_ko":"다양화하다, 넓히다","category":"interview","etymology":{"parts":[{"text":"diversi","type":"root","gloss":"다양한 (diversus)"},{"text":"fy","type":"root","gloss":"~하게 만들다 (fac → -fy)"}],"story":"다양하게(diversus) 만들다 → 다양화하다 → (경험·역량을) 넓히다"},"example":{"q":"Why are you looking for a new role?","a":"I've worked only on backend systems for five years, so I want to diversify my skills with cloud and data work.","a_ko":"5년 동안 백엔드만 해 와서 클라우드와 데이터 쪽으로 역량을 넓히고 싶습니다."},"collocations":["diversify my skills","diversify experience","diversify risk"],"related":["diverse","unify","amplify"],"tip":"diverse(다양한)의 동사형 — 이직 사유를 긍정적으로 말할 때"},{"id":"d06-D08","day":6,"level":1,"set":"D","family":"F6","word":"structure","pos":"noun","ipa":"/ˈstrʌktʃər/","meaning_ko":"구조","category":"it","etymology":{"parts":[{"text":"struct","type":"root","gloss":"쌓다 (struere)"},{"text":"ure","type":"suffix","gloss":"~한 것"}],"story":"라틴어 struere '쌓아 올리다' → 쌓아 올린 것 → 짜임새 → 구조"},"example":{"q":"How do you organize a large project?","a":"I agree on a clear folder structure with the team before we start coding.","a_ko":"코딩을 시작하기 전에 팀과 명확한 폴더 구조를 정합니다."},"collocations":["data structure","team structure","code structure"],"related":["infrastructure","construct","instruction"],"tip":"답변 자체도 structure가 중요 — STAR 같은 'structured answer'"},{"id":"d06-D09","day":6,"level":1,"set":"D","family":"F6","word":"instruction","pos":"noun","ipa":"/ɪnˈstrʌkʃn/","meaning_ko":"지시, 안내","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안에"},{"text":"struct","type":"root","gloss":"쌓다 (struere)"},{"text":"ion","type":"suffix","gloss":"~함"}],"story":"라틴어 instruere '안에 쌓아 갖추다, 가르치다' → 가르침 → 지시, 사용 안내"},"example":{"q":"How do you onboard new team members?","a":"I write clear setup instructions so new members can run the app on day one.","a_ko":"신규 팀원이 첫날부터 앱을 실행할 수 있도록 명확한 설치 안내를 써 둡니다."},"collocations":["follow instructions","step-by-step instructions","clear instructions"],"related":["structure","instrumental","construct"],"tip":"보통 복수 instructions — CPU의 '명령어'도 instruction"},{"id":"d06-D10","day":6,"level":2,"set":"D","family":"F6","word":"construct","pos":"verb","ipa":"/kənˈstrʌkt/","meaning_ko":"구성하다, 만들다","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께 (com)"},{"text":"struct","type":"root","gloss":"쌓다 (struere)"}],"story":"함께(com) 쌓아 올리다(struere) → 짜 맞춰 만들다 → 구성하다"},"example":{"q":"How did you find the cause of the slow page?","a":"Our ORM constructs SQL queries at runtime, so I added logging to see exactly what hits the database.","a_ko":"ORM이 실행 중에 SQL 쿼리를 만들어 내서, 실제로 DB에 어떤 쿼리가 가는지 보려고 로그를 추가했습니다."},"collocations":["construct a query","construct an object","language construct"],"related":["constructive","structure","construe","instruction"],"tip":"동사는 /kənˈstrʌkt/, 명사(구성 개념)는 /ˈkɑːnstrʌkt/ — 강세 위치가 바뀜"},{"id":"d06-D11","day":6,"level":2,"set":"D","family":"F6","word":"constructive","pos":"adjective","ipa":"/kənˈstrʌktɪv/","meaning_ko":"건설적인","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께 (com)"},{"text":"struct","type":"root","gloss":"쌓다 (struere)"},{"text":"ive","type":"suffix","gloss":"~하는"}],"story":"함께 쌓아 올리는 → 허물지 않고 세워 주는 → 건설적인"},"example":{"q":"How do you handle criticism?","a":"I welcome constructive feedback, because it shows me blind spots I can't see myself.","a_ko":"건설적인 피드백은 환영합니다. 제가 스스로 볼 수 없는 맹점을 알려 주기 때문입니다."},"collocations":["constructive feedback","constructive criticism","constructive discussion"],"related":["construct","destructive","structure"],"tip":"'constructive feedback'을 통째로 — 피드백 질문의 필수 표현"},{"id":"d06-D12","day":6,"level":2,"set":"D","family":"F6","word":"destructive","pos":"adjective","ipa":"/dɪˈstrʌktɪv/","meaning_ko":"파괴적인, (되돌릴 수 없게) 지우는","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"반대로, 허물어"},{"text":"struct","type":"root","gloss":"쌓다 (struere)"},{"text":"ive","type":"suffix","gloss":"~하는"}],"story":"라틴어 destruere '쌓은 것을 허물다' → 파괴하는 → 되돌릴 수 없게 지우는"},"example":{"q":"How do you prevent mistakes in production?","a":"On my team, any destructive command, like dropping a table, needs a second reviewer before it runs in production.","a_ko":"저희 팀에서는 테이블 삭제처럼 되돌릴 수 없는 명령은 운영 환경에서 실행하기 전에 반드시 다른 사람이 한 번 더 확인합니다."},"collocations":["destructive operation","destructive change","non-destructive"],"related":["constructive","structure","instruction"],"tip":"IT에선 '파괴적'보다 '데이터를 지우는·되돌릴 수 없는' 작업을 가리킴"},{"id":"d06-D13","day":6,"level":2,"set":"D","family":"F6","word":"infrastructure","pos":"noun","ipa":"/ˈɪnfrəstrʌktʃər/","meaning_ko":"인프라, 기반 시설","category":"it","etymology":{"parts":[{"text":"infra","type":"prefix","gloss":"아래"},{"text":"struct","type":"root","gloss":"쌓다 (struere)"},{"text":"ure","type":"suffix","gloss":"~한 것"}],"story":"아래에(infra) 쌓아 놓은(struct) 것 → 밑바탕 구조 → 기반 시설 → 서버·네트워크 같은 IT 기반"},"example":{"q":"What's your experience with the cloud?","a":"I manage our AWS infrastructure with Terraform, so every change is reviewed and version-controlled.","a_ko":"AWS 인프라를 Terraform으로 관리해서 모든 변경이 리뷰를 거치고 버전 관리됩니다."},"collocations":["cloud infrastructure","infrastructure as code","infrastructure team"],"related":["structure","construct","instruction"],"tip":"IaC = infrastructure as code. 줄여서 'infra'라고도 함"},{"id":"d06-D14","day":6,"level":3,"set":"D","family":"F6","word":"instrumental","pos":"adjective","ipa":"/ˌɪnstrəˈmentl/","meaning_ko":"중요한 역할을 한","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안에"},{"text":"stru","type":"root","gloss":"쌓다 (struere)"},{"text":"ment","type":"suffix","gloss":"~하는 수단"},{"text":"al","type":"suffix","gloss":"~의"}],"story":"라틴어 instrumentum '갖춰 놓은 도구'(instruere) → 도구가 되는 → 일을 이루는 데 중요한 역할을 한"},"example":{"q":"What was your role in the migration?","a":"I was instrumental in moving our monolith to microservices; I designed the rollout plan and mentored two engineers through it.","a_ko":"모놀리스를 마이크로서비스로 옮기는 데 핵심 역할을 했습니다. 단계적 전환 계획을 짜고 엔지니어 두 명을 이끌어 주었습니다."},"collocations":["be instrumental in","instrumental role","instrumental to"],"related":["instruction","structure","construct"],"tip":"'be instrumental in -ing' — 공을 과장하지 않으면서 기여를 강조"},{"id":"d06-D15","day":6,"level":3,"set":"D","family":"F6","word":"construe","pos":"verb","ipa":"/kənˈstruː/","meaning_ko":"해석하다, (~로) 받아들이다","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께 (com)"},{"text":"strue","type":"root","gloss":"쌓다 (struct)"}],"story":"라틴어 construere '짜 맞추다' → 문장 성분을 짜 맞춰 읽다 → 뜻을 해석하다"},"example":{"q":"How do you give critical feedback in writing?","a":"I'm careful with written feedback, because short comments can easily be construed as harsh, so I add context and suggestions.","a_ko":"글로 하는 피드백은 조심합니다. 짧은 코멘트는 쉽게 가혹하게 받아들여질 수 있어서, 맥락과 제안을 덧붙입니다."},"collocations":["be construed as","misconstrue","construe narrowly"],"related":["construct","structure","instruction"],"tip":"주로 수동태 'be construed as ~'(~로 받아들여지다) — misconstrue(오해하다)도 같이"},{"id":"d06-D16","day":6,"level":1,"set":"D","family":"F6","word":"engine","pos":"noun","ipa":"/ˈendʒɪn/","meaning_ko":"엔진, 핵심 처리 장치","category":"it","etymology":{"parts":[{"text":"en","type":"prefix","gloss":"안에 (in)"},{"text":"gine","type":"root","gloss":"타고난 (gen 낳다)"}],"story":"라틴어 ingenium '타고난 재주' → 재주로 만든 장치 → 기계 → 엔진, 핵심 처리부"},"example":{"q":"What was the hardest part of that system?","a":"The hardest part was the pricing engine, which handled thousands of rules.","a_ko":"가장 어려웠던 건 수천 개의 규칙을 처리하는 가격 계산 엔진이었습니다."},"collocations":["search engine","rules engine","game engine"],"related":["engineer","ingenious","generate"],"tip":"소프트웨어에서도 '핵심 처리부'를 engine이라고 부름"},{"id":"d06-D17","day":6,"level":1,"set":"D","family":"F6","word":"engineer","pos":"noun","ipa":"/ˌendʒɪˈnɪr/","meaning_ko":"엔지니어, 기술자","category":"interview","etymology":{"parts":[{"text":"en","type":"prefix","gloss":"안에 (in)"},{"text":"gine","type":"root","gloss":"타고난 (gen 낳다)"},{"text":"er","type":"suffix","gloss":"~하는 사람"}],"story":"engine(기계 장치)을 만드는 사람 → 기술자 → 엔지니어"},"example":{"q":"Tell me about yourself.","a":"I'm a backend engineer with five years of experience in fintech.","a_ko":"핀테크 분야에서 5년 경력을 가진 백엔드 엔지니어입니다."},"collocations":["software engineer","senior engineer","engineering team"],"related":["engine","ingenious","engender"],"tip":"강세는 끝 /-ˈnɪr/ — 한국식 '엔지니어'보다 뒤를 세게"},{"id":"d06-D18","day":6,"level":1,"set":"D","family":"F6","word":"gentle","pos":"adjective","ipa":"/ˈdʒentl/","meaning_ko":"부드러운, 온화한","category":"interview","etymology":{"parts":[{"text":"gent","type":"root","gloss":"가문·태생 (gens ← gen 낳다)"},{"text":"le","type":"suffix","gloss":"형용사 어미"}],"story":"라틴어 gentilis '같은 가문의' → 좋은 가문 출신의 → 점잖은 → 부드러운"},"example":{"q":"How do you give feedback to junior developers?","a":"I give gentle but honest feedback, and I always explain the reason.","a_ko":"부드럽지만 솔직하게 피드백하고, 항상 이유를 설명합니다."},"collocations":["gentle reminder","gentle push","gentle approach"],"related":["generous","general","engine"],"tip":"메일의 'Just a gentle reminder'(가볍게 다시 알려 드립니다)도 자주 씀"},{"id":"d06-D19","day":6,"level":1,"set":"D","family":"F6","word":"generous","pos":"adjective","ipa":"/ˈdʒenərəs/","meaning_ko":"너그러운, 아낌없는","category":"interview","etymology":{"parts":[{"text":"gener","type":"root","gloss":"태생·종류 (genus)"},{"text":"ous","type":"suffix","gloss":"~한"}],"story":"라틴어 generosus '좋은 태생의' → 고귀한 → 마음이 넓은 → 아낌없이 베푸는"},"example":{"q":"What kind of people do you like working with?","a":"I like working with people who are generous with their time and knowledge.","a_ko":"시간과 지식을 아낌없이 나누는 사람들과 일하는 게 좋습니다."},"collocations":["generous with","generous support","generous offer"],"related":["generic","gentle","general"],"tip":"'generous with + 시간/지식' — 돈 이야기에만 쓰는 말이 아님"},{"id":"d06-D20","day":6,"level":2,"set":"D","family":"F6","word":"generic","pos":"adjective","ipa":"/dʒəˈnerɪk/","meaning_ko":"범용의, 일반적인","category":"it","etymology":{"parts":[{"text":"gener","type":"root","gloss":"종류 (genus)"},{"text":"ic","type":"suffix","gloss":"~의"}],"story":"라틴어 genus '종류' → 한 종류 전체에 해당하는 → 특정하지 않은 → 범용의"},"example":{"q":"How do you avoid duplicate code?","a":"I extracted the shared logic into a generic helper, so five services now use the same tested code.","a_ko":"공통 로직을 범용 헬퍼로 뽑아내서, 이제 다섯 개 서비스가 같은 검증된 코드를 씁니다."},"collocations":["generic type","generic solution","generic answer"],"related":["general","generous","generate"],"tip":"'a generic answer'(뻔한 답변)는 면접에서 피해야 할 것 — 구체적 사례로"},{"id":"d06-D21","day":6,"level":2,"set":"D","family":"F6","word":"ingenious","pos":"adjective","ipa":"/ɪnˈdʒiːniəs/","meaning_ko":"기발한, 독창적인","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안에"},{"text":"geni","type":"root","gloss":"타고난 (gen 낳다)"},{"text":"ous","type":"suffix","gloss":"~한"}],"story":"라틴어 ingenium '타고난 재주' → ingeniosus '재주가 뛰어난' → 기발한"},"example":{"q":"Tell me about a creative solution you saw or built.","a":"A teammate came up with an ingenious workaround that let us ship without waiting for the vendor's fix.","a_ko":"동료가 기발한 우회 방법을 생각해 내서 업체의 수정을 기다리지 않고 출시할 수 있었습니다."},"collocations":["ingenious solution","ingenious idea","ingenious way to"],"related":["engine","engineer","genius"],"tip":"ingenuous(순진한)와 철자 주의 — ingenious가 '기발한'"},{"id":"d06-D22","day":6,"level":3,"set":"D","family":"F6","word":"engender","pos":"verb","ipa":"/ɪnˈdʒendər/","meaning_ko":"(감정·분위기를) 불러일으키다, 쌓다","category":"interview","etymology":{"parts":[{"text":"en","type":"prefix","gloss":"안에 (in)"},{"text":"gender","type":"root","gloss":"낳다 (gen)"}],"story":"라틴어 ingenerare '안에 낳다, 심다' → 생기게 하다 → (신뢰·감정을) 불러일으키다"},"example":{"q":"How do you build trust as a new team lead?","a":"I engender trust by being transparent about decisions, even unpopular ones, and by following through on what I promise.","a_ko":"인기 없는 결정이라도 투명하게 설명하고, 약속한 건 끝까지 지켜서 신뢰를 쌓습니다."},"collocations":["engender trust","engender loyalty","engender a sense of"],"related":["generate","general","engine"],"tip":"build trust의 격식체 — gender(성)와 같은 genus 뿌리지만 뜻은 '생기게 하다'"},{"id":"d06-D23","day":6,"level":1,"set":"D","family":"F6","word":"ship","pos":"verb","ipa":"/ʃɪp/","meaning_ko":"출시하다, 내보내다","category":"interview","etymology":{"parts":[{"text":"ship","type":"part","gloss":"배"}],"story":"배(ship) → 배로 실어 보내다 → 제품을 사용자에게 내보내다 → 출시하다"},"example":{"q":"What did you achieve last quarter?","a":"Last quarter, my team shipped three major features on schedule.","a_ko":"지난 분기에 저희 팀은 큰 기능 세 개를 일정대로 출시했습니다."},"collocations":["ship a feature","ship to production","ship fast"],"related":["release","rollout","build"],"tip":"release보다 구어적인 개발자 말 — 'Ship it!'(내보내자!)"},{"id":"d06-D24","day":6,"level":2,"set":"D","family":"F6","word":"pull request","pos":"noun","ipa":"/ˈpʊl rɪˌkwest/","meaning_ko":"풀 리퀘스트 (코드 병합 요청)","category":"it","etymology":{"parts":[{"text":"pull","type":"part","gloss":"끌다 (고대 영어 pullian)"},{"text":"request","type":"part","gloss":"요청 (라틴어 re+quaerere 다시 구하다)"}],"story":"내 변경을 끌어가 달라는 요청 → 코드 리뷰·병합 요청"},"example":{"q":"How does your team do code reviews?","a":"Every change goes through a pull request, and at least one teammate must approve it before merging.","a_ko":"모든 변경은 풀 리퀘스트를 거치고, 병합 전에 팀원 한 명 이상이 승인해야 합니다."},"collocations":["open a pull request","review a pull request"],"related":["question","require","inquiry"],"tip":"줄여서 PR. 'merge request(MR)' 라고 부르는 팀도 있음"},{"id":"d06-D25","day":6,"level":2,"set":"D","family":"F6","word":"edge case","pos":"noun","ipa":"/ˈedʒ keɪs/","meaning_ko":"예외적인 경우, 엣지 케이스","category":"it","etymology":{"parts":[{"text":"edge","type":"part","gloss":"가장자리"},{"text":"case","type":"part","gloss":"경우"}],"story":"가장자리(edge)에 있는 경우(case) → 입력 범위의 끝에서 생기는 드문 상황"},"example":{"q":"How do you write tests?","a":"Besides the happy path, I always test edge cases like empty input and very large files.","a_ko":"정상 경로뿐 아니라 빈 입력이나 아주 큰 파일 같은 엣지 케이스도 항상 테스트합니다."},"collocations":["handle edge cases","cover edge cases","corner case"],"related":["bug","codebase","backlog"],"tip":"corner case는 여러 조건이 겹친 더 드문 경우"},{"id":"d07-A01","day":7,"level":1,"set":"A","family":"F7","word":"change","pos":"verb","ipa":"/tʃeɪndʒ/","meaning_ko":"바꾸다, 변화","category":"interview","etymology":{"parts":[{"text":"change","type":"root","gloss":"바꾸다 (라틴어 cambiare)"}],"story":"라틴어 cambiare(맞바꾸다) → 고대 프랑스어 changier → 바꾸다, 변화"},"example":{"q":"Why do you want to change jobs?","a":"I want to change my focus from maintenance work to building new products.","a_ko":"유지보수 업무에서 신규 제품 개발로 초점을 바꾸고 싶습니다."},"collocations":["change jobs","career change","adapt to change"],"related":["exchange","interchangeable","changeable"],"tip":"vert·mut 와는 다른 라틴어 cambiare 출신이지만 '바꾸다' 가족으로 함께 외우기. '이직하다'는 change jobs (복수형)"},{"id":"d07-A02","day":7,"level":1,"set":"A","family":"F7","word":"exchange","pos":"verb","ipa":"/ɪksˈtʃeɪndʒ/","meaning_ko":"주고받다, 교환하다","category":"interview","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"change","type":"root","gloss":"바꾸다 (cambiare)"}],"story":"밖으로 내주고 바꿔 받다 → 주고받다, 교환하다"},"example":{"q":"How do you share knowledge with your team?","a":"We exchange feedback in code reviews and in short weekly tech talks.","a_ko":"코드 리뷰와 매주 짧은 기술 공유 시간에 서로 피드백을 주고받습니다."},"collocations":["exchange ideas","exchange feedback","in exchange for"],"related":["change","interchangeable","changeable"],"tip":"share 보다 '서로 주고받는' 느낌. 협업 질문에서 exchange ideas 를 자주 씀"},{"id":"d07-A03","day":7,"level":2,"set":"A","family":"F7","word":"alternative","pos":"noun","ipa":"/ɔːlˈtɜːrnətɪv/","meaning_ko":"대안, 다른 방법","category":"interview","etymology":{"parts":[{"text":"altern","type":"root","gloss":"번갈아 (alter: 다른 쪽)"},{"text":"ative","type":"suffix","gloss":"~하는 것"}],"story":"alter(둘 중 다른 쪽) → 번갈아 하는 → 다른 쪽을 고를 수 있는 것 → 대안"},"example":{"q":"What would you do if your manager rejected your proposal?","a":"I would ask what concerns they have and come back with an alternative that addresses them.","a_ko":"어떤 점이 걱정되는지 여쭤보고, 그 걱정을 해소할 대안을 가지고 다시 오겠습니다."},"collocations":["a viable alternative","consider alternatives","an alternative to"],"related":["alter","alternate","altruistic","alteration"],"tip":"an alternative to X = X의 대안. 강세는 둘째 음절 '얼터-너티브'"},{"id":"d07-A04","day":7,"level":2,"set":"A","family":"F7","word":"alternate","pos":"verb","ipa":"/ˈɔːltərneɪt/","meaning_ko":"번갈아 하다, 교대로 맡다","category":"interview","etymology":{"parts":[{"text":"altern","type":"root","gloss":"번갈아 (alter)"},{"text":"ate","type":"suffix","gloss":"~하다"}],"story":"alter(다른 쪽) → 이쪽저쪽을 오가다 → 번갈아 하다"},"example":{"q":"How does your team handle on-call duty?","a":"Four of us alternate on-call weeks, so nobody gets burned out by constant alerts.","a_ko":"네 명이 한 주씩 번갈아 온콜을 맡아서, 계속되는 알림에 지치는 사람이 없도록 합니다."},"collocations":["alternate between","on alternate days","alternate weeks"],"related":["alternative","alter","altruistic"],"tip":"동사는 '얼터네이트', 형용사(alternate days)는 '얼터넛'처럼 끝이 약해짐"},{"id":"d07-A05","day":7,"level":1,"set":"A","family":"F7","word":"apply","pos":"verb","ipa":"/əˈplaɪ/","meaning_ko":"지원하다, 적용하다","category":"interview","etymology":{"parts":[{"text":"ap","type":"prefix","gloss":"~에 (ad)"},{"text":"ply","type":"root","gloss":"접다·붙이다 (plic)"}],"story":"~에 접어 붙이다 → 갖다 대다 → 적용하다, (자리에) 지원하다"},"example":{"q":"Why did you apply for this position?","a":"I applied because this role matches my backend experience and my interest in payments.","a_ko":"제 백엔드 경험과 결제 분야에 대한 관심에 딱 맞는 자리라서 지원했습니다."},"collocations":["apply for a job","apply to a company","apply a fix"],"related":["application","applicable","reply","deploy"],"tip":"apply for + 직무, apply to + 회사. 둘을 헷갈리지 않기"},{"id":"d07-A06","day":7,"level":1,"set":"A","family":"F7","word":"application","pos":"noun","ipa":"/ˌæplɪˈkeɪʃn/","meaning_ko":"애플리케이션, 적용","category":"it","etymology":{"parts":[{"text":"ap","type":"prefix","gloss":"~에 (ad)"},{"text":"plic","type":"root","gloss":"접다·붙이다"},{"text":"ation","type":"suffix","gloss":"~하는 것"}],"story":"~에 갖다 붙임 → (기술을) 적용함 → 특정 용도에 적용한 프로그램 → 애플리케이션"},"example":{"q":"What kind of applications have you built?","a":"I've mainly built web applications using React on the front end and Spring Boot behind it.","a_ko":"주로 프론트엔드는 React, 백엔드는 Spring Boot로 웹 애플리케이션을 만들어 왔습니다."},"collocations":["web application","application layer","practical application"],"related":["apply","applicable","explicit","replica"],"tip":"app 은 이 단어의 줄임말. job application 이면 '입사 지원서'"},{"id":"d07-A07","day":7,"level":1,"set":"A","family":"F7","word":"reply","pos":"verb","ipa":"/rɪˈplaɪ/","meaning_ko":"답하다, 답장하다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시·뒤로"},{"text":"ply","type":"root","gloss":"접다 (plic)"}],"story":"다시 접어 되돌리다(replicare) → 말을 되돌려 주다 → 답하다"},"example":{"q":"How do you handle a high volume of messages?","a":"I reply to urgent messages first and batch the rest twice a day.","a_ko":"급한 메시지에 먼저 답하고, 나머지는 하루 두 번 몰아서 처리합니다."},"collocations":["reply to","reply promptly","a quick reply"],"related":["apply","imply","replica","replication"],"tip":"reply 뒤에는 to 를 붙임 (reply to an email). answer 는 to 없이 바로 목적어"},{"id":"d07-A08","day":7,"level":1,"set":"A","family":"F7","word":"imply","pos":"verb","ipa":"/ɪmˈplaɪ/","meaning_ko":"암시하다, 넌지시 뜻하다","category":"interview","etymology":{"parts":[{"text":"im","type":"prefix","gloss":"안으로 (in)"},{"text":"ply","type":"root","gloss":"접다 (plic)"}],"story":"안에 접어 넣다(implicare) → 말 속에 담다 → 암시하다"},"example":{"q":"Why are you leaving after only a year?","a":"I don't mean to imply my team was bad; I simply want bigger challenges.","a_ko":"팀이 나빴다는 뜻은 아닙니다. 그저 더 큰 도전을 원할 뿐입니다."},"collocations":["imply that","as the name implies","don't mean to imply"],"related":["implication","implicit","explicit","reply"],"tip":"imply 는 말하는 사람이 '넌지시 뜻하다', infer 는 듣는 사람이 '추론하다'"},{"id":"d07-A09","day":7,"level":2,"set":"A","family":"F7","word":"implication","pos":"noun","ipa":"/ˌɪmplɪˈkeɪʃn/","meaning_ko":"영향, 함축된 의미","category":"it","etymology":{"parts":[{"text":"im","type":"prefix","gloss":"안으로 (in)"},{"text":"plic","type":"root","gloss":"접다"},{"text":"ation","type":"suffix","gloss":"~하는 것"}],"story":"안에 접혀 들어 있는 것 → 숨은 뜻 → (결정이 가져올) 영향"},"example":{"q":"How do you evaluate a technical decision?","a":"Before choosing a database, I review the cost and performance implications over the next two to three years.","a_ko":"데이터베이스를 고르기 전에 향후 2~3년 동안의 비용과 성능 측면의 영향을 검토합니다."},"collocations":["performance implications","security implications","have implications for"],"related":["imply","implicit","explicit","complicated"],"tip":"보통 복수형 implications 로 '파급 효과'라는 뜻으로 씀"},{"id":"d07-A10","day":7,"level":2,"set":"A","family":"F7","word":"explicit","pos":"adjective","ipa":"/ɪkˈsplɪsɪt/","meaning_ko":"명시적인, 분명한","category":"it","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"plic","type":"root","gloss":"접다"},{"text":"it","type":"suffix","gloss":"~된 (과거분사)"}],"story":"접힌 것을 밖으로 펼친(explicitus) → 다 드러난 → 명시적인"},"example":{"q":"How do you make your code easier to maintain?","a":"I prefer explicit configuration over hidden defaults, because new team members can see exactly how the system behaves.","a_ko":"숨은 기본값보다 명시적인 설정을 선호합니다. 새로 온 팀원이 시스템이 어떻게 동작하는지 정확히 볼 수 있기 때문입니다."},"collocations":["explicit configuration","explicit type","be explicit about"],"related":["explicitly","implicit","imply","complicated"],"tip":"반대말 implicit(암묵적인)은 Day 17. 'Explicit is better than implicit'(Zen of Python)으로 함께 외우기"},{"id":"d07-A11","day":7,"level":2,"set":"A","family":"F7","word":"explicitly","pos":"adverb","ipa":"/ɪkˈsplɪsɪtli/","meaning_ko":"명시적으로, 분명하게","category":"interview","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"plic","type":"root","gloss":"접다"},{"text":"it","type":"suffix","gloss":"~된 (과거분사)"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"접힌 것을 밖으로 펼친 → 다 드러나게 → 분명하게"},"example":{"q":"How do you avoid misunderstandings with stakeholders?","a":"I explicitly write down what is in and out of scope, and I ask them to confirm it in writing.","a_ko":"범위에 들어가는 것과 빠지는 것을 분명하게 적어 두고, 서면으로 확인해 달라고 요청합니다."},"collocations":["explicitly state","explicitly ask","explicitly mentioned"],"related":["explicit","implicitly","imply"],"tip":"clearly 보다 '말로 딱 집어서'라는 느낌이 강함"},{"id":"d07-A12","day":7,"level":1,"set":"A","family":"F7","word":"complicated","pos":"adjective","ipa":"/ˈkɑːmplɪkeɪtɪd/","meaning_ko":"복잡한, 까다로운","category":"interview","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"함께"},{"text":"plic","type":"root","gloss":"접다"},{"text":"ated","type":"suffix","gloss":"~된"}],"story":"여러 겹으로 함께 접힌(complicare) → 얽힌 → 복잡한"},"example":{"q":"Tell me about a difficult project.","a":"The migration was complicated because three teams shared the same database.","a_ko":"세 팀이 같은 데이터베이스를 공유하고 있어서 마이그레이션이 복잡했습니다."},"collocations":["complicated process","get complicated","overly complicated"],"related":["complex","complication","explicit","simplify"],"tip":"complicated 는 '꼬여서 다루기 까다로운', complex 는 '부분이 많아 복합적인'"},{"id":"d07-A13","day":7,"level":1,"set":"A","family":"F7","word":"complex","pos":"adjective","ipa":"/ˈkɑːmpleks/","meaning_ko":"복잡한, 복합적인","category":"it","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"함께"},{"text":"plex","type":"root","gloss":"엮다 (plectere, plic와 같은 뿌리)"}],"story":"함께 엮인(complexus) → 여러 부분이 얽힌 → 복잡한, 복합적인"},"example":{"q":"What is the most complex system you've worked on?","a":"The most complex one was a real-time bidding platform with twenty microservices.","a_ko":"가장 복잡했던 시스템은 마이크로서비스 20개로 된 실시간 입찰 플랫폼이었습니다."},"collocations":["complex system","complex query","highly complex"],"related":["complexity","complicated","multiple","simplicity"],"tip":"complicated 보다 중립적이라 기술 설명에 더 자주 씀"},{"id":"d07-A14","day":7,"level":2,"set":"A","family":"F7","word":"complexity","pos":"noun","ipa":"/kəmˈpleksəti/","meaning_ko":"복잡성, 복잡도","category":"it","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"함께"},{"text":"plex","type":"root","gloss":"엮다 (plectere)"},{"text":"ity","type":"suffix","gloss":"~성"}],"story":"함께 엮여 있음 → 복잡함 → (알고리즘의) 복잡도"},"example":{"q":"How do you decide whether to add a new feature?","a":"I weigh the user value against the complexity it adds, because every feature has to be maintained later.","a_ko":"그 기능이 주는 사용자 가치와 늘어나는 복잡성을 따져 봅니다. 모든 기능은 나중에 유지보수해야 하니까요."},"collocations":["reduce complexity","time complexity","add complexity"],"related":["complex","complicated","simplicity","simplify"],"tip":"알고리즘 면접의 '시간 복잡도'는 time complexity"},{"id":"d07-A15","day":7,"level":1,"set":"A","family":"F7","word":"simplify","pos":"verb","ipa":"/ˈsɪmplɪfaɪ/","meaning_ko":"단순화하다","category":"it","etymology":{"parts":[{"text":"sim","type":"prefix","gloss":"하나 (sem)"},{"text":"pl","type":"root","gloss":"겹 (-plex)"},{"text":"ify","type":"suffix","gloss":"~하게 만들다"}],"story":"한 겹으로 된(simplex) → 단순한(simple) → 단순하게 만들다"},"example":{"q":"What did you improve in your last project?","a":"I simplified our deployment script from two hundred lines to forty.","a_ko":"배포 스크립트를 200줄에서 40줄로 단순화했습니다."},"collocations":["simplify the process","simplify the code","greatly simplify"],"related":["simplicity","complex","multiple","duplicate"],"tip":"결과를 말할 때는 숫자(200 → 40)를 붙이면 설득력이 커짐"},{"id":"d07-A16","day":7,"level":1,"set":"A","family":"F7","word":"simplicity","pos":"noun","ipa":"/sɪmˈplɪsəti/","meaning_ko":"단순함","category":"it","etymology":{"parts":[{"text":"sim","type":"prefix","gloss":"하나 (sem)"},{"text":"plic","type":"root","gloss":"겹 (-plex)"},{"text":"ity","type":"suffix","gloss":"~함"}],"story":"한 겹임(simplicitas) → 단순함"},"example":{"q":"What do you value in software design?","a":"I value simplicity, so I avoid adding layers we don't need yet.","a_ko":"단순함을 중요하게 생각해서, 아직 필요 없는 계층은 추가하지 않습니다."},"collocations":["for simplicity","value simplicity","simplicity of design"],"related":["simplify","complexity","complex"],"tip":"for simplicity('단순하게 설명하자면')는 설계를 설명할 때 유용"},{"id":"d07-A17","day":7,"level":1,"set":"A","family":"F7","word":"multiple","pos":"adjective","ipa":"/ˈmʌltɪpl/","meaning_ko":"여러, 다수의","category":"it","etymology":{"parts":[{"text":"multi","type":"prefix","gloss":"많은"},{"text":"ple","type":"root","gloss":"겹 (-plex)"}],"story":"여러 겹의(multiplex) → 여러 개의"},"example":{"q":"Have you worked across different environments?","a":"I've deployed services to multiple cloud regions for high availability.","a_ko":"고가용성을 위해 여러 클라우드 리전에 서비스를 배포한 적이 있습니다."},"collocations":["multiple regions","multiple times","multiple teams"],"related":["multiplier","multiply","simple","complex"],"tip":"many 보다 문어적이라 업무 설명 문장에 잘 어울림"},{"id":"d07-A18","day":7,"level":3,"set":"A","family":"F7","word":"multiplier","pos":"noun","ipa":"/ˈmʌltɪplaɪər/","meaning_ko":"(효과를) 몇 배로 키우는 사람·요인","category":"interview","etymology":{"parts":[{"text":"multi","type":"prefix","gloss":"많은"},{"text":"pli","type":"root","gloss":"접다·겹 (plic)"},{"text":"er","type":"suffix","gloss":"~하는 것"}],"story":"여러 겹으로 늘리다(multiplicare) → 곱하는 것 → 팀의 성과를 몇 배로 키우는 사람"},"example":{"q":"How do you see your role as a senior engineer?","a":"I try to be a force multiplier: by writing clear docs and mentoring juniors, I help the whole team ship faster.","a_ko":"저는 팀의 힘을 몇 배로 키우는 사람이 되려고 합니다. 명확한 문서를 쓰고 주니어를 멘토링해서 팀 전체가 더 빨리 출시하도록 돕습니다."},"collocations":["force multiplier","act as a multiplier"],"related":["multiple","multiply","complex","simplify"],"tip":"force multiplier 는 시니어 면접에서 '혼자 잘하기보다 팀을 키운다'를 한마디로 보여 주는 표현"},{"id":"d07-A19","day":7,"level":2,"set":"A","family":"F7","word":"fluid","pos":"adjective","ipa":"/ˈfluːɪd/","meaning_ko":"유동적인, 자주 바뀌는","category":"interview","etymology":{"parts":[{"text":"flu","type":"root","gloss":"흐르다"},{"text":"id","type":"suffix","gloss":"~한 상태의"}],"story":"흐르는(fluidus) → 모양이 고정되지 않은 → 유동적인"},"example":{"q":"How do you work when requirements keep changing?","a":"At an early-stage startup, requirements are fluid, so I build small prototypes and get feedback quickly.","a_ko":"초기 스타트업에서는 요구사항이 유동적이어서, 작은 프로토타입을 만들어 빠르게 피드백을 받습니다."},"collocations":["fluid situation","fluid requirements","remain fluid"],"related":["fluctuate","flux","influx","fluent"],"tip":"명사로는 '액체'. 계획·상황이 '아직 굳지 않은'을 말할 때 씀"},{"id":"d07-A20","day":7,"level":2,"set":"A","family":"F7","word":"fluctuate","pos":"verb","ipa":"/ˈflʌktʃueɪt/","meaning_ko":"변동하다, 오르내리다","category":"it","etymology":{"parts":[{"text":"fluctu","type":"root","gloss":"물결 (fluctus ← flu)"},{"text":"ate","type":"suffix","gloss":"~하다"}],"story":"흐르는 물결(fluctus)처럼 움직이다 → 오르내리다 → 변동하다"},"example":{"q":"How did you handle unpredictable traffic?","a":"Our traffic fluctuated a lot during sales events, so I set up autoscaling based on request rate.","a_ko":"세일 행사 때 트래픽이 크게 오르내려서, 요청 수에 따라 자동으로 확장되도록 설정했습니다."},"collocations":["fluctuate widely","fluctuating demand","prices fluctuate"],"related":["fluctuation","fluid","flux","influx"],"tip":"발음 '플럭-추-에이트', 강세는 첫 음절"},{"id":"d07-A21","day":7,"level":2,"set":"A","family":"F7","word":"fluctuation","pos":"noun","ipa":"/ˌflʌktʃuˈeɪʃn/","meaning_ko":"변동, 오르내림","category":"it","etymology":{"parts":[{"text":"fluctu","type":"root","gloss":"물결 (fluctus ← flu)"},{"text":"ation","type":"suffix","gloss":"~하는 것"}],"story":"물결처럼 오르내림 → 변동"},"example":{"q":"How do you monitor system health?","a":"I set alerts on sudden fluctuations in error rate, not only on fixed thresholds.","a_ko":"고정된 임계값뿐 아니라 에러율의 급격한 변동에도 알림을 걸어 둡니다."},"collocations":["sudden fluctuation","seasonal fluctuations","fluctuation in demand"],"related":["fluctuate","flux","fluid"],"tip":"보통 복수형 fluctuations 로 '오르내림'을 표현"},{"id":"d07-A22","day":7,"level":3,"set":"A","family":"F7","word":"flux","pos":"noun","ipa":"/flʌks/","meaning_ko":"끊임없는 변화, 유동","category":"interview","etymology":{"parts":[{"text":"flux","type":"root","gloss":"흐름 (flu)"}],"story":"흐름(fluxus) → 계속 흘러 바뀌는 상태"},"example":{"q":"Tell me about a time you worked through uncertainty.","a":"During a reorganization, priorities were in flux for months, so I kept a short weekly plan and re-aligned with my manager every Monday.","a_ko":"조직 개편 중에 몇 달 동안 우선순위가 계속 바뀌어서, 짧은 주간 계획을 세우고 매주 월요일 매니저와 방향을 다시 맞췄습니다."},"collocations":["in flux","in a state of flux","constant flux"],"related":["influx","fluid","fluctuate","superfluous"],"tip":"be in flux 를 덩어리로 외우기 — '변화가 많은 환경' 이야기에 딱 맞음"},{"id":"d07-A23","day":7,"level":1,"set":"A","family":"F7","word":"shift","pos":"verb","ipa":"/ʃɪft/","meaning_ko":"옮기다, 바꾸다","category":"interview","etymology":{"parts":[{"text":"shift","type":"part","gloss":"옮기다 (고대 영어 sciftan)"}],"story":"고대 영어 sciftan(나누다·배치하다) → 자리를 옮기다 → 방향·초점을 바꾸다"},"example":{"q":"How has your role changed over time?","a":"I shifted my focus from frontend to cloud infrastructure two years ago.","a_ko":"2년 전에 프론트엔드에서 클라우드 인프라로 초점을 옮겼습니다."},"collocations":["shift focus","shift priorities","a shift in mindset"],"related":["change","alter","turnaround"],"tip":"change 보다 '방향을 옮기다'에 가까움. 명사로 night shift(교대 근무)도"},{"id":"d07-A24","day":7,"level":1,"set":"A","family":"F7","word":"keep up with","pos":"phrasal verb","ipa":"/kiːp ʌp wɪð/","meaning_ko":"뒤처지지 않고 따라가다","category":"interview","etymology":{"parts":[{"text":"keep","type":"part","gloss":"계속 유지하다"},{"text":"up","type":"part","gloss":"위로·끝까지"},{"text":"with","type":"part","gloss":"~와 함께"}],"story":"~와 함께 계속 나란히 유지하다 → 뒤처지지 않고 따라가다"},"example":{"q":"How do you stay current with technology?","a":"I keep up with new tools by reading release notes and building side projects.","a_ko":"릴리스 노트를 읽고 사이드 프로젝트를 만들면서 새로운 도구를 따라갑니다."},"collocations":["keep up with trends","keep up with demand","hard to keep up"],"related":["catch up","ramp up","pick up"],"tip":"catch up 은 '뒤처진 걸 따라잡다', keep up with 는 '처지지 않게 계속 따라가다'"},{"id":"d07-A25","day":7,"level":2,"set":"A","family":"F7","word":"hit the ground running","pos":"phrase","ipa":"/ˌhɪt ðə ˌɡraʊnd ˈrʌnɪŋ/","meaning_ko":"시작하자마자 바로 성과를 내다","category":"interview","etymology":{"parts":[{"text":"hit","type":"part","gloss":"치다, 닿다"},{"text":"the","type":"part","gloss":"그"},{"text":"ground","type":"part","gloss":"땅"},{"text":"running","type":"part","gloss":"달리면서"}],"story":"땅에 닿자마자 달리다 → 새 일에 적응 기간 없이 바로 일하다"},"example":{"q":"How quickly can you contribute to our team?","a":"I already use your tech stack daily, so I can hit the ground running from my first week.","a_ko":"귀사의 기술 스택을 이미 매일 쓰고 있어서 첫 주부터 바로 성과를 낼 수 있습니다."},"collocations":["hit the ground running from day one","ready to hit the ground running"],"related":["ramp up","get up to speed"],"tip":"적응 속도를 물을 때 쓰는 자신감 있는 관용구 (모두 게르만계 단어)"},{"id":"d07-B01","day":7,"level":1,"set":"B","family":"F7","word":"display","pos":"verb","ipa":"/dɪˈspleɪ/","meaning_ko":"표시하다, 보여 주다","category":"it","etymology":{"parts":[{"text":"dis","type":"prefix","gloss":"풀어 (dis)"},{"text":"play","type":"root","gloss":"접다 (plic)"}],"story":"접힌 것을 풀어 펼치다(displicare) → 펼쳐 보여 주다 → 표시하다, 화면"},"example":{"q":"What did you build on the frontend?","a":"I built a dashboard that displays real-time order data for the sales team.","a_ko":"영업팀을 위해 실시간 주문 데이터를 보여 주는 대시보드를 만들었습니다."},"collocations":["display data","display an error message","on display"],"related":["deploy","deployment","employ","apply"],"tip":"play(놀다)와는 상관없음! deploy 와 같은 라틴어 displicare(펼치다)에서 나온 쌍둥이 단어"},{"id":"d07-B02","day":7,"level":1,"set":"B","family":"F7","word":"deployment","pos":"noun","ipa":"/dɪˈplɔɪmənt/","meaning_ko":"배포","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"풀어 (dis)"},{"text":"ploy","type":"root","gloss":"접다 (plic)"},{"text":"ment","type":"suffix","gloss":"~하는 것"}],"story":"접힌 것을 펼침 → (병력의) 전개 → (서비스의) 배포"},"example":{"q":"How often does your team release?","a":"We do several deployments a day with a fully automated pipeline.","a_ko":"완전 자동화된 파이프라인으로 하루에도 여러 번 배포합니다."},"collocations":["deployment pipeline","blue-green deployment","zero-downtime deployment"],"related":["deploy","display","employer","apply"],"tip":"횟수를 말할 땐 셀 수 있는 명사로: several deployments a day"},{"id":"d07-B03","day":7,"level":2,"set":"B","family":"F7","word":"deploy","pos":"verb","ipa":"/dɪˈplɔɪ/","meaning_ko":"배포하다, (자원을) 투입하다","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"풀어 (dis)"},{"text":"ploy","type":"root","gloss":"접다 (plic)"}],"story":"라틴어 displicare → 프랑스어 déployer(펼치다) → 군대를 전개하다 → 서비스를 배포하다"},"example":{"q":"Walk me through how you release a new feature.","a":"I deploy it behind a feature flag first, so we can turn it off instantly if error rates rise.","a_ko":"먼저 기능 플래그 뒤에 배포해서, 에러율이 오르면 바로 끌 수 있게 합니다."},"collocations":["deploy to production","deploy a model","deploy resources"],"related":["deployment","display","employ","apply"],"tip":"deploy to production 처럼 to + 환경. 사람·자원을 '투입하다'라는 뜻도 있음"},{"id":"d07-B04","day":7,"level":1,"set":"B","family":"F7","word":"employer","pos":"noun","ipa":"/ɪmˈplɔɪər/","meaning_ko":"고용주, (다니는) 회사","category":"interview","etymology":{"parts":[{"text":"em","type":"prefix","gloss":"안으로 (in)"},{"text":"ploy","type":"root","gloss":"접다 (plic)"},{"text":"er","type":"suffix","gloss":"~하는 사람"}],"story":"안으로 접어 넣다(implicare) → 일에 끌어들이다 → 고용하다(employ) → 고용하는 쪽"},"example":{"q":"Why are you leaving your current employer?","a":"My current employer is great, but I want to work on larger-scale systems.","a_ko":"지금 회사도 좋지만, 더 큰 규모의 시스템을 다뤄 보고 싶습니다."},"collocations":["current employer","previous employer","equal opportunity employer"],"related":["employee","employment","deploy","imply"],"tip":"전 직장을 말할 때 my previous employer 라고 하면 격식 있게 들림"},{"id":"d07-B05","day":7,"level":1,"set":"B","family":"F7","word":"employee","pos":"noun","ipa":"/ɪmˈplɔɪiː/","meaning_ko":"직원","category":"interview","etymology":{"parts":[{"text":"em","type":"prefix","gloss":"안으로 (in)"},{"text":"ploy","type":"root","gloss":"접다 (plic)"},{"text":"ee","type":"suffix","gloss":"~되는 사람"}],"story":"일에 끌어들여진(employ) 사람 → 고용된 사람 → 직원"},"example":{"q":"What kind of employee are you?","a":"I'm the kind of employee who raises problems early instead of hiding them.","a_ko":"저는 문제를 숨기지 않고 일찍 알리는 직원입니다."},"collocations":["full-time employee","new employee","employee onboarding"],"related":["employer","employment","deploy","display"],"tip":"-er 은 하는 쪽(고용주), -ee 는 받는 쪽(직원)"},{"id":"d07-B06","day":7,"level":2,"set":"B","family":"F7","word":"exploit","pos":"verb","ipa":"/ɪkˈsplɔɪt/","meaning_ko":"(취약점을) 악용하다, 활용하다","category":"it","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"ploit","type":"root","gloss":"펼치다 (plic)"}],"story":"라틴어 explicitum(펼쳐진 것) → 고대 프랑스어 esploit(성취) → 이득을 끌어내다 → (약점을) 악용하다"},"example":{"q":"Have you dealt with security issues?","a":"We found that an outdated library could be exploited, so I patched it and added dependency scanning to our CI.","a_ko":"오래된 라이브러리가 악용될 수 있다는 걸 발견해서, 패치하고 CI에 의존성 검사를 추가했습니다."},"collocations":["exploit a vulnerability","be exploited","zero-day exploit"],"related":["explicit","deploy","display","apply"],"tip":"명사 exploit 은 '공격 코드'. 사람에게 쓰면 '착취하다'가 되니 조심"},{"id":"d07-B07","day":7,"level":1,"set":"B","family":"F7","word":"duplicate","pos":"verb","ipa":"/ˈduːplɪkeɪt/","meaning_ko":"중복되게 하다, 복제하다","category":"it","etymology":{"parts":[{"text":"du","type":"prefix","gloss":"둘 (duo)"},{"text":"plic","type":"root","gloss":"접다"},{"text":"ate","type":"suffix","gloss":"~하다"}],"story":"두 겹으로 접다(duplicare) → 두 배로 만들다 → 똑같이 하나 더 만들다, 중복하다"},"example":{"q":"How do you keep your code clean?","a":"I avoid duplicating logic by moving shared code into one module.","a_ko":"공통 코드를 하나의 모듈로 옮겨서 로직이 중복되지 않게 합니다."},"collocations":["duplicate code","duplicate records","duplicate effort"],"related":["deduplication","replica","multiple","complex"],"tip":"동사는 '두플리케이트', 형용사·명사는 '두플리컷'처럼 끝이 약해짐"},{"id":"d07-B08","day":7,"level":2,"set":"B","family":"F7","word":"deduplication","pos":"noun","ipa":"/diːˌduːplɪˈkeɪʃn/","meaning_ko":"중복 제거","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"없애다 (de)"},{"text":"du","type":"prefix","gloss":"둘 (duo)"},{"text":"plic","type":"root","gloss":"접다"},{"text":"ation","type":"suffix","gloss":"~하는 것"}],"story":"두 겹(duplicate)을 없앰 → 중복 제거"},"example":{"q":"How did you improve data quality?","a":"I added a deduplication step to the pipeline, which removed about five percent of duplicate customer records.","a_ko":"파이프라인에 중복 제거 단계를 넣어 중복된 고객 레코드를 약 5% 없앴습니다."},"collocations":["data deduplication","deduplication logic"],"related":["duplicate","replication","simplify"],"tip":"줄여서 dedup(디덥)이라고도 함"},{"id":"d07-B09","day":7,"level":2,"set":"B","family":"F7","word":"replica","pos":"noun","ipa":"/ˈreplɪkə/","meaning_ko":"복제본, 레플리카","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"plic","type":"root","gloss":"접다"},{"text":"a","type":"suffix","gloss":"(명사 어미)"}],"story":"라틴어 replicare(다시 접다·되풀이하다) → 이탈리아어 replica(되풀이) → 되풀이해 만든 것 → 복제본"},"example":{"q":"How did you scale reads on your database?","a":"We added two read replicas and routed reporting queries to them, which cut the load on the primary by half.","a_ko":"읽기 전용 복제본 두 개를 추가하고 리포트용 쿼리를 그쪽으로 보내서, 기본 DB 부하를 절반으로 줄였습니다."},"collocations":["read replica","replica set","exact replica"],"related":["replication","reply","duplicate","apply"],"tip":"DB 확장 질문에서 바로 쓰는 단어. 강세는 첫 음절 '레'"},{"id":"d07-B10","day":7,"level":2,"set":"B","family":"F7","word":"replication","pos":"noun","ipa":"/ˌreplɪˈkeɪʃn/","meaning_ko":"복제, 레플리케이션","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"plic","type":"root","gloss":"접다"},{"text":"ation","type":"suffix","gloss":"~하는 것"}],"story":"다시 접다(replicare) → 똑같이 되풀이함 → (데이터) 복제"},"example":{"q":"How do you protect data against failures?","a":"We use replication across availability zones, so losing one zone doesn't mean losing data.","a_ko":"가용 영역 간에 데이터를 복제해 두어서, 한 영역이 죽어도 데이터는 잃지 않습니다."},"collocations":["database replication","replication lag","asynchronous replication"],"related":["replica","reply","duplicate","multiple"],"tip":"replication lag(복제 지연)도 같이 외우기"},{"id":"d07-B11","day":7,"level":1,"set":"B","family":"F7","word":"connect","pos":"verb","ipa":"/kəˈnekt/","meaning_ko":"연결하다, 이어 주다","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"nect","type":"root","gloss":"묶다"}],"story":"함께 묶다(conectere) → 잇다 → 연결하다"},"example":{"q":"Why are you interested in our company?","a":"Your product connects small businesses with customers, and I care about that mission.","a_ko":"귀사의 제품은 소상공인과 고객을 이어 주는데, 저는 그 미션에 공감합니다."},"collocations":["connect with","connect A to B","stay connected"],"related":["connection","connectivity","disconnect","annex"],"tip":"사람과 '마음이 통하다'도 connect with"},{"id":"d07-B12","day":7,"level":1,"set":"B","family":"F7","word":"connection","pos":"noun","ipa":"/kəˈnekʃn/","meaning_ko":"연결, 커넥션","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"nect","type":"root","gloss":"묶다"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"함께 묶음 → 연결"},"example":{"q":"Tell me about a performance issue you fixed.","a":"I fixed slow responses by reusing database connections through a connection pool.","a_ko":"커넥션 풀로 데이터베이스 연결을 재사용해서 느린 응답을 해결했습니다."},"collocations":["connection pool","network connection","in connection with"],"related":["connect","connectivity","reliable"],"tip":"connection pool, connection timeout 처럼 IT 합성어가 많음"},{"id":"d07-B13","day":7,"level":1,"set":"B","family":"F7","word":"reliable","pos":"adjective","ipa":"/rɪˈlaɪəbl/","meaning_ko":"믿을 수 있는, 신뢰할 만한","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"단단히·다시"},{"text":"li","type":"root","gloss":"묶다 (lig)"},{"text":"able","type":"suffix","gloss":"~할 수 있는"}],"story":"단단히 묶다(religare → 고대 프랑스어 relier) → 기대다(rely) → 기댈 수 있는 → 믿을 만한"},"example":{"q":"What would your tea
