cs"],"related":["diagnose","agnostic","cognitive"],"tip":"복수형 diagnostics 는 ‘진단 정보·진단 기능’이라는 명사로도 씀"},{"id":"d01-D21","day":1,"level":2,"set":"D","family":"F1","word":"agnostic","pos":"adjective","ipa":"/æɡˈnɑːstɪk/","meaning_ko":"(특정 기술에) 종속되지 않는","category":"it","etymology":{"parts":[{"text":"a","type":"prefix","gloss":"아니다 (그리스어)"},{"text":"gnost","type":"root","gloss":"알다 (gno)"},{"text":"ic","type":"suffix","gloss":"~의"}],"story":"알 수 없다고 보는(agnōstos) → 불가지론의 → (IT) 어느 쪽인지 따지지 않는 → 특정 기술에 묶이지 않는"},"example":{"q":"Why did you choose that architecture?","a":"We designed the storage layer to be cloud-agnostic, so we could switch providers without rewriting the business logic.","a_ko":"스토리지 계층을 특정 클라우드에 종속되지 않게 설계해서, 비즈니스 로직을 다시 쓰지 않고도 제공업체를 바꿀 수 있었습니다."},"collocations":["cloud-agnostic","platform-agnostic","vendor-agnostic"],"related":["diagnose","diagnostic","ignore","recognize"],"tip":"1869년 헉슬리가 만든 철학 용어(불가지론자)가 IT 에서 ‘~에 무관한’으로 쓰이게 됨"},{"id":"d01-D22","day":1,"level":2,"set":"D","family":"F1","word":"narrative","pos":"noun","ipa":"/ˈnærətɪv/","meaning_ko":"이야기, 서사","category":"interview","etymology":{"parts":[{"text":"narr","type":"root","gloss":"알게 하다 (gnarus ‘알고 있는’)"},{"text":"ative","type":"suffix","gloss":"~하는 것"}],"story":"알고 있는(gnarus) → 알게 해 주다(narrare) → 이야기하다 → 이야기·서사"},"example":{"q":"How do you present technical results to executives?","a":"I turn the numbers into a simple narrative: what the problem was, what we changed, and how much it saved.","a_ko":"숫자를 단순한 이야기로 바꿉니다. 문제가 무엇이었고, 무엇을 바꿨고, 그래서 얼마나 아꼈는지를요."},"collocations":["a clear narrative","build a narrative","career narrative"],"related":["ignore","notion","recognize"],"tip":"자기소개를 하나의 흐름으로 엮은 것을 career narrative 라고 함"},{"id":"d01-D23","day":1,"level":1,"set":"D","family":"F1","word":"strength","pos":"noun","ipa":"/streŋθ/","meaning_ko":"강점, 힘","category":"interview","etymology":{"parts":[{"text":"streng","type":"part","gloss":"강한 (strong)"},{"text":"th","type":"suffix","gloss":"~함 (명사)"}],"story":"강한(strong) + -th → 강함 → 힘 → 사람의 강점"},"example":{"q":"What is your greatest strength?","a":"My greatest strength is turning complex problems into small, clear steps.","a_ko":"제 가장 큰 강점은 복잡한 문제를 작고 명확한 단계로 바꾸는 것입니다."},"collocations":["greatest strength","strengths and weaknesses","play to my strengths"],"related":["strong","strengthen","weakness"],"tip":"strong → strength 처럼 long → length, wide → width 도 같은 패턴"},{"id":"d01-D24","day":1,"level":1,"set":"D","family":"F1","word":"weakness","pos":"noun","ipa":"/ˈwiːknəs/","meaning_ko":"약점","category":"interview","etymology":{"parts":[{"text":"weak","type":"part","gloss":"약한 (고대 노르드어 veikr)"},{"text":"ness","type":"suffix","gloss":"~함 (명사)"}],"story":"약함 → 약점"},"example":{"q":"What is your biggest weakness?","a":"My biggest weakness is public speaking, so I joined a speaking club.","a_ko":"가장 큰 약점은 사람들 앞에서 말하는 것이라, 스피치 모임에 들어갔습니다."},"collocations":["biggest weakness","work on a weakness","strengths and weaknesses"],"related":["weak","weaken","strength"],"tip":"약점 + 개선 노력(so I ~)을 한 세트로 말하는 것이 정석"},{"id":"d01-D25","day":1,"level":1,"set":"D","family":"F1","word":"hard-working","pos":"adjective","ipa":"/ˌhɑːrdˈwɜːrkɪŋ/","meaning_ko":"근면한, 열심히 일하는","category":"interview","etymology":{"parts":[{"text":"hard-","type":"part","gloss":"열심히"},{"text":"working","type":"part","gloss":"일하는"}],"story":"열심히(hard) 일하는(working) → 근면한"},"example":{"q":"What would your teammates say about you?","a":"They'd say I'm hard-working and always finish what I start.","a_ko":"제가 근면하고 시작한 일은 꼭 끝낸다고 말할 겁니다."},"collocations":["hard-working and reliable","a hard-working team"],"related":["hard work","workload","teamwork"],"tip":"너무 흔한 표현이라 근거(always finish what I start)를 꼭 붙이기"},{"id":"d02-A01","day":2,"level":1,"set":"A","family":"F2","word":"produce","pos":"verb","ipa":"/prəˈduːs/","meaning_ko":"만들어 내다, 생산하다","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"duc","type":"root","gloss":"이끌다"},{"text":"e","type":"suffix","gloss":"(동사 어미)"}],"story":"앞으로 이끌어 내다 → 만들어 내다 → 생산하다, (결과를) 내다"},"example":{"q":"What kind of results have you produced in your current role?","a":"I produced a monitoring dashboard that the whole team now uses daily.","a_ko":"지금은 팀 전체가 매일 쓰는 모니터링 대시보드를 만들었습니다."},"collocations":["produce results","produce a report","produce high-quality code"],"related":["product","productivity","reproduce","introduce","reduce"],"tip":"명사 produce(농산물)는 PRO·duce로 앞에 강세 — 동사는 pro·DUCE로 뒤에 강세"},{"id":"d02-A02","day":2,"level":1,"set":"A","family":"F2","word":"product","pos":"noun","ipa":"/ˈprɑːdʌkt/","meaning_ko":"제품, 결과물","category":"it","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"duct","type":"root","gloss":"이끌다 (duc)"}],"story":"앞으로 이끌어 낸 것 → 만들어진 것 → 제품"},"example":{"q":"Which product did you work on most recently?","a":"I worked on our main SaaS product, focusing on the billing features.","a_ko":"주력 SaaS 제품에서 결제 기능을 중심으로 개발했습니다."},"collocations":["product manager","product roadmap","launch a product"],"related":["produce","productivity","conduct","introduction"],"tip":"'product mindset'(사용자 가치를 먼저 생각하는 태도)은 IT 면접에서 자주 나오는 표현"},{"id":"d02-A03","day":2,"level":2,"set":"A","family":"F2","word":"productivity","pos":"noun","ipa":"/ˌproʊdʌkˈtɪvəti/","meaning_ko":"생산성","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"duct","type":"root","gloss":"이끌다 (duc)"},{"text":"iv","type":"suffix","gloss":"~하는 (ive)"},{"text":"ity","type":"suffix","gloss":"~성질"}],"story":"앞으로 이끌어 내는 성질 → 만들어 내는 능력 → 생산성"},"example":{"q":"How have you improved your team's productivity?","a":"I automated our release checklist, which boosted the team's productivity and freed up about five hours a week.","a_ko":"릴리스 체크리스트를 자동화해서 팀 생산성을 높였고, 주당 약 5시간을 아낄 수 있었습니다."},"collocations":["boost productivity","developer productivity","productivity tools"],"related":["produce","product","conduct","reproducible"],"tip":"강세는 -TIV- 에: pro·duc·TIV·i·ty"},{"id":"d02-A04","day":2,"level":1,"set":"A","family":"F2","word":"reproduce","pos":"verb","ipa":"/ˌriːprəˈduːs/","meaning_ko":"(버그·현상을) 재현하다","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"duc","type":"root","gloss":"이끌다"},{"text":"e","type":"suffix","gloss":"(동사 어미)"}],"story":"다시 앞으로 이끌어 내다 → 다시 만들어 내다 → (버그를) 재현하다"},"example":{"q":"What is your first step when you get a bug report?","a":"First, I try to reproduce the bug on my local machine.","a_ko":"먼저 제 로컬 환경에서 버그를 재현해 봅니다."},"collocations":["reproduce a bug","reproduce the issue","steps to reproduce"],"related":["produce","reproducible","introduce","deduce"],"tip":"버그 리포트의 'Steps to reproduce'(재현 절차) 항목으로 익숙한 단어"},{"id":"d02-A05","day":2,"level":2,"set":"A","family":"F2","word":"reproducible","pos":"adjective","ipa":"/ˌriːprəˈduːsəbl/","meaning_ko":"재현 가능한","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"duc","type":"root","gloss":"이끌다"},{"text":"ible","type":"suffix","gloss":"~할 수 있는"}],"story":"다시 만들어 낼 수 있는 → 언제 해도 같은 결과가 나오는 → 재현 가능한"},"example":{"q":"How do you make sure your builds are reliable?","a":"I pin all dependency versions and use Docker, so our builds are reproducible on any machine.","a_ko":"의존성 버전을 모두 고정하고 Docker를 써서, 어느 머신에서든 빌드가 똑같이 재현되게 합니다."},"collocations":["reproducible builds","reproducible results","easily reproducible"],"related":["reproduce","produce","productivity","conduct"],"tip":"데이터·ML 직무에서는 'reproducible experiments'(재현 가능한 실험)로도 자주 씀"},{"id":"d02-A06","day":2,"level":1,"set":"A","family":"F2","word":"introduce","pos":"verb","ipa":"/ˌɪntrəˈduːs/","meaning_ko":"도입하다, 소개하다","category":"interview","etymology":{"parts":[{"text":"intro","type":"prefix","gloss":"안으로"},{"text":"duc","type":"root","gloss":"이끌다"},{"text":"e","type":"suffix","gloss":"(동사 어미)"}],"story":"안으로 이끌어 들이다 → (새로운 것을) 들여오다, (사람을) 소개하다"},"example":{"q":"What change did you bring to your previous team?","a":"I introduced code reviews, and our bug count dropped noticeably.","a_ko":"코드 리뷰를 도입했고, 그 뒤로 버그 수가 눈에 띄게 줄었습니다."},"collocations":["introduce a new process","introduce yourself","introduce a feature"],"related":["introduction","produce","educate","conduct"],"tip":"자기소개뿐 아니라 '새 제도·도구를 도입했다'고 성과를 말할 때 핵심 동사"},{"id":"d02-A07","day":2,"level":1,"set":"A","family":"F2","word":"introduction","pos":"noun","ipa":"/ˌɪntrəˈdʌkʃn/","meaning_ko":"소개, 도입","category":"interview","etymology":{"parts":[{"text":"intro","type":"prefix","gloss":"안으로"},{"text":"duct","type":"root","gloss":"이끌다 (duc)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"안으로 이끌어 들이는 것 → 처음 소개함, 새로 들여옴"},"example":{"q":"Could you start with a brief introduction?","a":"Sure. As a brief introduction, I'm a backend engineer with five years of experience.","a_ko":"네. 간단히 소개드리면, 저는 5년 차 백엔드 엔지니어입니다."},"collocations":["a brief introduction","the introduction of a new tool","make an introduction"],"related":["introduce","product","education","conduct"],"tip":"'self-introduction'보다 'a brief introduction'이 영어로 자연스러움"},{"id":"d02-A08","day":2,"level":1,"set":"A","family":"F2","word":"education","pos":"noun","ipa":"/ˌedʒuˈkeɪʃn/","meaning_ko":"학력, 교육","category":"interview","etymology":{"parts":[{"text":"e","type":"prefix","gloss":"밖으로 (ex)"},{"text":"duc","type":"root","gloss":"이끌다"},{"text":"ation","type":"suffix","gloss":"~하는 것"}],"story":"(능력을) 밖으로 이끌어 내다 → 길러 내다 → 교육, 학력"},"example":{"q":"Can you tell me about your education?","a":"My education is in computer science, and I've added cloud certifications since then.","a_ko":"전공은 컴퓨터공학이고, 그 뒤로 클라우드 자격증을 추가로 취득했습니다."},"collocations":["educational background","formal education","continuing education"],"related":["educate","introduce","produce","conduct"],"tip":"이력서 'Education' 항목 — 학력을 물으면 이 단어로 답을 시작하면 자연스러움"},{"id":"d02-A09","day":2,"level":2,"set":"A","family":"F2","word":"educate","pos":"verb","ipa":"/ˈedʒukeɪt/","meaning_ko":"알려 주다, 교육하다","category":"interview","etymology":{"parts":[{"text":"e","type":"prefix","gloss":"밖으로 (ex)"},{"text":"duc","type":"root","gloss":"이끌다"},{"text":"ate","type":"suffix","gloss":"~하게 하다"}],"story":"밖으로 이끌어 내다 → 길러 내다 → 가르치다, 이해시키다"},"example":{"q":"How do you work with non-technical stakeholders?","a":"I try to educate them on the trade-offs with simple diagrams, so they can make informed decisions.","a_ko":"간단한 그림으로 트레이드오프를 설명해서, 그분들이 충분히 이해한 상태에서 결정할 수 있게 합니다."},"collocations":["educate users","educate the team on","well-educated"],"related":["education","introduce","deduce","conduct"],"tip":"'educate A on B'(A에게 B를 알려 주다) — 가르친다기보다 '이해시킨다'는 느낌"},{"id":"d02-A10","day":2,"level":2,"set":"A","family":"F2","word":"conduct","pos":"verb","ipa":"/kənˈdʌkt/","meaning_ko":"실시하다, 진행하다","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"duct","type":"root","gloss":"이끌다 (duc)"}],"story":"함께 이끌다 → (일을) 이끌어 진행하다 → 실시하다"},"example":{"q":"How do you understand what users need?","a":"I conducted user interviews with five customers before we wrote any code, which saved us from building the wrong feature.","a_ko":"코드를 쓰기 전에 고객 다섯 명과 사용자 인터뷰를 진행해서, 엉뚱한 기능을 만드는 일을 막았습니다."},"collocations":["conduct research","conduct an interview","code of conduct"],"related":["introduce","produce","deduce","conducive"],"tip":"동사는 con·DUCT(뒤 강세), 명사 '행동·품행'은 CON·duct(앞 강세)"},{"id":"d02-A11","day":2,"level":2,"set":"A","family":"F2","word":"deduce","pos":"verb","ipa":"/dɪˈduːs/","meaning_ko":"추론하다, 알아내다","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"~에서 아래로"},{"text":"duc","type":"root","gloss":"이끌다"},{"text":"e","type":"suffix","gloss":"(동사 어미)"}],"story":"(근거에서) 이끌어 내리다 → 결론을 끌어내다 → 추론하다"},"example":{"q":"Tell me about a hard bug you tracked down.","a":"From the timestamps in the logs, I deduced that two jobs were writing to the same table at once.","a_ko":"로그의 타임스탬프를 보고, 두 작업이 동시에 같은 테이블에 쓰고 있다는 걸 알아냈습니다."},"collocations":["deduce from","deduce that","easily deduced"],"related":["reduce","conduct","introduce","produce"],"tip":"deduct(공제하다, 빼다)와 혼동 주의 — deduce는 '추론하다'"},{"id":"d02-A12","day":2,"level":2,"set":"A","family":"F2","word":"motivate","pos":"verb","ipa":"/ˈmoʊtɪveɪt/","meaning_ko":"동기를 부여하다, 의욕을 북돋우다","category":"interview","etymology":{"parts":[{"text":"mot","type":"root","gloss":"움직이다 (mov)"},{"text":"iv","type":"suffix","gloss":"~하는 (ive)"},{"text":"ate","type":"suffix","gloss":"~하게 하다"}],"story":"움직이게 하는 것(motive)을 주다 → 마음을 움직이다 → 동기를 부여하다"},"example":{"q":"How do you keep your team motivated?","a":"I motivate junior developers by giving them ownership of small features and celebrating their wins.","a_ko":"주니어 개발자에게 작은 기능의 오너십을 맡기고 성과를 함께 축하하면서 동기를 부여합니다."},"collocations":["motivate the team","highly motivated","be motivated by"],"related":["motivation","momentum","promote","remote","emotion"],"tip":"'What motivates you?'는 단골 질문 — 'I'm motivated by…'로 답하기"},{"id":"d02-A13","day":2,"level":3,"set":"A","family":"F2","word":"momentum","pos":"noun","ipa":"/moʊˈmentəm/","meaning_ko":"추진력, 기세","category":"interview","etymology":{"parts":[{"text":"mo","type":"root","gloss":"움직이다 (mov)"},{"text":"mentum","type":"suffix","gloss":"~하는 것"}],"story":"라틴어 movimentum(움직임)이 줄어든 말 → 움직이는 힘 → 기세, 추진력"},"example":{"q":"How did you handle the project after the team lead left?","a":"I set up short weekly goals to keep the momentum going, and we still shipped the migration on schedule.","a_ko":"짧은 주간 목표를 세워 기세가 꺾이지 않게 했고, 덕분에 마이그레이션을 일정대로 마칠 수 있었습니다."},"collocations":["keep the momentum going","gain momentum","lose momentum"],"related":["moment","motivate","motion","remove","mobile"],"tip":"물리의 '운동량'에서 온 말 — 프로젝트가 '탄력을 받았다/잃었다'고 할 때 씀"},{"id":"d02-A14","day":2,"level":1,"set":"A","family":"F2","word":"remote","pos":"adjective","ipa":"/rɪˈmoʊt/","meaning_ko":"원격의, 멀리 떨어진","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤로·멀리"},{"text":"mot","type":"root","gloss":"움직이다 (mov)"},{"text":"e","type":"suffix","gloss":"(형용사 어미)"}],"story":"멀리 옮겨진(removere의 과거분사 remotus) → 멀리 떨어진 → 원격의"},"example":{"q":"Do you have experience working remotely?","a":"Yes, I've worked on a fully remote team across three time zones.","a_ko":"네, 세 개의 시간대에 걸친 완전 원격 팀에서 일해 봤습니다."},"collocations":["remote work","fully remote","remote team"],"related":["remove","promote","motion","momentum"],"tip":"IT에서는 git의 'remote repository'(원격 저장소)로도 자주 씀"},{"id":"d02-A15","day":2,"level":1,"set":"A","family":"F2","word":"remove","pos":"verb","ipa":"/rɪˈmuːv/","meaning_ko":"제거하다, 없애다","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤로·떨어져"},{"text":"mov","type":"root","gloss":"움직이다"},{"text":"e","type":"suffix","gloss":"(동사 어미)"}],"story":"떨어진 곳으로 옮기다 → 치우다 → 제거하다"},"example":{"q":"How did you improve the performance of the app?","a":"I removed unused dependencies, which cut our bundle size by almost half.","a_ko":"쓰지 않는 의존성을 제거해서 번들 크기를 거의 절반으로 줄였습니다."},"collocations":["remove a dependency","remove duplicates","remove dead code"],"related":["remote","motion","mobile","promote"],"tip":"delete(삭제)보다 넓은 뜻 — 장애물·중복·병목을 '없앴다'고 할 때도 씀"},{"id":"d02-A16","day":2,"level":1,"set":"A","family":"F2","word":"mobile","pos":"adjective","ipa":"/ˈmoʊbl/","meaning_ko":"모바일의, 이동하는","category":"it","etymology":{"parts":[{"text":"mob","type":"root","gloss":"움직이다 (mov)"},{"text":"ile","type":"suffix","gloss":"~할 수 있는"}],"story":"라틴어 mobilis(움직일 수 있는, *movibilis가 줄어든 말) → 이동 가능한 → 모바일의"},"example":{"q":"What platforms have you developed for?","a":"I've built both web and mobile apps, mostly with React Native.","a_ko":"웹 앱과 모바일 앱을 모두 만들어 봤고, 주로 React Native를 썼습니다."},"collocations":["mobile app","mobile-first","mobile device"],"related":["mobilize","remove","motion","momentum"],"tip":"미국식은 /ˈmoʊbl/(모블), 영국식은 /ˈməʊbaɪl/(모바일)"},{"id":"d02-A17","day":2,"level":3,"set":"A","family":"F2","word":"mobilize","pos":"verb","ipa":"/ˈmoʊbəlaɪz/","meaning_ko":"(사람·자원을) 동원하다","category":"interview","etymology":{"parts":[{"text":"mob","type":"root","gloss":"움직이다 (mov)"},{"text":"il","type":"suffix","gloss":"~할 수 있는 (ile)"},{"text":"ize","type":"suffix","gloss":"~하게 하다"}],"story":"움직일 수 있게 하다 → 사람·자원을 움직여 모으다 → 동원하다"},"example":{"q":"Tell me about a time you led under pressure.","a":"When a critical outage hit on a Friday night, I mobilized engineers from three teams and we restored service within an hour.","a_ko":"금요일 밤에 치명적인 장애가 났을 때 세 팀의 엔지니어를 모았고, 한 시간 안에 서비스를 복구했습니다."},"collocations":["mobilize resources","mobilize the team","quickly mobilize"],"related":["mobile","motivate","momentum","promote"],"tip":"gathered(모았다)보다 강하게, 급한 상황에서 사람·자원을 '움직였다'는 리더십 표현"},{"id":"d02-A18","day":2,"level":1,"set":"A","family":"F2","word":"motion","pos":"noun","ipa":"/ˈmoʊʃn/","meaning_ko":"움직임, (일의) 진행","category":"interview","etymology":{"parts":[{"text":"mot","type":"root","gloss":"움직이다 (mov)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"움직이는 것 → 움직임, 동작 → (일이) 굴러가기 시작함"},"example":{"q":"What did you do in your first month as team lead?","a":"I set a new planning process in motion during my first month.","a_ko":"첫 달에 새로운 계획 수립 프로세스를 시작했습니다."},"collocations":["set in motion","in motion","go through the motions"],"related":["emotion","promotion","motivate","remove"],"tip":"'set something in motion'(~을 시작시키다, 굴러가게 하다)을 통째로 외우기"},{"id":"d02-A19","day":2,"level":2,"set":"A","family":"F2","word":"migrate","pos":"verb","ipa":"/ˈmaɪɡreɪt/","meaning_ko":"이전하다, 마이그레이션하다","category":"it","etymology":{"parts":[{"text":"migr","type":"root","gloss":"옮겨 가다"},{"text":"ate","type":"suffix","gloss":"~하다"}],"story":"라틴어 migrare(사는 곳을 옮기다) → (시스템·데이터를) 다른 곳으로 옮기다"},"example":{"q":"Have you worked with cloud platforms?","a":"Yes, I helped migrate our on-premise servers to AWS, which cut our hosting costs by about thirty percent.","a_ko":"네, 온프레미스 서버를 AWS로 옮기는 일을 맡아 호스팅 비용을 약 30% 줄였습니다."},"collocations":["migrate to the cloud","migrate data","migrate from A to B"],"related":["migration","immigrant","emigrate"],"tip":"move보다 IT스러운 단어 — 시스템·DB·플랫폼 '이전'은 migrate"},{"id":"d02-A20","day":2,"level":2,"set":"A","family":"F2","word":"migration","pos":"noun","ipa":"/maɪˈɡreɪʃn/","meaning_ko":"마이그레이션, 이전","category":"it","etymology":{"parts":[{"text":"migr","type":"root","gloss":"옮겨 가다"},{"text":"ation","type":"suffix","gloss":"~하는 것"}],"story":"사는 곳을 옮기는 것 → (데이터·시스템의) 이전"},"example":{"q":"What was the riskiest project you've worked on?","a":"The riskiest was a zero-downtime database migration, so we ran the old and new databases in parallel for two weeks.","a_ko":"가장 위험했던 건 무중단 데이터베이스 마이그레이션이었고, 그래서 2주 동안 기존 DB와 새 DB를 병행 운영했습니다."},"collocations":["data migration","schema migration","cloud migration"],"related":["migrate","immigrant","emigrate"],"tip":"Rails·Django의 'migration'(스키마 변경 파일)도 같은 단어"},{"id":"d02-A21","day":2,"level":2,"set":"A","family":"F2","word":"proactive","pos":"adjective","ipa":"/proʊˈæktɪv/","meaning_ko":"주도적인, 선제적인","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞서·미리"},{"text":"act","type":"root","gloss":"하다·몰다 (ag)"},{"text":"ive","type":"suffix","gloss":"~하는"}],"story":"미리 앞서 행동하는 → 일이 터지기 전에 움직이는 → 주도적인"},"example":{"q":"What is one of your strengths?","a":"I'm proactive about risks; I flag problems early instead of waiting until they become blockers.","a_ko":"위험에 주도적으로 대응합니다. 문제가 걸림돌이 되기 전에 먼저 알립니다."},"collocations":["proactive approach","be proactive about","proactive monitoring"],"related":["agile","agent","transaction","agenda"],"tip":"반대말 reactive(사후 대응하는) — 'proactive rather than reactive'로 짝지어 말하면 좋음"},{"id":"d02-A22","day":2,"level":2,"set":"A","family":"F2","word":"agile","pos":"adjective","ipa":"/ˈædʒəl/","meaning_ko":"애자일의, 민첩한","category":"it","etymology":{"parts":[{"text":"ag","type":"root","gloss":"몰다·움직이다"},{"text":"ile","type":"suffix","gloss":"~할 수 있는"}],"story":"라틴어 agilis(잘 움직이는, agere 몰다) → 민첩한 → 애자일 개발 방식"},"example":{"q":"What development methodology does your team use?","a":"We follow an agile process with two-week sprints, so we can adjust priorities based on user feedback.","a_ko":"2주 스프린트로 애자일 방식으로 일해서, 사용자 피드백에 맞춰 우선순위를 조정할 수 있습니다."},"collocations":["agile methodology","agile team","stay agile"],"related":["agent","agenda","proactive","transaction"],"tip":"방법론 이름일 때는 대문자 Agile로도 씀. 미국식 발음 /ˈædʒəl/(애절)"},{"id":"d02-A23","day":2,"level":1,"set":"A","family":"F2","word":"carry out","pos":"phrasal verb","ipa":"/ˌkæri ˈaʊt/","meaning_ko":"수행하다, 실행하다","category":"interview","etymology":{"parts":[{"text":"carry","type":"part","gloss":"나르다"},{"text":" out","type":"part","gloss":"밖으로·끝까지"}],"story":"끝까지 날라 가다 → 계획·지시를 끝까지 해내다 → 수행하다"},"example":{"q":"How do you handle a plan you disagree with?","a":"I share my concerns first, but once we decide, I carry out the plan fully.","a_ko":"먼저 우려를 말씀드리지만, 일단 결정되면 그 계획을 끝까지 충실히 실행합니다."},"collocations":["carry out a plan","carry out tests","carry out research"],"related":["follow up","set up","take on","wrap up"],"tip":"conduct·execute보다 일상적이고 무난한 '실행하다'"},{"id":"d02-A24","day":2,"level":1,"set":"A","family":"F2","word":"set up","pos":"phrasal verb","ipa":"/ˌset ˈʌp/","meaning_ko":"구축하다, 설정하다","category":"it","etymology":{"parts":[{"text":"set","type":"part","gloss":"놓다·세우다"},{"text":" up","type":"part","gloss":"위로·완전히"}],"story":"세워 올려놓다 → (환경·시스템을) 갖춰 놓다 → 구축하다"},"example":{"q":"What did you do to improve your team's workflow?","a":"I set up a CI pipeline that runs all tests on every pull request.","a_ko":"풀 리퀘스트마다 모든 테스트가 돌아가는 CI 파이프라인을 구축했습니다."},"collocations":["set up a pipeline","set up an environment","set up a meeting"],"related":["spin up","roll out","carry out","kick off"],"tip":"동사는 띄어서 set up, 명사 '설정·구성'은 setup 한 단어"},{"id":"d02-A25","day":2,"level":1,"set":"A","family":"F2","word":"kick off","pos":"phrasal verb","ipa":"/ˌkɪk ˈɔːf/","meaning_ko":"시작하다, 착수하다","category":"interview","etymology":{"parts":[{"text":"kick","type":"part","gloss":"차다"},{"text":" off","type":"part","gloss":"떨어져·출발"}],"story":"축구의 킥오프(공을 차서 경기 시작) → 프로젝트·회의를 시작하다"},"example":{"q":"How do you start a new project with a new team?","a":"I kick off every project with a short meeting to align on goals and roles.","a_ko":"모든 프로젝트를 목표와 역할을 맞추는 짧은 회의로 시작합니다."},"collocations":["kick off a project","kickoff meeting","kick off the sprint"],"related":["wrap up","set up","carry out","roll out"],"tip":"명사형 kickoff(착수 회의) — 끝낼 때는 wrap up과 짝"},{"id":"d02-B01","day":2,"level":1,"set":"B","family":"F2","word":"motivation","pos":"noun","ipa":"/ˌmoʊtɪˈveɪʃn/","meaning_ko":"동기, 의욕","category":"interview","etymology":{"parts":[{"text":"mot","type":"root","gloss":"움직이다 (mov)"},{"text":"iv","type":"suffix","gloss":"~하는 (ive)"},{"text":"ation","type":"suffix","gloss":"~하는 것"}],"story":"마음을 움직이게 하는 것 → 행동하게 만드는 이유 → 동기, 의욕"},"example":{"q":"What is your motivation for applying to this company?","a":"My main motivation is to build products that millions of people use.","a_ko":"가장 큰 지원 동기는 수백만 명이 쓰는 제품을 만들고 싶다는 것입니다."},"collocations":["motivation for","intrinsic motivation","lack of motivation"],"related":["motivate","emotion","promotion","momentum"],"tip":"지원 동기 질문에 'My motivation is…'로 시작하면 깔끔함"},{"id":"d02-B02","day":2,"level":1,"set":"B","family":"F2","word":"moment","pos":"noun","ipa":"/ˈmoʊmənt/","meaning_ko":"순간, 때","category":"interview","etymology":{"parts":[{"text":"mo","type":"root","gloss":"움직이다 (mov)"},{"text":"ment","type":"suffix","gloss":"~하는 것"}],"story":"라틴어 momentum(움직임) → 아주 작은 움직임만큼의 시간 → 순간"},"example":{"q":"What is a moment you're proud of in your career?","a":"My proudest moment was when our app reached one million users.","a_ko":"가장 자랑스러웠던 순간은 저희 앱 사용자가 100만 명을 넘었을 때입니다."},"collocations":["at the moment","a proud moment","the right moment"],"related":["momentum","motion","emotion","motivate"],"tip":"'At the moment, I'm…'(현재 저는…)으로 지금 상황을 말할 때도 편리"},{"id":"d02-B03","day":2,"level":1,"set":"B","family":"F2","word":"emotion","pos":"noun","ipa":"/ɪˈmoʊʃn/","meaning_ko":"감정","category":"interview","etymology":{"parts":[{"text":"e","type":"prefix","gloss":"밖으로 (ex)"},{"text":"mot","type":"root","gloss":"움직이다 (mov)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"밖으로 움직여 냄(프랑스어 émouvoir, 뒤흔들다) → 마음이 흔들림 → 감정"},"example":{"q":"How do you handle conflict with a coworker?","a":"I keep emotions out of it and focus on the facts and our shared goal.","a_ko":"감정은 빼고 사실과 공동의 목표에 집중합니다."},"collocations":["control emotions","emotional intelligence","mixed emotions"],"related":["motion","motivation","promote","remote"],"tip":"형용사 emotional — 'emotional intelligence'(감성 지능)는 리더십 질문에 자주 등장"},{"id":"d02-B04","day":2,"level":1,"set":"B","family":"F2","word":"promote","pos":"verb","ipa":"/prəˈmoʊt/","meaning_ko":"승진시키다, 장려하다","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"mot","type":"root","gloss":"움직이다 (mov)"},{"text":"e","type":"suffix","gloss":"(동사 어미)"}],"story":"앞으로 움직이게 하다 → 앞자리로 올리다 → 승진시키다, 장려하다"},"example":{"q":"How did your role grow at your last company?","a":"I was promoted to senior engineer after two years.","a_ko":"2년 만에 시니어 엔지니어로 승진했습니다."},"collocations":["be promoted to","promote collaboration","promote a culture of"],"related":["promotion","motivate","remote","emotion"],"tip":"'promote a culture of testing'처럼 '문화를 장려했다'는 리더십 표현으로도 씀"},{"id":"d02-B05","day":2,"level":1,"set":"B","family":"F2","word":"promotion","pos":"noun","ipa":"/prəˈmoʊʃn/","meaning_ko":"승진, 홍보","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"mot","type":"root","gloss":"움직이다 (mov)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"앞으로 움직임 → 윗자리로 올라감 → 승진 (앞에 내세움 → 홍보)"},"example":{"q":"Why are you leaving your current job?","a":"Even after my recent promotion, I want to work on larger-scale systems.","a_ko":"최근에 승진은 했지만, 더 큰 규모의 시스템을 다뤄 보고 싶습니다."},"collocations":["get a promotion","promotion to manager","up for promotion"],"related":["promote","motion","emotion","motivation"],"tip":"마케팅의 '판촉·프로모션'도 같은 단어 — 맥락으로 구분"},{"id":"d02-B06","day":2,"level":1,"set":"B","family":"F2","word":"prevent","pos":"verb","ipa":"/prɪˈvent/","meaning_ko":"막다, 방지하다","category":"it","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"앞에·미리"},{"text":"vent","type":"root","gloss":"오다 (ven)"}],"story":"앞질러 오다(praevenire) → 먼저 와서 길을 막다 → 방지하다"},"example":{"q":"What did you learn from that outage?","a":"I added alerts and tests to prevent the same failure from happening again.","a_ko":"같은 장애가 다시 일어나지 않도록 알림과 테스트를 추가했습니다."},"collocations":["prevent A from -ing","prevent outages","prevent data loss"],"related":["preventive","inventory","event","intervene"],"tip":"'prevent A from -ing'(A가 ~하지 못하게 막다) 구조로 쓰기"},{"id":"d02-B07","day":2,"level":2,"set":"B","family":"F2","word":"preventive","pos":"adjective","ipa":"/prɪˈventɪv/","meaning_ko":"예방의, 사전 대비의","category":"it","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"앞에·미리"},{"text":"vent","type":"root","gloss":"오다 (ven)"},{"text":"ive","type":"suffix","gloss":"~하는"}],"story":"미리 와서 막는 → 문제가 생기기 전에 하는 → 예방의"},"example":{"q":"How do you keep systems healthy in the long run?","a":"I schedule preventive maintenance, like patching and log cleanup, so small issues don't turn into outages.","a_ko":"패치와 로그 정리 같은 예방 정비를 정기적으로 잡아서, 작은 문제가 장애로 커지지 않게 합니다."},"collocations":["preventive maintenance","preventive measures","preventive action"],"related":["prevent","advent","inventory","circumvent"],"tip":"preventative도 같은 뜻이지만 preventive가 더 짧고 흔함"},{"id":"d02-B08","day":2,"level":1,"set":"B","family":"F2","word":"invent","pos":"verb","ipa":"/ɪnˈvent/","meaning_ko":"고안하다, 발명하다","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"~에·위에"},{"text":"vent","type":"root","gloss":"오다 (ven)"}],"story":"~에 와서 닿다(invenire, 우연히 만나다) → 찾아내다 → 고안하다, 발명하다"},"example":{"q":"Have you ever created a tool that others adopted?","a":"Yes, I invented a simple tool for generating test data, and three other teams adopted it.","a_ko":"네, 테스트 데이터를 만드는 간단한 도구를 고안했는데, 다른 세 팀도 도입했습니다."},"collocations":["invent a new method","invent a tool","invent from scratch"],"related":["reinvent","inventory","prevent","event"],"tip":"invent(없던 것을 만들어 냄) vs discover(있던 것을 찾아냄)"},{"id":"d02-B09","day":2,"level":2,"set":"B","family":"F2","word":"reinvent","pos":"verb","ipa":"/ˌriːɪnˈvent/","meaning_ko":"(있는 것을) 다시 만들다, 쇄신하다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"in","type":"prefix","gloss":"~에·위에"},{"text":"vent","type":"root","gloss":"오다 (ven)"}],"story":"다시 고안하다 → 이미 있는 것을 새로 만들다 / 완전히 새롭게 바꾸다"},"example":{"q":"How do you decide between building and buying a solution?","a":"I check for proven open-source tools first, because I don't want to reinvent the wheel.","a_ko":"먼저 검증된 오픈소스 도구가 있는지 확인합니다. 이미 있는 것을 굳이 새로 만들고 싶지 않기 때문입니다."},"collocations":["reinvent the wheel","reinvent yourself","reinvent the process"],"related":["invent","inventory","prevent","advent"],"tip":"'don't reinvent the wheel'(바퀴를 다시 발명하지 마라 = 있는 걸 쓰자)이 단골 관용구"},{"id":"d02-B10","day":2,"level":2,"set":"B","family":"F2","word":"inventory","pos":"noun","ipa":"/ˈɪnvəntɔːri/","meaning_ko":"목록, 재고","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"~에·위에"},{"text":"vent","type":"root","gloss":"오다·찾아내다 (ven)"},{"text":"ory","type":"suffix","gloss":"~에 관한 것"}],"story":"찾아낸 것(inventum)들의 목록 → 재산 목록 → 재고, 자산 목록"},"example":{"q":"How did you start the security audit?","a":"I first built an inventory of all our services and their dependencies, so we knew exactly what to check.","a_ko":"먼저 모든 서비스와 의존성 목록을 만들어서, 무엇을 점검해야 하는지 정확히 파악했습니다."},"collocations":["asset inventory","inventory management","take inventory"],"related":["invent","reinvent","prevent","venture"],"tip":"강세는 맨 앞 IN·ven·to·ry. 쇼핑몰 도메인에서는 '재고'"},{"id":"d02-B11","day":2,"level":1,"set":"B","family":"F2","word":"convenient","pos":"adjective","ipa":"/kənˈviːniənt/","meaning_ko":"편리한, (시간이) 괜찮은","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"ven","type":"root","gloss":"오다"},{"text":"ient","type":"suffix","gloss":"~하는"}],"story":"함께 오다(convenire) → 잘 맞아떨어지다 → 형편에 맞는, 편리한"},"example":{"q":"When would you be free for the next interview?","a":"Any time next week is convenient for me, so please choose what works best.","a_ko":"다음 주는 언제든 괜찮으니, 편하신 시간으로 정해 주세요."},"collocations":["convenient for","a convenient time","more convenient"],"related":["convenience","revenue","avenue","convention"],"tip":"사람을 주어로 쓰지 않음 — 'I am convenient'(X), 'It is convenient for me'(O)"},{"id":"d02-B12","day":2,"level":1,"set":"B","family":"F2","word":"convenience","pos":"noun","ipa":"/kənˈviːniəns/","meaning_ko":"편의, 편한 때","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"ven","type":"root","gloss":"오다"},{"text":"ience","type":"suffix","gloss":"~함"}],"story":"함께 와서 잘 맞음 → 형편에 맞음 → 편의, 편한 때"},"example":{"q":"Do you have any questions before we finish?","a":"Just one: could you send me the next steps at your convenience?","a_ko":"하나만 여쭙겠습니다. 편하실 때 다음 절차를 보내 주실 수 있을까요?"},"collocations":["at your convenience","at your earliest convenience","for convenience"],"related":["convenient","venue","avenue","advent"],"tip":"'at your (earliest) convenience'는 정중하게 부탁하는 면접 마무리·메일 표현"},{"id":"d02-B13","day":2,"level":2,"set":"B","family":"F2","word":"revenue","pos":"noun","ipa":"/ˈrevənuː/","meaning_ko":"매출, 수익","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"되돌아"},{"text":"ven","type":"root","gloss":"오다"},{"text":"ue","type":"suffix","gloss":"~것"}],"story":"되돌아오는 것(프랑스어 revenir) → 투자해서 돌아오는 돈 → 수익, 매출"},"example":{"q":"How did your work impact the business?","a":"I optimized the checkout flow, which raised conversion and added about two percent to monthly revenue.","a_ko":"결제 흐름을 최적화해서 전환율을 올렸고, 월 매출이 약 2% 늘었습니다."},"collocations":["increase revenue","revenue growth","generate revenue"],"related":["avenue","convenient","venue","advent"],"tip":"개발 성과도 '매출 기여(revenue impact)'로 말하면 설득력이 커짐"},{"id":"d02-B14","day":2,"level":2,"set":"B","family":"F2","word":"avenue","pos":"noun","ipa":"/ˈævənuː/","meaning_ko":"방법, 길","category":"interview","etymology":{"parts":[{"text":"a","type":"prefix","gloss":"~로 (ad)"},{"text":"ven","type":"root","gloss":"오다"},{"text":"ue","type":"suffix","gloss":"~것"}],"story":"~로 다가옴(프랑스어 avenir) → 다가가는 길 → 큰길, (해결로 가는) 방법"},"example":{"q":"What did you do when your first solution didn't work?","a":"I explored other avenues, like caching and query tuning, until we found one that met our performance target.","a_ko":"캐싱이나 쿼리 튜닝 같은 다른 방법을 찾아본 끝에, 성능 목표를 맞추는 방법을 찾았습니다."},"collocations":["explore other avenues","avenue for growth","every avenue"],"related":["revenue","venue","advent","convenient"],"tip":"'explore every avenue'(가능한 방법을 다 찾아보다) — 문제 해결 답변에 잘 어울림"},{"id":"d02-B15","day":2,"level":2,"set":"B","family":"F2","word":"venture","pos":"noun","ipa":"/ˈventʃər/","meaning_ko":"벤처, 모험적 사업","category":"interview","etymology":{"parts":[{"text":"vent","type":"root","gloss":"오다 (ven)"},{"text":"ure","type":"suffix","gloss":"~것"}],"story":"adventure(다가오는 일, 라틴어 advenire)의 앞부분이 떨어진 말 → 위험을 무릅쓴 일 → 모험적 사업"},"example":{"q":"Why are you interested in a startup?","a":"I've worked at large companies, so now I'd like to join a venture-backed startup where I can own more of the product.","a_ko":"대기업에서 일해 봤기 때문에, 이제는 제품을 더 넓게 맡을 수 있는 벤처 투자 기반 스타트업에 합류하고 싶습니다."},"collocations":["venture-backed","venture capital","joint venture"],"related":["advent","avenue","revenue","invent"],"tip":"동사로 'venture into ~'(~에 과감히 뛰어들다)도 씀"},{"id":"d02-B16","day":2,"level":3,"set":"B","family":"F2","word":"advent","pos":"noun","ipa":"/ˈædvent/","meaning_ko":"출현, 도래","category":"it","etymology":{"parts":[{"text":"ad","type":"prefix","gloss":"~로"},{"text":"vent","type":"root","gloss":"오다 (ven)"}],"story":"~로 다가옴(adventus) → 새것이 도착함 → 출현, 도래"},"example":{"q":"How has your field changed in recent years?","a":"With the advent of large language models, I've started using AI tools for code review and test generation, which has noticeably sped up my work.","a_ko":"대규모 언어 모델이 등장하면서 코드 리뷰와 테스트 작성에 AI 도구를 쓰기 시작했고, 작업 속도가 눈에 띄게 빨라졌습니다."},"collocations":["the advent of","since the advent of","with the advent of"],"related":["avenue","venture","prevent","event","convention"],"tip":"거의 항상 'the advent of + 기술' 형태 — '~의 등장으로'"},{"id":"d02-B17","day":2,"level":3,"set":"B","family":"F2","word":"circumvent","pos":"verb","ipa":"/ˌsɜːrkəmˈvent/","meaning_ko":"우회하다, (규칙을) 피해 가다","category":"interview","etymology":{"parts":[{"text":"circum","type":"prefix","gloss":"둘레로"},{"text":"vent","type":"root","gloss":"오다 (ven)"}],"story":"둘레를 돌아오다 → 장애물을 빙 돌아가다 → 우회하다, (규칙을) 피해 가다"},"example":{"q":"Have you ever been pressured to cut corners?","a":"A manager once asked us to circumvent the security review to hit a deadline, but I suggested a faster review instead, and we launched safely.","a_ko":"한번은 마감을 맞추려고 보안 검토를 건너뛰자는 요청을 받았는데, 대신 더 빠른 검토 방식을 제안해서 안전하게 출시했습니다."},"collocations":["circumvent the rules","circumvent a limitation","circumvent security"],"related":["prevent","advent","inventory","intervene"],"tip":"규칙·통제를 '피해 간다'는 부정적 뉘앙스 — 기술 제약 우회는 'work around'도 가능"},{"id":"d02-B18","day":2,"level":1,"set":"B","family":"F2","word":"process","pos":"noun","ipa":"/ˈprɑːses/","meaning_ko":"과정, 절차","category":"it","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"cess","type":"root","gloss":"가다 (cede)"}],"story":"앞으로 나아감(processus) → 일이 진행되는 과정 → 절차, 프로세스"},"example":{"q":"What is your development process like?","a":"Our process starts with a design doc, then code review and automated tests.","a_ko":"저희 프로세스는 설계 문서로 시작해서 코드 리뷰와 자동 테스트로 이어집니다."},"collocations":["development process","hiring process","streamline a process"],"related":["procedure","proceed","access","success","predecessor"],"tip":"미국식은 /ˈprɑː-/(프라세스), 영국식은 /ˈprəʊ-/(프로세스)"},{"id":"d02-B19","day":2,"level":2,"set":"B","family":"F2","word":"procedure","pos":"noun","ipa":"/prəˈsiːdʒər/","meaning_ko":"절차","category":"it","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"ced","type":"root","gloss":"가다 (cede)"},{"text":"ure","type":"suffix","gloss":"~하는 것"}],"story":"앞으로 나아가는 방식 → 정해진 진행 순서 → 절차"},"example":{"q":"How do you handle production incidents?","a":"I follow our incident procedure: assess the impact, post updates in the incident channel, and roll back if needed.","a_ko":"장애 대응 절차에 따라 영향 범위를 파악하고, 장애 채널에 상황을 공유하고, 필요하면 롤백합니다."},"collocations":["standard procedure","follow a procedure","stored procedure"],"related":["process","proceed","exceed","concede"],"tip":"DB의 'stored procedure'(저장 프로시저)도 같은 단어"},{"id":"d02-B20","day":2,"level":2,"set":"B","family":"F2","word":"access","pos":"noun","ipa":"/ˈækses/","meaning_ko":"접근, 접근 권한","category":"it","etymology":{"parts":[{"text":"ac","type":"prefix","gloss":"~로 (ad)"},{"text":"cess","type":"root","gloss":"가다 (cede)"}],"story":"~쪽으로 다가감(accessus) → 다가갈 수 있음 → 접근, 접근 권한"},"example":{"q":"How do you handle security in your projects?","a":"I use least-privilege access, so each service can reach only the data it actually needs.","a_ko":"최소 권한 원칙으로 접근 권한을 줘서, 각 서비스가 실제로 필요한 데이터에만 접근하게 합니다."},"collocations":["access control","have access to","grant access"],"related":["accessibility","process","exceed","predecessor"],"tip":"동사로도 씀: 'access the database'(DB에 접근하다) — 명사는 'access to + 대상'"},{"id":"d02-B21","day":2,"level":2,"set":"B","family":"F2","word":"accessibility","pos":"noun","ipa":"/əkˌsesəˈbɪləti/","meaning_ko":"접근성","category":"it","etymology":{"parts":[{"text":"ac","type":"prefix","gloss":"~로 (ad)"},{"text":"cess","type":"root","gloss":"가다 (cede)"},{"text":"ibility","type":"suffix","gloss":"~할 수 있음"}],"story":"다가갈 수 있는 성질 → 누구나 쓸 수 있음 → (웹) 접근성"},"example":{"q":"What do you consider when building a user interface?","a":"I always check accessibility, like keyboard navigation and screen reader support, because every user should be able to use the product.","a_ko":"키보드 탐색이나 스크린 리더 지원 같은 접근성을 항상 확인합니다. 모든 사용자가 제품을 쓸 수 있어야 하기 때문입니다."},"collocations":["web accessibility","accessibility standards","improve accessibility"],"related":["access","process","procedure","excessive"],"tip":"줄여서 a11y(a + 가운데 11글자 + y)라고도 씀"},{"id":"d02-B22","day":2,"level":2,"set":"B","family":"F2","word":"excessive","pos":"adjective","ipa":"/ɪkˈsesɪv/","meaning_ko":"과도한","category":"it","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"cess","type":"root","gloss":"가다 (cede)"},{"text":"ive","type":"suffix","gloss":"~하는"}],"story":"(정해진 선) 밖으로 나가는 → 한도를 넘는 → 과도한"},"example":{"q":"How did you find the cause of the slowdown?","a":"Profiling showed excessive database calls inside a loop, so I batched them into a single query.","a_ko":"프로파일링해 보니 반복문 안에서 DB 호출이 과도하게 일어나고 있어서, 하나의 쿼리로 묶었습니다."},"collocations":["excessive logging","excessive memory usage","excessive load"],"related":["exceed","access","process","predecessor"],"tip":"exceed의 명사 excess(초과)에서 나온 형용사 — 부정적 뉘앙스"},{"id":"d02-B23","day":2,"level":1,"set":"B","family":"F2","word":"follow up","pos":"phrasal verb","ipa":"/ˌfɑːloʊ ˈʌp/","meaning_ko":"후속 조치하다, 다시 챙기다","category":"interview","etymology":{"parts":[{"text":"follow","type":"part","gloss":"따라가다"},{"text":" up","type":"part","gloss":"끝까지"}],"story":"끝까지 따라가다 → 일이 마무리될 때까지 챙기다 → 후속 조치하다"},"example":{"q":"What do you do after a meeting with stakeholders?","a":"I follow up with a short summary email and a list of action items.","a_ko":"짧은 요약 메일과 할 일 목록을 보내며 후속 조치를 합니다."},"collocations":["follow up on","follow up with","follow-up question"],"related":["carry out","wrap up","take on","figure out"],"tip":"동사는 follow up, 명사·형용사는 follow-up('a follow-up meeting')"},{"id":"d02-B24","day":2,"level":1,"set":"B","family":"F2","word":"figure out","pos":"phrasal verb","ipa":"/ˌfɪɡjər ˈaʊt/","meaning_ko":"알아내다, 방법을 찾다","category":"interview","etymology":{"parts":[{"text":"figure","type":"part","gloss":"계산하다·그려 보다"},{"text":" out","type":"part","gloss":"밖으로·끝까지"}],"story":"끝까지 계산해 보다 → 답을 찾아내다 → 알아내다"},"example":{"q":"What do you do when you get stuck?","a":"I try to figure it out myself for an hour, then I ask for help.","a_ko":"한 시간 정도는 스스로 해결해 보고, 그래도 안 되면 도움을 요청합니다."},"collocations":["figure out why","figure out a way","figure it out"],"related":["carry out","follow up","set up","take on"],"tip":"대명사는 가운데에: 'figure it out'(O), 'figure out it'(X)"},{"id":"d02-B25","day":2,"level":1,"set":"B","family":"F2","word":"roll out","pos":"phrasal verb","ipa":"/ˌroʊl ˈaʊt/","meaning_ko":"(단계적으로) 출시하다, 배포하다","category":"it","etymology":{"parts":[{"text":"roll","type":"part","gloss":"굴리다"},{"text":" out","type":"part","gloss":"밖으로"}],"story":"굴려서 밖으로 내보내다 → (새 기능·제품을) 사용자에게 내놓다 → 출시·배포하다"},"example":{"q":"How do you release risky features?","a":"We roll out risky features to five percent of users first and watch the metrics.","a_ko":"위험한 기능은 먼저 사용자 5%에게만 배포하고 지표를 지켜봅니다."},"collocations":["roll out a feature","phased rollout","roll out to users"],"related":["spin up","set up","kick off","carry out"],"tip":"명사는 rollout 한 단어 — 'a phased rollout'(단계적 출시)"},{"id":"d02-C01","day":2,"level":2,"set":"C","family":"F2","word":"proceed","pos":"verb","ipa":"/proʊˈsiːd/","meaning_ko":"진행하다, 계속하다","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"ceed","type":"root","gloss":"가다 (cede)"}],"story":"앞으로 가다(procedere) → 다음 단계로 나아가다 → 진행하다"},"example":{"q":"What do you do when requirements are unclear?","a":"I confirm the requirements with the product owner before I proceed, because rework costs far more than a quick question.","a_ko":"진행하기 전에 프로덕트 오너와 요구 사항을 확인합니다. 다시 작업하는 비용이 짧은 질문 하나보다 훨씬 크기 때문입니다."},"collocations":["proceed with","proceed to","how to proceed"],"related":["process","procedure","exceed","predecessor"],"tip":"'proceed with + 일'(~을 진행하다). 철자 -ceed 주의 (precede는 -cede)"},{"id":"d02-C02","day":2,"level":1,"set":"C","family":"F2","word":"exceed","pos":"verb","ipa":"/ɪkˈsiːd/","meaning_ko":"넘다, 초과하다","category":"it","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"ceed","type":"root","gloss":"가다 (cede)"}],"story":"(선) 밖으로 나가다 → 한도를 넘다 → 초과하다"},"example":{"q":"How does your API handle heavy traffic?","a":"When a client exceeds the rate limit, the API returns a 429 error.","a_ko":"클라이언트가 요청 한도를 넘으면 API가 429 오류를 돌려줍니다."},"collocations":["exceed the limit","exceed expectations","exceed a threshold"],"related":["excessive","proceed","access","process"],"tip":"면접에서는 'exceed expectations'(기대 이상의 성과를 내다)로도 자주 씀"},{"id":"d02-C03","day":2,"level":2,"set":"C","family":"F2","word":"predecessor","pos":"noun","ipa":"/ˈpredəsesər/","meaning_ko":"전임자, 이전 버전","category":"interview","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"먼저"},{"text":"de","type":"prefix","gloss":"떨어져"},{"text":"cess","type":"root","gloss":"가다 (cede)"},{"text":"or","type":"suffix","gloss":"~하는 사람"}],"story":"먼저 떠나간 사람(praedecessor) → 내 앞에 그 자리에 있던 사람 → 전임자"},"example":{"q":"What was the situation when you joined the team?","a":"My predecessor left very little documentation, so I spent my first month mapping the system and writing it down.","a_ko":"전임자가 문서를 거의 남기지 않아서, 첫 달은 시스템 구조를 파악하고 문서로 정리하는 데 썼습니다."},"collocations":["my predecessor","predecessor system","unlike its predecessor"],"related":["process","access","concede","success"],"tip":"반대말은 successor(후임자). 이전 버전의 제품·시스템에도 씀"},{"id":"d02-C04","day":2,"level":3,"set":"C","family":"F2","word":"concede","pos":"verb","ipa":"/kənˈsiːd/","meaning_ko":"(맞다고) 인정하다, 양보하다","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"완전히"},{"text":"cede","type":"root","gloss":"가다·물러나다"}],"story":"물러나 길을 내주다(concedere) → 상대에게 양보하다 → (맞다고) 인정하다"},"example":{"q":"Tell me about a time you were wrong in a technical debate.","a":"I argued for microservices, but when a teammate showed the operational cost, I conceded that a modular monolith was the better fit.","a_ko":"저는 마이크로서비스를 주장했지만, 동료가 운영 비용을 보여 주자 모듈형 모놀리스가 더 맞다고 인정했습니다."},"collocations":["concede a point","concede that","reluctantly concede"],"related":["proceed","procedure","predecessor","precedent"],"tip":"admit보다 '논쟁 끝에 물러서서 인정한다'는 뉘앙스 — 유연함을 보여 주는 답변에 좋음"},{"id":"d02-C05","day":2,"level":1,"set":"C","family":"F2","word":"progress","pos":"noun","ipa":"/ˈprɑːɡres/","meaning_ko":"진척, 발전","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"gress","type":"root","gloss":"걸어가다 (grad)"}],"story":"앞으로 걸어 나아감(progressus) → 일이 앞으로 나아감 → 진척, 발전"},"example":{"q":"How do you keep your manager informed?","a":"I share my progress in a short update every Friday.","a_ko":"매주 금요일에 짧은 업데이트로 진척 상황을 공유합니다."},"collocations":["make progress","progress report","track progress"],"related":["progressive","aggressive","graduate","ingredient"],"tip":"명사는 PRO·gress(앞 강세), 동사 '진행되다'는 pro·GRESS(뒤 강세)"},{"id":"d02-C06","day":2,"level":2,"set":"C","family":"F2","word":"progressive","pos":"adjective","ipa":"/prəˈɡresɪv/","meaning_ko":"단계적인, 점진적인","category":"it","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"gress","type":"root","gloss":"걸어가다 (grad)"},{"text":"ive","type":"suffix","gloss":"~하는"}],"story":"앞으로 한 걸음씩 나아가는 → 단계적인, 점진적인"},"example":{"q":"How do you lower the risk of a big release?","a":"We use progressive delivery, shifting traffic step by step and rolling back automatically if errors rise.","a_ko":"프로그레시브 딜리버리 방식으로 트래픽을 단계적으로 옮기고, 오류가 늘면 자동으로 롤백합니다."},"collocations":["progressive delivery","progressive enhancement","progressive web app"],"related":["progress","gradually","degrade","aggressive"],"tip":"웹의 'progressive enhancement'(점진적 향상)·PWA에도 나오는 단어"},{"id":"d02-C07","day":2,"level":1,"set":"C","family":"F2","word":"graduate","pos":"verb","ipa":"/ˈɡrædʒueɪt/","meaning_ko":"졸업하다","category":"interview","etymology":{"parts":[{"text":"grad","type":"root","gloss":"걸음·단계"},{"text":"uate","type":"suffix","gloss":"~하다"}],"story":"중세 라틴어 graduari(학위의 단계를 받다) → 한 단계를 마치다 → 졸업하다"},"example":{"q":"When did you start your career?","a":"I graduated in 2019 and joined a fintech startup right after.","a_ko":"2019년에 졸업하고 바로 핀테크 스타트업에 입사했습니다."},"collocations":["graduate from","graduate with a degree in","new graduate"],"related":["degree","gradually","gradient","progress"],"tip":"동사 끝은 /-eɪt/(그래주에이트), 명사 '졸업생'은 /-ət/(그래주엇)"},{"id":"d02-C08","day":2,"level":1,"set":"C","family":"F2","word":"degree","pos":"noun","ipa":"/dɪˈɡriː/","meaning_ko":"학위, 정도","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"아래로"},{"text":"gree","type":"root","gloss":"걸음·단계 (grad)"}],"story":"계단의 한 단(고대 프랑스어 degre) → 단계, 정도 → 학문의 단계 → 학위"},"example":{"q":"What did you study?","a":"I have a bachelor's degree in computer science.","a_ko":"컴퓨터공학 학사 학위가 있습니다."},"collocations":["bachelor's degree","master's degree","to some degree"],"related":["graduate","gradually","degrade","progress"],"tip":"'to some degree'(어느 정도는)처럼 '정도'의 뜻으로도 자주 씀"},{"id":"d02-C09","day":2,"level":1,"set":"C","family":"F2","word":"gradually","pos":"adverb","ipa":"/ˈɡrædʒuəli/","meaning_ko":"점차, 서서히","category":"it","etymology":{"parts":[{"text":"grad","type":"root","gloss":"걸음·단계"},{"text":"ual","type":"suffix","gloss":"~의"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"한 걸음씩의 → 단계적으로 → 점차, 서서히"},"example":{"q":"How did you replace the legacy system?","a":"We gradually shifted traffic to the new system over three months.","a_ko":"석 달에 걸쳐 트래픽을 새 시스템으로 서서히 옮겼습니다."},"collocations":["gradually improve","gradually increase","gradually replace"],"related":["graduate","gradient","degree","progressive"],"tip":"형용사 gradual — 'a gradual migration'(점진적 이전)"},{"id":"d02-C10","day":2,"level":2,"set":"C","family":"F2","word":"gradient","pos":"noun","ipa":"/ˈɡreɪdiənt/","meaning_ko":"기울기, 그라데이션","category":"it","etymology":{"parts":[{"text":"grad","type":"root","gloss":"걷다 (gradi)"},{"text":"ient","type":"suffix","gloss":"~하는"}],"story":"걸어 올라가는(gradientem) → 오르막의 기울기 → 기울기, 변화율"},"example":{"q":"Can you explain a machine learning technique you've used?","a":"I used gradient descent to train a pricing model, tuning the learning rate until the loss stopped jumping around.","a_ko":"가격 예측 모델을 학습시키려고 경사 하강법을 썼고, 손실 값이 요동치지 않을 때까지 학습률을 조정했습니다."},"collocations":["gradient descent","color gradient","steep gradient"],"related":["gradually","graduate","degree","ingredient"],"tip":"발음 /ˈɡreɪ-/(그레이디언트) — 디자인에서는 '그라데이션'"},{"id":"d02-C11","day":2,"level":2,"set":"C","family":"F2","word":"degrade","pos":"verb","ipa":"/dɪˈɡreɪd/","meaning_ko":"(성능이) 저하되다, 떨어뜨리다","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"아래로"},{"text":"grade","type":"root","gloss":"단계 (grad)"}],"story":"단계를 아래로 내리다(degradare, 강등하다) → 질이 떨어지다 → (성능이) 저하되다"},"example":{"q":"How do you design for failure?","a":"If the recommendation service fails, the page degrades gracefully and shows popular items instead.","a_ko":"추천 서비스가 실패해도 페이지가 부드럽게 기능을 줄여서, 대신 인기 상품을 보여 줍니다."},"collocations":["degrade gracefully","performance degrades","degraded mode"],"related":["degree","gradually","upgrade","progressive"],"tip":"'graceful degradation'(우아한 성능 저하) — 장애 설계 질문의 단골 표현"},{"id":"d02-C12","day":2,"level":1,"set":"C","family":"F2","word":"aggressive","pos":"adjective","ipa":"/əˈɡresɪv/","meaning_ko":"빠듯한(일정), 공격적인","category":"interview","etymology":{"parts":[{"text":"ag","type":"prefix","gloss":"~쪽으로 (ad)"},{"text":"gress","type":"root","gloss":"걸어가다 (grad)"},{"text":"ive","type":"suffix","gloss":"~하는"}],"story":"~쪽으로 걸어가는(aggredi, 다가가다·덤벼들다) → 공격적인 → 의욕적으로 밀어붙이는"},"example":{"q":"How do you handle tight deadlines?","a":"When the timeline is aggressive, I cut scope instead of skipping tests.","a_ko":"일정이 빠듯하면 테스트를 빼지 않고 범위를 줄입니다."},"collocations":["aggressive timeline","aggressive goals","aggressive caching"],"related":["progress","digress","ingress","ingredient"],"tip":"사람에게는 부정적(공격적인)이지만, 일정·목표에는 '도전적인, 빠듯한' 뜻"},{"id":"d02-C13","day":2,"level":2,"set":"C","family":"F2","word":"ingredient","pos":"noun","ipa":"/ɪnˈɡriːdiənt/","meaning_ko":"요소, 재료","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안으로"},{"text":"gred","type":"root","gloss":"걸어가다 (grad)"},{"text":"ient","type":"suffix","gloss":"~하는 것"}],"story":"안으로 들어가는 것(ingredi) → 섞여 들어가는 재료 → 구성 요소"},"example":{"q":"What makes a team successful in your opinion?","a":"I think trust is the key ingredient, because people only share problems early when they feel safe.","a_ko":"신뢰가 핵심 요소라고 생각합니다. 안전하다고 느낄 때만 사람들이 문제를 일찍 털어놓기 때문입니다."},"collocations":["key ingredient","essential ingredient","secret ingredient"],"related":["ingress","progress","aggressive","gradient"],"tip":"'the key ingredient for success'(성공의 핵심 요소)처럼 비유적으로 많이 씀"},{"id":"d02-C14","day":2,"level":3,"set":"C","family":"F2","word":"digress","pos":"verb","ipa":"/daɪˈɡres/","meaning_ko":"(이야기가) 본론에서 벗어나다","category":"interview","etymology":{"parts":[{"text":"di","type":"prefix","gloss":"떨어져 (dis)"},{"text":"gress","type":"root","gloss":"걸어가다 (grad)"}],"story":"옆으로 떨어져 걸어가다(digredi) → 길에서 벗어나다 → 이야기가 본론에서 벗어나다"},"example":{"q":"Can you walk me through your architecture?","a":"We also tried GraphQL for a while, but I digress; the key point is that each service owns its own data.","a_ko":"한동안 GraphQL도 써 봤는데요, 이야기가 샜네요. 핵심은 각 서비스가 자기 데이터를 직접 소유한다는 점입니다."},"collocations":["but I digress","digress from","digress briefly"],"related":["progress","aggressive","ingress","regression"],"tip":"'But I digress.'(얘기가 샜네요)는 답변이 길어졌을 때 본론으로 돌아오는 세련된 한마디"},{"id":"d02-C15","day":2,"level":3,"set":"C","family":"F2","word":"ingress","pos":"noun","ipa":"/ˈɪnɡres/","meaning_ko":"인그레스(들어오는 트래픽), 진입","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안으로"},{"text":"gress","type":"root","gloss":"걸어가다 (grad)"}],"story":"안으로 걸어 들어감(ingressus) → 들어오는 입구 → 외부에서 들어오는 트래픽"},"example":{"q":"How do you expose services in your Kubernetes cluster?","a":"We route external traffic through an NGINX ingress controller, which handles TLS termination and path-based routing for all our services.","a_ko":"외부 트래픽은 NGINX 인그레스 컨트롤러로 라우팅하고, 여기서 모든 서비스의 TLS 종료와 경로 기반 라우팅을 처리합니다."},"collocations":["ingress controller","ingress traffic","ingress rules"],"related":["egress","progress","ingredient","aggressive"],"tip":"반대말 egress(나가는 트래픽) — 클라우드 비용의 'egress fee'와 짝으로 기억"},{"id":"d02-C16","day":2,"level":1,"set":"C","family":"F2","word":"sequence","pos":"noun","ipa":"/ˈsiːkwəns/","meaning_ko":"순서, 시퀀스","category":"it","etymology":{"parts":[{"text":"sequ","type":"root","gloss":"따르다"},{"text":"ence","type":"suffix","gloss":"~하는 것"}],"story":"뒤따르는 것(sequentia) → 차례로 이어지는 것 → 순서"},"example":{"q":"How do you debug a complex workflow?","a":"I draw a sequence diagram to see the exact order of service calls.","a_ko":"시퀀스 다이어그램을 그려서 서비스 호출 순서를 정확히 확인합니다."},"collocations":["sequence diagram","in sequence","sequence of steps"],"related":["sequential","consecutive","pursue","consequence"],"tip":"'in sequence'(순서대로) ↔ 'in parallel'(동시에)"},{"id":"d02-C17","day":2,"level":2,"set":"C","family":"F2","word":"sequential","pos":"adjective","ipa":"/sɪˈkwenʃl/","meaning_ko":"순차적인","category":"it","etymology":{"parts":[{"text":"sequ","type":"root","gloss":"따르다"},{"text":"ent","type":"suffix","gloss":"~하는"},{"text":"ial","type":"suffix","gloss":"~의"}],"story":"뒤따라가는 → 하나씩 차례로 → 순차적인"},"example":{"q":"How did you speed up the data pipeline?","a":"The steps were sequential even though they didn't depend on each other, so I ran them in parallel and cut the runtime in half.","a_ko":"단계들이 서로 의존하지 않는데도 순차적으로 돌고 있어서, 병렬로 실행해 실행 시간을 절반으로 줄였습니다."},"collocations":["sequential processing","sequential steps","sequential IDs"],"related":["sequence","consecutive","ensue","subsequent"],"tip":"concurrent·parallel(동시의)과 반대 개념으로 함께 외우기"},{"id":"d02-C18","day":2,"level":2,"set":"C","family":"F2","word":"consecutive","pos":"adjective","ipa":"/kənˈsekjətɪv/","meaning_ko":"연속된","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"secu","type":"root","gloss":"따르다 (sequ)"},{"text":"tive","type":"suffix","gloss":"~하는"}],"story":"줄지어 함께 따라오는(consecutus) → 끊김 없이 이어지는 → 연속된"},"example":{"q":"How do you decide when to page the on-call engineer?","a":"We only page someone after three consecutive failed health checks, which cut false alarms a lot.","a_ko":"헬스 체크가 세 번 연속 실패할 때만 당직자를 호출해서, 잘못된 알림을 크게 줄였습니다."},"collocations":["three consecutive","consecutive days","consecutive releases"],"related":["sequence","sequential","pursue","execute"],"tip":"'for three consecutive quarters'(세 분기 연속)처럼 성과를 말할 때도 씀"},{"id":"d02-C19","day":2,"level":1,"set":"C","family":"F2","word":"pursue","pos":"verb","ipa":"/pərˈsuː/","meaning_ko":"추구하다, (진로를) 밟다","category":"interview","etymology":{"parts":[{"text":"pur","type":"prefix","gloss":"앞으로 (pro)"},{"text":"sue","type":"root","gloss":"따르다 (sequ)"}],"story":"앞으로 따라가다(라틴어 prosequi → 고대 프랑스어) → 뒤쫓다 → 추구하다"},"example":{"q":"Why did you choose software engineering?","a":"I loved solving puzzles, so I decided to pursue a career in software.","a_ko":"퍼즐 푸는 걸 좋아해서 소프트웨어 분야로 진로를 정했습니다."},"collocations":["pursue a career","pursue a goal","pursue an opportunity"],"related":["pursuit","ensue","sequence","consecutive"],"tip":"강세는 뒤에 pur·SUE /pərˈsuː/"},{"id":"d02-C20","day":2,"level":2,"set":"C","family":"F2","word":"pursuit","pos":"noun","ipa":"/pərˈsuːt/","meaning_ko":"추구","category":"interview","etymology":{"parts":[{"text":"pur","type":"prefix","gloss":"앞으로 (pro)"},{"text":"suit","type":"root","gloss":"따름 (sequ)"}],"story":"앞으로 따라감 → 뒤쫓음 → (목표의) 추구"},"example":{"q":"Why do you want to leave a secure job?","a":"In pursuit of more ownership, I want a role where I can lead projects from design to launch.","a_ko":"더 많은 주도권을 갖고 싶어서, 설계부터 출시까지 프로젝트를 이끌 수 있는 자리를 찾고 있습니다."},"collocations":["in pursuit of","the pursuit of excellence","pursuit of growth"],"related":["pursue","suite","ensue","sequence"],"tip":"'in pursuit of ~'(~을 추구하여)를 통째로 기억"},{"id":"d02-C21","day":2,"level":1,"set":"C","family":"F2","word":"suit","pos":"verb","ipa":"/suːt/","meaning_ko":"~에 맞다, 어울리다","category":"interview","etymology":{"parts":[{"text":"suit","type":"root","gloss":"따르다 (sequ)"}],"story":"따라감(고대 프랑스어 siute) → 짝을 맞춘 한 벌 → (짝처럼) 잘 맞다, 어울리다"},"example":{"q":"Why do you think this role suits you?","a":"This role suits my strengths in backend development and teamwork.","a_ko":"이 직무는 백엔드 개발과 팀워크라는 제 강점에 잘 맞습니다."},"collocations":["suit my strengths","suit your needs","be suited for"],"related":["suitable","suite","pursue","sequence"],"tip":"'be suited for/to'(~에 적합하다)도 면접에서 자주 씀"},{"id":"d02-C22","day":2,"level":1,"set":"C","family":"F2","word":"suitable","pos":"adjective","ipa":"/ˈsuːtəbl/","meaning_ko":"적합한","category":"interview","etymology":{"parts":[{"text":"suit","type":"root","gloss":"맞다 (sequ)"},{"text":"able","type":"suffix","gloss":"~할 수 있는"}],"story":"잘 맞출 수 있는 → 어울리는 → 적합한"},"example":{"q":"Why should we hire you?","a":"My experience with large-scale payment systems makes me a suitable candidate.","a_ko":"대규모 결제 시스템을 다뤄 본 경험이 있어서 이 자리에 적합한 후보라고 생각합니다."},"collocations":["suitable for","a suitable candidate","the most suitable option"],"related":["suit","suite","pursue","consecutive"],"tip":"'suitable for + 명사' — fit보다 조금 격식 있는 말"},{"id":"d02-C23","day":2,"level":2,"set":"C","family":"F2","word":"suite","pos":"noun","ipa":"/swiːt/","meaning_ko":"(테스트·프로그램) 묶음, 스위트","category":"it","etymology":{"parts":[{"text":"suite","type":"root","gloss":"따름·일행 (sequ)"}],"story":"뒤따르는 일행(프랑스어 suite) → 함께 딸린 한 묶음 → 프로그램·테스트 묶음"},"example":{"q":"How do you make sure a refactor doesn't break anything?","a":"I run the full test suite in CI, and I add tests first if a module isn't covered.","a_ko":"CI에서 전체 테스트 스위트를 돌리고, 테스트가 없는 모듈이면 먼저 테스트부터 추가합니다."},"collocations":["test suite","software suite","suite of tools"],"related":["suit","suitable","pursuit","sequence"],"tip":"발음은 /swiːt/(스위트) — sweet와 같음. suit(/suːt/)와 다름"},{"id":"d02-C24","day":2,"level":1,"set":"C","family":"F2","word":"take on","pos":"phrasal verb","ipa":"/ˌteɪk ˈɑːn/","meaning_ko":"(일·책임을) 맡다","category":"interview","etymology":{"parts":[{"text":"take","type":"part","gloss":"잡다·가지다"},{"text":" on","type":"part","gloss":"위에·몸에"}],"story":"(짐을) 집어 몸에 올리다 → 일·책임을 떠맡다"},"example":{"q":"What are you looking for in your next role?","a":"I want to take on more responsibility, like leading a small team.","a_ko":"작은 팀을 이끄는 것처럼 더 많은 책임을 맡고 싶습니다."},"collocations":["take on responsibility","take on a challenge","take on a project"],"related":["carry out","follow up","ramp up","wrap up"],"tip":"'take on a challenge'(도전을 맡다)는 지원 동기·성장 이야기에 딱 맞음"},{"id":"d02-C25","day":2,"level":1,"set":"C","family":"F2","word":"wrap up","pos":"phrasal verb","ipa":"/ˌræp ˈʌp/","meaning_ko":"마무리하다, 정리하다","category":"interview","etymology":{"parts":[{"text":"wrap","type":"part","gloss":"싸다·포장하다"},{"text":" up","type":"part","gloss":"완전히"}],"story":"완전히 싸서 묶다 → (일·회의를) 마무리하다"},"example":{"q":"How do you end your sprints?","a":"We wrap up each sprint with a demo and a quick look back.","a_ko":"매 스프린트를 데모와 간단한 되돌아보기로 마무리합니다."},"collocations":["wrap up a meeting","wrap up a project","to wrap up"],"related":["kick off","follow up","carry out","take on"],"tip":"답변 끝에 'To wrap up, …'(정리하자면)으로 요약하면 깔끔함"},{"id":"d02-D01","day":2,"level":3,"set":"D","family":"F2","word":"ensue","pos":"verb","ipa":"/ɪnˈsuː/","meaning_ko":"(결과로) 뒤따르다, 잇따르다","category":"interview","etymology":{"parts":[{"text":"en","type":"prefix","gloss":"바로 뒤에 (in)"},{"text":"sue","type":"root","gloss":"따르다 (sequ)"}],"story":"바로 뒤따라가다(라틴어 insequi → 고대 프랑스어 ensuivre) → 결과로 이어지다"},"example":{"q":"Tell me about a project that went wrong.","a":"We launched without load testing, and a week of firefighting ensued, so now I always insist on testing at peak traffic levels.","a_ko":"부하 테스트 없이 출시했다가 일주일 내내 불 끄기에 시달렸습니다. 그래서 지금은 최대 트래픽 수준의 테스트를 꼭 고집합니다."},"collocations":["chaos ensued","the ensuing discussion","ensue from"],"related":["pursue","sequence","consecutive","subsequent"],"tip":"형용사형 ensuing(뒤이은) — 'in the ensuing weeks'(그 뒤 몇 주 동안)"},{"id":"d02-D02","day":2,"level":1,"set":"D","family":"F2","word":"initial","pos":"adjective","ipa":"/ɪˈnɪʃl/","meaning_ko":"처음의, 초기의","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안으로"},{"text":"iti","type":"root","gloss":"가다 (it)"},{"text":"al","type":"suffix","gloss":"~의"}],"story":"안으로 들어감(inire) → 시작(initium) → 처음의"},"example":{"q":"What was your first approach to the problem?","a":"My initial idea was too complex, so I simplified it after feedback.","a_ko":"처음 아이디어는 너무 복잡해서 피드백을 받은 뒤 단순하게 바꿨습니다."},"collocations":["initial version","initial plan","initial results"],"related":["initiative","initialize","transition","exit"],"tip":"부사 initially(처음에는) — 'Initially, I thought…'로 STAR 답변을 시작하기 좋음"},{"id":"d02-D03","day":2,"level":2,"set":"D","family":"F2","word":"initiative","pos":"noun","ipa":"/ɪˈnɪʃətɪv/","meaning_ko":"주도성, (새로운) 계획","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안으로"},{"text":"iti","type":"root","gloss":"가다 (it)"},{"text":"ative","type":"suffix","gloss":"~하는 것"}],"story":"시작하다(initiare, 안으로 들어가다) → 먼저 시작하는 힘 → 주도성, 새 계획"},"example":{"q":"Give me an example of when you took initiative.","a":"I took the initiative to write an onboarding guide, which cut new hires' setup time from a week to two days.","a_ko":"제가 먼저 나서서 온보딩 가이드를 만들었고, 신규 입사자의 환경 설정 시간을 일주일에서 이틀로 줄였습니다."},"collocations":["take the initiative","show initiative","a company-wide initiative"],"related":["initial","initialize","transition","ambition"],"tip":"'take the initiative to do'(먼저 나서서 ~하다)는 행동 면접 단골 표현"},{"id":"d02-D04","day":2,"level":2,"set":"D","family":"F2","word":"initialize","pos":"verb","ipa":"/ɪˈnɪʃəlaɪz/","meaning_ko":"초기화하다","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안으로"},{"text":"iti","type":"root","gloss":"가다 (it)"},{"text":"al","type":"suffix","gloss":"~의"},{"text":"ize","type":"suffix","gloss":"~하게 하다"}],"story":"처음(initial) 상태로 만들다 → 초기화하다"},"example":{"q":"How did you make the app start faster?","a":"I changed heavy modules to initialize lazily, so they load only when a user actually needs them.","a_ko":"무거운 모듈을 지연 초기화하도록 바꿔서, 사용자가 실제로 필요할 때만 불러오게 했습니다."},"collocations":["initialize a variable","lazy initialization","initialize the database"],"related":["initial","initiative","exit","transition"],"tip":"영국식 철자는 initialise — 코드에서는 init으로 줄여 씀"},{"id":"d02-D05","day":2,"level":1,"set":"D","family":"F2","word":"transition","pos":"noun","ipa":"/trænˈzɪʃn/","meaning_ko":"전환, 이행","category":"interview","etymology":{"parts":[{"text":"trans","type":"prefix","gloss":"건너서"},{"text":"it","type":"root","gloss":"가다"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"건너가는 것(transitio) → 한 상태에서 다른 상태로 옮겨 감 → 전환"},"example":{"q":"Why are you switching from frontend to backend?","a":"The transition felt natural because I already enjoyed building APIs.","a_ko":"이미 API 만드는 걸 좋아했기 때문에 자연스러운 전환이었습니다."},"collocations":["career transition","smooth transition","transition to"],"related":["initial","exit","circuit","ambition"],"tip":"'make a smooth transition'(순조롭게 전환하다) — 이직·직무 변경 설명에 유용"},{"id":"d02-D06","day":2,"level":1,"set":"D","family":"F2","word":"ambition","pos":"noun","ipa":"/æmˈbɪʃn/","meaning_ko":"포부, 야망","category":"interview","etymology":{"parts":[{"text":"amb","type":"prefix","gloss":"둘레로 (ambi)"},{"text":"it","type":"root","gloss":"가다"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"돌아다님(ambitio, 표를 얻으러 돌아다니던 일) → 지위를 얻으려는 마음 → 야망, 포부"},"example":{"q":"Where do you see yourself in five years?","a":"My ambition is to become a tech lead who helps other engineers grow.","a_ko":"다른 엔지니어의 성장을 돕는 테크 리드가 되는 것이 제 포부입니다."},"collocations":["career ambition","have the ambition to","long-term ambition"],"related":["ambitious","transition","initial","circuit"],"tip":"고대 로마 후보자가 표를 얻으려 '돌아다니던' 데서 온 말"},{"id":"d02-D07","day":2,"level":1,"set":"D","family":"F2","word":"ambitious","pos":"adjective","ipa":"/æmˈbɪʃəs/","meaning_ko":"의욕적인, 야심 찬","category":"interview","etymology":{"parts":[{"text":"amb","type":"prefix","gloss":"둘레로 (ambi)"},{"text":"it","type":"root","gloss":"가다"},{"text":"ious","type":"suffix","gloss":"~한"}],"story":"지위를 얻으려 돌아다니는 → 야망이 큰 → 의욕적인"},"example":{"q":"What kind of goals do you set for yourself?","a":"I set ambitious but realistic goals and check my progress every quarter.","a_ko":"의욕적이지만 현실적인 목표를 세우고, 분기마다 진행 상황을 점검합니다."},"collocations":["ambitious goal","ambitious project","ambitious plan"],"related":["ambition","initiative","transition","exit"],"tip":"aggressive(무리한)보다 긍정적 — 목표를 높게 잡는다는 뉘앙스"},{"id":"d02-D08","day":2,"level":1,"set":"D","family":"F2","word":"exit","pos":"noun","ipa":"/ˈeksɪt/","meaning_ko":"종료, 출구","category":"it","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"it","type":"root","gloss":"가다"}],"story":"라틴어 exit(그가 나간다) → 밖으로 나감 → 출구, (프로그램의) 종료"},"example":{"q":"How does your script report errors?","a":"It returns a non-zero exit code, so the CI job fails right away.","a_ko":"0이 아닌 종료 코드를 돌려줘서 CI 작업이 바로 실패하게 합니다."},"collocations":["exit code","exit strategy","graceful exit"],"related":["initial","transition","circuit","issue"],"tip":"'exit strategy'(출구 전략)는 비즈니스 표현으로도 자주 씀"},{"id":"d02-D09","day":2,"level":1,"set":"D","family":"F2","word":"issue","pos":"noun","ipa":"/ˈɪʃuː/","meaning_ko":"문제, 쟁점","category":"interview","etymology":{"parts":[{"text":"issue","type":"root","gloss":"나가다 (ex + it)"}],"story":"밖으로 나감(라틴어 exire → 고대 프랑스어 issue) → 흘러나온 결과 → 논의할 문제"},"example":{"q":"Tell me about a time you disagreed with your manager.","a":"I raised the issue privately and suggested a small experiment to test my idea.","a_ko":"따로 그 문제를 말씀드리고, 제 생각을 검증할 작은 실험을 제안했습니다."},"collocations":["raise an issue","address an issue","known issue"],"related":["exit","initial","transition","ambition"],"tip":"problem보다 중립적인 '이슈·쟁점' — 'raise an issue'(문제를 제기하다)"},{"id":"d02-D10","day":2,"level":2,"set":"D","family":"F2","word":"circuit","pos":"noun","ipa":"/ˈsɜːrkɪt/","meaning_ko":"회로, 순환","category":"it","etymology":{"parts":[{"text":"circu","type":"prefix","gloss":"둘레로 (circum)"},{"text":"it","type":"root","gloss":"가다"}],"story":"빙 둘러 가다(circumire) → 한 바퀴 도는 길 → (전기) 회로"},"example":{"q":"How do you stop one failing service from taking down the whole system?","a":"I add a circuit breaker, so calls to a failing service stop quickly instead of piling up.","a_ko":"서킷 브레이커를 넣어서, 실패하는 서비스로 가는 호출이 쌓이지 않고 바로 끊기게 합니다."},"collocations":["circuit breaker","short circuit","closed circuit"],"related":["transition","exit","initial","ambition"],"tip":"발음 /ˈsɜːrkɪt/(서킷) — 가운데 u는 소리 나지 않음"},{"id":"d02-D11","day":2,"level":1,"set":"D","family":"F2","word":"current","pos":"adjective","ipa":"/ˈkɜːrənt/","meaning_ko":"현재의","category":"interview","etymology":{"parts":[{"text":"curr","type":"root","gloss":"달리다 (cur)"},{"text":"ent","type":"suffix","gloss":"~하는"}],"story":"달리고 있는(currentem) → 지금 흐르고 있는 → 현재의"},"example":{"q":"What is your current role?","a":"In my current role, I build payment APIs for an e-commerce company.","a_ko":"현재 직무에서는 이커머스 회사의 결제 API를 개발하고 있습니다."},"collocations":["current role","current company","current version"],"related":["currently","occur","concurrent","recurring"],"tip":"명사로는 '흐름·전류' — currency(통화)도 같은 어근"},{"id":"d02-D12","day":2,"level":1,"set":"D","family":"F2","word":"currently","pos":"adverb","ipa":"/ˈkɜːrəntli/","meaning_ko":"현재, 지금","category":"interview","etymology":{"parts":[{"text":"curr","type":"root","gloss":"달리다 (cur)"},{"text":"ent","type":"suffix","gloss":"~하는"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"지금 흐르고 있게 → 현재"},"example":{"q":"Tell me about yourself.","a":"I'm currently a backend engineer at a logistics startup in Seoul.","a_ko":"현재 서울의 물류 스타트업에서 백엔드 엔지니어로 일하고 있습니다."},"collocations":["currently working on","currently based in","currently responsible for"],"related":["current","course","occur","concurrency"],"tip":"자기소개 첫 문장을 'I'm currently …'로 시작하면 자연스러움"},{"id":"d02-D13","day":2,"level":1,"set":"D","family":"F2","word":"occur","pos":"verb","ipa":"/əˈkɜːr/","meaning_ko":"(생각이) 떠오르다, 일어나다","category":"interview","etymology":{"parts":[{"text":"oc","type":"prefix","gloss":"~쪽으로 (ob)"},{"text":"cur","type":"root","gloss":"달리다"}],"story":"~쪽으로 달려오다(occurrere) → 눈앞에 나타나다 → 일어나다, 생각이 떠오르다"},"example":{"q":"How did you come up with that solution?","a":"It occurred to me that we could cache the results at the edge.","a_ko":"결과를 엣지에서 캐시하면 되겠다는 생각이 떠올랐습니다."},"collocations":["it occurred to me","errors occur","occur frequently"],"related":["current","recurring","incur","concurrent"],"tip":"'It occurred to me that…'(~라는 생각이 들었다)는 아이디어를 낸 과정을 말할 때 유용. 과거형은 r을 겹쳐 occurred"},{"id":"d02-D14","day":2,"level":1,"set":"D","family":"F2","word":"course","pos":"noun","ipa":"/kɔːrs/","meaning_ko":"강좌, 과정","category":"interview","etymology":{"parts":[{"text":"course","type":"root","gloss":"달림·진로 (curs)"}],"story":"달리는 길(라틴어 cursus) → 나아가는 진로 → (배움의) 과정, 강좌"},"example":{"q":"How do you keep your skills up to date?","a":"I take an online course every quarter, recently one on Kubernetes.","a_ko":"분기마다 온라인 강좌를 하나씩 듣고 있고, 최근에는 쿠버네티스 강좌를 들었습니다."},"collocations":["online course","over the course of","of course"],"related":["current","recursive","occur","precursor"],"tip":"'over the course of the project'(프로젝트를 진행하는 동안)처럼 기간을 말할 때도 씀"},{"id":"d02-D15","day":2,"level":2,"set":"D","family":"F2","word":"concurrent","pos":"adjective","ipa":"/kənˈkɜːrənt/","meaning_ko":"동시의, 병행하는","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"curr","type":"root","gloss":"달리다 (cur)"},{"text":"ent","type":"suffix","gloss":"~하는"}],"story":"함께 달리는(concurrere) → 동시에 진행되는"},"example":{"q":"What is the biggest load your system has handled?","a":"Our chat service handled about fifty thousand concurrent connections during peak hours without problems.","a_ko":"채팅 서비스는 피크 시간대에 약 5만 개의 동시 접속을 문제없이 처리했습니다."},"collocations":["concurrent users","concurrent connections","concurrent requests"],"related":["concurrency","current","occur","recurring"],"tip":"'concurrent users'(동시 접속자 수)는 시스템 규모를 말할 때 자주 쓰는 지표"},{"id":"d02-D16","day":2,"level":2,"set":"D","family":"F2","word":"concurrency","pos":"noun","ipa":"/kənˈkɜːrənsi/","meaning_ko":"동시성","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"curr","type":"root","gloss":"달리다 (cur)"},{"text":"ency","type":"suffix","gloss":"~성질"}],"story":"함께 달리는 성질 → 여러 작업이 동시에 진행됨 → 동시성"},"example":{"q":"What is a tricky bug you've fixed?","a":"I fixed a concurrency bug where two threads updated the same balance by adding row-level locking.","a_ko":"두 스레드가 같은 잔액을 동시에 수정하던 동시성 버그를 행 단위 잠금을 추가해서 고쳤습니다."},"collocations":["concurrency control","concurrency issue","high concurrency"],"related":["concurrent","current","recursive","occur"],"tip":"concurrency(동시성: 번갈아 가며 함께 진행) vs parallelism(병렬성: 실제로 같은 순간에 실행)"},{"id":"d02-D17","day":2,"level":2,"set":"D","family":"F2","word":"recurring","pos":"adjective","ipa":"/rɪˈkɜːrɪŋ/","meaning_ko":"반복되는, 정기적인","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"curr","type":"root","gloss":"달리다 (cur)"},{"text":"ing","type":"suffix","gloss":"~하는"}],"story":"다시 달려오는(recurrere) → 되풀이되는"},"example":{"q":"Tell me about a problem you solved for good.","a":"We had a recurring memory leak every few weeks, so I profiled the service and fixed an unclosed connection pool.","a_ko":"몇 주마다 반복되는 메모리 누수가 있어서, 서비스를 프로파일링한 뒤 닫히지 않던 커넥션 풀을 고쳤습니다."},"collocations":["recurring issue","recurring meeting","recurring payment"],"related":["recursive","occur","current","incur"],"tip":"동사 recur(재발하다) — 'recurring billing'(정기 결제)처럼 SaaS 용어로도 씀"},{"id":"d02-D18","day":2,"level":2,"set":"D","family":"F2","word":"recursive","pos":"adjective","ipa":"/rɪˈkɜːrsɪv/","meaning_ko":"재귀적인","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"curs","type":"root","gloss":"달리다 (cur)"},{"text":"ive","type":"suffix","gloss":"~하는"}],"story":"다시 달려 돌아오는(recursus) → 자기 자신으로 되돌아오는 → 재귀적인"},"example":{"q":"How would you traverse a nested folder structure?","a":"I'd write a recursive function, but for very deep trees I'd use my own stack to avoid a stack overflow.","a_ko":"재귀 함수로 짜겠지만, 트리가 아주 깊으면 스택 오버플로를 피하려고 스택을 직접 써서 구현하겠습니다."},"collocations":["recursive function","recursive call","recursive query"],"related":["recurring","course","precursor","concurrent"],"tip":"명사는 recursion(재귀) — 코딩 테스트에 자주 나오는 단어"},{"id":"d02-D19","day":2,"level":3,"set":"D","family":"F2","word":"incur","pos":"verb","ipa":"/ɪnˈkɜːr/","meaning_ko":"(비용·부담을) 떠안다, 초래하다","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안으로·~에"},{"text":"cur","type":"root","gloss":"달리다"}],"story":"~로 달려 들어가다(incurrere) → (나쁜 일에) 부딪치다 → 비용·부담을 떠안다"},"example":{"q":"How do you balance speed and code quality?","a":"Sometimes I take on a little technical debt to ship faster, but I log it right away so we don't incur hidden costs later.","a_ko":"빨리 출시하려고 약간의 기술 부채를 감수할 때도 있지만, 바로 기록해 둬서 나중에 숨은 비용을 떠안지 않게 합니다."},"collocations":["incur costs","incur technical debt","incur a penalty"],"related":["occur","recurring","current","precursor"],"tip":"목적어는 주로 cost·debt·loss 같은 '부담' — 좋은 것에는 쓰지 않음"},{"id":"d02-D20","day":2,"level":3,"set":"D","family":"F2","word":"precursor","pos":"noun","ipa":"/priˈkɜːrsər/","meaning_ko":"전신(前身), 전조","category":"interview","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"먼저"},{"text":"curs","type":"root","gloss":"달리다 (cur)"},{"text":"or","type":"suffix","gloss":"~하는 사람·것"}],"story":"앞서 달리는 사람(praecursor) → 먼저 와서 알리는 것 → 전조, 전신"},"example":{"q":"How did your side project help your career?","a":"My side project was a precursor to the internal tool I later built at work, so I already knew most of the pitfalls.","a_ko":"개인 프로젝트가 나중에 회사에서 만든 사내 도구의 전신이 되어서, 함정 대부분을 이미 알고 있었습니다."},"collocations":["a precursor to","an early precursor","a direct precursor"],"related":["recursive","course","current","incur"],"tip":"'a precursor to ~'(~의 전신·전조) — 경험이 다음 성과로 이어졌다고 말할 때 좋음"},{"id":"d02-D21","day":2,"level":1,"set":"D","family":"F2","word":"agenda","pos":"noun","ipa":"/əˈdʒendə/","meaning_ko":"안건, 의제","category":"interview","etymology":{"parts":[{"text":"ag","type":"root","gloss":"하다·몰다"},{"text":"enda","type":"suffix","gloss":"해야 할 것들"}],"story":"라틴어 agenda(해야 할 일들, agere 하다) → 회의에서 다룰 일 → 안건"},"example":{"q":"How do you run effective meetings?","a":"I share a clear agenda the day before, so everyone comes prepared.","a_ko":"전날 명확한 안건을 공유해서 모두가 준비된 상태로 오게 합니다."},"collocations":["set the agenda","on the agenda","meeting agenda"],"related":["agent","agile","proactive","transaction"],"tip":"'hidden agenda'(숨은 의도)는 부정적인 뜻이니 주의"},{"id":"d02-D22","day":2,"level":1,"set":"D","family":"F2","word":"agent","pos":"noun","ipa":"/ˈeɪdʒənt/","meaning_ko":"에이전트, 대리인","category":"it","etymology":{"parts":[{"text":"ag","type":"root","gloss":"하다·몰다"},{"text":"ent","type":"suffix","gloss":"~하는 것·사람"}],"story":"행동하는 것(agentem, agere 하다) → 대신 일하는 사람 → (소프트웨어) 에이전트"},"example":{"q":"What have you built with AI recently?","a":"I built an AI agent that sorts support tickets automatically.","a_ko":"고객 문의 티켓을 자동으로 분류하는 AI 에이전트를 만들었습니다."},"collocations":["AI agent","monitoring agent","change agent"],"related":["agenda","agile","transaction","proactive"],"tip":"모니터링 도구의 'agent'(서버에 설치하는 수집 프로그램)도 같은 단어"},{"id":"d02-D23","day":2,"level":2,"set":"D","family":"F2","word":"transaction","pos":"noun","ipa":"/trænˈzækʃn/","meaning_ko":"트랜잭션, 거래","category":"it","etymology":{"parts":[{"text":"trans","type":"prefix","gloss":"끝까지 (건너서)"},{"text":"act","type":"root","gloss":"하다·몰다 (ag)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"끝까지 몰고 가다(transigere, 일을 마무리하다) → 처리가 끝난 일 → 거래, 트랜잭션"},"example":{"q":"How do you keep payment data correct when something fails?","a":"I wrap the balance update and the payment record in one transaction, so either both are saved or both roll back.","a_ko":"잔액 수정과 결제 기록을 하나의 트랜잭션으로 묶어서, 둘 다 저장되거나 둘 다 롤백되게 합니다."},"collocations":["database transaction","transaction log","transactions per second"],"related":["agent","agile","proactive","agenda"],"tip":"TPS = transactions per second(초당 처리 건수)"},{"id":"d02-D24","day":2,"level":2,"set":"D","family":"F2","word":"ramp up","pos":"phrasal verb","ipa":"/ˌræmp ˈʌp/","meaning_ko":"(새 업무에) 빠르게 적응하다, (규모를) 늘리다","category":"interview","etymology":{"parts":[{"text":"ramp","type":"part","gloss":"경사로"},{"text":" up","type":"part","gloss":"위로"}],"story":"경사로를 따라 올라가다 → 속도·규모를 점점 끌어올리다 → (새 업무에) 빠르게 적응하다"},"example":{"q":"How quickly can you get up to speed in a new codebase?","a":"I usually ramp up within two weeks by reading the docs, pairing with teammates, and fixing small bugs first.","a_ko":"보통 문서를 읽고, 동료와 페어로 작업하고, 작은 버그부터 고치면서 2주 안에 업무에 적응합니다."},"collocations":["ramp up on","ramp up quickly","ramp-up period"],"related":["take on","kick off","spin up","roll out"],"tip":"'ramp-up period'(적응 기간)는 온보딩 이야기에서 자주 나옴"},{"id":"d02-D25","day":2,"level":2,"set":"D","family":"F2","word":"spin up","pos":"phrasal verb","ipa":"/ˌspɪn ˈʌp/","meaning_ko":"(서버·환경을) 띄우다","category":"it","etymology":{"parts":[{"text":"spin","type":"part","gloss":"돌리다"},{"text":" up","type":"part","gloss":"위로·작동 상태로"}],"story":"(디스크·엔진을) 돌려 속도를 올리다 → 작동 상태로 만들다 → 서버·환경을 띄우다"},"example":{"q":"How do you test changes before merging?","a":"Each pull request spins up a temporary environment, so reviewers can try the feature before we merge it.","a_ko":"풀 리퀘스트마다 임시 환경이 자동으로 떠서, 리뷰어가 병합 전에 기능을 직접 써 볼 수 있습니다."},"collocations":["spin up a server","spin up an instance","spin up a cluster"],"related":["set up","roll out","ramp up","kick off"],"tip":"반대말은 spin down / tear down(내리다, 정리하다)"},{"id":"d03-A01","day":3,"level":1,"set":"A","family":"F3","word":"position","pos":"noun","ipa":"/pəˈzɪʃən/","meaning_ko":"직무, 자리, 입장","category":"interview","etymology":{"parts":[{"text":"posit","type":"root","gloss":"놓다 (pon)"},{"text":"ion","type":"suffix","gloss":"~것"}],"story":"놓인 곳 → 자리 → 직책·입장"},"example":{"q":"Why are you interested in this position?","a":"This position matches my backend experience and my interest in cloud systems.","a_ko":"이 직무가 제 백엔드 경력과 클라우드 시스템에 대한 관심에 잘 맞기 때문입니다."},"collocations":["apply for a position","in a good position to","my position on"],"related":["positive","component","proposal","composure"],"tip":"job보다 격식 있는 말. role과 함께 면접에서 가장 자주 쓰임"},{"id":"d03-A02","day":3,"level":1,"set":"A","family":"F3","word":"positive","pos":"adjective","ipa":"/ˈpɑːzətɪv/","meaning_ko":"긍정적인, 확신하는","category":"interview","etymology":{"parts":[{"text":"posit","type":"root","gloss":"놓다 (pon)"},{"text":"ive","type":"suffix","gloss":"~한"}],"story":"(규칙으로) 놓여 정해진 → 확실한 → 긍정적인"},"example":{"q":"How would your previous team describe you?","a":"They would say I stay positive and calm, even when deadlines are tight.","a_ko":"마감이 빠듯할 때도 긍정적이고 침착하다고 말할 것 같습니다."},"collocations":["positive attitude","positive impact","stay positive"],"related":["position","opposite","proposal","postpone"],"tip":"'I'm positive.'는 '확신합니다'라는 뜻도 됨"},{"id":"d03-A03","day":3,"level":1,"set":"A","family":"F3","word":"purpose","pos":"noun","ipa":"/ˈpɝːpəs/","meaning_ko":"목적, 의도","category":"interview","etymology":{"parts":[{"text":"pur","type":"prefix","gloss":"앞에 (pro)"},{"text":"pose","type":"root","gloss":"놓다 (pos)"}],"story":"앞에 내놓은 것 → 이루려고 세운 목표 → 목적"},"example":{"q":"What gives you a sense of purpose at work?","a":"Building tools that save my teammate
