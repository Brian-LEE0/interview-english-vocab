"d08-B25","day":8,"level":1,"set":"B","family":"F8","word":"deal with","pos":"phrasal verb","ipa":"/ˈdiːl wɪð/","meaning_ko":"다루다, 처리하다","category":"interview","etymology":{"parts":[{"text":"deal","type":"part","gloss":"나누어 주다 (고대 영어 dælan)"},{"text":"with","type":"part","gloss":"~와"}],"story":"(몫을) 나누어 주다 → 맡아서 처리하다 → 다루다"},"example":{"q":"How do you deal with stress?","a":"I deal with stress by planning my week and taking short walks.","a_ko":"한 주 계획을 세우고 짧게 산책하면서 스트레스를 다스립니다."},"collocations":["deal with stress","deal with a problem","deal with customers"],"related":["sort out","narrow down","look into"],"tip":"handle 과 거의 같은 뜻. 과거형 dealt [델트]"},{"id":"d08-C01","day":8,"level":1,"set":"C","family":"F8","word":"solve","pos":"verb","ipa":"/sɑːlv/","meaning_ko":"(문제를) 풀다, 해결하다","category":"interview","etymology":{"parts":[{"text":"solve","type":"root","gloss":"풀다 (solv)"}],"story":"묶인 것을 풀다 → 문제를 풀다"},"example":{"q":"What kind of problems do you enjoy?","a":"I like to solve performance problems because the results are easy to measure.","a_ko":"결과를 쉽게 측정할 수 있어서 성능 문제를 푸는 것을 좋아합니다."},"collocations":["solve a problem","problem-solving skills"],"related":["solution","resolve","dissolve","analysis"],"tip":"명사 '문제 해결력'은 problem-solving skills"},{"id":"d08-C02","day":8,"level":1,"set":"C","family":"F8","word":"solution","pos":"noun","ipa":"/səˈluːʃən/","meaning_ko":"해결책, 솔루션","category":"it","etymology":{"parts":[{"text":"solu","type":"root","gloss":"풀다 (solv)"},{"text":"tion","type":"suffix","gloss":"~것"}],"story":"푼 것 → 해답, 해결책"},"example":{"q":"How did you fix the slow page?","a":"My solution was to cache the results and load images lazily.","a_ko":"결과를 캐싱하고 이미지를 지연 로딩하는 것이 제 해결책이었습니다."},"collocations":["come up with a solution","a quick solution","solution to a problem"],"related":["solve","resolution","absolute","dissolve"],"tip":"solution to a problem — 전치사는 to"},{"id":"d08-C03","day":8,"level":2,"set":"C","family":"F8","word":"resolve","pos":"verb","ipa":"/rɪˈzɑːlv/","meaning_ko":"(문제·충돌을) 해결하다, (이름을) 해석하다","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시, 완전히"},{"text":"solve","type":"root","gloss":"풀다 (solv)"}],"story":"완전히 풀다 → 엉킨 문제·충돌을 매듭짓다"},"example":{"q":"How do you handle merge conflicts?","a":"I resolve merge conflicts by talking to the other author first, so we don't overwrite each other's work.","a_ko":"머지 충돌은 상대 작성자와 먼저 이야기한 뒤에 해결해서, 서로의 작업을 덮어쓰지 않게 합니다."},"collocations":["resolve a conflict","resolve an issue","resolve a dependency"],"related":["resolution","solve","dissolve","absolve"],"tip":"solve(정답을 찾다)보다 '이슈를 매듭짓다'에 가까움. DNS에서는 이름을 '해석하다'"},{"id":"d08-C04","day":8,"level":1,"set":"C","family":"F8","word":"resolution","pos":"noun","ipa":"/ˌrezəˈluːʃən/","meaning_ko":"해결, 결심","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시, 완전히"},{"text":"solu","type":"root","gloss":"풀다 (solv)"},{"text":"tion","type":"suffix","gloss":"~것"}],"story":"완전히 풂 → 해결 → (마음을 풀어 정함) 결심"},"example":{"q":"How do you handle conflict with a coworker?","a":"I talk to them privately and focus on a resolution, not on who was right.","a_ko":"따로 이야기하면서, 누가 옳았는지보다 해결에 집중합니다."},"collocations":["conflict resolution","reach a resolution","screen resolution"],"related":["resolve","solution","solve"],"tip":"'결심'(New Year's resolution), 화면 '해상도' 뜻도 있음"},{"id":"d08-C05","day":8,"level":1,"set":"C","family":"F8","word":"dissolve","pos":"verb","ipa":"/dɪˈzɑːlv/","meaning_ko":"(조직을) 해체하다, 녹이다","category":"interview","etymology":{"parts":[{"text":"dis","type":"prefix","gloss":"떨어져"},{"text":"solve","type":"root","gloss":"풀다 (solv)"}],"story":"풀어서 흩어지게 하다 → 녹이다 → (조직을) 해체하다"},"example":{"q":"Why did you change teams?","a":"Our team was dissolved after a reorganization, so I moved to the payments team.","a_ko":"조직 개편으로 팀이 해체되어 결제 팀으로 옮겼습니다."},"collocations":["dissolve a team","dissolve a partnership"],"related":["solve","resolve","absolve"],"tip":"팀 해체를 담담하게 설명할 때 좋은 단어"},{"id":"d08-C06","day":8,"level":1,"set":"C","family":"F8","word":"absolute","pos":"adjective","ipa":"/ˈæbsəluːt/","meaning_ko":"절대적인, (경로가) 절대의","category":"it","etymology":{"parts":[{"text":"ab","type":"prefix","gloss":"떨어져"},{"text":"solute","type":"root","gloss":"풀린 (solv)"}],"story":"묶임에서 풀려난 → 아무 조건에도 매이지 않은 → 절대적인"},"example":{"q":"What caused the bug in the build script?","a":"The script used a relative path, so I switched it to an absolute path.","a_ko":"스크립트가 상대 경로를 쓰고 있어서 절대 경로로 바꿨습니다."},"collocations":["absolute path","absolute priority","absolute value"],"related":["absolutely","absolve","solve","dissolve"],"tip":"relative(상대적인)와 짝으로 외우기"},{"id":"d08-C07","day":8,"level":1,"set":"C","family":"F8","word":"absolutely","pos":"adverb","ipa":"/ˌæbsəˈluːtli/","meaning_ko":"물론이죠, 전적으로","category":"interview","etymology":{"parts":[{"text":"ab","type":"prefix","gloss":"떨어져"},{"text":"solute","type":"root","gloss":"풀린 (solv)"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"조건에 매이지 않게 → 완전히 → (대답) 물론이죠"},"example":{"q":"Would you be willing to mentor new hires?","a":"Absolutely. I mentored two interns last year, and I really enjoyed it.","a_ko":"물론입니다. 작년에 인턴 두 명을 멘토링했는데 정말 즐거웠습니다."},"collocations":["absolutely right","absolutely necessary"],"related":["absolute","absolve","solve"],"tip":"Yes 대신 Absolutely! 라고 답하면 적극적으로 들림. 강세는 [루ː]"},{"id":"d08-C08","day":8,"level":3,"set":"C","family":"F8","word":"absolve","pos":"verb","ipa":"/əbˈzɑːlv/","meaning_ko":"(책임에서) 면제하다, 벗어나게 하다","category":"interview","etymology":{"parts":[{"text":"ab","type":"prefix","gloss":"떨어져"},{"text":"solve","type":"root","gloss":"풀다 (solv)"}],"story":"묶임에서 떼어 풀어 주다 → 책임·죄에서 벗어나게 하다"},"example":{"q":"Tell me about a failure you were part of.","a":"Even though the bug came from another team's library, I didn't absolve myself; I added the tests that would have caught it.","a_ko":"버그가 다른 팀 라이브러리에서 왔지만 제 책임이 없다고 넘기지 않았고, 그 버그를 잡을 수 있었을 테스트를 추가했습니다."},"collocations":["absolve A of responsibility","absolve oneself"],"related":["absolute","absolutely","resolve","dissolve"],"tip":"absolve A of B = A를 B(책임)에서 면제하다. 책임감을 보여 줄 땐 부정문으로"},{"id":"d08-C09","day":8,"level":1,"set":"C","family":"F8","word":"analyze","pos":"verb","ipa":"/ˈænəlaɪz/","meaning_ko":"분석하다","category":"interview","etymology":{"parts":[{"text":"ana","type":"prefix","gloss":"위로, 완전히 (그리스어 ana)"},{"text":"lyze","type":"root","gloss":"풀다 (lys)"}],"story":"완전히 풀어 헤치다 → 분석하다"},"example":{"q":"How do you make decisions?","a":"I analyze the data first, then discuss the options with the team.","a_ko":"먼저 데이터를 분석한 다음, 팀과 선택지를 논의합니다."},"collocations":["analyze data","analyze the problem"],"related":["analysis","catalyst","paralysis","solve"],"tip":"영국식 철자는 analyse. 강세는 맨 앞 [애]"},{"id":"d08-C10","day":8,"level":2,"set":"C","family":"F8","word":"analysis","pos":"noun","ipa":"/əˈnæləsɪs/","meaning_ko":"분석","category":"it","etymology":{"parts":[{"text":"ana","type":"prefix","gloss":"위로, 완전히 (그리스어 ana)"},{"text":"lysis","type":"root","gloss":"풂 (lys)"}],"story":"완전히 풀어 헤침 → 분해 → 분석"},"example":{"q":"How did you decide which feature to remove?","a":"I did a usage analysis of our logs and found that only 2% of users used that feature, so we removed it.","a_ko":"로그로 사용 현황을 분석해 보니 그 기능을 쓰는 사용자가 2%뿐이어서 제거했습니다."},"collocations":["data analysis","root cause analysis","in-depth analysis"],"related":["analyze","catalyst","paralysis","resolve"],"tip":"복수형 analyses [어낼러시ː즈]. 강세는 둘째 음절 [낼]"},{"id":"d08-C11","day":8,"level":3,"set":"C","family":"F8","word":"catalyst","pos":"noun","ipa":"/ˈkætəlɪst/","meaning_ko":"촉매, (변화의) 계기가 되는 사람·일","category":"interview","etymology":{"parts":[{"text":"cata","type":"prefix","gloss":"아래로, 완전히 (그리스어 kata)"},{"text":"lyst","type":"root","gloss":"푸는 것 (lys)"}],"story":"완전히 풀어 헤치는 것(화학의 촉매) → 변화를 일으키는 계기"},"example":{"q":"What role do you usually play in a team?","a":"I often act as a catalyst for change; at my last job, my small CI experiment became the standard pipeline for five teams.","a_ko":"변화를 이끄는 촉매 역할을 자주 합니다. 이전 회사에서 제가 시작한 작은 CI 실험이 다섯 팀의 표준 파이프라인이 됐습니다."},"collocations":["a catalyst for change","act as a catalyst","serve as a catalyst"],"related":["catalyze","analysis","paralysis","analyze"],"tip":"변화의 계기가 된 사람·사건을 말할 때. 발음 [캐털리스트]"},{"id":"d08-C12","day":8,"level":2,"set":"C","family":"F8","word":"catalyze","pos":"verb","ipa":"/ˈkætəlaɪz/","meaning_ko":"(변화를) 촉진하다, 불러일으키다","category":"interview","etymology":{"parts":[{"text":"cata","type":"prefix","gloss":"아래로, 완전히 (그리스어 kata)"},{"text":"lyze","type":"root","gloss":"풀다 (lys)"}],"story":"촉매 작용을 하다 → 변화를 촉진하다"},"example":{"q":"What impact did your side project have?","a":"My internal demo catalyzed a wider discussion, and the team decided to adopt TypeScript.","a_ko":"제가 만든 사내 데모가 더 넓은 논의를 불러일으켰고, 팀이 TypeScript를 도입하기로 했습니다."},"collocations":["catalyze change","catalyze growth"],"related":["catalyst","analyze","paralyze"],"tip":"spark, trigger 와 비슷하지만 더 격식 있는 말"},{"id":"d08-C13","day":8,"level":3,"set":"C","family":"F8","word":"paralysis","pos":"noun","ipa":"/pəˈræləsɪs/","meaning_ko":"마비, (결정을 못 하는) 정체 상태","category":"interview","etymology":{"parts":[{"text":"para","type":"prefix","gloss":"옆으로 (그리스어 para)"},{"text":"lysis","type":"root","gloss":"풂 (lys)"}],"story":"(몸의) 한쪽이 풀려 버림 → 마비 → 아무것도 결정하지 못하는 상태"},"example":{"q":"How do you avoid overthinking decisions?","a":"To avoid analysis paralysis, I set a deadline for research, then pick the best option and plan a way to reverse it if needed.","a_ko":"분석만 하다가 결정을 못 하는 상황을 피하려고, 조사 기한을 정해 두고 가장 나은 선택지를 고른 뒤 필요하면 되돌릴 방법도 마련해 둡니다."},"collocations":["analysis paralysis","decision paralysis"],"related":["paralyze","analysis","catalyst"],"tip":"analysis paralysis 는 -lysis 가 두 번 들어간 운율 있는 표현"},{"id":"d08-C14","day":8,"level":2,"set":"C","family":"F8","word":"paralyze","pos":"verb","ipa":"/ˈpærəlaɪz/","meaning_ko":"마비시키다, 멈추게 하다","category":"it","etymology":{"parts":[{"text":"para","type":"prefix","gloss":"옆으로 (그리스어 para)"},{"text":"lyze","type":"root","gloss":"풀다 (lys)"}],"story":"(몸의) 한쪽을 풀어 버리다 → 마비시키다 → 시스템을 멈추게 하다"},"example":{"q":"What was the impact of the outage?","a":"A single misconfigured DNS record paralyzed our checkout service for about an hour.","a_ko":"잘못 설정된 DNS 레코드 하나 때문에 결제 서비스가 한 시간 가까이 마비됐습니다."},"collocations":["paralyze the system","be paralyzed by"],"related":["paralysis","analyze","catalyze"],"tip":"영국식 철자 paralyse. be paralyzed by fear = 두려움에 얼어붙다"},{"id":"d08-C15","day":8,"level":1,"set":"C","family":"F8","word":"decide","pos":"verb","ipa":"/dɪˈsaɪd/","meaning_ko":"결정하다","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"떨어져"},{"text":"cide","type":"root","gloss":"자르다 (cis/cid)"}],"story":"잘라 내다 → 다른 선택지를 잘라 내다 → 결정하다"},"example":{"q":"Why did you decide to apply here?","a":"I decided to apply because your team builds the tools I use every day.","a_ko":"제가 매일 쓰는 도구를 만드는 팀이라서 지원하기로 했습니다."},"collocations":["decide to do","decide on","decide between"],"related":["decisive","precise","concise","cement"],"tip":"명사 decision, 형용사 decisive 와 함께 외우기"},{"id":"d08-C16","day":8,"level":1,"set":"C","family":"F8","word":"decision","pos":"noun","ipa":"/dɪˈsɪʒən/","meaning_ko":"결정","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"떨어져"},{"text":"cis","type":"root","gloss":"자르다 (cis/cid)"},{"text":"ion","type":"suffix","gloss":"~것"}],"story":"잘라 냄 → 다른 선택지를 잘라 냄 → 결정"},"example":{"q":"What's a tough decision you made recently?","a":"I made the decision to delay our launch by a week to fix a security issue.","a_ko":"보안 문제를 고치려고 출시를 일주일 미루기로 결정했습니다."},"collocations":["make a decision","decision-making","data-driven decision"],"related":["decide","decisive","precise","concise"],"tip":"'결정을 내리다'는 make a decision (do 가 아님)"},{"id":"d08-C17","day":8,"level":2,"set":"C","family":"F8","word":"decisive","pos":"adjective","ipa":"/dɪˈsaɪsɪv/","meaning_ko":"결단력 있는, 결정적인","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"떨어져"},{"text":"cis","type":"root","gloss":"자르다 (cis/cid)"},{"text":"ive","type":"suffix","gloss":"~하는"}],"story":"딱 잘라 정하는 → 결단력 있는; 승부를 가르는 → 결정적인"},"example":{"q":"What's one of your strengths?","a":"I'm decisive under pressure; during incidents I make a call quickly and adjust as we learn more.","a_ko":"압박 속에서도 결단력이 있습니다. 장애 상황에서는 빨리 결정하고, 더 알게 되면 조정합니다."},"collocations":["decisive action","a decisive factor"],"related":["decide","precise","precision","concise"],"tip":"make a call = 결정을 내리다. 반대말 indecisive(우유부단한)"},{"id":"d08-C18","day":8,"level":1,"set":"C","family":"F8","word":"precise","pos":"adjective","ipa":"/prɪˈsaɪs/","meaning_ko":"정확한, 정밀한","category":"it","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"앞을"},{"text":"cise","type":"root","gloss":"자르다 (cis/cid)"}],"story":"앞을 잘라 낸 → 군더더기 없는 → 딱 떨어지게 정확한"},"example":{"q":"What makes a good bug report?","a":"A good bug report has precise steps to reproduce the problem.","a_ko":"좋은 버그 리포트에는 문제를 재현하는 정확한 절차가 있습니다."},"collocations":["precise steps","to be precise","precise requirements"],"related":["precision","concise","decide","decisive"],"tip":"accurate(틀리지 않은)와 달리 precise 는 '세밀하고 딱 떨어지는'"},{"id":"d08-C19","day":8,"level":1,"set":"C","family":"F8","word":"precisely","pos":"adverb","ipa":"/prɪˈsaɪsli/","meaning_ko":"바로, 정확히","category":"interview","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"앞을"},{"text":"cise","type":"root","gloss":"자르다 (cis/cid)"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"앞을 잘라 내어 딱 맞게 → 정확히 → 바로 그것"},"example":{"q":"You'd have to wear many hats here. Is that okay?","a":"Yes, that's precisely why I applied; I want to own features from start to finish.","a_ko":"네, 바로 그 점 때문에 지원했습니다. 기능을 처음부터 끝까지 맡아 보고 싶습니다."},"collocations":["precisely because","precisely why"],"related":["precise","precision","concise","decide"],"tip":"That's precisely why ~ = 바로 그래서 ~ (이유를 강조할 때)"},{"id":"d08-C20","day":8,"level":2,"set":"C","family":"F8","word":"precision","pos":"noun","ipa":"/prɪˈsɪʒən/","meaning_ko":"정밀함, 정밀도","category":"it","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"앞을"},{"text":"cis","type":"root","gloss":"자르다 (cis/cid)"},{"text":"ion","type":"suffix","gloss":"~것"}],"story":"앞을 잘라 냄 → 군더더기 없음 → 정밀함"},"example":{"q":"What did you learn working on the billing system?","a":"Billing taught me to value precision; we stored money as integers to avoid floating-point rounding errors.","a_ko":"빌링 시스템을 하며 정밀함의 중요성을 배웠습니다. 부동소수점 반올림 오차를 피하려고 금액을 정수로 저장했습니다."},"collocations":["with precision","precision and recall","high precision"],"related":["precise","concise","decisive"],"tip":"ML 평가 지표 precision(정밀도)·recall(재현율)도 이 단어"},{"id":"d08-C21","day":8,"level":2,"set":"C","family":"F8","word":"cement","pos":"verb","ipa":"/sɪˈment/","meaning_ko":"굳히다, 확고히 하다","category":"interview","etymology":{"parts":[{"text":"ce","type":"root","gloss":"자르다 (caed- → cis/cid)"},{"text":"ment","type":"suffix","gloss":"~것"}],"story":"잘라 낸 돌 조각(caementum) → 돌을 붙이는 시멘트 → 단단히 굳히다"},"example":{"q":"Why did you move into backend development?","a":"Building the payment API during my internship cemented my interest in backend systems, so I focused on it after that.","a_ko":"인턴 때 결제 API를 만들면서 백엔드에 대한 관심이 확고해져서, 그 뒤로 백엔드에 집중했습니다."},"collocations":["cement a relationship","cement one's interest","cement a position"],"related":["decide","concise","precise"],"tip":"명사는 '시멘트', 동사는 '굳히다'. 강세는 뒤 [멘]"},{"id":"d08-C22","day":8,"level":2,"set":"C","family":"F8","word":"excise","pos":"verb","ipa":"/ɪkˈsaɪz/","meaning_ko":"도려내다, 잘라 내다","category":"it","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"cise","type":"root","gloss":"자르다 (cis/cid)"}],"story":"밖으로 잘라 내다 → 도려내다"},"example":{"q":"What did you do to clean up the legacy codebase?","a":"I excised about two thousand lines of dead code, which made the module much easier to test.","a_ko":"죽은 코드 약 2천 줄을 도려내서 모듈을 훨씬 쉽게 테스트할 수 있게 했습니다."},"collocations":["excise dead code","excise a dependency"],"related":["concise","precise","decide"],"tip":"remove 보다 '깔끔하게 도려내다'. 명사 excise(물품세)는 어원이 다른 말"},{"id":"d08-C23","day":8,"level":1,"set":"C","family":"F8","word":"look into","pos":"phrasal verb","ipa":"/lʊk ˈɪntuː/","meaning_ko":"조사하다, 알아보다","category":"interview","etymology":{"parts":[{"text":"look","type":"part","gloss":"보다"},{"text":"into","type":"part","gloss":"안으로"}],"story":"안을 들여다보다 → 조사하다, 알아보다"},"example":{"q":"What would you do if a customer reported a slow page?","a":"I would look into the logs first to see when the slowdown started.","a_ko":"먼저 로그를 들여다보고 언제부터 느려졌는지 확인하겠습니다."},"collocations":["look into it","look into the issue"],"related":["narrow down","troubleshoot","sort out"],"tip":"I'll look into it. = 확인해 보겠습니다 (바로 답하기 어려운 질문에 안전한 답)"},{"id":"d08-C24","day":8,"level":2,"set":"C","family":"F8","word":"stopgap","pos":"noun","ipa":"/ˈstɑːpɡæp/","meaning_ko":"임시방편, 땜질 처방","category":"it","etymology":{"parts":[{"text":"stop","type":"part","gloss":"막다"},{"text":"gap","type":"part","gloss":"틈"}],"story":"틈을 막는 것 → 제대로 고치기 전까지의 임시방편"},"example":{"q":"What did you do when the vendor API had a bug?","a":"As a stopgap, I added retries for failed calls, and then reported the bug to the vendor.","a_ko":"임시방편으로 실패한 호출에 재시도를 넣고, 업체에 버그를 보고했습니다."},"collocations":["as a stopgap","a stopgap measure","stopgap solution"],"related":["troubleshoot","root cause","bottleneck"],"tip":"근본 해결이 아닌 '땜질 처방'. 형용사로도 씀(a stopgap fix)"},{"id":"d08-C25","day":8,"level":2,"set":"C","family":"F8","word":"troubleshoot","pos":"verb","ipa":"/ˈtrʌblʃuːt/","meaning_ko":"(문제의 원인을 찾아) 해결하다","category":"it","etymology":{"parts":[{"text":"trouble","type":"part","gloss":"고장, 문제"},{"text":"shoot","type":"part","gloss":"쏘다"}],"story":"troubleshooter(전신·전화선 고장을 찾아 고치던 사람)에서 나온 말 → 문제 원인을 찾아 해결하다"},"example":{"q":"What's your approach when a service suddenly fails?","a":"I troubleshoot from the outside in: I check the alerts and dashboards, then the logs, and finally the recent changes.","a_ko":"바깥에서 안쪽으로 원인을 좁혀 갑니다. 알림과 대시보드를 먼저 보고, 그다음 로그, 마지막으로 최근 변경 사항을 봅니다."},"collocations":["troubleshoot an issue","troubleshooting steps"],"related":["stopgap","root cause","look into"],"tip":"과거형 troubleshot. 명사는 troubleshooting"},{"id":"d08-D01","day":8,"level":1,"set":"D","family":"F8","word":"fraction","pos":"noun","ipa":"/ˈfrækʃən/","meaning_ko":"일부, 아주 적은 양","category":"it","etymology":{"parts":[{"text":"fract","type":"root","gloss":"깨다 (fract/frag)"},{"text":"ion","type":"suffix","gloss":"~것"}],"story":"깨진 조각 → 전체의 일부 → 분수"},"example":{"q":"What was the result of your optimization?","a":"The new query runs in a fraction of the time the old one took.","a_ko":"새 쿼리는 예전 쿼리에 걸리던 시간의 극히 일부만으로 실행됩니다."},"collocations":["a fraction of the time","a fraction of the cost","a small fraction"],"related":["fractional","fracture","fragile","infringe"],"tip":"a fraction of the time/cost = 훨씬 적은 시간·비용 — 성과를 말할 때 딱"},{"id":"d08-D02","day":8,"level":2,"set":"D","family":"F8","word":"fractional","pos":"adjective","ipa":"/ˈfrækʃənl/","meaning_ko":"일부의, 분수의","category":"it","etymology":{"parts":[{"text":"fract","type":"root","gloss":"깨다 (fract/frag)"},{"text":"ion","type":"suffix","gloss":"~것"},{"text":"al","type":"suffix","gloss":"~의"}],"story":"깨진 조각의 → 전체가 아닌 일부의"},"example":{"q":"How do you keep cloud costs down?","a":"We request fractional CPU for small services, like a quarter of a core, instead of giving every pod a full one.","a_ko":"작은 서비스에는 코어 하나를 통째로 주지 않고, 4분의 1 코어처럼 CPU를 일부만 할당합니다."},"collocations":["fractional CPU","fractional ownership"],"related":["fraction","fracture","fragile"],"tip":"Kubernetes에서 CPU를 0.25처럼 쪼개서 줄 때 씀"},{"id":"d08-D03","day":8,"level":1,"set":"D","family":"F8","word":"fragile","pos":"adjective","ipa":"/ˈfrædʒəl/","meaning_ko":"깨지기 쉬운, 취약한","category":"it","etymology":{"parts":[{"text":"frag","type":"root","gloss":"깨다 (fract/frag)"},{"text":"ile","type":"suffix","gloss":"~하기 쉬운"}],"story":"깨지기 쉬운 → 조금만 건드려도 망가지는"},"example":{"q":"What was wrong with the old test suite?","a":"The old tests were fragile, so small UI changes broke dozens of them.","a_ko":"예전 테스트는 취약해서 UI를 조금만 바꿔도 수십 개가 깨졌습니다."},"collocations":["fragile code","fragile tests"],"related":["fragility","fraction","fracture"],"tip":"발음 미국식 [프래절], 영국식 [프래자일]"},{"id":"d08-D04","day":8,"level":2,"set":"D","family":"F8","word":"fragility","pos":"noun","ipa":"/frəˈdʒɪləti/","meaning_ko":"취약함, 깨지기 쉬움","category":"it","etymology":{"parts":[{"text":"frag","type":"root","gloss":"깨다 (fract/frag)"},{"text":"il","type":"suffix","gloss":"~하기 쉬운"},{"text":"ity","type":"suffix","gloss":"~함 (성질)"}],"story":"깨지기 쉬움 → 취약함"},"example":{"q":"Why did you push for a redesign?","a":"The system's fragility was slowing us down; any small change risked an outage, so I proposed splitting it into modules.","a_ko":"시스템이 너무 취약해서 작은 변경에도 장애 위험이 있었고, 그래서 모듈로 나누자고 제안했습니다."},"collocations":["system fragility","reduce fragility"],"related":["fragile","fraction","fracture"],"tip":"반대 개념은 robustness(견고함)"},{"id":"d08-D05","day":8,"level":2,"set":"D","family":"F8","word":"fracture","pos":"verb","ipa":"/ˈfræktʃər/","meaning_ko":"(조직이) 갈라지다, 금이 가다","category":"interview","etymology":{"parts":[{"text":"fract","type":"root","gloss":"깨다 (fract/frag)"},{"text":"ure","type":"suffix","gloss":"~것"}],"story":"깨짐 → (뼈의) 골절 → (조직이) 금 가고 갈라지다"},"example":{"q":"How did you bring the team together after the reorg?","a":"The team had started to fracture into small groups, so I set up shared on-call shifts to get people working together again.","a_ko":"팀이 작은 무리들로 갈라지기 시작해서, 다시 함께 일하도록 공동 온콜 당번을 만들었습니다."},"collocations":["fracture into groups","a fractured team"],"related":["fraction","fragile","infringe"],"tip":"원래 '뼈가 부러지다'. fracture into ~ = 여러 무리로 갈라지다"},{"id":"d08-D06","day":8,"level":2,"set":"D","family":"F8","word":"infringement","pos":"noun","ipa":"/ɪnˈfrɪndʒmənt/","meaning_ko":"(권리·라이선스) 침해","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안으로"},{"text":"fringe","type":"root","gloss":"깨다 (fract/frag)"},{"text":"ment","type":"suffix","gloss":"~것"}],"story":"안으로 깨고 들어감 → 남의 권리를 침해함"},"example":{"q":"Why did you replace that image library?","a":"Its license was unclear, and our legal team worried about infringement, so we switched to an MIT-licensed library.","a_ko":"라이선스가 불분명해서 법무팀이 침해를 우려했고, 그래서 MIT 라이선스 라이브러리로 바꿨습니다."},"collocations":["copyright infringement","patent infringement"],"related":["infringe","fracture","fraction"],"tip":"법무·라이선스 이야기에서 자주 나오는 명사"},{"id":"d08-D07","day":8,"level":3,"set":"D","family":"F8","word":"infringe","pos":"verb","ipa":"/ɪnˈfrɪndʒ/","meaning_ko":"(권리·라이선스를) 침해하다","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안으로"},{"text":"fringe","type":"root","gloss":"깨다 (fract/frag)"}],"story":"안으로 깨고 들어가다 → 남의 권리·규칙을 침해하다"},"example":{"q":"How do you handle open-source licenses?","a":"Before we shipped, I audited our dependencies to make sure we didn't infringe any GPL licenses in our commercial product.","a_ko":"출시 전에 의존성을 점검해서, 상용 제품이 GPL 라이선스를 침해하지 않는지 확인했습니다."},"collocations":["infringe a patent","infringe on privacy","infringe copyright"],"related":["infringement","fraction","fracture","fragile"],"tip":"frangere(깨다)가 fring 으로 바뀐 꼴. infringe on/upon ~ 형태로도 씀"},{"id":"d08-D08","day":8,"level":1,"set":"D","family":"F8","word":"sector","pos":"noun","ipa":"/ˈsektər/","meaning_ko":"부문, 분야","category":"interview","etymology":{"parts":[{"text":"sect","type":"root","gloss":"자르다 (sect)"},{"text":"or","type":"suffix","gloss":"~하는 것"}],"story":"자르는 것 → (원을 잘라 낸) 부채꼴 → 잘라 나눈 영역 → 산업 부문"},"example":{"q":"Why do you want to move into fintech?","a":"I've worked in the public sector for three years, and now I want faster product cycles.","a_ko":"공공 부문에서 3년 일했고, 이제는 제품 주기가 더 빠른 곳에서 일하고 싶습니다."},"collocations":["public sector","private sector","financial sector"],"related":["intersection","dissect","segment","bisect"],"tip":"industry 보다 넓은 '부문'. public/private sector 로 많이 씀"},{"id":"d08-D09","day":8,"level":1,"set":"D","family":"F8","word":"intersection","pos":"noun","ipa":"/ˌɪntərˈsekʃən/","meaning_ko":"교차점, 만나는 지점","category":"interview","etymology":{"parts":[{"text":"inter","type":"prefix","gloss":"사이에"},{"text":"sect","type":"root","gloss":"자르다 (sect)"},{"text":"ion","type":"suffix","gloss":"~것"}],"story":"사이를 가르며 만나는 곳 → 교차로, 교차점"},"example":{"q":"Why are you interested in this role?","a":"This role is at the intersection of data and product, where I want to grow.","a_ko":"이 직무는 데이터와 제품이 만나는 지점에 있고, 제가 성장하고 싶은 곳이 바로 거기입니다."},"collocations":["at the intersection of","intersection of sets"],"related":["intersect","sector","dissect","segment"],"tip":"at the intersection of A and B = A와 B가 만나는 지점 — 지원 동기에 좋음"},{"id":"d08-D10","day":8,"level":2,"set":"D","family":"F8","word":"intersect","pos":"verb","ipa":"/ˌɪntərˈsekt/","meaning_ko":"교차하다, 교집합을 구하다","category":"it","etymology":{"parts":[{"text":"inter","type":"prefix","gloss":"사이에"},{"text":"sect","type":"root","gloss":"자르다 (sect)"}],"story":"사이를 가르다 → 서로 가로지르다 → 겹치는 부분을 구하다"},"example":{"q":"How did you find users affected by both bugs?","a":"I intersected the two lists of user IDs in SQL, which showed only 40 users were hit by both.","a_ko":"SQL로 두 사용자 ID 목록의 교집합을 구했더니, 두 버그를 모두 겪은 사용자는 40명뿐이었습니다."},"collocations":["intersect with","sets intersect"],"related":["intersection","sector","bisect"],"tip":"SQL 의 INTERSECT = 두 결과에 공통으로 있는 행"},{"id":"d08-D11","day":8,"level":2,"set":"D","family":"F8","word":"dissect","pos":"verb","ipa":"/dɪˈsekt/","meaning_ko":"(꼼꼼히) 뜯어보다, 해부하다","category":"interview","etymology":{"parts":[{"text":"dis","type":"prefix","gloss":"떨어져"},{"text":"sect","type":"root","gloss":"자르다 (sect)"}],"story":"갈라서 떼어 내다 → 해부하다 → 하나하나 뜯어보며 분석하다"},"example":{"q":"How do you learn from incidents?","a":"After every incident, we dissect the timeline minute by minute to see where we lost time.","a_ko":"장애가 끝나면 타임라인을 분 단위로 뜯어보며 어디서 시간을 잃었는지 확인합니다."},"collocations":["dissect a problem","dissect the data"],"related":["intersection","sector","segment","bisect"],"tip":"발음 [디섹트]·[다이섹트] 둘 다. analyze 보다 '하나하나 뜯어보다' 느낌"},{"id":"d08-D12","day":8,"level":2,"set":"D","family":"F8","word":"segment","pos":"noun","ipa":"/ˈseɡmənt/","meaning_ko":"구획, (고객·사용자) 층","category":"it","etymology":{"parts":[{"text":"seg","type":"root","gloss":"자르다 (sect)"},{"text":"ment","type":"suffix","gloss":"~것"}],"story":"잘라 낸 조각 → 구획 → 나눠 놓은 사용자층"},"example":{"q":"How did you decide where to launch the feature first?","a":"We launched it to a small segment of users first, because we wanted real feedback before a full rollout.","a_ko":"전체 출시 전에 실제 피드백을 받고 싶어서, 먼저 일부 사용자층에게만 공개했습니다."},"collocations":["user segment","customer segment","network segment"],"related":["segmentation","sector","dissect","intersection"],"tip":"명사 강세는 앞 [세그먼트]. 동사로도 씀(segment users)"},{"id":"d08-D13","day":8,"level":2,"set":"D","family":"F8","word":"segmentation","pos":"noun","ipa":"/ˌseɡmenˈteɪʃən/","meaning_ko":"분할, (망) 분리, 세분화","category":"it","etymology":{"parts":[{"text":"seg","type":"root","gloss":"자르다 (sect)"},{"text":"ment","type":"suffix","gloss":"~것"},{"text":"ation","type":"suffix","gloss":"~하기"}],"story":"잘라 낸 조각으로 나누기 → 분할, 세분화"},"example":{"q":"How do you secure internal services?","a":"We use network segmentation, so even if one service is compromised, the attacker can't reach the database directly.","a_ko":"네트워크를 분리해 두어서, 서비스 하나가 뚫려도 공격자가 DB에 바로 접근할 수 없습니다."},"collocations":["network segmentation","customer segmentation"],"related":["segment","sector","intersect"],"tip":"보안(망 분리)과 마케팅(고객 세분화) 양쪽에서 씀"},{"id":"d08-D14","day":8,"level":3,"set":"D","family":"F8","word":"bisect","pos":"verb","ipa":"/baɪˈsekt/","meaning_ko":"둘로 나누다, (git bisect로) 범위를 반씩 좁히다","category":"it","etymology":{"parts":[{"text":"bi","type":"prefix","gloss":"둘로"},{"text":"sect","type":"root","gloss":"자르다 (sect)"}],"story":"둘로 자르다 → 범위를 반씩 잘라 가며 원인을 찾다"},"example":{"q":"How did you find which commit introduced the bug?","a":"I used git bisect to split the 200 commits in half repeatedly, and found the bad commit in about eight steps.","a_ko":"git bisect로 커밋 200개를 계속 반으로 나눠서, 여덟 번 정도 만에 문제 커밋을 찾았습니다."},"collocations":["git bisect","bisect a range"],"related":["dissect","intersect","segment","sector"],"tip":"이분 탐색(binary search)을 커밋 이력에 적용한 것"},{"id":"d08-D15","day":8,"level":1,"set":"D","family":"F8","word":"concise","pos":"adjective","ipa":"/kənˈsaɪs/","meaning_ko":"간결한","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"완전히 (com)"},{"text":"cise","type":"root","gloss":"자르다 (cis/cid)"}],"story":"완전히 잘라 다듬은 → 군더더기 없는 → 간결한"},"example":{"q":"How do you write documentation?","a":"I keep my documents concise and put the key points at the top.","a_ko":"문서는 간결하게 쓰고, 핵심은 맨 위에 둡니다."},"collocations":["concise summary","clear and concise"],"related":["concisely","precise","decide"],"tip":"clear and concise 는 짝으로 자주 씀"},{"id":"d08-D16","day":8,"level":1,"set":"D","family":"F8","word":"concisely","pos":"adverb","ipa":"/kənˈsaɪsli/","meaning_ko":"간결하게","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"완전히 (com)"},{"text":"cise","type":"root","gloss":"자르다 (cis/cid)"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"완전히 잘라 다듬어서 → 간결하게"},"example":{"q":"Can you briefly summarize your experience?","a":"Sure, let me put it concisely: five years of backend work, mostly Java and AWS.","a_ko":"네, 간결하게 말씀드리면 백엔드 5년, 주로 Java와 AWS입니다."},"collocations":["put it concisely","explain concisely"],"related":["concise","precise","decide"],"tip":"To put it concisely, … 로 요약을 시작할 수 있음"},{"id":"d08-D17","day":8,"level":1,"set":"D","family":"F8","word":"particular","pos":"adjective","ipa":"/pərˈtɪkjələr/","meaning_ko":"특정한, 특별한","category":"interview","etymology":{"parts":[{"text":"parti","type":"root","gloss":"부분 (part)"},{"text":"cul","type":"suffix","gloss":"작은 (-cula)"},{"text":"ar","type":"suffix","gloss":"~의"}],"story":"작은 부분(particula)의 → 콕 집은 → 특정한"},"example":{"q":"What do you enjoy about backend work?","a":"In particular, I enjoy designing database schemas for complex data.","a_ko":"특히 복잡한 데이터를 위한 DB 스키마 설계를 좋아합니다."},"collocations":["in particular","a particular case","be particular about"],"related":["particularly","participate","partner","department"],"tip":"be particular about ~ = ~에 까다롭다, 꼼꼼하다"},{"id":"d08-D18","day":8,"level":1,"set":"D","family":"F8","word":"particularly","pos":"adverb","ipa":"/pərˈtɪkjələrli/","meaning_ko":"특히","category":"interview","etymology":{"parts":[{"text":"parti","type":"root","gloss":"부분 (part)"},{"text":"cul","type":"suffix","gloss":"작은 (-cula)"},{"text":"ar","type":"suffix","gloss":"~의"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"작은 부분을 콕 집어 → 특히"},"example":{"q":"Which of your projects are you proudest of?","a":"I'm particularly proud of our search feature because I led it from start to finish.","a_ko":"처음부터 끝까지 제가 주도한 검색 기능이 특히 자랑스럽습니다."},"collocations":["particularly proud","particularly important"],"related":["particular","participate","partner"],"tip":"especially 와 같은 뜻. 발음 [퍼티큘러리]"},{"id":"d08-D19","day":8,"level":1,"set":"D","family":"F8","word":"partner","pos":"verb","ipa":"/ˈpɑːrtnər/","meaning_ko":"협력하다, 파트너가 되다","category":"interview","etymology":{"parts":[{"text":"part","type":"root","gloss":"몫, 부분 (part)"},{"text":"ner","type":"suffix","gloss":"~하는 사람 (parcener에서)"}],"story":"몫을 나눠 갖는 사람(parcener)이 part 의 영향으로 바뀐 말 → 동업자 → 협력하다"},"example":{"q":"How do you work with product managers?","a":"I partner with product managers to turn user feedback into small experiments.","a_ko":"제품 매니저와 협력해서 사용자 피드백을 작은 실험으로 바꿉니다."},"collocations":["partner with","business partner"],"related":["partnership","participate","counterpart","party"],"tip":"동사로 partner with ~ = ~와 손잡고 일하다"},{"id":"d08-D20","day":8,"level":1,"set":"D","family":"F8","word":"partnership","pos":"noun","ipa":"/ˈpɑːrtnərʃɪp/","meaning_ko":"협력 관계, 동업","category":"interview","etymology":{"parts":[{"text":"part","type":"root","gloss":"몫, 부분 (part)"},{"text":"ner","type":"suffix","gloss":"~하는 사람 (parcener에서)"},{"text":"ship","type":"suffix","gloss":"관계, 상태"}],"story":"몫을 나눠 갖는 사람들의 관계 → 협력 관계"},"example":{"q":"How did you work with the QA team?","a":"We built a strong partnership with QA by writing test plans together.","a_ko":"테스트 계획을 함께 작성하면서 QA 팀과 탄탄한 협력 관계를 만들었습니다."},"collocations":["build a partnership","in partnership with"],"related":["partner","participate","counterpart"],"tip":"in partnership with ~ = ~와 손잡고"},{"id":"d08-D21","day":8,"level":1,"set":"D","family":"F8","word":"department","pos":"noun","ipa":"/dɪˈpɑːrtmənt/","meaning_ko":"부서","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"떨어져"},{"text":"part","type":"root","gloss":"나누다 (part)"},{"text":"ment","type":"suffix","gloss":"~것"}],"story":"떼어 나눈 것 → 나뉜 조직 단위 → 부서"},"example":{"q":"Who did you work with most?","a":"I worked most with the sales department to fix issues in our ordering system.","a_ko":"주문 시스템 문제를 해결하려고 영업 부서와 가장 많이 일했습니다."},"collocations":["sales department","IT department","cross-department"],"related":["departure","partner","party","partial"],"tip":"division(사업부)보다 작은 단위인 '부서'"},{"id":"d08-D22","day":8,"level":1,"set":"D","family":"F8","word":"departure","pos":"noun","ipa":"/dɪˈpɑːrtʃər/","meaning_ko":"떠남, 퇴사, (기존 방식에서) 벗어남","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"떨어져"},{"text":"part","type":"root","gloss":"나누다 (part)"},{"text":"ure","type":"suffix","gloss":"~것"}],"story":"떨어져 나뉨 → 떠남 → (방식에서) 벗어남"},"example":{"q":"Why did you leave your last company?","a":"My departure was mainly about growth; I wanted to lead a team.","a_ko":"이직은 주로 성장 때문이었습니다. 팀을 이끌어 보고 싶었습니다."},"collocations":["a departure from","sudden departure"],"related":["department","partner","apart"],"tip":"a departure from ~ = ~에서 벗어난 새로운 방식"},{"id":"d08-D23","day":8,"level":3,"set":"D","family":"F8","word":"compartmentalize","pos":"verb","ipa":"/kəmˌpɑːrtˈmentəlaɪz/","meaning_ko":"(일·감정을) 칸칸이 나눠 관리하다","category":"interview","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"함께, 완전히"},{"text":"part","type":"root","gloss":"나누다 (part)"},{"text":"ment","type":"suffix","gloss":"~것"},{"text":"al","type":"suffix","gloss":"~의"},{"text":"ize","type":"suffix","gloss":"~하게 하다"}],"story":"완전히 나눈 칸(compartment) → 칸칸이 나눠 두다 → 일과 감정을 따로 떼어 관리하다"},"example":{"q":"How do you handle stress during a busy release?","a":"I compartmentalize: I block focus time for the release and keep other requests in a list, so I can still respond to them later.","a_ko":"일을 칸칸이 나눠서 관리합니다. 릴리스에 집중할 시간을 따로 잡고, 다른 요청은 목록에 모아 두었다가 나중에 대응합니다."},"collocations":["compartmentalize work","compartmentalize stress"],"related":["department","partner","particular","apart"],"tip":"장점으로는 집중력. 다만 정보를 너무 칸막이하면 공유가 안 된다는 뜻도 있음"},{"id":"d08-D24","day":8,"level":2,"set":"D","family":"F8","word":"trade-off","pos":"noun","ipa":"/ˈtreɪdɔːf/","meaning_ko":"절충, (얻는 것과 잃는 것의) 맞교환","category":"interview","etymology":{"parts":[{"text":"trade","type":"part","gloss":"맞바꾸다"},{"text":"off","type":"part","gloss":"떼어 내어"}],"story":"하나를 내주고 하나를 맞바꿈 → 절충, 득실"},"example":{"q":"How do you make technical decisions?","a":"I list the trade-offs, like speed versus maintainability, and choose what fits the business goal.","a_ko":"속도와 유지보수성처럼 무엇을 얻고 잃는지 정리하고, 사업 목표에 맞는 쪽을 고릅니다."},"collocations":["make a trade-off","the trade-off between A and B"],"related":["bottleneck","stopgap","roadblock"],"tip":"시니어 면접 핵심 단어. There's always a trade-off. 로 답을 시작하면 좋음"},{"id":"d08-D25","day":8,"level":2,"set":"D","family":"F8","word":"roadblock","pos":"noun","ipa":"/ˈroʊdblɑːk/","meaning_ko":"장애물, 걸림돌","category":"interview","etymology":{"parts":[{"text":"road","type":"part","gloss":"길"},{"text":"block","type":"part","gloss":"막다"}],"story":"길을 막는 바리케이드 → 일의 진행을 막는 장애물"},"example":{"q":"What do you do when you're blocked by another team?","a":"When I hit a roadblock, I raise it in standup early, and I suggest a workaround so we don't lose time.","a_ko":"장애물을 만나면 스탠드업에서 일찍 알리고, 시간을 잃지 않도록 우회 방법을 제안합니다."},"collocations":["hit a roadblock","remove roadblocks"],"related":["bottleneck","stopgap","trade-off"],"tip":"blocker(진행을 막는 이슈)와 비슷. remove roadblocks for the team 은 리더십 표현"},{"id":"d09-A01","day":9,"level":1,"set":"A","family":"F9","word":"predict","pos":"verb","ipa":"/prɪˈdɪkt/","meaning_ko":"예측하다, 예상하다","category":"it","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"미리"},{"text":"dict","type":"root","gloss":"말하다"}],"story":"미리 말하다 → 앞일을 내다보고 말하다 → 예측하다"},"example":{"q":"How do you plan capacity for a new service?","a":"I use past traffic data to predict how much load we'll get.","a_ko":"과거 트래픽 데이터로 부하가 얼마나 될지 예측합니다."},"collocations":["predict demand","hard to predict","predict the outcome"],"related":["predictable","prediction","dictionary","dictate","verdict"],"tip":"forecast는 주로 수치 전망, predict는 결과·현상 예측 전반에 씀"},{"id":"d09-A02","day":9,"level":1,"set":"A","family":"F9","word":"predictable","pos":"adjective","ipa":"/prɪˈdɪktəbəl/","meaning_ko":"예측 가능한, 뻔한","category":"it","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"미리"},{"text":"dict","type":"root","gloss":"말하다"},{"text":"able","type":"suffix","gloss":"~할 수 있는"}],"story":"미리 말할 수 있는 → 예측 가능한"},"example":{"q":"Why do you prefer small, frequent releases?","a":"Small releases make our deployments more predictable and easier to roll back.","a_ko":"작은 릴리스는 배포를 더 예측 가능하게 하고 롤백도 쉽게 해 줍니다."},"collocations":["predictable performance","highly predictable","predictable schedule"],"related":["predict","prediction","unpredictable","indicate"],"tip":"시스템·일정에는 '예상대로 돌아간다'는 칭찬이지만, 사람에게 쓰면 '뻔하다'는 부정적 뉘앙스가 될 수 있음"},{"id":"d09-A03","day":9,"level":1,"set":"A","family":"F9","word":"dictionary","pos":"noun","ipa":"/ˈdɪkʃəˌneri/","meaning_ko":"사전, (프로그래밍) 딕셔너리","category":"it","etymology":{"parts":[{"text":"dict","type":"root","gloss":"말하다"},{"text":"ion","type":"suffix","gloss":"~하는 것"},{"text":"ary","t keɪt/","meaning_ko":"나타내다, 가리키다","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"~을 향해"},{"text":"dic","type":"root","gloss":"선언하다·알리다 (dicare←dic)"},{"text":"ate","type":"suffix","gloss":"~하다"}],"story":"~을 향해 알리다 → 가리키다 → (신호·데이터가) 나타내다"},"example":{"q":"How did you find the cause of the slowdown?","a":"The metrics indicated a memory leak in one of our services.","a_ko":"지표를 보니 서비스 하나에 메모리 누수가 있다는 게 드러났습니다."},"collocations":["indicate that","clearly indicate","as indicated"],"related":["indicator","index","predict","dedicate"],"tip":"show보다 격식 있는 말. 'The data indicates that ~'으로 근거를 댈 때 좋음"},{"id":"d09-A07","day":9,"level":1,"set":"A","family":"F9","word":"indicator","pos":"noun","ipa":"/ˈɪndɪˌkeɪtər/","meaning_ko":"지표, 표시","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"~을 향해"},{"text":"dic","type":"root","gloss":"선언하다·알리다 (dicare←dic)"},{"text":"ator","type":"suffix","gloss":"~하는 것"}],"story":"가리켜 알려 주는 것 → 지표"},"example":{"q":"How do you know a release went well?","a":"Our main indicator is the error rate in the first hour after deployment.","a_ko":"배포 후 첫 한 시간의 에러율이 저희의 핵심 지표입니다."},"collocations":["key performance indicator","leading indicator","status indicator"],"related":["indicate","index","predict","dictate"],"tip":"KPI의 I가 바로 indicator"},{"id":"d09-A08","day":9,"level":1,"set":"A","family":"F9","word":"index","pos":"noun","ipa":"/ˈɪndeks/","meaning_ko":"(DB) 인덱스, 색인","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"~을 향해"},{"text":"dex","type":"root","gloss":"가리키다 (dic)"}],"story":"가리키는 것(집게손가락) → 찾아보기 목록 → 빠른 검색용 인덱스"},"example":{"q":"How did you fix that slow query?","a":"I added an index on the email column, and the query became much faster.","a_ko":"email 컬럼에 인덱스를 추가했더니 쿼리가 훨씬 빨라졌습니다."},"collocations":["add an index","composite index","index finger"],"related":["indexing","indicate","indicator","predict"],"tip":"복수형은 indexes(일반·IT)와 indices(수학) 둘 다 씀"},{"id":"d09-A09","day":9,"level":2,"set":"A","family":"F9","word":"indexing","pos":"noun","ipa":"/ˈɪndeksɪŋ/","meaning_ko":"인덱싱, 색인 생성","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"~을 향해"},{"text":"dex","type":"root","gloss":"가리키다 (dic)"},{"text":"ing","type":"suffix","gloss":"~하기"}],"story":"가리키는 목록을 만들기 → 검색용 색인을 만들기"},"example":{"q":"How did you improve search on your platform?","a":"I set up full-text indexing in Elasticsearch, so search results now come back in under a second.","a_ko":"Elasticsearch에 전문 검색 인덱싱을 구축해서, 이제 검색 결과가 1초 안에 나옵니다."},"collocations":["full-text indexing","indexing strategy","re-indexing"],"related":["index","indicator","indicate"],"tip":"인덱스가 많을수록 쓰기 성능이 떨어진다는 점까지 말하면 깊이 있는 답변이 됨"},{"id":"d09-A10","day":9,"level":1,"set":"A","family":"F9","word":"condition","pos":"noun","ipa":"/kənˈdɪʃən/","meaning_ko":"조건, 상태","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"dit","type":"root","gloss":"말하다 (dic)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"함께 말해서 정한 것(합의) → 조건 → 상태"},"example":{"q":"Tell me about a tricky bug you fixed.","a":"I fixed a race condition that only appeared under heavy load.","a_ko":"부하가 클 때만 나타나는 레이스 컨디션(경쟁 상태)을 고쳤습니다."},"collocations":["race condition","under these conditions","on the condition that"],"related":["conditional","predict","verdict","dictate"],"tip":"조건문의 condition과 '근무 조건(working conditions)'에 모두 씀"},{"id":"d09-A11","day":9,"level":2,"set":"A","family":"F9","word":"dictate","pos":"verb","ipa":"/ˈdɪkteɪt/","meaning_ko":"좌우하다, 지시하다","category":"it","etymology":{"parts":[{"text":"dict","type":"root","gloss":"말하다"},{"text":"ate","type":"suffix","gloss":"~하다"}],"story":"되풀이해 말하다 → 받아쓰게 하다 → 명령하다 → (조건이) 결정짓다"},"example":{"q":"How do you choose a tech stack?","a":"I let the requirements dictate the architecture, rather than picking whatever technology is trending.","a_ko":"유행하는 기술을 고르기보다 요구 사항에 따라 아키텍처가 정해지도록 합니다."},"collocations":["dictate the design","circumstances dictate","dictate terms"],"related":["dictionary","predict","verdict","dictator"],"tip":"사람이 주어면 '명령하다'라 강압적으로 들림. 면접에서는 requirements dictate ~처럼 사물을 주어로"},{"id":"d09-A12","day":9,"level":2,"set":"A","family":"F9","word":"verdict","pos":"noun","ipa":"/ˈvɜrdɪkt/","meaning_ko":"판정, 결론","category":"interview","etymology":{"parts":[{"text":"ver","type":"root","gloss":"참된 (verus)"},{"text":"dict","type":"root","gloss":"말한 (dictum)"}],"story":"참되게 말한 것 → 배심원의 평결 → 검토 끝에 내린 결론"},"example":{"q":"How did your team decide between the two libraries?","a":"We ran a two-week trial, and our verdict was to keep the current library because it was more stable.","a_ko":"2주간 시범 사용을 해 봤고, 더 안정적이라는 이유로 기존 라이브러리를 유지하기로 결론을 내렸습니다."},"collocations":["reach a verdict","the verdict is","deliver a verdict"],"related":["predict","dictate","dictionary","contradict"],"tip":"원래 법정 용어. 면접에선 '실험·검토 끝에 내린 결론'을 말할 때 씀"},{"id":"d09-A13","day":9,"level":2,"set":"A","family":"F9","word":"predicate","pos":"noun","ipa":"/ˈpredɪkət/","meaning_ko":"(코드) 조건 함수, (문법) 술어","category":"it","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"앞에"},{"text":"dic","type":"root","gloss":"선언하다 (dicare←dic)"},{"text":"ate","type":"suffix","gloss":"~된 것"}],"story":"앞에 내세워 단언한 것 → (논리·문법) 술어 → 참/거짓을 돌려주는 조건 함수"},"example":{"q":"How do you keep business rules testable?","a":"I write each rule as a small predicate function, so it can be unit-tested and reused across services.","a_ko":"각 규칙을 작은 조건 함수(predicate)로 만들어서, 단위 테스트도 하고 여러 서비스에서 재사용할 수 있게 합니다."},"collocations":["predicate function","filter predicate","predicate pushdown"],"related":["predict","predicament","indicate","dedicate"],"tip":"동사 '~에 근거하다(be predicated on)'는 /ˈpredɪˌkeɪt/로 발음이 다름"},{"id":"d09-A14","day":9,"level":3,"set":"A","family":"F9","word":"predicament","pos":"noun","ipa":"/prɪˈdɪkəmənt/","meaning_ko":"곤경, 난처한 처지","category":"interview","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"앞에"},{"text":"dic","type":"root","gloss":"선언하다 (dicare←dic)"},{"text":"ament","type":"suffix","gloss":"~하는 것 (-mentum)"}],"story":"(논리학) 무엇이라고 단언되는 범주 → 처한 상태 → 곤란한 처지"},"example":{"q":"Tell me about a time you faced a difficult situation at work.","a":"We were in a real predicament when our lead left mid-project, so I reorganized the remaining tasks and kept us on schedule.","a_ko":"프로젝트 도중에 리드가 떠나 정말 곤란한 상황이었는데, 제가 남은 작업을 다시 나눠 일정대로 진행했습니다."},"collocations":["in a predicament","face a predicament","a difficult predicament"],"related":["predicate","predict","dictate","indicate"],"tip":"problem보다 '빠져나오기 어려운 처지'라는 뉘앙스. STAR의 Situation을 설명할 때 좋음"},{"id":"d09-A15","day":9,"level":3,"set":"A","family":"F9","word":"abdicate","pos":"verb","ipa":"/ˈæbdɪˌkeɪt/","meaning_ko":"(책임을) 저버리다, 내려놓다","category":"interview","etymology":{"parts":[{"text":"ab","type":"prefix","gloss":"멀리"},{"text":"dic","type":"root","gloss":"선언하다 (dicare←dic)"},{"text":"ate","type":"suffix","gloss":"~하다"}],"story":"멀리한다고 선언하다 → (왕위를) 내놓다 → 책임을 저버리다"},"example":{"q":"How do you handle delegation as a lead?","a":"I'm happy to delegate tasks, but I never abdicate responsibility for the outcome, so I check in often and support the owner.","a_ko":"업무는 기꺼이 맡기지만 결과에 대한 책임은 절대 내려놓지 않기 때문에, 자주 진행 상황을 확인하고 담당자를 돕습니다."},"collocations":["abdicate responsibility","abdicate the throne","abdicate a role"],"related":["dedicate","indicate","predict","dictate"],"tip":"delegate(위임)와 대비해 'delegate, not abdicate'로 말하면 리더십 답변이 깔끔해짐"},{"id":"d09-A16","day":9,"level":1,"set":"A","family":"F9","word":"vocal","pos":"adjective","ipa":"/ˈvoʊkəl/","meaning_ko":"의견을 분명히 말하는, 목소리의","category":"interview","etymology":{"parts":[{"text":"voc","type":"root","gloss":"목소리·부르다 (vox)"},{"text":"al","type":"suffix","gloss":"~의"}],"story":"목소리의 → 소리 내어 말하는 → 의견을 거리낌 없이 말하는"},"example":{"q":"How do you handle risks in a project?","a":"I'm vocal about risks early, before they turn into real problems.","a_ko":"위험 요소는 실제 문제가 되기 전에 일찍 분명하게 이야기합니다."},"collocations":["be vocal about","vocal supporter","vocal cords"],"related":["vocabulary","advocate","vocation","voice","revoke"],"tip":"'vocal critic'처럼 부정적으로도 쓰이니 be vocal about risks/ideas처럼 건설적인 맥락으로"},{"id":"d09-A17","day":9,"level":1,"set":"A","family":"F9","word":"vocabulary","pos":"noun","ipa":"/voʊˈkæbjəˌleri/","meaning_ko":"어휘, 용어","category":"interview","etymology":{"parts":[{"text":"voc","type":"root","gloss":"부르다 (vocare)"},{"text":"abul","type":"suffix","gloss":"~하는 수단 (-bulum)"},{"text":"ary","type":"suffix","gloss":"~을 모은 것"}],"story":"(사물을) 부르는 말 → 단어 → 단어 모음 → 어휘"},"example":{"q":"How do you work with non-technical stakeholders?","a":"I avoid technical vocabulary and explain things with simple examples.","a_ko":"기술 용어는 피하고 쉬운 예시로 설명합니다."},"collocations":["technical vocabulary","shared vocabulary","expand my vocabulary"],"related":["vocal","vocation","advocate","voice"],"tip":"팀이 함께 쓰는 용어를 맞추는 것을 'shared vocabulary'라고도 함"},{"id":"d09-A18","day":9,"level":2,"set":"A","family":"F9","word":"vocation","pos":"noun","ipa":"/voʊˈkeɪʃən/","meaning_ko":"천직, 소명","category":"interview","etymology":{"parts":[{"text":"voc","type":"root","gloss":"부르다 (vocare)"},{"text":"ation","type":"suffix","gloss":"~하는 것"}],"story":"부름 → (신의) 부르심 → 천직"},"example":{"q":"Why did you become a software engineer?","a":"Building tools that make people's work easier feels like a vocation to me, not just a job.","a_ko":"사람들의 일을 편하게 해 주는 도구를 만드는 건 제게 단순한 직업이 아니라 천직처럼 느껴집니다."},"collocations":["find one's vocation","a sense of vocation","vocational training"],"related":["vocal","vocabulary","advocate","invoke"],"tip":"job·career보다 '부름받은 일'이라는 무게감이 있음. 지원 동기에서 한 번만 쓰면 인상적"},{"id":"d09-A19","day":9,"level":2,"set":"A","family":"F9","word":"advocate","pos":"verb","ipa":"/ˈædvəˌkeɪt/","meaning_ko":"옹호하다, 지지하다","category":"interview","etymology":{"parts":[{"text":"ad","type":"prefix","gloss":"~에게"},{"text":"voc","type":"root","gloss":"부르다 (vocare)"},{"text":"ate","type":"suffix","gloss":"~하다"}],"story":"(도와 달라고) 불려 온 사람 → 변호인 → 편을 들어 주장하다"},"example":{"q":"What engineering practices do you care about?","a":"I strongly advocate for code reviews because they catch bugs early and spread knowledge across the team.","a_ko":"코드 리뷰는 버그를 일찍 잡고 팀 전체에 지식을 퍼뜨리기 때문에 적극적으로 지지합니다."},"collocations":["advocate for","strong advocate","user advocate"],"related":["advocacy","vocal","vocation","revoke"],"tip":"동사는 /-keɪt/, 명사(옹호자)는 /ˈædvəkət/로 끝 발음이 다름"},{"id":"d09-A20","day":9,"level":2,"set":"A","family":"F9","word":"advocacy","pos":"noun","ipa":"/ˈædvəkəsi/","meaning_ko":"옹호, 지지 활동","category":"interview","etymology":{"parts":[{"text":"ad","type":"prefix","gloss":"~에게"},{"text":"voc","type":"root","gloss":"부르다 (vocare)"},{"text":"acy","type":"suffix","gloss":"~하는 일"}],"story":"불려 와 편을 들어 줌 → 옹호"},"example":{"q":"Have you ever changed how your team works?","a":"My advocacy for automated testing helped our team cut regression bugs by about thirty percent.","a_ko":"제가 자동화 테스트를 꾸준히 주장한 덕분에 팀의 회귀 버그가 약 30% 줄었습니다."},"collocations":["advocacy for","user advocacy","developer advocacy"],"related":["advocate","vocal","vocabulary"],"tip":"Developer Advocate(DevRel 직군) 이름에도 들어가는 단어"},{"id":"d09-A21","day":9,"level":2,"set":"A","family":"F9","word":"vouch","pos":"verb","ipa":"/vaʊtʃ/","meaning_ko":"보증하다","category":"interview","etymology":{"parts":[{"text":"vouch","type":"root","gloss":"부르다 (vocare)"}],"story":"(증인으로 법정에) 부르다 → 보증하다"},"example":{"q":"Who can we contact as a reference?","a":"My previous manager can vouch for my reliability, since I led our on-call rotation for two years.","a_ko":"제가 2년간 온콜 당번을 이끌었기 때문에, 이전 매니저가 제 신뢰성을 보증해 줄 수 있습니다."},"collocations":["vouch for","I can vouch that","vouch for someone"],"related":["advocate","vocal","revoke","voice"],"tip":"거의 항상 vouch for + 사람/자질. 레퍼런스 체크 이야기에서 씀"},{"id":"d09-A22","day":9,"level":2,"set":"A","family":"F9","word":"thought-provoking","pos":"adjective","ipa":"/ˈθɔt prəˌvoʊkɪŋ/","meaning_ko":"생각하게 하는, 시사점이 많은","category":"interview","etymology":{"parts":[{"text":"thought","type":"part","gloss":"생각"},{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"vok","type":"root","gloss":"부르다 (voc)"},{"text":"ing","type":"suffix","gloss":"~하는"}],"story":"생각을 앞으로 불러내는 → 깊이 생각하게 만드는"},"example":{"q":"Have you read anything interesting lately?","a":"I read a thought-provoking article on AI pair programming, and it changed how I review generated code.","a_ko":"AI 페어 프로그래밍에 관한 생각할 거리가 많은 글을 읽었는데, 그 뒤로 생성된 코드를 리뷰하는 방식이 바뀌었습니다."},"collocations":["thought-provoking question","thought-provoking talk","deeply thought-provoking"],"related":["advocate","revoke","vocal","invoke"],"tip":"어려운 질문을 받으면 'That's a thought-provoking question.'으로 생각할 시간을 벌 수도 있음"},{"id":"d09-A23","day":9,"level":1,"set":"A","family":"F9","word":"so far","pos":"phrase","ipa":"/soʊ ˈfɑr/","meaning_ko":"지금까지","category":"interview","etymology":{"parts":[{"text":"so","type":"part","gloss":"그만큼"},{"text":"far","type":"part","gloss":"멀리"}],"story":"그만큼 멀리까지 → 지금 이 시점까지 → 지금까지"},"example":{"q":"How do you feel about our hiring process?","a":"So far, I've really enjoyed meeting the team and learning about the product.","a_ko":"지금까지 팀원들을 만나고 제품에 대해 알게 되어 정말 좋았습니다."},"collocations":["so far so good","so far this year","the best so far"],"related":["up to now","to date","thus far"],"tip":"현재완료(I've ~)와 함께 쓰는 게 자연스러움"},{"id":"d09-A24","day":9,"level":1,"set":"A","family":"F9","word":"in short","pos":"phrase","ipa":"/ɪn ˈʃɔrt/","meaning_ko":"요컨대, 간단히 말해","category":"interview","etymology":{"parts":[{"text":"in","type":"part","gloss":"~으로"},{"text":"short","type":"part","gloss":"짧은"}],"story":"짧게 하면 → 간단히 말해"},"example":{"q":"Can you tell me about yourself?","a":"In short, I'm a backend engineer who loves solving performance problems.","a_ko":"간단히 말해, 저는 성능 문제를 해결하는 걸 좋아하는 백엔드 엔지니어입니다."},"collocations":["in short","to put it simply","in a nutshell"],"related":["in a nutshell","to sum up","briefly"],"tip":"길게 설명한 뒤 요점을 정리할 때 쓰면 면접관이 핵심을 놓치지 않음"},{"id":"d09-A25","day":9,"level":2,"set":"A","family":"F9","word":"off the top of my head","pos":"phrase","ipa":"/ˌɔf ðə ˈtɑp əv maɪ ˈhed/","meaning_ko":"당장 떠오르는 대로, 정확하진 않지만","category":"interview","etymology":{"parts":[{"text":"off the top","type":"part","gloss":"꼭대기에서"},{"text":"of my head","type":"part","gloss":"내 머리의"}],"story":"머리 꼭대기에서 바로 꺼낸 → 깊이 따져 보지 않고 바로 떠오르는 대로"},"example":{"q":"How many microservices did you manage?","a":"Off the top of my head, it was around fifteen, but I can confirm the exact number later.","a_ko":"당장 떠오르는 대로 말씀드리면 15개 정도였는데, 정확한 숫자는 나중에 확인해 드리겠습니다."},"collocations":["off the top of my head","I can't say off the top of my head"],"related":["roughly speaking","as far as I remember","ballpark figure"],"tip":"숫자를 정확히 기억하지 못할 때 솔직하게 쓰는 안전한 표현"},{"id":"d09-B01","day":9,"level":1,"set":"B","family":"F9","word":"incredible","pos":"adjective","ipa":"/ɪnˈkredəbəl/","meaning_ko":"놀라운, 믿기 힘든","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"아닌"},{"text":"cred","type":"root","gloss":"믿다"},{"text":"ible","type":"suffix","gloss":"~할 수 있는"}],"story":"믿을 수 없는 → 믿기 힘들 정도로 놀라운"},"example":{"q":"What was the highlight of your last job?","a":"Launching an app used by a million people was an incredible experience.","a_ko":"백만 명이 쓰는 앱을 출시한 것은 정말 놀라운 경험이었습니다."},"collocations":["incredible experience","incredible team","incredibly fast"],"related":["credibility","credence","credit","credential"],"tip":"면접에서 남발하면 과장처럼 들리니 한두 번만"},{"id":"d09-B02","day":9,"level":2,"set":"B","family":"F9","word":"credibility","pos":"noun","ipa":"/ˌkredəˈbɪləti/","meaning_ko":"신뢰성, 신망","category":"interview","etymology":{"parts":[{"text":"cred","type":"root","gloss":"믿다"},{"text":"ibil","type":"suffix","gloss":"~할 수 있는"},{"text":"ity","type":"suffix","gloss":"~성"}],"story":"믿을 수 있음 → 신뢰성"},"example":{"q":"How do you build trust with a new team?","a":"I build credibility by delivering small wins first and always keeping my promises.","a_ko":"먼저 작은 성과를 내고 약속을 반드시 지키면서 신뢰를 쌓습니다."},"collocations":["build credibility","gain credibility","lose credibility"],"related":["incredible","credence","credit","credential"],"tip":"trust는 관계, credibility는 '말과 실력이 믿을 만함'에 초점"},{"id":"d09-B03","day":9,"level":2,"set":"B","family":"F9","word":"accredited","pos":"adjective","ipa":"/əˈkredɪtɪd/","meaning_ko":"공인된, 인가받은","category":"interview","etymology":{"parts":[{"text":"ac","type":"prefix","gloss":"~에게 (ad)"},{"text":"cred","type":"root","gloss":"믿다"},{"text":"it","type":"suffix","gloss":"~된 것 (credit의 -it)"},{"text":"ed","type":"suffix","gloss":"~된"}],"story":"신용(믿음)을 주다 → 공식적으로 인정하다 → 공인된"},"example":{"q":"Tell me about your education.","a":"I graduated from an accredited computer science program, so my degree is recognized internationally.","a_ko":"인증받은 컴퓨터공학 과정을 졸업해서 학위가 해외에서도 인정됩니다."},"collocations":["accredited program","fully accredited","accredited by"],"related":["credibility","credence","credit","incredible"],"tip":"certified는 '개인이 자격을 땀', accredited는 '기관·과정이 공식 인가를 받음'"},{"id":"d09-B04","day":9,"level":3,"set":"B","family":"F9","word":"credence","pos":"noun","ipa":"/ˈkridəns/","meaning_ko":"신빙성, 믿음","category":"interview","etymology":{"parts":[{"text":"cred","type":"root","gloss":"믿다"},{"text":"ence","type":"suffix","gloss":"~하는 것"}],"story":"믿음 → 믿을 만한 근거 → 신빙성"},"example":{"q":"How did you convince leadership to approve the redesign?","a":"Our A/B test results lent credence to my idea, so leadership approved rolling out the new design to all users.","a_ko":"A/B 테스트 결과가 제 아이디어에 힘을 실어 줘서, 경영진이 새 디자인을 전체 사용자에게 적용하는 것을 승인했습니다."},"collocations":["lend credence to","give credence to","gain credence"],"related":["credibility","incredible","credit","credential"],"tip":"거의 lend/give credence to 형태로 씀. credibility보다 격식 있는 말"},{"id":"d09-B05","day":9,"level":1,"set":"B","family":"F9","word":"grant","pos":"verb","ipa":"/ɡrænt/","meaning_ko":"(권한을) 부여하다, 허락하다","category":"it","etymology":{"parts":[{"text":"grant","type":"root","gloss":"믿고 맡기다 (credere)"}],"story":"라틴어 credere(믿다) → 고대 프랑스어 graanter(보증하다) → 허락하다 → 권한을 부여하다"},"example":{"q":"How do you manage access to production?","a":"I only grant admin access to people who really need it.","a_ko":"관리자 권한은 정말 필요한 사람에게만 부여합니다."},"collocations":["grant access","grant permission","grant a request"],"related":["take for granted","credit","credence","credible"],"tip":"권한을 빼앗는 건 revoke. grant ↔ revoke를 짝으로 기억"},{"id":"d09-B06","day":9,"level":1,"set":"B","family":"F9","word":"take for granted","pos":"phrase","ipa":"/ˌteɪk fər ˈɡræntɪd/","meaning_ko":"당연하게 여기다","category":"interview","etymology":{"parts":[{"text":"take","type":"part","gloss":"받아들이다"},{"text":"for","type":"part","gloss":"~로"},{"text":"grant","type":"root","gloss":"허락하다 (credere)"},{"text":"ed","type":"suffix","gloss":"~된"}],"story":"이미 허락된 것으로 받아들이다 → 당연하게 여기다"},"example":{"q":"What have you learned about working on a team?","a":"Good documentation is something I never take for granted.","a_ko":"잘 정리된 문서는 결코 당연하게 여기지 않습니다."},"collocations":["take it for granted","take someone for granted","never take for granted"],"related":["grant","credence","credible"],"tip":"목적어가 있으면 take ~ for granted 사이에 넣음 (take it for granted)"},{"id":"d09-B07","day":9,"level":1,"set":"B","family":"F9","word":"confident","pos":"adjective","ipa":"/ˈkɑnfɪdənt/","meaning_ko":"자신 있는, 확신하는","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"완전히"},{"text":"fid","type":"root","gloss":"믿다"},{"text":"ent","type":"suffix","gloss":"~하는"}],"story":"완전히 믿는 → 확신하는 → 자신 있는"},"example":{"q":"Why should we hire you?","a":"I'm confident that I can contribute to your team from day one.","a_ko":"첫날부터 팀에 기여할 수 있다고 자신합니다."},"collocations":["confident that","confident in","feel confident"],"related":["confidence","diffident","fidelity","confidential"],"tip":"confidential(기밀의)과 철자가 비슷하니 주의"},{"id":"d09-B08","day":9,"level":1,"set":"B","family":"F9","word":"confidence","pos":"noun","ipa":"/ˈkɑnfɪdəns/","meaning_ko":"자신감, 신뢰","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"완전히"},{"text":"fid","type":"root","gloss":"믿다"},{"text":"ence","type":"suffix","gloss":"~하는 것"}],"story":"완전히 믿음 → 확신 → 자신감"},"example":{"q":"What did you gain from leading that migration?","a":"Leading the migration gave me confidence in my technical decisions.","a_ko":"그 마이그레이션을 이끌면서 제 기술적 판단에 자신감이 생겼습니다."},"collocations":["gain confidence","with confidence","build confidence"],"related":["confident","diffident","fidelity","bona fide"],"tip":"'신뢰'의 뜻도 있어 have confidence in the team(팀을 신뢰하다)처럼도 씀"},{"id":"d09-B09","day":9,"level":3,"set":"B","family":"F9","word":"diffident","pos":"adjective","ipa":"/ˈdɪfɪdənt/","meaning_ko":"자신감 없는, 소심한","category":"interview","etymology":{"parts":[{"text":"dif","type":"prefix","gloss":"떨어져 (dis)"},{"text":"fid","type":"root","gloss":"믿다"},{"text":"ent","type":"suffix","gloss":"~하는"}],"story":"믿음에서 멀어진 → 자기를 믿지 못하는 → 머뭇거리는"},"example":{"q":"What is one weakness you've worked on?","a":"I used to be diffident about speaking up in meetings, but giving internal tech talks helped me become much more confident.","a_ko":"예전에는 회의에서 의견을 말하는 데 자신이 없었지만, 사내 기술 발표를 하면서 훨씬 자신감이 생겼습니다."},"collocations":["diffident about","shy and diffident"],"related":["confident","confidence","fidelity","defy"],"tip":"confident의 반대말. 약점 질문에서 '극복한 과거 모습'으로 쓰면 좋음"},{"id":"d09-B10","day":9,"level":2,"set":"B","family":"F9","word":"fidelity","pos":"noun","ipa":"/fɪˈdeləti/","meaning_ko":"충실도, 정확도","category":"it","etymology":{"parts":[{"text":"fid","type":"root","gloss":"믿음·충실 (fides)"},{"text":"el","type":"suffix","gloss":"~한 (-elis)"},{"text":"ity","type":"suffix","gloss":"~성"}],"story":"믿음을 지킴 → 충실함 → 원본에 충실한 정도 → 재현 정확도"},"example":{"q":"How do you get early feedback on a new feature?","a":"I start with a low-fidelity wireframe to get quick feedback before building a detailed prototype.","a_ko":"상세한 프로토타입을 만들기 전에, 빠르게 피드백을 받으려고 간단한(로우 피델리티) 와이어프레임부터 만듭니다."},"collocations":["low-fidelity","high-fidelity","fidelity to"],"related":["confident","diffident","bona fide","fiduciary"],"tip":"hi-fi(하이파이)가 high fidelity의 줄임말"},{"id":"d09-B11","day":9,"level":2,"set":"B","family":"F9","word":"bona fide","pos":"adjective","ipa":"/ˈboʊnə ˌfaɪd/","meaning_ko":"진짜의, 진정한","category":"interview","etymology":{"parts":[{"text":"bona","type":"root","gloss":"좋은 (bonus)"},{"text":"fide","type":"root","gloss":"믿음 (fides)"}],"story":"라틴어 '좋은 믿음으로' → 속임 없는 → 진짜의"},"example":{"q":"Why are you interested in fintech?","a":"I have a bona fide interest in fintech; I've been building personal finance tools as side projects for years.","a_ko":"핀테크에 진심으로 관심이 있습니다. 몇 년째 개인 금융 도구를 사이드 프로젝트로 만들어 왔습니다."},"collocations":["bona fide interest","bona fide offer","bona fide expert"],"related":["fidelity","confident","diffident","in good faith"],"tip":"발음은 '보나 파이드'. 명사 앞에서 형용사로 씀"},{"id":"d09-B12","day":9,"level":2,"set":"B","family":"F9","word":"defy","pos":"verb","ipa":"/dɪˈfaɪ/","meaning_ko":"(예상을) 뒤엎다, 맞서다","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"떨어져 (dis)"},{"text":"fy","type":"root","gloss":"믿다·충성하다 (fid)"}],"story":"믿음(충성)을 끊다 → 맞서다 → 예상을 뒤엎다"},"example":{"q":"What achievement are you most proud of?","a":"Our small team defied expectations by shipping the new app two weeks ahead of schedule.","a_ko":"저희 작은 팀이 예상을 뒤엎고 새 앱을 일정보다 2주 먼저 출시했습니다."},"collocations":["defy expectations","defy the odds","defy logic"],"related":["confident","diffident","fidelity","in good faith"],"tip":"면접에선 defy expectations(예상을 뛰어넘다)로 긍정적인 성과를 말할 때 씀"},{"id":"d09-B13","day":9,"level":2,"set":"B","family":"F9","word":"in good faith","pos":"phrase","ipa":"/ɪn ˌɡʊd ˈfeɪθ/","meaning_ko":"선의로, 성실하게","category":"interview","etymology":{"parts":[{"text":"in good","type":"part","gloss":"좋은 ~으로"},{"text":"faith","type":"root","gloss":"믿음 (fides)"}],"story":"좋은 믿음으로 → 속임 없이 → 선의로"},"example":{"q":"How do you handle disagreements with teammates?","a":"I assume my teammates are acting in good faith, so I focus on the facts instead of blaming anyone.","a_ko":"동료들이 선의로 행동한다고 전제하기 때문에, 누구를 탓하기보다 사실에 집중합니다."},"collocations":["act in good faith","assume good faith","negotiate in good faith"],"related":["bona fide","leap of faith","fidelity","confident"],"tip":"라틴어 bona fide를 영어로 옮긴 표현이 바로 in good faith"},{"id":"d09-B14","day":9,"level":2,"set":"B","family":"F9","word":"leap of faith","pos":"phrase","ipa":"/ˌlip əv ˈfeɪθ/","meaning_ko":"믿고 내린 모험적 결단","category":"interview","etymology":{"parts":[{"text":"leap of","type":"part","gloss":"~의 도약"},{"text":"faith","type":"root","gloss":"믿음 (fides)"}],"story":"믿음을 갖고 뛰어오름 → 확실한 근거 없이 믿고 결단함"},"example":{"q":"Why did you decide to move abroad for work?","a":"Moving to a new country was a leap of faith, but it taught me to adapt quickly.","a_ko":"새로운 나라로 옮긴 것은 모험적인 결단이었지만, 덕분에 빠르게 적응하는 법을 배웠습니다."},"collocations":["take a leap of faith","a big leap of faith"],"related":["in good faith","bona fide","confident","fidelity"],"tip":"위험을 감수한 결정을 긍정적으로 말할 때 씀"},{"id":"d09-B15","day":9,"level":1,"set":"B","family":"F9","word":"region","pos":"noun","ipa":"/ˈridʒən/","meaning_ko":"지역, (클라우드) 리전","category":"it","etymology":{"parts":[{"text":"reg","type":"root","gloss":"다스리다·방향을 정하다 (regere)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"다스리는 경계로 정한 곳 → 구역 → 지역 → 클라우드 리전"},"example":{"q":"How did you make the service highly available?","a":"We deployed the service to two AWS regions to avoid a single point of failure.","a_ko":"단일 장애 지점을 피하려고 서비스를 AWS 리전 두 곳에 배포했습니다."},"collocations":["multi-region","AWS region","region failover"],"related":["regional","direct","correct","regulation"],"tip":"리전 안에 여러 availability zone이 있다는 구조까지 설명하면 좋음"},{"id":"d09-B16","day":9,"level":1,"set":"B","family":"F9","word":"regional","pos":"adjective","ipa":"/ˈridʒənəl/","meaning_ko":"지역의","category":"interview","etymology":{"parts":[{"text":"reg","type":"root","gloss":"다스리다·방향을 정하다 (regere)"},{"text":"ion","type":"suffix","gloss":"~하는 것"},{"text":"al","type":"suffix","gloss":"~의"}],"story":"다스리는 구역의 → 지역의"},"example":{"q":"Who did you work with outside engineering?","a":"I worked closely with our regional sales teams across Asia.","a_ko":"아시아 각지의 지역 영업팀과 긴밀히 협업했습니다."},"collocations":["regional team","regional office","regional manager"],"related":["region","direct","realm","regulation"],"tip":"global ↔ regional ↔ local 순으로 범위가 좁아짐"},{"id":"d09-B17","day":9,"level":1,"set":"B","family":"F9","word":"alert","pos":"noun","ipa":"/əˈlɜrt/","meaning_ko":"경보, 알림","category":"it","etymology":{"parts":[{"text":"al","type":"prefix","gloss":"~으로 (이탈리아어 alla)"},{"text":"ert","type":"root","gloss":"높이 세운 망루 (erigere←e+regere)"}],"story":"이탈리아어 all'erta '망루로!' → 경계 태세 → 경보·알림"},"example":{"q":"How do you monitor your services?","a":"I set up alerts so we hear about errors before our users do.","a_ko":"사용자보다 먼저 에러를 알 수 있도록 알림을 설정해 둡니다."},"collocations":["set up alerts","alert fatigue","on high alert"],"related":["direct","correct","surge","region"],"tip":"알림이 너무 많아 무시하게 되는 현상을 alert fatigue라고 함"},{"id":"d09-B18","day":9,"level":2,"set":"B","family":"F9","word":"surge","pos":"noun","ipa":"/sɜrdʒ/","meaning_ko":"급증, 서지","category":"it","etymology":{"parts":[{"text":"surge","type":"root","gloss":"솟아오르다 (surgere←sub+regere)"}],"story":"아래에서 위로 곧게 솟다 → 솟구침 → 급증"},"example":{"q":"Tell me about a time your system was under pressure.","a":"During a flash sale, we saw a tenfold traffic surge, so I added autoscaling rules to handle it.","a_ko":"반짝 세일 때 트래픽이 10배로 급증해서, 이를 처리하도록 오토스케일링 규칙을 추가했습니다."},"collocations":["traffic surge","surge in demand","sudden surge"],"related":["source","resource","resurrect","direct"],"tip":"동사로도 씀: Traffic surged after the launch."},{"id":"d09-B19","day":9,"level":1,"set":"B","family":"F9","word":"source","pos":"noun","ipa":"/sɔrs/","meaning_ko":"원인, 출처","category":"it","etymology":{"parts":[{"text":"source","type":"root","gloss":"솟아나다 (surgere)"}],"story":"물이 솟아나는 곳(샘) → 근원 → 원인·출처"},"example":{"q":"How do you debug a production issue?","a":"I check the logs first to find the source of the error.","a_ko":"먼저 로그를 확인해서 에러의 원인을 찾습니다."},"collocations":["source code","source of truth","data source"],"related":["resource","open-source","outsource","surge"],"tip":"'single source of truth(단일 진실 공급원)'는 데이터 설계 면접 단골 표현"},{"id":"d09-B20","day":9,"level":1,"set":"B","family":"F9","word":"resource","pos":"noun","ipa":"/ˈrisɔrs/","meaning_ko":"자원, 리소스","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"source","type":"root","gloss":"솟아나다 (surgere)"}],"story":"다시 솟아나다(회복하다) → 기댈 수 있는 수단 → 자원"},"example":{"q":"How do you control cloud costs?","a":"I monitor CPU and memory resources and remove servers we don't need.","a_ko":"CPU와 메모리 리소스를 모니터링하고 필요 없는 서버는 정리합니다."},"collocations":["cloud resources","resource usage","human resources"],"related":["resourceful","source","outsource","surge"],"tip":"미국식은 /ˈrisɔrs/와 /rɪˈsɔrs/ 둘 다 들림"},{"id":"d09-B21","day":9,"level":1,"set":"B","family":"F9","word":"open-source","pos":"adjective","ipa":"/ˌoʊpən ˈsɔrs/","meaning_ko":"오픈 소스의","category":"it","etymology":{"parts":[{"text":"open","type":"part","gloss":"열린"},{"text":"-","type":"part","gloss":"(연결)"},{"text":"source","type":"root","gloss":"근원 (surgere)"}],"story":"근원(소스 코드)을 열어 둔 → 누구나 보고 고칠 수 있는"},"example":{"q":"What do you do outside of work?","a":"I contribute to an open-source logging library in my free time.","a_ko":"여가 시간에 오픈 소스 로깅 라이브러리에 기여하고 있습니다."},"collocations":["open-source project","open-source contributor","open-source license"],"related":["source","resource","outsource"],"tip":"명사 앞에선 하이픈(open-source library), 단독 명사는 open source"},{"id":"d09-B22","day":9,"level":2,"set":"B","family":"F9","word":"resourceful","pos":"adjective","ipa":"/rɪˈsɔrsfəl/","meaning_ko":"수완이 좋은, 지략 있는","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"source","type":"root","gloss":"솟아나다 (surgere)"},{"text":"ful","type":"suffix","gloss":"~가 가득한"}],"story":"기댈 수단이 가득한 → 방법을 잘 찾아내는"},"example":{"q":"How would your teammates describe you?","a":"They'd say I'm resourceful; when there's no documentation, I read the source code and figure it out.","a_ko":"수완이 좋다고 할 겁니다. 문서가 없으면 소스 코드를 읽어서라도 해결하니까요."},"collocations":["highly resourceful","resourceful problem solver"],"related":["resource","source","open-source","surge"],"tip":"강점 질문에서 '스스로 해결책을 찾는 사람'을 한 단어로 표현"},{"id":"d09-B23","day":9,"level":2,"set":"B","family":"F9","word":"outsource","pos":"verb","ipa":"/ˈaʊtsɔrs/","meaning_ko":"외주를 주다, 외부에 맡기다","category":"it","etymology":{"parts":[{"text":"out","type":"part","gloss":"밖"},{"text":"source","type":"root","gloss":"공급원 (surgere)"}],"story":"바깥의 공급원에서 얻다 → 외부 업체에 맡기다"},"example":{"q":"How do you decide what to build in-house?","a":"We chose to outsource payment processing to a trusted provider, so our team could focus on core features.","a_ko":"팀이 핵심 기능에 집중할 수 있도록 결제 처리는 믿을 만한 업체에 맡기기로 했습니다."},"collocations":["outsource to","outsource development","outsourced team"],"related":["source","resource","open-source"],"tip":"직접 만들지 사서 쓸지(build vs buy) 결정을 설명할 때 자주 씀"},{"id":"d09-B24","day":9,"level":1,"set":"B","family":"F9","word":"deep dive","pos":"noun","ipa":"/ˈdip ˌdaɪv/","meaning_ko":"심층 분석, 깊이 파고들기","category":"it","etymology":{"parts":[{"text":"deep","type":"part","gloss":"깊은"},{"text":"dive","type":"part","gloss":"잠수"}],"story":"깊이 잠수하기 → 한 주제를 끝까지 파고드는 분석"},"example":{"q":"How did you find the cause of the high cloud bill?","a":"I did a deep dive into our billing data and found two idle clusters.","a_ko":"청구 데이터를 깊이 분석해서 놀고 있던 클러스터 두 개를 찾아냈습니다."},"collocations":["do a deep dive","deep dive into","technical deep dive"],"related":["dig into","drill down","look into"],"tip":"동사로는 dive deep into ~. 면접에서 'Can we deep dive into that?'처럼 후속 질문으로도 자주 나옴"},{"id":"d09-B25","day":9,"level":1,"set":"B","family":"F9","word":"come up with","pos":"phrasal verb","ipa":"/kʌm ˈʌp wɪð/","meaning_ko":"(아이디어를) 생각해 내다","category":"interview","etymology":{"parts":[{"text":"come","type":"part","gloss":"오다"},{"text":"up","type":"part","gloss":"위로"},{"text":"with","type":"part","gloss":"~을 가지고"}],"story":"~을 가지고 위로 올라오다 → 머릿속에서 떠올려 내놓다"},"example":{"q":"Tell me about an idea you contributed.","a":"I came up with a simple script that saved my team hours every week.","a_ko":"팀의 시간을 매주 몇 시간씩 줄여 준 간단한 스크립트를 생각해 냈습니다."},"collocations":["come up with an idea","come up with a solution","come up with a plan"],"related":["think of","figure out","propose"],"tip":"think of보다 '고민해서 만들어 냈다'는 느낌"},{"id":"d09-C01","day":9,"level":1,"set":"C","family":"F9","word":"respond","pos":"verb","ipa":"/rɪˈspɑnd/","meaning_ko":"대응하다, 답하다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"되돌려"},{"text":"spond","type":"root","gloss":"약속하다 (spondere)"}],"story":"되돌려 약속하다 → 답하다 → 상황에 대응하다"},"example":{"q":"How do you handle feedback on your code?","a":"I respond to review comments quickly and ask questions when I'm unsure.","a_ko":"리뷰 코멘트에는 빠르게 답하고, 확실하지 않으면 질문합니다."},"collocations":["respond to","respond quickly","respond to incidents"],"related":["responsive","responsible","sponsor","correspondence"],"tip":"answer는 '질문에 답하다', respond는 '상황·요청에 반응·대응하다'까지 넓음"},{"id":"d09-C02","day":9,"level":1,"set":"C","family":"F9","word":"responsive","pos":"adjective","ipa":"/rɪˈspɑnsɪv/","meaning_ko":"반응형의, 반응이 빠른","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"되돌려"},{"text":"spons","type":"root","gloss":"약속하다 (spond)"},{"text":"ive","type":"suffix","gloss":"~하는"}],"story":"되돌려 응답하는 → 반응이 빠른 → 화면 크기에 반응하는"},"example":{"q":"What frontend work have you done?","a":"I built a responsive web page that works well on phones and laptops.","a_ko":"휴대폰과 노트북 모두에서 잘 작동하는 반응형 웹 페이지를 만들었습니다."},"collocations":["responsive design","highly responsive","responsive to feedback"],"related":["respond","responsible","responsibility","sponsor"],"tip":"사람에게 쓰면 '피드백에 잘 반응하는'이라는 칭찬"},{"id":"d09-C03","day":9,"level":1,"set":"C","family":"F9","word":"responsibility","pos":"noun","ipa":"/rɪˌspɑnsəˈbɪləti/","meaning_ko":"책임, 맡은 일","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"되돌려"},{"text":"spons","type":"root","gloss":"약속하다 (spond)"},{"text":"ibil","type":"suffix","gloss":"~할 수 있는"},{"text":"ity","type":"suffix","gloss":"~성"}],"story":"약속에 응답할 수 있음 → 책임"},"example":{"q":"What were your main duties in your last role?","a":"My main responsibility was building and running the payment API.","a_ko":"결제 API를 만들고 운영하는 것이 제 주된 책임이었습니다."},"collocations":["take responsibility","main responsibility","sense of responsibility"],"related":["responsible","respond","sponsor","responsive"],"tip":"'take responsibility for ~'는 실수를 인정하는 답변에 꼭 필요한 표현"},{"id":"d09-C04","day":9,"level":2,"set":"C","family":"F9","word":"responsible","pos":"adjective","ipa":"/rɪˈspɑnsəbəl/","meaning_ko":"책임지는, 담당하는","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"되돌려"},{"text":"spons","type":"root","gloss":"약속하다 (spond)"},{"text":"ible","type":"suffix","gloss":"~할 수 있는"}],"story":"응답할 수 있는 → 책임질 수 있는 → 담당하는"},"example":{"q":"Tell me about a project you led.","a":"I was responsible for migrating our database to the cloud, which cut our hosting costs by twenty percent.","a_ko":"데이터베이스를 클라우드로 이전하는 일을 담당했고, 그 결과 호스팅 비용이 20% 줄었습니다."},"collocations":["responsible for","directly responsible","feel responsible"],"related":["responsibility","respond","responsive","sponsor"],"tip":"be responsible for + 명사/동명사. in charge of보다 '결과에 대한 책임'의 느낌"},{"id":"d09-C05","day":9,"level":1,"set":"C","family":"F9","word":"sponsor","pos":"noun","ipa":"/ˈspɑnsər/","meaning_ko":"후원자, (프로젝트) 스폰서","category":"interview","etymology":{"parts":[{"text":"spons","type":"root","gloss":"약속하다·보증하다 (spond)"},{"text":"or","type":"suffix","gloss":"~하는 사람"}],"story":"보증을 서는 사람 → 후원자 → 프로젝트를 지원하는 책임자"},"example":{"q":"Who did you report to on that project?","a":"Our VP was the project sponsor, so I updated her on progress every week.","a_ko":"부사장님이 프로젝트 스폰서여서 매주 진행 상황을 보고했습니다."},"collocations":["executive sponsor","project sponsor","sponsor a project"],"related":["sponsorship","respond","responsible"],"tip":"사내 프로젝트에서 예산과 방향을 지원하는 임원을 sponsor라고 부름"},{"id":"d09-C06","day":9,"level":2,"set":"C","family":"F9","word":"sponsorship","pos":"noun","ipa":"/ˈspɑnsərˌʃɪp/","meaning_ko":"후원, (비자) 스폰서십","category":"interview","etymology":{"parts":[{"text":"spons","type":"root","gloss":"약속하다·보증하다 (spond)"},{"text":"or","type":"suffix","gloss":"~하는 사람"},{"text":"ship","type":"suffix","gloss":"~하는 일"}],"story":"보증인이 되어 줌 → 후원 → (회사가) 비자를 보증함"},"example":{"q":"Do you require visa sponsorship to work here?","a":"Yes, I will need visa sponsorship, but I've been through the process before and can prepare the documents quickly.","a_ko":"네, 비자 스폰서십이 필요하지만 전에 진행해 본 적이 있어서 서류를 빠르게 준비할 수 있습니다."},"collocations":["visa sponsorship","require sponsorship","corporate sponsorship"],"related":["sponsor","respond","responsibility"],"tip":"해외 취업 면접 필수 질문. 필요 여부를 숨기지 말고 준비된 모습을 보여 주기"},{"id":"d09-C07","day":9,"level":1,"set":"C","family":"F9","word":"direct","pos":"adjective","ipa":"/dəˈrekt/","meaning_ko":"직접적인, 솔직한","category":"interview","etymology":{"parts":[{"text":"di","type":"prefix","gloss":"따로 (dis)"},{"text":"rect","type":"root","gloss":"곧게 하다·이끌다 (regere)"}],"story":"따로따로 곧게 줄 세우다 → 똑바른 → 곧장 가는·직접적인"},"example":{"q":"What kind of feedback do you prefer?","a":"I prefer direct feedback because it helps me improve faster.","a_ko":"더 빨리 성장할 수 있어서 솔직하고 직접적인 피드백을 선호합니다."},"collocations":["direct feedback","direct report","direct impact"],"related":["direction","directory","correct","rectify","address"],"tip":"direct report는 '나에게 직접 보고하는 팀원'. 리더 경험을 말할 때 씀"},{"id":"d09-C08","day":9,"level":1,"set":"C","family":"F9","word":"direction","pos":"noun","ipa":"/dəˈrekʃən/","meaning_ko":"방향","category":"interview","etymology":{"parts":[{"text":"di","type":"prefix","gloss":"따로 (dis)"},{"text":"rect","type":"root","gloss":"곧게 하다·이끌다 (regere)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"곧게 이끄는 것 → 나아갈 방향"},"example":{"q":"Where do you see your career in five years?","a":"I want to grow in the direction of cloud architecture.","a_ko":"클라우드 아키텍처 쪽으로 성장하고 싶습니다."},"collocations":["technical direction","set the direction","career direction"],"related":["direct","directory","correct","region"],"tip":"set the technical direction(기술 방향을 정하다)은 시니어 역할을 설명할 때 유용"},{"id":"d09-C09","day":9,"level":1,"set":"C","family":"F9","word":"directory","pos":"noun","ipa":"/dəˈrektəri/","meaning_ko":"디렉터리, 폴더","category":"it","etymology":{"parts":[{"text":"di","type":"prefix","gloss":"따로 (dis)"},{"text":"rect","type":"root","gloss":"곧게 하다·이끌다 (regere)"},{"text":"ory","type":"suffix","gloss":"~하는 것"}],"story":"길을 안내해 주는 것(안내서) → 목록 → 파일 목록(디렉터리)"},"example":{"q":"How do you organize a large codebase?","a":"I keep one directory per service, so the structure is easy to follow.","a_ko":"서비스마다 디렉터리를 하나씩 두어서 구조를 쉽게 파악할 수 있게 합니다."},"collocations":["root directory","directory structure","Active Directory"],"related":["direct","direction","address","correct"],"tip":"Active Directory는 사용자·권한을 관리하는 MS 서비스 이름"},{"id":"d09-C10","day":9,"level":1,"set":"C","family":"F9","word":"correct","pos":"adjective","ipa":"/kəˈrekt/","meaning_ko":"정확한, 올바른","category":"it","etymology":{"parts":[{"text":"cor","type":"prefix","gloss":"완전히 (com)"},{"text":"rect","type":"root","gloss":"곧게 하다 (regere)"}],"story":"완전히 곧게 하다 → 바로잡다 → 올바른"},"example":{"q":"How do you make sure your code works?","a":"I write unit tests to make sure my code is correct before review.","a_ko":"리뷰 전에 단위 테스트를 작성해서 코드가 올바른지 확인합니다."},"collocations":["correct answer","correct me if I'm wrong","correct the issue"],"related":["correctness","rectify","direct","address"],"tip":"'Correct me if I'm wrong, but ~'은 면접관 말을 확인할 때 쓰는 공손한 표현"},{"id":"d09-C11","day":9,"level":2,"set":"C","family":"F9","word":"correctness","pos":"noun","ipa":"/kəˈrektnəs/","meaning_ko":"정확성, 정합성","category":"it","etymology":{"parts":[{"text":"cor","type":"prefix","gloss":"완전히 (com)"},{"text":"rect","type":"root","gloss":"곧게 하다 (regere)"},{"text":"ness","type":"suffix","gloss":"~함"}],"story":"완전히 곧음 → 올바름 → 정확성"},"example":{"q":"What do you prioritize in data pipelines?","a":"For financial data, correctness matters more than speed, so I add validation checks at every step.","a_ko":"금융 데이터에서는 속도보다 정확성이 중요해서 모든 단계에 검증 로직을 넣습니다."},"collocations":["data correctness","ensure correctness","correctness over speed"],"related":["correct","rectify","direct"],"tip":"accuracy는 '참값에 가까움', correctness는 '결과가 규칙상 옳음'. 알고리즘·데이터 정합성에 씀"},{"id":"d09-C12","day":9,"level":3,"set":"C","family":"F9","word":"rectify","pos":"verb","ipa":"/ˈrektəˌfaɪ/","meaning_ko":"바로잡다, 시정하다","category":"it","etymology":{"parts":[{"text":"rect","type":"root","gloss":"곧은 (rectus←regere)"},{"text":"ify","type":"suffix","gloss":"~하게 만들다"}],"story":"곧게 만들다 → 잘못된 것을 바로잡다"},"example":{"q":"Tell me about a time you made a mistake.","a":"When I found that our billing job had double-charged some users, I rectified the data within hours and added a check to prevent it.","a_ko":"결제 배치가 일부 사용자에게 이중 청구한 것을 발견하고, 몇 시간 만에 데이터를 바로잡은 뒤 재발 방지 검사를 추가했습니다."},"collocations":["rectify the situation","rectify a mistake","rectify the error"],"related":["correct","direct","correctness","resurrect"],"tip":"fix보다 격식 있고 '잘못된 상태를 바르게 되돌린다'는 뉘앙스. 실수 질문에 잘 맞음"},{"id":"d09-C13","day":9,"level":2,"set":"C","family":"F9","word":"resurrect","pos":"verb","ipa":"/ˌrezəˈrekt/","meaning_ko":"되살리다, 부활시키다","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"sur","type":"prefix","gloss":"아래에서 위로 (sub)"},{"text":"rect","type":"root","gloss":"곧게 세우다 (regere)"}],"story":"다시 아래에서 위로 일으켜 세우다(resurgere) → 부활시키다 → 버려진 것을 되살리다"},"example":{"q":"Have you ever improved an old internal tool
