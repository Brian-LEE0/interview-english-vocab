클라이언트가 동시에 서버를 몰아치지 않게 되어 오류가 줄었습니다."},"collocations":["sounds counterintuitive","counterintuitive result","seemingly counterintuitive"],"related":["counterexample","counterpart","countermeasure","counterproductive"],"tip":"'It sounds counterintuitive, but ~'은 의외의 결과를 소개하는 좋은 첫마디"},{"id":"d10-C23","day":10,"level":3,"set":"C","family":"F10","word":"counterproductive","pos":"adjective","ipa":"/ˌkaʊntərprəˈdʌktɪv/","meaning_ko":"역효과를 내는","category":"interview","etymology":{"parts":[{"text":"counter","type":"prefix","gloss":"맞서 (contra)"},{"text":"pro","type":"prefix","gloss":"앞으로"},{"text":"duct","type":"root","gloss":"이끌다 (duc)"},{"text":"ive","type":"suffix","gloss":"~한"}],"story":"productive(앞으로 이끌어 내는 → 생산적인)에 맞서는 → 역효과를 내는"},"example":{"q":"How do you approach code reviews?","a":"I've learned that harsh comments are counterproductive, so I explain the reason behind each suggestion and point out what's done well.","a_ko":"날 선 코멘트는 역효과라는 걸 배워서, 제안마다 이유를 설명하고 잘된 점도 짚어 줍니다."},"collocations":["counterproductive to","prove counterproductive"],"related":["counteract","counterintuitive","counterpart"],"tip":"duct 는 Day 2 produce·productivity 와 같은 어근(이끌다)"},{"id":"d10-C24","day":10,"level":1,"set":"C","family":"F10","word":"work from home","pos":"phrase","ipa":"/ˌwɜːrk frəm ˈhoʊm/","meaning_ko":"재택근무하다","category":"interview","etymology":{"parts":[{"text":"work","type":"part","gloss":"일하다"},{"text":"from","type":"part","gloss":"~에서"},{"text":"home","type":"part","gloss":"집"}],"story":"집에서 일하다 → 재택근무"},"example":{"q":"What working style do you prefer?","a":"I'm comfortable either way, but I'd like to work from home twice a week.","a_ko":"어느 쪽이든 괜찮지만, 일주일에 두 번은 재택근무를 하고 싶습니다."},"collocations":["work from home","work-from-home policy","WFH"],"related":["workload","day off","overtime"],"tip":"명사로 쓸 때는 'work-from-home'처럼 하이픈. 줄여서 WFH"},{"id":"d10-C25","day":10,"level":1,"set":"C","family":"F10","word":"time off","pos":"noun","ipa":"/ˌtaɪm ˈɔːf/","meaning_ko":"휴가, 쉬는 시간","category":"interview","etymology":{"parts":[{"text":"time","type":"part","gloss":"시간 (고대 영어 tīma)"},{"text":"off","type":"part","gloss":"떨어져"}],"story":"일에서 떨어진 시간 → 휴가"},"example":{"q":"Do you have any upcoming plans we should know about?","a":"I have some time off planned in March, but I can adjust it if needed.","a_ko":"3월에 휴가가 잡혀 있지만 필요하면 조정할 수 있습니다."},"collocations":["take time off","paid time off (PTO)"],"related":["day off","vacation"],"tip":"PTO(paid time off) 는 유급 휴가. 일정 확인 질문에 자주 나옴"},{"id":"d10-D01","day":10,"level":1,"set":"D","family":"F10","word":"final","pos":"adjective","ipa":"/ˈfaɪnəl/","meaning_ko":"최종의, 마지막의","category":"interview","etymology":{"parts":[{"text":"fin","type":"root","gloss":"끝 (finis)"},{"text":"al","type":"suffix","gloss":"~의"}],"story":"라틴어 finis(끝) → 끝의 → 최종의"},"example":{"q":"Is there anything you'd like us to know before we decide?","a":"Before you make your final decision, I'd like to add that I learn new tools quickly.","a_ko":"최종 결정을 하시기 전에, 제가 새 도구를 빨리 익힌다는 점을 덧붙이고 싶습니다."},"collocations":["final decision","final round","final interview"],"related":["finalize","finish","define","infinite"],"tip":"'final round'는 최종 면접 — 'I'm in the final round with another company.'"},{"id":"d10-D02","day":10,"level":2,"set":"D","family":"F10","word":"finalize","pos":"verb","ipa":"/ˈfaɪnəlaɪz/","meaning_ko":"확정하다, 마무리하다","category":"it","etymology":{"parts":[{"text":"fin","type":"root","gloss":"끝 (finis)"},{"text":"al","type":"suffix","gloss":"~의"},{"text":"ize","type":"suffix","gloss":"~로 만들다"}],"story":"최종(final)으로 만들다 → 확정하다"},"example":{"q":"How do you start a new feature?","a":"I finalize the API spec with the frontend team first, so both sides can work in parallel.","a_ko":"먼저 프론트엔드 팀과 API 명세를 확정해서 양쪽이 동시에 작업할 수 있게 합니다."},"collocations":["finalize the design","finalize details","finalize a plan"],"related":["final","finish","define","confine"],"tip":"'정하다'보다 '더 이상 바꾸지 않게 확정한다'는 뜻"},{"id":"d10-D03","day":10,"level":1,"set":"D","family":"F10","word":"finish","pos":"verb","ipa":"/ˈfɪnɪʃ/","meaning_ko":"끝내다, 마치다","category":"interview","etymology":{"parts":[{"text":"fin","type":"root","gloss":"끝 (finis)"},{"text":"ish","type":"suffix","gloss":"(동사 어미, 프랑스어 -iss-)"}],"story":"라틴어 finire(끝내다) → 고대 프랑스어 finir → 끝내다"},"example":{"q":"Do you usually meet your deadlines?","a":"Yes, I usually finish my tasks a day early to leave time for review.","a_ko":"네, 리뷰할 시간을 남기려고 보통 하루 일찍 작업을 끝냅니다."},"collocations":["finish a task","finish on time","finish up"],"related":["final","finalize","define","infinite"],"tip":"complete 보다 일상적. 'finish -ing' 형태로 씀"},{"id":"d10-D04","day":10,"level":1,"set":"D","family":"F10","word":"define","pos":"verb","ipa":"/dɪˈfaɪn/","meaning_ko":"정의하다, 규정하다","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"완전히"},{"text":"fine","type":"root","gloss":"경계를 정하다 (finis)"}],"story":"라틴어 definire(경계를 완전히 정하다) → 뜻을 분명히 정하다"},"example":{"q":"How do you define success in this role?","a":"I define success as shipping features that users actually use.","a_ko":"사용자가 실제로 쓰는 기능을 내놓는 것을 성공이라고 정의합니다."},"collocations":["define success","define the scope","clearly define"],"related":["definition","definitely","well-defined","final","confine"],"tip":"'How would you define ~?' 질문에는 'I define ~ as …'로 답하기"},{"id":"d10-D05","day":10,"level":1,"set":"D","family":"F10","word":"definition","pos":"noun","ipa":"/ˌdefɪˈnɪʃən/","meaning_ko":"정의","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"완전히"},{"text":"fin","type":"root","gloss":"경계 (finis)"},{"text":"ition","type":"suffix","gloss":"~하는 것"}],"story":"경계를 완전히 정한 것 → 정의"},"example":{"q":"What do you agree on at the start of every sprint?","a":"We agree on a clear definition of done for every ticket.","a_ko":"티켓마다 '완료의 정의'를 명확하게 합의합니다."},"collocations":["definition of done","by definition","clear definition"],"related":["define","definitely","well-defined","final"],"tip":"애자일의 'Definition of Done(DoD)' — 무엇이 끝난 상태인지 정한 기준"},{"id":"d10-D06","day":10,"level":1,"set":"D","family":"F10","word":"definitely","pos":"adverb","ipa":"/ˈdefɪnətli/","meaning_ko":"확실히, 물론","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"완전히"},{"text":"fin","type":"root","gloss":"경계 (finis)"},{"text":"ite","type":"suffix","gloss":"~된"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"definite(경계가 분명히 정해진) → 확실하게 → 물론"},"example":{"q":"Would you be interested in mentoring junior engineers?","a":"Definitely, I really enjoyed mentoring two interns last year.","a_ko":"물론입니다. 작년에 인턴 두 명을 멘토링하면서 정말 즐거웠습니다."},"collocations":["definitely interested","I'd definitely","most definitely"],"related":["define","definition","final","infinite"],"tip":"Yes 대신 'Definitely.'라고 하면 열의가 느껴짐. 철자 definately 는 틀림"},{"id":"d10-D07","day":10,"level":2,"set":"D","family":"F10","word":"well-defined","pos":"adjective","ipa":"/ˌwel dɪˈfaɪnd/","meaning_ko":"명확하게 정의된","category":"it","etymology":{"parts":[{"text":"well-","type":"part","gloss":"잘"},{"text":"de","type":"prefix","gloss":"완전히"},{"text":"fine","type":"root","gloss":"경계를 정하다 (finis)"},{"text":"d","type":"suffix","gloss":"~된"}],"story":"잘 + 정의된 → 범위와 목표가 분명한"},"example":{"q":"What kind of tasks do you work best on?","a":"I can handle ambiguous tasks, but I always turn them into well-defined tickets before the team starts.","a_ko":"모호한 일도 맡을 수 있지만, 팀이 시작하기 전에 늘 명확하게 정의된 티켓으로 바꿔 둡니다."},"collocations":["well-defined scope","well-defined interface","well-defined goal"],"related":["define","definition","confine"],"tip":"반대 개념은 ambiguous / vague — 함께 쓰면 대비가 선명함"},{"id":"d10-D08","day":10,"level":2,"set":"D","family":"F10","word":"refine","pos":"verb","ipa":"/rɪˈfaɪn/","meaning_ko":"다듬다, 개선하다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"fine","type":"root","gloss":"끝까지 다듬은, 섬세한 (finis)"}],"story":"다시 + fine(끝까지 다듬어진, 라틴어 finis 에서) → 더 곱게 다듬다"},"example":{"q":"How do you improve your communication skills?","a":"I record my presentations and refine them based on feedback from my teammates.","a_ko":"제 발표를 녹화하고 동료 피드백을 바탕으로 다듬습니다."},"collocations":["refine a process","refine the design","continuously refine"],"related":["fine-tune","define","finesse","final"],"tip":"fine(좋은, 섬세한)은 '끝까지 완성된'이라는 뜻에서 나옴 — 그래서 fin(끝) 가족"},{"id":"d10-D09","day":10,"level":2,"set":"D","family":"F10","word":"fine-tune","pos":"verb","ipa":"/ˌfaɪn ˈtuːn/","meaning_ko":"미세 조정하다, 파인튜닝하다","category":"it","etymology":{"parts":[{"text":"fine-","type":"root","gloss":"섬세한 (finis)"},{"text":"tune","type":"part","gloss":"음을 맞추다"}],"story":"섬세하게 + 음을 맞추다 → 미세 조정하다 → (AI) 모델을 추가 학습시키다"},"example":{"q":"Have you worked with machine learning models?","a":"Yes, I fine-tuned a small language model on our support tickets to classify incoming questions automatically.","a_ko":"네, 고객 문의 티켓으로 작은 언어 모델을 파인튜닝해서 들어오는 질문을 자동으로 분류했습니다."},"collocations":["fine-tune a model","fine-tune parameters","fine-tune performance"],"related":["refine","finesse","define"],"tip":"AI 이야기에서 필수 — 성능 설정을 미세하게 손볼 때도 씀"},{"id":"d10-D10","day":10,"level":1,"set":"D","family":"F10","word":"infinite","pos":"adjective","ipa":"/ˈɪnfɪnət/","meaning_ko":"무한한","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"~ 아닌"},{"text":"fin","type":"root","gloss":"끝 (finis)"},{"text":"ite","type":"suffix","gloss":"~된"}],"story":"끝이 정해지지 않은 → 무한한"},"example":{"q":"What's a bug you'll never forget?","a":"An infinite loop in a retry function once took down our whole server.","a_ko":"재시도 함수의 무한 루프 때문에 서버 전체가 다운된 적이 있습니다."},"collocations":["infinite loop","infinite scroll","infinite possibilities"],"related":["final","finish","define","confine"],"tip":"발음 '인피닛' — 강세가 앞(IN-), 'finite'(파이나잇)와 소리가 다름"},{"id":"d10-D11","day":10,"level":2,"set":"D","family":"F10","word":"confine","pos":"verb","ipa":"/kənˈfaɪn/","meaning_ko":"(범위를) 한정하다, 가두다","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"fine","type":"root","gloss":"경계 (finis)"}],"story":"라틴어 confinis(경계를 함께하는) → 경계 안에 두다 → 한정하다"},"example":{"q":"How do you limit the impact of a risky change?","a":"I confine it behind a feature flag, so it only reaches a small group of users at first.","a_ko":"기능 플래그 뒤에 가둬서 처음에는 일부 사용자에게만 나가게 합니다."},"collocations":["confine to","confine the impact","confined scope"],"related":["define","well-defined","final","infinite"],"tip":"영향 범위를 줄인다(blast radius)는 이야기에 잘 맞는 동사"},{"id":"d10-D12","day":10,"level":3,"set":"D","family":"F10","word":"affinity","pos":"noun","ipa":"/əˈfɪnəti/","meaning_ko":"친밀감, 잘 맞는 성향","category":"interview","etymology":{"parts":[{"text":"af","type":"prefix","gloss":"~에 (ad)"},{"text":"fin","type":"root","gloss":"경계 (finis)"},{"text":"ity","type":"suffix","gloss":"~한 성질"}],"story":"라틴어 affinis(경계에 맞닿은) → 가까운 관계 → 끌림, 잘 맞음"},"example":{"q":"Why do you prefer backend over frontend?","a":"I've always had a strong affinity for backend work, because I enjoy thinking about data flow and reliability more than visual details.","a_ko":"화면의 세세한 부분보다 데이터 흐름과 안정성을 고민하는 게 즐거워서, 늘 백엔드 일이 잘 맞았습니다."},"collocations":["an affinity for","natural affinity","strong affinity"],"related":["final","define","confine","finesse"],"tip":"IT 에서는 'node affinity'(특정 서버에 배치하는 규칙)로도 나옴"},{"id":"d10-D13","day":10,"level":3,"set":"D","family":"F10","word":"finesse","pos":"noun","ipa":"/fɪˈnes/","meaning_ko":"섬세한 솜씨, 수완","category":"interview","etymology":{"parts":[{"text":"fin","type":"root","gloss":"끝까지 다듬은 (finis)"},{"text":"esse","type":"suffix","gloss":"~함 (프랑스어 명사 어미)"}],"story":"프랑스어 fin(섬세한, 라틴어 finis 에서) + 명사 어미 → 섬세함 → 능숙한 솜씨"},"example":{"q":"How did you handle the angry client?","a":"It took some finesse: I acknowledged their frustration first, then offered a clear timeline for the fix instead of excuses.","a_ko":"섬세함이 필요했습니다. 먼저 불만을 인정하고, 변명 대신 수정 일정을 분명하게 제시했습니다."},"collocations":["with finesse","take some finesse","technical finesse"],"related":["refine","fine-tune","affinity"],"tip":"skill 보다 '미묘한 상황을 부드럽게 다루는 솜씨'. 발음 '피네스'"},{"id":"d10-D14","day":10,"level":1,"set":"D","family":"F10","word":"finance","pos":"noun","ipa":"/ˈfaɪnæns/","meaning_ko":"금융, 재무","category":"interview","etymology":{"parts":[{"text":"fin","type":"root","gloss":"끝 (finis)"},{"text":"ance","type":"suffix","gloss":"~하는 것"}],"story":"고대 프랑스어 finer(끝내다, 빚을 청산하다) → 지불 → 돈 관리 → 금융"},"example":{"q":"Which industry are you most interested in?","a":"I'm most interested in finance, because reliability really matters there.","a_ko":"안정성이 정말 중요한 분야라서 금융에 가장 관심이 있습니다."},"collocations":["work in finance","finance team","personal finance"],"related":["financial","final","finish"],"tip":"빚을 '끝내는(fin)' 것에서 돈을 다루는 일 전반으로 넓어짐"},{"id":"d10-D15","day":10,"level":1,"set":"D","family":"F10","word":"financial","pos":"adjective","ipa":"/faɪˈnænʃəl/","meaning_ko":"금융의, 재정의","category":"interview","etymology":{"parts":[{"text":"fin","type":"root","gloss":"끝 (finis)"},{"text":"anc","type":"suffix","gloss":"~하는 것 (ance)"},{"text":"ial","type":"suffix","gloss":"~의"}],"story":"finance(금융)의 → 금융의, 재정의"},"example":{"q":"Tell me about your previous company.","a":"I worked at a financial services company that processed millions of payments a day.","a_ko":"하루에 수백만 건의 결제를 처리하는 금융 서비스 회사에서 일했습니다."},"collocations":["financial services","financial data","financial goals"],"related":["finance","final","define"],"tip":"강세가 둘째 음절(fi-NAN-cial) — finance 와 강세 위치가 다름"},{"id":"d10-D16","day":10,"level":2,"set":"D","family":"F10","word":"terminal","pos":"noun","ipa":"/ˈtɜːrmɪnəl/","meaning_ko":"터미널, 단말기","category":"it","etymology":{"parts":[{"text":"termin","type":"root","gloss":"경계, 끝 (terminus)"},{"text":"al","type":"suffix","gloss":"~의 (것)"}],"story":"라틴어 terminus(경계, 끝) → 끝의 → 끝 역 → (컴퓨터) 명령을 입력하는 끝단, 터미널"},"example":{"q":"What's your development setup like?","a":"I spend most of my day in the terminal, so I've automated common tasks with shell scripts.","a_ko":"하루 대부분을 터미널에서 보내서 자주 하는 작업은 셸 스크립트로 자동화했습니다."},"collocations":["open a terminal","in the terminal","terminal command"],"related":["terminology","determine","determined","long-term"],"tip":"Day 30 의 terminate, Day 20 의 term 과 같은 어근 term(끝, 경계)"},{"id":"d10-D17","day":10,"level":2,"set":"D","family":"F10","word":"terminology","pos":"noun","ipa":"/ˌtɜːrmɪˈnɑːlədʒi/","meaning_ko":"전문 용어","category":"it","etymology":{"parts":[{"text":"termin","type":"root","gloss":"경계 → 용어 (terminus)"},{"text":"o","type":"suffix","gloss":"(연결 모음)"},{"text":"logy","type":"suffix","gloss":"말, 학문 (그리스어 logos)"}],"story":"terminus(경계 → 뜻의 경계를 정한 말, 용어) + 말 → 전문 용어"},"example":{"q":"How do you work with non-technical stakeholders?","a":"I avoid technical terminology and explain things with examples from their daily work instead.","a_ko":"기술 용어를 피하고, 대신 그분들의 일상 업무에서 예를 들어 설명합니다."},"collocations":["technical terminology","use consistent terminology","domain terminology"],"related":["terminal","determine","long-term"],"tip":"jargon(은어 같은 전문어)보다 중립적인 말"},{"id":"d10-D18","day":10,"level":2,"set":"D","family":"F10","word":"determine","pos":"verb","ipa":"/dɪˈtɜːrmɪn/","meaning_ko":"알아내다, 결정하다","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"완전히"},{"text":"termin","type":"root","gloss":"경계 (terminus)"},{"text":"e","type":"suffix","gloss":"(동사 어미)"}],"story":"라틴어 determinare(경계를 정하다) → 한계를 확정하다 → 알아내다, 결정하다"},"example":{"q":"What's your first step when an incident happens?","a":"First, I determine the scope of the impact, and then I look for the root cause in the logs.","a_ko":"먼저 영향 범위를 파악하고, 그다음 로그에서 근본 원인을 찾습니다."},"collocations":["determine the cause","determine the scope","be determined by"],"related":["determined","terminal","terminology","define"],"tip":"'find out'의 격식 있는 버전 — 장애 대응 설명에 잘 어울림"},{"id":"d10-D19","day":10,"level":1,"set":"D","family":"F10","word":"determined","pos":"adjective","ipa":"/dɪˈtɜːrmɪnd/","meaning_ko":"결의가 굳은, 단단히 마음먹은","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"완전히"},{"text":"termin","type":"root","gloss":"경계 (terminus)"},{"text":"ed","type":"suffix","gloss":"~된"}],"story":"경계가 완전히 정해진 → 마음이 정해진 → 결심이 굳은"},"example":{"q":"What's your greatest strength?","a":"I'm determined; once I start something, I see it through.","a_ko":"끈기가 있습니다. 한번 시작한 일은 끝까지 해냅니다."},"collocations":["determined to do","highly determined","quietly determined"],"related":["determine","terminal","long-term"],"tip":"강점 질문에서 'I never give up' 대신 'I'm determined'가 자연스러움"},{"id":"d10-D20","day":10,"level":1,"set":"D","family":"F10","word":"long-term","pos":"adjective","ipa":"/ˌlɔːŋ ˈtɜːrm/","meaning_ko":"장기적인","category":"interview","etymology":{"parts":[{"text":"long-","type":"part","gloss":"긴"},{"text":"term","type":"root","gloss":"기한, 경계 (terminus)"}],"story":"긴 + 기한(term ← terminus 경계) → 기한이 긴 → 장기적인"},"example":{"q":"What are your long-term career goals?","a":"My long-term goal is to become a tech lead.","a_ko":"장기적인 목표는 테크 리드가 되는 것입니다."},"collocations":["long-term goal","long-term plan","in the long term"],"related":["short-term","terminal","determine"],"tip":"명사 앞에서는 하이픈(long-term goal), 'in the long term'은 하이픈 없이"},{"id":"d10-D21","day":10,"level":1,"set":"D","family":"F10","word":"short-term","pos":"adjective","ipa":"/ˌʃɔːrt ˈtɜːrm/","meaning_ko":"단기적인","category":"interview","etymology":{"parts":[{"text":"short-","type":"part","gloss":"짧은"},{"text":"term","type":"root","gloss":"기한, 경계 (terminus)"}],"story":"짧은 + 기한 → 단기적인"},"example":{"q":"What are your goals for the first six months?","a":"My short-term goal is to learn your codebase and ship my first feature.","a_ko":"단기 목표는 코드베이스를 익히고 첫 기능을 출시하는 것입니다."},"collocations":["short-term goal","short-term fix","in the short term"],"related":["long-term","terminal","determined"],"tip":"'short-term fix'(임시방편)는 장애 대응 이야기에서도 자주 씀"},{"id":"d10-D22","day":10,"level":3,"set":"D","family":"F10","word":"interminable","pos":"adjective","ipa":"/ɪnˈtɜːrmɪnəbəl/","meaning_ko":"끝없이 이어지는, 지루하게 긴","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"~ 아닌"},{"text":"termin","type":"root","gloss":"끝, 경계 (terminus)"},{"text":"able","type":"suffix","gloss":"~할 수 있는"}],"story":"라틴어 interminabilis(끝낼 수 없는) → 끝없이 늘어지는"},"example":{"q":"How did you improve your team's meetings?","a":"Our status meetings had become interminable, so I proposed short written updates instead, which freed up about three hours a week per person.","a_ko":"현황 회의가 끝없이 늘어져서 짧은 서면 공유로 바꾸자고 제안했고, 한 사람당 주 3시간 정도를 아꼈습니다."},"collocations":["interminable meetings","interminable delays"],"related":["determine","terminal","terminology"],"tip":"endless 보다 '지루하고 짜증 날 만큼 길다'는 불만의 뉘앙스"},{"id":"d10-D23","day":10,"level":1,"set":"D","family":"F10","word":"full-time","pos":"adjective","ipa":"/ˌfʊl ˈtaɪm/","meaning_ko":"정규직의, 전일제의","category":"interview","etymology":{"parts":[{"text":"full-","type":"part","gloss":"가득 찬"},{"text":"time","type":"part","gloss":"시간"}],"story":"시간을 가득 채운 → 전일 근무의 → 정규직의"},"example":{"q":"Are you looking for contract work or a permanent position?","a":"I'm looking for a full-time role with a stable team.","a_ko":"안정적인 팀에서 일할 수 있는 정규직 자리를 찾고 있습니다."},"collocations":["full-time role","full-time employee","work full-time"],"related":["on-call","onboarding","start date"],"tip":"명사 앞에서는 full-time role, 부사로는 'work full time'(하이픈 없이도 씀)"},{"id":"d10-D24","day":10,"level":2,"set":"D","family":"F10","word":"on-call","pos":"adjective","ipa":"/ˈɑːn ˌkɔːl/","meaning_ko":"(장애 대응) 대기 근무의, 온콜의","category":"it","etymology":{"parts":[{"text":"on-","type":"part","gloss":"~ 상태로"},{"text":"call","type":"part","gloss":"부르다"}],"story":"부르면 바로 오는 상태의 → 장애에 대비해 대기하는"},"example":{"q":"Our team has an on-call rotation. Is that okay with you?","a":"Yes, I joined the on-call rotation at my last job, and it taught me a lot about how our system behaved under real traffic.","a_ko":"네, 전 직장에서 온콜 순번에 참여했는데, 실제 트래픽에서 시스템이 어떻게 움직이는지 많이 배웠습니다."},"collocations":["on-call rotation","be <script>
"use strict";
const WORDS = window.WORDS;
const FAMILIES = {
  F1:["보다·알다","spect · vis/vid · sci · cogn/gno · sens/sent · scop"],
  F2:["이끌다·가다·움직이다","duc · mov/mot · ven · cede/cess · grad/gress · sequ · it · cur · ag"],
  F3:["놓다·서다·머물다 (+손)","pon/pos · sta/sist · sid/sed · man/main · manu · loc · fix"],
  F4:["나르다·보내다·던지다","fer · port · mit/miss · ject · lat · via · gest · pher · bol"],
  F5:["잡다·쥐다·끌다","cap/cip/cept · ten/tain · tract · prehend · sum/sump · hab/hib"],
  F6:["만들다·채우다·쓰다","fac/fic/fect · struct · form · gen · ple/plete · scrib/sign"],
  F7:["돌리다·뻗다·묶다·바꾸다","vert/vers · plic/ply · tend/tens · nect/lig · mut/alter · flu"],
  F8:["깨다·자르다·풀다·닫다","rupt · fract/frag · sect/cis · part/vid · solv/lys · clud/clus"],
  F9:["말하다·믿다·다스리다","dic/dict · voc/vok · cred/fid · spond/spons · reg/rect · jur/leg"],
  F10:["값·재다·좋고 나쁨","pens/pend · val/vail · rat/quant · bene/grat · neg/counter · term/fin"]
};
const LV = {1:["🟢","기초"],2:["🟡","중급"],3:["🔴","고급"]};
const CAT = {interview:["🎤","면접"],it:["💻","IT"],negotiation:["🤝","협상"]};
const TYPE_KO = {prefix:"접두사",root:"어근",suffix:"접미사",part:"조각"};
const PERIOD_MIX = {1:"기초 50 · 중급 40 · 고급 10",2:"기초 30 · 중급 50 · 고급 20",3:"기초 20 · 중급 40 · 고급 40"};
const MOCK_DAYS = [10,20,30];
const SETS = ["A","B","C","D"];
const INTERVALS = [1,3,7];
const KEY = "mensetsu-tango:v1";

const byId = Object.fromEntries(WORDS.map(w => [w.id, w]));
const byDay = {};
WORDS.forEach(w => (byDay[w.day] ||= []).push(w));
const DAYS = Object.keys(byDay).map(Number).sort((a,b) => a-b);
const period = d => d <= 10 ? 1 : d <= 20 ? 2 : 3;

/* ---------- state ---------- */
const S = Object.assign({day:null, set:{}, prog:{}, hide:false,
  quiz:{scope:"day", lv:[1,2,3], type:"mix"}, revLv:[1,2,3]}, safeLoad());
function safeLoad(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
let view = "learn", cursor = null, reveal = false, quiz = null, mapFam = null, query = "";

const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today = () => ymd(new Date());
const inDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return ymd(d); };
const seen = id => !!S.prog[id]?.l;   /* l = studied on the 오늘의 학습 screen */
const dueList = () => WORDS.filter(w => { const p = S.prog[w.id]; return p && p.s === "again" && p.due <= today(); });

function learnMark(id, ok){
  S.prog[id] = ok ? {s:"known", l:1} : {s:"again", step:0, due:inDays(1), l:1};
  save();
}
function reviewMark(id, ok){
  const p = S.prog[id] || {s:"again", step:0}, l = p.l;
  if (!ok) S.prog[id] = {s:"again", step:0, due:inDays(1), l};
  else {
    const step = (p.step || 0) + 1;
    S.prog[id] = step >= INTERVALS.length ? {s:"known", l} : {s:"again", step, due:inDays(INTERVALS[step]), l};
  }
  save();
}
function quizWrong(id){
  const p = S.prog[id];
  if (!p || p.s !== "again" || p.due > inDays(1)) S.prog[id] = {s:"again", step:0, due:inDays(1), l:p?.l};
  save();
}
if (!S.day || !byDay[S.day]) S.day = DAYS.find(d => byDay[d].some(w => !seen(w.id))) || DAYS[0];

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const stripParen = s => String(s).replace(/\s*\([^)]*\)\s*/g, " ").trim();
function headSpan(w){
  const a = w.example.a, low = a.toLowerCase(), ph = w.word.toLowerCase();
  const i = low.indexOf(ph);
  if (i >= 0) return [i, i+ph.length, true];
  const stem = ph.split(/[\s-]/)[0].replace(/[ye]$/, "").slice(0,5).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const m = new RegExp("\\b" + stem + "[a-z]*", "i").exec(a);
  return m ? [m.index, m.index + m[0].length, !/[\s]/.test(ph)] : null;
}
function markHead(w){
  const sp = headSpan(w), a = w.example.a;
  if (!sp) return esc(a);
  return esc(a.slice(0,sp[0])) + "<mark>" + esc(a.slice(sp[0],sp[1])) + "</mark>" + esc(a.slice(sp[1]));
}
function say(text){
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = .95;
  speechSynthesis.speak(u);
}
const rootParts = w => w.etymology.parts.filter(p => p.type === "root");
/* the root that ties the word to its family: prefer one whose gloss names a source root "(spect)", then the longest */
function mainRoot(w){
  const rs = rootParts(w); if (!rs.length) return null;
  const tagged = rs.filter(p => /\(/.test(p.gloss));
  return (tagged.length ? tagged : rs).slice().sort((a,b) => b.text.length - a.text.length)[0];
}
const lvTag = l => `<span class="tag">${LV[l][0]} ${LV[l][1]}</span>`;
const catTag = c => `<span class="tag">${CAT[c][0]} ${CAT[c][1]}</span>`;

/* ---------- card ---------- */
function glossHTML(w){
  const parts = w.etymology.parts;
  const len = w.word.length;
  const size = len <= 8 ? "xl" : len <= 12 ? "l" : len <= 17 ? "m_" : "s";
  const label = w.word + " = " + parts.map(p => `${p.text}(${p.gloss})`).join(" + ");
  return `<div class="gloss ${size}" aria-label="${esc(label)}">` + parts.map((p,i) =>
    (i ? `<span class="dot" aria-hidden="true">·</span>` : "") +
    `<div class="m ${esc(p.type)}"><span class="t">${esc(p.text)}</span><span class="u"></span><span class="g"><em>${TYPE_KO[p.type]||""}</em>${esc(p.gloss)}</span></div>`
  ).join("") + `</div>`;
}
function cardHTML(w, {hide=false, counter=""} = {}){
  const fam = FAMILIES[w.family];
  const rel = (w.related||[]).map(r => {
    const t = WORDS.find(x => x.word.toLowerCase() === r.toLowerCase());
    return t ? `<button type="button" data-act="open" data-id="${t.id}">${esc(r)}</button>` : `<span>${esc(r)}</span>`;
  }).join("");
  return `<article class="card" id="card">
    <div class="meta">${lvTag(w.level)}${catTag(w.category)}<span class="pos">${esc(w.pos)}</span>
      ${counter ? `<span class="counter">${counter}</span>` : ""}
      <button class="icon" type="button" data-act="say" data-text="${esc(w.word)}" aria-label="단어 발음 듣기">🔊</button></div>
    ${glossHTML(w)}
    <p class="ipa">${esc(w.ipa)}</p>
    ${hide ? `<button class="revealbtn" type="button" data-act="reveal">뜻 보기 <small>(Space)</small></button>` : `
    <p class="meaning">${esc(w.meaning_ko)}</p>
    <p class="story">${esc(w.etymology.story)}</p>
    <section class="transcript">
      <h3>면접에서 이렇게</h3>
      <div class="line q"><span class="who">Q</span><p>${esc(w.example.q)}</p></div>
      <div class="line a"><span class="who">A</span><p>${markHead(w)}<span class="ko">${esc(w.example.a_ko)}</span></p></div>
      <button class="icon listen" type="button" data-act="say" data-text="${esc(w.example.a)}">▶ 답변 듣기</button>
    </section>
    <section class="side">
      <div><h3>자주 쓰는 표현</h3><div class="chips">${(w.collocations||[]).map(c => `<span>${esc(c)}</span>`).join("")}</div></div>
      <div><h3>같은 어근 · ${esc(fam ? fam[0] : w.family)}</h3><div class="chips">${rel}</div></div>
    </section>
    <p class="tip">💡 ${esc(w.tip)}</p>`}
  </article>`;
}

/* ---------- rail ---------- */
function railHTML(){
  const rows = [1,2,3].map(p => {
    const cells = [];
    for (let d = (p-1)*10+1; d <= p*10; d++){
      const ws = byDay[d] || [], n = ws.filter(w => seen(w.id)).length;
      const cls = [n && n === ws.length ? "done" : n ? "part" : "", d === S.day ? "now" : "", MOCK_DAYS.includes(d) ? "mock" : ""].join(" ");
      cells.push(`<button type="button" class="${cls}" data-act="day" data-day="${d}" ${ws.length ? "" : "disabled"} ${d === S.day ? 'aria-current="date"' : ""} aria-label="Day ${d}${ws.length ? ` ${n}/100` : " 준비 중"}">${d}</button>`);
    }
    return `<div><span class="lvname">${p}구간 · ${PERIOD_MIX[p]}</span><div class="days">${cells.join("")}</div></div>`;
  }).join("");
  const ws = byDay[S.day];
  const rc = {};
  ws.forEach(w => rootParts(w).forEach(p => { const k = p.text.toLowerCase(); (rc[k] ||= {n:0, g:stripParen(p.gloss)}).n++; }));
  const top = Object.entries(rc).sort((a,b) => b[1].n - a[1].n).slice(0,6);
  const cats = Object.keys(CAT).map(c => {
    const all = ws.filter(w => w.category === c); if (!all.length) return "";
    const n = all.filter(w => seen(w.id)).length;
    return `<div><span>${CAT[c][0]} ${CAT[c][1]}</span><span>${n} / ${all.length}</span></div><div class="meter"><i style="width:${n/all.length*100}%"></i></div>`;
  }).join("");
  return `<aside class="rail">
    <h2>30일 진도</h2><div class="levels">${rows}</div>
    <p class="legend">점선 = 모의 면접 날 · 회색 칸 = 아직 준비 중</p>
    <h2>Day ${S.day} · ${esc(FAMILIES[ws[0].family][0])} 가족</h2>
    <ul class="roots">${top.map(([k,v]) => `<li><code>${esc(k)}</code><span>${esc(v.g)}</span><small>${v.n}</small></li>`).join("")}</ul>
    <h2>오늘의 분야</h2><div class="mix">${cats}</div>
    <button class="linkbtn" type="button" data-act="reset">진도 초기화</button>
  </aside>`;
}

/* ---------- learn ---------- */
function setWords(){ return byDay[S.day].filter(w => w.set === (S.set[S.day] || "A")); }
function learnHTML(){
  const set = S.set[S.day] || "A";
  const ws = setWords();
  if (cursor === null){ cursor = ws.findIndex(w => !seen(w.id)); if (cursor < 0) cursor = ws.length; }
  const di = DAYS.indexOf(S.day);
  const sets = SETS.map(s => {
    const sw = byDay[S.day].filter(w => w.set === s), n = sw.filter(w => seen(w.id)).length;

  }).join("");
  let mock = "";
  if (MOCK_DAYS.includes(S.day)){
    const qs = shuffle([...new Set(WORDS.filter(w => period(w.day) === period(S.day) && w.category === "interview").map(w => w.example.q))]).slice(0,5);
    mock = `<div class="banner"><b>모의 면접 날</b> — 이번 구간에서 배운 단어로 아래 질문에 소리 내어 답해 보세요.<ol>${qs.map(q => `<li>${esc(q)}</li>`).join("")}</ol></div>`;
  }
  let body;
  if (cursor >= ws.length){
    const again = ws.filter(w => S.prog[w.id]?.s === "again").length;
    const nextSet = SETS[SETS.indexOf(set)+1];
    body = `<div class="panel"><h2>세트 ${set} 끝!</h2>
      <p class="lead">외웠어요 ${ws.length - again}개 · 다시 볼래요 ${again}개 — 다시 볼래요 단어는 내일 복습에 나와요.</p>
      <div class="row">
        <button class="primary" type="button" data-act="quizset">세트 ${set} 퀴즈 풀기</button>
        ${nextSet ? `<button class="btn-s" type="button" data-act="set" data-set="${nextSet}">세트 ${nextSet}로 →</button>`
          : DAYS[di+1] ? `<button class="btn-s" type="button" data-act="day" data-day="${DAYS[di+1]}">Day ${DAYS[di+1]}로 →</button>` : ""}
        <button class="btn-s" type="button" data-act="restart">세트 ${set} 다시 보기</button>
      </div></div>`;
  } else {
    const w = ws[cursor];
    body = cardHTML(w, {hide: S.hide && !reveal, counter: `${cursor+1} / ${ws.length}`}) + `
      <div class="actions">
        <button class="prev" type="button" data-act="prev" ${cursor ? "" : "disabled"} aria-label="이전 단어">←</button>
        <button class="again" type="button" data-act="learn" data-ok="0">다시 볼래요</button>
        <button class="know" type="button" data-act="learn" data-ok="1">외웠어요<span class="long"> → 다음 단어</span></button>
      </div>
      <p class="hint">키보드: ← 다시 볼래요 · → 외웠어요 · Space 뜻 보기 · 휴대폰: 카드를 왼쪽/오른쪽으로 밀기</p>`;
  }
  return `<div class="wrap">${railHTML()}<main>
    <div class="dayhead">
      <div><h1>Day ${S.day}</h1><div class="sub">${period(S.day)}구간 · ${esc(FAMILIES[byDay[S.day][0].family][0])}</div></div>
      <div class="arrows">
        <button class="btn-s" type="button" data-act="hide" aria-pressed="${S.hide}">뜻 가리기</button>
        <button class="btn-s" type="button" data-act="day" data-day="${DAYS[di-1]}" ${di > 0 ? "" : "disabled"} aria-label="이전 Day">‹</button>
        <button class="btn-s" type="button" data-act="day" data-day="${DAYS[di+1]}" ${DAYS[di+1] ? "" : "disabled"} aria-label="다음 Day">›</button>
      </div>
    </div>
    <div class="sets" aria-label="세트 진행">${sets}</div>
    ${mock}${body}
  </main></div>`;
}

/* ---------- quiz ---------- */
function quizPool(scope, lv){
  let ws = scope === "set" ? setWords() : scope === "day" ? byDay[S.day] : scope === "seen" ? WORDS.filter(w => seen(w.id)) : WORDS;
  return ws.filter(w => lv.includes(w.level));
}
function eligible(w, t){
  if (t === "blank"){ const sp = headSpan(w); return !!sp && sp[2]; }
  if (t === "root") return rootParts(w).length > 0;
  return true;
}
function distract(w, pool, key, n=3){
  const val = key(w), out = new Set();
  const cand = shuffle(pool.length >= 8 ? pool : byDay[w.day]).concat(shuffle(WORDS));
  for (const x of cand){ const v = key(x); if (v && v !== val && !out.has(v)) out.add(v); if (out.size === n) break; }
  return shuffle([val, ...out]);
}
function makeQuiz(){
  const {scope, lv, type} = S.quiz;
  const pool = quizPool(scope, lv);
  const qs = [];
  for (const w of shuffle(pool)){
    const types = (type === "mix" ? ["meaning","blank","root"] : [type]).filter(t => eligible(w,t));
    if (!types.length) continue;
    const t = types[Math.floor(Math.random()*types.length)];
    if (t === "meaning") qs.push({w, t, opts: distract(w, pool, x => x.meaning_ko), ans: w.meaning_ko});
    if (t === "blank")   qs.push({w, t, opts: distract(w, pool, x => x.word), ans: w.word});
    if (t === "root"){ const g = x => { const r = mainRoot(x); return r ? stripParen(r.gloss) : null; };
      qs.push({w, t, opts: distract(w, pool, g), ans: g(w)}); }
    if (qs.length === 10) break;
  }
  return {qs, i:0, picked:null, right:0, wrong:[]};
}
function quizHTML(){
  if (!quiz){
    const q = S.quiz, n = quizPool(q.scope, q.lv).length;
    const opt = (k, v, label) => `<button class="btn-s" type="button" data-act="qopt" data-k="${k}" data-v="${v}" aria-pressed="${k === "lv" ? q.lv.includes(+v) : q[k] === v}">${label}</button>`;
    return `<div class="wrap single"><main><div class="panel">
      <h2>퀴즈</h2><p class="lead">10문제씩 풀어요. 틀린 단어는 내일 복습에 자동으로 들어가요.</p>
      <div class="field"><span>범위</span><div class="seg">
        ${opt("scope","set",`Day ${S.day} 세트 ${S.set[S.day]||"A"}`)}${opt("scope","day",`Day ${S.day} 전체`)}${opt("scope","seen","지금까지 본 단어")}${opt("scope","all",`전체 Day ${DAYS[0]}–${DAYS[DAYS.length-1]}`)}</div></div>
      <div class="field"><span>난이도</span><div class="seg">${[1,2,3].map(l => opt("lv", l, LV[l].join(" "))).join("")}</div></div>
      <div class="field"><span>문제 유형</span><div class="seg">
        ${opt("type","mix","섞어서")}${opt("type","meaning","뜻 맞히기")}${opt("type","blank","예문 빈칸")}${opt("type","root","어근 뜻")}</div></div>
      <div class="row"><button class="primary" type="button" data-act="qstart" ${n >= 4 ? "" : "disabled"}>시작하기</button>
        <span class="qhint">${n >= 4 ? `문제로 나올 수 있는 단어 ${n}개` : "단어가 4개 이상 있어야 해요. 범위나 난이도를 넓혀 주세요."}</span></div>
    </div></main></div>`;
  }
  if (quiz.i >= quiz.qs.length){
    return `<div class="wrap single"><main><div class="panel">
      <p class="score">${quiz.right} / ${quiz.qs.length}</p>
      <h2>${quiz.right === quiz.qs.length ? "모두 맞혔어요!" : "틀린 단어는 내일 복습에 나와요"}</h2>
      ${quiz.wrong.length ? `<ul class="results">${quiz.wrong.map(w => resultRow(w)).join("")}</ul>` : ""}
      <div class="row" style="margin-top:20px"><button class="primary" type="button" data-act="qstart">한 번 더</button>
        <button class="btn-s" type="button" data-act="qsetup">범위 바꾸기</button></div>
    </div></main></div>`;
  }
  const q = quiz.qs[quiz.i], w = q.w, done = quiz.picked !== null;
  let prompt;
  if (q.t === "meaning") prompt = `<div class="qprompt">${esc(w.word)}</div><div class="qhint">${esc(w.ipa)}</div><p class="qask">이 단어의 뜻은?</p>`;
  if (q.t === "blank"){ const sp = headSpan(w), a = w.example.a;
    prompt = `<div class="qhint">Q. ${esc(w.example.q)}</div><p class="qsent">${esc(a.slice(0,sp[0]))}<span class="blank">${done ? esc(a.slice(sp[0],sp[1])) : "&nbsp;"}</span>${esc(a.slice(sp[1]))}</p><div class="qhint">${esc(w.example.a_ko)}</div><p class="qask">빈칸에 들어갈 단어는?</p>`; }
  if (q.t === "root"){ const r = mainRoot(w);
    prompt = `<div class="qprompt">${w.etymology.parts.map(p => p === r ? `<span style="color:var(--root)">${esc(p.text)}</span>` : esc(p.text)).join("")}</div><p class="qask">어근 <b style="color:var(--root)">${esc(r.text)}</b> 의 뜻은?</p>`; }
  const opts = q.opts.map((o,i) => {
    const cls = done ? (o === q.ans ? "right" : i === quiz.picked ? "wrong" : "") : "";
    return `<button class="opt ${cls}" type="button" data-act="qpick" data-i="${i}" ${done ? "disabled" : ""}>${esc(o)}</button>`;
  }).join("");
  return `<div class="wrap single"><main><div class="panel">
    <div class="qtop"><span>${quiz.i+1} / ${quiz.qs.length}</span><span>${LV[w.level].join(" ")} · Day ${w.day}</span></div>
    ${prompt}<div class="opts">${opts}</div>
    ${done ? `<div class="explain"><b>${esc(w.word)}</b> — ${esc(w.meaning_ko)}<br>${esc(w.etymology.story)}</div>
      <div class="row" style="margin-top:14px"><button class="primary" type="button" data-act="qnext">${quiz.i+1 < quiz.qs.length ? "다음 문제" : "결과 보기"}</button>
      <button class="btn-s" type="button" data-act="open" data-id="${w.id}">카드 보기</button></div>` : ""}
  </div></main></div>`;
}

/* ---------- review ---------- */

      <p class="lead">오늘의 학습에서 「다시 볼래요」를 누르거나 퀴즈에서 틀린 단어가 1일 · 3일 · 7일 뒤에 여기 나와요.${later ? ` 나중에 나올 단어: ${later}개` : ""}</p>

      </div>

    <div class="dayhead"><div><h1>복습</h1><div class="sub">오늘 ${due.length}개</div></div><div class="arrows">${chips}</div></div>
    ${body}</main></div>`;
}

/* ---------- root map ---------- */
function resultRow(w){
  return `<li><button type="button" data-act="open" data-id="${w.id}"><b>${esc(w.word)}</b><span>${LV[w.level][0]} ${esc(w.meaning_ko)}</span><small>Day ${w.day}</small></button></li>`;
}
function mapHTML(){
  let body;
  const q = query.trim().toLowerCase();
  if (q){
    const hits = WORDS.filter(w => w.word.toLowerCase().includes(q) || w.meaning_ko.includes(q) || w.etymology.parts.some(p => p.text.toLowerCase() === q)).slice(0,80);
    body = hits.length ? `<ul class="results">${hits.map(resultRow).join("")}</ul>` : `<p class="empty">“${esc(query)}” 에 맞는 단어가 없어요. 영어 철자, 한국어 뜻, 어근(예: spect)으로 찾을 수 있어요.</p>`;
  } else if (mapFam){
    const ws = WORDS.filter(w => w.family === mapFam);
    const groups = {};
    ws.forEach(w => { const r = mainRoot(w); const k = r ? r.text.toLowerCase() : "＊핵심어"; (groups[k] ||= {g: r ? stripParen(r.gloss) : "어근 없는 합성어·구동사", ws: []}).ws.push(w); });
    const sorted = Object.entries(groups).sort((a,b) => b[1].ws.length - a[1].ws.length);
    body = `<button class="btn-s" type="button" data-act="fam" data-f="">← 가족 목록</button>
      <h2 style="font-family:var(--display);margin:14px 0 4px">${mapFam} ${esc(FAMILIES[mapFam][0])}</h2>
      <p class="qhint" style="margin:0 0 10px">${ws.length}단어 · ${[...new Set(ws.map(w => w.day))].map(d => "Day " + d).join(", ")}</p>
      ${sorted.map(([k,v]) => `<div class="rgroup"><h3><code>${esc(k)}</code>${esc(v.g)} <small>${v.ws.length}</small></h3>
        <div class="chips">${v.ws.sort((a,b) => a.level - b.level).map(w => `<button type="button" data-act="open" data-id="${w.id}">${LV[w.level][0]} ${esc(w.word)}</button>`).join("")}</div></div>`).join("")}`;
  } else {
    body = `<div class="fams">${Object.entries(FAMILIES).map(([f,[name,roots]]) => {
      const n = WORDS.filter(w => w.family === f).length;
      return `<button class="fam" type="button" data-act="fam" data-f="${f}" ${n ? "" : "disabled"}><b>${f} ${esc(name)}</b><code>${esc(roots)}</code><small>${n ? n + "단어" : "준비 중"}</small></button>`;
    }).join("")}</div>`;
  }
  return `<div class="wrap single"><main>
    <div class="dayhead"><div><h1>어근 지도</h1><div class="sub">뜻이 비슷한 어근 10가족 · 전체 ${WORDS.length}단어</div></div></div>
    <input class="search" id="search" type="search" placeholder="단어·뜻·어근 찾기 (예: spect, 기대)" value="${esc(query)}" aria-label="단어 찾기">
    ${body}</main></div>`;
}

/* ---------- render ---------- */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = view === "quiz" ? quizHTML() : view === "review" ? reviewHTML() : view === "map" ? mapHTML() : learnHTML();
  document.querySelectorAll(".bar nav button").forEach(b => b.toggleAttribute("aria-current", b.dataset.view === view));
  const n = dueList().length;
  document.getElementById("revcount").innerHTML = n ? `<span class="badge">${n}</span>` : "";
  document.getElementById("daychip").textContent = `Day ${S.day} · ${period(S.day)}구간`;
  bindSwipe();
}
function openSheet(id){
  const sh = document.getElementById("sheet");
  sh.querySelector(".inner").innerHTML = `<button class="close" type="button" data-act="close">닫기 ✕</button>` + cardHTML(byId[id]);
  sh.hidden = false; sh.scrollTop = 0; sh.querySelector(".close").focus();
}
function closeSheet(){ document.getElementById("sheet").hidden = true; }

function act(a, el){
  const d = el.dataset;
  switch (a){
    case "go": view = d.view; reveal = false; closeSheet(); if (view === "learn") cursor = null; break;
    case "day": if (!d.day || !byDay[+d.day]) return; S.day = +d.day; cursor = null; reveal = false; view = "learn"; save(); break;
    case "set": S.set[S.day] = d.set; cursor = null; reveal = false; save(); break;
    case "learn": { const w = setWords()[cursor]; learnMark(w.id, d.ok === "1"); cursor++; reveal = false; break; }
    case "prev": cursor = Math.max(0, cursor-1); reveal = false; break;
    case "restart": cursor = 0; break;
    case "hide": S.hide = !S.hide; reveal = false; save(); break;
    case "reveal": reveal = true; break;
    case "say": say(d.text); return;
    case "rev": { const w = dueList().filter(x => S.revLv.includes(x.level))[0]; if (w) reviewMark(w.id, d.ok === "1"); reveal = false; break; }
    case "revlv": { const v = +d.v; S.revLv = S.revLv.includes(v) ? S.revLv.filter(x => x !== v) : [...S.revLv, v].sort(); save(); break; }
    case "qopt": { const q = S.quiz; if (d.k === "lv"){ const v = +d.v; q.lv = q.lv.includes(v) ? q.lv.filter(x => x !== v) : [...q.lv, v].sort(); } else q[d.k] = d.v; save(); break; }
    case "quizset": S.quiz.scope = "set"; save(); view = "quiz"; quiz = makeQuiz(); break;
    case "qstart": quiz = makeQuiz(); if (!quiz.qs.length) quiz = null; break;
    case "qsetup": quiz = null; break;
    case "qpick": { const i = +d.i, q = quiz.qs[quiz.i]; quiz.picked = i;
      if (q.opts[i] === q.ans) quiz.right++; else { quiz.wrong.push(q.w); quizWrong(q.w.id); } break; }
    case "qnext": quiz.i++; quiz.picked = null; break;
    case "fam": mapFam = d.f || null; break;
    case "open": openSheet(d.id); return;
    case "close": closeSheet(); return;
    case "reset": if (confirm("모든 진도와 복습 기록을 지울까요? 되돌릴 수 없어요.")){ S.prog = {}; S.set = {}; save(); cursor = null; } break;
    default: return;
  }
  render();
  if (["learn","prev","set","day","go","rev","qnext","qstart"].includes(a)) window.scrollTo({top:0});
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled) act(el.dataset.act, el);
  else if (e.target.id === "sheet") closeSheet();
});
document.addEventListener("input", e => {
  if (e.target.id !== "search") return;
  query = e.target.value; const pos = e.target.selectionStart;
  render(); const s = document.getElementById("search"); s.focus(); s.setSelectionRange(pos,pos);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") return closeSheet();
  if (!document.getElementById("sheet").hidden || /INPUT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  const click = sel => { const b = document.querySelector(sel); if (b && !b.disabled){ e.preventDefault(); act(b.dataset.act, b); } };
  if (view === "learn" || view === "review"){
    const pre = view === "learn" ? "learn" : "rev";
    if (e.key === "ArrowRight") click(`[data-act="${pre}"][data-ok="1"]`);
    if (e.key === "ArrowLeft") click(`[data-act="${pre}"][data-ok="0"]`);
    if (e.key === " ") click('[data-act="reveal"]');
  }
  if (view === "quiz" && quiz){
    if (/^[1-4]$/.test(e.key)) click(`[data-act="qpick"][data-i="${+e.key-1}"]`);
    if (e.key === "Enter") click('[data-act="qnext"]');
  }
});
function bindSwipe(){
  const card = document.getElementById("card");
  if (!card || !(view === "learn" || view === "review")) return;
  let x0 = null, y0 = null;
  card.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  card.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const pre = view === "learn" ? "learn" : "rev";
    const b = document.querySelector(`[data-act="${pre}"][data-ok="${dx > 0 ? 1 : 0}"]`);
    if (b) act(b.dataset.act, b);
  });
}
render();
</script>
</body>
</html>
