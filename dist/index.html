mmates say about you?","a":"They would say I'm reliable because I always deliver what I promise.","a_ko":"제가 약속한 건 늘 해내서 믿을 만하다고 말할 겁니다."},"collocations":["reliable source","highly reliable","reliable teammate"],"related":["reliability","rely","ally","liaison"],"tip":"rely on(~에 의지하다)의 형용사. 강점 질문의 단골 단어"},{"id":"d07-B14","day":7,"level":2,"set":"B","family":"F7","word":"reliability","pos":"noun","ipa":"/rɪˌlaɪəˈbɪləti/","meaning_ko":"안정성, 신뢰성","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"단단히·다시"},{"text":"li","type":"root","gloss":"묶다 (lig)"},{"text":"ability","type":"suffix","gloss":"~할 수 있음"}],"story":"기댈 수 있음(reliable) → 믿을 수 있는 정도 → (시스템의) 안정성"},"example":{"q":"What does good engineering mean to you?","a":"For me it means reliability first, because a fast feature is useless if the service keeps going down.","a_ko":"저에게는 안정성이 먼저입니다. 서비스가 계속 죽으면 빨리 만든 기능도 소용이 없으니까요."},"collocations":["site reliability engineering","improve reliability","reliability target"],"related":["reliable","rely","liability","ally"],"tip":"SRE = Site Reliability Engineering"},{"id":"d07-B15","day":7,"level":2,"set":"B","family":"F7","word":"ally","pos":"noun","ipa":"/ˈælaɪ/","meaning_ko":"협력자, 우군","category":"interview","etymology":{"parts":[{"text":"al","type":"prefix","gloss":"~에 (ad)"},{"text":"ly","type":"root","gloss":"묶다 (lig)"}],"story":"라틴어 alligare(~에 묶다) → 고대 프랑스어 alier → 한편으로 묶인 사람 → 동맹, 협력자"},"example":{"q":"How did you get support for your idea?","a":"I found an ally in the product manager, who helped me present the data to leadership.","a_ko":"프로덕트 매니저라는 협력자를 찾았고, 그분이 경영진에게 데이터를 발표하는 걸 도와주었습니다."},"collocations":["find an ally","a strong ally","ally with"],"related":["alliance","rally","reliable","liaison"],"tip":"명사는 '앨라이'로 첫 음절에, 동사는 '얼라이'로 둘째 음절에 강세가 오는 경우가 많음"},{"id":"d07-B16","day":7,"level":2,"set":"B","family":"F7","word":"rally","pos":"verb","ipa":"/ˈræli/","meaning_ko":"(사람들을) 결집시키다, 힘을 모으다","category":"interview","etymology":{"parts":[{"text":"r","type":"prefix","gloss":"다시 (re)"},{"text":"ally","type":"root","gloss":"한편으로 묶다 (ad + lig)"}],"story":"프랑스어 rallier = re(다시) + allier(한편으로 묶다) → 흩어진 사람을 다시 모으다 → 결집시키다"},"example":{"q":"Tell me about a time you led without authority.","a":"During a long outage, I rallied engineers from three teams around a single incident channel and a clear plan.","a_ko":"긴 장애가 났을 때, 세 팀의 엔지니어를 하나의 장애 대응 채널과 명확한 계획 아래로 모았습니다."},"collocations":["rally the team","rally around","rally support"],"related":["ally","alliance","reliable"],"tip":"rally the team 은 리더십 질문에 쓰기 좋은 표현"},{"id":"d07-B17","day":7,"level":2,"set":"B","family":"F7","word":"liaison","pos":"noun","ipa":"/ˈliːəzɑːn/","meaning_ko":"연락 담당, 가교 역할","category":"interview","etymology":{"parts":[{"text":"liais","type":"root","gloss":"묶다 (lig)"},{"text":"on","type":"suffix","gloss":"~하는 것"}],"story":"라틴어 ligare → 프랑스어 lier(묶다) → 묶어 주는 것 → 연결 → 연락 담당"},"example":{"q":"How do you work with non-technical teams?","a":"I acted as the liaison between our engineers and a Japanese client, translating requirements in both directions.","a_ko":"엔지니어와 일본 고객사 사이에서 연락 담당을 맡아 양쪽의 요구사항을 서로 전달했습니다."},"collocations":["act as a liaison","liaison between A and B","liaison role"],"related":["ally","rally","reliable","liability"],"tip":"발음 '리-어전'. 한국 회사에서 말하는 '브릿지' 역할을 영어로는 이렇게"},{"id":"d07-B18","day":7,"level":3,"set":"B","family":"F7","word":"alliance","pos":"noun","ipa":"/əˈlaɪəns/","meaning_ko":"협력 관계, 동맹","category":"interview","etymology":{"parts":[{"text":"al","type":"prefix","gloss":"~에 (ad)"},{"text":"li","type":"root","gloss":"묶다 (lig)"},{"text":"ance","type":"suffix","gloss":"~하는 것"}],"story":"~에 묶임(ally) → 한편이 됨 → 협력 관계, 동맹"},"example":{"q":"How do you work across departments?","a":"I built an alliance with the QA lead early on, so when deadlines got tight, we already trusted each other and could cut scope together.","a_ko":"초기부터 QA 리드와 협력 관계를 쌓아 두었기 때문에, 마감이 빠듯해졌을 때 이미 서로 믿고 함께 범위를 줄일 수 있었습니다."},"collocations":["build an alliance","form an alliance","strategic alliance"],"related":["ally","rally","reliable","liaison"],"tip":"회사 간 제휴(strategic alliance)에도 쓰지만, 면접에서는 '부서 간 협력 관계'로 쓰면 시니어답게 들림"},{"id":"d07-B19","day":7,"level":3,"set":"B","family":"F7","word":"liability","pos":"noun","ipa":"/ˌlaɪəˈbɪləti/","meaning_ko":"부담(이 되는 것), 법적 책임","category":"interview","etymology":{"parts":[{"text":"li","type":"root","gloss":"묶다 (lig)"},{"text":"ability","type":"suffix","gloss":"~할 수 있음"}],"story":"(법·의무에) 묶일 수 있음(liable) → 책임 → 짐이 되는 존재"},"example":{"q":"What would you do with a system nobody wants to touch?","a":"That legacy service had become a liability because only one engineer understood it, so I documented it and trained two others before we refactored it.","a_ko":"그 레거시 서비스는 아는 사람이 한 명뿐이라 이미 부담이 되어 있었습니다. 그래서 리팩터링 전에 문서화하고 두 명을 더 교육했습니다."},"collocations":["become a liability","legal liability","limited liability"],"related":["reliable","reliability","ally","liaison"],"tip":"asset(자산)의 반대말. a liability 는 '짐·골칫거리'라는 뜻으로 자주 씀"},{"id":"d07-B20","day":7,"level":1,"set":"B","family":"F7","word":"attend","pos":"verb","ipa":"/əˈtend/","meaning_ko":"참석하다","category":"interview","etymology":{"parts":[{"text":"at","type":"prefix","gloss":"~쪽으로 (ad)"},{"text":"tend","type":"root","gloss":"뻗다"}],"story":"~쪽으로 (마음을) 뻗다(attendere) → 주의를 기울이다 → 그 자리에 가다 → 참석하다"},"example":{"q":"How do you keep learning outside work?","a":"I attend a local developer meetup every month to learn from other engineers.","a_ko":"매달 지역 개발자 모임에 참석해서 다른 엔지니어들에게 배웁니다."},"collocations":["attend a meeting","attend a conference","attend to"],"related":["attention","intend","tend","extent"],"tip":"attend 는 바로 목적어: attend a meeting (to 없음). attend to 는 '처리하다, 돌보다'"},{"id":"d07-B21","day":7,"level":1,"set":"B","family":"F7","word":"attention","pos":"noun","ipa":"/əˈtenʃn/","meaning_ko":"주의, 관심","category":"interview","etymology":{"parts":[{"text":"at","type":"prefix","gloss":"~쪽으로 (ad)"},{"text":"tent","type":"root","gloss":"뻗다 (tend)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"~쪽으로 마음을 뻗음 → 주의, 관심"},"example":{"q":"What is your greatest strength?","a":"My strength is attention to detail, especially when I review code.","a_ko":"제 강점은 꼼꼼함입니다. 특히 코드를 리뷰할 때 그렇습니다."},"collocations":["attention to detail","pay attention to","bring to someone's attention"],"related":["attend","intention","tension","tend"],"tip":"attention to detail = '꼼꼼함'. 강점 질문 단골 표현"},{"id":"d07-B22","day":7,"level":2,"set":"B","family":"F7","word":"contend","pos":"verb","ipa":"/kənˈtend/","meaning_ko":"(어려움과) 씨름하다, 주장하다","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께·힘껏"},{"text":"tend","type":"root","gloss":"뻗다"}],"story":"힘껏 뻗다(contendere) → 맞서 애쓰다 → (문제와) 씨름하다, 강하게 주장하다"},"example":{"q":"What was the hardest part of that project?","a":"We had to contend with a ten-year-old codebase that had almost no tests.","a_ko":"테스트가 거의 없는 10년 된 코드베이스와 씨름해야 했습니다."},"collocations":["contend with","contend that","have to contend with"],"related":["tend","attend","intend","extent"],"tip":"contend with = deal with 의 격식 있는 버전. 형용사 contentious 는 Day 27"},{"id":"d07-B23","day":7,"level":1,"set":"B","family":"F7","word":"catch up","pos":"phrasal verb","ipa":"/kætʃ ʌp/","meaning_ko":"따라잡다, (밀린 것을) 만회하다","category":"interview","etymology":{"parts":[{"text":"catch","type":"part","gloss":"잡다"},{"text":"up","type":"part","gloss":"끝까지"}],"story":"붙잡을 때까지 쫓아가다 → 뒤처진 것을 따라잡다"},"example":{"q":"How do you get back to work after a long vacation?","a":"I catch up by reading the team's meeting notes and recent pull requests first.","a_ko":"먼저 팀 회의록과 최근 풀 리퀘스트를 읽으면서 밀린 내용을 따라잡습니다."},"collocations":["catch up on","catch up with","play catch-up"],"related":["keep up with","ramp up","get used to"],"tip":"catch up on + 밀린 일, catch up with + 사람·경쟁자"},{"id":"d07-B24","day":7,"level":1,"set":"B","family":"F7","word":"get used to","pos":"phrase","ipa":"/ɡet ˈjuːst tə/","meaning_ko":"~에 익숙해지다","category":"interview","etymology":{"parts":[{"text":"get","type":"part","gloss":"~하게 되다"},{"text":"used","type":"part","gloss":"익숙한"},{"text":"to","type":"part","gloss":"~에"}],"story":"익숙한(used) 상태가 되다(get) → ~에 익숙해지다"},"example":{"q":"How do you adapt to a new team?","a":"I got used to a new codebase quickly by fixing small bugs first.","a_ko":"작은 버그부터 고치면서 새 코드베이스에 빨리 익숙해졌습니다."},"collocations":["get used to it","get used to working","be used to"],"related":["catch up","ramp up","pick up"],"tip":"to 뒤에는 -ing: get used to working remotely. used 발음은 '유스트'"},{"id":"d07-B25","day":7,"level":1,"set":"B","family":"F7","word":"pick up","pos":"phrasal verb","ipa":"/pɪk ʌp/","meaning_ko":"(기술을) 금방 익히다","category":"interview","etymology":{"parts":[{"text":"pick","type":"part","gloss":"집다"},{"text":"up","type":"part","gloss":"위로"}],"story":"집어 들다 → 자연스럽게 얻다 → (기술·언어를) 금방 익히다"},"example":{"q":"How fast do you learn new technologies?","a":"I pick up new languages quickly; I learned Go in two weeks for a project.","a_ko":"새 언어를 빨리 익힙니다. 한 프로젝트를 위해 Go를 2주 만에 배웠습니다."},"collocations":["pick up a skill","pick up quickly","pick up where I left off"],"related":["catch up","get used to","learning curve"],"tip":"learn 보다 '자연스럽게 금방 익히다'라는 느낌"},{"id":"d07-C01","day":7,"level":1,"set":"C","family":"F7","word":"conversation","pos":"noun","ipa":"/ˌkɑːnvərˈseɪʃn/","meaning_ko":"대화","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"vers","type":"root","gloss":"돌리다 (vert)"},{"text":"ation","type":"suffix","gloss":"~하는 것"}],"story":"라틴어 conversari(함께 돌며 지내다) → 함께 어울림 → 대화"},"example":{"q":"How do you handle disagreements with a coworker?","a":"I start a private conversation and listen to their reasons first.","a_ko":"따로 대화를 시작해서 먼저 그 사람의 이유를 듣습니다."},"collocations":["have a conversation","start a conversation","one-on-one conversation"],"related":["conversely","controversial","convert","reverse"],"tip":"갈등 질문에서는 argue 대신 have a conversation 이라고 하면 부드러움"},{"id":"d07-C02","day":7,"level":2,"set":"C","family":"F7","word":"controversial","pos":"adjective","ipa":"/ˌkɑːntrəˈvɜːrʃl/","meaning_ko":"논란이 많은, 의견이 갈리는","category":"interview","etymology":{"parts":[{"text":"contro","type":"prefix","gloss":"반대로 (contra)"},{"text":"vers","type":"root","gloss":"돌리다 (vert)"},{"text":"ial","type":"suffix","gloss":"~의"}],"story":"반대쪽으로 돌린(controversus) → 의견이 맞서는 → 논란이 많은"},"example":{"q":"Tell me about a time you made an unpopular decision.","a":"Dropping support for the old API was controversial, so I shared usage data showing only two percent of clients still used it.","a_ko":"구 API 지원을 중단하는 건 논란이 컸기 때문에, 아직 쓰는 고객이 2%뿐이라는 사용 데이터를 공유했습니다."},"collocations":["a controversial decision","highly controversial","controversial topic"],"related":["conversation","reverse","diverse","adverse"],"tip":"발음 '칸트러-버-셜'. 명사는 controversy"},{"id":"d07-C03","day":7,"level":1,"set":"C","family":"F7","word":"reverse","pos":"verb","ipa":"/rɪˈvɜːrs/","meaning_ko":"뒤집다, 거꾸로 하다","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤로"},{"text":"verse","type":"root","gloss":"돌리다 (vert)"}],"story":"뒤로 돌린(reversus) → 거꾸로의 → 뒤집다, 거꾸로 하다"},"example":{"q":"How did you fix the timeout issue?","a":"I reversed the order of two middleware layers, and the timeout disappeared.","a_ko":"미들웨어 두 개의 순서를 뒤집었더니 타임아웃이 사라졌습니다."},"collocations":["reverse the order","reverse proxy","reverse a decision"],"related":["irreversible","revert","inversion","diverse"],"tip":"reverse proxy(리버스 프록시)는 인프라 면접 필수 용어"},{"id":"d07-C04","day":7,"level":2,"set":"C","family":"F7","word":"irreversible","pos":"adjective","ipa":"/ˌɪrɪˈvɜːrsəbl/","meaning_ko":"되돌릴 수 없는","category":"it","etymology":{"parts":[{"text":"ir","type":"prefix","gloss":"~아닌 (in)"},{"text":"re","type":"prefix","gloss":"뒤로"},{"text":"vers","type":"root","gloss":"돌리다 (vert)"},{"text":"ible","type":"suffix","gloss":"~할 수 있는"}],"story":"뒤로 돌릴 수 없는 → 되돌릴 수 없는"},"example":{"q":"How do you decide how carefully to review a change?","a":"I spend more review time on irreversible changes, like deleting data, than on changes we can easily roll back.","a_ko":"데이터 삭제처럼 되돌릴 수 없는 변경에는, 쉽게 롤백할 수 있는 변경보다 리뷰 시간을 더 씁니다."},"collocations":["irreversible change","irreversible decision","irreversible damage"],"related":["reverse","revert","inversion","versatile"],"tip":"'one-way door'(되돌릴 수 없는 결정)라는 표현과 같이 쓰면 좋음"},{"id":"d07-C05","day":7,"level":2,"set":"C","family":"F7","word":"revert","pos":"verb","ipa":"/rɪˈvɜːrt/","meaning_ko":"되돌리다, 원래대로 돌아가다","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"뒤로"},{"text":"vert","type":"root","gloss":"돌리다"}],"story":"뒤로 돌리다(revertere) → 원래 상태로 되돌리다"},"example":{"q":"What do you do when a release breaks production?","a":"I revert the commit first to restore service, and then investigate the root cause calmly.","a_ko":"먼저 커밋을 되돌려 서비스를 복구하고, 그다음 차분하게 근본 원인을 조사합니다."},"collocations":["revert a commit","revert the change","revert to"],"related":["reverse","irreversible","inversion","convert"],"tip":"Git 의 git revert. 메일의 'I'll revert to you(답장 드릴게요)'는 인도식 영어라 피하는 게 좋음"},{"id":"d07-C06","day":7,"level":1,"set":"C","family":"F7","word":"diverse","pos":"adjective","ipa":"/daɪˈvɜːrs/","meaning_ko":"다양한","category":"interview","etymology":{"parts":[{"text":"di","type":"prefix","gloss":"갈라져 (dis)"},{"text":"verse","type":"root","gloss":"돌리다 (vert)"}],"story":"서로 다른 방향으로 돌린(diversus) → 제각각인 → 다양한"},"example":{"q":"What kind of team do you like to work in?","a":"I like diverse teams because different backgrounds lead to better ideas.","a_ko":"배경이 다르면 더 좋은 아이디어가 나오기 때문에 다양한 팀을 좋아합니다."},"collocations":["diverse team","diverse backgrounds","culturally diverse"],"related":["diversity","divert","universal","conversation"],"tip":"발음 '다이-버스', 강세는 둘째 음절"},{"id":"d07-C07","day":7,"level":1,"set":"C","family":"F7","word":"diversity","pos":"noun","ipa":"/daɪˈvɜːrsəti/","meaning_ko":"다양성","category":"interview","etymology":{"parts":[{"text":"di","type":"prefix","gloss":"갈라져 (dis)"},{"text":"vers","type":"root","gloss":"돌리다 (vert)"},{"text":"ity","type":"suffix","gloss":"~성"}],"story":"제각각임(diverse) → 다양성"},"example":{"q":"Why does this company appeal to you?","a":"I value the diversity of your team; people from twenty countries work here.","a_ko":"귀사 팀의 다양성이 좋습니다. 20개국 출신이 함께 일하고 있으니까요."},"collocations":["diversity and inclusion","cultural diversity","value diversity"],"related":["diverse","divert","adversity","universal"],"tip":"D&I(diversity and inclusion)는 외국계 기업 면접에서 자주 나오는 주제"},{"id":"d07-C08","day":7,"level":2,"set":"C","family":"F7","word":"divert","pos":"verb","ipa":"/daɪˈvɜːrt/","meaning_ko":"(다른 곳으로) 돌리다","category":"interview","etymology":{"parts":[{"text":"di","type":"prefix","gloss":"갈라져·다른 쪽으로 (dis)"},{"text":"vert","type":"root","gloss":"돌리다"}],"story":"다른 쪽으로 돌리다(divertere) → (자원·주의를) 돌리다"},"example":{"q":"How do you handle unplanned requests?","a":"If a request is urgent, I divert one engineer to it, but I tell stakeholders what will be delayed as a result.","a_ko":"급한 요청이면 엔지니어 한 명을 그쪽으로 돌리되, 그 때문에 무엇이 늦어지는지 이해관계자에게 알립니다."},"collocations":["divert resources","divert attention","divert traffic"],"related":["diverse","diversity","revert","avert"],"tip":"IT 에서는 divert traffic(트래픽을 다른 서버로 돌리다)으로도 씀"},{"id":"d07-C09","day":7,"level":1,"set":"C","family":"F7","word":"universal","pos":"adjective","ipa":"/ˌjuːnɪˈvɜːrsl/","meaning_ko":"보편적인, 모두에게 통하는","category":"interview","etymology":{"parts":[{"text":"uni","type":"prefix","gloss":"하나"},{"text":"vers","type":"root","gloss":"돌리다 (vert)"},{"text":"al","type":"suffix","gloss":"~의"}],"story":"하나로 돌려 모은(universus) → 전체의 → 모두에게 통하는"},"example":{"q":"What's your favorite framework?","a":"There's no universal answer, so I choose tools based on the problem.","a_ko":"모든 경우에 맞는 답은 없어서, 문제에 맞춰 도구를 고릅니다."},"collocations":["universal solution","universal truth","near-universal"],"related":["university","diverse","conversation","reverse"],"tip":"There's no universal solution 은 '정답은 상황마다 다르다'를 말할 때 유용"},{"id":"d07-C10","day":7,"level":1,"set":"C","family":"F7","word":"university","pos":"noun","ipa":"/ˌjuːnɪˈvɜːrsəti/","meaning_ko":"대학교","category":"interview","etymology":{"parts":[{"text":"uni","type":"prefix","gloss":"하나"},{"text":"vers","type":"root","gloss":"돌리다 (vert)"},{"text":"ity","type":"suffix","gloss":"~것"}],"story":"하나로 모인 전체(universitas) → 선생·학생의 조합 → 대학교"},"example":{"q":"Tell me about your education.","a":"I studied computer science at a university in Seoul.","a_ko":"서울에 있는 대학교에서 컴퓨터공학을 전공했습니다."},"collocations":["at university","university degree","graduate from university"],"related":["universal","diversity","conversation"],"tip":"a university — u 가 '유' 발음이라 an 이 아니라 a"},{"id":"d07-C11","day":7,"level":1,"set":"C","family":"F7","word":"advertise","pos":"verb","ipa":"/ˈædvərtaɪz/","meaning_ko":"광고하다, (채용) 공고를 내다","category":"interview","etymology":{"parts":[{"text":"ad","type":"prefix","gloss":"~쪽으로"},{"text":"vert","type":"root","gloss":"돌리다"},{"text":"ise","type":"suffix","gloss":"~하다"}],"story":"라틴어 advertere(~쪽으로 돌리다) → 주의를 그쪽으로 돌리게 하다 → 알리다 → 광고하다"},"example":{"q":"How did you hear about this position?","a":"I saw the role advertised on LinkedIn, and it matched my skills well.","a_ko":"링크드인에 올라온 채용 공고를 봤는데, 제 기술과 잘 맞았습니다."},"collocations":["advertise a position","as advertised","advertise for"],"related":["adverse","inadvertently","avert","diverse"],"tip":"'공고된 자리'는 the advertised role. 명사는 advertisement (줄여서 ad)"},{"id":"d07-C12","day":7,"level":1,"set":"C","family":"F7","word":"introvert","pos":"noun","ipa":"/ˈɪntrəvɜːrt/","meaning_ko":"내향적인 사람","category":"interview","etymology":{"parts":[{"text":"intro","type":"prefix","gloss":"안으로"},{"text":"vert","type":"root","gloss":"돌리다"}],"story":"안으로 돌린 (마음) → 관심이 안쪽을 향하는 사람 → 내향적인 사람"},"example":{"q":"Are you comfortable working with others?","a":"I'm an introvert, but I speak up clearly when it matters.","a_ko":"저는 내향적인 편이지만, 중요할 때는 분명하게 의견을 말합니다."},"collocations":["a natural introvert","introverted personality"],"related":["extrovert","convert","reverse","diverse"],"tip":"MBTI 의 I. 형용사는 introverted"},{"id":"d07-C13","day":7,"level":1,"set":"C","family":"F7","word":"extrovert","pos":"noun","ipa":"/ˈekstrəvɜːrt/","meaning_ko":"외향적인 사람","category":"interview","etymology":{"parts":[{"text":"extro","type":"prefix","gloss":"밖으로 (extra)"},{"text":"vert","type":"root","gloss":"돌리다"}],"story":"밖으로 돌린 (마음) → 관심이 바깥을 향하는 사람 → 외향적인 사람"},"example":{"q":"How would you describe your personality?","a":"I'm an extrovert, so I enjoy running team workshops and demos.","a_ko":"외향적인 편이라 팀 워크숍과 데모를 진행하는 걸 즐깁니다."},"collocations":["a natural extrovert","extroverted"],"related":["introvert","advertise","reverse"],"tip":"extravert 철자도 있음. MBTI 의 E"},{"id":"d07-C14","day":7,"level":1,"set":"C","family":"F7","word":"vertical","pos":"adjective","ipa":"/ˈvɜːrtɪkl/","meaning_ko":"수직의","category":"it","etymology":{"parts":[{"text":"vertic","type":"root","gloss":"꼭대기 (vertex ← vert 돌리다)"},{"text":"al","type":"suffix","gloss":"~의"}],"story":"vertex(소용돌이 → 정수리·꼭대기) → 꼭대기 방향의 → 수직의"},"example":{"q":"How did you scale the service?","a":"We started with vertical scaling, then moved to horizontal scaling as traffic grew.","a_ko":"처음에는 수직 확장으로 시작했고, 트래픽이 늘면서 수평 확장으로 바꿨습니다."},"collocations":["vertical scaling","vertical slice","vertical integration"],"related":["vertex","reverse","inversion"],"tip":"vertical scaling(서버를 더 크게) vs horizontal scaling(서버를 더 많이)"},{"id":"d07-C15","day":7,"level":2,"set":"C","family":"F7","word":"vertex","pos":"noun","ipa":"/ˈvɜːrteks/","meaning_ko":"(그래프의) 정점, 꼭짓점","category":"it","etymology":{"parts":[{"text":"vert","type":"root","gloss":"돌리다"},{"text":"ex","type":"suffix","gloss":"(명사 어미)"}],"story":"라틴어 vertex(도는 곳·소용돌이) → 정수리·꼭대기 → 꼭짓점 → 그래프의 정점"},"example":{"q":"How would you detect circular dependencies?","a":"I'd model each service as a vertex and each call as an edge, then run cycle detection on the graph.","a_ko":"각 서비스를 정점, 각 호출을 간선으로 보고 그래프에서 사이클을 찾겠습니다."},"collocations":["vertex and edge","adjacent vertex"],"related":["vertical","traverse","inversion"],"tip":"복수형은 vertices(버-티시즈). node 와 거의 같은 뜻"},{"id":"d07-C16","day":7,"level":2,"set":"C","family":"F7","word":"inversion","pos":"noun","ipa":"/ɪnˈvɜːrʒn/","meaning_ko":"역전, 뒤집기","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안으로 (in)"},{"text":"vers","type":"root","gloss":"돌리다 (vert)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"안쪽으로 돌려 뒤집다(invertere) → 거꾸로 함 → 역전"},"example":{"q":"Which design principles do you follow?","a":"I follow dependency inversion, so business logic depends on interfaces, not on a specific database.","a_ko":"의존성 역전 원칙을 따라서, 비즈니스 로직이 특정 데이터베이스가 아니라 인터페이스에 의존하게 합니다."},"collocations":["dependency inversion","inversion of control","priority inversion"],"related":["reverse","revert","vertical","traverse"],"tip":"SOLID 의 D = Dependency Inversion Principle"},{"id":"d07-C17","day":7,"level":2,"set":"C","family":"F7","word":"traverse","pos":"verb","ipa":"/trəˈvɜːrs/","meaning_ko":"순회하다, 가로지르다","category":"it","etymology":{"parts":[{"text":"tra","type":"prefix","gloss":"가로질러 (trans)"},{"text":"verse","type":"root","gloss":"돌리다 (vert)"}],"story":"라틴어 transversus(가로로 돌린) → 가로지르다 → (트리·그래프를) 차례로 훑다"},"example":{"q":"How would you solve this tree problem?","a":"I'd traverse the tree with breadth-first search, because we need the shortest path from the root.","a_ko":"루트에서 가장 짧은 경로가 필요하니, 너비 우선 탐색으로 트리를 순회하겠습니다."},"collocations":["traverse a tree","traverse a graph","tree traversal"],"related":["vertex","reverse","inversion","diverse"],"tip":"명사는 traversal. 코딩 테스트에서 자주 말하게 됨"},{"id":"d07-C18","day":7,"level":2,"set":"C","family":"F7","word":"averse","pos":"adjective","ipa":"/əˈvɜːrs/","meaning_ko":"~을 꺼리는, 싫어하는","category":"interview","etymology":{"parts":[{"text":"a","type":"prefix","gloss":"떨어져 (ab)"},{"text":"verse","type":"root","gloss":"돌리다 (vert)"}],"story":"얼굴을 돌린(aversus) → 피하는 → ~을 꺼리는"},"example":{"q":"How do you approach risk?","a":"I'm not risk-averse, but I always make sure we have a rollback plan before trying something new.","a_ko":"위험을 꺼리지는 않지만, 새로운 시도 전에는 꼭 롤백 계획을 마련해 둡니다."},"collocations":["risk-averse","averse to change","conflict-averse"],"related":["avert","adverse","diverse","reverse"],"tip":"averse(꺼리는)와 adverse(불리한)는 철자가 비슷해서 자주 헷갈림"},{"id":"d07-C19","day":7,"level":2,"set":"C","family":"F7","word":"adverse","pos":"adjective","ipa":"/ædˈvɜːrs/","meaning_ko":"부정적인, 불리한","category":"it","etymology":{"parts":[{"text":"ad","type":"prefix","gloss":"~쪽으로 (맞서)"},{"text":"verse","type":"root","gloss":"돌리다 (vert)"}],"story":"~쪽으로 돌아선(adversus) → 맞서는 → 불리한, 부정적인"},"example":{"q":"How do you test a change before rolling it out?","a":"We run a canary release first, and if we see any adverse effect on latency, we stop the rollout.","a_ko":"먼저 카나리 배포를 하고, 지연 시간에 부정적인 영향이 보이면 배포를 멈춥니다."},"collocations":["adverse effect","adverse impact","adverse conditions"],"related":["adversity","averse","advertise","inadvertently"],"tip":"negative 보다 격식 있는 표현. adverse effect 를 덩어리로"},{"id":"d07-C20","day":7,"level":2,"set":"C","family":"F7","word":"adversity","pos":"noun","ipa":"/ədˈvɜːrsəti/","meaning_ko":"역경, 어려움","category":"interview","etymology":{"parts":[{"text":"ad","type":"prefix","gloss":"~쪽으로 (맞서)"},{"text":"vers","type":"root","gloss":"돌리다 (vert)"},{"text":"ity","type":"suffix","gloss":"~것"}],"story":"맞서 오는 것(adversus) → 불리한 처지 → 역경"},"example":{"q":"Tell me about a time you faced adversity.","a":"When half our team left, I faced real adversity, but I took over their services and kept every release on schedule.","a_ko":"팀원 절반이 떠났을 때 큰 어려움을 겪었지만, 그들이 맡던 서비스를 넘겨받아 모든 릴리스를 일정대로 지켰습니다."},"collocations":["face adversity","overcome adversity","in the face of adversity"],"related":["adverse","averse","diversity","advertise"],"tip":"STAR 질문 'Tell me about a time you faced adversity'를 그대로 받아서 답하기"},{"id":"d07-C21","day":7,"level":3,"set":"C","family":"F7","word":"avert","pos":"verb","ipa":"/əˈvɜːrt/","meaning_ko":"(사고를) 막다, 피하다","category":"it","etymology":{"parts":[{"text":"a","type":"prefix","gloss":"떨어져 (ab)"},{"text":"vert","type":"root","gloss":"돌리다"}],"story":"다른 쪽으로 돌려 버리다(avertere) → (위험을) 비껴가게 하다 → 막다"},"example":{"q":"Tell me about a time you prevented a problem.","a":"I noticed disk usage climbing on a Friday night, expanded the volume, and averted an outage that would have hit our weekend sales.","a_ko":"금요일 밤에 디스크 사용량이 오르는 걸 발견하고 볼륨을 늘려, 주말 매출에 타격을 줄 뻔한 장애를 막았습니다."},"collocations":["avert an outage","avert a crisis","narrowly avert"],"related":["averse","divert","revert","adverse"],"tip":"prevent 보다 '닥쳐오던 위기를 아슬아슬하게 막다'라는 느낌"},{"id":"d07-C22","day":7,"level":3,"set":"C","family":"F7","word":"inadvertently","pos":"adverb","ipa":"/ˌɪnədˈvɜːrtəntli/","meaning_ko":"무심코, 의도치 않게","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"~아닌"},{"text":"ad","type":"prefix","gloss":"~쪽으로"},{"text":"vert","type":"root","gloss":"돌리다"},{"text":"ent","type":"suffix","gloss":"~하는"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"마음을 그쪽으로 돌리지(advertere) 않은 채 → 주의하지 않고 → 무심코"},"example":{"q":"Tell me about a mistake you made.","a":"I once inadvertently deleted a staging table, so I owned it right away, restored it from backup, and added a confirmation step to the script.","a_ko":"한번은 무심코 스테이징 테이블을 지운 적이 있습니다. 바로 제 실수라고 알리고 백업에서 복구한 뒤, 스크립트에 확인 단계를 넣었습니다."},"collocations":["inadvertently delete","inadvertently cause","inadvertently expose"],"related":["advertise","adverse","avert","versatile"],"tip":"실수 질문에서 '일부러 그런 건 아니었다'를 자연스럽게 전달"},{"id":"d07-C23","day":7,"level":3,"set":"C","family":"F7","word":"versatile","pos":"adjective","ipa":"/ˈvɜːrsətl/","meaning_ko":"다재다능한, 쓰임새가 많은","category":"interview","etymology":{"parts":[{"text":"vers","type":"root","gloss":"돌리다 (vert)"},{"text":"atile","type":"suffix","gloss":"~할 수 있는"}],"story":"라틴어 versatilis(잘 도는) → 이리저리 방향을 바꿀 수 있는 → 다재다능한"},"example":{"q":"Why should we hire you?","a":"I'm versatile: I've owned backend services, set up CI pipelines, and stepped in on the frontend when we were short-staffed.","a_ko":"저는 다재다능합니다. 백엔드 서비스를 맡았고, CI 파이프라인도 구축했고, 인원이 부족할 때는 프론트엔드도 지원했습니다."},"collocations":["versatile engineer","versatile tool","highly versatile"],"related":["reverse","diverse","conversation","version"],"tip":"발음 '버-서틀'. versatile 이라고만 하지 말고 바로 예시 2~3개를 붙이기"},{"id":"d07-C24","day":7,"level":1,"set":"C","family":"F7","word":"settle in","pos":"phrasal verb","ipa":"/ˌsetəl ˈɪn/","meaning_ko":"(새 환경에) 자리 잡다, 적응하다","category":"interview","etymology":{"parts":[{"text":"settle","type":"part","gloss":"자리 잡다 (고대 영어 setl 자리)"},{"text":"in","type":"part","gloss":"안에"}],"story":"자리 안에 앉다 → 새 곳에 익숙해지다"},"example":{"q":"How do you adapt to a new team?","a":"I settle in quickly by asking lots of questions in my first weeks.","a_ko":"처음 몇 주 동안 질문을 많이 하면서 빨리 적응합니다."},"collocations":["settle in quickly","settle into a new role"],"related":["settle","get used to"],"tip":"settle into + 장소/역할 형태로도 자주 씀"},{"id":"d07-C25","day":7,"level":1,"set":"C","family":"F7","word":"roll back","pos":"phrasal verb","ipa":"/roʊl bæk/","meaning_ko":"(이전 버전으로) 되돌리다, 롤백하다","category":"it","etymology":{"parts":[{"text":"roll","type":"part","gloss":"굴리다"},{"text":"back","type":"part","gloss":"뒤로"}],"story":"뒤로 굴려 되돌리다 → 이전 상태로 되돌리다"},"example":{"q":"What happens if a deployment fails?","a":"We roll back to the previous version within five minutes.","a_ko":"5분 안에 이전 버전으로 롤백합니다."},"collocations":["roll back a release","roll back to","rollback plan"],"related":["revert","reverse","workaround"],"tip":"동사는 띄어서 roll back, 명사는 붙여서 rollback"},{"id":"d07-D01","day":7,"level":1,"set":"D","family":"F7","word":"tend","pos":"verb","ipa":"/tend/","meaning_ko":"~하는 경향이 있다","category":"interview","etymology":{"parts":[{"text":"tend","type":"root","gloss":"뻗다·향하다"}],"story":"라틴어 tendere(뻗다) → 어느 쪽으로 뻗다 → 그쪽으로 기울다 → ~하는 경향이 있다"},"example":{"q":"What is your weakness?","a":"I tend to take on too much, so now I check my workload every week.","a_ko":"일을 너무 많이 떠안는 경향이 있어서, 지금은 매주 업무량을 점검합니다."},"collocations":["tend to do","tend toward"],"related":["tendency","attend","intend","extent"],"tip":"약점 질문은 I tend to ... 로 시작하면 부드럽게 들림"},{"id":"d07-D02","day":7,"level":1,"set":"D","family":"F7","word":"tendency","pos":"noun","ipa":"/ˈtendənsi/","meaning_ko":"경향, 성향","category":"interview","etymology":{"parts":[{"text":"tend","type":"root","gloss":"뻗다·향하다"},{"text":"ency","type":"suffix","gloss":"~하는 성질"}],"story":"어느 쪽으로 뻗어 가는 성질(tendentia) → 경향, 성향"},"example":{"q":"How do you manage your perfectionism?","a":"I have a tendency to over-polish code, so I set a time limit for each task.","a_ko":"코드를 지나치게 다듬는 경향이 있어서, 작업마다 시간 제한을 둡니다."},"collocations":["have a tendency to","natural tendency","a growing tendency"],"related":["tend","intend","attention","tension"],"tip":"tend to 의 명사형. have a tendency to + 동사원형"},{"id":"d07-D03","day":7,"level":1,"set":"D","family":"F7","word":"intend","pos":"verb","ipa":"/ɪnˈtend/","meaning_ko":"~할 작정이다, 의도하다","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"~를 향해"},{"text":"tend","type":"root","gloss":"뻗다"}],"story":"~를 향해 (마음을) 뻗다(intendere) → 마음을 두다 → 의도하다"},"example":{"q":"Where do you see yourself in five years?","a":"I intend to grow into a tech lead who mentors other engineers.","a_ko":"다른 엔지니어를 멘토링하는 테크 리드로 성장할 생각입니다."},"collocations":["intend to do","be intended for","as intended"],"related":["intention","intense","attend","tend"],"tip":"plan 보다 의지가 담긴 느낌. works as intended(의도대로 동작하다)도 자주 씀"},{"id":"d07-D04","day":7,"level":1,"set":"D","family":"F7","word":"intention","pos":"noun","ipa":"/ɪnˈtenʃn/","meaning_ko":"의도, 생각","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"~를 향해"},{"text":"tent","type":"root","gloss":"뻗다 (tend)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"~를 향해 마음을 뻗음 → 의도"},"example":{"q":"How long do you plan to stay with us?","a":"My intention is to stay for the long term and grow with the team.","a_ko":"오래 다니면서 팀과 함께 성장하는 것이 제 생각입니다."},"collocations":["my intention is to","have no intention of","good intentions"],"related":["intend","attention","tension","intense"],"tip":"설계 의도를 설명할 때도 The intention is to ... 로 시작"},{"id":"d07-D05","day":7,"level":1,"set":"D","family":"F7","word":"intense","pos":"adjective","ipa":"/ɪnˈtens/","meaning_ko":"강도 높은, 치열한","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"~쪽으로"},{"text":"tense","type":"root","gloss":"팽팽히 뻗은 (tend)"}],"story":"팽팽하게 뻗은(intensus) → 힘이 가득 실린 → 강렬한, 치열한"},"example":{"q":"How do you perform under pressure?","a":"Launch weeks are intense, but I stay calm by breaking work into small tasks.","a_ko":"출시 주간은 강도가 높지만, 일을 작게 나눠서 침착함을 유지합니다."},"collocations":["intense pressure","intense competition","an intense period"],"related":["intensive","tense","tension","intend"],"tip":"intense(강렬한) vs intensive(집중적인, 많이 쓰는) 구별"},{"id":"d07-D06","day":7,"level":2,"set":"D","family":"F7","word":"intensive","pos":"adjective","ipa":"/ɪnˈtensɪv/","meaning_ko":"(자원을) 많이 쓰는, 집중적인","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"~쪽으로"},{"text":"tens","type":"root","gloss":"팽팽히 뻗은 (tend)"},{"text":"ive","type":"suffix","gloss":"~한"}],"story":"팽팽히 힘을 모은 → 집중적인 → (자원을) 많이 쓰는"},"example":{"q":"How did you reduce your cloud costs?","a":"Image processing was very CPU-intensive, so we moved it to spot instances and ran it in batches at night.","a_ko":"이미지 처리는 CPU를 많이 써서, 스팟 인스턴스로 옮기고 밤에 일괄 처리하도록 했습니다."},"collocations":["CPU-intensive","memory-intensive","labor-intensive"],"related":["intense","tension","extensive","tensor"],"tip":"X-intensive = 'X를 많이 쓰는'. 성능 설명에 매우 자주 씀"},{"id":"d07-D07","day":7,"level":1,"set":"D","family":"F7","word":"tense","pos":"adjective","ipa":"/tens/","meaning_ko":"긴장된, 팽팽한","category":"interview","etymology":{"parts":[{"text":"tense","type":"root","gloss":"팽팽히 당긴 (tend)"}],"story":"당겨 뻗은(tensus) → 팽팽한 → 긴장된"},"example":{"q":"Tell me about a difficult meeting.","a":"The meeting got tense, so I suggested a short break.","a_ko":"회의 분위기가 팽팽해져서 잠깐 쉬자고 제안했습니다."},"collocations":["a tense meeting","tense atmosphere","get tense"],"related":["tension","intense","tend","extent"],"tip":"문법 용어 '시제'의 tense 는 다른 어원(라틴어 tempus)이니 헷갈리지 않기"},{"id":"d07-D08","day":7,"level":1,"set":"D","family":"F7","word":"tension","pos":"noun","ipa":"/ˈtenʃn/","meaning_ko":"긴장, 갈등","category":"interview","etymology":{"parts":[{"text":"tens","type":"root","gloss":"팽팽히 당긴 (tend)"},{"text":"ion","type":"suffix","gloss":"~하는 것"}],"story":"팽팽히 당김(tensio) → 긴장 → (사람 사이의) 갈등"},"example":{"q":"How do you handle conflict between teams?","a":"When tension grew between QA and development, I set up a weekly sync to talk openly.","a_ko":"QA팀과 개발팀 사이에 긴장이 커졌을 때, 주간 회의를 만들어 터놓고 이야기하게 했습니다."},"collocations":["ease tension","tension between","creative tension"],"related":["tense","intense","attention","extensive"],"tip":"conflict 보다 부드러운 말이라 갈등 질문에 쓰기 좋음"},{"id":"d07-D09","day":7,"level":1,"set":"D","family":"F7","word":"pretend","pos":"verb","ipa":"/prɪˈtend/","meaning_ko":"~인 척하다","category":"interview","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"앞에"},{"text":"tend","type":"root","gloss":"뻗다"}],"story":"앞으로 내밀다(praetendere) → 핑계로 내세우다 → ~인 척하다"},"example":{"q":"What do you do when you don't know an answer?","a":"I never pretend to know; I say so and find out quickly.","a_ko":"아는 척하지 않습니다. 모른다고 말하고 빨리 알아봅니다."},"collocations":["pretend to know","pretend that"],"related":["tend","intend","contend","extent"],"tip":"모르는 질문을 받았을 때 I won't pretend to know ... 로 정직하게 답하기"},{"id":"d07-D10","day":7,"level":1,"set":"D","family":"F7","word":"extent","pos":"noun","ipa":"/ɪkˈstent/","meaning_ko":"정도, 범위","category":"interview","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"tent","type":"root","gloss":"뻗다 (tend)"}],"story":"밖으로 뻗은 만큼(extenta) → 범위 → 정도"},"example":{"q":"Do you have experience with machine learning?","a":"To some extent, yes; I've deployed models but haven't trained them.","a_ko":"어느 정도는 있습니다. 모델을 배포해 봤지만 학습시켜 본 적은 없습니다."},"collocations":["to some extent","to a large extent","the extent of"],"related":["extensive","extend","intend","tension"],"tip":"to some extent = '어느 정도는'. 경험이 부분적일 때 정직하게 쓰는 표현"},{"id":"d07-D11","day":7,"level":1,"set":"D","family":"F7","word":"extensive","pos":"adjective","ipa":"/ɪkˈstensɪv/","meaning_ko":"폭넓은, 광범위한","category":"interview","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"tens","type":"root","gloss":"뻗다 (tend)"},{"text":"ive","type":"suffix","gloss":"~한"}],"story":"밖으로 넓게 뻗은(extensivus) → 폭넓은"},"example":{"q":"What makes you a strong fit for this role?","a":"I have extensive experience with AWS, from networking to cost optimization.","a_ko":"네트워크부터 비용 최적화까지 AWS 경험이 폭넓습니다."},"collocations":["extensive experience","extensive research","extensive testing"],"related":["extent","extend","intensive","tension"],"tip":"extensive experience 는 경력 설명의 단골. 동사 extend 는 Day 17"},{"id":"d07-D12","day":7,"level":2,"set":"D","family":"F7","word":"tensor","pos":"noun","ipa":"/ˈtensər/","meaning_ko":"텐서 (다차원 배열)","category":"it","etymology":{"parts":[{"text":"tens","type":"root","gloss":"당기다·뻗다 (tend)"},{"text":"or","type":"suffix","gloss":"~하는 것"}],"story":"당겨 늘이는 것(처음엔 근육 이름) → 늘임·힘을 나타내는 수학 개념 → 딥러닝의 다차원 배열"},"example":{"q":"What's your experience with deep learning frameworks?","a":"I've used PyTorch for two years, so I'm comfortable reshaping tensors and debugging shape mismatches.","a_ko":"PyTorch를 2년 동안 써서, 텐서 모양을 바꾸고 shape 불일치를 디버깅하는 데 익숙합니다."},"collocations":["tensor shape","tensor operations","TensorFlow"],"related":["tension","intensive","extent","tense"],"tip":"TensorFlow 의 그 tensor. 발음 '텐서'"},{"id":"d07-D13","day":7,"level":1,"set":"D","family":"F7","word":"alter","pos":"verb","ipa":"/ˈɔːltər/","meaning_ko":"변경하다, 고치다","category":"it","etymology":{"parts":[{"text":"alter","type":"root","gloss":"다른 (alter)"}],"story":"라틴어 alter(다른 하나) → 다르게 만들다 → 변경하다"},"example":{"q":"How do you change a database schema safely?","a":"I alter tables in small steps, so each change is easy to roll back.","a_ko":"테이블을 조금씩 단계별로 변경해서, 각 변경을 쉽게 롤백할 수 있게 합니다."},"collocations":["alter a table","alter the plan","significantly alter"],"related":["alternative","alternate","altruistic","mutate"],"tip":"SQL 의 ALTER TABLE. change 보다 '일부를 고치다' 느낌"},{"id":"d07-D14","day":7,"level":1,"set":"D","family":"F7","word":"commute","pos":"noun","ipa":"/kəˈmjuːt/","meaning_ko":"통근(길)","category":"interview","etymology":{"parts":[{"text":"com","type":"prefix","gloss":"완전히"},{"text":"mute","type":"root","gloss":"바꾸다 (mut)"}],"story":"맞바꾸다(commutare) → 요금을 한 번에 바꿔 치른 정기권으로 오가다 → 통근"},"example":{"q":"Would the commute be a problem for you?","a":"Not at all; my commute would be about forty minutes by subway.","a_ko":"전혀 문제없습니다. 지하철로 40분 정도 걸립니다."},"collocations":["daily commute","a long commute","commute to work"],"related":["mutate","mutation","permutation","mutual"],"tip":"명사·동사 모두 같은 형태. 강세는 뒤 '-뮤트'"},{"id":"d07-D15","day":7,"level":2,"set":"D","family":"F7","word":"mutate","pos":"verb","ipa":"/ˈmjuːteɪt/","meaning_ko":"(상태를) 변경하다, 변이하다","category":"it","etymology":{"parts":[{"text":"mut","type":"root","gloss":"바꾸다"},{"text":"ate","type":"suffix","gloss":"~하다"}],"story":"라틴어 mutare(바꾸다) → 변하다 → (데이터·상태를) 직접 바꾸다"},"example":{"q":"How do you avoid bugs in shared state?","a":"I avoid functions that mutate their inputs, because hidden changes make bugs very hard to trace.","a_ko":"입력값을 직접 바꾸는 함수는 피합니다. 숨은 변경이 있으면 버그를 추적하기가 아주 어려워서요."},"collocations":["mutate state","mutate an object"],"related":["mutation","commute","permutation","immutable"],"tip":"반대 개념 immutable(불변의)은 Day 27"},{"id":"d07-D16","day":7,"level":2,"set":"D","family":"F7","word":"mutation","pos":"noun","ipa":"/mjuːˈteɪʃn/","meaning_ko":"변경 (작업), 변이","category":"it","etymology":{"parts":[{"text":"mut","type":"root","gloss":"바꾸다"},{"text":"ation","type":"suffix","gloss":"~하는 것"}],"story":"바꿈(mutatio) → 변화 → 데이터를 바꾸는 작업"},"example":{"q":"How do you design a GraphQL API?","a":"I keep queries and mutations separate, and every mutation returns the updated object so the client stays in sync.","a_ko":"조회와 변경(mutation)을 분리하고, 모든 변경은 갱신된 객체를 돌려줘서 클라이언트가 최신 상태를 유지하게 합니다."},"collocations":["GraphQL mutation","mutation testing","state mutation"],"related":["mutate","commute","permutation","alter"],"tip":"mutation testing 은 코드를 일부러 바꿔 테스트가 잡아내는지 확인하는 기법"},{"id":"d07-D17","day":7,"level":2,"set":"D","family":"F7","word":"permutation","pos":"noun","ipa":"/ˌpɜːrmjuˈteɪʃn/","meaning_ko":"(조합의) 경우의 수, 순열","category":"it","etymology":{"parts":[{"text":"per","type":"prefix","gloss":"완전히"},{"text":"mut","type":"root","gloss":"바꾸다"},{"text":"ation","type":"suffix","gloss":"~하는 것"}],"story":"완전히 바꿔 놓음(permutare) → 순서를 바꿔 늘어놓기 → 순열, 경우의 수"},"example":{"q":"How did you test the new pricing logic?","a":"I wrote table-driven tests that covered every permutation of plan, region, and currency.","a_ko":"요금제, 지역, 통화의 모든 경우의 수를 다루는 테이블 기반 테스트를 작성했습니다."},"collocations":["every permutation","possible permutations"],"related":["mutation","mutate","commute"],"tip":"'모든 조합'을 말할 때 쓰면 꼼꼼한 인상. 수학에서 permutation 은 순열, combination 은 조합"},{"id":"d07-D18","day":7,"level":3,"set":"D","family":"F7","word":"altruistic","pos":"adjective","ipa":"/ˌæltruˈɪstɪk/","meaning_ko":"이타적인","category":"interview","etymology":{"parts":[{"text":"altru","type":"root","gloss":"남·다른 사람 (alter)"},{"text":"istic","type":"suffix","gloss":"~의 성질인"}],"story":"라틴어 alteri huic(이 다른 사람에게) → 프랑스어 autrui(남) → altruisme(이타주의) → 남을 위하는"},"example":{"q":"Why do you contribute to open source?","a":"It isn't purely altruistic; maintaining a library sharpened my API design skills, and feedback from users made me a better engineer.","a_ko":"순수하게 이타적인 이유만은 아닙니다. 라이브러리를 관리하면서 API 설계 실력이 늘었고, 사용자 피드백 덕분에 더 나은 엔지니어가 되었습니다."},"collocations":["purely altruistic","altruistic motives"],"related":["alter","alternative","alternate"],"tip":"프랑스 철학자 콩트가 만든 말. not purely altruistic 으로 솔직하게 동기를 말할 때 좋음"},{"id":"d07-D19","day":7,"level":2,"set":"D","family":"F7","word":"well-versed","pos":"adjective","ipa":"/ˌwel ˈvɜːrst/","meaning_ko":"~에 정통한, 능숙한","category":"interview","etymology":{"parts":[{"text":"well-","type":"part","gloss":"잘 (영어)"},{"text":"vers","type":"root","gloss":"늘 다루다 (versari ← vert)"},{"text":"ed","type":"suffix","gloss":"~된"}],"story":"라틴어 versari(그 안에서 돌다 → 늘 다루다) → versed(익숙한) → well-versed(아주 익숙한, 정통한)"},"example":{"q":"How familiar are you with our tech stack?","a":"I'm well-versed in Kotlin and Spring Boot, which I've used every day for the past three years.","a_ko":"코틀린과 스프링 부트에 정통합니다. 지난 3년 동안 매일 썼습니다."},"collocations":["well-versed in","well-versed in the field"],"related":["versatile","conversation","reverse","diverse"],"tip":"be well-versed in + 분야. familiar with 보다 한 단계 깊은 숙련"},{"id":"d07-D20","day":7,"level":2,"set":"D","family":"F7","word":"vice versa","pos":"adverb","ipa":"/ˌvaɪs ˈvɜːrsə/","meaning_ko":"반대로도 마찬가지로","category":"interview","etymology":{"parts":[{"text":"vice","type":"part","gloss":"자리·차례 (라틴어 vicis)"},{"text":"versa","type":"root","gloss":"돌려진 (vert)"}],"story":"라틴어 '자리가 돌려진 채로' → 거꾸로 해도 마찬가지로"},"example":{"q":"How do you work with designers?","a":"Our designers review my UI changes, and vice versa, so we catch problems from both sides early.","a_ko":"디자이너가 제 UI 변경을 검토하고 저도 디자이너의 작업을 검토해서, 양쪽에서 문제를 일찍 잡습니다."},"collocations":["and vice versa"],"related":["reverse","conversely","versatile","diverse"],"tip":"발음 '바이스 버-사'. 문장 끝에 and vice versa 로 붙임"},{"id":"d07-D21","day":7,"level":2,"set":"D","family":"F7","word":"conversely","pos":"adverb","ipa":"/kənˈvɜːrsli/","meaning_ko":"반대로, 거꾸로 말하면","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"완전히"},{"text":"verse","type":"root","gloss":"돌리다 (vert)"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"완전히 돌려놓은(conversus) → 거꾸로 된 → 반대로 말하면"},"example":{"q":"How do you choose between speed and quality?","a":"For prototypes I favor speed; conversely, for payment code I favor careful review even if it slows us down.","a_ko":"프로토타입에서는 속도를 우선하고, 반대로 결제 코드에서는 느려지더라도 꼼꼼한 리뷰를 우선합니다."},"collocations":["conversely, ...","and conversely"],"related":["conversation","vice versa","reverse","convert"],"tip":"on the other hand 보다 '정반대 경우'를 딱 짚을 때"},{"id":"d07-D22","day":7,"level":3,"set":"D","family":"F7","word":"influx","pos":"noun","ipa":"/ˈɪnflʌks/","meaning_ko":"(갑작스러운) 유입, 쇄도","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안으로"},{"text":"flux","type":"root","gloss":"흐름 (flu)"}],"story":"안으로 흘러듦(influxus) → 유입 → 갑작스러운 쇄도"},"example":{"q":"Tell me about a time your system was under heavy load.","a":"After a TV ad aired, we saw a sudden influx of sign-ups, so I raised the rate limits and queued welcome emails to keep the database stable.","a_ko":"TV 광고가 나간 뒤 가입자가 갑자기 몰려서, 요청 제한을 올리고 환영 메일을 큐에 넣어 데이터베이스를 안정적으로 유지했습니다."},"collocations":["sudden influx","influx of traffic","influx of users"],"related":["flux","fluid","fluctuate","influence"],"tip":"an influx of + 명사. spike 보다 '밀려 들어온다'는 느낌"},{"id":"d07-D23","day":7,"level":3,"set":"D","family":"F7","word":"superfluous","pos":"adjective","ipa":"/suːˈpɜːrfluəs/","meaning_ko":"불필요한, 쓸데없는","category":"it","etymology":{"parts":[{"text":"super","type":"prefix","gloss":"넘어"},{"text":"flu","type":"root","gloss":"흐르다"},{"text":"ous","type":"suffix","gloss":"~한"}],"story":"넘쳐흐르는(superfluus) → 필요 이상인 → 불필요한"},"example":{"q":"How do you approach code reviews?","a":"I look for superfluous abstractions, because an interface with only one implementation often adds complexity without adding value.","a_ko":"불필요한 추상화를 찾습니다. 구현이 하나뿐인 인터페이스는 가치는 없이 복잡도만 더하는 경우가 많아서요."},"collocations":["superfluous code","superfluous detail","entirely superfluous"],"related":["fluid","flux","influx","fluctuate"],"tip":"발음 '수-퍼-플루어스', 강세는 둘째 음절 '퍼'"},{"id":"d07-D24","day":7,"level":2,"set":"D","family":"F7","word":"workaround","pos":"noun","ipa":"/ˈwɜːrkəraʊnd/","meaning_ko":"임시방편, 우회책","category":"it","etymology":{"parts":[{"text":"work","type":"part","gloss":"일하다"},{"text":"around","type":"part","gloss":"돌아서"}],"story":"막힌 곳을 돌아서 일이 되게 함 → 우회책, 임시 해결책"},"example":{"q":"What do you do when a library has a bug you can't fix?","a":"I apply a temporary workaround, document it clearly, and open an issue upstream so we can remove it later.","a_ko":"임시 우회책을 적용하고 명확하게 기록한 다음, 나중에 걷어낼 수 있도록 원 저장소에 이슈를 올립니다."},"collocations":["temporary workaround","find a workaround","workaround for"],"related":["roll back","turnaround","shift"],"tip":"명사는 붙여서 workaround, 동사는 띄어서 work around"},{"id":"d07-D25","day":7,"level":2,"set":"D","family":"F7","word":"turnaround","pos":"noun","ipa":"/ˈtɜːrnəraʊnd/","meaning_ko":"처리 시간, (상황의) 반전","category":"it","etymology":{"parts":[{"text":"turn","type":"part","gloss":"돌다"},{"text":"around","type":"part","gloss":"빙 돌아"}],"story":"빙 돌아 제자리로 오기 → 일을 받아 돌려주기까지 걸리는 시간 / 상황이 돌아서는 것 → 반전"},"example":{"q":"How did you improve your team's productivity?","a":"I cut the turnaround time for code reviews from two days to four hours by setting up a review rotation.","a_ko":"리뷰 담당 순번을 정해서 코드 리뷰 처리 시간을 이틀에서 4시간으로 줄였습니다."},"collocations":["turnaround time","quick turnaround","a remarkable turnaround"],"related":["workaround","roll back","shift"],"tip":"turnaround time(처리 시간)은 성과 수치를 말할 때 유용"},{"id":"d08-A01","day":8,"level":1,"set":"A","family":"F8","word":"divide","pos":"verb","ipa":"/dɪˈvaɪd/","meaning_ko":"나누다, 분할하다","category":"it","etymology":{"parts":[{"text":"di","type":"prefix","gloss":"떨어져 (dis)"},{"text":"vide","type":"root","gloss":"나누다 (vid)"}],"story":"따로 떼어 가르다 → 나누다"},"example":{"q":"How did you approach the monolith migration?","a":"We divided the monolith into smaller services, one domain at a time.","a_ko":"모놀리스를 도메인 하나씩 더 작은 서비스로 나눴습니다."},"collocations":["divide A into B","divide the work","divide and conquer"],"related":["division","individual","device","dividend"],"tip":"divide and conquer(분할 정복)는 알고리즘·설계 설명에서도 자주 씀"},{"id":"d08-A02","day":8,"level":1,"set":"A","family":"F8","word":"division","pos":"noun","ipa":"/dɪˈvɪʒən/","meaning_ko":"사업부, 부문","category":"interview","etymology":{"parts":[{"text":"di","type":"prefix","gloss":"떨어져 (dis)"},{"text":"vis","type":"root","gloss":"나누다 (vid)"},{"text":"ion","type":"suffix","gloss":"~것"}],"story":"나눈 것 → 회사를 나눈 큰 단위 → 사업부"},"example":{"q":"Which team are you most interested in?","a":"I'm most interested in the cloud division because it matches my background.","a_ko":"제 경력과 잘 맞아서 클라우드 사업부에 가장 관심이 있습니다."},"collocations":["cloud division","division of labor","across divisions"],"related":["divide","individual","dividend","device"],"tip":"department(부서)보다 큰 단위(사업부)를 말할 때가 많음"},{"id":"d08-A03","day":8,"level":1,"set":"A","family":"F8","word":"individual","pos":"adjective","ipa":"/ˌɪndɪˈvɪdʒuəl/","meaning_ko":"개인의, 개별적인","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"아니다"},{"text":"divid","type":"root","gloss":"나누다 (vid)"},{"text":"ual","type":"suffix","gloss":"~의"}],"story":"더 나눌 수 없는 → 더 쪼갤 수 없는 한 사람 → 개인의"},"example":{"q":"Do you prefer working alone or in a team?","a":"I'm productive on individual tasks, but I do my best work in a team.","a_ko":"혼자 하는 업무도 잘하지만, 팀에서 일할 때 가장 좋은 성과를 냅니다."},"collocations":["individual contributor","individual task","each individual"],"related":["individually","divide","division","device"],"tip":"IC(individual contributor)는 관리자가 아닌 실무자 트랙을 뜻함"},{"id":"d08-A04","day":8,"level":1,"set":"A","family":"F8","word":"individually","pos":"adverb","ipa":"/ˌɪndɪˈvɪdʒuəli/","meaning_ko":"개별적으로, 한 사람씩","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"아니다"},{"text":"divid","type":"root","gloss":"나누다 (vid)"},{"text":"ual","type":"suffix","gloss":"~의"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"더 나눌 수 없는 하나하나 → 한 사람씩 따로"},"example":{"q":"How do you support junior engineers?","a":"I meet each junior engineer individually once a week to review their progress.","a_ko":"주니어 엔지니어 한 명 한 명과 매주 따로 만나 진행 상황을 함께 봅니다."},"collocations":["meet individually","individually tailored","individually and as a team"],"related":["individual","divide","division"],"tip":"1:1 미팅을 설명할 때 meet individually 라고 하면 자연스러움"},{"id":"d08-A05","day":8,"level":1,"set":"A","family":"F8","word":"device","pos":"noun","ipa":"/dɪˈvaɪs/","meaning_ko":"기기, 장치","category":"it","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"떨어져 (di-가 변한 꼴)"},{"text":"vice","type":"root","gloss":"나누다 (vid)"}],"story":"나누다 → 나눠 배치하다·궁리하다 → 궁리해서 만든 것 → 장치"},"example":{"q":"What kind of testing have you done?","a":"I tested our app on over thirty Android devices before each release.","a_ko":"릴리스마다 30종이 넘는 안드로이드 기기에서 앱을 테스트했습니다."},"collocations":["mobile device","edge device","device compatibility"],"related":["devise","divide","individual","division"],"tip":"명사 device[-스] vs 동사 devise[-즈] — 철자와 끝소리가 다름"},{"id":"d08-A06","day":8,"level":2,"set":"A","family":"F8","word":"devise","pos":"verb","ipa":"/dɪˈvaɪz/","meaning_ko":"고안하다, 궁리해 내다","category":"interview","etymology":{"parts":[{"text":"de","type":"prefix","gloss":"떨어져 (di-가 변한 꼴)"},{"text":"vise","type":"root","gloss":"나누다 (vid)"}],"story":"나누다 → 나눠 배치하다 → 계획을 짜다 → 고안하다"},"example":{"q":"Tell me about a time you had to be creative.","a":"Our test environment was always busy, so I devised a scheduling script that let teams book time slots automatically.","a_ko":"테스트 환경이 늘 붐벼서, 팀들이 시간대를 자동으로 예약할 수 있는 스케줄링 스크립트를 고안했습니다."},"collocations":["devise a plan","devise a strategy","devise a way to"],"related":["device","divide","division"],"tip":"come up with 의 격식 있는 말. 계획·방법을 짜낼 때 씀"},{"id":"d08-A07","day":8,"level":2,"set":"A","family":"F8","word":"dividend","pos":"noun","ipa":"/ˈdɪvɪdend/","meaning_ko":"배당금, (나중에 돌아오는) 보답","category":"interview","etymology":{"parts":[{"text":"divid","type":"root","gloss":"나누다 (vid)"},{"text":"end","type":"suffix","gloss":"~될 것 (-endum)"}],"story":"나눠 가질 것 → 배당금 → (pay dividends) 나중에 보답이 돌아오다"},"example":{"q":"What's an investment of time that paid off for you?","a":"Writing thorough documentation early on paid dividends, because new hires could onboard in days instead of weeks.","a_ko":"초기에 문서를 꼼꼼히 써 둔 것이 나중에 큰 보답이 됐습니다. 신입이 몇 주가 아니라 며칠 만에 적응할 수 있었거든요."},"collocations":["pay dividends","dividend payment"],"related":["divide","divvy up","division"],"tip":"pay dividends = 시간이 지나 효과를 보다. 면접에서는 거의 이 관용구로 씀"},{"id":"d08-A08","day":8,"level":2,"set":"A","family":"F8","word":"divvy up","pos":"phrasal verb","ipa":"/ˈdɪvi ʌp/","meaning_ko":"(일을) 나누다, 분담하다","category":"interview","etymology":{"parts":[{"text":"divvy","type":"root","gloss":"몫을 나누다 (dividend의 줄임말)"},{"text":"up","type":"part","gloss":"완전히, 끝까지"}],"story":"dividend(배당)를 줄인 말 → 몫을 나누다 → 일을 나눠 맡다"},"example":{"q":"How does your team split the work?","a":"On each project we divvy up the tasks based on our strengths, and I usually take the backend APIs.","a_ko":"프로젝트마다 각자의 강점에 따라 업무를 나누는데, 저는 주로 백엔드 API를 맡습니다."},"collocations":["divvy up the work","divvy up tasks"],"related":["dividend","divide","division"],"tip":"split up 보다 구어적인 표현. 과거형은 divvied up"},{"id":"d08-A09","day":8,"level":1,"set":"A","family":"F8","word":"apart","pos":"adverb","ipa":"/əˈpɑːrt/","meaning_ko":"떨어져, 따로 (set apart: 돋보이게 하다)","category":"interview","etymology":{"parts":[{"text":"a","type":"prefix","gloss":"~쪽으로 (ad)"},{"text":"part","type":"root","gloss":"부분, 쪽 (part)"}],"story":"한쪽으로 → 따로 떨어져 → 남들과 구별되게"},"example":{"q":"What sets you apart from other candidates?","a":"What sets me apart is that I have experience on both the frontend and the backend.","a_ko":"저를 다른 지원자와 구별해 주는 점은 프론트엔드와 백엔드를 모두 경험했다는 것입니다."},"collocations":["set apart","apart from","take apart"],"related":["impart","particular","department","counterpart"],"tip":"What sets you apart? 는 단골 질문. set A apart = A를 돋보이게 하다"},{"id":"d08-A10","day":8,"level":3,"set":"A","family":"F8","word":"impart","pos":"verb","ipa":"/ɪmˈpɑːrt/","meaning_ko":"(지식·경험을) 전하다, 나눠 주다","category":"interview","etymology":{"parts":[{"text":"im","type":"prefix","gloss":"안으로 (in)"},{"text":"part","type":"root","gloss":"몫, 나누다 (part)"}],"story":"몫을 나눠 안에 넣어 주다 → 지식·경험을 나눠 주다"},"example":{"q":"How do you share knowledge with your team?","a":"As a tech lead, I try to impart not just how to fix an issue but why it happened, so the team can prevent similar problems.","a_ko":"테크 리드로서 문제를 고치는 방법만이 아니라 왜 생겼는지까지 전해 주려고 합니다. 그래야 팀이 비슷한 문제를 막을 수 있으니까요."},"collocations":["impart knowledge","impart a sense of"],"related":["apart","particular","participate","counterpart"],"tip":"share 보다 격식 있는 말. 형용사 impartial(공정한)과는 뜻이 다름"},{"id":"d08-A11","day":8,"level":1,"set":"A","family":"F8","word":"include","pos":"verb","ipa":"/ɪnˈkluːd/","meaning_ko":"포함하다","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안에"},{"text":"clude","type":"root","gloss":"닫다 (clud)"}],"story":"안에 넣고 닫다 → 포함하다"},"example":{"q":"What does your current role involve?","a":"My role includes designing APIs and reviewing pull requests for the team.","a_ko":"제 업무에는 API 설계와 팀의 풀 리퀘스트 리뷰가 포함됩니다."},"collocations":["include A in B","including","be included"],"related":["inclusive","exclude","conclude","closure"],"tip":"예시를 들 때는 including ~ 으로 이어 말하면 편함"},{"id":"d08-A12","day":8,"level":2,"set":"A","family":"F8","word":"inclusive","pos":"adjective","ipa":"/ɪnˈkluːsɪv/","meaning_ko":"포용적인, (범위를) 포함하는","category":"interview","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"안에"},{"text":"clus","type":"root","gloss":"닫다 (clud)"},{"text":"ive","type":"suffix","gloss":"~하는"}],"story":"안에 넣어 두는 → 아무도 빼지 않는 → 포용적인"},"example":{"q":"What kind of team culture do you want to build?","a":"I want an inclusive culture where junior members feel comfortable asking questions in meetings.","a_ko":"주니어도 회의에서 편하게 질문할 수 있는, 모두를 포용하는 문화를 만들고 싶습니다."},"collocations":["inclusive culture","inclusive environment","1 to 10 inclusive"],"related":["include","exclusion","conclude"],"tip":"범위를 말할 때 1 to 10 inclusive(1과 10 포함)라는 뜻으로도 씀"},{"id":"d08-A13","day":8,"level":1,"set":"A","family":"F8","word":"exclude","pos":"verb","ipa":"/ɪkˈskluːd/","meaning_ko":"제외하다, 빼다","category":"it","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"clude","type":"root","gloss":"닫다 (clud)"}],"story":"밖에 두고 문을 닫다 → 빼다, 제외하다"},"example":{"q":"How did you reduce the size of your app bundle?","a":"I excluded test fixtures from the production bundle, which cut its size by 30%.","a_ko":"운영 번들에서 테스트용 파일을 제외해서 크기를 30% 줄였습니다."},"collocations":["exclude A from B","excluding"],"related":["exclusion","include","conclude","disclose"],"tip":"반대말 include 와 짝으로 외우기"},{"id":"d08-A14","day":8,"level":2,"set":"A","family":"F8","word":"exclusion","pos":"noun","ipa":"/ɪkˈskluːʒən/","meaning_ko":"제외, 배제","category":"it","etymology":{"parts":[{"text":"ex","type":"prefix","gloss":"밖으로"},{"text":"clus","type":"root","gloss":"닫다 (clud)"},{"text":"ion","type":"suffix","gloss":"~것"}],"story":"밖에 두고 닫음 → 제외"},"example":{"q":"How do you prevent sensitive data from leaking into logs?","a":"We maintain an exclusion list of sensitive fields, so passwords and tokens are masked before anything is logged.","a_ko":"민감한 필드의 제외 목록을 관리해서, 로그에 남기기 전에 비밀번호와 토큰을 가립니다."},"collocations":["exclusion list","exclusion rule"],"related":["exclude","include","inclusive"],"tip":"exclusive(독점적인)와 뜻이 다름 — exclusion 은 '제외'"},{"id":"d08-A15","day":8,"level":1,"set":"A","family":"F8","word":"conclude","pos":"verb","ipa":"/kənˈkluːd/","meaning_ko":"결론짓다, 마무리하다","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"완전히 (com)"},{"text":"clude","type":"root","gloss":"닫다 (clud)"}],"story":"완전히 닫다 → 끝맺다 → 결론을 내리다"},"example":{"q":"What did you learn from the experiment?","a":"We concluded that caching alone would not fix the slow response times.","a_ko":"캐싱만으로는 느린 응답 시간을 해결할 수 없다고 결론지었습니다."},"collocations":["conclude that","to conclude"],"related":["conclusion","include","exclude","closure"],"tip":"To conclude, … 로 긴 답변을 깔끔하게 마무리할 수 있음"},{"id":"d08-A16","day":8,"level":1,"set":"A","family":"F8","word":"conclusion","pos":"noun","ipa":"/kənˈkluːʒən/","meaning_ko":"결론","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"완전히 (com)"},{"text":"clus","type":"root","gloss":"닫다 (clud)"},{"text":"ion","type":"suffix","gloss":"~것"}],"story":"완전히 닫음 → 끝맺음 → 결론"},"example":{"q":"So what's your main takeaway from that project?","a":"My conclusion is that clear ownership matters more than the tools we choose.","a_ko":"제 결론은, 어떤 도구를 쓰느냐보다 책임 소재를 분명히 하는 게 더 중요하다는 것입니다."},"collocations":["come to a conclusion","in conclusion","jump to conclusions"],"related":["conclude","inclusive","closure"],"tip":"jump to conclusions = 성급하게 결론 내리다 (약점 답변에 유용)"},{"id":"d08-A17","day":8,"level":1,"set":"A","family":"F8","word":"closely","pos":"adverb","ipa":"/ˈkloʊsli/","meaning_ko":"긴밀하게, 면밀히","category":"interview","etymology":{"parts":[{"text":"close","type":"root","gloss":"닫힌 → 가까운 (clud)"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"닫힌 → 빈틈없이 붙은 → 가깝게, 긴밀하게"},"example":{"q":"How do you work with designers?","a":"I work closely with designers from the start, so there are fewer surprises later.","a_ko":"처음부터 디자이너와 긴밀하게 일해서, 나중에 생기는 예상 밖 변경을 줄입니다."},"collocations":["work closely with","closely related","monitor closely"],"related":["closure","enclose","disclose","include"],"tip":"close·closely 의 s 는 [s] 발음 — 동사 close [z]와 구별"},{"id":"d08-A18","day":8,"level":1,"set":"A","family":"F8","word":"enclose","pos":"verb","ipa":"/ɪnˈkloʊz/","meaning_ko":"감싸다, 둘러싸다","category":"it","etymology":{"parts":[{"text":"en","type":"prefix","gloss":"안에"},{"text":"close","type":"root","gloss":"닫다 (clud)"}],"story":"안에 두고 닫다 → 둘러싸다, 감싸다"},"example":{"q":"What's a common bug you've seen in config files?","a":"Values with spaces must be enclosed in quotes, or the parser splits them.","a_ko":"공백이 있는 값은 따옴표로 감싸야 합니다. 안 그러면 파서가 값을 나눠 버립니다."},"collocations":["enclose in quotes","enclose in brackets"],"related":["closure","closely","include","disclose"],"tip":"문자열을 따옴표·괄호로 '감싼다'고 할 때 씀"},{"id":"d08-A19","day":8,"level":1,"set":"A","family":"F8","word":"clause","pos":"noun","ipa":"/klɔːz/","meaning_ko":"(SQL·문장의) 절, (계약서의) 조항","category":"it","etymology":{"parts":[{"text":"clause","type":"root","gloss":"닫힌 것 (clud)"}],"story":"닫힌 한 덩어리 → 문장의 끝맺은 한 단위 → 절, 조항"},"example":{"q":"How did you optimize that slow query?","a":"I indexed the column used in the WHERE clause, and the query ran ten times faster.","a_ko":"WHERE 절에 쓰인 컬럼에 인덱스를 걸어서 쿼리가 열 배 빨라졌습니다."},"collocations":["WHERE clause","JOIN clause","contract clause"],"related":["closure","conclude","include"],"tip":"계약서의 '조항'도 clause — 나중에 오퍼 계약서에서도 만남"},{"id":"d08-A20","day":8,"level":2,"set":"A","family":"F8","word":"closure","pos":"noun","ipa":"/ˈkloʊʒər/","meaning_ko":"(프로그래밍) 클로저, 마무리","category":"it","etymology":{"parts":[{"text":"clos","type":"root","gloss":"닫다 (clud)"},{"text":"ure","type":"suffix","gloss":"~것"}],"story":"닫음 → (함수가) 바깥 변수를 안에 감싸 닫아 둔 것 → 클로저"},"example":{"q":"Can you explain a JavaScript concept you use often?","a":"I often use closures to keep state private, for example in a counter function that remembers its value.","a_ko":"상태를 숨기려고 클로저를 자주 씁니다. 예를 들어 자기 값을 기억하는 카운터 함수 같은 경우입니다."},"collocations":["JavaScript closure","get closure","bring closure to"],"related":["closely","enclose","include","clause"],"tip":"일상에서는 '마무리, 매듭'(get closure)이라는 뜻도 있음"},{"id":"d08-A21","day":8,"level":2,"set":"A","family":"F8","word":"disclose","pos":"verb","ipa":"/dɪsˈkloʊz/","meaning_ko":"밝히다, 공개하다","category":"interview","etymology":{"parts":[{"text":"dis","type":"prefix","gloss":"반대로"},{"text":"close","type":"root","gloss":"닫다 (clud)"}],"story":"닫힌 것을 반대로 열다 → 드러내다, 밝히다"},"example":{"q":"Is there anything that might affect your start date?","a":"I should disclose that I have a two-month notice period, so the earliest I could start is March.","a_ko":"미리 말씀드리면 퇴사 통보 기간이 두 달이라, 빠르면 3월에 입사할 수 있습니다."},"collocations":["disclose information","disclose a conflict of interest"],"related":["disclosure","closure","enclose","exclude"],"tip":"공식적으로 '밝히다'. 비밀 유지 계약(NDA) 이야기에서도 자주 나옴"},{"id":"d08-A22","day":8,"level":2,"set":"A","family":"F8","word":"disclosure","pos":"noun","ipa":"/dɪsˈkloʊʒər/","meaning_ko":"(사실을) 밝힘, 공개","category":"interview","etymology":{"parts":[{"text":"dis","type":"prefix","gloss":"반대로"},{"text":"clos","type":"root","gloss":"닫다 (clud)"},{"text":"ure","type":"suffix","gloss":"~것"}],"story":"닫힌 것을 엶 → 숨김없이 밝힘"},"example":{"q":"How much experience do you have with Kotlin?","a":"In the interest of full disclosure, I've only used Kotlin in side projects, but I'm learning quickly.","a_ko":"솔직히 말씀드리면 Kotlin은 개인 프로젝트에서만 써 봤지만, 빠르게 익히고 있습니다."},"collocations":["full disclosure","responsible disclosure"],"related":["disclose","closure","conclusion"],"tip":"Full disclosure, … = 솔직히 털어놓자면. 보안 분야의 responsible disclosure(책임 있는 공개)도 있음"},{"id":"d08-A23","day":8,"level":3,"set":"A","family":"F8","word":"foreclose","pos":"verb","ipa":"/fɔːrˈkloʊz/","meaning_ko":"(가능성을) 미리 막다, 배제하다","category":"interview","etymology":{"parts":[{"text":"fore","type":"prefix","gloss":"밖에 (고대 프랑스어 fors — 영어 fore- 아님)"},{"text":"close","type":"root","gloss":"닫다 (clud)"}],"story":"밖에 두고 문을 닫다 → 미리 막아 버리다 → 선택지를 배제하다"},"example":{"q":"How do you make architecture decisions under uncertainty?","a":"I avoid foreclosing options too early; we kept the storage layer behind an interface so we could switch databases later.","a_ko":"선택지를 너무 일찍 닫아 버리지 않으려고 합니다. 저장 계층을 인터페이스 뒤에 두어서 나중에 DB를 바꿀 수 있게 했습니다."},"collocations":["foreclose an option","foreclose the possibility of"],"related":["exclude","conclude","disclose","closure"],"tip":"대표 뜻은 '(담보물을) 압류하다'지만, 면접에서는 '가능성을 미리 차단하다'로 씀"},{"id":"d08-A24","day":8,"level":2,"set":"A","family":"F8","word":"bottleneck","pos":"noun","ipa":"/ˈbɑːtlnek/","meaning_ko":"병목, 병목 지점","category":"it","etymology":{"parts":[{"text":"bottle","type":"part","gloss":"병"},{"text":"neck","type":"part","gloss":"목"}],"story":"병의 좁은 목 → 흐름이 막히는 좁은 곳 → 병목"},"example":{"q":"How did you find the cause of the slowdown?","a":"Profiling showed the bottleneck was a single database query that ran on every request.","a_ko":"프로파일링해 보니 요청마다 실행되는 DB 쿼리 하나가 병목이었습니다."},"collocations":["performance bottleneck","identify the bottleneck","become a bottleneck"],"related":["root cause","stopgap","troubleshoot"],"tip":"사람에게도 씀 — I didn't want to become a bottleneck for the team."},{"id":"d08-A25","day":8,"level":2,"set":"A","family":"F8","word":"root cause","pos":"noun","ipa":"/ˈruːt ˌkɔːz/","meaning_ko":"근본 원인","category":"it","etymology":{"parts":[{"text":"root","type":"part","gloss":"뿌리"},{"text":"cause","type":"part","gloss":"원인"}],"story":"뿌리에 있는 원인 → 근본 원인"},"example":{"q":"What did you do after the outage was over?","a":"I led the root cause analysis and found that a config change had skipped code review.","a_ko":"근본 원인 분석을 주도했고, 설정 변경 하나가 코드 리뷰를 거치지 않았다는 것을 찾아냈습니다."},"collocations":["root cause analysis","find the root cause","address the root cause"],"related":["bottleneck","troubleshoot","stopgap"],"tip":"증상(symptom)과 대비해서 쓰면 좋음. RCA = root cause analysis"},{"id":"d08-B01","day":8,"level":1,"set":"B","family":"F8","word":"route","pos":"noun","ipa":"/ruːt, raʊt/","meaning_ko":"경로, (API) 라우트","category":"it","etymology":{"parts":[{"text":"route","type":"root","gloss":"깨뜨려 뚫은 (rupt)"}],"story":"깨뜨려 뚫은 길(rupta via) → 길, 경로 → (웹) 요청 경로"},"example":{"q":"How is your backend organized?","a":"Each API route maps to a small handler function with its own tests.","a_ko":"API 라우트마다 자체 테스트가 있는 작은 핸들러 함수가 연결돼 있습니다."},"collocations":["API route","route traffic","en route"],"related":["reroute","routine","corrupt","erupt"],"tip":"미국에서는 [루트]·[라우트] 둘 다 씀. router 는 보통 [라우터]"},{"id":"d08-B02","day":8,"level":1,"set":"B","family":"F8","word":"routine","pos":"noun","ipa":"/ruːˈtiːn/","meaning_ko":"일과, 늘 하는 순서","category":"interview","etymology":{"parts":[{"text":"rout","type":"root","gloss":"길 (route ← rupt)"},{"text":"ine","type":"suffix","gloss":"~한 것"}],"story":"늘 다니는 길 → 매일 반복하는 일과"},"example":{"q":"How do you start your workday?","a":"My morning routine is to check alerts and then plan my top three tasks.","a_ko":"아침마다 알림을 먼저 확인하고, 가장 중요한 일 세 가지를 정하는 것이 제 일과입니다."},"collocations":["daily routine","routine maintenance","routine task"],"related":["routinely","route","reroute"],"tip":"형용사로는 '일상적인, 판에 박힌'(routine work)"},{"id":"d08-B03","day":8,"level":1,"set":"B","family":"F8","word":"routinely","pos":"adverb","ipa":"/ruːˈtiːnli/","meaning_ko":"늘, 일상적으로","category":"interview","etymology":{"parts":[{"text":"rout","type":"root","gloss":"길 (route ← rupt)"},{"text":"ine","type":"suffix","gloss":"~한 것"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"늘 다니는 길처럼 → 습관처럼 늘"},"example":{"q":"How do you maintain code quality?","a":"I routinely review my own pull requests before asking anyone else.","a_ko":"다른 사람에게 요청하기 전에 제 풀 리퀘스트를 늘 먼저 직접 검토합니다."},"collocations":["routinely check","routinely use"],"related":["routine","route"],"tip":"regularly 와 비슷하지만 '습관처럼 늘' 하는 느낌"},{"id":"d08-B04","day":8,"level":2,"set":"B","family":"F8","word":"reroute","pos":"verb","ipa":"/ˌriːˈruːt/","meaning_ko":"(트래픽을) 우회시키다, 경로를 바꾸다","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"route","type":"root","gloss":"길 (rupt)"}],"story":"길을 다시 정하다 → 다른 길로 돌리다"},"example":{"q":"What did you do when one region went down?","a":"We rerouted traffic to the backup region within minutes, so most users never noticed the outage.","a_ko":"몇 분 안에 트래픽을 백업 리전으로 우회시켜서, 대부분의 사용자는 장애를 눈치채지 못했습니다."},"collocations":["reroute traffic","reroute requests"],"related":["route","routine","corrupt"],"tip":"장애 대응(failover) 경험을 말할 때 유용"},{"id":"d08-B05","day":8,"level":1,"set":"B","family":"F8","word":"corrupt","pos":"verb","ipa":"/kəˈrʌpt/","meaning_ko":"(데이터를) 손상시키다","category":"it","etymology":{"parts":[{"text":"cor","type":"prefix","gloss":"완전히 (com)"},{"text":"rupt","type":"root","gloss":"깨다"}],"story":"완전히 깨뜨리다 → 망가뜨리다 → 손상시키다"},"example":{"q":"Have you ever lost data?","a":"A failed disk once corrupted our backup, so now we test restores every month.","a_ko":"디스크 고장으로 백업이 손상된 적이 있어서, 지금은 매달 복구 테스트를 합니다."},"collocations":["corrupted file","corrupt data"],"related":["corruption","erupt","rupture","route"],"tip":"사람에게 쓰면 '부패한' — IT에서는 '손상된'(corrupted)"},{"id":"d08-B06","day":8,"level":2,"set":"B","family":"F8","word":"corruption","pos":"noun","ipa":"/kəˈrʌpʃən/","meaning_ko":"(데이터) 손상","category":"it","etymology":{"parts":[{"text":"cor","type":"prefix","gloss":"완전히 (com)"},{"text":"rupt","type":"root","gloss":"깨다"},{"text":"ion","type":"suffix","gloss":"~것"}],"story":"완전히 깨짐 → 망가짐 → 손상"},"example":{"q":"What's the hardest bug you've fixed?","a":"I tracked down a data corruption issue caused by two services writing to the same file without a lock.","a_ko":"두 서비스가 잠금 없이 같은 파일에 쓰면서 생긴 데이터 손상 문제를 추적해 해결했습니다."},"collocations":["data corruption","memory corruption"],"related":["corrupt","rupture","erupt"],"tip":"일반적인 뜻은 '부패' — 기술 맥락에선 data/memory 를 앞에 붙여 분명하게"},{"id":"d08-B07","day":8,"level":2,"set":"B","family":"F8","word":"erupt","pos":"verb","ipa":"/ɪˈrʌpt/","meaning_ko":"(갈등이) 터지다, 분출하다","category":"interview","etymology":{"parts":[{"text":"e","type":"prefix","gloss":"밖으로 (ex)"},{"text":"rupt","type":"root","gloss":"깨다"}],"story":"깨고 밖으로 터져 나오다 → (화산이) 분출하다 → (갈등이) 터지다"},"example":{"q":"How do you handle disagreements in your team?","a":"I try to address tension early, before it erupts into an argument in front of the whole team.","a_ko":"팀 전체 앞에서 언쟁으로 터지기 전에, 긴장이 보이면 일찍 이야기하려고 합니다."},"collocations":["conflict erupts","erupt into"],"related":["corrupt","rupture","route"],"tip":"화산 폭발이 원래 이미지. 갈등·논쟁이 갑자기 터질 때 씀"},{"id":"d08-B08","day":8,"level":2,"set":"B","family":"F8","word":"rupture","pos":"noun","ipa":"/ˈrʌptʃər/","meaning_ko":"(관계의) 단절, 파열","category":"interview","etymology":{"parts":[{"text":"rupt","type":"root","gloss":"깨다"},{"text":"ure","type":"suffix","gloss":"~것"}],"story":"깨짐 → 파열 → (관계가) 깨짐, 단절"},"example":{"q":"Tell me about a difficult situation with a client.","a":"After a missed deadline, I met the client in person to explain our plan, which prevented a rupture in the relationship.","a_ko":"마감을 놓친 뒤 고객을 직접 만나 계획을 설명했고, 그 덕분에 관계가 틀어지는 것을 막았습니다."},"collocations":["a rupture in the relationship","a rupture of trust"],"related":["erupt","corrupt","route"],"tip":"관계·신뢰가 깨지는 큰 단절. 가벼운 의견 차이는 disagreement"},{"id":"d08-B09","day":8,"level":1,"set":"B","family":"F8","word":"party","pos":"noun","ipa":"/ˈpɑːrti/","meaning_ko":"(관련) 당사자, 측","category":"interview","etymology":{"parts":[{"text":"part","type":"root","gloss":"나누다 (part)"},{"text":"y","type":"suffix","gloss":"~것 (-ie)"}],"story":"나뉜 한쪽 → 편, 측 → (일에 관련된) 당사자"},"example":{"q":"How do you handle requirements that keep changing?","a":"I bring every party into one meeting so everyone agrees on the priorities.","a_ko":"관련된 모든 당사자를 한 회의에 모아서, 모두가 우선순위에 합의하게 합니다."},"collocations":["all parties","the parties involved","third party"],"related":["third-party","partly","partial","counterpart"],"tip":"'관련 당사자들' = the parties involved. 파티(잔치) 뜻과 구별"},{"id":"d08-B10","day":8,"level":2,"set":"B","family":"F8","word":"third-party","pos":"adjective","ipa":"/ˌθɜːrd ˈpɑːrti/","meaning_ko":"외부(제3자)의","category":"it","etymology":{"parts":[{"text":"third","type":"part","gloss":"세 번째"},{"text":"party","type":"root","gloss":"편, 당사자 (part)"}],"story":"제3의 편 → 우리도 고객도 아닌 바깥의 것"},"example":{"q":"How do you evaluate a new library?","a":"Before adding a third-party library, I check its license, maintenance activity, and known vulnerabilities.","a_ko":"외부 라이브러리를 추가하기 전에 라이선스, 유지보수 상황, 알려진 취약점을 확인합니다."},"collocations":["third-party library","third-party API","third-party vendor"],"related":["party","partner","counterpart"],"tip":"명사 앞에 쓸 때는 하이픈: third-party library"},{"id":"d08-B11","day":8,"level":1,"set":"B","family":"F8","word":"partly","pos":"adverb","ipa":"/ˈpɑːrtli/","meaning_ko":"부분적으로, 일부는","category":"interview","etymology":{"parts":[{"text":"part","type":"root","gloss":"부분 (part)"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"부분만큼 → 일부는"},"example":{"q":"Why are you looking for a new job?","a":"Partly for growth, and partly because I want to work on larger systems.","a_ko":"성장을 위해서이기도 하고, 더 큰 시스템을 다뤄 보고 싶어서이기도 합니다."},"collocations":["partly because","partly due to"],"related":["partial","party","portion","apart"],"tip":"partly A, partly B 로 이유 두 개를 말하기 좋음"},{"id":"d08-B12","day":8,"level":1,"set":"B","family":"F8","word":"partial","pos":"adjective","ipa":"/ˈpɑːrʃəl/","meaning_ko":"부분적인, 일부의","category":"it","etymology":{"parts":[{"text":"parti","type":"root","gloss":"부분 (part)"},{"text":"al","type":"suffix","gloss":"~의"}],"story":"부분의 → 일부만의"},"example":{"q":"How did the outage affect users?","a":"It was a partial outage, so only users in Europe saw errors.","a_ko":"부분 장애여서 유럽 사용자만 오류를 겪었습니다."},"collocations":["partial outage","partial failure","partial refund"],"related":["partially","partly","party","proportion"],"tip":"be partial to ~ = ~을 특히 좋아하다 라는 뜻도 있음"},{"id":"d08-B13","day":8,"level":1,"set":"B","family":"F8","word":"partially","pos":"adverb","ipa":"/ˈpɑːrʃəli/","meaning_ko":"부분적으로","category":"it","etymology":{"parts":[{"text":"parti","type":"root","gloss":"부분 (part)"},{"text":"al","type":"suffix","gloss":"~의"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"부분의 → 부분적으로"},"example":{"q":"Did the migration go as planned?","a":"It was only partially successful, so we rolled back two services.","a_ko":"일부만 성공해서 서비스 두 개는 롤백했습니다."},"collocations":["partially complete","partially successful"],"related":["partial","partly","portion"],"tip":"partly 와 거의 같지만 상태·정도(partially done)에 더 자주 씀"},{"id":"d08-B14","day":8,"level":1,"set":"B","family":"F8","word":"portion","pos":"noun","ipa":"/ˈpɔːrʃən/","meaning_ko":"부분, 몫","category":"interview","etymology":{"parts":[{"text":"port","type":"root","gloss":"몫, 부분 (part와 같은 뿌리)"},{"text":"ion","type":"suffix","gloss":"~것"}],"story":"나눠 받은 몫 → 일부분"},"example":{"q":"How much of your time goes to coding?","a":"A large portion of my week goes to coding, and the rest to reviews.","a_ko":"한 주의 상당 부분은 코딩에, 나머지는 리뷰에 씁니다."},"collocations":["a large portion of","a significant portion"],"related":["proportion","apportion","partly","partial"],"tip":"port 가 '나르다(port)'와 철자만 같고 다른 뿌리 — 여기는 '몫'"},{"id":"d08-B15","day":8,"level":1,"set":"B","family":"F8","word":"proportion","pos":"noun","ipa":"/prəˈpɔːrʃən/","meaning_ko":"비율, 균형","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"~에 따라"},{"text":"port","type":"root","gloss":"몫 (part와 같은 뿌리)"},{"text":"ion","type":"suffix","gloss":"~것"}],"story":"몫에 따라(pro portione) → 비율, 균형"},"example":{"q":"How do you balance new features and tech debt?","a":"I keep a fixed proportion of each sprint, about 20%, for tech debt.","a_ko":"매 스프린트의 일정 비율, 약 20%는 기술 부채 해결에 씁니다."},"collocations":["a large proportion of","in proportion to","out of proportion"],"related":["proportional","portion","apportion"],"tip":"out of proportion = 지나치게 커진 (문제를 과장할 때)"},{"id":"d08-B16","day":8,"level":2,"set":"B","family":"F8","word":"proportional","pos":"adjective","ipa":"/prəˈpɔːrʃənl/","meaning_ko":"비례하는","category":"it","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"~에 따라"},{"text":"port","type":"root","gloss":"몫 (part와 같은 뿌리)"},{"text":"ion","type":"suffix","gloss":"~것"},{"text":"al","type":"suffix","gloss":"~의"}],"story":"몫에 따른 → 비율에 맞는 → 비례하는"},"example":{"q":"How does your system handle traffic spikes?","a":"We scale pods automatically, so the cost stays roughly proportional to the actual traffic.","a_ko":"파드를 자동으로 늘리고 줄여서, 비용이 실제 트래픽에 대략 비례하게 유지됩니다."},"collocations":["proportional to","directly proportional"],"related":["proportion","portion","apportion"],"tip":"A is proportional to B = A는 B에 비례한다"},{"id":"d08-B17","day":8,"level":2,"set":"B","family":"F8","word":"proportionate","pos":"adjective","ipa":"/prəˈpɔːrʃənət/","meaning_ko":"(정도에) 걸맞은, 균형이 맞는","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"~에 따라"},{"text":"port","type":"root","gloss":"몫 (part와 같은 뿌리)"},{"text":"ion","type":"suffix","gloss":"~것"},{"text":"ate","type":"suffix","gloss":"~한"}],"story":"몫에 따라 맞춘 → 정도에 걸맞은"},"example":{"q":"How do you decide how much process a project needs?","a":"I keep the process proportionate to the risk, so a small internal tool doesn't need the same reviews as a payment system.","a_ko":"위험도에 맞춰 절차의 양을 정합니다. 작은 사내 도구에 결제 시스템과 같은 수준의 리뷰가 필요하지는 않으니까요."},"collocations":["proportionate to","a proportionate response"],"related":["proportion","proportional","portion","apportion"],"tip":"proportional(수치상 비례하는)보다 '정도에 걸맞은'이라는 판단의 뉘앙스"},{"id":"d08-B18","day":8,"level":3,"set":"B","family":"F8","word":"apportion","pos":"verb","ipa":"/əˈpɔːrʃən/","meaning_ko":"배분하다, 나눠 주다","category":"interview","etymology":{"parts":[{"text":"ap","type":"prefix","gloss":"~에게 (ad)"},{"text":"port","type":"root","gloss":"몫 (part와 같은 뿌리)"},{"text":"ion","type":"suffix","gloss":"~것"}],"story":"각자에게 몫을 나눠 주다 → 배분하다"},"example":{"q":"How did you distribute work as a team lead?","a":"I apportioned the work by each engineer's growth goals, not just their current skills, so everyone got a stretch task.","a_ko":"현재 실력만이 아니라 각자의 성장 목표에 맞춰 일을 배분해서, 모두가 도전적인 과제를 하나씩 맡게 했습니다."},"collocations":["apportion blame","apportion resources","apportion time"],"related":["portion","proportion","partial"],"tip":"격식 있는 말. apportion blame(책임을 나누다)도 자주 쓰임"},{"id":"d08-B19","day":8,"level":2,"set":"B","family":"F8","word":"parse","pos":"verb","ipa":"/pɑːrs/","meaning_ko":"파싱하다, 구문을 분석하다","category":"it","etymology":{"parts":[{"text":"parse","type":"root","gloss":"부분 (pars)"}],"story":"(문장을) 품사(parts of speech)별로 나누다 → 구문을 분석하다 → 데이터를 파싱하다"},"example":{"q":"What did you build in your last project?","a":"I built a service that parses CSV uploads and validates each row before saving it.","a_ko":"CSV 업로드를 파싱하고 저장하기 전에 각 행을 검증하는 서비스를 만들었습니다."},"collocations":["parse JSON","parse a file","parse error"],"related":["parser","partial","party"],"tip":"발음 [파ː스] — 끝소리가 [s]"},{"id":"d08-B20","day":8,"level":2,"set":"B","family":"F8","word":"parser","pos":"noun","ipa":"/ˈpɑːrsər/","meaning_ko":"파서, 구문 분석기","category":"it","etymology":{"parts":[{"text":"pars","type":"root","gloss":"부분 (pars)"},{"text":"er","type":"suffix","gloss":"~하는 것"}],"story":"부분으로 나눠 분석하는 것 → 구문 분석기"},"example":{"q":"How did you handle malformed input?","a":"I made the parser skip invalid lines and log them, instead of failing the whole file.","a_ko":"파일 전체를 실패시키는 대신, 파서가 잘못된 줄은 건너뛰고 로그로 남기게 했습니다."},"collocations":["JSON parser","write a parser"],"related":["parse","partial","party"],"tip":"컴파일러를 설명할 때 lexer → parser 순서로 말함"},{"id":"d08-B21","day":8,"level":2,"set":"B","family":"F8","word":"jeopardy","pos":"noun","ipa":"/ˈdʒepərdi/","meaning_ko":"위험, 위태로움","category":"interview","etymology":{"parts":[{"text":"jeo","type":"part","gloss":"놀이 (jeu)"},{"text":"pardy","type":"root","gloss":"나뉜 (parti ← part)"}],"story":"승부가 반반으로 나뉜 놀이(jeu parti) → 결과를 알 수 없음 → 위험"},"example":{"q":"Tell me about a time a project was at risk.","a":"When our main engineer left mid-project, the launch was in jeopardy, so I reorganized the plan around the remaining team.","a_ko":"프로젝트 도중 핵심 엔지니어가 떠나 출시가 위태로워져서, 남은 팀원에 맞춰 계획을 다시 짰습니다."},"collocations":["in jeopardy","put A in jeopardy"],"related":["jeopardize","party","apart"],"tip":"be in jeopardy = 위태롭다. at risk 보다 무게감 있음"},{"id":"d08-B22","day":8,"level":3,"set":"B","family":"F8","word":"jeopardize","pos":"verb","ipa":"/ˈdʒepərdaɪz/","meaning_ko":"위태롭게 하다","category":"interview","etymology":{"parts":[{"text":"jeo","type":"part","gloss":"놀이 (jeu)"},{"text":"pard","type":"root","gloss":"나뉜 (parti ← part)"},{"text":"ize","type":"suffix","gloss":"~하게 하다"}],"story":"결과가 반반으로 나뉜 상태에 두다 → 위태롭게 하다"},"example":{"q":"Have you ever pushed back on a deadline?","a":"I pushed back because rushing the payment feature would have jeopardized data integrity, and I proposed shipping a smaller scope first.","a_ko":"결제 기능을 서두르면 데이터 무결성이 위태로워질 수 있어서 이의를 제기했고, 범위를 줄여 먼저 출시하자고 제안했습니다."},"collocations":["jeopardize the project","jeopardize data integrity"],"related":["jeopardy","party","apart"],"tip":"jeopardy(명사)의 동사형. put at risk 의 격식 있는 말"},{"id":"d08-B23","day":8,"level":1,"set":"B","family":"F8","word":"narrow down","pos":"phrasal verb","ipa":"/ˈnæroʊ daʊn/","meaning_ko":"(범위·원인을) 좁히다","category":"interview","etymology":{"parts":[{"text":"narrow","type":"part","gloss":"좁은, 좁히다"},{"text":"down","type":"part","gloss":"아래로, 줄여서"}],"story":"범위를 좁혀 줄이다 → 원인·선택지를 좁혀 가다"},"example":{"q":"What do you do when you're stuck?","a":"I narrow down the problem step by step until I find where it fails.","a_ko":"어디서 실패하는지 찾을 때까지 문제 범위를 단계적으로 좁혀 갑니다."},"collocations":["narrow down the cause","narrow down the options","narrow it down to"],"related":["sort out","look into","troubleshoot"],"tip":"narrow it down to two options = 선택지를 둘로 좁히다"},{"id":"d08-B24","day":8,"level":1,"set":"B","family":"F8","word":"sort out","pos":"phrasal verb","ipa":"/ˈsɔːrt aʊt/","meaning_ko":"(문제를) 정리하다, 해결하다","category":"interview","etymology":{"parts":[{"text":"sort","type":"part","gloss":"분류하다"},{"text":"out","type":"part","gloss":"끝까지, 깔끔히"}],"story":"종류별로 골라 정리해 내다 → 엉킨 문제를 정리·해결하다"},"example":{"q":"How do you handle conflicting priorities?","a":"I sit down with my manager to sort out which tasks matter most this week.","a_ko":"매니저와 앉아서 이번 주에 가장 중요한 일이 무엇인지 정리합니다."},"collocations":["sort out a problem","sort things out","get it sorted"],"related":["narrow down","deal with","look into"],"tip":"영국식 느낌이 강하지만 미국에서도 잘 통함"},{"id":
