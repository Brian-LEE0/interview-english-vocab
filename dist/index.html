<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F4">
<title>면접영어 어원 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
:root{
  --ink:#16233B; --ink-2:#4A5872; --paper:#EEF1F4; --card:#FFFFFF; --line:#C9D1DB;
  --prefix:#2F5BD3; --root:#B9770E; --suffix:#127A68; --ok:#127A68; --bad:#C0392B;
  --display:"Bricolage Grotesque","Pretendard",sans-serif;
  --body:"Pretendard",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --tab:60px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--prefix);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}

/* top bar */
.bar{display:flex;align-items:center;gap:24px;padding:14px 32px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand span{color:var(--root)}
.bar nav{display:flex;gap:4px;margin-left:auto}
.bar nav button{background:none;border:0;color:var(--ink-2);padding:6px 12px;border-radius:6px;font-size:14px;cursor:pointer}
.bar nav button[aria-current]{background:var(--ink);color:#fff}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--root);color:#fff;font-size:11px;line-height:18px;text-align:center}
.daychip{display:none;margin-left:auto;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink-2);background:none}

.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;max-width:1180px;margin:0 auto;padding:32px}
.wrap.single{grid-template-columns:minmax(0,760px);justify-content:center}

/* rail */
.rail h2{font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 10px;letter-spacing:.04em}
.levels{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.lvname{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.days{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.days button{display:grid;place-items:center;aspect-ratio:1;border-radius:6px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);color:var(--ink-2);background:transparent;padding:0;cursor:pointer}
.days button.part{background:#DCE3EC}
.days button.done{background:var(--ink);border-color:var(--ink);color:#fff}
.days button.now{border:2px solid var(--root);color:var(--root);font-weight:600}
.days button.done.now{color:#fff}
.days button.mock{border-style:dashed}
.days button:disabled{opacity:.35;cursor:default}
.legend{font-size:12px;color:var(--ink-2);margin:0 0 28px}
.roots{list-style:none;padding:0;margin:0 0 28px}
.roots li{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.roots code{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--root)}
.roots small{color:var(--ink-2);margin-left:auto;font-family:var(--mono)}
.mix{display:flex;flex-direction:column;gap:8px;font-size:14px;margin-bottom:28px}
.mix div{display:flex;justify-content:space-between}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:2px}
.meter i{display:block;height:100%;background:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink-2);font-size:13px;text-decoration:underline;cursor:pointer}

/* day header + sets */
.dayhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dayhead h1{font-family:var(--display);font-size:22px;margin:0;letter-spacing:-.02em}
.dayhead .sub{font-size:13px;color:var(--ink-2)}
.dayhead .arrows{margin-left:auto;display:flex;gap:6px}
.btn-s{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.btn-s:disabled{opacity:.4;cursor:default}
.btn-s[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.set{font-size:13px;color:var(--ink-2);font-family:var(--mono);background:none;border:0;padding:6px 4px;text-align:left;border-radius:8px;cursor:pointer}
.set span{display:block;font-family:var(--body);font-weight:600}
.set[aria-current] {background:var(--card)}
.set[aria-current] span{color:var(--ink)}
.set small{font-size:11px}
.set .meter{margin:4px 0 2px}
.banner{background:var(--card);border:1px dashed var(--root);border-radius:12px;padding:14px 18px;margin-bottom:14px;font-size:14px}
.banner b{color:var(--root)}
.banner ol{margin:8px 0 0;padding-left:20px}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 40px;touch-action:pan-y}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-bottom:20px}
.tag{border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink)}
.meta .pos{margin-right:auto}
.icon{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.counter{font-family:var(--mono);font-size:12px}

.gloss{display:flex;align-items:flex-end;flex-wrap:wrap;row-gap:10px;margin:0 0 6px}
.m{display:flex;flex-direction:column;padding-right:4px;min-width:0}
.m .t{font-family:var(--display);font-weight:800;line-height:1;letter-spacing:-.035em;white-space:nowrap}
.gloss.xl .t{font-size:clamp(44px,12vw,84px)}
.gloss.l .t{font-size:clamp(36px,9.5vw,70px)}
.gloss.m_ .t{font-size:clamp(30px,7.5vw,54px)}
.gloss.s .t{font-size:clamp(24px,6vw,42px)}
.m .u{height:4px;margin:10px 0 8px;border-radius:2px}
.m .g{font-size:15px;font-weight:600;line-height:1.3;max-width:16em}
.m .g em{display:block;font-style:normal;font-weight:400;font-size:11px;opacity:.7;letter-spacing:.04em}
.prefix .t,.prefix .g{color:var(--prefix)} .prefix .u{background:var(--prefix)}
.root .t,.root .g{color:var(--root)} .root .u{background:var(--root);height:6px}
.suffix .t,.suffix .g{color:var(--suffix)} .suffix .u{background:var(--suffix)}
.part .t,.part .g{color:var(--ink)} .part .u{background:var(--line)}
.dot{font-family:var(--display);font-size:32px;color:var(--line);align-self:flex-start;padding:10px 4px 0 1px}

.ipa{font-family:var(--mono);color:var(--ink-2);font-size:14px;margin:14px 0 4px}
.meaning{font-size:24px;font-weight:700;margin:0}
.story{color:var(--ink-2);margin:6px 0 0}
.revealbtn{display:block;width:100%;margin-top:22px;padding:16px;border:1px dashed var(--line);background:var(--paper);border-radius:10px;font-weight:600;cursor:pointer}

.transcript{margin:26px 0 0;border-top:1px solid var(--line);padding-top:20px}
.transcript h3,.side h3{font-size:12px;letter-spacing:.08em;color:var(--ink-2);margin:0 0 12px;font-weight:600}
.line{display:grid;grid-template-columns:28px 1fr;gap:12px;margin-bottom:12px}
.line .who{font-family:var(--mono);font-weight:600;font-size:13px;width:28px;height:28px;display:grid;place-items:center;border-radius:6px}
.line.q .who{background:var(--paper);color:var(--ink-2)}
.line.a .who{background:var(--ink);color:#fff}
.line.q p{color:var(--ink-2);margin:2px 0 0}
.line.a p{margin:2px 0 0;font-size:18px}
mark{background:none;color:var(--root);font-weight:700;border-bottom:2px solid var(--root)}
.line.a .ko{display:block;font-size:14px;color:var(--ink-2);margin-top:4px}
.listen{margin-left:40px;min-height:36px}

.side{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:24px;border-top:1px solid var(--line);padding-top:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span,.chips button{font-size:14px;background:var(--paper);border:0;border-radius:6px;padding:4px 10px}
.chips button{cursor:pointer;border:1px solid var(--line);background:none}
.tip{font-size:14px;color:var(--ink-2);margin:16px 0 0}

.actions{display:flex;gap:10px;margin-top:18px;align-items:center}
.actions button{font-weight:600;padding:12px 20px;border-radius:10px;cursor:pointer;border:1px solid var(--ink)}
.again{background:transparent}
.know{background:var(--ink);color:#fff;margin-left:auto}
.prev{border-color:var(--line)!important;background:none}
.hint{font-size:12px;color:var(--ink-2);margin-top:8px;text-align:right}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 32px}
.panel h2{font-family:var(--display);font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
.panel p.lead{color:var(--ink-2);margin:0 0 20px}
.field{margin-bottom:18px}
.field > span{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.primary{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:14px 22px;font-weight:600;cursor:pointer}
.primary:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* quiz */
.qtop{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--ink-2);margin-bottom:10px}
.qprompt{font-family:var(--display);font-weight:800;font-size:clamp(32px,8vw,56px);letter-spacing:-.03em;line-height:1.1;margin:6px 0}
.qsent{font-size:19px;margin:8px 0}
.qsent .blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--root);color:var(--root);font-weight:700}
.qhint{color:var(--ink-2);font-size:14px}
.qask{font-size:14px;font-weight:600;color:var(--ink-2);margin:18px 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-size:16px;min-height:52px}
.opt.right{border-color:var(--ok);background:#E3F3EF;font-weight:600}
.opt.wrong{border-color:var(--bad);background:#FBE9E7}
.opt:disabled{cursor:default;color:var(--ink)}
.explain{margin-top:14px;padding:12px 14px;background:var(--paper);border-radius:10px;font-size:14px}
.score{font-family:var(--display);font-size:64px;font-weight:800;color:var(--root);line-height:1}

/* lists */
.fams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fam{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.fam b{display:block;font-size:16px}
.fam code{font-family:var(--mono);font-size:12px;color:var(--root)}
.fam small{display:block;color:var(--ink-2);font-size:12px;margin-top:4px}
.rgroup{border-top:1px solid var(--line);padding:12px 0}
.rgroup h3{margin:0 0 8px;font-size:14px}
.rgroup h3 code{font-family:var(--mono);color:var(--root);font-size:17px;margin-right:6px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);margin-bottom:16px}
.results{list-style:none;margin:0;padding:0}
.results li button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;width:100%;text-align:left;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;align-items:baseline}
.results b{font-size:16px}
.results small{color:var(--ink-2);font-family:var(--mono);font-size:12px}
.results span{color:var(--ink-2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;color:var(--ink-2);padding:24px 8px}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(22,35,59,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:40px 16px}
.sheet .inner{width:min(760px,100%)}
.sheet .close{display:block;margin:0 0 10px auto;background:var(--card);border:0;border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}

/* mobile: thumb-first */
@media (max-width:860px){
  body{padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom))}
  .bar{padding:12px 16px;position:sticky;top:0;z-index:5}
  .daychip{display:inline-flex}
  .bar nav{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);gap:0;align-items:center;
    background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));height:calc(var(--tab) + env(safe-area-inset-bottom))}
  .bar nav button{text-align:center;padding:10px 2px;font-size:13px;border-radius:8px}
  .wrap,.wrap.single{grid-template-columns:minmax(0,1fr);gap:20px;padding:12px 14px}
  .rail{order:2}
  .card{padding:22px 18px;border-radius:12px}
  .panel{padding:22px 18px}
  .m .g{font-size:14px}
  .dot{font-size:24px;padding:6px 3px 0 1px}
  .meaning{font-size:20px}
  .line.a p{font-size:17px}
  .side{grid-template-columns:1fr;gap:22px}
  .sets{gap:4px}
  .set span{font-size:12px}
  .dayhead h1{font-size:19px}
  .actions{position:sticky;bottom:calc(var(--tab) + env(safe-area-inset-bottom));z-index:4;margin:16px -14px 0;padding:10px 14px;background:var(--paper);border-top:1px solid var(--line)}
  .actions button{flex:1;min-height:52px;font-size:16px}
  .actions .prev{flex:0 0 52px;padding:0}
  .know{margin-left:0}
  .know .long,.hint{display:none}
  .sheet{padding:16px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">mensetsu<span>.</span>tango</div>
  <button class="daychip" type="button" data-act="go" data-view="learn" id="daychip"></button>
  <nav aria-label="메뉴">
    <button type="button" data-act="go" data-view="learn">오늘의 학습</button>
    <button type="button" data-act="go" data-view="quiz">퀴즈</button>
    <button type="button" data-act="go" data-view="review">복습<span id="revcount"></span></button>
    <button type="button" data-act="go" data-view="map">어근 지도</button>
  </nav>
</header>
<div id="app"></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="단어 카드" hidden><div class="inner"></div></div>

ive on how our product is actually used.","a_ko":"사용자와 더 가까이에서 일하면 제품이 실제로 어떻게 쓰이는지 더 넓은 관점을 얻을 수 있습니다."},"collocations":["from my perspective","a fresh perspective","put things in perspective"],"related":["expect","aspect","retrospective","prospect"],"tip":"from my perspective 는 의견을 부드럽게 꺼낼 때 쓰는 만능 표현"},{"id":"d01-A07","day":1,"level":2,"set":"A","family":"F1","word":"suspicious","pos":"adjective","ipa":"/səˈspɪʃəs/","meaning_ko":"의심스러운, 수상한","category":"it","etymology":{"parts":[{"text":"su","type":"prefix","gloss":"아래에서 (sub)"},{"text":"spic","type":"root","gloss":"보다 (spect)"},{"text":"ious","type":"suffix","gloss":"~한 성질의"}],"story":"몰래 올려다보는 → 의심하는 → 수상한"},"example":{"q":"Have you dealt with any security issues?","a":"I noticed suspicious login attempts from one IP, so I blocked it and alerted the security team.","a_ko":"한 IP에서 수상한 로그인 시도가 있는 걸 발견하고 차단한 뒤 보안팀에 알렸습니다."},"collocations":["suspicious activity","suspicious login","be suspicious of"],"related":["suspect","conspicuous","auspicious"],"tip":"suspicious activity 는 보안 경험을 말할 때 자주 나오는 표현"},{"id":"d01-A08","day":1,"level":2,"set":"A","family":"F1","word":"spectator","pos":"noun","ipa":"/ˈspekteɪtər/","meaning_ko":"구경꾼, 방관자","category":"interview","etymology":{"parts":[{"text":"spect","type":"root","gloss":"보다"},{"text":"ator","type":"suffix","gloss":"~하는 사람"}],"story":"지켜보는 사람 → 구경꾼 → (참여하지 않는) 방관자"},"example":{"q":"How do you usually behave in meetings?","a":"I don't like being a spectator in meetings, so I always come with at least one idea.","a_ko":"회의에서 구경만 하는 건 싫어서, 항상 아이디어를 하나 이상 준비해 갑니다."},"collocations":["a passive spectator","not just a spectator","spectator sport"],"related":["spectacular","spectrum","expect"],"tip":"적극적인 성격을 말할 때 ‘방관자가 아니다’라는 반대 표현으로 활용"},{"id":"d01-A09","day":1,"level":2,"set":"A","family":"F1","word":"spectacular","pos":"adjective","ipa":"/spekˈtækjələr/","meaning_ko":"눈부신, 극적인","category":"interview","etymology":{"parts":[{"text":"spect","type":"root","gloss":"보다"},{"text":"acul","type":"suffix","gloss":"~하는 것 (구경거리)"},{"text":"ar","type":"suffix","gloss":"~의"}],"story":"보는 것 → 구경거리(spectacle) → 구경거리 같은 → 눈부신"},"example":{"q":"What is your proudest achievement?","a":"It wasn't spectacular, but cutting our build time in half made every developer's day easier.","a_ko":"화려한 일은 아니었지만, 빌드 시간을 절반으로 줄여서 모든 개발자의 일이 편해졌습니다."},"collocations":["spectacular results","nothing spectacular","a spectacular failure"],"related":["spectator","spectrum","perspective"],"tip":"겸손하게 성과를 말할 때 It wasn't spectacular, but ~ 패턴이 자연스러움"},{"id":"d01-A10","day":1,"level":3,"set":"A","family":"F1","word":"conspicuous","pos":"adjective","ipa":"/kənˈspɪkjuəs/","meaning_ko":"눈에 잘 띄는","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"완전히 (com)"},{"text":"spic","type":"root","gloss":"보다 (spect)"},{"text":"uous","type":"suffix","gloss":"~한"}],"story":"완전히 다 보이는 → 눈에 확 띄는"},"example":{"q":"How did you improve the user experience?","a":"Users kept missing the error messages, so I made them more conspicuous, and support tickets dropped by about thirty percent.","a_ko":"사용자들이 오류 메시지를 계속 놓쳐서 더 눈에 띄게 바꿨더니, 문의 티켓이 약 30% 줄었습니다."},"collocations":["make it conspicuous","conspicuous by its absence"],"related":["suspicious","auspicious","spectator"],"tip":"visible 보다 강한 ‘확 눈에 띄는’. conspicuous by its absence(없어서 오히려 눈에 띄는)는 관용구"},{"id":"d01-A11","day":1,"level":3,"set":"A","family":"F1","word":"auspicious","pos":"adjective","ipa":"/ɔːˈspɪʃəs/","meaning_ko":"순조로운, 상서로운","category":"interview","etymology":{"parts":[{"text":"au","type":"root","gloss":"새 (avis)"},{"text":"spic","type":"root","gloss":"보다 (spect)"},{"text":"ious","type":"suffix","gloss":"~한"}],"story":"새가 나는 모습을 보고 점치다(auspex) → 좋은 징조의 → 순조로운"},"example":{"q":"Tell me about a mistake you made early in your career.","a":"My first week wasn't the most auspicious start: I broke the staging build, but I learned to run tests locally before every push.","a_ko":"첫 주는 순탄한 출발이 아니었습니다. 스테이징 빌드를 깨뜨렸지만, 덕분에 푸시 전에 항상 로컬 테스트를 돌리는 습관이 생겼습니다."},"collocations":["an auspicious start","an auspicious beginning"],"related":["conspicuous","suspicious","spectacular"],"tip":"not the most auspicious start 처럼 부정형으로 실수담을 가볍게 꺼낼 때 잘 어울림"},{"id":"d01-A12","day":1,"level":1,"set":"A","family":"F1","word":"special","pos":"adjective","ipa":"/ˈspeʃəl/","meaning_ko":"특별한","category":"interview","etymology":{"parts":[{"text":"spec","type":"root","gloss":"보다 → 모습·종류 (species)"},{"text":"ial","type":"suffix","gloss":"~의"}],"story":"보이는 모습(species) → 종류 → 특정 종류의 → 특별한"},"example":{"q":"Is there anything special about your background?","a":"What's special about my background is that I studied design before coding.","a_ko":"제 이력에서 특별한 점은 코딩 전에 디자인을 공부했다는 것입니다."},"collocations":["something special","special attention","nothing special"],"related":["specialize","especially","specific","spectrum"],"tip":"경험을 소개할 때 What's special about ~ is ... 구문이 유용"},{"id":"d01-A13","day":1,"level":1,"set":"A","family":"F1","word":"specialize","pos":"verb","ipa":"/ˈspeʃəlaɪz/","meaning_ko":"전문으로 하다","category":"interview","etymology":{"parts":[{"text":"spec","type":"root","gloss":"종류 (species)"},{"text":"ial","type":"suffix","gloss":"~의"},{"text":"ize","type":"suffix","gloss":"~하게 하다"}],"story":"특별한(special) 것으로 만들다 → 한 분야를 전문으로 하다"},"example":{"q":"What is your area of expertise?","a":"I specialize in backend development, especially payment systems.","a_ko":"백엔드 개발, 특히 결제 시스템을 전문으로 합니다."},"collocations":["specialize in","highly specialized"],"related":["special","especially","specific"],"tip":"specialize 뒤에는 in. 영국식 철자는 specialise"},{"id":"d01-A14","day":1,"level":1,"set":"A","family":"F1","word":"especially","pos":"adverb","ipa":"/ɪˈspeʃəli/","meaning_ko":"특히","category":"interview","etymology":{"parts":[{"text":"e","type":"part","gloss":"(고대 프랑스어에서 붙은 앞소리)"},{"text":"spec","type":"root","gloss":"종류 (species)"},{"text":"ial","type":"suffix","gloss":"~의"},{"text":"ly","type":"suffix","gloss":"~하게"}],"story":"라틴어 specialis → 고대 프랑스어 especial(특별한) → 특별히 → 특히"},"example":{"q":"What kind of work do you enjoy?","a":"I enjoy optimization work, especially when it makes the product feel faster.","a_ko":"최적화 작업을 좋아하는데, 특히 제품이 더 빠르게 느껴지게 만들 때 그렇습니다."},"collocations":["especially when","especially for","especially important"],"related":["special","specialize","specific"],"tip":"specially(특별히 ~용으로)와 구별 — ‘특히’는 especially"},{"id":"d01-A15","day":1,"level":1,"set":"A","family":"F1","word":"specific","pos":"adjective","ipa":"/spəˈsɪfɪk/","meaning_ko":"구체적인, 특정한","category":"interview","etymology":{"parts":[{"text":"spec","type":"root","gloss":"종류 (species)"},{"text":"ific","type":"suffix","gloss":"~로 만드는 (fic)"}],"story":"종류(species)를 정하는 → 특정한 → 구체적인"},"example":{"q":"Can you give me a specific example?","a":"Sure, let me give you a specific example from my last project.","a_ko":"네, 지난 프로젝트에서 있었던 구체적인 예를 말씀드리겠습니다."},"collocations":["a specific example","be more specific","specific to"],"related":["specify","special","especially"],"tip":"면접관이 Can you be more specific? 하면 숫자·사례로 답하라는 신호"},{"id":"d01-A16","day":1,"level":2,"set":"A","family":"F1","word":"specify","pos":"verb","ipa":"/ˈspesɪfaɪ/","meaning_ko":"명시하다, 지정하다","category":"it","etymology":{"parts":[{"text":"spec","type":"root","gloss":"종류 (species)"},{"text":"ify","type":"suffix","gloss":"~하게 하다 (fic)"}],"story":"종류를 정해 주다 → 하나하나 밝혀 적다 → 명시하다"},"example":{"q":"How do you handle unclear requirements?","a":"I ask the product owner to specify the expected behavior, then I write it down as acceptance criteria.","a_ko":"제품 오너에게 기대 동작을 명시해 달라고 요청하고, 그것을 인수 조건으로 정리합니다."},"collocations":["specify requirements","unless otherwise specified","specify a version"],"related":["specific","specification","special"],"tip":"명사 specification(스펙)은 Day 11 단어 — 동사부터 먼저 익히기"},{"id":"d01-A17","day":1,"level":2,"set":"A","family":"F1","word":"spectrum","pos":"noun","ipa":"/ˈspektrəm/","meaning_ko":"범위, 스펙트럼","category":"interview","etymology":{"parts":[{"text":"spec","type":"root","gloss":"보다"},{"text":"trum","type":"suffix","gloss":"~하는 것"}],"story":"눈에 보이는 것(모습) → 빛이 나뉘어 보이는 띠 → 양 끝 사이의 넓은 범위"},"example":{"q":"What kind of projects have you worked on?","a":"I've worked across a wide spectrum of projects, from mobile apps to data pipelines.","a_ko":"모바일 앱부터 데이터 파이프라인까지 폭넓은 범위의 프로젝트를 해 왔습니다."},"collocations":["a wide spectrum of","across the spectrum","on the other end of the spectrum"],"related":["spectator","spectacular","special"],"tip":"range 보다 ‘양 끝 사이의 모든 것’ 느낌. a wide spectrum of + 복수 명사"},{"id":"d01-A18","day":1,"level":2,"set":"A","family":"F1","word":"speculate","pos":"verb","ipa":"/ˈspekjəleɪt/","meaning_ko":"추측하다","category":"interview","etymology":{"parts":[{"text":"specul","type":"root","gloss":"망대에서 살피다 (specula ← spec)"},{"text":"ate","type":"suffix","gloss":"~하다"}],"story":"망대(specula)에서 살펴보다 → 이리저리 따져 보다 → (근거 없이) 추측하다"},"example":{"q":"Why do you think the project failed?","a":"I don't want to speculate too much, but I think the requirements kept changing without clear priorities.","a_ko":"너무 추측하고 싶지는 않지만, 명확한 우선순위 없이 요구 사항이 계속 바뀐 게 원인이었다고 생각합니다."},"collocations":["speculate about","I don't want to speculate","speculate on"],"related":["speculation","spectator","spectrum"],"tip":"단정하기 조심스러울 때 I don't want to speculate, but ~ 로 쿠션을 넣음"},{"id":"d01-A19","day":1,"level":2,"set":"A","family":"F1","word":"speculation","pos":"noun","ipa":"/ˌspekjəˈleɪʃən/","meaning_ko":"추측, 짐작","category":"it","etymology":{"parts":[{"text":"specul","type":"root","gloss":"망대에서 살피다 (specula ← spec)"},{"text":"ation","type":"suffix","gloss":"~함 (명사)"}],"story":"망대에서 살펴봄 → 이리저리 따져 봄 → 추측"},"example":{"q":"How do you handle a production incident?","a":"During incidents, I avoid speculation and stick to what the logs and metrics actually show.","a_ko":"장애 때는 추측을 피하고, 로그와 지표가 실제로 보여 주는 것에 집중합니다."},"collocations":["pure speculation","avoid speculation","based on speculation"],"related":["speculate","spectrum","perspective"],"tip":"장애 대응 답변에서 ‘추측 대신 데이터’라는 태도를 보여 줄 때"},{"id":"d01-A20","day":1,"level":1,"set":"A","family":"F1","word":"visual","pos":"adjective","ipa":"/ˈvɪʒuəl/","meaning_ko":"시각적인","category":"it","etymology":{"parts":[{"text":"vis","type":"root","gloss":"보다 (vid)"},{"text":"ual","type":"suffix","gloss":"~의"}],"story":"보는 것의 → 시각적인"},"example":{"q":"How do you explain technical ideas to non-engineers?","a":"I use visual diagrams so everyone can follow the idea quickly.","a_ko":"누구나 빨리 이해할 수 있게 시각적인 다이어그램을 씁니다."},"collocations":["visual design","visual regression test","visual aid"],"related":["visualize","visibility","vision","video"],"tip":"발음은 /ˈvɪʒuəl/ — ‘비주얼’보다 ‘비쥬얼’에 가까움"},{"id":"d01-A21","day":1,"level":1,"set":"A","family":"F1","word":"video","pos":"noun","ipa":"/ˈvɪdioʊ/","meaning_ko":"동영상, 비디오","category":"it","etymology":{"parts":[{"text":"vid","type":"root","gloss":"보다"},{"text":"eo","type":"suffix","gloss":"나는 ~한다 (라틴어 1인칭)"}],"story":"라틴어 video ‘나는 본다’ → 화면으로 보는 것 → 동영상"},"example":{"q":"What product did you work on before?","a":"I worked on a video streaming service with about two million users.","a_ko":"약 200만 명이 쓰는 동영상 스트리밍 서비스를 개발했습니다."},"collocations":["video streaming","video call","video encoding"],"related":["vision","visual","evident","provide"],"tip":"라틴어 동사 그대로 ‘나는 본다’ — audio(나는 듣는다)와 짝"},{"id":"d01-A22","day":1,"level":2,"set":"A","family":"F1","word":"visualize","pos":"verb","ipa":"/ˈvɪʒuəlaɪz/","meaning_ko":"시각화하다, 머릿속에 그리다","category":"it","etymology":{"parts":[{"text":"vis","type":"root","gloss":"보다 (vid)"},{"text":"ual","type":"suffix","gloss":"~의"},{"text":"ize","type":"suffix","gloss":"~하게 하다"}],"story":"시각적으로(visual) 만들다 → 데이터를 그림으로 보여 주다"},"example":{"q":"How do you monitor your services?","a":"I visualize key metrics on a dashboard, so the team can spot problems at a glance.","a_ko":"핵심 지표를 대시보드에 시각화해서 팀이 문제를 한눈에 알아챌 수 있게 합니다."},"collocations":["visualize data","visualize the flow","help visualize"],"related":["visual","vision","visibility"],"tip":"‘머릿속에 그려 보다’라는 뜻도 있음 (I can visualize the final product)"},{"id":"d01-A23","day":1,"level":2,"set":"A","family":"F1","word":"visibility","pos":"noun","ipa":"/ˌvɪzəˈbɪləti/","meaning_ko":"가시성, (상황이) 잘 보이는 정도","category":"it","etymology":{"parts":[{"text":"vis","type":"root","gloss":"보다 (vid)"},{"text":"ibil","type":"suffix","gloss":"~할 수 있는"},{"text":"ity","type":"suffix","gloss":"~성 (명사)"}],"story":"볼 수 있음 → 가시성 → 진행 상황·시스템 상태가 잘 보이게 함"},"example":{"q":"How do you keep stakeholders informed?","a":"I share a weekly status update, which gives managers better visibility into our progress and risks.","a_ko":"매주 진행 상황을 공유해서 관리자들이 진척과 리스크를 더 잘 볼 수 있게 합니다."},"collocations":["visibility into","give visibility","improve visibility"],"related":["visible","vision","visual","evident"],"tip":"‘~가 잘 보이게 함’은 visibility into ~. 모니터링·보고 이야기에 자주 씀"},{"id":"d01-A24","day":1,"level":1,"set":"A","family":"F1","word":"background","pos":"noun","ipa":"/ˈbækɡraʊnd/","meaning_ko":"배경, 경력","category":"interview","etymology":{"parts":[{"text":"back","type":"part","gloss":"뒤"},{"text":"ground","type":"part","gloss":"땅, 바탕"}],"story":"그림 뒤쪽의 바탕 → 사람 뒤에 깔린 경험 → 학력·경력"},"example":{"q":"Can you tell me about your background?","a":"I have a background in computer science and five years of web development.","a_ko":"컴퓨터공학을 전공했고 웹 개발 경력이 5년 있습니다."},"collocations":["a background in","educational background","background check"],"related":["foreground","groundwork","background job"],"tip":"자기소개 첫 문장 단골: I have a background in ~"},{"id":"d01-A25","day":1,"level":1,"set":"A","family":"F1","word":"full-stack","pos":"adjective","ipa":"/ˌfʊlˈstæk/","meaning_ko":"풀스택의 (프론트·백엔드를 모두 다루는)","category":"it","etymology":{"parts":[{"text":"full-","type":"part","gloss":"전부"},{"text":"stack","type":"part","gloss":"쌓은 더미 (기술 계층)"}],"story":"쌓아 올린 기술 계층 전부 → 화면부터 서버·DB까지 다 다루는"},"example":{"q":"What kind of developer are you?","a":"I'm a full-stack developer, but my real strength is the backend.","a_ko":"풀스택 개발자이지만, 진짜 강점은 백엔드입니다."},"collocations":["full-stack developer","full-stack experience","full-stack role"],"related":["tech stack","call stack","stack trace"],"tip":"명사 앞에서는 하이픈(full-stack developer). stack 은 고대 노르드어에서 온 게르만계 단어"},{"id":"d01-B01","day":1,"level":1,"set":"B","family":"F1","word":"view","pos":"noun","ipa":"/vjuː/","meaning_ko":"(DB) 뷰, 견해","category":"it","etymology":{"parts":[{"text":"view","type":"root","gloss":"보다 (vid)"}],"story":"라틴어 videre → 고대 프랑스어 veue ‘본 것’ → 시야·견해 → 데이터를 보는 창(뷰)"},"example":{"q":"How did you speed up the reporting queries?","a":"I created a database view so analysts could query clean data easily.","a_ko":"분석가들이 정리된 데이터를 쉽게 조회할 수 있도록 데이터베이스 뷰를 만들었습니다."},"collocations":["database view","in my view","point of view"],"related":["review","preview","interview","viewer"],"tip":"in my view 는 의견을 말할 때 I think 대신 쓸 수 있는 표현"},{"id":"d01-B02","day":1,"level":1,"set":"B","family":"F1","word":"viewer","pos":"noun","ipa":"/ˈvjuːər/","meaning_ko":"뷰어, 보는 사람","category":"it","etymology":{"parts":[{"text":"view","type":"root","gloss":"보다 (vid)"},{"text":"er","type":"suffix","gloss":"~하는 것·사람"}],"story":"보는 사람·도구 → 뷰어"},"example":{"q":"Did you build any internal tools?","a":"I built a log viewer so on-call engineers could find errors faster.","a_ko":"온콜 엔지니어들이 오류를 더 빨리 찾을 수 있게 로그 뷰어를 만들었습니다."},"collocations":["log viewer","PDF viewer","viewer count"],"related":["view","reviewer","interviewer"],"tip":"사람(시청자)과 도구(뷰어) 양쪽에 다 쓰임"},{"id":"d01-B03","day":1,"level":1,"set":"B","family":"F1","word":"review","pos":"noun","ipa":"/rɪˈvjuː/","meaning_ko":"검토, 리뷰","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"view","type":"root","gloss":"보다 (vid)"}],"story":"다시 보다(revoir) → 꼼꼼히 살펴보다 → 검토"},"example":{"q":"How does your team keep code quality high?","a":"Every pull request needs a code review from at least two engineers.","a_ko":"모든 풀 리퀘스트는 최소 두 명의 엔지니어에게 코드 리뷰를 받아야 합니다."},"collocations":["code review","performance review","under review"],"related":["view","preview","revise","revision"],"tip":"동사로도 씀: I review my teammates' code every day"},{"id":"d01-B04","day":1,"level":1,"set":"B","family":"F1","word":"reviewer","pos":"noun","ipa":"/rɪˈvjuːər/","meaning_ko":"검토자, 리뷰어","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"view","type":"root","gloss":"보다 (vid)"},{"text":"er","type":"suffix","gloss":"~하는 사람"}],"story":"다시 보는 사람 → 검토자"},"example":{"q":"What do you focus on when you review code?","a":"As a reviewer, I focus on readability first and performance second.","a_ko":"리뷰어로서 저는 가독성을 먼저, 성능을 그다음으로 봅니다."},"collocations":["code reviewer","assign a reviewer","second reviewer"],"related":["review","viewer","interviewer"],"tip":"리뷰 문화 질문에 대비해 ‘리뷰어로서의 기준’을 한 문장으로 준비해 두기"},{"id":"d01-B05","day":1,"level":1,"set":"B","family":"F1","word":"preview","pos":"noun","ipa":"/ˈpriːvjuː/","meaning_ko":"미리 보기","category":"it","etymology":{"parts":[{"text":"pre","type":"prefix","gloss":"미리"},{"text":"view","type":"root","gloss":"보다 (vid)"}],"story":"미리 보다 → 미리 보기"},"example":{"q":"How do designers check your work?","a":"Each pull request creates a preview environment, so designers can check changes early.","a_ko":"풀 리퀘스트마다 미리 보기 환경이 생겨서 디자이너가 변경 사항을 일찍 확인할 수 있습니다."},"collocations":["preview environment","preview release","sneak preview"],"related":["review","view","overview"],"tip":"Vercel·Netlify 의 preview deployment 를 말할 때 그대로 씀"},{"id":"d01-B06","day":1,"level":1,"set":"B","family":"F1","word":"overview","pos":"noun","ipa":"/ˈoʊvərvjuː/","meaning_ko":"개요","category":"interview","etymology":{"parts":[{"text":"over","type":"prefix","gloss":"위에서·전체를 (영어)"},{"text":"view","type":"root","gloss":"보다 (vid)"}],"story":"위에서 내려다보다 → 전체를 훑어봄 → 개요"},"example":{"q":"Can you walk me through your resume?","a":"Sure, let me give you a quick overview of my career first.","a_ko":"네, 먼저 제 경력을 간단히 개요로 말씀드리겠습니다."},"collocations":["a quick overview","give an overview","high-level overview"],"related":["view","review","survey","supervise"],"tip":"답변을 시작할 때 Let me give you a quick overview 로 열면 깔끔함"},{"id":"d01-B07","day":1,"level":1,"set":"B","family":"F1","word":"interview","pos":"noun","ipa":"/ˈɪntərvjuː/","meaning_ko":"면접, 인터뷰","category":"interview","etymology":{"parts":[{"text":"inter","type":"prefix","gloss":"서로·사이에 (entre)"},{"text":"view","type":"root","gloss":"보다 (vid)"}],"story":"서로 마주 보다(entrevoir) → 만나서 이야기함 → 면접"},"example":{"q":"Are you interviewing with other companies?","a":"Yes, I have two other interviews this week, but this role is my first choice.","a_ko":"네, 이번 주에 다른 면접이 두 개 있지만 이 자리가 제 1순위입니다."},"collocations":["job interview","technical interview","final interview"],"related":["view","review","interviewer"],"tip":"inter- 는 라틴어 ‘사이에’. 프랑스어 entrevue 를 거쳐 들어온 단어"},{"id":"d01-B08","day":1,"level":1,"set":"B","family":"F1","word":"interviewer","pos":"noun","ipa":"/ˈɪntərvjuːər/","meaning_ko":"면접관","category":"interview","etymology":{"parts":[{"text":"inter","type":"prefix","gloss":"서로·사이에 (entre)"},{"text":"view","type":"root","gloss":"보다 (vid)"},{"text":"er","type":"suffix","gloss":"~하는 사람"}],"story":"마주 보며 묻는 사람 → 면접관"},"example":{"q":"Have you ever been involved in hiring?","a":"Yes, I've been an interviewer for junior engineers for about a year.","a_ko":"네, 약 1년 동안 주니어 엔지니어 채용 면접관을 맡았습니다."},"collocations":["technical interviewer","as an interviewer"],"related":["interview","viewer","reviewer"],"tip":"면접 보는 사람은 interviewee — -er(하는 쪽)와 -ee(받는 쪽)를 구별"},{"id":"d01-B09","day":1,"level":2,"set":"B","family":"F1","word":"viewpoint","pos":"noun","ipa":"/ˈvjuːpɔɪnt/","meaning_ko":"관점","category":"interview","etymology":{"parts":[{"text":"view","type":"root","gloss":"보다 (vid)"},{"text":"point","type":"part","gloss":"점 (punctum)"}],"story":"보는 지점 → 관점"},"example":{"q":"How do you handle disagreements with product managers?","a":"I try to understand their viewpoint first, because they often know constraints I don't see.","a_ko":"먼저 그들의 관점을 이해하려고 합니다. 제가 보지 못하는 제약을 알고 있는 경우가 많기 때문입니다."},"collocations":["from a user's viewpoint","a different viewpoint","share my viewpoint"],"related":["view","perspective","overview"],"tip":"perspective 와 거의 같은 뜻. 한 답변 안에서 번갈아 쓰면 반복을 피할 수 있음"},{"id":"d01-B10","day":1,"level":2,"set":"B","family":"F1","word":"viewport","pos":"noun","ipa":"/ˈvjuːpɔːrt/","meaning_ko":"뷰포트 (화면에 보이는 영역)","category":"it","etymology":{"parts":[{"text":"view","type":"root","gloss":"보다 (vid)"},{"text":"port","type":"part","gloss":"문·창 (porta)"}],"story":"보는 창(배의 관측창) → 화면에서 실제로 보이는 영역"},"example":{"q":"How do you approach responsive design?","a":"I test every page at several viewport sizes, starting from the smallest mobile screen.","a_ko":"가장 작은 모바일 화면부터 시작해 여러 뷰포트 크기에서 모든 페이지를 테스트합니다."},"collocations":["viewport width","viewport meta tag","mobile viewport"],"related":["view","preview","viewer"],"tip":"여기서 port 는 ‘나르다(portare)’가 아니라 ‘문(porta)’ — portal 의 port 와 같음"},{"id":"d01-B11","day":1,"level":3,"set":"B","family":"F1","word":"purview","pos":"noun","ipa":"/ˈpɜːrvjuː/","meaning_ko":"권한 범위, 소관","category":"interview","etymology":{"parts":[{"text":"pur","type":"prefix","gloss":"앞으로 (pro)"},{"text":"view","type":"root","gloss":"보다 (vid)"}],"story":"앵글로프랑스어 purveu ‘규정된(provided)’ → 법 조항의 본문 → 그 법이 미치는 범위 → 권한·소관"},"example":{"q":"Tell me about a time you went beyond your responsibilities.","a":"Database tuning wasn't really within my purview, but I volunteered because slow queries were blocking my team's release.","a_ko":"DB 튜닝은 원래 제 소관이 아니었지만, 느린 쿼리가 팀 릴리스를 막고 있어서 자진해서 맡았습니다."},"collocations":["within my purview","outside the purview of","fall under the purview of"],"related":["provide","review","survey","provision"],"tip":"scope 보다 격식 있는 ‘권한·책임 범위’. within / outside my purview 로 씀"},{"id":"d01-B12","day":1,"level":1,"set":"B","family":"F1","word":"survey","pos":"noun","ipa":"/ˈsɜːrveɪ/","meaning_ko":"설문 조사","category":"interview","etymology":{"parts":[{"text":"sur","type":"prefix","gloss":"위에서 (super)"},{"text":"vey","type":"root","gloss":"보다 (vid)"}],"story":"위에서 내려다보다(supervidere) → 전체를 살펴보다 → (의견을) 조사하다"},"example":{"q":"How do you know your changes helped the team?","a":"I ran a short survey, and most developers said onboarding got easier.","a_ko":"짧은 설문 조사를 했더니 개발자 대부분이 온보딩이 쉬워졌다고 답했습니다."},"collocations":["run a survey","survey results","user survey"],"related":["supervise","overview","review","visa"],"tip":"명사는 SUR-vey, 동사는 sur-VEY 로 강세가 바뀜"},{"id":"d01-B13","day":1,"level":1,"set":"B","family":"F1","word":"vision","pos":"noun","ipa":"/ˈvɪʒən/","meaning_ko":"비전, 미래상","category":"interview","etymology":{"parts":[{"text":"vis","type":"root","gloss":"보다 (vid)"},{"text":"ion","type":"suffix","gloss":"~것 (명사)"}],"story":"보는 것 → 앞날을 그려 봄 → 비전"},"example":{"q":"Why do you want to join our company?","a":"I share your vision of making payments simple for small businesses.","a_ko":"소상공인을 위해 결제를 쉽게 만들겠다는 귀사의 비전에 공감합니다."},"collocations":["share the vision","company vision","long-term vision"],"related":["visionary","visual","revision","provision"],"tip":"지원 동기 답변의 단골: I share your vision of ~"},{"id":"d01-B14","day":1,"level":1,"set":"B","family":"F1","word":"visa","pos":"noun","ipa":"/ˈviːzə/","meaning_ko":"비자","category":"interview","etymology":{"parts":[{"text":"vis","type":"root","gloss":"보다 (vid)"},{"text":"a","type":"suffix","gloss":"~된 (라틴어 과거분사)"}],"story":"라틴어 charta visa ‘검토된(본) 문서’ → 입국 허가 확인 → 비자"},"example":{"q":"Do you need visa sponsorship?","a":"Yes, I would need a work visa to start in this role.","a_ko":"네, 이 직무를 시작하려면 취업 비자가 필요합니다."},"collocations":["work visa","visa sponsorship","visa status"],"related":["vision","revise","video"],"tip":"해외 취업 면접 필수 단어. 발음은 /ˈviːzə/ ‘비-저’에 가까움"},{"id":"d01-B15","day":1,"level":3,"set":"B","family":"F1","word":"visionary","pos":"adjective","ipa":"/ˈvɪʒəneri/","meaning_ko":"비전 있는, 선견지명이 있는","category":"interview","etymology":{"parts":[{"text":"vis","type":"root","gloss":"보다 (vid)"},{"text":"ion","type":"suffix","gloss":"~것"},{"text":"ary","type":"suffix","gloss":"~의, ~한"}],"story":"비전(vision)을 가진 → 앞을 멀리 내다보는"},"example":{"q":"What kind of leader do you want to work for?","a":"I'd like to work for a visionary leader who sets a clear direction but still trusts engineers to decide how to build things.","a_ko":"방향은 분명하게 제시하되, 어떻게 만들지는 엔지니어를 믿고 맡기는 비전 있는 리더와 일하고 싶습니다."},"collocations":["a visionary leader","a visionary idea","a true visionary"],"related":["vision","visual","provide"],"tip":"명사(비전 있는 사람)로도 씀: She's a real visionary"},{"id":"d01-B16","day":1,"level":1,"set":"B","family":"F1","word":"revise","pos":"verb","ipa":"/rɪˈvaɪz/","meaning_ko":"수정하다, 고치다","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"vise","type":"root","gloss":"보다 (vis)"}],"story":"다시 보다(revisere) → 다시 보고 고치다"},"example":{"q":"What did you do after the design review?","a":"I revised the API design based on feedback from the mobile team.","a_ko":"모바일 팀의 피드백을 바탕으로 API 설계를 수정했습니다."},"collocations":["revise a plan","revise the estimate","revised version"],"related":["revision","review","revisit","supervise"],"tip":"영국 영어에서는 ‘시험 공부하다’라는 뜻도 있음"},{"id":"d01-B17","day":1,"level":2,"set":"B","family":"F1","word":"revisit","pos":"verb","ipa":"/riːˈvɪzɪt/","meaning_ko":"다시 검토하다","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"vis","type":"root","gloss":"보다 (vid)"},{"text":"it","type":"suffix","gloss":"자주 ~하다 (반복)"}],"story":"다시 보러 가다(visitare ← visere) → 다시 들여다보다 → 재검토하다"},"example":{"q":"What would you change about that project?","a":"I would revisit our caching strategy, because it caused stale data issues later.","a_ko":"캐시 전략을 다시 검토하겠습니다. 나중에 오래된 데이터 문제를 일으켰기 때문입니다."},"collocations":["revisit the decision","revisit later","worth revisiting"],"related":["revise","visitor","review"],"tip":"회의에서 Let's revisit this next week(다음 주에 다시 보죠)로 자주 씀"},{"id":"d01-B18","day":1,"level":2,"set":"B","family":"F1","word":"revision","pos":"noun","ipa":"/rɪˈvɪʒən/","meaning_ko":"수정, 수정본","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"vis","type":"root","gloss":"보다 (vid)"},{"text":"ion","type":"suffix","gloss":"~것 (명사)"}],"story":"다시 봄 → 고침 → 수정본"},"example":{"q":"How do you manage changes to documents?","a":"We track every revision of our design documents in Git, so we can see why decisions changed.","a_ko":"설계 문서의 모든 수정 이력을 Git으로 관리해서 결정이 왜 바뀌었는지 볼 수 있습니다."},"collocations":["revision history","major revision","latest revision"],"related":["revise","vision","provision","review"],"tip":"버전 관리 도구에서는 커밋 하나를 revision 이라고 부르기도 함"},{"id":"d01-B19","day":1,"level":2,"set":"B","family":"F1","word":"scope","pos":"noun","ipa":"/skoʊp/","meaning_ko":"범위","category":"it","etymology":{"parts":[{"text":"scope","type":"root","gloss":"지켜보다·과녁 (그리스어 skopos)"}],"story":"그리스어 skopos ‘지켜보는 것, 과녁’ → 이탈리아어 scopo ‘목표’ → 다루는 범위"},"example":{"q":"How do you handle scope creep?","a":"When new requests come in mid-sprint, I check them against the agreed scope and move extras to the backlog.","a_ko":"스프린트 중에 새 요청이 들어오면 합의한 범위와 비교해 보고, 넘치는 건 백로그로 옮깁니다."},"collocations":["out of scope","scope creep","reduce the scope"],"related":["microscope","skeptical","telescope"],"tip":"out of scope(범위 밖)는 회의에서 정중하게 선을 긋는 표현"},{"id":"d01-B20","day":1,"level":1,"set":"B","family":"F1","word":"microscope","pos":"noun","ipa":"/ˈmaɪkrəskoʊp/","meaning_ko":"현미경","category":"interview","etymology":{"parts":[{"text":"micro","type":"prefix","gloss":"작은 (그리스어)"},{"text":"scope","type":"root","gloss":"보다 (skop)"}],"story":"작은 것을 보는 도구 → 현미경 → under the microscope 꼼꼼히 감시받는"},"example":{"q":"How did you handle that critical release?","a":"The release was under the microscope, so I double-checked every change.","a_ko":"그 릴리스는 모두가 주시하고 있어서, 모든 변경 사항을 두 번씩 확인했습니다."},"collocations":["under the microscope","put under a microscope"],"related":["scope","telescope","skeptical"],"tip":"면접에서는 관용구 under the microscope(면밀한 감시를 받는)로 활용"},{"id":"d01-B21","day":1,"level":2,"set":"B","family":"F1","word":"skeptical","pos":"adjective","ipa":"/ˈskeptɪkəl/","meaning_ko":"회의적인","category":"interview","etymology":{"parts":[{"text":"skept","type":"root","gloss":"살펴보다 (scop 과 같은 뿌리)"},{"text":"ical","type":"suffix","gloss":"~한"}],"story":"그리스어 skeptesthai ‘자세히 살피다’ → 쉽게 믿지 않고 따져 보는 → 회의적인"},"example":{"q":"How do you react to new technology trends?","a":"I'm a little skeptical of new frameworks at first, so I test them in a small project before adopting them.","a_ko":"새 프레임워크에는 처음엔 조금 회의적이라, 도입 전에 작은 프로젝트에서 먼저 시험해 봅니다."},"collocations":["skeptical of","remain skeptical","initially skeptical"],"related":["skepticism","scope","microscope"],"tip":"영국식 철자는 sceptical. skeptical of ~ 로 씀"},{"id":"d01-B22","day":1,"level":2,"set":"B","family":"F1","word":"skepticism","pos":"noun","ipa":"/ˈskeptɪsɪzəm/","meaning_ko":"회의적 태도, 의심","category":"interview","etymology":{"parts":[{"text":"skept","type":"root","gloss":"살펴보다 (scop 과 같은 뿌리)"},{"text":"ic","type":"suffix","gloss":"~의"},{"text":"ism","type":"suffix","gloss":"~하는 태도"}],"story":"자세히 따져 보는 태도 → 쉽게 믿지 않음 → 회의론"},"example":{"q":"How do you evaluate a vendor's claims?","a":"I approach big performance claims with healthy skepticism and run my own benchmarks first.","a_ko":"성능에 대한 큰소리는 건전한 의심을 갖고 보고, 먼저 직접 벤치마크를 돌려 봅니다."},"collocations":["healthy skepticism","with skepticism","initial skepticism"],"related":["skeptical","scope","microscope"],"tip":"healthy skepticism(건전한 의심)은 긍정적 뉘앙스 — 신중한 성격을 어필할 때"},{"id":"d01-B23","day":1,"level":2,"set":"B","family":"F1","word":"team player","pos":"noun","ipa":"/ˈtiːm ˌpleɪər/","meaning_ko":"팀워크가 좋은 사람","category":"interview","etymology":{"parts":[{"text":"team","type":"part","gloss":"무리·팀 (고대 영어)"},{"text":"player","type":"part","gloss":"경기하는 사람"}],"story":"한 팀으로 경기하는 사람 → 개인보다 팀을 위해 움직이는 사람"},"example":{"q":"How would your colleagues describe you?","a":"They would say I'm a team player who shares credit and helps others get unblocked.","a_ko":"동료들은 제가 공을 나누고, 다른 사람이 막힌 일을 풀도록 돕는 팀플레이어라고 말할 겁니다."},"collocations":["a true team player","be a team player"],"related":["teamwork","teammate","player"],"tip":"흔한 표현이라 반드시 구체적 행동(helps others ~)을 붙여서 말하기"},{"id":"d01-B24","day":1,"level":2,"set":"B","family":"F1","word":"self-starter","pos":"noun","ipa":"/ˌselfˈstɑːrtər/","meaning_ko":"스스로 일을 찾아 하는 사람","category":"interview","etymology":{"parts":[{"text":"self-","type":"part","gloss":"스스로"},{"text":"starter","type":"part","gloss":"시작하는 사람"}],"story":"스스로 시동을 거는 사람 → 시키지 않아도 일을 시작하는 사람"},"example":{"q":"How do you work without close supervision?","a":"I'm a self-starter, so when I joined my last team, I set up the test pipeline without being asked.","a_ko":"저는 알아서 일을 찾아 하는 편이라, 지난 팀에 합류했을 때 요청받지 않고 테스트 파이프라인을 구축했습니다."},"collocations":["a self-starter","a highly motivated self-starter"],"related":["start","startup","self-motivated"],"tip":"채용 공고에 자주 나오는 단어 — 실제 사례 하나와 함께 말하기"},{"id":"d01-B25","day":1,"level":2,"set":"B","family":"F1","word":"mindset","pos":"noun","ipa":"/ˈmaɪndset/","meaning_ko":"사고방식, 마음가짐","category":"interview","etymology":{"parts":[{"text":"mind","type":"part","gloss":"마음"},{"text":"set","type":"part","gloss":"놓인 상태"}],"story":"마음이 놓인(set) 방향 → 사고방식"},"example":{"q":"How do you deal with failure?","a":"I have a growth mindset, so I treat every failure as data for the next attempt.","a_ko":"저는 성장형 사고방식을 갖고 있어서, 모든 실패를 다음 시도를 위한 데이터로 봅니다."},"collocations":["growth mindset","customer-first mindset","shift my mindset"],"related":["mind","mindful","set"],"tip":"growth mindset(성장형 사고방식)은 강점 질문의 단골 표현"},{"id":"d01-C01","day":1,"level":1,"set":"C","family":"F1","word":"provide","pos":"verb","ipa":"/prəˈvaɪd/","meaning_ko":"제공하다","category":"interview","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞을"},{"text":"vide","type":"root","gloss":"보다 (vid)"}],"story":"앞을 내다보다(providere) → 미리 대비하다 → 필요한 것을 마련해 주다"},"example":{"q":"Why should we hire you?","a":"I can provide both strong backend skills and clear communication.","a_ko":"탄탄한 백엔드 역량과 명확한 소통 능력을 함께 제공할 수 있습니다."},"collocations":["provide support","provide feedback","provide A with B"],"related":["provider","provision","prudent","evident"],"tip":"provide A with B / provide B to A — 두 구문 다 익혀 두기"},{"id":"d01-C02","day":1,"level":1,"set":"C","family":"F1","word":"provider","pos":"noun","ipa":"/prəˈvaɪdər/","meaning_ko":"제공업체, 공급자","category":"it","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞을"},{"text":"vid","type":"root","gloss":"보다"},{"text":"er","type":"suffix","gloss":"~하는 쪽"}],"story":"미리 내다보고 마련해 주는 쪽 → 공급자"},"example":{"q":"Which cloud platforms have you used?","a":"I've used two cloud providers, AWS and GCP, in production.","a_ko":"운영 환경에서 AWS와 GCP 두 클라우드 제공업체를 써 봤습니다."},"collocations":["cloud provider","service provider","identity provider"],"related":["provide","provision","supervisor"],"tip":"SSO 이야기에서는 identity provider(IdP)로 자주 등장"},{"id":"d01-C03","day":1,"level":2,"set":"C","family":"F1","word":"provision","pos":"verb","ipa":"/prəˈvɪʒən/","meaning_ko":"(서버·자원을) 프로비저닝하다, 준비하다","category":"it","etymology":{"parts":[{"text":"pro","type":"prefix","gloss":"앞을"},{"text":"vis","type":"root","gloss":"보다 (vid)"},{"text":"ion","type":"suffix","gloss":"~것 (명사)"}],"story":"앞을 내다보고 마련함(provisio) → 필요한 자원을 미리 준비함 → 서버를 할당하다"},"example":{"q":"How do you manage your infrastructure?","a":"We provision all our servers with Terraform, so every environment is reproducible.","a_ko":"모든 서버를 Terraform으로 프로비저닝해서 어떤 환경이든 똑같이 재현할 수 있습니다."},"collocations":["provision servers","provision resources","auto-provisioning"],"related":["provide","provider","vision","revision"],"tip":"일반 영어에서는 명사(조항·공급)로 많이 쓰지만, 인프라 이야기에서는 동사로 씀"},{"id":"d01-C04","day":1,"level":2,"set":"C","family":"F1","word":"improvise","pos":"verb","ipa":"/ˈɪmprəvaɪz/","meaning_ko":"즉석에서 대처하다, 임기응변하다","category":"interview","etymology":{"parts":[{"text":"im","type":"prefix","gloss":"아니다 (in)"},{"text":"pro","type":"prefix","gloss":"미리"},{"text":"vise","type":"root","gloss":"보다 (vis)"}],"story":"미리 보지(준비하지) 못한(improvisus) → 준비 없이 즉석에서 해내다"},"example":{"q":"Tell me about a time things didn't go as planned.","a":"Our demo server crashed right before the client meeting, so I had to improvise with screenshots and a local build.","a_ko":"고객 미팅 직전에 데모 서버가 죽어서, 스크린샷과 로컬 빌드로 즉석에서 대처해야 했습니다."},"collocations":["have to improvise","improvise a solution"],"related":["provide","provision","revise"],"tip":"계획대로 안 됐던 경험(STAR)에서 순발력을 보여 줄 때"},{"id":"d01-C05","day":1,"level":1,"set":"C","family":"F1","word":"advise","pos":"verb","ipa":"/ədˈvaɪz/","meaning_ko":"조언하다, 권하다","category":"interview","etymology":{"parts":[{"text":"ad","type":"prefix","gloss":"~에 (ad)"},{"text":"vise","type":"root","gloss":"보다 (vis)"}],"story":"‘내가 보기에는’(ce m'est a vis) → 의견을 말하다 → 조언하다"},"example":{"q":"How do you mentor junior developers?","a":"I advise them to write small pull requests and ask questions early.","a_ko":"작은 단위로 풀 리퀘스트를 만들고 일찍 질문하라고 조언합니다."},"collocations":["advise someone to do","strongly advise","advise against"],"related":["advice","revise","supervise","vision"],"tip":"동사 advise 는 [z] 발음, 명사 advice 는 [s] 발음"},{"id":"d01-C06","day":1,"level":1,"set":"C","family":"F1","word":"advice","pos":"noun","ipa":"/ədˈvaɪs/","meaning_ko":"조언","category":"interview","etymology":{"parts":[{"text":"ad","type":"prefix","gloss":"~에 (ad)"},{"text":"vice","type":"root","gloss":"보다 (vis)"}],"story":"내가 보기에 ~하다 → 의견 → 조언"},"example":{"q":"What's the best career advice you've received?","a":"The best advice I got was to understand the business before writing code.","a_ko":"제가 받은 최고의 조언은 코드를 쓰기 전에 비즈니스를 이해하라는 것이었습니다."},"collocations":["give advice","ask for advice","a piece of advice"],"related":["advise","vision","provide"],"tip":"셀 수 없는 명사 — an advice ✗, a piece of advice ○"},{"id":"d01-C07","day":1,"level":1,"set":"C","family":"F1","word":"supervisor","pos":"noun","ipa":"/ˈsuːpərvaɪzər/","meaning_ko":"상사, 감독자","category":"interview","etymology":{"parts":[{"text":"super","type":"prefix","gloss":"위에서"},{"text":"vis","type":"root","gloss":"보다 (vid)"},{"text":"or","type":"suffix","gloss":"~하는 사람"}],"story":"위에서 내려다보는 사람 → 감독자 → 상사"},"example":{"q":"How would your supervisor describe you?","a":"My supervisor would describe me as reliable and calm under pressure.","a_ko":"상사는 저를 믿을 수 있고 압박 속에서도 침착한 사람이라고 말할 겁니다."},"collocations":["my direct supervisor","report to a supervisor"],"related":["supervise","hypervisor","survey","overview"],"tip":"‘직속 상사’는 direct supervisor 또는 manager"},{"id":"d01-C08","day":1,"level":2,"set":"C","family":"F1","word":"supervise","pos":"verb","ipa":"/ˈsuːpərvaɪz/","meaning_ko":"감독하다, 지도하다","category":"it","etymology":{"parts":[{"text":"super","type":"prefix","gloss":"위에서"},{"text":"vise","type":"root","gloss":"보다 (vis)"}],"story":"위에서 내려다보다(supervidere) → 감독하다 → (머신러닝) 정답을 주며 가르치다"},"example":{"q":"Have you worked on any machine learning projects?","a":"Yes, I built a supervised model that classifies support tickets, using two years of labeled data.","a_ko":"네, 2년 치 라벨 데이터로 고객 문의 티켓을 분류하는 지도 학습 모델을 만들었습니다."},"collocations":["supervised learning","supervise a team","closely supervise"],"related":["supervisor","hypervisor","survey","revise"],"tip":"머신러닝의 supervised / unsupervised learning(지도·비지도 학습)에서 자주 만남"},{"id":"d01-C09","day":1,"level":2,"set":"C","family":"F1","word":"hypervisor","pos":"noun","ipa":"/ˈhaɪpərvaɪzər/","meaning_ko":"하이퍼바이저 (가상 머신을 관리하는 소프트웨어)","category":"it","etymology":{"parts":[{"text":"hyper","type":"prefix","gloss":"그 위에 (그리스어)"},{"text":"vis","type":"root","gloss":"보다 (vid)"},{"text":"or","type":"suffix","gloss":"~하는 것"}],"story":"supervisor(옛날에 운영체제를 부르던 말)보다 한 단계 위(hyper)에서 지켜보는 것 → 여러 OS를 관리하는 소프트웨어"},"example":{"q":"Do you have experience with virtualization?","a":"I managed VMware clusters for two years, so I'm comfortable troubleshooting hypervisor-level issues like memory overcommit.","a_ko":"2년간 VMware 클러스터를 운영해서, 메모리 오버커밋 같은 하이퍼바이저 수준의 문제 해결에 익숙합니다."},"collocations":["type 1 hypervisor","hypervisor layer"],"related":["supervisor","supervise","vision"],"tip":"super(위) 보다 더 위라는 뜻으로 그리스어 hyper 를 붙여 만든 단어"},{"id":"d01-C10","day":1,"level":1,"set":"C","family":"F1","word":"visitor","pos":"noun","ipa":"/ˈvɪzɪtər/","meaning_ko":"방문자","category":"it","etymology":{"parts":[{"text":"vis","type":"root","gloss":"보다 (vid)"},{"text":"it","type":"suffix","gloss":"자주 ~하다 (반복)"},{"text":"or","type":"suffix","gloss":"~하는 사람"}],"story":"보러 가다(visitare) → 찾아오는 사람 → 사이트 방문자"},"example":{"q":"How big was the service you worked on?","a":"Our website had about one million monthly visitors.","a_ko":"저희 웹사이트는 월 방문자가 약 100만 명이었습니다."},"collocations":["monthly visitors","unique visitors","first-time visitor"],"related":["revisit","vision","review"],"tip":"서비스 규모를 말할 때 숫자와 함께: monthly visitors / active users"},{"id":"d01-C11","day":1,"level":1,"set":"C","family":"F1","word":"science","pos":"noun","ipa":"/ˈsaɪəns/","meaning_ko":"과학, 학문","category":"interview","etymology":{"parts":[{"text":"sci","type":"root","gloss":"알다"},{"text":"ence","type":"suffix","gloss":"~함 (명사)"}],"story":"아는 것(scientia) → 지식 → 체계적인 학문 → 과학"},"example":{"q":"What did you study in college?","a":"I studied computer science, and I focused on databases.","a_ko":"컴퓨터공학을 전공했고, 데이터베이스를 중점적으로 공부했습니다."},"collocations":["computer science","data science","rocket science"],"related":["scientist","conscience","conscientious","conscious"],"tip":"It's not rocket science(그렇게 어렵지 않다)도 회화에서 자주 씀"},{"id":"d01-C12","day":1,"level":1,"set":"C","family":"F1","word":"scientist","pos":"noun","ipa":"/ˈsaɪəntɪst/","meaning_ko":"과학자, (데이터) 사이언티스트","category":"it","etymology":{"parts":[{"text":"sci","type":"root","gloss":"알다"},{"text":"ent","type":"suffix","gloss":"~하는"},{"text":"ist","type":"suffix","gloss":"~하는 사람"}],"story":"아는(학문하는) 사람 → 과학자"},"example":{"q":"Who did you work with most closely?","a":"I worked closely with data scientists to put their models into production.","a_ko":"데이터 사이언티스트들과 긴밀히 협업해 그들의 모델을 운영 환경에 올렸습니다."},"collocations":["data scientist","research scientist"],"related":["science","conscience","conscientious"],"tip":"1834년에 science + -ist 로 새로 만든 단어"},{"id":"d01-C13","day":1,"level":2,"set":"C","family":"F1","word":"conscience","pos":"noun","ipa":"/ˈkɑːnʃəns/","meaning_ko":"양심","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께·속속들이 (com)"},{"text":"sci","type":"root","gloss":"알다"},{"text":"ence","type":"suffix","gloss":"~함 (명사)"}],"story":"속으로 함께 아는 것(conscientia) → 옳고 그름을 스스로 아는 마음 → 양심"},"example":{"q":"Have you ever pushed back on a deadline?","a":"I couldn't in good conscience ship code with a known security bug, so I asked for two more days.","a_ko":"알려진 보안 버그가 있는 코드를 양심상 배포할 수 없어서, 이틀만 더 달라고 요청했습니다."},"collocations":["in good conscience","a clear conscience"],"related":["conscientious","science","conscious"],"tip":"in good conscience(양심상)는 부정문으로 ‘차마 ~할 수 없다’에 많이 씀"},{"id":"d01-C14","day":1,"level":3,"set":"C","family":"F1","word":"conscientious","pos":"adjective","ipa":"/ˌkɑːnʃiˈenʃəs/","meaning_ko":"성실한, 꼼꼼한","category":"interview","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께·속속들이 (com)"},{"text":"sci","type":"root","gloss":"알다"},{"text":"ent","type":"suffix","gloss":"~하는"},{"text":"ious","type":"suffix","gloss":"~한 성질의"}],"story":"양심(conscience)을 따르는 → 맡은 일을 양심적으로 하는 → 성실하고 꼼꼼한"},"example":{"q":"What are your greatest strengths?","a":"I'm conscientious about documentation: after every incident I wrote a clear postmortem, and new hires told me it helped them a lot.","a_ko":"문서화에 꼼꼼한 편입니다. 장애가 날 때마다 명확한 포스트모템을 썼고, 신입들이 큰 도움이 됐다고 말해 주었습니다."},"collocations":["conscientious about","a conscientious worker"],"related":["conscience","science","conscious"],"tip":"발음 주의 /ˌkɑːnʃiˈenʃəs/. 성격 질문에서 hard-working 보다 세련된 표현"},{"id":"d01-C15","day":1,"level":1,"set":"C","family":"F1","word":"sentence","pos":"noun","ipa":"/ˈsentəns/","meaning_ko":"문장","category":"interview","etymology":{"parts":[{"text":"sent","type":"root","gloss":"느끼다"},{"text":"ence","type":"suffix","gloss":"~함 (명사)"}],"story":"느낀 것(sententia) → 의견 → 판결 → 한 생각을 담은 문장"},"example":{"q":"Can you describe yourself in one sentence?","a":"In one sentence, I'm an engineer who loves turning messy problems into simple tools.","a_ko":"한 문장으로 말하면, 복잡한 문제를 단순한 도구로 바꾸는 걸 좋아하는 엔지니어입니다."},"collocations":["in one sentence","a single sentence"],"related":["consent","sensor","sensitive","sentiment"],"tip":"‘한마디로’ 정리를 요구받으면 In one sentence, ~ 로 시작"},{"id":"d01-C16","day":1,"level":1,"set":"C","family":"F1","word":"sensor","pos":"noun","ipa":"/ˈsensər/","meaning_ko":"센서, 감지기","category":"it","etymology":{"parts":[{"text":"sens","type":"root","gloss":"느끼다"},{"text":"or","type":"suffix","gloss":"~하는 것"}],"story":"느끼는(감지하는) 장치 → 센서"},"example":{"q":"What kind of data have you worked with?","a":"I built a pipeline that collects sensor data from factory machines.","a_ko":"공장 설비의 센서 데이터를 수집하는 파이프라인을 만들었습니다."},"collocations":["sensor data","temperature sensor","IoT sensor"],"related":["sensitive","sensible","sense"],"tip":"IoT·임베디드 경험을 말할 때 기본 단어"},{"id":"d01-C17","day":1,"level":1,"set":"C","family":"F1","word":"sensitive","pos":"adjective","ipa":"/ˈsensətɪv/","meaning_ko":"민감한, (정보가) 기밀인","category":"it","etymology":{"parts":[{"text":"sens","type":"root","gloss":"느끼다"},{"text":"itive","type":"suffix","gloss":"~하는 성질의"}],"story":"잘 느끼는 → 민감한 → 다루기 조심스러운 (민감 정보)"},"example":{"q":"How do you handle personal data?","a":"We encrypt all sensitive data and never write it to the logs.","a_ko":"모든 민감한 데이터는 암호화하고 로그에는 절대 남기지 않습니다."},"collocations":["sensitive data","case-sensitive","time-sensitive"],"related":["sensitivity","sensor","sensible","sense"],"tip":"sensible(분별 있는)과 혼동 주의 — sensitive 는 ‘민감한’"},{"id":"d01-C18","day":1,"level":2,"set":"C","family":"F1","word":"sensitivity","pos":"noun","ipa":"/ˌsensəˈtɪvəti/","meaning_ko":"세심함, 민감도","category":"interview","etymology":{"parts":[{"text":"sens","type":"root","gloss":"느끼다"},{"text":"itiv","type":"suffix","gloss":"~하는 성질의"},{"text":"ity","type":"suffix","gloss":"~성 (명사)"}],"story":"잘 느끼는 성질 → 남의 감정·상황을 헤아리는 세심함"},"example":{"q":"How do you give critical feedback?","a":"I give feedback privately and with sensitivity, because people accept criticism better when they don't feel embarrassed.","a_ko":"피드백은 따로, 세심하게 전달합니다. 사람들은 창피함을 느끼지 않을 때 비판을 더 잘 받아들이기 때문입니다."},"collocations":["with sensitivity","cultural sensitivity","price sensitivity"],"related":["sensitive","sensor","sensible"],"tip":"IT 에서는 ‘민감도’(모델의 sensitivity 등)라는 뜻으로도 쓰임"},{"id":"d01-C19","day":1,"level":2,"set":"C","family":"F1","word":"sensible","pos":"adjective","ipa":"/ˈsensəbəl/","meaning_ko":"합리적인, 분별 있는","category":"interview","etymology":{"parts":[{"text":"sens","type":"root","gloss":"느끼다"},{"text":"ible","type":"suffix","gloss":"~할 수 있는"}],"story":"느낄 수 있는(sensibilis) → 감각·판단력이 있는 → 분별 있는, 합리적인"},"example":{"q":"How do you choose default settings for a new tool?","a":"I pick sensible defaults so most users never need to touch the configuration.","a_ko":"대부분의 사용자가 설정을 건드릴 필요가 없도록 합리적인 기본값을 정합니다."},"collocations":["sensible defaults","a sensible approach","make sensible decisions"],"related":["sensitive","sensor","sense"],"tip":"sensitive(민감한)와 헷갈리기 쉬움. sensible defaults 는 개발자가 자주 쓰는 표현"},{"id":"d01-C20","day":1,"level":2,"set":"C","family":"F1","word":"consent","pos":"noun","ipa":"/kənˈsent/","meaning_ko":"동의","category":"it","etymology":{"parts":[{"text":"con","type":"prefix","gloss":"함께"},{"text":"sent","type":"root","gloss":"느끼다"}],"story":"함께 느끼다(consentire) → 같은 생각이다 → 동의"},"example":{"q":"How did you handle privacy rules like GDPR?","a":"We added a consent screen and stopped collecting analytics data until users clearly agreed.","a_ko":"동의 화면을 추가하고, 사용자가 분명히 동의하기 전까지는 분석 데이터 수집을 멈췄습니다."},"collocations":["user consent","give consent","without consent"],"related":["consensus","dissent","resent","sentence"],"tip":"consensus(합의)와 혼동 주의 — consent 는 개인의 ‘허락·동의’"},{"id":"d01-C21","day":1,"level":2,"set":"C","family":"F1","word":"resent","pos":"verb","ipa":"/rɪˈzent/","meaning_ko":"억울해하다, 언짢게 여기다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"강하게 (다시)"},{"text":"sent","type":"root","gloss":"느끼다"}],"story":"강하게 다시 느끼다(ressentir) → 부당함을 곱씹다 → 억울해하다"},"example":{"q":"How did you feel when you were assigned the legacy system?","a":"I didn't resent getting the legacy system; I saw it as a chance to learn how the business really worked.","a_ko":"레거시 시스템을 맡은 걸 억울해하지 않았습니다. 비즈니스가 실제로 어떻게 돌아가는지 배울 기회로 봤습니다."},"collocations":["resent being ~","deeply resent"],"related":["consent","dissent","sentence"],"tip":"발음은 /rɪˈzent/ (s 가 z 소리). re-sent(다시 보냈다)와 구별"},{"id":"d01-C22","day":1,"level":3,"set":"C","family":"F1","word":"dissent","pos":"noun","ipa":"/dɪˈsent/","meaning_ko":"반대 의견","category":"interview","etymology":{"parts":[{"text":"dis","type":"prefix","gloss":"따로·떨어져"},{"text":"sent","type":"root","gloss":"느끼다"}],"story":"따로 느끼다(dissentire) → 생각이 다르다 → 반대 의견"},"example":{"q":"How do you handle disagreement in a team decision?","a":"I express my dissent early and back it with data, but once the team decides, I fully commit to the plan.","a_ko":"반대 의견은 데이터와 함께 일찍 말하지만, 팀이 결정하면 그 계획에 전적으로 따릅니다."},"collocations":["express dissent","voice dissent","without dissent"],"related":["consent","resent","consensus"],"tip":"‘Disagree and commit’ 문화를 설명할 때 어울리는 격식 있는 단어"},{"id":"d01-C23","day":1,"level":3,"set":"C","family":"F1","word":"sentient","pos":"adjective","ipa":"/ˈsenʃənt/","meaning_ko":"지각(의식)이 있는","category":"it","etymology":{"parts":[{"text":"sent","type":"root","gloss":"느끼다"},{"text":"ient","type":"suffix","gloss":"~하고 있는"}],"story":"느끼고 있는(sentientem) → 감각·의식이 있는"},"example":{"q":"What's your view on the limits of AI?","a":"I don't think today's AI models are sentient, but they're powerful tools, so I always keep a human in the loop for critical decisions.","a_ko":"지금의 AI 모델이 의식이 있다고는 생각하지 않지만 강력한 도구이기 때문에, 중요한 결정에는 항상 사람이 검토하게 합니다."},"collocations":["sentient AI","sentient being"],"related":["sentence","sensor","sensitive"],"tip":"AI 윤리 질문에서 나올 수 있는 단어. 발음 /ˈsenʃənt/"},{"id":"d01-C24","day":1,"level":1,"set":"C","family":"F1","word":"outgoing","pos":"adjective","ipa":"/ˈaʊtˌɡoʊɪŋ/","meaning_ko":"외향적인, 사교적인","category":"interview","etymology":{"parts":[{"text":"out","type":"part","gloss":"밖으로"},{"text":"going","type":"part","gloss":"가는"}],"story":"밖으로 나가는 → 사람에게 먼저 다가가는 → 외향적인"},"example":{"q":"How would you describe your personality?","a":"I'm outgoing, so I enjoy meeting new teammates and people from other teams.","a_ko":"외향적인 편이라 새 팀원이나 다른 팀 사람들을 만나는 걸 좋아합니다."},"collocations":["an outgoing personality","friendly and outgoing"],"related":["ongoing","outcome","going"],"tip":"outgoing mail(발신 메일)처럼 ‘밖으로 나가는’ 뜻도 있음"},{"id":"d01-C25","day":1,"level":2,"set":"C","family":"F1","word":"hands-on","pos":"adjective","ipa":"/ˌhændzˈɑːn/","meaning_ko":"직접 해 보는, 실무의","category":"interview","etymology":{"parts":[{"text":"hands-","type":"part","gloss":"손"},{"text":"on","type":"part","gloss":"~에 대고"}],"story":"손을 직접 대는 → 직접 해 보는 → 실무 경험의"},"example":{"q":"Do you have experience with Kubernetes?","a":"Yes, I have two years of hands-on experience running Kubernetes clusters in production.","a_ko":"네, 운영 환경에서 쿠버네티스 클러스터를 직접 운영한 실무 경험이 2년 있습니다."},"collocations":["hands-on experience","a hands-on approach","a hands-on manager"],"related":["hands-off","handy","hand"],"tip":"반대말은 hands-off(간섭하지 않는). ‘실무 경험’은 hands-on experience"},{"id":"d01-D01","day":1,"level":1,"set":"D","family":"F1","word":"evidence","pos":"noun","ipa":"/ˈevɪdəns/","meaning_ko":"근거, 증거","category":"interview","etymology":{"parts":[{"text":"e","type":"prefix","gloss":"밖으로 (ex)"},{"text":"vid","type":"root","gloss":"보다"},{"text":"ence","type":"suffix","gloss":"~함 (명사)"}],"story":"밖으로 드러나 보이는 것(evidentia) → 분명한 근거 → 증거"},"example":{"q":"How do you convince your team to change something?","a":"I bring evidence, like metrics or user feedback, instead of just opinions.","a_ko":"그냥 의견이 아니라 지표나 사용자 피드백 같은 근거를 가져갑니다."},"collocations":["clear evidence","evidence-based","provide evidence"],"related":["evident","provide","video","vision"],"tip":"셀 수 없는 명사 — a piece of evidence"},{"id":"d01-D02","day":1,"level":2,"set":"D","family":"F1","word":"evident","pos":"adjective","ipa":"/ˈevɪdənt/","meaning_ko":"분명한, 명백한","category":"interview","etymology":{"parts":[{"text":"e","type":"prefix","gloss":"밖으로 (ex)"},{"text":"vid","type":"root","gloss":"보다"},{"text":"ent","type":"suffix","gloss":"~한"}],"story":"밖으로 드러나 보이는 → 명백한"},"example":{"q":"How did you know the redesign worked?","a":"It became evident within a week, because support tickets about checkout dropped by half.","a_ko":"일주일 만에 분명해졌습니다. 결제 관련 문의 티켓이 절반으로 줄었기 때문입니다."},"collocations":["it became evident that","self-evident","evident in"],"related":["evidence","visible","provide","vision"],"tip":"clear 보다 격식 있는 ‘명백한’. It became evident that ~ 으로 결과를 말할 때"},{"id":"d01-D03","day":1,"level":3,"set":"D","family":"F1","word":"prudent","pos":"adjective","ipa":"/ˈpruːdənt/","meaning_ko":"신중한, 현명한","category":"interview","etymology":{"parts":[{"text":"prud","type":"root","gloss":"앞을 내다보다 (pro + vid 가 줄어든 꼴)"},{"text":"ent","type":"suffix","gloss":"~한"}],"story":"앞을 내다보는(providentem → prudentem) → 미리 대비하는 → 신중한"},"example":{"q":"How did you decide on the migration plan?","a":"Instead of a big-bang migration, I thought it was more prudent to move one service at a time and keep a rollback plan ready.","a_ko":"한 번에 전부 옮기기보다는, 서비스를 하나씩 옮기고 롤백 계획을 준비해 두는 게 더 신중하다고 판단했습니다."},"collocations":["it would be prudent to","a prudent approach","financially prudent"],"related":["provide","provision","evident","purview"],"tip":"careful 보다 ‘앞을 내다보고 현명하게’라는 뉘앙스. 시니어다운 판단을 말할 때"},{"id":"d01-D04","day":1,"level":1,"set":"D","family":"F1","word":"notice","pos":"verb","ipa":"/ˈnoʊtɪs/","meaning_ko":"알아차리다, 눈치채다","category":"interview","etymology":{"parts":[{"text":"not","type":"root","gloss":"알다 (gno → no)"},{"text":"ice","type":"suffix","gloss":"~함 (명사)"}],"story":"알려진 것(notitia) → 알게 됨 → 알아차리다"},"example":{"q":"How did you find the problem?","a":"I noticed that the error rate went up right after each deployment.","a_ko":"배포 직후마다 오류율이 올라가는 걸 알아차렸습니다."},"collocations":["notice that","notice period","at short notice"],"related":["noticeable","notify","notion","recognize"],"tip":"명사 notice period(퇴사 통보 기간)도 면접 필수: My notice period is one month"},{"id":"d01-D05","day":1,"level":1,"set":"D","family":"F1","word":"noticeable","pos":"adjective","ipa":"/ˈnoʊtɪsəbəl/","meaning_ko":"눈에 띄는, 뚜렷한","category":"it","etymology":{"parts":[{"text":"not","type":"root","gloss":"알다 (gno → no)"},{"text":"ice","type":"suffix","gloss":"~함 (명사)"},{"text":"able","type":"suffix","gloss":"~할 수 있는"}],"story":"알아차릴 수 있는 → 눈에 띄는"},"example":{"q":"Did the optimization make a difference?","a":"Yes, users saw a noticeable drop in page load time.","a_ko":"네, 사용자들이 페이지 로딩 시간이 눈에 띄게 줄어든 걸 체감했습니다."},"collocations":["a noticeable improvement","noticeable latency","barely noticeable"],"related":["notice","notify","notion"],"tip":"숫자가 없을 때도 a noticeable improvement 로 체감 성과를 표현할 수 있음"},{"id":"d01-D06","day":1,"level":1,"set":"D","family":"F1","word":"notify","pos":"verb","ipa":"/ˈnoʊtɪfaɪ/","meaning_ko":"알리다, 통지하다","category":"it","etymology":{"parts":[{"text":"not","type":"root","gloss":"알다 (gno → no)"},{"text":"ify","type":"suffix","gloss":"~하게 하다 (fic)"}],"story":"알게(notus) 만들다(facere) → 알리다"},"example":{"q":"What happens when a service goes down?","a":"Our monitoring system automatically notifies the on-call engineer.","a_ko":"모니터링 시스템이 자동으로 온콜 엔지니어에게 알립니다."},"collocations":["notify someone of","notify the team","get notified"],"related":["notification","notice","notion"],"tip":"notify A of B (A에게 B를 알리다) 형태로 씀"},{"id":"d01-D07","day":1,"level":1,"set":"D","family":"F1","word":"notification","pos":"noun","ipa":"/ˌnoʊtɪfɪˈkeɪʃən/","meaning_ko":"알림","category":"it","etymology":{"parts":[{"text":"not","type":"root","gloss":"알다 (gno → no)"},{"text":"ific","type":"suffix","gloss":"~하게 함 (fic)"},{"text":"ation","type":"suffix","gloss":"~함 (명사)"}],"story":"알게 만듦 → 알림"},"example":{"q":"What feature are you most proud of?","a":"I built the push notification system for our mobile app.","a_ko":"모바일 앱의 푸시 알림 시스템을 만들었습니다."},"collocations":["push notification","notification settings","email notification"],"related":["notify","notice","noticeable"],"tip":"앱 개발 경험을 말할 때 push notification 은 그대로 통하는 용어"},{"id":"d01-D08","day":1,"level":2,"set":"D","family":"F1","word":"notion","pos":"noun","ipa":"/ˈnoʊʃən/","meaning_ko":"생각, 개념","category":"interview","etymology":{"parts":[{"text":"not","type":"root","gloss":"알다 (gno → no)"},{"text":"ion","type":"suffix","gloss":"~것 (명사)"}],"story":"알게 됨(notio) → 머릿속에 든 개념 → 생각"},"example":{"q":"What did you learn from your first job?","a":"I gave up the notion that good code is enough; communication matters just as much.","a_ko":"좋은 코드만 있으면 된다는 생각을 버렸습니다. 소통도 그만큼 중요합니다."},"collocations":["the notion that","a vague notion","challenge the notion"],"related":["notice","notify","cognition"],"tip":"the notion that ~ (~라는 생각)으로 생각의 변화를 말할 때 유용"},{"id":"d01-D09","day":1,"level":3,"set":"D","family":"F1","word":"notorious","pos":"adjective","ipa":"/noʊˈtɔːriəs/","meaning_ko":"악명 높은","category":"it","etymology":{"parts":[{"text":"not","type":"root","gloss":"알다 (gno → no)"},{"text":"orious","type":"suffix","gloss":"~한 (형용사)"}],"story":"널리 알려진(notorius) → 나쁜 쪽으로 유명한 → 악명 높은"},"example":{"q":"What's the hardest bug you've fixed?","a":"Race conditions are notoriously hard to reproduce, so I added detailed logging and finally caught one that appeared only once a week.","a_ko":"경쟁 상태는 재현하기 어렵기로 악명 높아서, 상세 로그를 추가해 일주일에 한 번만 나타나던 버그를 마침내 잡았습니다."},"collocations":["notoriously difficult","notorious for"],"related":["notice","notion","notify","recognize"],"tip":"IT 에서는 notoriously hard / flaky 처럼 부사형으로 자주 씀"},{"id":"d01-D10","day":1,"level":1,"set":"D","family":"F1","word":"recognize","pos":"verb","ipa":"/ˈrekəɡnaɪz/","meaning_ko":"알아보다, 인정하다","category":"interview","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"cogn","type":"root","gloss":"알다 (gno)"},{"text":"ize","type":"suffix","gloss":"~하다"}],"story":"다시 알아보다(recognoscere) → 알아보다 → (사실·가치를) 인정하다"},"example":{"q":"What's one weakness you're working on?","a":"I recognize that I sometimes take on too much work myself.","a_ko":"제가 가끔 일을 너무 많이 혼자 떠안는다는 걸 알고 있습니다."},"collocations":["recognize a problem","be recognized for","widely recognized"],"related":["recognition","cognitive","cognizant","diagnose"],"tip":"약점 질문에서 I recognize that ~ 으로 시작하면 자기 인식이 있다는 인상을 줌"},{"id":"d01-D11","day":1,"level":1,"set":"D","family":"F1","word":"recognition","pos":"noun","ipa":"/ˌrekəɡˈnɪʃən/","meaning_ko":"인식, 인정","category":"it","etymology":{"parts":[{"text":"re","type":"prefix","gloss":"다시"},{"text":"cogn","type":"root","gloss":"알다 (gno)"},{"text":"ition","type":"suffix","gloss":"~함 (명사)"}],"story":"다시 알아봄 → 알아봄(인식) → 인정"},"example":{"q":"What AI projects have you worked on?","a":"I worked on an image recognition feature for scanning receipts.","a_ko":"영수증을 스캔하는 이미지 인식 기능을 개발했습니다."},"collocations":["image recognition","speech recognition","gain recognition"],"related":["recognize","cognitive","cognition","incognito"],"tip":"‘공로를 인정받다’는 receive recognition — 성과 질문에도 쓸 수 있음"},{"id":"d01-D12","day":1,"level":2,"set":"D","family":"F1","word":"cognitive","pos":"adjective","ipa":"/ˈkɑːɡnətɪv/","meaning_ko":"인지의, 인지적인","category":"it","etymology":{"parts":[{"text":"cogn","type":"root","gloss":"알다 (gno)"},{"text":"itive","type":"suffix","gloss":"~하는 성질의"}],"story":"알아 가는(cognit-) → 인지의"},"example":{"q":"Why did you refactor that module?","a":"The module was hard to read, so I split it up to reduce the cognitive load for new developers.","a_ko":"그 모듈은 읽기가 어려워서, 새 개발자의 인지 부담을 줄이려고 나눴습니다."},"collocations":["cognitive load","cognitive bias","cognitive science"],"related":["cognition","recognize","cognizant"],"tip":"cognitive load(인지 부하)는 코드 가독성·UX 를 설명할 때 강력한 단어"},{"id":"d01-D13","day":1,"level":2,"set":"D","family":"F1","word":"cognition","pos":"noun","ipa":"/kɑːɡˈnɪʃən/","meaning_ko":"인지","category":"interview","etymology":{"parts":[{"text":"cogn","type":"root","gloss":"알다 (gno)"},{"text":"ition","type":"suffix","gloss":"~함 (명사)"}],"story":"알아 감(cognitio) → 인지"},"example":{"q":"Why did you move from psychology into software?","a":"I studied human cognition, and I realized I could apply it to designing software that people find intuitive.","a_ko":"인간의 인지를 공부하면서, 그것을 사람들이 직관적으로 느끼는 소프트웨어 설계에 적용할 수 있겠다는 걸 깨달았습니다."},"collocations":["human cognition","social cognition"],"related":["cognitive","recognition","cognizant"],"tip":"전공·배경을 설명할 때 쓰는 학술 어휘. 일상 대화에서는 cognitive 가 더 흔함"},{"id":"d01-D14","day":1,"level":2,"set":"D","family":"F1","word":"incognito","pos":"adjective","ipa":"/ˌɪnkɑːɡˈniːtoʊ/","meaning_ko":"시크릿 모드의, 신분을 숨긴","category":"it","etymology":{"parts":[{"text":"in","type":"prefix","gloss":"아니다"},{"text":"cogn","type":"root","gloss":"알다 (gno)"},{"text":"ito","type":"suffix","gloss":"~된 (과거분사)"}],"story":"알려지지 않은(incognitus) → 신분을 숨긴 → 브라우저의 시크릿 모드"},"example":{"q":"How did you debug the login issue?","a":"I reproduced it in incognito mode, which proved the problem was caused by an old cookie.","a_ko":"시크릿 모드에서 재현해 보니, 오래된 쿠키 때문에 생긴 문제라는 게 확인됐습니다."},"collocations":["incognito mode","incognito window","go incognito"],"related":["cognition","recognize","cognizant"],"tip":"이탈리아어를 거쳐 들어온 단어. 크롬의 Incognito = 한국어판 ‘시크릿 모드’"},{"id":"d01-D15","day":1,"level":2,"set":"D","family":"F1","word":"acquaint","pos":"verb","ipa":"/əˈkweɪnt/","meaning_ko":"익히다, 알게 하다","category":"interview","etymology":{"parts":[{"text":"ac","type":"prefix","gloss":"~에 (ad)"},{"text":"quaint","type":"root","gloss":"알다 (cognit)"}],"story":"~을 알게 하다(accognitare) → 잘 알게 되다 → 익숙해지다"},"example":{"q":"How do you get up to speed in a new codebase?","a":"I acquaint myself with the codebase by reading the tests first, because they show how the code is meant to be used.","a_ko":"먼저 테스트 코드를 읽으며 코드베이스를 익힙니다. 테스트가 코드의 사용 의도를 보여 주기 때문입니다."},"collocations":["acquaint myself with","get acquainted with","be acquainted with"],"related":["recognize","cognizant","notice"],"tip":"familiarize myself with 와 같은 뜻의 조금 더 격식 있는 표현"},{"id":"d01-D16","day":1,"level":3,"set":"D","family":"F1","word":"cognizant","pos":"adjective","ipa":"/ˈkɑːɡnɪzənt/","meaning_ko":"인식하고 있는, 잘 알고 있는","category":"interview","etymology":{"parts":[{"text":"cogniz","type":"root","gloss":"알다 (cognoscere)"},{"text":"ant","type":"suffix","gloss":"~하고 있는"}],"story":"알고 있는(고대 프랑스어 conoissant) → 잘 인식하고 있는"},"example":{"q":"How do you balance speed and quality?","a":"I'm always cognizant of technical debt, so when we cut corners to hit a deadline, I log a follow-up ticket right away.","a_ko":"기술 부채를 항상 의식하고 있어서, 마감 때문에 타협할 때는 바로 후속 티켓을 남깁니다."},"collocations":["be cognizant of","fully cognizant"],"related":["recognize","cognitive","cognition","incognito"],"tip":"aware 보다 격식 있는 말. be cognizant of ~ 로 시니어다운 책임감을 표현"},{"id":"d01-D17","day":1,"level":1,"set":"D","family":"F1","word":"ignore","pos":"verb","ipa":"/ɪɡˈnɔːr/","meaning_ko":"무시하다","category":"interview","etymology":{"parts":[{"text":"i","type":"prefix","gloss":"아니다 (in)"},{"text":"gnore","type":"root","gloss":"알다 (gno)"}],"story":"알지 못하다(ignorare) → 모르는 척하다 → 무시하다"},"example":{"q":"How do you react to negative feedback?","a":"I never ignore negative feedback, even when it's hard to hear.","a_ko":"듣기 힘들더라도 부정적인 피드백을 절대 무시하지 않습니다."},"collocations":["ignore warnings","can't ignore","ignore the noise"],"related":["ignorance","recognize","agnostic","diagnose"],"tip":"라틴어에서는 ‘모르다’였다가 영어에서 ‘무시하다’가 된 단어"},{"id":"d01-D18","day":1,"level":2,"set":"D","family":"F1","word":"ignorance","pos":"noun","ipa":"/ˈɪɡnərəns/","meaning_ko":"모름, 무지","category":"interview","etymology":{"parts":[{"text":"i","type":"prefix","gloss":"아니다 (in)"},{"text":"gnor","type":"root","gloss":"알다 (gno)"},{"text":"ance","type":"suffix","gloss":"~함 (명사)"}],"story":"알지 못함(ignorantia) → 무지"},"example":{"q":"What do you do when you don't know the answer?","a":"I'm not afraid to admit ignorance in meetings, because asking early saves the team time later.","a_ko":"회의에서 모른다고 인정하는 걸 두려워하지 않습니다. 일찍 물어보면 나중에 팀의 시간을 아낄 수 있기 때문입니다."},"collocations":["admit ignorance","out of ignorance"],"related":["ignore","agnostic","recognize"],"tip":"‘무식’보다는 ‘(그 내용을) 모름’에 가까운 뜻. admit my ignorance 는 겸손한 표현"},{"id":"d01-D19","day":1,"level":1,"set":"D","family":"F1","word":"diagnose","pos":"verb","ipa":"/ˌdaɪəɡˈnoʊs/","meaning_ko":"진단하다, 원인을 찾다","category":"it","etymology":{"parts":[{"text":"dia","type":"prefix","gloss":"구별하여·꿰뚫어 (그리스어)"},{"text":"gnose","type":"root","gloss":"알다 (gno)"}],"story":"구별해서 알아내다(diagignōskein) → 병을 진단하다 → 문제의 원인을 찾다"},"example":{"q":"How do you handle performance issues?","a":"I diagnose the problem with profiling tools before changing any code.","a_ko":"코드를 고치기 전에 프로파일링 도구로 문제를 진단합니다."},"collocations":["diagnose a problem","diagnose the root cause","hard to diagnose"],"related":["diagnostic","agnostic","recognize"],"tip":"명사 diagnosis(진단)에서 거꾸로 만들어진 동사"},{"id":"d01-D20","day":1,"level":2,"set":"D","family":"F1","word":"diagnostic","pos":"adjective","ipa":"/ˌdaɪəɡˈnɑːstɪk/","meaning_ko":"진단의, 진단용","category":"it","etymology":{"parts":[{"text":"dia","type":"prefix","gloss":"구별하여·꿰뚫어 (그리스어)"},{"text":"gnost","type":"root","gloss":"알다 (gno)"},{"text":"ic","type":"suffix","gloss":"~의"}],"story":"구별해서 아는 → 진단의 → 진단용"},"example":{"q":"How did you make customer support faster?","a":"I added a diagnostic page that shows the app version and network status, so support could solve tickets without asking users.","a_ko":"앱 버전과 네트워크 상태를 보여 주는 진단 페이지를 추가해서, 지원팀이 사용자에게 묻지 않고도 티켓을 해결할 수 있게 했습니다."},"collocations":["diagnostic tool","diagnostic logs","run diagnosti
